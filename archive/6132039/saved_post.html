6821", "parent_comment_id": "comment_li_20844579"}, {"writer": "힛쿠", "text": "@ㅇㅇ(1.231) 객실수 차이땜에 넘쳐봐야 호텔이 더 많을수밖에 없단얘기죠...", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/18YfzIliU8ZCrai94IInxPwPqd_lTrpO-", "date": "09.09 18:27", "comment_id": "reply_li_20846834", "parent_comment_id": "comment_li_20844579"}, {"writer": "숫냥이", "text": "@힛쿠 저게 복점 상황이라 상대가 잘 팔수록 손해인 상황은 맞는데수요가 공급을 초과하면 초과한 수요만큼 다른 곳으로 쏠려서 이익은 보는 그런거죠 뭐뭐 만화에서는 이런 낙수효과 같은 이유가 아니라 다른 계책을 써서 수요를 높였겠지만요", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/18YfzIliU8ZCrai94IInxPwPqd_lTrpO-", "date": "09.09 18:41", "comment_id": "reply_li_20847309", "parent_comment_id": "comment_li_20844579"}, {"writer": "ㅇㅇ", "text": "걍 그러랴니 해라 지금 분위기 좋은데 계속 깨려하네", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1LuTVrudn4QASQzn5XgWMmaDUqnCpkg6N", "date": "09.09 19:47", "comment_id": "reply_li_20849971", "parent_comment_id": "comment_li_20844579"}, {"writer": "ㅇㅇ(61.84) (61.84)", "text": "걍 자본쌈으로 이기려고 한거같은데 객실수가 1년 예약돼있다 그런게 중요한게 아님. 저런 방식은 보통 대출혈 내면서 상대 기업을 철저히 말려죽이려는 방식이기때문에 버틸수만 있다면 호텔이 불리해지는게 맞음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.09 20:32", "comment_id": "reply_li_20852014", "parent_comment_id": "comment_li_20844579"}, {"writer": "ㅇㅇ(61.84) (61.84)", "text": "그리고 저런 치킨게임 방식은 보통 저런 여관같은걸로 하는게 아님. 여관이나 호텔은 각각의 컨셉이 있기때문에 호텔이 꽉차있어도 사실 여관이 꽉차지 않을 이유는 없지. 게다가 저렇게 사치스러운 씀씀이로 운영하는거면 분명 최고급 호텔 수준일텐데 당장에 사람들이 어디 간다고 하면 신라호텔같은데만 가는거 아니잖아. 그냥 가성비 여관같은데도 충분한 수요가 여전히 있고, 특색만 살리는거면 채우는 조건 자체는 문제가 없음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.09 20:33", "comment_id": "reply_li_20852025", "parent_comment_id": "comment_li_20844579"}, {"writer": "힛쿠", "text": "@ㅇㅇ(61.84) 아니 호텔이 객실이 훨씬 많을테니 둘 다 꽉차도 호텔승이잖아요", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/18YfzIliU8ZCrai94IInxPwPqd_lTrpO-", "date": "09.09 20:33", "comment_id": "reply_li_20852042", "parent_comment_id": "comment_li_20844579"}, {"writer": "힛쿠", "text": "@ㅇㅇ(61.84) 이게 승부조건이 뭐엿는지 잘 기억안나는데 순이익싸움이라 손실나서 지는거면 걍 가만있어도 유지만하면 이기는거라 딱히 아닐거같은데", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/18YfzIliU8ZCrai94IInxPwPqd_lTrpO-", "date": "09.09 20:37", "comment_id": "reply_li_20852216", "parent_comment_id": "comment_li_20844579"}, {"writer": "ㅇㅇ(61.84) (61.84)", "text": "@힛쿠 그보다 씹 무슨 상대방이 물건좀 만들고 홍보좀 해서 1달컷내에 바로 효과가 나와서 상대방 적자가 2배로 불어나냐고 생산공장같은데서 물건 썩히느라 적자나는 상황도 아니고 인건비도 1달내면 상관이 없는상황인데", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.09 21:10", "comment_id": "reply_li_20853676", "parent_comment_id": "comment_li_20844579"}, {"writer": "ㅇㅇ(61.84) (61.84)", "text": "@힛쿠 에라이 시팔 그럼 치킨게임으로 끝냈으면 됐잖아 왜 질질 끌어대", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.09 21:10", "comment_id": "reply_li_20853688", "parent_comment_id": "comment_li_20844579"}, {"writer": "추운날엔붕어빵", "text": "@ㅇㅇ(61.84) 저 적자 얘기가 여관 얘기가 아니라 호텔 얘기인듯", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1zxDQkGgf3a-zQnTuz6idVdzwKUPVoSm5", "date": "09.10 05:13", "comment_id": "reply_li_20870392", "parent_comment_id": "comment_li_20844579"}, {"writer": "ㅇㅇ(61.84) (61.84)", "text": "@힛쿠 넌 5억 쓰고 3억 버는새끼랑 1천만원 쓰고 2천만원 버는새끼랑 어디가 더 잘번다고 생각하냐?", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.09 20:41", "comment_id": "reply_li_20852400", "parent_comment_id": "comment_li_20844579"}, {"writer": "ㅇㅇ(61.84) (61.84)", "text": "@힛쿠 결국 돌아오는 조건은 돈을 벌어서 다시 데려오는 조건일테니 문제는 없지. 그리고 장사 대결에서 수익계산을 안따지고 한다는 자체로 하는 논리면 걍 작가가 병신인거", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.09 20:42", "comment_id": "reply_li_20852460", "parent_comment_id": "comment_li_20844579"}, {"writer": "힛쿠", "text": "@ㅇㅇ(61.84) 수익 안따진단게 논리가 아니라 걍 만화가 그렇게 보이는데요 애초에 쟤가 적자 아무리봐도 이기면 된다고하는데", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1GXFa0Ltg_QMtt1DwolC99vo29JqJ1ehA", "date": "09.09 20:48", QnTuz6idVdzwKUPVoSm5", "date": "09.10 09:55", "comment_id": "comment_li_20876194", "parent_comment_id": ""}, {"writer": "만갤러23(121.184) (121.184)", "text": "정답은 콤프에 있었어", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.10 15:53", "comment_id": "comment_li_20888097", "parent_comment_id": ""}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
