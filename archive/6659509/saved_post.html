69999", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "지메", "text": "꼭 두창이어야 했나요...", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.15 01:45", "comment_id": "comment_li_22670063", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "2.1배TQQQ", "text": "에라토스테네스, 기원전 240년.하짓날 정오, 시에네와 알렉산드리아의 태양 그림자가 다르다는 것을 발견.동시대 천문학자인 아리스타르코스가 증명한 태양빛이 지면에 평행하게 들어온다는 가정 하 위도 차이 7.2도 발견.당대 그리스에 있던 삼각 측량으로 두 도시의 거리, 대략 5천 스타디아(약 925 km 추정) 계산 (실제 거리 844 km).아리스토텔레스가 언급했고, 헬레니즘 시대의 명제였던 지구 구형론에 따라 원의 전체 중심각은 360도,두 도시 위도 차이 7.2도를 이용해  '지구 둘레 : 시에네와 알렉산드리아 간의 거리 = 360도 : 7.2도' 비례식 구하고 지구 둘레가 고대 그리스 단위 25만 스타디아(약 46,250 km 추정)라고 계산.실제 지구의 둘레 약 40,009 km", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.15 01:46", "comment_id": "comment_li_22670080", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "2.1배TQQQ", "text": "", "is_reply": true, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b651e2246ee4be8057de98a9d24e0029870c1d84c86f4076347186b097a5f6ffccc9572e4a076a62247453", "comment_img": "", "date": "10.15 01:46", "comment_id": "reply_li_22670088", "parent_comment_id": "comment_li_22670080", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b651e2246ee4be8057de98a9d24e0029870c1d84c86f4076347186b097a5f6ffccc9572e4a076a62247453", "comment_img_source": "", "comment_media_version": 2}, {"writer": "2.1배TQQQ", "text": "교회가 저 때도  지구 평평론을 주장했었으려나", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.15 01:49", "comment_id": "reply_li_22670201", "parent_comment_id": "comment_li_22670080", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "2.1배TQQQ", "text": "꺼라위키에서는  지구 과학이  그 당시 교양이 아니어서   신부들은 모를만 했다고 하네 ㅇㅎ", "is_repl
