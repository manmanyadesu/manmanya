nt_img": "", "date": "10.28 07:13", "comment_id": "comment_li_23273826", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65bed276e948388ea728d4ef46dd6c7538d67bee5f8367c87bfa5912db63952dc7aacacec4ddee81cf9868c0dfc", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "도황 진짜 씹새끼네", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.28 07:18", "comment_id": "comment_li_23273926", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(123.111) (123.111)", "text": "통판회사가 여러군데지만 의외로 같은 회사가 이름만 다를 수가 있지 그런데 입금 펑크난 주소로 재주문이 들어온다? 경찰에 신고해서 수령자 검거 가능하겠지저거 우리나라에서도 있었던 사건 같다", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.28 07:18", "comment_id": "comment_li_23273940", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(123.111) (123.111)", "text": "비밀번호를 몰라도 카드 번호 하나로 거래가 되기 때문에 남의 카드 명세서를 주워서 그 번호로 수천만 원대 물건을 구입하는 사람들이 생기고 있습니다.전주의 고차원 기자입니다.● 기자: 용의자들이 엉터리 회원 가입서를 내도, 또 남의 신용카드 번호를 기입해도 대부분의 인터넷 쇼핑몰은 아무런 확인 절차 없이 그대로 통과시켰습니다.1999년10월 기사", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 07:21", "comment_id": "reply_li_23274014", "parent_comment_id": "comment_li_23273940", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(123.111) (123.111)", "text": "강씨는 다른 사람의 매출전표에서 신용카드 번호와 유효기간을 알아낸 뒤 인터넷 쇼핑몰에서 7차례나 오디오와 신발 등을 샀습니다. 배달처를 재확인하는 택배회사에겐 길거리 등에서 만나자고 해 꼬리를 밟히지 않으려는 치밀함도 보였습니다.⊙ 고 모씨 (인터넷 쇼핑 사기 피의자) :그냥 한번 호기심에 해봤어요, 처음에는. 되나 안되나...2000년 2월", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 07:25", "comment_id": "reply_li_23274082", "parent_comment_id": "comment_li_23273940", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(123.111) (123.111)", "text": "인터넷 구직사이트에서 다른 사람의 주민등록번호 등을 알아낸 뒤 인터넷 경매사이트에 회원으로 가입했습니다. 경매물품은 인터넷 쇼핑몰에서 구했습니다.이때 이용된 것이 쓰레기통에서 주운 신용카드와 명세서입니다.420여 장의 명세표에 적힌 신용카드 번호로 인터넷 쇼핑몰에서 물품을 구입했습니다.비밀번호를 확인하지 않는 쇼핑몰의 허점을 이용2001년 3월", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 07:26", "comment_id": "reply_li_23274113", "parent_comment_id": "comment_li_23273940", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(123.111) (123.111)", "text": "다른 사람의 카드 회원번호를 알아낸 뒤에 신용카드 매출전표를 대량으로 위조한 일당이 또 경찰에 적발됐습니다.신용카드의 매출전표였지만 이것이 가짜 전표를 대량으로 위조하는데 이용됐습니다.이들 일당의 위조수법은 너무나 간단했습니다. 우선 고객번호를 알아내기 위해, 유흥업소에서 받은 카드전표를 구입했습니다. 이걸 위조해 구두상품권과 교환95년", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 07:29", "comment_id": "reply_li_23274148", "parent_comment_id": "comment_li_23273940", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(123.111) (123.111)", "text": "전표사기에서 주문사기로 넘어갔네고액 전화서비스도 그렇고 일본에서 유행하던 사기수법이 넘어오던 시절이지", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 07:31", "comment_id": "reply_li_23274182", "parent_comment_id": "comment_li_23273940", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(175.197) (175.197)", "text": "심슨에서 바트가 쓰던 수법이긴 함  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 08:02", "comment_id": "reply_li_23274686", "parent_comment_id": "comment_li_23273940", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(123.111) (123.111)", "text": "@ㅇㅇ(175.197) 옛날에 카드영수증 함부로 버리지 말라고 하던 이유가 저건데 요즘은 그걸로 아무것도 못 하지", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 08:19", "comment_id": "reply_li_23275098", "parent_comment_id": "comment_li_23273940", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러23(61.105) (61.105)", "text": "@ㅇㅇ(123.111) 이것마저 전라도 전주임? 씨발", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 11:25", "comment_id": "rep
