.161)", "text": "ㅈㄴ 못가르치는거아님? 타이포프급은 고사하고 본편에서 보면 각 나라에서조차 한자리하는놈들이 하나도없는거보면", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.21 08:50", "comment_id": "comment_li_19876419", "parent_comment_id": ""}, {"writer": "만갤러16(182.226) (182.226)", "text": "잘 몰라서 그러는데 왜 그때 당시에 마계편으로 2부 안하고 완결 낸거? 그냥 작가가 연재에 지쳐서 완결후에 지금 다시 돌아온건가?", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.21 09:20", "comment_id": "comment_li_19877170", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "그작 건강상태가 토가시급이라그런가", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1kNbu_mExsB5Szb6hL3_CbuPN_s4DsTwh", "date": "08.21 09:34", "comment_id": "reply_li_19877528", "parent_comment_id": "comment_li_19877170"}, {"writer": "윗타", "text": "그작 건강상태+드퀘 판권 계약 만료", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1kNbu_mExsB5Szb6hL3_CbuPN_s4DsTwh", "date": "08.21 09:45", "comment_id": "reply_li_19877835", "parent_comment_id": "comment_li_19877170"}, {"writer": "도그풋", "text": "", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1gmCx0IRHRaJRWv9GYxYEcBQlNWzWLA4L", "date": "08.21 09:35", "comment_id": "comment_li_19877560", "parent_comment_id": ""}, {"writer": "사이킥교주", "text": "2부 나오면 그 무기수집가 손녀나 다시 보여주면 좋겠다 ㄹㅇ 존나 이뻤는데", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1gmCx0IRHRaJRWv9GYxYEcBQlNWzWLA4L", "date": "08.21 09:37", "comment_id": "comment_li_19877608", "parent_comment_id": ""}, {"writer": "만갤러19(125.143) (125.143)", "text": "2부 시점이면 중년 아줌마 되지, 공주도 1부 시점 아줌마잖아", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.21 09:57", "comment_id": "reply_li_19878105", "parent_comment_id": "comment_li_19877608"}, {"writer": "사이킥교주", "text": "이 그작 중년 아줌마도 이쁘게 잘 그려서 상관없음", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1gmCx0IRHRaJRWv9GYxYEcBQlNWzWLA4L", "date": "08.21 10:23", "comment_id": "reply_li_1987867 "parent_comment_id": ""}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
