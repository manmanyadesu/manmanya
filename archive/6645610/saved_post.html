ent_comment_id": "comment_li_22635498", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.234) (211.234)", "text": "말하는거 보니까 갈구는게 진짜 한놈 못된 놈이고 그래도 나머지는 그럭저럭 잘 대해줘서 그런듯 그래봤자 노답 블랙기업이지만", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.16 05:00", "comment_id": "reply_li_22720041", "parent_comment_id": "comment_li_22635498", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(112.158) (112.158)", "text": "만순이 임플란트좀 시켜줘라", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.14 11:53", "comment_id": "comment_li_22635561", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "만붕이 죽을땐 죽더라도 우리가 장례 치러주자...", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.14 11:53", "comment_id": "comment_li_22635569", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(125.185) (125.185)", "text": "만붕이 왤케 과로사하고 그걸로 여주 각성소재로 쓰일거같냐 진짜 분위기 밝은상허ㅏㅇ인데도 개 스릴러같아서", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.14 11:58", "comment_id": "comment_li_22635763", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(125.185) (125.185)", "text": "작가새끼 진심 만화 ㅈㄴ 잘 그리네 ㅆㅂ;; 이게 진짜 만신이다", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.14 11:59", "comment_id": "reply_li_22635779", "parent_comment_id": "comment_li_22635763", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(1.242) (1.242)", "text": "만붕이를 댓가로 바친다", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.14 12:01", "comment_id": "comment_li_22635844", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(175.223) (175.223)", "text": "과로사 나오겠네", "is_reply": false, "dccon": "", "co
