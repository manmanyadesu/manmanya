3~4천만엔이니깐 제국은 못해도 1천만엔 먹는거고", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.30 13:16", "comment_id": "reply_li_23374564", "parent_comment_id": "comment_li_23373946", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "카야조아", "text": "신입 하이바라한테 살짝 맘놓고 있는표정으로 얘기하는데쿠와타 오니까 바짝 긴장하면서 그대로 긴장끈 놓지않는 표정 리얼하네 ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.30 13:02", "comment_id": "comment_li_23374025", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.234) (211.234)", "text": "ㅇㅇ 존나 긴장하면서 술따르고있음 ㅋㅋ하이바라야 연하고 멀쩡해보이고 친절도 하니", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.30 13:09", "comment_id": "reply_li_23374298", "parent_comment_id": "comment_li_23374025", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "글쓴 만갤러(183.108) (183.108)", "text": "다음화: https://gall.dcinside.com/board/view/?id=comic_new6&no=6870931&page=1", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.30 13:03", "comment_id": "comment_li_23374081", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(123.212) (123.212)", "text": "오오오오오오", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.30 13:12", "comment_id": "reply_li_23374400", "parent_comment_id": "comment_li_23374081", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "C++", "text": "역시 법잘알은 어딜가도 산다", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.30 13:09", "comment_id": "comment_li_23374294", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.47) (118.47)", "text": "크아악 너뮤재밌어", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.30 13:19", "comment_id": "comment_li_23374707", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "신입 술 마시고 긴장 풀리니까 아이디어 나오는거 야무지네 ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.30 13:23", "comment_id": "comment_li_23374867", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(175.126) (175.126)", "text": "근데 저당권/전세권도 아니고 임차권으로 건물을 통으로 쳐먹는게 가능한가? 뭐 임차인으로 들어가서 임차권등기명령 이런걸 해서 다시 임차시키거나 팔아먹기 좆같게 만드는것도 아니고 걍 임차 저당권 하나로 경매까지 가능한가?", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.30 13:30", "comment_id": "comment_li_23375069", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러28(222.113) (222.113)", "text": "단기 임차권인가 전에도 나온 적 있음. 후루이 시장선거 편에서 인가? 거주권이 있으면 저당에도 대응할 수 있게 해주는 권리같은 거라.. 경매는 아니고 일단 버티기용?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.30 13:35", "comment_id": "reply_li_23375266", "parent_comment_id": "comment_li_23375069", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "야구부실눈빡빡이", "text": "거주권=점유권이다. 저당권이 법적으로 위긴 한데 저당권의 목적은 채무불이행시 담보를 환가처분해서 변제에 충당하는거다. 환가하려면 팔아야 하고 팔려면 건물의 명도에 문제가 없어야겠지? 건물 사려고 보는데 임차권 등기된 새끼가 죽치고 있으면 사려고 하겠냐? 이걸 해결하려면 돈 줘서 내보내야됨. 제국은 이걸 노리는거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.30 14:08", "comment_id": "reply_li_23376475", "parent_comment_id": "comment_li_23375069", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(175.126) (175.126)", "text": "@야구부실눈빡빡이 결국 임차권등기명령 받아서 등기치는거랑 비슷한 개념인가보노", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.30 14:15", "comment_id": "reply_li_23376733", "parent_comment_id": "comment_li_23375069", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "야구부실눈빡빡이", "text": "@ㅇㅇ(175.126) 결과적으로 같은데 등기명령은 보증금 안주는 임대인 엿먹이려고 법원에 임차권등기를 받아내는거고 제국은 건물주인 니꾸요꾸하고 합의해서 임차권등기를 하는거. 한국에서도 둘다 가능하다. 확정일자를 보통 받기땜에 임차권등기를 잘 안할뿐", "is_reply": true, "dc
