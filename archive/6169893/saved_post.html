te": "09.12 15:40", "comment_id": "reply_li_20982429", "parent_comment_id": "comment_li_20981403"}, {"writer": "Dwq", "text": "좋아하는 일을 '왜 좋아하나?' 라고 스스로에게 질문하면 도움이 될 듯 근본적인 이유를 찾아서 비슷한 일로 방향을 틀 수도 있으니", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1JQEJCdKjC7L6UT8DCjggoXJDuVqAldhg", "date": "09.12 19:32", "comment_id": "reply_li_20991601", "parent_comment_id": "comment_li_20981403"}, {"writer": "ㅇㅇ", "text": "뭐야 씨발 좆걸레년 캭퉤", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1r-YDlsp7RHlLDabR8S7PszQxg7BmqKrO", "date": "09.12 15:15", "comment_id": "comment_li_20981415", "parent_comment_id": ""}, {"writer": "Figue", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1aTURONfUkz5rlwjdAw5xd3TGzec9HpEI", "comment_img": "https://lh3.googleusercontent.com/d/1JQEJCdKjC7L6UT8DCjggoXJDuVqAldhg", "date": "09.12 15:20", "comment_id": "comment_li_20981602", "parent_comment_id": ""}, {"writer": "ｏｏ(118.37) (118.37)", "text": "건동홍 정도 대학 가서 사무직 하고 살 수 있었는데 순식간에 사회 밑바닥 ㅋㅋ 노재능 예체능은 대체", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.12 15:28", "comment_id": "comment_li_20981976", "parent_comment_id": ""}, {"writer": "ㅇㅇ(121.139) (121.139)", "text": "가만 보면 여자가 성우든 아이돌이든 예체능이나 연예계로 빠지면 열에 아홉은 베개영업 동반이 필수라는 거 암만 쉬쉬해도 암암리에 존나 퍼져있을 텐데, 여전히 그쪽 지망하는 비율은 높다고 하는 것 보면 ㄹㅇ 자기 재능이나 능력이면 그런 거 없이도 성공할 수 있다고 과신하는 머가리 꽃밭인 애들이 많은 건지 아님 일녀들은 아무한테 보지 벌리는 거가 전혀 대수가 아닌 건지ㄷㄷㄷ", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.12 15:31", "comment_id": "comment_li_20982096", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "댓글들 보니 침팬지들이 떠드는것같아서 존나웃김ㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1r-YDlsp7RHlLDabR8S7PszQxg7BmqKrO", "date": "09.12 15:33", "comment_id": "comment_li_20982175", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "침팬지들이 난 꿈을 쫓겠다. 난 과학이 지정한 일을 하기 싫다. 난 뇌과학과 성격분석을 믿지않는다. 유전이 모든걸 결정하는건 사회주의국가의 단점이다.", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1r-YDlsp7RHlLDabR8S7PszQxg7BmqKrO", "date": "09.12 15:35", "comment_id": "reply_li_20982234", "parent_comment_id": "comment_li_20982175"}, {"writer": "ㅇㅇ", "text": "이미 1960년도 부터 인간은 태어날때부터 \"어떤 일\" \"어떤 적성\" \"성격\" \"지능\" \"공부\" \"재능\"  다 정해진다라고 유전학에서 밝혀졌는데 유전을 거스르고 통계를 거슬러서 \"자유와 꿈\" 이라는 문과적 제도를 찬양하는게 대다수의 인간들인데 그들을 비웃는 침팬지들을 보니 존나웃기네 ㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1r-YDlsp7RHlLDabR8S7PszQxg7BmqKrO", "date": "09.12 15:37", "comment_id": "reply_li_20982328", "parent_comment_id": "comment_li_20982175"}, {"writer": "ㅇㅇ", "text": "실패하지 않고 사회에 가치가 있는 직업을 찾을거면 과학사회주의해야지 태어날때부터 죽을때까지 자유민주주의가 아니라 인권 ㅈ까고 게놈지도 만들면 지금도 10년이면만든다", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1r-YDlsp7RHlLDabR8S7PszQxg7BmqKrO", "date": "09.12 15:41", "comment_id": "reply_li_20982460", "parent_comment_id": "comment_li_20982175"}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@ㅇㅇ 윗놈들은 귀엽기라도 하지 이런 우매함의 봉우리에 있는 놈들이 제일 역겹더라", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.12 15:55", "comment_id": "reply_li_20983016", "parent_comment_id": "comment_li_20982175"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(106.101) 역겨우면어쩔건데 생명과학자들도 학회에서는 다 유전유전거리는대 ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1r-YDlsp7RHlLDabR8S7PszQxg7BmqKrO", "date": "09.12 17:26", "comment_id": "reply_li_20986095", "parent_comment_id": "comment_li_20982175"}, {"writer": "ㅇㅇ(180.231) (180.231)", "text": "신기하네 다들 꿈을 꾸라고 하는 비현실적인 얘기를 하는데 꿈이 짓밟히는 만화를 그리다니저 선생 얘기때문에 이야기 흐름이 이렇게 될건 알았지만", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.12 15:37", "comment_id": "comment_li_20982309", "parent_comment_id": ""}, {"writer": "ㅇㅇ(220.80) (220.80)", "text": "ㄱㄱ당했다고 협박해서 더 큰 배역을 따내야지", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.12 15:42", "comment_id": "comment_li_20982473", "parent_comment_id": ""}, {"writer" mments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
