t_img": "https://lh3.googleusercontent.com/d/1llsTxgcADs8c7-Omsrc4on5tImO_3pBu", "date": "09.18 17:11", "comment_id": "reply_li_21286132", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ", "text": "조주빈, 김완득 : ㄹㅇ 우리는 떼법에 당한거임 걍", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1llsTxgcADs8c7-Omsrc4on5tImO_3pBu", "date": "09.18 17:24", "comment_id": "reply_li_21286858", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(180.69) (180.69)", "text": "주빈아 감옥에서도 인터넷이 되냐?", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 17:27", "comment_id": "reply_li_21286971", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(121.151) (121.151)", "text": "어린애들 정신적으로 학대하는 것이 참 잘하는 짓이다 그지?", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 17:28", "comment_id": "reply_li_21287008", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(182.209) (182.209)", "text": "주빈이 이런 생각하면서 살았노...", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 17:31", "comment_id": "reply_li_21287184", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(58.124) (58.124)", "text": "요새 감옥에서도 디시 하게 해주노?", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 17:41", "comment_id": "reply_li_21287719", "parent_comment_id": "comment_li_21285550"}, {"writer": "만갤러31(125.240) (125.240)", "text": "ㅋㅋ 제정신이 아닌새끼네", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 17:48", "comment_id": "reply_li_21288041", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(119.65) (119.65)", "text": "? 그럼 니들은 저게 나쁜 짓이란 걸 인식하고 있으면서도,저 행위랑 본질은 똑같은“익명성을 통한 타인 비방” 을 나한테 행하고 있는 거임?자신이 도덕적으로 우월하단 것을 느끼기 위해자기 눈에 띤 새끼를 타깃으로 잡고,“네가 잘못했으니 정당한 내 행동을 무조건적으로 받아들여라.”만화 속 애비가 한 일이랑 똑같은 거 아님??", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 18:01", "comment_id": "reply_li_21288678", "parent_comment_id": "comment_li_21285550"}, {"writer": "만갤러34(221.139) (221.139)", "text": "얘네도 타인의 감정을 조절할 수 있다 한거일 뿐인데 왜 발끈하는거노요긴가민가한 애들이니 너무 나쁘게 생각 말라노", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 18:05", "comment_id": "reply_li_21288878", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(119.65) (119.65)", "text": "@만갤러34(221.139) 얘가 말해준 것처럼,오히려 니들은 다수가 행위를 심화시키니까더 질이 나쁜 걸 알고 있을 텐데,악이 악이었단 걸 몰랐다는 식으로항상 빠져나가는 걸 볼 때마다 ㅈㄴ 역겨움.오히려 악으로써 인식하고 행한다면 긍지라도 있겠지만,그것도 아닌 니들은그 동안의 행위에 책임도 지기 싫었기에 익명에 몸을 숨긴 거 아님?", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 18:13", "comment_id": "reply_li_21289238", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(119.65) 님도 익명이잖음? 익명끼리 비난 주고받는거랑 한쪽이 신상털려서 협박당하는거랑 본질이 어떻게같음? 거기다 누가 닛ㅇ보고 비난 무조건적으로 받아들이라고 했음? 실제로 반박도 열심히 하고 있잖음?", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 18:20", "comment_id": "reply_li_21289588", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(119.65) (119.65)", "text": "이런 거울 치료할 수 있는 게시글 보일 때마다이 댓글처럼 그물 쳐 놓고 반응 보는데,지능이 딸리는 건지,악행에서 눈을 돌리고 싶은 건지,똑같은 행위를 하면서도 그걸 비방하는 걸 보면 항상 신기할 뿐임.사람 죽여놓고 “몰랐다” 하면 끝이 아니며,니들도 사실은 그걸 알고 있는 만큼항상 한번 더 유념토록 해라.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 18:20", "comment_id": "reply_li_21289614", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(119.65) (119.65)", "text": "@ㅇㅇ(118.235) 절대 다수로서 주는 위압감,그리고 익명으로서 행하는 악이건 심하면 더 심할 뿐이지, 더 나은 행위는 아님.둘 간의 설전을 펼친 사람은 죽음을 생각치도 않지만,정체도 모르는 익명에게 받는 비난은연예인은 기본이고, 때때로 일반인조차 자살로 몰고 감.이런 비방이 똑같이 익명인 나같은 놈한테만 행해진다면 모르지만", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 18:27", "comment_id": "reply_li_21289876", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(119.65) (119.65)", "text": "위에 대댓단 애들이 상대를 가려서,이런 비방성 댓글을 달 거라고 너는 진짜로 그렇게 생각할 수 있음?앞으로는 행하는 행위에 담긴 의미를 알고 행하라는 거임.그럼에도 개의치 않다면 행하면 될 뿐이다.나한테 면죄부를 받을 수 있는 것도 아닌데왜 자꾸 본인들을 변호하려 하는 거임?걍 하던 대로 살라고 ㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 18:32", "comment_id": "reply_li_21290073", "parent_comment_id": "comment_li_21285550"}, {"writer": "만갤러44(175.211) (175.211)", "text": "@ㅇㅇ 주빈이는 시발아 알몸사진 돈받고 팔았어 ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 18:33", "comment_id": "reply_li_21290118", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "길게 댓 쓰는거 좋아하는거 같으니 길게 써주자면, 이 만화의 영포티가 행한 짓은 상대방의 취약점이나 신상을 쥐고 흔드는 일방적인 지배이자 정신적 학대(가해-피해 구조)임. 반면 디시 댓글창에서 벌어지는 논쟁은 상호 익명 상태에서 서로의 의견을 부딪히는 수평적 대화임.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 18:37", "comment_id": "reply_li_21290283", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(119.65) 반면 지금 너 스스로도 댓글로 반박하며 방어권을 행사하고 있듯, 익명 커뮤니티의 비판은 만화 속 피해자처럼 도망치지 못하는 절대적 종속 관계를 만들지 않음. 구조가 전혀 다른 두 행위를 \"익명성을 썼으니 똑같다\"고 뭉뚱그리는 것은 극단적인 궤변임.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 18:38", "comment_id": "reply_li_21290314", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(119.65) 이 댓글은 본인의 논리적 모순이 탄로나자 '관찰자 시점'으로 도망치는 정신 승리에 불과함. 처음에는 범죄 행위를 옹호하는 듯한 뉘앙스로 \"이게 진짜 나쁜 짓인가?\"라며 여론을 간 보다가, 다른 유저들에게 일제히 지탄받자 갑자기 \"너희를 시험해 본 거울 치료였다\"며 스탠스를 바꾸고 있음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 18:41", "comment_id": "reply_li_21290478", "parent_comment_id": "comment_li_21285550"}, {"writer": "만갤러45(180.230) (180.230)", "text": "@ㅇㅇ(119.65) 여기있는 누가 널 비방했노", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 18:41", "comment_id": "reply_li_21290489", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(119.65) 대중이 범죄적 행동이나 반사회적인 주장에 분노하고 도덕적 기준을 요구하는 것은 커뮤니티의 자정 작용임. 이를 \"자신들의 도덕적 우월감을 채우기 위한 타인 비방\"으로 왜곡하는 것은, 자신의 틀린 주장을 인정하기 싫어 상대방의 메신저를 공격하는 전형적인 방어 기제임.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 18:42", "comment_id": "reply_li_21290520", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(119.65) (119.65)", "text": "@ㅇㅇ(118.235) ? 만화 속 피해자들은 다 도망에 성공했으며,애초에 위의 댓글로서내가 말하고자 한 바는 다른 부분이었단 걸 읽어보면 알 텐데??악을 악임을 알고서 행하고,그것에 대한 책임을 질 수 있을 때에만 행하란 거임.만화 속 애비는 자기 얼굴같은 신상을 상대에게 알려줬고,니들이 말하는 조주빈도 형벌로서 책임을 물었음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 18:45", "comment_id": "reply_li_21290715", "parent_comment_id": "comment_li_21285550"}, {"writer": "만갤러25(121.145) (121.145)", "text": "@ㅇㅇ(119.65) 어.. 그게 범죄자의 전형적인 생각임. 남한테 피해 입힌거나는 얼굴 깠으니 당당하다/감옥 간걸로 죄값 다 치렀으니 떳떳하다", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 18:48", "comment_id": "reply_li_21290834", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(119.65) (119.65)", "text": "@ㅇㅇ(118.235) 논점 흐트리기로써현 상황을 벗어나고 싶은 것은 이해가 가지만,그렇다고 위의 행위에 정당성이 부여되는 것은 아님.그럼에도 네가 그런 너의 의사를 피력하고 싶다면,고닉 정도는 파고 오는 걸로 네 행위를 먼저 증명해야지.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 18:52", "comment_id": "reply_li_21290994", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(119.65) (119.65)", "text": "@만갤러25(121.145) 나는 악을 행하는 것이정의라고 하지도 않았을 뿐더러,내 말속엔 오히려 그걸 꺼리며 멀리하라는 의도도 있었을 건데,이해는 한 거임?악을 행하고자 하려면 최소한의 책임이라도 지라고.그리고 네 기준에선 글이 길어지기만 하면 되는 거임?조리있게 쓰지도 못할 거면 흉내라도 내지 마셈.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 18:56", "comment_id": "reply_li_21291210", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(119.65) 조주빈이 처벌받은 건 경찰한테 잡혀서 강제로 당한 거지, 악인의 긍지가 있어서 책임진 게 아님. 신상 까고 책임질 거 아니면 악행하지 말라는데, 정작 본인도 익명 뒤에 숨어서 키보드 두들기는 내로남불의 극치임.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 18:56", "comment_id": "reply_li_21291245", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(119.65) 본질적인 모순을 지적당하니 이를 '논점 흐리기'로 치부하며 회피하려는 듯 보임. 본인이 말한 '악인의 긍지'나 '책임'이라는 논리를 정당화하기 위해 타인에게 '고닉'을 요구하고 있지만, 정작 본인 역시 완전한 익명의 그늘에 숨어 타인을 비방하고 있음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:01", "comment_id": "reply_li_21291404", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(119.65) 자기가 행하는 익명의 비방은 합리적인 '거울 치료'라 포장하고, 타인의 비판은 '역겨운 위선'으로 매도하는 것은 전형적인 내로남불에 불과함. 타인에게 행동의 증명과 책임을 요구하기 전에, 본인이 내세운 기준에 스스로가 부합하는지부터 먼저 돌아보시기를 권함.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:02", "comment_id": "reply_li_21291451", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(119.65) (119.65)", "text": "@ㅇㅇ(118.235) 그러니까 그게 논점을 흐리는 부분이라고.내 댓글이 지금 타인 비방을 위한 글로 보임?따라서, 연역적으로 나는 익명이여도 아무런 문제가 없음.그런데 네가 증명코자 하는 건 내가 틀렸음이며,“내로남불”, “숨어서” 라는 등의 말을 사용해적극적으로 나를 비방하고 있음.그럼으로써 그 행위에 책임을 질 수 있도록 고닉을 언급한 거임.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:04", "comment_id": "reply_li_21291537", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(119.65) (119.65)", "text": "@ㅇㅇ(118.235) 이 사고 흐름이 이해가 안 간다면더더욱 너와의 대화는 의미가 없음.최소한의 논리구조는 성립시키고 오던가,일단 대화 상대는 되고서 오셈.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:06", "comment_id": "reply_li_21291633", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(119.65) 먼저 댓글창을 되짚어보면, 앞서 다른 유저들을 향해 \"지능이 딸리는 건지\", \"역겨움\" 등의 표현을 먼저 사용했음. 본인이 타인을 향해 던진 모욕적 언사는 '거울 치료를 위한 논리 전개'라 정당하고, 그 모순을 지적하는 타인의 대댓글만 '비방'이라 규정하는 것 자체가 지독한 이중잣대임.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:08", "comment_id": "reply_li_21291696", "parent_comment_id": "comment_li_21285550"}, {"writer": "만갤러51(211.234) (211.234)", "text": "@ㅇㅇ(119.65) 나도 자기가 뭔짓한지 모르면서 남 피해주는 애들 싫어하긴 하는데넌 결과가 같다는 답으로 과정이 완전히 다른 루트임에도 뭉뚱그려 뭉개고 있잖아사이버 괴롭힘이 한종류냐의도와 방식과 수단과 목적이 다 다르다 본다", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:08", "comment_id": "reply_li_21291704", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(119.65) 또한 고닉을 파는 것이 어떻게 '비방에 대한 책임'의 증명이 되는지 의문임. 디시의 고정닉 역시 본인의 실명이나 신상이 드러나지 않는 완전한 익명성 기반의 제도일 뿐임. 고닉을 파는 행위로는 그 어떤 법적·사회적 책임도 담보할 수 없음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:09", "comment_id": "reply_li_21291755", "parent_comment_id": "comment_li_21285550"}, {"writer": "만갤러51(211.234) (211.234)", "text": "@ㅇㅇ(119.65) 결과가 우월함과 상하구별인게 같으니 다 같다고?도덕적 평가가 언제 그렇게 정량적이였냐..", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:10", "comment_id": "reply_li_21291759", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(119.65) (119.65)", "text": "@ㅇㅇ(118.235) 설마, 이 다음은“현 세대에 퍼져있는 악플 문화”를 비판했다고 특정 대상을 비난했단 말을 들고오는 건 아니겠지?타인도 납득시킬 수 있는 말을 하려 항상 노력해라.향상심은 너를 성장시킨다.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:10", "comment_id": "reply_li_21291775", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(119.65) 결국 본인의 논리적 오류(내로남불)가 드러나자 '고닉'이라는 무의미한 조건을 걸어 상대방의 메신저를 공격하고 논점을 흐리고 있을 뿐임. 본인의 글이 정말 순수한 논리 전개라면 상대의 닉네임 상태를 탓할 것이 아니라, 본인이 저지른 '언행불일치의 모순'부터 논리적으로 해명하는 것이 맞음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:10", "comment_id": "reply_li_21291784", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(119.65) 최소한의 논리적 해명조차 거부한 채 감정적인 인신공격으로 대화를 회피하는 모습을 보니, 더 이상 논쟁을 이어갈 가치가 없다는 점에는 동의함. 본인이 만든 모순의 굴레에서 부디 좋은 치료 결과가 있기를 바람.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:11", "comment_id": "reply_li_21291841", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(119.65) \"지능이 딸리는 건지\", \"역겨움\"이라는 명백한 감정적 비하 표현을 뱉어놓고, 이제 와서 \"현 세대의 악플 문화를 비판한 공익적 발언\"이라며 셀프 세탁하는 모습이 참 경이로울 따름임. 악플 문화를 비판하기 위해 타인에게 악플 수준의 멸칭을 썼다는 논리 자체가 이미 파탄 나 있음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:12", "comment_id": "reply_li_21291880", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(119.65) 결국 본인이 한 행동은 \"익명성 뒤에 숨은 타인 비방\"의 표본이면서, 남들을 가르치려 드는 내로남불의 극치를 보여주고 있음. 말문이 막힐 때마다 훈계하는 톤으로 본질을 흐리며 정신 승리하는 습관은 본인의 성장에 아무런 도움이 되지 않음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:14", "comment_id": "reply_li_21291918", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(119.65) 타인을 납득시키기 전에 본인의 언행불일치부터 납득시키는 향상심을 갖길 바라며, 스스로 쳐놓은 얕은 그물에 본인이 걸려 넘어진 꼴이니 이쯤에서 거울 치료를 마치겠음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:14", "comment_id": "reply_li_21291934", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(119.65) (119.65)", "text": "@ㅇㅇ(118.235) 와.. 진짜 그렇게 생각함?말 그대로,아이피를 “유동적” 으로 바꿀 수 있는 ”유동닉” 은사후 추정이 쉽지 않고, 법적 처벌도 힘듬.그와 반대로, 고닉은 일단 경찰 조사 등의법적 행위가 실행된다면 바로 특정이 가능함.그런데 담보를 못하니 뭐니는 내가 인신공격을 하길 바라는 거임?", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:14", "comment_id": "reply_li_21291936", "parent_comment_id": "comment_li_21285550"}, {"writer": "만갤러51(211.234) (211.234)", "text": "@ㅇㅇ(119.65) 그리고 구조가 같다고 해서 도덕적 평가는 같아야만 하는게 아니야누구를 향하는가도 문제야 물론 불가지론적으로 들어가서 누구를 향하는게 옳은지 그걸 누가 정하냐 이딴식으로 들어가면 거기서 대화가 ㅈㄴ 길어질탠데 암튼 그런 논리는 결국 자승자박이니 넘기고같은 구조의 폭력이 정상군에 향하냐 비정상군에 향하냐 오용인가 아닌가가 얼마나 중요한데", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:15", "comment_id": "reply_li_21291994", "parent_comment_id": "comment_li_21285550"}, {"writer": "만갤러51(211.234) (211.234)", "text": "@ㅇㅇ(119.65) 도덕적 평가가 그래서 중요한거고 구조가 같으니 동일하단건 그 도덕적 평가를 전부 뭉갠 채 국가를 지키는 폭력과 내전 학살의 폭력을 동일선상에 두는것만큼 문제를 흐리는일임", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:16", "comment_id": "reply_li_21292043", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(119.65) (119.65)", "text": "@ㅇㅇ(118.235) 그리고, 네 말대로면 고닉을 파 오면 되는 문제 아님?아무런 법적 조치도 취할 수 없는데 안 한다고?번거로워서 그렇다는 변명은 기대하지 않음.논리 모순부터 쳐 해결하고 오라고.대화 상대가 안 되는데 계속 쓸데없이 말 걸지 마셈.의미 없는 반복은 좋아하지 않음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:17", "comment_id": "reply_li_21292061", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(119.65) 애초에 고닉을 언급한 이유가 '법적 처벌 등의 책임을 질 수 있는 상태'를 뜻한 것이라면 더더욱 모순임. 본인 역시 현재 언제든 바꿀 수 있는 통신사 IP(통피) 유동닉으로 타인에게 \"지능이 딸린다\", \"역겨움\" 등의 모욕성 발언을 뱉었으면서, 남에게만 고닉을 파서 고소당할 책임을 증명하라는 건 완벽한 내로남불임.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:18", "comment_id": "reply_li_21292103", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(119.65) 본인이 말한 그 '법적 행위의 위험성'을 본인은 유동 뒤에 숨어 회피하고 있는 것이 팩트임.본인이 한 비방은 '악플 문화 비판'이라는 공익적 추론으로 셀프 세탁하고, 타인의 지적은 '인신공격 유도'라며 피해자 코스프레를 하는 태도가 참 안타까움.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:19", "comment_id": "reply_li_21292133", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(119.65) 정작 본인도 유동 뒤에 숨어서 남들에게 \"지능이 딸린다\", \"역겨움\"이라 비방해 놓고, 타인의 비판에만 \"고닉 파서 책임을 증명해라\"라며 가오를 잡는 내로남불은 끝까지 외면하는 모습이 참 안타까울 따름임.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:22", "comment_id": "reply_li_21292290", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(119.65) (119.65)", "text": "@만갤러51(211.234) 그리고 갑자기 튀어나온 네가 하는 말은단순히 뭘 말하고 싶은지 이해가 되지 않음.너는 단순 악플이 국가 방비와 맞먹는다고 생각함?그럴싸하게 궤변을 늘어놓는다고 말이 되는 건 아님.최소한 기본 틀은 잡은 뒤에 글을 작성해 주셈.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:22", "comment_id": "reply_li_21292297", "parent_comment_id": "comment_li_21285550"}, {"writer": "만갤러51(211.234) (211.234)", "text": "@ㅇㅇ(119.65) 분노의 포인트는 알지 겨묻은 애가 똥묻은 애 나무라지 말란거잖아 '깔끔한척 하는 지도 겨묻었고 누군가는 똥묻었을지도 모르는데 남 욕하네?' 이런거잖아 그런데 너가 첫 댓글에 똥묻은 애를 그렇게 나쁜정돈가 ㅋㅋ 거린게 다른 방식으로 비정상을 정상인척 숨기며 겨묻었으면서도 깔끔한 척 정당화하는 애들같다는 생각은 안드냐", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:23", "comment_id": "reply_li_21292322", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(119.65) 본인 말대로 의미 없는 반복은 나도 좋아하지 않으니, 본인이 판 논리적 함정에 갇혀서 평생 그렇게 정신 승리하며 살길 바람. 더 이상 대꾸 안 해줄 테니 혼자 열심히 대댓글 달면서 마지막 자존심 챙기셈.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:23", "comment_id": "reply_li_21292338", "parent_comment_id": "comment_li_21285550"}, {"writer": "만갤러51(211.234) (211.234)", "text": "@ㅇㅇ(119.65) 니 첫댓글이 너의 정당화로 얼마나 논리구조가 바뀌었고 과장되며 자체왜곡하며 방어했길래 국가 방비까지 가냐 임마 ㅋㅋㅋㅋ 웃기다 ㅋㅋㅋㅋ 일단 니 앞에 있는 애는 맞춤법은 자주 틀려도 객관적으로도 주관적으로도 웬만한 애들보다 심하게 많이 배우고 똑똑한 애니까 자꾸 회피하지 말고 ㅋㅋㅋㅋ......", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:26", "comment_id": "reply_li_21292493", "parent_comment_id": "comment_li_21285550"}, {"writer": "만갤러51(211.234) (211.234)", "text": "@ㅇㅇ(119.65) 너가 틀이 흘러내려서 논리가 비대화되었으니까 서로 대화가 안되지 첫 10댓글사이 논지는 댓글폭력과 저놈의 폭력을 구조를 뭉개서 비슷하게 왜곡해놓고 전개했다고  내가 너 속도 못따라잡아서 '국가 방비'의 논리를 이해 못한다고 쳐도 기초가 없는 논리가 언제 저기까지  과장되었냐 ㅋㅋ... 차근차근 볼게", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:29", "comment_id": "reply_li_21292617", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(119.65) (119.65)", "text": "@ㅇㅇ(118.235) 계속 말을 피하는데,타인에 대한 비방을 피하자는 내 말에 반박함으로써네가 얻고자 하는 바가 뭐냐고?나는 전반적 사회 문제에 대한 설명을 했던 것이며,그런 내 말에 대적으로서 말을 걸어온너한텐 논설을 해도 되는 거 아님?나는 최소한의 자기 방어조차 허락받지 못하는 거임?이로 하여금 네가 이루고자 하는 목적이 뭔지 명확히 하라고", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:30", "comment_id": "reply_li_21292697", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(119.65) (119.65)", "text": "@만갤러51(211.234) 국가 방비을 위한 필요악,내전 학살의 상대악에 대해서 네가 말했으니 얘기한 건데,본인이 무슨 말을 하고 있는지는 이해하고 있는 거임?너는 궤도를 벗어나고 있어서 더 이상 말을 안 걸어줬으면 좋겠음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:35", "comment_id": "reply_li_21292903", "parent_comment_id": "comment_li_21285550"}, {"writer": "ㅇㅇ(119.65) (119.65)", "text": "@ㅇㅇ(118.235) 상대를 납득시키지도 못할 뿐더러,애초에 상대를 납득시킬 생각조차 없었으면서부실한 논리만을 펼쳐놓고,“내가 옳지만 네가 못 알아들으니 답답해서 갈거야”의 태도가 정말 옳다고 생각함?반증이 힘들어지니 정신승리를 하는 것 밖에 더 되냐고진짜 맥 풀리네", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 19:40", "comment_id": "reply_li_21293120", "parent_comment_id": "comment_li_21285550"}, {"writer": "만갤러51(211.234) (211.234)", "text": "@ㅇㅇ(119.65) 그니까 임마 폭력이 누굴 향하는지 같은 구조 하에 얼마나 도덕적 평가가 벗어날 수 있는지 무엇이 악이 되는지 선이 되는지 그건 아는데 악과 선이 갈릴 두 사례를 구조만 같다고 뭉뚱그려 동등한 질의 악이라고 묶어버린 채 지금까지 헛소리 ByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
