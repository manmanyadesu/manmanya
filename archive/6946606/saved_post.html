mment_li_23622778", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "하수의극에달한", "text": "처음부터 주인공과 이어질 수 없다고 체념하고 있었고 주인공 앞에서 경험이 없다고 말하기가 부끄러워서 그런 것이고그러고도 주인공의 몸을 빼앗고 싶다는 욕심이 남아있었고", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.05 00:40", "comment_id": "comment_li_23622799", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "하수의극에달한", "text": "왜 몹쓸 여자냐 하면\"난 나쁜 여자야 착한 선배의 남자를 빼앗고 싶어해\"여서고결국 끝까지 미련이 남는 것을 솔직하게 그린 만화라고 할 수 있는데", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.05 00:42", "comment_id": "comment_li_23622860", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "하수의극에달한", "text": "작가는 선배에 이입을 한 것일까 레몬에 이입을 한 것일까.결국 선배가 승리했는데도 왜 레몬에 질투하는 것인가.작가 자신도 모르는 것인지도 모르겠습니다.번역하신 분은 수고하셨습니다.", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.05 00:44", "comment_id": "comment_li_23622933", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.235) (211.235)", "text": "하수극도 실드를 못치노 앵간하다 이만화", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.05 03:25", "comment_id": "reply_li_23627797", "parent_comment_id": "comment_li_23622933", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "하수의극에달한", "text": "@ㅇㅇ(211.235) 그게 그렇게 간단하지가 않습니다.이루지 못하는 사랑은 여자에게 고통이고 여류 작가에게도 고통입니다.작가가 쉽게 해피 엔딩을 내지 못하고 수치심 부끄러움 욕망을 솔직하게 그렸는지도 모릅니다.", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.05 05:45", "comment_id": "reply_li_23630015", "parent_comment_id": "comment_li_23622933", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.159) (221.159)", "text": "쓰레기 만화. 안본 나의 승리~  - dc App", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.05 00:46", "comment_id": "comment_li_23623014", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "하수의극에달한", "text": "그런데같이 커피 마시는 여자아이가 레몬보다 레몬 마음을 더 잘 아는 것 같은데?누가 누구와 이어졌느냐가 중요한 것이 아니라 여자아이의 부끄러움을 서술했다고 해둡시다.", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.05 00:46", "comment_id": "comment_li_23623022", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "중간에 보다가 너무 노잼이라 하차했는데 완결이네", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.05 00:47", "comment_id": "comment_li_23623097", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "하수의극에달한", "text": "이런 건 주인공이 지옥 같은 삼각관계에서도내가 결혼은 못 해주더라도 너를 버리지는 않는다. 네가 네 길을 잘 가는지 지켜보겠다 라고 해주어야 합니다.주인공이 그렇게 해야 주인공인데 작가가 주인공이 왜 그렇게 말하지 않게 했을까? 끝까지 인정하기 싫은가?", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.05 00:48", "comment_id": "comment_li_23623121", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러22(182.226) (182.226)", "text": "진지하게 작가 그림은 진짜 뒤지게 잘그리니깐 럽코 잘쓰는 글작가 한명 구해라. 그러면 ㄹㅇ로 100만부 간다.", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.05 00:52", "comment_id": "comment_li_23623265", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그런데 라이벌이 승리한건 신선하긴 하네", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.05 01:05", "comment_id": "comment_li_23623678", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.185) (211.185)", "text": "ㄹㅇ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.05 02:51", "comment_id": "reply_li_23626963", "parent_comment_id": "comment_li_23623678", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(110.70) (110.70)", "text": "4다리가 이기면 그게 만화냐 ㅅ
