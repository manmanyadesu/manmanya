y_li_22538299", "parent_comment_id": "comment_li_22538276", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러13(58.29) (58.29)", "text": "@ㅇㅇ(121.181) 그럼 스마트도그화를 안하고 개를 개처럼 키웠어야지", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.12 16:16", "comment_id": "reply_li_22541981", "parent_comment_id": "comment_li_22538276", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러16(1.245) (1.245)", "text": "현재 사회에서도 개새끼를 인간과 동일시하는 개맘들 있잖아. 애기 ㅇㅈㄹ하면서 남한테 민폐를 끼친다던지. 약간 그런 걸 꼬집는 만화가 아닐까 싶음. 아직까지 4화 밖에 나오지 않아 작가의 의도를 섣불리 추측하는 게 우습지만...", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.12 17:30", "comment_id": "reply_li_22545128", "parent_comment_id": "comment_li_22538276", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "월간임?  - dc App", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.12 15:02", "comment_id": "comment_li_22538789", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "개미친엉살", "text": "주인이 병신이고 개는 착하고 똑똑한데 주인이 병신이라 개도 뒤틀릴듯", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.12 15:04", "comment_id": "comment_li_22538881", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(119.222) (119.222)", "text": "물올려", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.12 15:06", "comment_id": "comment_li_22538959", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(175.211) (175.211)", "text": "애딸린여자랑 다를게 없는것같네", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.12 15:08", "comment_id": "comment_li_22539026", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "LilSe", "text": "", "is_reply": false, "dccon": "https://dcimg5.dcin
