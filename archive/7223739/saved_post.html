er": "ㅇㅇ(222.9) (222.9)", "text": "연재분 번역한게 아니라, 작가 트위터에 올라온 \"이만큼 그렸습니다!\" 하는 트윗들 번역해온거라서", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:16", "comment_id": "reply_li_24569765", "parent_comment_id": "comment_li_24563891", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "보슨", "text": "매일매일 3~4페이지씩 그린거 자기 트위터에 올리고, 1주일분 완성하면 연재 사이트에 몰아서 올림 에셋을 활용해 덧그리는 작화 특성상 콘티가 따로 없고 콘티이면서 작화다 보니까 가능한 작업속도이긴한데... 그걸 커버하는 작가의 만력이 미쳤음  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:46", "comment_id": "reply_li_24571073", "parent_comment_id": "comment_li_24563891", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "설렌다", "text": "모아두고 봐야겠다", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 10:48", "comment_id": "comment_li_24563945", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.244) (211.244)", "text": "와우에선 보스패턴 완벽하게 수행하면 보스한테 큰 퍼뎀 들어가는 기믹이 있는 경우가 몇번 있었는데 얘도 그런 경우일수도?", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 10:49", "comment_id": "comment_li_24563992", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "건전여우", "text": "쟤가 말하는거보면 딜 자체는 그냥 무난한 수준이고 뭔가 다른요소일듯 피통계산이 지렸다던지", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 10:53", "comment_id": "comment_li_24564110", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러40(61.85) (61.85)", "text": "1", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 11:03", "comment_id": "comment_li_24564481", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.62) (211.62)", "text": "전편 다시 보고 왔다. 3명이서 아이스 스킬써서 스택 +3씩 찍음. 루리코는 마너 회복 넘쳐서 스킬 막써대서 법사  쓰는거와 마찬가지 효율이 나옴. 스택은 풀 진작에 찍었고  보스가 쌍 스킬 쓰기 직전에 힘들어하는거 보고 주인공이 막타 타이밍 알아채림. 보스는 피통 30% 까인 시점에서 싸웠는데", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 11:06", "comment_id": "comment_li_24564567", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.62) (211.62)", "text": "데미지를 별로 못 줬을거라고 얘기하는거 보면 피통에 비례해서 즉사 판정이 있는 모양.", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 11:08", "comment_id": "reply_li_24564601", "parent_comment_id": "comment_li_24564567", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.62) (211.62)", "text": "즉사라기 보단 피통에 비례한 대미지가 완벽하게 들어가서 즉사가 됨.", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 11:11", "comment_id": "reply_li_24564690", "parent_comment_id": "comment_li_24564567", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러41(118.235) (118.235)", "text": "전전화들 링크 합해놓은거 없나", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 11:09", "comment_id": "comment_li_24564619", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(39.125) (39.125)", "text": "https://m.dcinside.com/board/savedragon/15635", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 11:11", "comment_id": "reply_li_24564686", "parent_comment_id": "comment_li_24564619", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러41(118.235) (118.235)", "text": "", "is_reply": true, "dccon": "https://dcimg4.dcinside.co.kr/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658eb247654666db6b6001f0cf3e1f5d066bd52737eccb41c4ecf584f8d85ae2e0054ac182abf36aee0d0c18553", "comment_img": "", "date": "11.24 11:12", "comment_id": "reply_li_24564703", "parent_comment_id": "comment_li_24564619", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658eb247654666db6b6001f0cf3e1f5d066bd52737eccb41c4ecf584f8d85ae2e0054ac182abf36aee0d0c18553", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(39.125) (39.125)", "text": "댓글 존나많아 뭐야", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 11:11", "comment_id": "comment_li_24564668", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러42(39.119) (39.119)", "text": "쪼렙인데 불구하고 상위권의 궁극기랑 비슷한 수준의 위력이면 존나 쏀거 아님?", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 11:11", "comment_id": "comment_li_24564674", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "훟훟훟", "text": "", "is_reply": false, "dccon": "https://dcimg4.dcinside.co.kr/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65eef236e79e267a4aa29134971b0e06c027ee108b17e762e865531d68e118ec0df2e0ef22171f63d7b2058f13c0f049049fe623ca984a62da7b7cf947709ada8", "comment_img": "", "date": "11.24 11:16", "comment_id": "comment_li_24564826", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65eef236e79e267a4aa29134971b0e06c027ee108b17e762e865531d68e118ec0df2e0ef22171f63d7b2058f13c0f049049fe623ca984a62da7b7cf947709ada8", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러43(110.8) (110.8)", "text": "정주행하고오니까 버섯왕 소원은 연회를여는거고 벌은 중간에 미샤가 유인할때 여왕인생 시궁창이라고 니트가 말하는거보면 소원은 죽어서 여왕직책에서 해방되는거같음둘다잡아서 소원 이뤄준거고 그리드는 꼽사리 ㅗ", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 11:17", "comment_id": "comment_li_24564881", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.149) (221.149)", "text": "이게 맞지ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 11:19", "comment_id": "reply_li_24564959", "parent_comment_id": "comment_li_24564881", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "보슨", "text": "하나만 들어주겠다더니 포기안한 사람? 소원은 다 들어준 셈이네 ㅋㅋㅋㅋ  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:50", "comment_id": "reply_li_24571225", "parent_comment_id": "comment_li_24564881", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.162) (221.162)", "text": "모죠가 모르는 요소가 많음1. 버섯 보스 자체여왕벌은 굴 어딘가 있다 카더라 정도는 알았지만 버섯 보스는 존재 자체를 몰랐음보자마자 목숨 1스택 날렸고 당연히 상세 스펙, 약점 등 모름여왕벌과 싸운건 알지만 피가 30%인건 정확히 모를테고얼음약점 같은게 있을수도2. 코퀴토스 딜 계산실전에서 보통 안쓰는 기술이라 더욱 그럴 것니트 본인의 마나만 생각하는걸 보면 파티원으로 얼음 스택 상승하는거 자체를 모를수도3. 궁수가 마나회복 잘함니트도 예상 못한건데 제일 레벨 높은 궁수가 집중력 있는채로 마나회복 잘해서 딜과 스택이 많이 누적됬을 듯 니트의 마나회복은 오더 중이다보니 집중해야해서 모죠 예상범위 이내일것 같음 적어도 페이크 모션 이후부턴", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 11:23", "comment_id": "comment_li_24565100", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.162) (221.162)", "text": "아예 하나의 직업 계열취급이 될 정도로 유명한 기술인 아수라 뭐시기도 딜 계산식이 니트와 전혀 다른 방식인거 생각하면, 모죠의 예상딜량과 니트가 한계로 뽑아낸 딜량은 전혀 다를 듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 11:27", "comment_id": "reply_li_24565224", "parent_comment_id": "comment_li_24565100", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "보슨", "text": "아수라 패왕권 딜 데미지 계산식이 니트가 더 정확한거 보면 모죠가 생각하는 코퀴토스 예상 데미지는 실제보다 약할 가능성이 높음 혼자 쓰는걸 가정하는거 보면 파티원들이 같이 빙결 스택을 쌓아줄 수 있는걸 모를수도 있고 또, 주인공이 항상 마나를 풀차지 상태에 가깝게 유지할 수 있다는걸 모르는것도 있음 궁수 루리코가 능력치보다 더 퍼포먼스가 좋았던것고 있고  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:54", "comment_id": "reply_li_24571396", "parent_comment_id": "comment_li_24565100", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(114.201) (114.201)", "text": "특정조건 달성시 전투승리 패턴이 있나본데? 데미지와는 상관없고 보니까 앞에 춤추는듯한 동작이나 패턴들 생각해보니까 이번 버섯돌이의 축제?라고 했던거 같은데다가 저 대왕버섯이 북을 두드리는것도 축제에 흥을 돋구는 그런걸 생각한거 같은데 축제때 대왕버섯의 기분같은게 좋아지면 승리한다\u003c이거 아냐?", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 11:26", "comment_id": "comment_li_24565198", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(114.201) (114.201)", "text": "토리코에서 원왕 밤비나가 이런거 있지 않았나?", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 11:27", "comment_id": "reply_li_24565237", "parent_comment_id": "comment_li_24565198", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.162) (221.162)", "text": "코퀴토스가 그 조건이면너 지금 버섯대왕이 냉찜질이 필요했다는거냐", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 11:29", "comment_id": "reply_li_24565306", "parent_comment_id": "comment_li_24565198", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(114.201) (114.201)", "text": "@ㅇㅇ(221.162) 걔 코퀴토스 맞았는데 뭔가 있어보이는 웃음 짓고는 뭐 아무것도 없이 퇴갤했는데. 그 웃음이 알고보니 재밌게 잘 놀았다! 이런 웃음 아니었을까? 만화에서 그게 그런 뜻이었어!? 같은 전개 있잖아.", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 11:31", "comment_id": "reply_li_24565387", "parent_comment_id": "comment_li_24565198", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.114) (211.114)", "text": "@ㅇㅇ(114.201) 걔는 전투인 줄 알았는데 사실 같이 춤추는 거 였잖아 4천왕이 아무리 강해도 당시엔 팔왕에게 의미있는 공격을 주는 게 불가능햇음 그리고 마지막에 밤비나가 물어뜯는 줄 알앗는데 알고보니 춤 마지막 동작이 키스여서 그런 거였고 토리코가 내가 먹히기 전에 먼저 조금이라도 먹어주마란 심정으로 입을 물었는데 그걸로 조건 달성되어서 페어를 얻엇지", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 12:50", "comment_id": "reply_li_24568531", "parent_comment_id": "comment_li_24565198", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(182.227) (182.227)", "text": "번역을 해주는건 고맙다만 제발 이전화 링크좀 넣어줬으면 한다네!", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 11:26", "comment_id": "comment_li_24565218", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "VTI", "text": "", "is_reply": false, "dccon": "https://dcimg4.dcinside.co.kr/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65fe8266eadc328cfdea5b74810026b505984e8556190608b0d4d06195f505e33f50805e7c3f99bd8a0ee5b3e4c39c04283bd3f86fe2460483e3331", "comment_img": "", "date": "11.24 11:33", "comment_id": "comment_li_24565488", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65fe8266eadc328cfdea5b74810026b505984e8556190608b0d4d06195f505e33f50805e7c3f99bd8a0ee5b3e4c39c04283bd3f86fe2460483e3331", "comment_img_source": "", "comment_media_version": 2}, {"writer": "VTI", "text": "아처가 좀 강했다는 서술이 나오긴 했으니까..", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 11:42", "comment_id": "reply_li_24565825", "parent_comment_id": "comment_li_24565488", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.62) (211.62)", "text": "저세계관에서는 스택 맥스 찍은 적이 없을 거임.  뎀이 약한 아이스 스킬로 스택 존나게 쌓아서 고작 대상  하나에 걸음. 움직이는 대상이면 스택 다 풀려서 아무 소용이 없음. 적보스에 즉사 스킬 피하고 잡몹도 상대하면서 아이스 스킬을 3명이서 난사해서 스택만 좋나 쌓음.", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 11:45", "comment_id": "comment_li_24565925", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "라그모티브가 맞나보다 ㅋㅋ 보스밸런스도 비슷하고벌보스는 딱봐도 개미던전 유저랩 30대에서 사냥하던곳인데 보스는 만랩이 솔플로도 못잡을 정도로쌔고 그렇다고 뉴비도 못잡는건 아닌게 오베때 인해전술로 막잡고 그랬네 저번에 스탯창도 라그랑 동일해서 agi로 피하는게 세계관이고 쥔공은 패턴아니까그런거 없이 피하고 아마 정황상 보스피 한1~3퍼 정도 달게하는 스킬인거 같은데   - dc App", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 11:54", "comment_id": "comment_li_24566229", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그리고 즉사는 아닐거임 라그에서 즉사 없고 코마라고 피1만드는 스킬들은 있는데 이건 보스는 안통하는거라 and 퍼뎀도 마찬가지고 아수라패왕권\u003c\u003c애기하는거 보면  그거에 준하는 스킬이긴한듯 저게딱 2차 부직업 나온 직후 밸런스라고 치면 아수라패왕권이 진짜 존나 쌔고 맛있는 스킬임 육성난이도 자체가 누가 보조안해주면 못키울정도로  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 11:56", "comment_id": "reply_li_24566343", "parent_comment_id": "comment_li_24566229", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ 저 안경은 연계몽크긴한데 아수라 재미로 몇개 찍은듯몽크는 스포가 남고 스탯이 더 중요한개념이라  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 11:57", "comment_id": "reply_li_24566415", "parent_comment_id": "comment_li_24566229", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그냥 주인공 마나재생이 비상식적인거 몰라서 스택 그렇게 못쌓았다고 생각하는거아닐까 거기에 실전용 아니라고 말한거보면 실전데이터도 부족하고", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 11:59", "comment_id": "comment_li_24566476", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "보슨", "text": "심지어 주인공조차 보스몹 정도 아니면 조건 맞추기 어렵다고 안쓰던 스킬이니까  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:56", "comment_id": "reply_li_24571477", "parent_comment_id": "comment_li_24566476", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러46(221.154) (221.154)", "text": "주인공 마나회복 속도 고려안하고 남은마나 생각하고 계산해서 저런게 맞는거같다. 실제로는 마나통 몇번 비울분량 스텍인데...", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 12:06", "comment_id": "comment_li_24566727", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "Ffly", "text": "그럼 너무 딜이 ㅈ 사기 아님? 풀스택이면 20레벨 풀마나가 보스 피 한번에 20% 이상 깎는다는건데. 이 정도면 보스팟은 얼법 필수 수준인데", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 12:36", "comment_id": "reply_li_24567935", "parent_comment_id": "comment_li_24566727", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "만붕이들 진지하게 토론하는거 귀엽네 ㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 12:28", "comment_id": "comment_li_24567689", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "뒤에는 니가 그려와", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 12:47", "comment_id": "comment_li_24568365", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(147.47) (147.47)", "text": "애초에 보스 기믹이 체력써서 스킬쓰는거라 버티기만 하면 자체기믹으로 피까이는건가봄. 그러면 코퀴토스가 별 타격은 아니란 말이 성립하지. 실제로 벌팟에서 고렙 셋이서 3중 디버프 걸어가면서 존나 줘팼는데도 모죠 궁으로 막타 못쳤음. 근데 쪼렙 셋이서 광역 패턴피하고 쫄잡아가면서 본체딜을 그만큼? 말도 안됨126 다시 보니 얼음스택 다차고도 패턴피하다 이중캐스팅보고 코퀴토스 쓰던데 이중캐스팅이 발악패턴이고 트리거 체력이 코퀴토스딜로 잡혀서 패턴스킵한듯. 보스 정보랑 코퀴토스 맥딜 비교 불가능하면 생각조차 불가능한 방식인거고", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 13:01", "comment_id": "comment_li_24569129", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "이게 맞는거같긴 한데, 그렇다 쳐도 남는 의문점이코퀴토스란 스킬은 고작 28렙에도 찍을 수 있는 저레벨 스킬인데,아무리 맥뎀 조건이 복잡하다고 쳐도 꼴랑 20레벨대에 배우는 스킬이 7~80레벨대 파티가 잡아야 하는 보스의 발악패턴을 바로 스킵할 수 있는 데미지가 나올 수 있냐는 점이 남긴 함", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:44", "comment_id": "reply_li_24570929", "parent_comment_id": "comment_li_24569129", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "짱룡닛치", "text": "", "is_reply": false, "dccon": "https://dcimg4.dcinside.co.kr/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b651e9226e1daa929d659aaa73d029f084f72d46c5936d6821b1aa39e73f1ac3d876d2629f0f3a6901be45e8ce72e33b3b17bf5bdddd90a63ad48ec1785cc9", "comment_img": "", "date": "11.24 13:03", "comment_id": "comment_li_24569178", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b651e9226e1daa929d659aaa73d029f084f72d46c5936d6 i_24561454", "parent_comment_id": "comment_li_24560128", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "라그로 따지면 특정 직업이 스킬 하나로 보스 공략하던 시기가 없던건 아님하나 생각나는게 보스몹이 막 추가된 시절엔 다양한 고유 스킬이 있던 것도 아니였고 피통많은 깡스펙 괴물일뿐이었는데그 중 오크히어로라는 보스는 해당 시점에서 바탈 몰빵 탱도 버틸 수 없는 깡딜로 유저를 녹여버리던 타입이었고초창기 온라인이 그랬듯 길드단위로 몰려다니며 물량빨로 보스토벌이 진행됐었음근데 사람들이 오크히어로의 공격이 그냥 존나 쏀 물리대미지 일뿐이라는 것에 착안해서나이트의 스킬 중 오토카운터라는 스킬이 물리 대미지를 1회 무시한다는 점이 적용되나 확인해봤는데 이게 됨그래서 보스강화패치전까지 오크히어로는 막 전직한 56~57레벨 나이트가 마나물약만 빨며 혼자 잡을 수 있는 개호구 보스가 되버린 적이 있음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 09:32", "comment_id": "reply_li_24561475", "parent_comment_id": "comment_li_24560128", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ 에넬좆바른루피같구나", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 09:33", "comment_id": "reply_li_24561499", "parent_comment_id": "comment_li_24560128", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(61.82) (61.82)", "text": "@ㅇㅇ 그냥 라그자체가 렙찍딜찍템찍겜이라서 걍 요즘mmo똥피하기지리게했다 정도지뭐", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 09:34", "comment_id": "reply_li_24561508", "parent_comment_id": "comment_li_24560128", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "리뉴얼 이전 근본 기준 30레벨대는 1차 전직하고 중요 패시브 찍다보면 주력 액티브 스킬도 제대로 찍지도 못한 상태임... 라그는 레벨이 두가지인데 그냥 베이스레벨이랑, 직업레벨(잡레벨) 이렇게있음. 1차기준 잡레벨이 40이상이면 2차전직이 가능함. 30레벨대는 잡레벨 한 10~20 상태임. 리뉴얼 이전의 라그가 옛날 mmo답게 아무리 개똥망 노가다겜이어도 만갤에서 만화 보면서 설렁설렁해도 하루만에 하고도 한참 남음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 09:51", "comment_id": "reply_li_24562014", "parent_comment_id": "comment_li_24560128", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러33(118.235) (118.235)", "text": "@ㅇㅇ 잡레벨 한 20정도 되면 그래도 파월 파볼트 어느정도 찍혀서 사냥정도는 가뿐하지않나  - dc App", "is_reply": true, "dccon": "", "comment 11.24 10:35", "comment_id": "reply_li_24563497", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러14(125.189) (125.189)", "text": "@ㅇㅇ(119.207) 그렇게 무한이라고 생각될만큼 많은데 고작3명이서 단시간내에 채울리가그리고 모죠가 헛똑똑이 포지션으로 많이나오긴 해도 작중 내 릴잘알임 ㅋㅋㅋ 마나통이면 몰라도 스택 자체는 그닥 상관없을거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 10:35", "comment_id": "reply_li_24563507", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ 정리해서 스택 맥스시 처형기라는 전제로 말하자면1. 주민들이 몰랐던 이유2. 게임상 밸런스두가지가 관건인데", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 10:47", "comment_id": "reply_li_24563895", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@만갤러14(125.189) 1번은 전투에 거의 안쓰인다고함 + 전제조건(다른영역못씀+긴전투시간필요) + 스택맥스 유무도 안알려짐 때문에 주민들은 머를만하고2번이 문젠데 고스펙유저는 스택 쌓을시간에 패죽이는게 빠름 + 저스펙유저는 이번에 여왕벌 딜정도 누가 까주는거 아니면 처형 체력조건 못맞춤이정도가 예상되는데 뭐 작가맘이지 애초에 처형이 아닐수도잇고", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 10:47", "comment_id": "reply_li_24563913", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러14(125.189) (125.189)", "text": "@ㅇㅇ 나도 2번쪽 그렇게 예상하긴 하는데궁금하긴하네 어캐될지 ㅋㅋㅋ 빨리다음화 보고싶네", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 10:49", "comment_id": "reply_li_24563956", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@만갤러14(125.189) 아니면 처형시 템+경치 안들어온다로 그냥 꼬아버릴수도있음ㅋㅋ 제일 편한전개지", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 10:51", "comment_id": "reply_li_24564037", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ 사실 처형이라는 개념을 못넣을건 없지. 이미 총으로 스펙,장비 상관없이 원킬 다낼수 있다는걸 공식으로 직접 적었는데. 판타즈마 릴리 게임의 껍데기를 가져왔을뿐 우리가 반드시 게임에서 생각해야할 개념이 당연시하게 들어가있을필욘 없다고 봄", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 11:13", "comment_id": "reply_li_24564732", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(221.154) 게임 시스템은 싹 다 적용된다는게 전제긴해ㅇㅇ 니트가 몰랐던 노예계약도 게임시스템인 악마의 저주 활용해서 하던거라는 시점에서 게임의 기본시스템은 100퍼 적용된다고 봐야됨 버섯보스가 패턴 훼이크쓰는건 정해진 말만 하던 npc들이 살아숨쉬는거랑 같은 수준의 변화일 뿐이고ㅇㅇ 실제로 해봣자 훼이크지 없던 패턴을 쓰진 않았으니까 시스템에는 철저히 따르는거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 11:16", "comment_id": "reply_li_24564838", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ 난 쉽게 생각하면 프리섭이라고 생각함. 게임 자체를 따온거니 시스템 자체는 비슷해도  본섭과 디테일이 다른것처럼, 지금의 니트가 있는 세계관은 릴리가 그냥 가져온 프리섭같은 개념이니 총같이 이상한사례도 나옴에도 어느정도 시스템을 따르는, 말한대로 껍데기만 가져왔단 느낌같은거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 11:24", "comment_id": "reply_li_24565161", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ(221.154) 마침 라그나로크 하면 가장 유명한것중 하나가 프리섭이니 게임을 멋대로 주무르는 릴리와 프리섭 운영자를 대응 매치했을수도 있단거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 11:26", "comment_id": "reply_li_24565197", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(221.154) 총도 게임설정중 하나인거지 실제로 게임에서도 총기류 사용은 뷸가능했고 그걸 릴리 변덕이라는 설정으로 풀어낸거고... 니트 겜지식이랑 다른점은 절대 없을거란거임 있으면 진행이 안돼", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 11:28", "comment_id": "reply_li_24565275", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ 말했듯이 기본적인 개념은 본 겜과 크게 동떨어지진 않았을거라고 생각함. 하지만 이미 5중 페이크같은 개념으로 일반적인 시스템과 다른 변수는 나왔음. 그건 온라인겜에서 일반적인 \"npc\"의 개념에서는 나올수 없는 일이라고 봄. 그럼 반대로 여기서 더 다르게, 더 기괴하게 바뀔수 있을 가능성도 충분히 있다는거지. 릴리는 이미 시스템상 못살린다는것도 살리는 운영자의 개념이니까", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 11:32", "comment_id": "reply_li_24565428", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ 뭐 그리고 사실 이미 버섯 패턴 사례도 나왔지만 모든걸 알고있는 주인공이 사건사고중 다른 변수같은걸 겪으면서 스토리 꺾는 사례는 지겨울정도의 클리셰잖음. 꼭 완벽하게 100% 맞게할필요도 없긴 하지", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 11:36", "comment_id": "reply_li_24565617", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(221.154) 보스 패턴 페이크는 말했듯이 게임 npc들이 이세계에서는 사람처럼 말하고 움직이는거랑 같은정도의 용인되는 변화이고 시스템에 거스르는 변화는 아님 같은 전조에 다른 패턴 쓴다던가 이런게 나왔으면 몰라도ㅇㅇ 그리고 릴리가 살려준다는건 씹구라일 가능성 ㅈㄴ높다고생각함 설령 진짜 살린다쳐도 기존에 있던 유저 리스폰 시스템 활용한다던가 할거고", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 11:38", "comment_id": "reply_li_24565698", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(221.154) 모니터 너머가아니라 살아숨쉬는 세계라 게임에 완전히 1대1 대응은 안되지만 니트가 아는 시스템 자체에는 전부 종속되어있을거라는게 전제라는거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 11:40", "comment_id": "reply_li_24565742", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ 뭐 구라일수도 있고 아닐수도 있지만,적어도 이미 스텟 여는거부터 파티 창 바꾸는거까지 기본적인 시스템을 마을 릴리에 가서 할수있다는거부터 이미 시스템은 많이 달라졌음. 겜 자체의 근간은 릴리에 의해 이미 달라진 상황이란거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 11:44", "comment_id": "reply_li_24565910", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(221.154) 릴리의집도 시스템(상태창 스탯 파티 등의 세부설정) 그 자체가 달라졌다기보단 유저들이 딸깍으로 쓰던 설정을 이세계 주민들 입장에서 풀어놓기 위한 겉장치에 불과하다고 생각하지만", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 11:52", "comment_id": "reply_li_24566159", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ 그런기준이면 뭐든간에 이세계에서 온걸 맞추기 위한 수단이라고 하면 다 되는거잖음. 필요한거만 게임기준이고 다른건 이세계 교정 기준이면 걍 입맛대로 말맞추는거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 11:56", "comment_id": "reply_li_24566359", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ 설정상 이벤트 기간을 바꾼것도 걍 이세계 기준이니까 바꿨다고 하면 돼고, 즉사같은 개념도 그럼 게임이 아닌 이세계니까 시스템이 좀 달라졌다고 말할수 있다는거임. 총 못쓰는것도 게임에서는 가능한데 이세계에서는 아무튼 세서 바꿨다 하면 돼는거고 걍 필요할때만 말맞출수있는 이야기잖음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 11:59", "comment_id": "reply_li_24566482", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(221.154) 뭐든지가아니라 겉모습(npc행동 보스페이크 릴리의집 등)은 게임이 아닌 실제 세계스럽게 변화가 있는거고 시스템(수치 효과 이벤트 등)은 게임 설정이랑 정확히 일치한다는거지ㅇㅇ 특히 즉사설정이 달라졌다는건 절대 있을수없는게 게임설정쪽의 영역이고 니트도 즉사기인거 다알고썼을거라는거라ㅇㅇ 총은 게임에서 쓸수있었다는말 전혀없었고", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 12:25", "comment_id": "reply_li_24567548", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ 내가 말하고싶은건 이세계인 만큼 형편좋게 일괄적으로 바꿀수 있단 소리임. 니 말대로 릴리의 집이 이세계의 형편에 맞게 변화를 줄수가 있고, 이벤트 시기나 패턴 역시 이세계에 맞게 유기적으로 변화를 줄수가 있다면 즉사같은 게임 자체의 시스템이 반드시 고정돼있을 필욘 없단거지. 이미 뭐든 달라질수 있는 사례를 만들어 준만큼, 시스템 역시 달라질수 있다는 특별히 이상하지도 않은 클리셰기도 하고 난 그 이세계를 언제든지 입맛대로 바꿀수 있단걸 꼭 프리섭으로 이야기 한거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 12:30", "comment_id": "reply_li_24567747", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ 그래서 난 반드시 즉사가 있어야한다 없어야한다 이런게 아닌, 즉사가 있어도 충분히 당위성은 있다 정도로 이야기 하는게 그런 이유임. 물론 없으면 없을 이유가, 있으면 있을 이유가 각각 나올수 있고 게임안 세계로 들어가는 작품들 대다수가 그런방식에서는 크게 벗어나질 않으니까. 근데 굳이 이만화에서 100%로 게임의 특징을 고집할 필욘 없단거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 12:34", "comment_id": "reply_li_24567893", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(221.154) 근데 스토리자체가 니트의 게임 시스템 지식 기반으로 굴러가는데 겉보기(엘프 노예계약)가 달라진걸 게임 지식(악마저주 정화)으로 해석해서 풀었듯이 앞으로도 그럴거고 시스템설정 자체가 달라지면 게임세계라는게 아예 의미없어지고 그냥 이세계판타지가 되어버리는데 그게맞나싶다", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 12:37", "comment_id": "reply_li_24567969", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(221.154) 그리고 즉사면 무조건 니트가 즉사기인거 알고썼을텐데... 게임에서 즉사기가 아닌데 굳이 빌드업해가면서 썼다는게 말이안됨", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 12:38", "comment_id": "reply_li_24568000", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ 즉사라는건 계속 이야기가 나왔으니 한 갈래에서 이야기한거고 내가 말하고 싶은건 어떤 시스템이든 안될법한 시스템이 될수도 있는건 충분히 가능성이 있다 는말임. 꼼수든 버그든 진짜 됐든 이용했으면 어짜피 릴리라는 존재가 있는한 바로 교정이 돼니까 말임", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 12:44", "comment_id": "reply_li_24568235", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ 난 순수하게 게임의 지식을 이용한 전개를 하고싶었으면 릴리라는 존재가 모습을 드러내는 자체를 하지 말았어야했다고 생각함. 일단 현재 기준으로 보면 뭐든 바꿀수 있는 존재니까.", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 12:46", "comment_id": "reply_li_24568307", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ(221.154) 딱 릴리의 집에서 지켜보는 그정도까지였으면 나도 순수하게 게임 관련 기준으로 생각했을거임. 하지만 릴리가 지금 버섯 보스까지 필드밖으로 꺼내는등 대놓고 관여를 하고 있잖음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 12:48", "comment_id": "reply_li_24568413", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(221.154) 뭐 그런 릴리가 만드는 변수는 앞으로도 얼마든 있겠지만 (무턱대로 게임설정대로만 흘러가서 니트가 아는 이벤트만 나오면 또 루즈해지니까) 게임에서 즉사기가 아니던게 이세계에서 즉사기가된다던가 하는 시스템 설정상의 변화는 절대 없을거라는거지ㅇㅇ... 이번에 즉사기였으면 게임에서도 즉사기였을테니까 그밸런스를 어케잡을지 궁금했던거고", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 12:56", "comment_id": "reply_li_24568842", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ 위에서도 말했지만 꼭 즉사란것만 생각한다기보단 원래 안될게 돼는 버그나, 아니면 빙결 시스템 자체의 꼼수등 다양한 방식대로 이야기를 만들수 있음. 안돼야할게 됄수도 있다는 그런 맥락으로 말한거. 뭐 예를들어 빙결 파쇄시스템이 원래는 보스는 완전히 얼지 않아 할수가 없는데 이보스 기준 랜덤한 확률로완전히 얼수 있다보니 파쇄 효과로 즉사를 낸다던가 하는가 하는.", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 12:59", "comment_id": "reply_li_24569019", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ(221.154) 대충 이런 맥락이면 저번 화에서 어는 과정을 굉장히 강조한것, 버섯 보스가 죽으면서 깨지는것에 대한 이유를 만들어낼수 있겠지", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:01", "comment_id": "reply_li_24569098", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(221.154) 아무튼 그런 시스템이 있다쳐도 원본 게임시스템에도 무조건 있었을거라는거고 애초에 니트가 코퀴토스 쓰면서 동시에 승리선언했는데 그런 생각못한변수로 처치했다는건 앞뒤가 안맞음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:03", "comment_id": "reply_li_24569187", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ 꼭 그렇지만은 않은게, 라그에서는 실제로 상태이상 관련된 버그가 몇번 나왔었음. 디버프 순서때문에 걸리질 말아야하는게 걸렸던적도 있고, 타격시 나오는 효과도 걸렸을수도 있고, 아예 내성을 실수로 안넣은적도 있고, 저 보스가 준보스인지 판정도 달라짐", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:11", "comment_id": "reply_li_24569554", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(221.154) 결국 그 버그도 니트가 알고있었어야 승리선언 할수있는거라... 저 보스한테만 통하는 버그 \u003c 있을 수 있는데 그거조차 니트 게임지식 내의 버그라는게 내 생각임", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:14", "comment_id": "reply_li_24569658", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ 승리선언을 왜이리 강조하는건진 모르겠는데 그 이후에 발동후 끝난거면 어는걸 몇컷 할애해서 강조할 필요가 없음. 안심하고 난 이후는 완전히 얼어버린 후지.", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:17", "comment_id": "reply_li_24569863", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ 즉 그 시기때는 딱 컷할수있는 방식의 필요조건을 어떤방식으로든 만족했다고 보면 됨. 그게 맞느냐 아니냐는 확실치 않은영역이었던거겠고", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:18", "comment_id": "reply_li_24569911", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(221.154) 강조해야지ㅋㅋ 그걸로 막타치고 끝난다는걸 니트가 알았다는건데 그냥 썼는데 엥? 우연히 내가 전혀 모르던 버그가 터져서 잡혔네? 이런 텐션이 전혀 아니잖아ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:21", "comment_id": "reply_li_24570083", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ 그래 그 승리선언에 대한 강조는 분명 1컷 강조일텐데 왜 127-1화 통으로 강조한 얼어버리는 과정에 대한 모습은 아예 신경쓰질 않는거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:24", "comment_id": "reply_li_24570157", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ 1페이지의 강조보다 난 -1화를 통으로 쓴걸 좀더 치중하고싶은데 말이지", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:26", "comment_id": "reply_li_24570238", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(221.154) 몇화동안 분전하며 싸우던 보스 막타쳐서 쓰러지는 과정 3컷에 걸쳐서 보여주는게 크게 강조한건가... 강조한거여도 니트가 예상못한 버그로 우연히 잡혔다는거랑은 전혀 안이어지는데..", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:27", "comment_id": "reply_li_24570292", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ 넌 뭔가 좀 이상한거에 꽂히는게 많은거같은데. 다양한 사례가 나올수 있고 , 버그도 있을수도 있다. 물론 실제로 그런일이 있었으니까 란 갈래에서 이야기한거지 그걸 진짜 주제로 이야기했다고 생각함? 괜히 예를 들어란 말을 붙인게 아닌데", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:29", "comment_id": "reply_li_24570367", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(221.154) 이상한건 너같은데... 보스 쓰러지는거 3컷나온거는 그냥 하이라이트에 적절한 컷분배를 한거지 뜬금없이 뭔가 강조된거라고 매몰되는것도 웃기고 만화가 계속 니트가 아는 게임설정속에서 릴리가 만드는 변수로 굴러가는데 니트가 모르는 원본 게임이랑 다른 설정이 있을거라고 우기는것도 근거가없고", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:32", "comment_id": "reply_li_24570489", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ 반대로 게임만일거라고 우기는게 너 아닌가? 반대로 난 아닐거라는 근거는 확실히 말했음. 시스템적으로 달라진게 있고, 총이라는 개념이 달라진게 있고, 패턴으로써 달라진게 있음. 근데 넌 그럴때만 이세계란 이유랍시고 물타기만 했잖음. 게임으로써의 근거가 아니라.", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:34", "comment_id": "reply_li_24570586", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ 필요할때만 이세계 이야기로만 쓰고 패턴이든 뭐든 게임으로써 달라진게 분명히 있음을 말했는데도 그럴때만 이세계니까 란 이유만 덧붙였을뿐임. 일괄적으로 이야기좀 하자", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:35", "comment_id": "reply_li_24570626", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(221.154) 시스템은 달라진거없고 원본게임에서 총으로 날먹된다는 설정도없었고 패턴은 훼이크만넣었지 끝까지 니트가 아는패턴만 전조에 맞춰서 정직하게 사용했음 니트 게임지식이랑 세계관에 풀어내기위한 겉보기설정 외에 다른적은 없었다니까", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:36", "comment_id": "reply_li_24570649", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ 게임 기준으로써 5중 페이크를 즉사 포함해서 치는게임이 있으면 알려주셈. 어디까지나 하나의 몬스터가 일반적인 방식을 버리고 다른 방식으로 패턴을 실행하기 시작한건데 뭘 정직해", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:38", "comment_id": "reply_li_24570714", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ 애초에 이거부터 지금 니가 말돌리는거잖아. 패턴의 변수는 소울류같은겜만 해도 각 패턴을 연구하는 방식이 달라지는데 그건 당연하다시피 넘어가고", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:38", "comment_id": "reply_li_24570762", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(221.154) 결국 니트는 자기 게임지식(전조에 따른 회피방법)으로 그걸 파훼했는데 너말대로 시스템이 달라진거라면 전혀다른 전조에 전혀 다른 패턴을 썼겠지...", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:39", "comment_id": "reply_li_24570773", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ 패턴의 쓰는 방식의 변화가 있어야 반드시 변화한다는게 아니잖아 1~2중택 공격 5중택 공격은 엄연히 다른패턴으로 친다고 왜 그걸 똑같이 생각하는거야", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:40", "comment_id": "reply_li_24570811", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ 아니면 걍 프롬이나 그런데서 한번만 물어봐줘라. 보스가 시간이 지나니 1~2중택 공격하던게 갑자기 5중택 공격을 한다. 이건 패턴변화가 아니냐? 라고", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:42", "comment_id": "reply_li_24570873", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(221.154) 시스템이 달라지고말고를 정하는 근본적인 기준은 니트 게임지식으로 파훼불가능한 지식밖의 변화의 유무인데 그게 나온적이없다고ㅇㅇ 근데 니트가 모르는 원본게임이랑 다른 변수나 버그같은로 버섯이 죽었을거라고 하니까 그럴순없다고 한거고 처음부터", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:42", "comment_id": "reply_li_24570880", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(221.154) 그냥 단순하게 게임이랑 1이라도 달라졌냐 유무로만 말하면 처음부터 정해진 대답만 하던 npc랑 대화가 가능해진 시점에서 모든게달라진거라 아무의미가없음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 13:44", "comment_id": "reply_li_24570930", "parent_comment_id": "comment_li_24559189", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@ㅇㅇ 말했잖아 충분히 가능성은 있다고 했고, 물론 아닐수도 있다. 이세계니까 언제든지 달라질수 있을거고, 릴리란 존재때문에 충분히 그럴수 있을것이다 란게 뭐 우기는거임? 뭐 다른 겜판의 당연한 클리셰를 떠든건데 니가 아니라고 우기는거 자체가 좀 어이없지 않냐", "is_reply": true, "dccon": "", "com
