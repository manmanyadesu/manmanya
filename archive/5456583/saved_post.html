 무리 지어 다니고 그런 습성을 못버린 거 + 겸사겸사 자기 무리 일원의 애가 폭행 당했단 걸 빌미로 자신들의 무리 짓는 습성 정당화를 한 거지.  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1kOOgHVmW0cuf2sIDGh3njHfdLwCX06t4", "date": "07.26 03:34", "comment_id": "reply_li_18596030", "parent_comment_id": "comment_li_18589680"}, {"writer": "만갤러12(118.235) (118.235)", "text": "@범고래포동포동 ㅂㅅ아 마을사람들은 왜 불렀는데 그니까 ㅋㅋ 마약 유통하는거 자랑하려고? 뭐라는겨 걍 이해할 수 없는데", "is_reply": true, "dccon": "", "comment_img": "", "date": "07.26 06:45", "comment_id": "reply_li_18600447", "parent_comment_id": "comment_li_18589680"}, {"writer": "만갤러12(118.235) (118.235)", "text": "@범고래포동포동 양아치가 미이한테 마약 줌, 그러고 좀 이따 마을사람들 델꼬 옴 이 행동이 설명이 안되잖아 ㅋㅋ 좆본시골이 할렘가도 아니고 마을 주민들도 마약 거래하는게 당연하면 ㅇㅈ한다 양아치 지내들만 온 게 아니라 왜 마을사람들 데려다가 뭐하려고? 추가 약물은 또 숨기려고 애들 내보내는거보면 마약테스트도 아닌거 같구만", "is_reply": true, "dccon": "", "comment_img": "", "date": "07.26 06:51", "comment_id": "reply_li_18600548", "parent_comment_id": "comment_li_18589680"}, {"writer": "ㅇㅇ(121.167) (121.167)", "text": "@ㅇㅇ(220.118) 무리를 지은 미이쨩", "is_reply": true, "dccon": "", "comment_img": "", "date": "07.26 09:26", "comment_id": "reply_li_18603568", "parent_comment_id": "comment_li_18589680"}, {"writer": "ㅇㅇ(1.234) (1.234)", "text": "저게 왜 마을사람들이야 끼리끼리 놀던 양아치 패거리 데려온 거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "07.26 10:43", "comment_id": "reply_li_18605791", "parent_comment_id": "comment_li_18589680"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@만갤러12(118.235) 35-2 화 보고오셈 애들 사라져서 찾다가 미이쨩이 약먹고 팬거 보고 되갚아주려고 패는거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "07.26 11:50", "comment_id": "reply_li_18608035", "parent_comment_id": "comment_li_18589680"}, {"writer": "추운날엔붕어빵", "text": "@만갤러12(118.235) 마을사람들을 데려왔다는 건 뭔 개소리지;; 뒷메뉴라도 있나 찾아봤네", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1vbrFLAolNkt95AKBfqqC8FXjbYDuCtPY", "date": "07.27 16:17", "comment_id": "reply_li_18661521", "parent_comment_id": "comment_li_18589680"} , "date": "07.27 12:01", "comment_id": "comment_li_18653530", "parent_comment_id": ""}, {"writer": "ㅇㅇ(220.120) (220.120)", "text": "무우애미는 범인 아닐거 같은데그럼 무우는 혼자서아무것도 못하는 능지로 길에서 똥이나 싸고 다닐텐데", "is_reply": false, "dccon": "", "comment_img": "", "date": "07.27 15:38", "comment_id": "comment_li_18660319", "parent_comment_id": ""}, {"writer": "ㅇㅇ(121.167) (121.167)", "text": "100일 뒤 죽는 악어급 왜 인기 있는지 이해 안 가는 만화", "is_reply": false, "dccon": "", "comment_img": "", "date": "07.28 13:01", "comment_id": "comment_li_18700767", "parent_comment_id": ""}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
