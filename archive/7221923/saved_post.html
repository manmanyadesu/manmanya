폭발한거임. 어찌저찌 개고생해서 팔자 피나 싶을 때마다 섹드립 쳐서 무대 조지고 코스프레 하다가 오줌 지리고 파칭코 돌리다 치질 터지고 연극 때 병신짓흐고", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 03:46", "comment_id": "reply_li_24553248", "parent_comment_id": "comment_li_24549944", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러22(121.174) (121.174)", "text": "걍 평소하던 병신짓 쌓여서 이래댐", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 08:13", "comment_id": "reply_li_24559013", "parent_comment_id": "comment_li_24549944", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(220.117) (220.117)", "text": "@만갤러22(121.174) 작가는 대체 뭘 어떻게 수습하려고 똥을 그냥 무더기로 싸질러만 놨냐 ㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 08:49", "comment_id": "reply_li_24560221", "parent_comment_id": "comment_li_24549944", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "번아웃 온거지 진짜 자기가 케어해준다고 뭔 지랄을 다 해봐도 다 말아쳐먹고 개고생만한것만 남는데", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 12:23", "comment_id": "reply_li_24567449", "parent_comment_id": "comment_li_24549944", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "별랜", "text": "@ㅇㅇ(118.235) 쓰레기노...", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 12:31", "comment_id": "reply_li_24567794", "parent_comment_id": "comment_li_24549944", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(220.118) (220.118)", "text": "근데 이건 스미레 탓이 아니잖아 일남충 발기를 스미레가 어케 막음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.24 15:26", "comment_id": "reply_li_24574424", "parent_comment_id": "comment_li_24549944", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "야스화해해", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 01:54", "comment_id": "comment_li_2454994
