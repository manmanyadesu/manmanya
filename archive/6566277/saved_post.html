, "dccon": "", "comment_img": "", "date": "10.08 23:17", "comment_id": "reply_li_22343785", "parent_comment_id": "comment_li_22338383"}, {"writer": "만갤러16(211.107) (211.107)", "text": "편차치가 높다아앗!!!", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 23:18", "comment_id": "reply_li_22343814", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "천재vs한우물만 파며 경지에 이르려하는자. 스위치 히터vs고정된 자세. 신성 vs 베테랑. 키 큰 선수 vs 키 작고 빠른 선수.완전히 정반대인 두  세상이 격돌한거.거기에 두가지 정반대가 더 더해짐.사우스포 vs 오소독스거리를 유지하는 파이터 vs 파고드는 파이터.이 두가지가 나는 가장 중요하다고 봄. 저 두가지가 만나면 치명적 시너지가 나옴.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 23:27", "comment_id": "reply_li_22344228", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(110.15) (110.15)", "text": "@ㅇㅇ(220.124) 쿄고쿠는 한우물만 파는것까지 대비점 완벽하네 와...", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 23:31", "comment_id": "reply_li_22344384", "parent_comment_id": "comment_li_22338383"}, {"writer": "만갤러21(211.229) (211.229)", "text": "@ㅇㅇ(222.107) 므마는 오로지 주먹뿐인 복싱이랑 달리 스위치 한번 할때마다 달라지는 옵션이 훨씬 많아서 더더욱 대처하기 힘들고+복싱 외길 복서들보다 복싱 단일로 놓고보면 완성도가 낮아서 그런거 아닐까?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 23:33", "comment_id": "reply_li_22344470", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "아마다의 주자세는 오소독스.쿄고쿠의 주자세는 사우스포.이럴때 가장 많이 하는것? 짧고 빠르게 상대 바깥쪽으로 돌아나가 펀치 날리는 것임.14짤에서 아마다가 빠르게 돌아나간 뒤 오소독스로 다시 스위칭하고 어퍼컷 날리는게 그것임.그리고 이걸 막는 가장 좋은 방법?길게 펀치 뻗어 거리 유지하고 못 돌아나가게 막는거임.쿄고쿠가 연마해온 스타일임.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 23:37", "comment_id": "reply_li_22344678", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "그럼 단순히 쿄고쿠가 상성상 아마다를 힘들게할 스타일이라는거에서 그치느냐?아님. 이게 존나 재미있게 전개될수 있는 부분임.긴 펀치만 날리며 못파고들게 하는 사우스포 상대로 싸울수 있는 방법이 두가지가 있음.첫번째. 오소독스로서 앞손 싸움하기. 서로 앞손 싸움 하다가 레프트훅 맞추는것!두번째. 사우스포로서 가드올리고 스트레이트 맞불싸움 하기!", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 23:45", "comment_id": "reply_li_22345042", "parent_comment_id": "comment_li_22338383"}, {"writer": "만갤러23(39.119) (39.119)", "text": "@ㅇㅇ(220.124) 보통 이런 클리셰는 천재가 떨어져줘야 맛깔나는데 이건 천재가 그냥 압살해버릴거 같다..더 위로 올라가서 더 한 천재한테 떨어져야 범부가 되는 스토리가 그려지잖아", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 23:48", "comment_id": "reply_li_22345154", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "두가지 상황이 둘다 재미있는건, 두가지 다 스위치히터의 딜레마를 테스트하기 때문임.첫번째는 '너의 주자세인 오소독스의 순도가 어느정도가 되느냐?'의 질문을 던지고두번째는 '너의 스위칭한 반대자세 실력이 상대가 한우물만 판 주자세를 넘어설 능력이 되느냐?' 의 질문을 던지거든. 작가가 이 전개로 갈지 모르겠지만 이렇게 간다면 스위칭이라는 주제에 대한", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 23:52", "comment_id": "reply_li_22345275", "parent_comment_id": "comment_li_22338383"}, {"writer": "글임판글임", "text": "", "is_reply": true, "dccon": "https://lh3.googleusercontent.com/d/1G0r8gV90DUYPZSEVi3FvKUX4hDQXnj-Y", "comment_img": "https://lh3.googleusercontent.com/d/1ewm6evTrDwSLFjkkPTGjzknzim3bghNU", "date": "10.08 23:53", "comment_id": "reply_li_22345296", "parent_comment_id": "comment_li_22338383"}, {"writer": "글임판글임", "text": "@ㅇㅇ(220.124) 졍,,,빤데으,,,뎃비데능,,,두,,,썬쑤라니,,,,컵꿀쩸입이다,,,,", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1ewm6evTrDwSLFjkkPTGjzknzim3bghNU", "date": "10.08 23:53", "comment_id": "reply_li_22345301", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(211.225) (211.225)", "text": "@ㅇㅇ(220.124) 댓글읽다발기해버렸다", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 23:56", "comment_id": "reply_li_22345400", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "완벽한 안티테제 싸움이 되는거지.'스위칭으로 걸어온 너의 여정. 과연 그 어느것 하나라도 제대로 쌓아올린게 맞을까? 걸을 가치가 있던 여정일까?'천재가 스스로를 의심하게 되는 전개, 마지막 불꽃을 태우며 천재를 몰아붙히는 베테랑. 이러면 얼마나 재미있겠어.내가 이렇게 구체적으로 이야기하는건 저 쿄구코 모티브로 선수가 최근 몇년간 뜨거운 화제였거든.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 23:57", "comment_id": "reply_li_22345432", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "세바스티안 펀도라. 69kg 체급에서 뛰는 선수인데공식키 198cm. 리치 203cm.실제 키는 2m 넘는거 아니냐는 의심도 받고 있음.다른 선수들은 그 체급에서 키가 커도 180초반대,보통은 170 중반대임.걸어다니는 각다귀 같이 생겼고 각다귀처럼 싸움. 얘가 왜 화제였냐? '얘를 이길 방법이 존재하긴 하냐?'로 몇년간 논쟁이 많았기 때문임.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 00:03", "comment_id": "reply_li_22345597", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "얘가 싸우는 방법이 본문의 쿄교쿠랑 똑같음. 긴 팔과 긴 신장으로 앞손 견제만 하다가 어줍잖게 돌아나오려는 오소독스들 조져버리기. 계속 '니가 와, 나는 안맞고 존나 때려줄게'만 하기. 이러니까 복싱팬들 사이에서도  '얘를 이길 방법은 뭐가 있는가?'하고 몇년간 토론해왔거든.얘의 마지막 패배는 일단 첫번째 방법이었음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 00:09", "comment_id": "reply_li_22345828", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "첫번째 방법이란 바로 오소독스 앞손훅 맞춰 이기기.https://youtu.be/QRVB5qJRPoY?si=D7lPxvKsRCH907Ii36초부터.그런데 보면 얘가 팔도 길고 키도 큰데 이상하게 붙어서 싸우는걸 볼수 있음.이때 KO 당한후 정신차려서 버전 2로 업그레이드함. 그게 바로 지금의 스타일. 본문의 쿄고쿠 스타일.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 00:11", "comment_id": "reply_li_22345945", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ", "text": "고봉밥해설오하기와같구나아득히좋아", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/19maeUH4DL_3_uToK8rjcUv2vpRaE1ARR", "date": "10.09 00:16", "comment_id": "reply_li_22346101", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "https://youtu.be/VJt4pN2ERJM?si=MmpeZPqwk8BZYyGk버전 2 업그레이드 완성된 후의 모습보면 '진짜 좆같이 하네'하고 극찬의 욕이 절로 나옴.거리 벌리고 안맞으면서 존나 치기.천재 소리 들으며 현존하는 최고의 스위치 히터인 자론 에니스도 동체급인데 이악물고 펀도라 못본척하고 있음. 너무 빡세고 너무 노답이니까.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 00:19", "comment_id": "reply_li_22346208", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(211.54) (211.54)", "text": "복싱을 꿰고있다면 이렇게 작가가 의도한 모든 것을 알아보면서 만화를 온전히 즐길 수 있다는게 부럽고,이 만화의 정수를 혼자 즐기는 선에서 멈추지 않고 모두를 위해 이렇게 알기 쉽게 풀어서 공유해준다는게 정말 대단하다적어도 만갤에서만큼은 이 만화는 너로써 완전해진다", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 00:23", "comment_id": "reply_li_22346332", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "그럼 아마다의 모티브 선수는 누구냐? 나스카와 텐신.킥복싱 천재로 불리우며 킥복싱계 정리하고 큰 기대 속에 복싱으로 건너온 선수임. 엄청난 푸쉬를 받았고 세계 챔피언은 따놓은 당상으로 여겨졌음. 그런 그의 첫 세계 타이틀 도전 상대가 이노우에 타쿠마. 그 유명한 이노우에 나오야의 동생임. 이 시합에서 사람들은 텐신이 이길거라고 생각했음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 00:30", "comment_id": "reply_li_22346616", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "텐신은 이노우에 나오야(만화 속 반죠 다이 모티브 선수)도 이길수 있다며 자신부렸고, 나오야의 동생인 타쿠마는 재능은 없고 형 후광을 받는 범재로 여겨졌었거든. 텐신은 타쿠마를 이긴 뒤 나오야와 싸울거라 선언했음. 그리고 시합이 열렸는데... (아래 영상의 노란머리가 텐신, 검은머리가 타쿠마임)", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 00:33", "comment_id": "reply_li_22346769", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(211.204) (211.204)", "text": "@ㅇㅇ(220.124) 잠자기전에 다시보러왔는데 여적쓰고계시네 역자만큼 고생한다", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 00:36", "comment_id": "reply_li_22346891", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "https://youtu.be/tcKrXlPeNiM?si=KUN68LrW1golEjNK텐신의 완패였음. 처음에 자신감 넘치는 텐신이 기세넘게 밀어붙여서 다들 '끝났다' 했는데,범재라도 복싱이라는 한우물을 끈질기게 파온 타쿠마는 기본기의 급이 달랐음. 중반부부터 텐신이 쳐맞기 시작하더니 후반에는 타쿠마의 몸속에 형이 들어온듯 화려한 쇼맨십까지하며 줘팼음", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 00:37", "comment_id": "reply_li_22346933", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(39.115) (39.115)", "text": "AI라도 쓰는건가 어떻게 이 속도로 이 퀄리티 댓글이 나오는거지 ㅋㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 00:40", "comment_id": "reply_li_22347027", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(39.115) (39.115)", "text": "@ㅇㅇ(220.124) 아만보 그자체 ㅋㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 00:41", "comment_id": d/19maeUH4DL_3_uToK8rjcUv2vpRaE1ARR", "date": "10.08 21:27", "comment_id": "comment_li_22338658", "parent_comment_id": ""}, {"writer": "건전여우", "text": "음담패설좀 하지말라고 텐 씨라고까지 불렀는데 거기서 다시 자지를 깊숙히 쑤셔박네뭐네 이딴소리하는 놈 상대로 뭘 말하겠음 ㅋㅋㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1ewm6evTrDwSLFjkkPTGjzknzim3bghNU", "date": "10.08 21:55", "comment_id": "reply_li_22339992", "parent_comment_id": "comment_li_22338658"}, {"writer": "ㅇㅇㅇㅇㅇd", "text": "이번화에서 나오는 쿄고쿠의 전술도 사우스포 상대하려고 옆으로 돌아오는거 전제인데 그것도 스위치복서면 의미없는건가? 사우스포 끼리 싸우면오소독스끼리 싸우는거랑 같으니까?", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1ewm6evTrDwSLFjkkPTGjzknzim3bghNU", "date": "10.08 21:28", "comment_id": "comment_li_22338697", "parent_comment_id": ""}, {"writer": "ㅇㅇ(104.28) (104.28)", "text": "아무리 보ㅏ도 풀카운터인데 왜 스위치라는거지", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.08 21:33", "comment_id": "comment_li_22338924", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "보통 후속작일수록 파밸이 높아지는데 이 작가는 오히려 낮아지는 경향이 있네.(무력순위) 도박마>>>>바투키>복싱마", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/19maeUH4DL_3_uToK8rjcUv2vpRaE1ARR", "date": "10.08 21:36", "comment_id": "comment_li_22339096", "parent_comment_id": ""}, {"writer": "ㅇㅇ(39.115) (39.115)", "text": "갈수록 격투기 내공 생겨서 만화적 과장 줄여도 재미를 유지할 폼이 잡힌 듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 00:47", "comment_id": "reply_li_22347297", "parent_comment_id": "comment_li_22339096"}, {"writer": "만갤러11(211.36) (211.36)", "text": "저 리치 차이를 무력화시키면 대체 얼마나 빠른 거야 !? ㄷㄷ", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.08 21:36", "comment_id": "comment_li_22339100", "parent_comment_id": ""}, {"writer": "ㅇㅇ(221.149) (221.149)", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1uyZ4iJAvtljQAXK1LjfgXu8OCU3lHzb-", "comment_img": "", "date": "10.08 21:38", "comment_id": "comment_li_22339230", "parent_comment_id": ""}, iter": "ㅇㅇ(211.225) (211.225)", "text": "존나재밌네이씨발거", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.08 21:07", "comment_id": "comment_li_22337804", "parent_comment_id": ""}, {"writer": "ㅇㅇ(183.101) (183.101)", "text": "이보 전진을 위한 일보 후퇴 느낌. 사이다 전에 고구마가 필요하지.", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.08 21:07", "comment_id": "comment_li_22337808", "parent_comment_id": ""}, {"writer": "永月", "text": "스위칭 텐신 ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1ewm6evTrDwSLFjkkPTGjzknzim3bghNU", "date": "10.08 21:07", "comment_id": "comment_li_22337817", "parent_comment_id": ""}, {"writer": "복슬복슬Teemo", "text": "군대에서 번역한다는 속박으로 재미를 200% 끌어올렸노", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1ewm6evTrDwSLFjkkPTGjzknzim3bghNU", "date": "10.08 21:08", "comment_id": "comment_li_22337911", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "경기 꿀잼이네", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/19maeUH4DL_3_uToK8rjcUv2vpRaE1ARR", "date": "10.08 21:09", "comment_id": "comment_li_22337925", "parent_comment_id": ""}, {"writer": "Dazzle", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1oDpGqK78HyY90Ahf453EodJM2vXCgCsi", "comment_img": "https://lh3.googleusercontent.com/d/1ewm6evTrDwSLFjkkPTGjzknzim3bghNU", "date": "10.08 21:12", "comment_id": "comment_li_22338070", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "더파이팅에서도 랜디가 일랑 개잡듯이 팼을때는 스위치 복서가 그정도로 센가 싶었는데 여기선 제대로 표현해줄려나", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/19maeUH4DL_3_uToK8rjcUv2vpRaE1ARR", "date": "10.08 21:13", "comment_id": "comment_li_22338072", "parent_comment_id": ""}, {"writer": "닌자완스", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1gQWyAcnMQx-ZRwD7W2P5fQXkMcah9N_I", "comment_img": "https://lh3.googleusercontent.com/d/1ewm6evTrDwSLFjkkPTGjzknzim3bghNU", "date": "10.08 21:13", "comment_id": "comment_li_22338080", "parent_comment_id": ""}, {"writer": "폴렌", "text": "상대 좆사기네", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1ewm6evTrDwSLFjkkPTGjzknzim3bghNU", "date": "10.08 21:17", "comment_id": "comment_li_22338278", "parent_comment_id": ""}, {"writer": "풀세데이션", "text": "쿄고쿠는 예전에 리쿠도에서 나왔던 스나이퍼 컨셉이랑 비슷한건가?", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1ewm6evTrDwSLFjkkPTGjzknzim3bghNU", "date": "10.08 21:17", "comment_id": "comment_li_22338283", "parent_comment_id": ""}, {"writer": "ㅇㅇㅇㅇㅇd", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1mgjWMjV70jKcNLGQDe8sG0NTXYzCXCfq", "comment_img": "https://lh3.googleusercontent.com/d/1ewm6evTrDwSLFjkkPTGjzknzim3bghNU", "date": "10.08 21:19", "comment_id": "comment_li_22338346", "parent_comment_id": ""}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "설명해줌. 복서는 오소독스(오른손이 뒷손)와 사우스포(왼손이 뒷손)로 나뉨. 그리고 절대다수의 선수들은 이 자세를 유지하며 싸움. 오소독스는 오소독스 자세로 싸우고, 사우스포는 사우스포 자세로 싸움. 난전 상태에서 발이 움직여 자세가 뒤바뀌어도 재빠르게 원래로 리셋함. 왜 그대로 안싸우고 발을 다시 원위치 할까? 하고 싶어도 못하거든. 전혀 다른 영역이라.", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.08 21:20", "comment_id": "comment_li_22338383", "parent_comment_id": ""}, {"writer": "만갤러9(121.143) (121.143)", "text": "오오 왔구만", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 21:25", "comment_id": "reply_li_22338565", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "오소독스 <-> 사우스포는 손과 발의 위치만 바뀌는게 아니라 전혀 다른 세계임. 뇌회로를 새롭게 따로 입력해야하고 전법도 새롭게 따로 익혀야함. 오소독스로 고수인 사람도 사우스포로 하려면 초보가 됨. 처음부터 다시 쌓아야함. 그런데 한쪽 자세만 파도 정상에 올라서기 어려운 복싱에서 어줍잖게 두 자세 하려면 어떻게 될까? 둘 다 이도저도 아니게 됨.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 21:25", "comment_id": "reply_li_22338586", "parent_comment_id": "comment_li_22338383"}, {"writer": "pinkhip.", "text": "", "is_reply": true, "dccon": "https://lh3.googleusercontent.com/d/1X0inAnKiDXdnM_0TWVr6KJDHGEK_r5Vo", "comment_img": "https://lh3.googleusercontent.com/d/1ewm6evTrDwSLFjkkPTGjzknzim3bghNU", "date": "10.08 21:28", "comment_id": "reply_li_22338709", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(222.113) (222.113)", "text": "기다렸다우...", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 21:29", "comment_id": "reply_li_22338760", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "그래서 절대다수의 선수들은 한 자세만 파고 깎음. 지금도 대다수의 정상급 선수들은 한 자세만 하는 선수들임. 그런데 복싱마 이전 몇화들 떠올리면 생각날거임. '상대가 사우스포면 상대가 오소독스일때와는 싸우는 법이 전혀 달라진다' 상대가 어느 자세이냐에 따라 자신이 대처해야하는 방법과 싸워야하는 전법이 전혀 달라짐. 그런데 만약 상대가 자세를 계속 바꾸면?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 21:31", "comment_id": "reply_li_22338849", "parent_comment_id": "comment_li_22338383"}, {"writer": "만갤러10(59.6) (59.6)", "text": "dh", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 21:31", "comment_id": "reply_li_22338853", "parent_comment_id": "comment_li_22338383"}, {"writer": "만갤러10(59.6) (59.6)", "text": "", "is_reply": true, "dccon": "https://lh3.googleusercontent.com/d/1U4PJbAfG3XNdztHXuUScdwh5JPTk6RUd", "comment_img": "", "date": "10.08 21:41", "comment_id": "reply_li_22339352", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "복싱은 체스게임이라고 이전에도 비유로 설명해줬었음. 서로의 수에 맞춰 본인의 수를 계산함. 그런데 상대의 수가 계속 바뀌어. 퀸이 여기있었는데 다음 순간 그자리에 비숍이 있고, 퀸은 저기 반대편에 가있어. 그럼 체스를 둘수 있겠음? 이전까지 계산해놨던 수는 쓰레기통에 버려야함. 머리를 쥐어짜서 새로운 수를 짜내고 새롭게 대처해야함. 펀치를 주고받으며.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 21:43", "comment_id": "reply_li_22339476", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "'하기는 어려운데, 할수만 있다면 얻는 이익은 크다.' 이러면 어떻게 돼? 수요가 생김. 해보겠다는 선수들이 생김. 스위치 복서들은 크게 두가지로 나뉠수 있음.1. 제한된 상황에서 잠깐 동안만 스위치를 하는 타입.대표적으로 골로프킨이 있음. 상대에게 쇄도를 할때나 난전 상황이 되어 발이 엉켰을때 그 잠깐의 몇초간 상황에서 바뀐 자세로 상대와 싸우는것.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 21:47", "comment_id": "reply_li_22339673", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "원래 자세로 리셋할 시간없이 바로 상대에게 공격을 이어나갈수 있을뿐더러, 난전 상황에서 혼란스러울때 상대가 예상하지 못한 각도에서 펀치를 날릴수 있다는 장점이 있음. 또, 반대 자세를 완전히 마스터할 필요없이 어느 수준 이상만 연습해도 구사할수 있다는 장점도 있음. 시간 대비 효과가 좋기에 적지 않은 정상급 선수들이 연습해 구사를 함. 문제는 2번 타입임.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 21:52", "comment_id": "reply_li_22339867", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "2. 천재. 말 그대로 경기운영 자체를 맘대로 원하는 자세로 바꿔할수 있는 극소수의 천재임. 언제 사우스포를 할지,언제 오소독스를 할지,예측조차 할수 없음. 최정상급 선수들 중에서도 복싱 역사에 손꼽힐만한 숫자만이 이정도 경지를 이뤄냄. 상대에겐 악몽임. 경기 내내 상대의 발을 계속 봐야돼. 언제 자세가 바뀔지 몰라서.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 21:58", "comment_id": "reply_li_22340103", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(211.235) (211.235)", "text": "왔다 내 섹", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 22:10", "comment_id": "reply_li_22340688", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "자세가 계속 바뀌는거를 의식하며 싸워야하니 상대하는 선수는 배로 피곤함. 언제 어떤 펀치가 어떤 각도에서 날라올지 알수 없거든. 경기 전 캠프에서 전략을 짤 때에도 배로 준비해야함. 이렇게 보다보면 '이거 궁극의 비술 아닌가?' 싶어질거임. 수많은 장점들. 많은 복서들이 꿈만 꿀수 있는 능력.하지만 신은 공평하고 인간은 결국 피와 뼈,그리고 살임.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 22:11", "comment_id": "reply_li_22340714", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(168.126) (168.126)", "text": "쟤는 킥복서 출신이라 더 스위치 쉬운것도 있음? 발차기는 스탠스 상관없이 차잖어", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 22:12", "comment_id": "reply_li_22340796", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(14.32) (14.32)", "text": "@ㅇㅇ(220.124) ㅅㅂ 진짜 이거하면 존나 천재겠네 하고 검색하자마자 무하마드 알리 나오네  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 22:15", "comment_id": "reply_li_22340930", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(1.253) (1.253)", "text": "@ㅇㅇ(220.124) 알리 개쩌는 사람이었구나", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 22:20", "comment_id": "reply_li_22341163", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "잘 알려져있지 않지만, 이 세상에 양손잡이는 선천적으로 극소수임.'나 양손잡이야' 하는 사람은 절대다수가 반대편 손을 다른 사람들보다 더 잘 쓰는것일뿐임. 선천적으로 정해진 뇌의 구조임. 아무리 훈련해도 반대편 손을 주손만큼 잘 쓸수는 없음. 그리고 이게 스위치 히터에도 적용됨. 너가 아무리 반대편 자세를 잘해도 원래 자세만큼 잘할수는 없음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 22:21", "comment_id": "reply_li_22341180", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "@ㅇㅇ(14.32) 알리는 1번 유형의 스위치 히터였음2번 유형이 아니었음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 22:22", "comment_id": "reply_li_22341229", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "복싱에서 최정상급간의 시합은 아주 미세한 차이임. 양쪽 다 경지에 이른 사람들임. 복싱을 숨쉬고 먹고 생각하는 사람들이 붙음. 한쪽 자세만 파고 깎으며 한우물판 사람들이 전혀 밀리지 않음. '너의 스위칭은 내 앞에 내놓을 수준이 아니야. 잔기교일뿐. 원래 자세로 안싸우면 너는 나한테 뒤질거다.' 두가지 이야기를 들려주겠음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 22:32", "comment_id": "reply_li_22341633", "parent_comment_id": "comment_li_22338383"}, {"writer": "울프람", "text": "@ㅇㅇ(220.124) 하 선생님 오늘 고봉밥 배 터질거같아요 너무좋아요  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1ewm6evTrDwSLFjkkPTGjzknzim3bghNU", "date": "10.08 22:37", "comment_id": "reply_li_22341798", "parent_comment_id": "comment_li_22338383"}, {"writer": "만갤러17(222.99) (222.99)", "text": "더파이팅에서도 있었는데", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 22:46", "comment_id": "reply_li_22342230", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "첫번째는 워드vs 코발레프. 워드는 저 몇안되는 2번 타입의 천재 중 한명이고,코발레프는 한자세만 갈고 닦은 선수였음. 경기 초중반까지 워드는 스위치를 하며 코발레프와 싸웠음. 먹히지 않음. 워드가 스위칭을 아무리 잘한다한들 코발레프의 원래 자세만큼은 아니니까. 코발레프의 정타가 먹히고 워드가 다운됨. 워드는 남은시간 동안 원래 자세로만 싸워 겨우 이김.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 22:49", "comment_id": "reply_li_22342352", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "두번째는 헤글러vs레너드. 둘 모두 전설적 천재지만 헤글러는 스위칭이 가능했음. 그리고 그게 문제였음. 헤글러는 레너드에게 악감정을 가지고 있었어서 그냥 이기는걸로는 성이 안찼음. 이기는건 이미 따놓은 당상이었으니까. '내가 너보다 천재다. 내가 너보다 기술이 뛰어나다'는걸 증명하고 싶었음. 그래서 스위칭해서 싸우기로 결심함.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 22:54", "comment_id": "reply_li_22342626", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "경기가 시작하자마자 헤글러는 주자세인 사우스포가 아닌 오소독스로 스위칭해 나왔음. 레너드는 황당했음. '??얘 왜이래??' 그리고 초반 몇라운드 동안 계속 스위칭을 고집했음. 레너드는 '이게 웬 횡재야 개꿀'하며 라운드들을 손쉽게 따내고 자신감도 얻었음. 헤글러가 뒤늦게 아차하며 원래자세로 바꿔 나왔지만 늦었음. 판정까지 간 경기에서 초접전 스코어가 나왔고", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 22:58", "comment_id": "reply_li_22342789", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "레너드의 승리가 선언됐음. 헤글러가 초반에 어이없게 라운드들을 헌납하지만 않았어도 헤글러가 여유있게 승리했을 경기였음. 헤글러의 오만이 빚은 패배였음. '너는 스위칭 못하지만 난 스위칭해서도 싸울수 있어. 그러니까 증명해보일거야.' 읽다보면 깨달았을거임.오만에 빠져 나와 상대가 급이 비슷한 시합에서 스위칭을 내면 손해만 되는 카드로 돌아올수 있음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 23:03", "comment_id": "reply_li_22343048", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "만화로 돌아가서 17번 페이지. 오소독스(오른발 뒷발) 자세이던 아마다가 뒷손을 잽처럼 뻗어 쇄도하며 오른발을 앞으로 빼고 사우스포(왼발 뒷발)로 전환함. 그 상태에서 쿄고쿠의 카운터가 들어오자 사우스포 자세 유지하며 뒤로 스텝 밟아 피하고는 사우스포 자세 유지하며 역카운터. 오소독스로 출발 -> 사우스포로 피니쉬.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 23:09", "comment_id": "reply_li_22343313", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(118.37) (118.37)", "text": "@ㅇㅇ(220.124) 아 이제 저 장면이 뭔지 이해가 되네", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 23:14", "comment_id": "reply_li_22343643", "parent_comment_id": "comment_li_22338383"}, {"writer": "dd(183.100) (183.100)", "text": "@ㅇㅇ(220.124) 고마워요 복싱마 웨건!!", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 23:14", "comment_id": "reply_li_22343647", "parent_comment_id": "comment_li_22338383"}, {"writer": "ㅇㅇ(36.38) (36.38)", "text": "이 해설 때문에 만갤복싱마를 끊을 수가 없다니깐", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 23:16", "comment_id": "reply_li_22343731", "parent_comment_id": "comment_li_22338383"}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
