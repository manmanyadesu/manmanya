ce": "", "comment_media_version": 2}, {"writer": "のあパイペン", "text": "왔다 내 특식 ㅋㅋㅋㅋㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.29 13:42", "comment_id": "comment_li_23333029", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(180.233) (180.233)", "text": "어흐", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.29 13:43", "comment_id": "comment_li_23333099", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(180.233) (180.233)", "text": "남편 존나 불쌍하노", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.29 13:44", "comment_id": "comment_li_23333128", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "불륜하는것도아니고 걍 춤추러다니는건데 남편이왜불쌍하냐", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.29 14:10", "comment_id": "reply_li_23333988", "parent_comment_id": "comment_li_23333128", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(180.233) (180.233)", "text": "@ㅇㅇ(106.101) 니 아내가 옷 저리 처입고 남들 앞에서 스트립쇼 하면 참 좋겠노 심지어 그게 성벽임", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.29 14:24", "comment_id": "reply_li_23334633", "parent_comment_id": "comment_li_23333128", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(180.233) 그럼 연예인들은 다 창년 임???", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.29 14:33", "comment_id": "reply_li_23335095", "parent_comment_id": "comment_li_23333128", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(180.233) (180.233)", "text": "@ㅇㅇ(118.235) 연예인이 남편있는데 저딴 유흥업소에서 헐벗고 남자들 앞에서 춤춘대?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.29 14:34", "comment_id": "reply_li_23335150", "parent_comment_id": "c
