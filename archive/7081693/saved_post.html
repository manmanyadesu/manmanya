cimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658e822744a8d7c32156c1845e9db5b905385e0184a626bd52bf631677485526ac567651c2dcafa3de4b245a43ad2eadf4545a1298507001212", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(125.185) (125.185)", "text": "아니근데 일단은 도시전설 3번죽는 아재 그런 계통 아니었나? 아무리 후속 스토리라 점점 악당도 강해진다해도 괴이 한마리때메 신 상대할 때보다 더 피해 크게 입은 게 너무 과장된 거같아보임ㄹㅇ;;", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 20:19", "comment_id": "comment_li_24082678", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러5(1.241) (1.241)", "text": "지금까지 묘사된 거만 보면 단순히 도시전설이 아니라, 뭔 사신 같은 초월적인 놈인 거 같은데", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 20:42", "comment_id": "reply_li_24083552", "parent_comment_id": "comment_li_24082678", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러9(211.212) (211.212)", "text": "묘사 되는 거 보면 일반 잡귀가 아니라 저거 신쪽 계통 아니냐", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 20:52", "comment_id": "reply_li_24084070", "parent_comment_id": "comment_li_24082678", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(175.112) (175.112)", "text": "저 아저씨 현대 괴이가 아니고 고대에도 있던 존재임. 고대에 인간들이 저거 막을려고 무녀를 산신으로 만들었나? 여튼 그 산신은 그냥 저놈 누름돌임.", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 20:54", "comment_id": "reply_li_24084137", "parent_comment_id": "comment_li_24082678", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "00(211.235) (211.235)", "text": "미코 눈에만 아저씨로 보이지, 다른 사람들 눈에는 또 다르게 보임.", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 22:05", "comment_id": "reply_li_24087356", "parent_comment_id": "comment_li_24082678", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(112.162) (112.162)", "text": "저거 악신 아님? 최강자 라인", "is_r
