ion": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "보르노랑 똑같은 냄새나서 병신같은데 이런걸 좋아하는 애들이 왜 점점 많아지는건지...", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 05:12", "comment_id": "reply_li_23956610", "parent_comment_id": "comment_li_23956591", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(59.27) (59.27)", "text": "젖보똥만 보면 개추하는데서 뭔 자르노 타령이노", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 05:15", "comment_id": "reply_li_23956659", "parent_comment_id": "comment_li_23956591", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "Impede", "text": "님 투러브트러블도 안보고 만갤해요?", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 05:16", "comment_id": "reply_li_23956689", "parent_comment_id": "comment_li_23956591", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(125.185) (125.185)", "text": "여주 본인 속내랑 연결 안 될 땐 남녀 사정 구별없이 생물학적으론 그렇다고 반론하는데 그걸 보고 자르노식 전개라 한다고?", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 05:17", "comment_id": "reply_li_23956703", "parent_comment_id": "comment_li_23956591", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(125.185) (125.185)", "text": "진짜 자르노 본 적 없음? 보지년임??", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 05:17", "comment_id": "reply_li_23956711", "parent_comment_id": "comment_li_23956591", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@Impede 투러브는 자르노 감성이 아니라 위에 애가 말하는거처럼 그냥 젖보똥이죠", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 05:19", "comment_id": "reply_li_23956749", "parent_comment_id": "comment_li_23956591", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(125.185) 그걸 주인공을 좋아하는 여자애가 하고 있으니까 자르노죠....", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 05:19", "comment_id": "reply_li_23956757", "parent_comment_id": "comment_li_23956591", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(125.185) 꼭 이렇게 병신같은 소리 하는 찐따가 있더라", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 05:20", "comment_id": "reply_li_23956769", "parent_comment_id": "comment_li_23956591", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(125.185) (125.185)", "text": "@ㅇㅇ(118.235) ㅋㅋ보르노 수준 어느정도인지 인지 못 하는 거 보니까 ㄹㅇ보지년인가본데?", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 05:22", "comment_id": "reply_li_23956794", "parent_comment_id": "comment_li_23956591", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(125.185) 결국 할 말 없어서 한다는 소리가 보지년ㅋㅋ 에혀 찐따새끼", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 05:23", "comment_id": "reply_li_23956819", "parent_comment_id": "comment_li_23956591", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(125.185) (125.185)", "text": "@ㅇㅇ(118.235) 사정이 성별 주체에 끼워맞춰지는 것도 아니고 주인공 본인이 주도하는 걸 포르노식 전개라고 한다는 지능이 진짜 박수가 나온다", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 05:23", "comment_id": "reply_li_23956828", "parent_comment_id": "comment_li_23956591", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(125.185) 보르노식 성별 역전 전개 그대로 나오는데 주인공이 주도 어쩌고 저쩌고 거리고 있는 병신이 지능을 논하다", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 05:25", "comment_id": "reply_li_23956851", "parent_comment_id": "comment_li_23956591", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(125.185) (125.185)", "text": "@ㅇㅇ(118.235) ㅋㅋㅋㅋ양비론하는 척하면 누가 들어줄 줄 아나ㅋ 할말없어서가 아니라 누가봐도 티 나니까 말하는 거지 피싸개년ㅋㅋ", "is_reply": true, "dccon": " ", "comment_media_version": 2}, {"writer": "란즈크네츠", "text": "", "is_reply": false, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65ceb226efab7c9bf3b906ea30e5091e73daa2507c963a1ece28fbed53827c991b1c3f71e6ba580c309a3e96dc9208ebd57b00c9c59fe216f9d0c", "comment_img": "", "date": "11.12 20:06", "comment_id": "comment_li_23987064", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65ceb226efab7c9bf3b906ea30e5091e73daa2507c963a1ece28fbed53827c991b1c3f71e6ba580c309a3e96dc9208ebd57b00c9c59fe216f9d0c", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "생물학 너무 강하다..", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.12 21:08", "comment_id": "comment_li_23989648", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "아카노 쿠인(195.123) (195.123)", "text": "쿠지 : 야, 아카노! 여긴 상담 중이니까 당장 나가…!미아 어머니 : 아… 암컷?! 수컷?! 어디서 굴러먹은 애가 어른 앞에서 말버릇이 저게 뭐야!!군조 : 아카노 학생! 지금 학부모님 앞에서 무슨 망발입니까!아카노 : 망발이라니요. 저는 그저 눈앞에서 벌어지고 있는 ‘협동번식(Cooperative Breeding)’의 전형적인 갈등 양상을 객관적으로 지적했을 뿐입니다만.쿠지 : 협동… 번식…?쿠지 (속마음) : 아악…! 또 시작됐다…!!", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.12 21:39", "comment_id": "comment_li_23990912", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "아카노 쿠인(195.123) (195.123)", "text": "아카노 : 칼라하리 사막에 서식하는 ‘미어캣’을 아십니까?미아 어머니 : 미… 미어캣?! 얘가 지금 사람을 놀리나!!아카노 : 미어캣은 무리 내에서 최상위 서열인 ‘우위 암컷’… 즉 어미만이 번식을 독점하고, 먼저 태어난 딸들을 ‘헬퍼(Helper)’로 부려먹는 가혹한 계급 사회를 이룹니다.아카노 : 어미가 밖으로 먹이 활동을 나간 사이, 헬퍼인 딸은 굴에 갇혀 자기 연애와 번식은 포기한 채 어린 동생들에게 먹이를 주고 돌보는 육아 노동을 전담하죠.아카노 : 맞벌이를 이유로 장녀에게 초등학생 동생들의 저녁 식사를 떠넘기는 구조와… 소름 끼치도록 똑같지 않습니까?미아 어머니 : 뭐, 뭐라고…?!", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 21:40", "comment_id": "reply_li_23990937", "parent_comment_id": "comment_li_23990912", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "아카노 쿠인(195.123) (195.123)", "text": "@아카노 쿠인(195.123) 미아 : ……!아카노 : 미어캣의 우위 암컷은 헬퍼인 딸이 수컷에게 눈을 돌리면 맹렬히 폭력을 휘두르며 방해합니다. 이를 생물학에서는 ‘번식 억제’라고 부릅니다.아카노 : 딸이 연애에 빠져 독립해 버리면, 자기 새끼들을 공짜로 돌봐줄 유용한 ‘육아 노예’를 잃게 되니까요!아카노 : 방금 어머님께서 내뱉으신 ‘임신해서 버려질 쉬운 여자’라는 저주 또한… 딸을 걱정하는 모성애라기보단, 헬퍼가 임무를 내팽개치고 이탈할까 봐 공포를 느낀 우위 암컷의 히스테릭한 견제 공격으로밖에 안 보이는군요!미아 어머니 : 누… 누가 딸을 노예로 부렸다는 거야!! 이 버르장머리 없는 계집애가…!!쿠지 : 아카노 스톱!! 제발 스톱!! 학부모님한테 우위 암컷이니 노예니 선을 한참 넘었잖아!!", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 21:42", "comment_id": "reply_li_23991011", "parent_comment_id": "comment_li_23990912", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "아카노 쿠인(108.181) (108.181)", "text": "@아카노 쿠인(195.123) 아카노 : (새침하게 고개를 돌리며) 흥. 흥분하실 것 없습니다. 어디까지나 미어캣의 이야기입니다만!군조 : ……적당히 해, 아카노. 백번 양보해서 가정 내 육아 부담이 스트레스였다고 치자.군조 : 그렇다고 해도 어머님 말씀대로 같은 학교 또래 남학생을 만날 수도 있었을 텐데, 굳이 위험한 매칭 앱으로 생판 남인 성인을 만날 이유가 되진 않잖아?아카노 : 후우… 보건교사라는 분께서 그렇게 생물학적 교양이 얕으셔서야 곤란합니다, 군조 선생님.군조 : 뭐…?!", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 21:45", "comment_id": "reply_li_23991113", "parent_comment_id": "comment_li_23990912", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "아카노 쿠인(108.181) (108.181)", "text": "@아카노 쿠인(108.181) 아카노 : 야생 미어캣의 하위 암컷 역시 같은 무리에서 매일 얼굴을 맞대고 자란 내부 수컷 따위에겐 성적 매력을 느끼지 못합니다! 근친교배의 위험을 피하려는 본능이자, 서열과 밑바닥이 뻔히 보이는 수컷을 기피하는 현상이죠.아카노 : 그래서 하위 암컷들은 어미에게 발각되어 쫓겨날 위험을 무릅쓰고서라도, 반드시 무리 경계선 밖을 서성이는 ‘외부의 낯선 수컷’을 찾아내 밀회를 가집니다!", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 21:46", "comment_id": "reply_li_23991169", "parent_comment_id": "comment_li_23990912", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "아카노 쿠인(108.181) (108.181)", "text": "@아카노 쿠인(108.181) 아카노 : 하물며 집에서 매일 어린 동생들 뒤치다꺼리에 시달리는 장녀 입장에서 생각해 보시죠!아카노 : 정신 연령이 낮은 같은 학교 또래 남학생 따위는 설레는 ‘수컷’이 아니라, ‘밥 차려주고 어르고 달래야 할 또 다른 남동생’으로밖에 안 보일 게 뻔하지 않습니까!미아 : ……아……미아 (속마음) : 맞아… 학교 남자애들은 다 애 같아서… 기댈 수가 없었어…아카노 : (슬쩍 쿠지를 열정적인 눈빛으로 흘끔거리며) 그렇기에 미성숙한 또래 애송이들 대신! 경제력과 포용력, 연륜을 겸비한 무리 밖의 성숙한 성인 수컷을 갈망하는 것은! 우수한 유전자와 안식처를 추구하는 암컷으로서 지극히 정상적이고 고결한 본능이란 말입니다!!", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 21:48", "comment_id": "reply_li_23991206", "parent_comment_id": "comment_li_23990912", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "아카노 쿠인(108.181) (108.181)", "text": "@아카노 쿠인(108.181) 쿠지 (속마음) : 잠깐만… 이 녀석 지금 완벽하게 사심 섞어서 내 쪽 보고 얘기하는 거지?!아카노 : (이번엔 군조를 향해 서늘한 미소를 지으며) 게다가 좁아터진 학교라는 서식지 안에 쓸만한 수컷이 없을 때, 매칭 앱이라는 문명의 이기를 활용해 탐색 반경을 넓히는 것이 ‘불순하고 쉬운 여자’의 짓이라면…아카노 : 직장 내에 마땅한 상대가 없어 매칭 앱이나 데이팅 이벤트에 등록해 열심히 짝을 찾고 계신 전국의 성인 미혼 여성분들도 전부 ‘불순하고 쉬운 암컷’이 되고 마는군요.아카노 : 어떻게 생각하십니까, 군조 선생님?", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 21:48", "comment_id": "reply_li_23991244", "parent_comment_id": "comment_li_23990912", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "아카노 쿠인(208.87) (208.87)", "text": "@아카노 쿠인(108.181) 군조 : ……윽!!군조 (속마음) : 찔끔…! 이, 이 아이… 설마 어제 일을 알고서 비꼬는 건가?! 아니, 여기서 반박했다간 내 발등을 내가 찍는 꼴이 돼…!군조 : ……확실히… 매칭 앱 사용자 전체를 불순하다고 일반화하는 표현은… 다소 과격했을지도 모르겠군요…쿠지 (속마음) : 어라?! 저 완고하던 군조 선생님이 갑자기 꼬리를 내리셨어?!", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 21:49", "comment_id": "reply_li_23991265", "parent_comment_id": "comment_li_23990912", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "아카노 쿠인(108.181) (108.181)", "text": "@아카노 쿠인(208.87) 미아 : ……그치? 엄마도 들었지? 내가 이상한 게 아니라니까…!아카노 : 착각하지 마십시오, 키토 미아 씨. 당신의 번식 전략 역시 생물학적으로 낙제점투성이입니다.미아 : 에…?아카노 : 미어캣 하위 암컷이 만나는 ‘무리 밖 유랑 수컷’들에게는 치명적인 습성이 하나 있습니다. 그 수컷들은 교미만 끝내면 뒤도 돌아보지 않고 자기 무리로 돌아가 버리며, 새끼 양육에는 단 1그램의 먹이도 투자하지 않는다는 점입니다!아카노 : 매칭 앱이라는 넓은 초원에는 성실한 수컷도 있겠지만, 화려한 구애 신호만 위장한 채 유전자만 뿌리고 도망치려는 ‘무임승차 수컷’들이 득실거립니다.", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 21:50", "comment_id": "reply_li_23991316", "parent_comment_id": "comment_li_23990912", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "아카노 쿠인(208.87) (208.87)", "text": "@아카노 쿠인(108.181) 아카노 : 집안의 육아 스트레스에서 도망치고 싶다는 조급함 때문에 수컷의 ‘장기적 투자 의지’도 검증하지 않고 덥석 만났다간… 정말로 어머님 말씀대로 번식 비용만 독박 쓰는 도태 개체가 될 뿐입니다!미아 : 윽…… 그, 그건……쿠지 : ……자, 자! 아카노는 거기까지!쿠지 : 어머님, 갑자기 무례한 비유가 튀어나와 놀라셨겠지만… 미아 학생이 왜 그렇게까지 밖으로 눈을 돌렸는지는 조금 전달이 되었을까요?미아 어머니 : ……미아 : ……엄마. 빵만 던져놓고 나간 건 미안해. 근데 나도 고3인데… 매일 학교 끝나자마자 집에 묶여서 동생들 엄마 노릇만 하는 거, 진짜 숨 막혔단 말이야… 나도 누군가한테 응석 부리고 싶었다고…", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 21:52", "comment_id": "reply_li_23991375", "parent_comment_id": "comment_li_23990912", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "아카노 쿠인(108.181) (108.181)", "text": "@아카노 쿠인(208.87) 미아 어머니 : 미아… 그랬니… 엄마가 바쁘다는 핑계로… 네가 아직 열여덟 살이라는 걸 잊고 너무 당연하게 기댔나 보구나…쿠지 : 미아도 들었지? 앱 자체가 악은 아니지만, 지친 마음의 틈을 노리는 나쁜 어른들을 가려내는 건 아직 고등학생에겐 위험 부담이 너무 커. 집안일 분담을 어머님과 다시 조정하는 대신, 당분간 앱은 지우기로 약속할 수 있겠니?미아 : ……네. 엄마가 그렇게 말해 준다면… 어플 지울게요.군조 (속마음) : 말도 안 돼… 저 막무가내 생물학 궤변을 발판 삼아 순식간에 모녀 갈등을 봉합해 버리다니… 쿠지 선생님, 대체 저 여학생을 어떻게 조련하고 있는 거지…?!", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 21:54", "comment_id": "reply_li_23991424", "parent_comment_id": "comment_li_23990912", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "아카노 쿠인(108.181) (108.181)", "text": "@아카노 쿠인(108.181) 아카노 (속마음) : 후훗… 보셨습니까, 쿠지 군! 군조의 기세도 꺾어놓고 쿠지 군의 교내 입지도 올려줬으니 일석이조…! 이제 어른스럽고 포용력 넘치는 ‘외부의 성인 수컷’이 누군지 쿠지 군의 뇌리에 확실히 각인되었겠지!쿠지 (속마음) : 하아아… 수명 십 년은 줄어든 기분이다… 이 녀석 대체 왜 문밖에서 대기하고 있었던 거야…!!", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 21:54", "comment_id": "reply_li_23991446", "parent_comment_id": "comment_li_23990912", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(182.210) (182.210)", "text": "@아카노 쿠인(108.181) 이새끼 뭐임 미리 번역본 보고옴? 진짜 생물학
