", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(183.97) (183.97)", "text": "드디어", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.12 05:03", "comment_id": "comment_li_23956497", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "공작 이 만화 나름 괜찮은데 너무 자르노인 부분이 단점임", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.12 05:11", "comment_id": "comment_li_23956591", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "보르노랑 똑같은 냄새나서 병신같은데 이런걸 좋아하는 애들이 왜 점점 많아지는건지...", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 05:12", "comment_id": "reply_li_23956610", "parent_comment_id": "comment_li_23956591", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(59.27) (59.27)", "text": "젖보똥만 보면 개추하는데서 뭔 자르노 타령이노", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 05:15", "comment_id": "reply_li_23956659", "parent_comment_id": "comment_li_23956591", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "Impede", "text": "님 투러브트러블도 안보고 만갤해요?", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 05:16", "comment_id": "reply_li_23956689", "parent_comment_id": "comment_li_23956591", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(125.185) (125.185)", "text": "여주 본인 속내랑 연결 안 될 땐 남녀 사정 구별없이 생물학적으론 그렇다고 반론하는데 그걸 보고 자르노식 전개라 한다고?", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 05:17", "comment_id": "reply_li_23956703", "parent_comment_id": "comment_li_23956591", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(125.185) (125.185)", "text": "진짜 자르노 본 적 없음? 보지년임??", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 05:17", "comment_id
