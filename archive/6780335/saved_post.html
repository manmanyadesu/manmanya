: "", "comment_media_version": 2}, {"writer": "만갤러53(211.224) (211.224)", "text": "얀데레의 얀이 일본어로 병들었다는 표현임 데레는 부끄러워하다 인데 '~데레' 같은 표현에선 사랑의 감정으로 치환해서 생각함 즉, 병든 사랑을 하는 사람을 일컫는 말임 집착도 그 중 하나의 표현방식이고 그 외에도 스토킹, 문자 폭탄, 도청, 자해 등 여러 가지 방식이 있음 그래서 멘헤라와는 좀 다름 2ch에서 '멘탈헬스가 필요한 사람'이라는 표현이 멘헤라의 시초라고 여겨짐 즉, 얀데레는 병든 사람이 사랑을할때, 멘헤라는 걍 정신병자라는 차이점이 있음 또 얀데레는 궁합이 잘 맞으면 해피엔딩이 되기도 하지만 멘헤라는 집착하는 사랑보다는 좀 더 이기적이고 자기만 생각하는 쓰레기같은 사고방식을 부각해서 표현하기도 함 쉽게 말해 얀데레는 표현방식이 과격하지만 사랑해서, 날 봐줬으면 해서 하는 행동이라면", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.24 01:17", "comment_id": "reply_li_23092505", "parent_comment_id": "comment_li_23081023", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러53(211.224) (211.224)", "text": "멘헤라는 무조건적으로 날 사랑해, 날 안봐주면 자해할거야, 나는 불행한데 너는 행복한 모습 보기 싫어(SNS로 악질루머 퍼뜨리기) 같은 행동을 하기도 함 사랑이 있냐, 없냐가 두 표현의 차이를 가른다고 봐도 무방할듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.24 01:19", "comment_id": "reply_li_23092564", "parent_comment_id": "comment_li_23081023", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "견적 나오네. 이거 처녀 아니다", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.23 20:00", "comment_id": "comment_li_23081124", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "나도 30대에 저렇게 생겼는데 왜 나는 저런 여자애 안 찾아오지?", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.23 20:03", "comment_id": "comment_li_23081245", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러37(58.29) (58.29)", "text": "", "is_reply": true, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658ee21700cf99eb98410262d25ba54c14252f0de4c4c04eecde572286242501380c92841ec4b529c22dca49b85afa8e558d43354cc429fdb", "comment_img": "", "date": "10.23 20:04", "comment_id": "reply_li_23081294", "
