8QoUVKqv2UcTPYHZlj", "comment_img": "", "date": "08.13 16:12", "comment_id": "comment_li_19466212", "parent_comment_id": ""}, {"writer": "만갤러40(218.235) (218.235)", "text": "아동이든 스마트 도그든 불평등한 사회자본이 대물림된다는 걸 알려주는 것인데 여러 댓글의 수준 낮은 여성 혐오가 안타깝구만", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.13 16:15", "comment_id": "comment_li_19466287", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "무지성으로 여성 탓하는 것도 심각한 문제는 맞지만 여주년은 근데 병신이 맞고, 여성이 남성보다 대체로 더 무책임한 경향이 있고, 가스라이팅 잘 당하면서 좀 더 잘 속고 좀 더 정신력이 약한 등등 정신적으로 나약한것도 팩트임 근데 ㅇㅇ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/17HaXqMmnjqR-P81RwksKHGUeATxIda2_", "date": "08.13 16:19", "comment_id": "reply_li_19466412", "parent_comment_id": "comment_li_19466287"}, {"writer": "ㅇㅇ", "text": "강아지를 위해서 워라벨 챙길 여유도 전혀 없으면서, 존못 거지 찐따 새끼인 경우는, 놈이던 년이던 지 주제파악이나 쳐 하면서 강아지한테 고통 주지 말고 차라리 애초에 강아지를 안 키우는게 맞음애초에 동물 키우는 취미가 원래 돈 or 시간 둘 중 하나 여유되는 사람들이나 가지던 취미인데 아무것도 여유없는 병신년이 그저 자기 찐따답게 외로움 견딜라고", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/17HaXqMmnjqR-P81RwksKHGUeATxIda2_", "date": "08.13 16:21", "comment_id": "reply_li_19466503", "parent_comment_id": "comment_li_19466287"}, {"writer": "ㅇㅇ", "text": "제대로 된 아무런 각오나 준비도 없이 일단 무책임하게 개 키우고 보는 태도는흙수저, 운구기일(세상은 운이 전부다), 여혐 등등 그런 요소들을 다 떠나서 비난받아야 마땅함 ㅇㅇ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/17HaXqMmnjqR-P81RwksKHGUeATxIda2_", "date": "08.13 16:22", "comment_id": "reply_li_19466534", "parent_comment_id": "comment_li_19466287"}, {"writer": "만갤러40(218.235) (218.235)", "text": "@ㅇㅇ 너처롬 아무 설득력도 합리적 이유도 없이 개소리하면서 여성 혐오로 증오 배출하는 게 똑같은데 무슨 팩트니 개같은 소리임?", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.13 16:22", "comment_id": "reply_li_19466546", "parent_comment_id": "comment_li_19466287"}, {"writer": "ㅇㅇ", "text": "@만갤러40(218.235) 내가 여혐으로 보임? 그렇다면 그건 니가...", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/17HaXqMmnjqR-P81R "포포가 불쌍하다 저딴걸주인이라고", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1kDzS_It5o98BX72-SsAUswN4HkABBE7_", "date": "08.14 16:33", "comment_id": "comment_li_19516823", "parent_comment_id": ""}, {"writer": "ㅇㅇ(210.218) (210.218)", "text": "회마다 개가이상해보이다가 주인이 이상해보이다가 참알수가없지만 재미는있다", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.14 19:54", "comment_id": "comment_li_19525312", "parent_comment_id": ""}, {"writer": "ㅇㅇ(220.86) (220.86)", "text": "빨리 4화 빨리", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.14 20:45", "comment_id": "comment_li_19527604", "parent_comment_id": ""}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
