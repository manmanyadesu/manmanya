, "text": "이 작가가 하고싶어 하는걸 성공적으로 완성하면 던전밥같은게 나오는거고 이 작가는 그냥 설정딸 치는 드로잉북이나 냈어야 함", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/11U8-KoveLisgomLYIuSqUoilb4f3nzoQ", "date": "09.16 15:41", "comment_id": "comment_li_21179434", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "만화로서 매력이 개좆도없노", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/11U8-KoveLisgomLYIuSqUoilb4f3nzoQ", "date": "09.16 15:41", "comment_id": "reply_li_21179442", "parent_comment_id": "comment_li_21179434", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "", "is_reply": true, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b651e22d6eb2ca73cb38c7109b0cf9c5a0126aa360945878ec8f5f393e5d7e2b30dfccb1fbbe6067511b", "comment_img": "https://lh3.googleusercontent.com/d/11U8-KoveLisgomLYIuSqUoilb4f3nzoQ", "date": "09.16 16:15", "comment_id": "reply_li_21180657", "parent_comment_id": "comment_li_21179434", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b651e22d6eb2ca73cb38c7109b0cf9c5a0126aa360945878ec8f5f393e5d7e2b30dfccb1fbbe6067511b", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "", "is_reply": true, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65fe3256e36cb6e6890d3d25b44822f48b0282490610773acf3fc157a66f4f695f194095107b4f7c1d9a975b020", "comment_img": "", "date": "09.16 16:20", "comment_id": "reply_li_21180870", "parent_comment_id": "comment_li_21179434", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65fe3256e36cb6e6890d3d25b44822f48b0282490610773acf3fc157a66f4f695f194095107b4f7c1d9a975b020", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.36) (211.36)", "text": "오히려 해외쪽은 그림 이만큼 그리는사람 넘쳐서 이작가가 틈새시장 공략 잘한걸지도 모름...", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.16 18:38", "comment_id": "reply_li_21186006", "parent_comment_id": "comment_li_21179434", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러21(121.182) (121.182)", "text": "Previous Episode——지난 줄거리거짓의 섬(嘘の島)을 구한 후, 천연 증기탕 안에서 최종 면접을 치른 아미와 티아리스 학장. 그 면접 속에서 (아미는) 마력 고갈을 일으킨 이유가 금기 마법에 대해 신체의 한계를 뛰어넘는 마법을 사용했기 때문이라고 털어놓는다. 아미의 인생에 대한 긍정적인 자세와 학생을 향한 강한 마음을 들은 티아리스 학장은, 키사로 마술 대학에서 교편을 잡는 것을 허가했다. 그리고 일행은 대학의 지하 수장고로 향한다——.", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.16 15:44", "comment_id": "comment_li_21179575", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러21(121.182) (121.182)", "text": "티아리스 학장키사로 마술대학의 학장. 천사 같은 외모와 독특한 말투가 특징. \"축복의 마술사\"라 불리며, 치유 마법이 특기이다.", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.16 15:46", "comment_id": "comment_li_21179626", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇㅇㅇㅇd", "text": "", "is_reply": false, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b651ed216e5a8b0a2707de9bc9f84f44968933f7e6e6306d7246b289f736da1089efaf50ef7301246e9560ef", "comment_img": "https://lh3.googleusercontent.com/d/1-VOW5eY8kv9iakIPT0lYwIGtAkRrGUxK", "date": "09.16 15:55", "comment_id": "comment_li_21179968", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b651ed216e5a8b0a2707de9bc9f84f44968933f7e6e6306d7246b289f736da1089efaf50ef7301246e9560ef", "comment_img_source": "", "comment_media_version": 2}, {"writer": "MCMH", "text": "", "is_reply": false, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567
