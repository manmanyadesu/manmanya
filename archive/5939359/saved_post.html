 "text": "켄이치가 한번 달인 찍었던 애라 그런거 아님? 허미트는 달인 다구리쳐서 몇번 잡았잖아.", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.26 23:12", "comment_id": "reply_li_20163838", "parent_comment_id": "comment_li_20161466"}, {"writer": "만갤러30(210.104) (210.104)", "text": "이게 간혹 오해하는게 달인이란 생물들은 기본적으로 제자급 상대로는 오만하게 구는 경향이 있음 즉 방심을 함, 상대가 달인급이 아닌 이상은 제자급을 상대로는 좋든 싫은 무의식적으로 방심하는 경향이 큼2부에서도 권성 오키타는 오딘과 켄이치를 상대하면서도 결국 방심에 가까워서 딱 한대 살짝 맞은 적이 있는데 이는 제자들의 성장에 기뻐할때 방심한다는 그 점을 노린 것도 있지만 다르게 보면 달인급 되는 무술가들은 제자급 상대로는 어느쪽이든 약간의 방심을 곁들인다는 점임.최하급 달인이라서가 아니라 오히려 달인급이기에 제자급의 상대에게는 무의식적으로 긴장의 끈을 놓음.그것이 패인이 되어서 제자급에게 당하는거임다만 제자급이라고 해도 저들은 거의 준 묘수급, 켄이치는 확실하게 묘수 이상 달인급 이하의 경지라서", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.27 12:26", "comment_id": "reply_li_20187391", "parent_comment_id": "comment_li_20161466"}, {"writer": "만갤러30(210.104) (210.104)", "text": "@만갤러30(210.104) 제자급이라 하기에도 좀 애매함 ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.27 12:26", "comment_id": "reply_li_20187405", "parent_comment_id": "comment_li_20161466"}, {"writer": "ㅇㅇ(1.219) (1.219)", "text": "젖보똥 슈퍼 항상 번역 고마움", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.26 22:35", "comment_id": "comment_li_20161600", "parent_comment_id": ""}, {"writer": "ㅇㅇ(210.100) (210.100)", "text": "달인 잡는걸 보여주긴하네 1부 기준이면 약한 달인도 2대1로는 무리였을텐데", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.26 22:36", "comment_id": "comment_li_20161661", "parent_comment_id": ""}, {"writer": "ㅇㅇ(1.250) (1.250)", "text": "흉차 저거 1부부터 지금까지 저걸로만 달인 3명 잡은것 같은데 제자급일때써도 일단 맞추기만하면 달인 쓰러트리는 기술 너무 밸붕같은데", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.26 22:36", "comment_id": "comment_li_20161672", "parent_comment_id": ""}, {"writer": "ㅇㅇ(121.132) (121.132)", "text": "그 3번 다 끝내주는 탱들이 있어서 딜 넣은건데 어차피 레이드 전 아니고선 쓰기 힘듬.  최상급 달인들은 얌전히 맞아주지 않을거고", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.26 22:51", "comment_id": "reply_li_20162565", "parent_comment_id": "comment_li_20161672"}, { | '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
