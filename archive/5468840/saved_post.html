": "ㅇㅇ", "text": "원작부터가 개노잼이구나", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/17Utbv2FL7_h-h1zde1A4V_0wnmMDhaAW", "date": "07.27 09:50", "comment_id": "comment_li_18650608", "parent_comment_id": ""}, {"writer": "ㅇㅇ(182.228) (182.228)", "text": "안이랑 쇼타가 목매 죽는거는 뭐 이해가는데 옆에 나머지는 왜죽음? 그냥 따라간 죄로?", "is_reply": false, "dccon": "", "comment_img": "", "date": "07.27 10:14", "comment_id": "comment_li_18651088", "parent_comment_id": ""}, {"writer": "만갤러6(118.33) (118.33)", "text": "나무한테 다음에 지나가는 놈 한명만 죽으라고 소원 빌었는데나무가 걍 이 다음부터 앞에 지나가는 놈 죄다 죽으라고 하십쇼라고 이해해서 뒤진듯?", "is_reply": true, "dccon": "", "comment_img": "", "date": "07.27 10:24", "comment_id": "reply_li_18651335", "parent_comment_id": "comment_li_18651088"}, {"writer": "만갤러7(211.234) (211.234)", "text": "안이 불쌍하다 여겨서 데려가줬나봄", "is_reply": true, "dccon": "", "comment_img": "", "date": "07.27 11:00", "comment_id": "reply_li_18652285", "parent_comment_id": "comment_li_18651088"}, {"writer": "무화과피자", "text": "원래는 신목으로 숭배받았어서 영험한 힘이 실제로 있는 나무인데 어느 순간부터 주변에 묘지 생기고 저주하면 들어 주는 저주의 나무가 되어 있으니까 빡쳐서 마침 자기한테 누구 죽여달라고 빈 대학생이랑 일행들 죄다 홀려서 내막을 파헤칠라고 자기한테 와서 자백하게 한 거임  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1PjnDe1r5Bws51SVcKHqCneY1KxhUw2rU", "date": "07.27 13:06", "comment_id": "reply_li_18655434", "parent_comment_id": "comment_li_18651088"}, {"writer": "무화과피자", "text": "나머지들은 하필 같이 따라간 죄가 맞긴 하지 이미 나무는 흑화한 뒤라 저주 사건에 연관된 사람이면 자길 어떻게 생각하던 죄가 있건 없건 상관없이 설문조사시키고 죽일 의도였음  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1PjnDe1r5Bws51SVcKHqCneY1KxhUw2rU", "date": "07.27 13:08", "comment_id": "reply_li_18655498", "parent_comment_id": "comment_li_18651088"}, {"writer": "ㅇㅇ(182.221) (182.221)", "text": "여캐는 아직 예쁘게 그리는데 그냥 그작이나 해라", "is_reply": false, "dccon": "", "comment_img": "", "date": "07.27 10:25", "comment_id": "comment_li_18651369", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "ㅅㅂ 다 나무한테 얘기하는 거였으면 entId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
