91", "parent_comment_id": ""}, {"writer": "ㅇㅇ(14.34) (14.34)", "text": "개연성과 주인공 설정이랑 과거가 다 개병신스러울 정도로 짜임새가 없어서 난 하차한다.씨발 지가 자살하게 만든 애중 한 명이 \"난 끝까지 믿어줄거야\" ㅇㅈㄹ을 하는데 여기에서 안 빡치고 '와 얘가 왜 사랑받는줄 알겠다' ㅇㅈㄹ하는 게 맞냐???", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.29 10:48", "comment_id": "comment_li_21853482", "parent_comment_id": ""}, {"writer": "ㅇㅇ(14.34) (14.34)", "text": "씨발 적당히 해야지", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.29 10:48", "comment_id": "reply_li_21853484", "parent_comment_id": "comment_li_21853482"}, {"writer": "ㅇㅇ(14.34) (14.34)", "text": "당장 3화 전에 부모님 다 뒤지고 여동생도 자살하고 이새끼도 자살하는 순간 까지도 비난과 조롱을 당했으면서 정신상태 리셋돼서 과거 다 청산한 것 마냥 행동하는 거 뭐임? 이럴 거면 기억이 단편적으로만 과거로 넘어갔다고 하던가 덕분에 긴장감도 없고 개연성도 없고 짜임새까지 무너져버리잖냐. 작가의 대가리가 꽃밭이거나 중딩 수준의 지능에서 멈췄거나 아무리 봐도 둘 중 하나다", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.29 10:49", "comment_id": "reply_li_21853527", "parent_comment_id": "comment_li_21853482"}, {"writer": "ㅇㅇ(14.34) (14.34)", "text": "너무 이상해서 찾아보니 나무위키로 대략적인 전개를 알 수 있었음회귀 러브코메디 가 아니라 매 권마다 새로운 빌런이 등장하는 아침드라마격 발암전개물임그와중에 주인공 병신새끼 끝까지 유지되는 듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.29 10:53", "comment_id": "reply_li_21853641", "parent_comment_id": "comment_li_21853482"}, {"writer": "ㅇㅇ(222.117) (222.117)", "text": "ㄹㅇ 전개가 이해가 안가네 ㅋㅋㅋ 왜 안빡치지? 저렇게 말했는데? 나 같아도 그 소리 확실하게 듣고 무조건 멀어질듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.29 11:04", "comment_id": "reply_li_21853980", "parent_comment_id": "comment_li_21853482"}, {"writer": "ㅇㅇ(1.240) (1.240)", "text": "@ㅇㅇ(14.34) 주인공이 ㅂㅅ이다? 그거 아님. 주인공이 아마다가 본인을 나락 보내도록 설계했다는거 눈치채고 그때부터 흑화하고 냉정해짐. 빌런들 전부 다 주인공이 참교육하고 다님.. 지금는 최대 안 엮이려고 행동하느라 진따럼 보이는거지 이유를 아는순간 참교육이 시작됨.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.29 12:52", "comment_id": "reply_li_21858397", "parent_comment_id": "comment_li_21853482"}, {"writer": "ㅇㅇ(1.240) (1.240)", "text": "@ㅇㅇ(14.34) 그리고 주인공이 지금 현재 착각하고 있는게 아마다가 전부 계획하는게 아닌 이바때문에 나락가는걸로 알고 있다는거임.", "is_r t: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
