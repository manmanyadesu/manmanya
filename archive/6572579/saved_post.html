img": "", "date": "10.09 11:37", "comment_id": "comment_li_22364848", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "쟤미뗘쟤미뗘 이 만화를 몰랐던 내 인생이 아까워", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.09 11:38", "comment_id": "comment_li_22364860", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "강북", "text": "쓰레기 만화 유기하세요", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.09 11:39", "comment_id": "comment_li_22364899", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러7(121.182) (121.182)", "text": "이거 그림체 때문에 본다", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.09 11:39", "comment_id": "comment_li_22364916", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "marin", "text": "", "is_reply": false, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65fec2d6ea1f2bb951d2b14f32bde61ae35274e2d085b705e4afa1dc425c6388bc3da3def214242df", "comment_img": "", "date": "10.09 12:11", "comment_id": "comment_li_22365790", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65fec2d6ea1f2bb951d2b14f32bde61ae35274e2d085b705e4afa1dc425c6388bc3da3def214242df", "comment_img_source": "", "comment_media_version": 2}, {"writer": "FLCL", "text": "공주귀엽노", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.09 12:17", "comment_id": "comment_li_22365994", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.223) (118.223)", "text": "주인공 백합강조 시킬려는 대사가 좀 아쉽긴한데 그거빼곤 재밌네", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.09 12:27", "comment_id": "comment_li_22366374", "
