g_source": "", "comment_media_version": 2}, {"writer": "꿀금통수", "text": "배운게 없어서 일자무식으로 박치기하니까지금까지 무슨 만화의 재능이 어쩌구 하는것보다 훨 재밌노", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.11 02:00", "comment_id": "comment_li_23901644", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "의외로 존나게 정석적인 방법으로 스토리 짜고 있어서 놀람", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.11 02:01", "comment_id": "comment_li_23901716", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "메가역바니어롭", "text": "나두 가끔 다시 보고싶은 어린이 도서들이 있어...  - qc Ɐbb", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.11 02:03", "comment_id": "comment_li_23901802", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "금타", "text": "아낌없이주는나무 필독", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.11 02:04", "comment_id": "comment_li_23901829", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "로리헌터™", "text": "누가 가르쳐주지도 않는데 스스로 문제를 인식하고 해결방법을 도출해낸다... 사실 천재 아님?", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.11 02:05", "comment_id": "comment_li_23901894", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러15(211.224) (211.224)", "text": "만화는 커녕 그림부터가 초짜인데 첫 도전부터 장려상 탄게 보통 괴물이 아니긴 함 그 고생을 했는데 고작 장려상? 타령은 했지만 결국 시간 보낼 수단이 필요하다고 다시 만화를 선택해버렸고 그 고작이라도 없었으면 아예 펜을 꺾었을테니까", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 02:30", "comment_id": "reply_li_23902818", "parent_comment_id": "comment_li_23901894", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "머리는 좋은데 든게 없는 경우지", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 03:02", "comment_id": "reply_li_23903837", "parent_comment_id": "comment_li_23901894", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "수련파트인가... 그나저나 어린이용 동화책에 본인의 취향에 맞는 자극적이고 다크한 스토리는 없을텐데", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.11 02:06", "comment_id": "comment_li_23901903", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러15(211.224) (211.224)", "text": "한국인 입장에서는 좀 납득하기 어렵겠지만 일본은 일상생활에서도 한자를 많이 접하는데 이 빡통만순이는 고졸은 했는지조차 의심스러울 정도의 지성이니까 어려운 단어는 애초에 읽을 수 없고, 교과서도 읽을 수 없었을거임 집안 사정이 학대 가정이었다면 어렸을때부터 교육은 방치였을거라 학교에서도 적응 못했을테고 결국 만순이는 활자를 읽을 수 있는 단계부터 시작해야함 과정은 좋았지만 4일밖에 안남았으니 만화 그리는 과정에서 제일 오래 걸리는 파트가 콘티인데... 시간 부족으로 결국 40만엔은 못탈듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 02:35", "comment_id": "reply_li_23902970", "parent_comment_id": "comment_li_23901903", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(182.212) (182.212)", "text": "좆밥 하수새끼. 밝은걸 보고 씨발 이런 세상은 없다고! 하고 몸 비틀어 짜내버리는게 만순이라고", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 02:41", "comment_id": "reply_li_23903135", "parent_comment_id": "comment_li_23901903", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "카치카치야마처럼 할매 때려죽인 너구리를 토끼가 몸에 불지르고 화상입은거에 된장쳐바르고 나중에 물에담가 죽여버리는등 꽤 잔혹한소재도 있음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 03:25", "comment_id": "reply_li_23904505", "parent_comment_id": "comment_li_23901903", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러30(14.32) (14.32)", "text": "글 읽기 연습부터 하려는거 아님? 좆본은 한자 읽기쓰기로 가정교육까지 판별된다던데 한글은 진짜 문맹아니면 의미파악은 못해도 읽을수는 있지만", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 03:35", "comment_id": "reply_li_23904769", "parent_comment_id": "comment_li_23901903", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer
