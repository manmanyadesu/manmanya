": "ㅇㅇ(58.236) (58.236)", "text": "물론 이어지면 노잼되니까 철벽치는건 알지만... 깝깝한건 어쩔수가없구나", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.25 12:01", "comment_id": "comment_li_21644724", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러19(222.121) (222.121)", "text": "남주 욕하기엔 선생-학생이라는게 너무 커서 이해는 가는데", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.25 12:01", "comment_id": "comment_li_21644726", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러20(221.165) (221.165)", "text": "오늘부로 만갤은 망했다", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.25 12:01", "comment_id": "comment_li_21644736", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "빨리 59화 그려와", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/12Lqpj2xy6e7UhE12BGQg07dqXLglmvsy", "date": "09.25 12:01", "comment_id": "comment_li_21644737", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러21(14.39) (14.39)", "text": "해피추석", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.25 12:03", "comment_id": "comment_li_21644814", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(175.124) (175.124)", "text": "왜 졸업뒤에 사귀자는 말을 못하는겁니까", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.25 12:03", "comment_id": "comment_li_21644835", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "떠난사람", "text": "그 얘기 꺼내면 여주 바로 폭주해서 선넘을 게 뻔하니까", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/12Lqpj2xy6e7UhE12BGQg07dqXLglmvsy", "date": "09.25 12:13", "comment_id": "reply_li_21645251", "parent_comment_id": "comment_li_21644835", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러30(121.132) (121.132)", "text": "바로 사회적 자살 직행인데 어캐하냐고ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.25 12:27", "comment_id": "reply_li_21645902", "parent_comment_id": "comment_li_21644835", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(1.248) (1.248)", "text": "이게 맞긴한데 쿠인상대로는 오답임;", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.25 12:46", "comment_id": "reply_li_21646854", "parent_comment_id": "comment_li_21644835", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그럼 뭔 좆같은 생물학 얘기하면서 더 들이댈거 뻔함", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/12Lqpj2xy6e7UhE12BGQg07dqXLglmvsy", "date": "09.25 12:58", "comment_id": "reply_li_21647446", "parent_comment_id": "comment_li_21644835", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그거도 현실에선 존나 아웃이지  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/12Lqpj2xy6e7UhE12BGQg07dqXLglmvsy", "date": "09.25 13:01", "comment_id": "reply_li_21647572", "parent_comment_id": "comment_li_21644835", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(122.47) (122.47)", "text": "상대를 봐가면서 얘기를 해야지 니 말대로 하잖아? ㄹㅇ 남주 인생 종침", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.25 13:27", "comment_id": "reply_li_21648585", "parent_comment_id": "comment_li_21644835", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "쭉농증", "text": "", "is_reply": true, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658e820775f41d8d0ca6079a0800f01ce0219382a3cf6132645765fdc52e2cd0a6b31afbcfafc561f7ad6c653c52e94a749371df8b588bbbe3cce", "comment_img": "https://lh3.googleusercontent.c
