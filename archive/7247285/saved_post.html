i_24646789", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러8(121.145) (121.145)", "text": "그거 켄이치 1부 막판에  못박아놔서 작가도 지금 땅을 치고 후회하고 있을듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 22:23", "comment_id": "reply_li_24647621", "parent_comment_id": "comment_li_24646789", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.138) (221.138)", "text": "묘수 맞지 않음?", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 22:33", "comment_id": "reply_li_24648218", "parent_comment_id": "comment_li_24646789", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러11(1.241) (1.241)", "text": "사실상 1부가 스토리 절반 정도라고 치면50%왔으면 묘수 정도는 시켜줘도 될 거 같긴 함. ㅇ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 22:34", "comment_id": "reply_li_24648243", "parent_comment_id": "comment_li_24646789", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러12(211.208) (211.208)", "text": "1부 최종전 이전 에피소드에서 켄이치는 묘수 초기 단계라고 했음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 22:45", "comment_id": "reply_li_24648940", "parent_comment_id": "comment_li_24646789", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "우마는왕큰또", "text": "당장 이전화에 자기 묘수라고 함", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 23:26", "comment_id": "reply_li_24651112", "parent_comment_id": "comment_li_24646789", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "괜히 달인직전인게 아닌가 찐텐 나오니까 눈깔에서 달인빔 나오네", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 22:22", "comment_id": "comment_li_24647527", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러8(121.145) (121.145)", "text": "예전엔 켄이치의 망상이나 상상속에서만 가능했는데 후", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 22:25", "comment_id": "reply_li_24647707", "parent_comment_id": "comment_li_24647527", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "이시노선데이", "text": "잠깐이긴해도 달인 찍고 내려온 애라 앵간한 묘수들이랑은 급이 다르긴함ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 23:17", "comment_id": "reply_li_24650551", "parent_comment_id": "comment_li_24647527", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러6(121.169) (121.169)", "text": "애초에 미우 할배도 달인들 쏟아져 나온다 했으니 달인 바겐세일이겠지 -", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 22:25", "comment_id": "comment_li_24647725", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㆁㅋㄹ", "text": "사실 달인 되는 거... 존나 쉬운 거 아냐?!", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 22:25", "comment_id": "comment_li_24647726", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "1부에서 제자들 다구리에 털린 개좆밥 달인도 나왔기 때문에 단순히 달인 타이틀만 다는 건 생각보다 쉬울 가능성 있음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 22:29", "comment_id": "reply_li_24647938", "parent_comment_id": "comment_li_24647726", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "켄이치 혼자서 그 좆밥 달인 아직 못이김?   - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 22:35", "comment_id": "reply_li_24648336", "parent_comment_id": "comment_li_24647726", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.177) (211.177)", "text": "@ㅇㅇ 스펙만 따지면 제자대회 주최자 달인이 더 쎄긴 한데 초인이 달인한테 뒤지는 경우도 있으니까 켄이치가 으이지로 이길 수도 있겠지", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 22:38", "comment_id": "reply_li_24648544", "parent_comment_id": "comment_li_24647726", "dccon_source": "", "comment_img_sourc
