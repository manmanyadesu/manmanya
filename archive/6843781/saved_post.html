i_23287930", "parent_comment_id": "comment_li_23287846", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@야구부실눈빡빡이 기일전에 미리 빚을 갚아도 문제가 생겨?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 14:40", "comment_id": "reply_li_23287947", "parent_comment_id": "comment_li_23287846", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@야구부실눈빡빡이 ㅇㅇ 나중가면 원금의 1할만 갚을때도 그거대비로 이자계산하면 엄청 높다고 듣긴했는데결국 전체액수만 따지면 원금의 두배 이렇게 불어나는던 아니니까", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 14:41", "comment_id": "reply_li_23287969", "parent_comment_id": "comment_li_23287846", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "야구부실눈빡빡이", "text": "@ㅇㅇ(106.101) 기한의 이익은 채무자를 위해서 있으니까 미리 갚는 게 문제있는 게 아닌데 지금 경우는 어음을 되사는거고 매매는 너도 알다시피 매도-매수 합의가 있어야 함. 리베이트하우징이 미리 갚으려는게 돈떼먹으려는건데 지급기일 전에 변제하려고 하면 자기 당좌예금에 돈을 넣어두거나 공탁을 해야 하거든.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 14:43", "comment_id": "reply_li_23288062", "parent_comment_id": "comment_li_23287846", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "야구부실눈빡빡이", "text": "@야구부실눈빡빡이 그런데 당좌예금에 돈을 넣어뒀는데 변제가 먼저 돌아오는 채권이 있으면 그 채권이 변제되고 어음 지급기일에 돈이 부족해서 부도가 날 거 아님. 그래서 어음만 '회수'를 하는거야", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 14:44", "comment_id": "reply_li_23288099", "parent_comment_id": "comment_li_23287846", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@야구부실눈빡빡이 어음을 지급기한보다 먼저 회수해버리면 다른 채권자들이 손해 볼 수 있어서 그런가 지급기일에 변제하면 무조건 어음 받는건 맞는거지?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 14:48", "comment_id": "reply_li_23288271", "parent_comment_id": "comment_li_23287846", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러20(49.167) (49.167)", "text": "1금융권 대출도 중도상환수수료라는게 있는데 이것도 계약일 이전에 갚아버릴 경우 소정의 수수료를 요구힘 대출도 돈 빌려주는 대신 금리의 이자율로 수익을 올라는 사업이라서 그럼", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 14:50", "comment_id": "reply_li_23288345", "parent_comment_id": "comment_li_23287846", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@만갤러20(49.167) 오", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 14:50", "comment_id": "reply_li_23288365", "parent_comment_id": "comment_li_23287846", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "야구부실눈빡빡이", "text": "@ㅇㅇ(106.101) 변제했으면 채권자체가 무효가 되고 변제된 어음을 유통시키면 형사범죄임 ㅋㅋ 보통은 지급기일에 은행가서 지급제시하면 은행이 대금 지급하고 어음회수해서 빵꾸 뚫어서 폐기함어음만 미리 결제하면 다른 채권자들이 손해볼 수 있는 건 맞음. 책임재산이 먼저 줄어드니깐. 리베이트는 선결제날짜 이후 채권을 아예 띵겨먹을 생각이고", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 14:50", "comment_id": "reply_li_23288369", "parent_comment_id": "comment_li_23287846", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "야구부실눈빡빡이", "text": "@만갤러20(49.167) 얘 말이 원칙적으로 맞는데 이 건은 리베이트 하우징이 마지막 남은 1회차 상환을 하는 거라 잔존 이자가 없고 선결제하는 대신 이자를 덜내는 것도 아니라서 중도상환수수료 적용은 아님. 리베이트 아재가 다른 채권자들 물먹이려고 튀려는데 어음이 부도나면 나중에 문제되니까 어음만 처리하는거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 14:53", "comment_id": "reply_li_23288464", "parent_comment_id": "comment_li_23287846", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@야구부실눈빡빡이 1. 다른 채권자들은 어음 안가지고 있는 상황2. 지급기일이 다른 채권자보다 늦은 제국금융은 어음을 보유즁 3. 그래서 다른 채권자들에 돈을 갚으면 제국금융에 갚을 돈이 없어서 어음이 부도남 4. 사장은 부도어음을 막기위해 다른채권자에게 줄 돈을 제국금융에 줘서 어음 회수하고 다른채권자 돈은 안주고 잠적 정리하면 이 흐름이 맞음?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 14:56", "comment_id": "reply_li_23288657", "parent_comment_id": "comment_li_23287846", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "야구부
