 "11.05 20:28", "comment_id": "comment_li_23656571", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.144) (121.144)", "text": "의심을 하지 않는게 진정한 신뢰는 아니야, 의심을 해도 이 관계가 굳건하다고 믿고, 그 의심을 서로 전력으로 타파할 의지가 있는 관계가 진정한 신뢰 관계다.", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.05 20:31", "comment_id": "reply_li_23656679", "parent_comment_id": "comment_li_23656571", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(175.203) (175.203)", "text": "", "is_reply": false, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b651e2266e79fc0b482b5f70a198820b52524e32ef672151f3ea6de3f94c9d9cf788f772eb4fa7926d", "comment_img": "", "date": "11.05 20:35", "comment_id": "comment_li_23656810", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b651e2266e79fc0b482b5f70a198820b52524e32ef672151f3ea6de3f94c9d9cf788f772eb4fa7926d", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(61.84) (61.84)", "text": "\"왜 사람을 믿지 못하냐고? 믿고 싶기 때문에 의심하는 거야.\"", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.05 20:35", "comment_id": "comment_li_23656827", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇㅇ", "text": "\"퇴근하고 심심해서\" \"사람얼굴보면 돈빌려줄때 공부가 될거같아서\" \"티슈나눠주는 알바\"를 한다는게 보통 인간의 상식으로 되는 일인가싶네 ㅋㅋㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.05 20:37", "comment_id": "comment_li_23656908", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "너무 미친새끼라 사장이 당황하노 ㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.05 20:38", "comment_id": "comment_li_23656918", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "야구부실눈빡빡이", "text": "이거도 감상의 포인트인데 결국 척제에 대해 수용/거부 의사표시 안하고 기간만료로 땡쳐진거임. 당시 일본의 책임회피 문화를 제대로 보여준거고 아카신에서 뭔가 회신을 했으면 그게 오히려 현실하고 동떨어진 것", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.05 14:51", "comment_id": "reply_li_23644307", "parent_comment_id": "comment_li_23644228", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "저는 당시 버블붕괴로 말라가는 일본이 좀 느껴졌음 뭐 할 수 있는게 도저히 없으니까….", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.05 14:52", "comment_id": "reply_li_23644332", "parent_comment_id": "comment_li_23644228", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(222.98) (222.98)", "text": "@야구부실눈빡빡이 어떻게든 돈 땡겨와서 진흙탕싸움 할줄 알았더니 그냥 끝나서 어리둥절하네", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.05 14:53", "comment_id": "reply_li_23644342", "parent_comment_id": "comment_li_23644228", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "야구부실눈빡빡이", "text": "@ㅇㅇ(222.98) 아카신의 최선책은 척제 이의신청을 걸고 제국하고 협상을 하든 임차권 말소소송을 하든 건물을 지켜냈어야 함. 저 건물을 잃으면 땅작업 완료된 80%의 토지도 똥이 되니까. 그러려면 누가 책임을 지고 일을 추진해야 하는데 아무도 그러지 않는거임. 이건 비단 90년대 일본뿐 아니라 지금 한국에서도 종종 일어남. 아무 일도 안 하면 책임도 안 지거든", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.05 14:55", "comment_id": "reply_li_23644413", "parent_comment_id": "comment_li_23644228", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "아카신은 이제 대출 못해주는 시한부 신세에 모기업인 아카가이에서도 현금이 아닌 쓰레기같은 건물로 채권 회수하지 말라고 지랄하니 차장이랑 사장 둘 다 \"내가 채권 회수 포기하면 아카가이 너네가 뭘 할 수 있는데?\"라며 월급루팡 되어버렸잖음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.05 15:08", "comment_id": "reply_li_23644748", "parent_comment_id": "comment_li_23644228", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(220.67) (220.67)", "text": "한국도 내용증명 보냈는데 찢어버리거나 난 그거 받은적 없다고 둘러대도 2주 지나면 법적으로 권리 넘어감
