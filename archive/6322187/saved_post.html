mment_img": "https://lh3.googleusercontent.com/d/12K3LS8T3fxFvtSTUiDSgUu4yXD6mF7GC", "date": "09.23 14:40", "comment_id": "comment_li_21543932", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "곰빠이", "text": "괜찮네", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/12K3LS8T3fxFvtSTUiDSgUu4yXD6mF7GC", "date": "09.23 14:42", "comment_id": "comment_li_21544032", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(122.40) (122.40)", "text": "기대했던 루트대로라 맛있구나ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.23 14:49", "comment_id": "comment_li_21544318", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러41(121.182) (121.182)", "text": "한국은 곱상한 기생오래비상이 잘먹히는데 일본은 다르냐?", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.23 14:50", "comment_id": "comment_li_21544322", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(61.74) (61.74)", "text": "그런데 저렇게 화려한 수컷만 살아남는다 이거는 오히려 우생학을 반론하는 방증이기도 함수컷 공작이 화려한 깃털을 가져도 생존에 아무 문제 없다면 당연히 화려한 깃털을 가진 공작만 살아남지만 오히려 그게 과하면 멸종되는 동물도 있음생물 자체가 살아남은놈들이 강한놈들인거라 우리가 생각하는 상식선으로는 못생겼다라고 평가되는 사람이 거의 없어야 정상인데 그런 사람들도 자손을 남기고 살아남음그리고 아프리카나 이슬람권 사람들은 딱히 똑똑하지도 않고 멍청해도 출산율이 높아서 아시아인들보다 살아남을 가능성이 높음우생학의 근거대로라면 똑똑하고 잘생기고 우월한 사람들이 살아남아서 대를 이어야하는데 실제로는 반대라는거 살아남은놈들이 강한거임", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.23 14:56", "comment_id": "comment_li_21544575", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(61.74) (61.74)", "text": "실베에서 아무리 퐁퐁남이던 튀기소리하면서 매매혼을 하던 사실 생물학에선 이게 선이고 자손을 못남기고 뒤진놈들은 그냥 악임 어떻게든 적응해서 자손을 남은 애들이 결국 그런놈들만 득세하는거고 자손 못남기고 뒤지면 아무리 우월성, 도덕성 우월을 내세운들 그런놈들은 이미 뒤지고 없다 이거야", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.23 15:0
