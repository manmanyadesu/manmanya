ent_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "", "is_reply": false, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658ee2274c2e42ddbd8613832f072baa703cc019da61aed0a1988de35368e0d34c4199bba81b71c3d58c107715aa41d274cf15fb5ecb63ebb", "comment_img": "https://lh3.googleusercontent.com/d/1EvA2anOyBWUYw_TcTUM2J_LetborzLep", "date": "09.18 23:13", "comment_id": "comment_li_21303258", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658ee2274c2e42ddbd8613832f072baa703cc019da61aed0a1988de35368e0d34c4199bba81b71c3d58c107715aa41d274cf15fb5ecb63ebb", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "오른쪽 니킥 ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1EvA2anOyBWUYw_TcTUM2J_LetborzLep", "date": "09.18 23:13", "comment_id": "reply_li_21303264", "parent_comment_id": "comment_li_21303258", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.169) (121.169)", "text": "어차피 지금도 파트인데 다른거 하거나 그냥 주부 하면 되는거 아님?", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.18 23:15", "comment_id": "comment_li_21303341", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러15(121.161) (121.161)", "text": "", "is_reply": false, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65def246efb6df28dd4e36f7d0634ac3154e62f4064c2dea4045f6771305dc04b31a81adeddf55e9aaba8479d9df9b7ae16f85a787b984e65", "comment_img": "", "date": "09.18 23:20", "comment_id": "comment_li_21303596", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65def246efb6df28dd4e36f7d0634ac3154e62f4064c2dea4045f6771305dc04b31a81adeddf55e9aaba8479d9df9b7ae16f85a787b984e65", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(125.185) (125.185)", "text": "난 애초에 때리면 안된다는 말 자체가 이해가 안 감. 인간이 사회적 동물이라는 건 사건을 겪으면서 따라오는 원인과 결과를 본인 행동과 타인의 감정에 대한 이해로 적용시킬 수 있기 때문에 그렇게 불리는 건데, 본인 행동에 대한 결과의 상한선은 언제나 '목숨의 위협'인 게 당연한 거임. 이걸 단계적으로 가르치는 가장 빠른 방법이 폭력인건데 어화둥둥키우는 병신들 양산해내면 맨날 학교든 사회에서든 장애짓하고 남 깔보는 놈들 양산되는 거잖아. 폭력이 무엇인지 아는 사람만이 상대가 받는 폭력에 공감해줄 수 있는 거임", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.18 23:20", "comment_id": "comment_li_21303619", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(112.162) (112.162)", "text": "체벌 교육에 피해자가 있다는건 안타깝지만 어쩔수 없는 일이라고 본다체벌을 안했을때의 폐해가 훨씬 큼", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 23:30", "comment_id": "reply_li_21304142", "parent_comment_id": "comment_li_21303619", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "지메", "text": "안쳐맞고 자란 결과가 지금 1020 한녀잖아", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1msKzfCa782cI0x_GSAEC1g-xOGHvJ1-U", "date": "09.19 09:20", "comment_id": "reply_li_21322721", "parent_comment_id": "comment_li_21303619", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(61.84) (61.84)", "text": "ㄹㅇ", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.19 22:19", "comment_id": "reply_li_21354192", "parent_comment_id": "comment_li_21303619", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "저 세계관에 나같은 쉬었음이 설자린 없는거냐고 어이www", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1EvA2anOyBWUYw_TcTUM2J_LetborzLep", "date": "09.18 23:24", "comment_id": "comment_li_21303849", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(222.102) (222.102)", "text": "근데 뭐 구인배수 어쩌구 하면서 취업 그렇게 힘들다고 난리인데 이 만화 캐릭터들은 취업 다 쉽게 하는데? 좋은기업은 아니더라도", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.18 23:36", "comment_id": "comment_li_21304504", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "일본은 지금 취업이 너무 쉬움", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 23:39", "comment_id": "reply_li_21304703", "parent_comment_id": "comment_li_21304504", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "저번의 지하 아이돌은 만화의 전개를 위해서 취업을 하기 어렵게 묘사가 된거지실제로는 그런 사람들도 충분히 취업이 가능함", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 23:41", "comment_id": "reply_li_21304840", "parent_comment_id": "comment_li_21304504", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(222.102) (222.102)", "text": "@ㅇㅇ(118.235) 일본이 더 살기 좆같다 그러던데", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 23:42", "comment_id": "reply_li_21304868", "parent_comment_id": "comment_li_21304504", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(222.102) 그러한 의견은 큰 의미가 없음사람마다 학력, 자본, 환경이 다르잖아", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 23:44", "comment_id": "reply_li_21305005", "parent_comment_id": "comment_li_21304504", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러20(221.188) (221.188)", "text": "@ㅇㅇ(118.235) 일본 취업이 쉬운건 맞는데, 선호 직군으로 가면 구인배수 1 미만으로 떨어지는곳도 있더라", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.19 00:31", "comment_id": "reply_li_21307737", "parent_comment_id": "comment_li_21304504", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러20(221.188) (221.188)", "text": "@ㅇㅇ(118.235) 예를들어 사무직, 예술직 반대로 건설, 운전등 이런건 남아돌고", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.19 00:31", "comment_id": "reply_li_21307797", "parent_comment_id": "comment_li_21304504", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.135) (121.135)", "text": "그래서 공부 잘하고 열심히 한 철도박이 한명 빼고 지금까지 씹창 경로 열려있는 직업만 나오자너", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.19 04:28", "comment_id": "reply_li_21316205", "parent_comment_id": "comment_li_21304504", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(183.104) (183.104)", "text": "@ㅇㅇ(222.102) 쟤네 실질임금 자체는 우상향이라 인식에 비해 그리 살기어렵진않음", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.19 09:44", "comment_id": "reply_li_21323360", "parent_comment_id": "comment_li_21304504", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러30(211.244) (211.244)", "text": "일본은 사람이 부족해서 취직은 존나 쉽다던ㄷ", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.19 15:41", "comment_id": "reply_li_21335828", "parent_comment_id": "comment_li_21304504", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(112.147) (112.147)", "text": "때리지마 그럼 나도 때릴거야 이런거 솔직히 발달느리고 좀 떨어지는애들한테 딱 맞는수준의 보육같음...", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.18 23:37", "comment_id": "comment_li_21304638", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(14.7) (14.7)", "text": "남을 팼는데 똑같이 안돌아오고 처벌 지지부진 훈방조치되면 선빵날리는게 이득이구나 하는 학습을 하지.. 애들뿐만아니라 다 큰년들한테서도 흔히 보임", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.19 00:01", "comment_id": "reply_li_21305899", "parent_comment_id": "comment_li_21304638", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러17(211.212) (211.212)", "text": "말로해서 들어먹는 놈이 있고 매를 들어야 들어먹는 놈이 있고 매를 들어도 소용이 없는 놈이 있다 인간이 다 다른데 방식을 불법이라면서 제한을 걸어버리니 그 틀안에 못 들어오는 놈들은 그냥 배제하고 방치할수밖에 없음 그 새끼들 교육 시키다가 짤리거나 문 닫아야 되니까", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.18 23:37", "comment_id": "comment_li_21304639", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러17(211.212) (211.212)", "text": "이거 어린애뿐만 아니라 노인이나 장애인도 마찬가지임 남한테 피해를 주는데 제지를 못하면 정상적인 시설에선 꺼지라고 할 수밖에 없게됨 결국 그런 놈들 받아주는 건 학대 좆되는 시설밖에 안 남게 되고", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 23:40", "comment_id": "reply_li_21304795", "parent_comment_id": "comment_li_21304639", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(61.76) (61.76)", "text": "중국에 태어나기 vs 일본에서 태어나기", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.18 23:49", "comment_id": "comment_li_21305253", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "중국에서 대도시의 후커우를 가지고 살아가는 사람이랑 농민공으로 살아가는 사람은 너무 심하게 차이가 있어서 이렇게 말하면 충분하지않음사실상 다른 국가에서 살아가는 수준임", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 23:53", "comment_id": "reply_li_21305473", "parent_comment_id": "comment_li_21305253", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "먹구름먹방", "text": "저 나이 때 애들은 기본이 '자기중심적'임. 무시하는 게 아니라 진짜로 뇌 발달이 그 정도까지 밖에 안 됨. 훈육이 하나도 없다는 건 말이 안 되지", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1EvA2anOyBWUYw_TcTUM2J_LetborzLep", "date": "09.19 00:02", "comment_id": "comment_li_21305979", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(119.197) (119.197)", "text": "체벌을 못하면 얼차려라도 좀 시켜보든가", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.19 00:02", "comment_id": "comment_li_21306005", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "도그풋", "text": "", "is_reply": false, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65fec2d6ea4eeaad21e3411f436de7eac3227167c2190e8acd00e0833827416a208bd311d1ee7b9cf84a8c10028234a4b89fd07dd511aea", "comment_img": "https://lh3.googleusercontent.com/d/1msKzfCa782cI0x_GSAEC1g-xOGHvJ1-U", "date": "09.19 00:16", "comment_id": "comment_li_21306742", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65fec2d6ea4eeaad21e3411f436de7eac3227167c2190e8acd00e0833827416a208bd311d1ee7b9cf84a8c10028234a4b89fd07dd511aea", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.200) (211.200)", "text": "시골 할배가 개 패는것처럼 기르면 초등학교 졸업할 나이에도 타인 인지 능력이 안생기더라, 남 눈치 보는거만 모르는게 아니라 지 감정도 몰라서 지가 때려놓고 왜 때렸는지 설명도 못함남의 감정 설명해주기 이걸 그 전설의 미운네살 앞뒤로 2년씩 넉넉잡아 7살까지 한 5년은 반복해야하는데설명충짓도 철저하게 1인칭으로 해야 알아먹을까 말까해서 부모 아니면 못할 짓임...근데 보육교사면 좀 해라", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.19 00:22", "comment_id": "comment_li_21307138", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "보추마니아", "text": "말로 해서 말듣는건 나이 두자리수부터임 그전까지는 걍 파충류 수준이고.훈련을 안시키면 몸이랑 마음은 인간인데 충동조절은 파충류 수준 그대로 크는거임", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1msKzfCa782cI0x_GSAEC1g-xOGHvJ1-U", "date": "09.19 00:52", "comment_id": "comment_li_21308933", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러23(59.166) (59.166)", "text": "했제충 시동 ON ㅋㅋㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.19 00:52", "comment_id": "comment_li_21308958", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "Embrio", "text": "", "is_reply": false, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65cec2c6e5614e22240c116b72 ment_img": "https://lh3.googleusercontent.com/d/1vW9lrla19ifSZx49whPBHdyQHEEfc2A2", "date": "09.21 00:48", "comment_id": "reply_li_21418349", "parent_comment_id": "comment_li_21297258", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "", "is_reply": true, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65cea226e259ebfe3ba5043ce8ae3bab5b6d5121618176148143cce95fea5ca4bf9302c67e2b4ff6cec52", "comment_img": "https://lh3.googleusercontent.com/d/1vW9lrla19ifSZx49whPBHdyQHEEfc2A2", "date": "09.21 00:49", "comment_id": "reply_li_21418357", "parent_comment_id": "comment_li_21297258", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65cea226e259ebfe3ba5043ce8ae3bab5b6d5121618176148143cce95fea5ca4bf9302c67e2b4ff6cec52", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.141) (121.141)", "text": "호빠 애는 죽느냐가 문제였고 여긴 죽이느냐가 문제네 ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.19 11:46", "comment_id": "comment_li_21326925", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(119.70) (119.70)", "text": "인간도 동물이라 말이 안통하면 패야되긴 해 중범죄 저지르면 살처분이 맞고", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.19 12:23", "comment_id": "comment_li_21328323", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "개소리하는 병신들 많네 안때리고도 애 잘만 키운다 그냥 그 방법보다 때리는게 훨씬 쉽고 간편하니까 때리는거지", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1vW9lrla19ifSZx49whPBHdyQHEEfc2A2", "date": "09.19 13:05", "comment_id": "comment_li_21329898", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그리고 애새끼 때려서 교육시켜야한다는 병신들은 나중에 자식새끼한테 쳐맞아도 질질 짜지마라", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1vW9lrla19ifSZx49whPBHdyQHEEfc2A2", "date": "09.19 13:05", "comment_id": "reply_li_21329920", "parent_comment_id": "comment_li_21329898", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "리오넬첼시", "text": "안 떼리고도 잘 크는 아이가 있고 체벌 아니면 말 절대 안 듣는 아이도 있는데 뭔. 이상론 좀 그만 믿어라", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1CNMe_YuBBJDGGP32JwUZ1XbCRL-Q1Bie", "date": "09.19 13:50", "comment_id": "reply_li_21331611", "parent_comment_id": "comment_li_21329898", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "3~7세라면 체벌을 사용하지 않는 쪽이 더 중요합니다. 이 시기 아이들은 충동 조절, 감정 조절, 원인과 결과를 길게 생각하는 능력이 아직 발달 중이라서, 맞는다고 해서 “왜 하면 안 되는지”를 성인처럼 내면화하는 것이 아닙니다. WHO는 특히 2~4세 어린아이도 체벌에 많이 노출되며, 체벌이 시간이 지나면서 행동문제와 공격성 증가 등과 연결되고 긍정적인 발달 효과는 확인되지 않는다고 정리하고 있습니다.", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1vW9lrla19ifSZx49whPBHdyQHEEfc2A2", "date": "09.19 13:13", "comment_id": "comment_li_21330225", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "3~7세의 편식은 흔한 발달 현상이고, 미국소아과학회(AAP)도 이 연령에서는 음식을 계속 제공하되 먹도록 강요하거나 먹지 않았다고 처벌하지 말라고 권고합니다. 오히려 식사 압박이 음식 자체에 대한 거부감을 강화할 수 있습니다.", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1vW9lrla19ifSZx49whPBHdyQHEEfc2A2", "date": "09.19 13:16", "comment_id": "reply_li_21330338", "parent_comment_id": "comment_li_21330225", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "아이가 울고 있는데 “언제까지 울 거야”, “적당히 좀 해”, “그런 애는 산책 안 가도 돼, 놓고 갈 거야”라고 하는 것은 행동을 가르치는 것보다 불안과 두려움을 이용해 복종시키는 방식에 가깝습니다. 특히 어린아이에게 자신만 두고 간다는 식의 말을 반복적으로 사용하는 것은 보육교사와 아이 사이의 신뢰 형성에 좋지 않습니다.", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1vW9lrla19ifSZx49whPBHdyQHEEfc2A2", "date": "09.19 13:16", "comment_id": "reply_li_21330350", "parent_comment_id": "comment_li_21330225", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "이 교사는 아이의 행동을 교정할 때 거의 계속해서 공포, 큰소리, 박탈, 위협, 강제력을 사용하고 있습니다. 이런 방식은 당장 아이를 조용하게 만들 수는 있습니다. 그러나 “왜 그러면 안 되는가”를 배우게 하기보다는 “이 선생님을 화나게 하면 큰일 난다”를 학습시키기 쉽습니다.", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1vW9lrla19ifSZx49whPBHdyQHEEfc2A2", "date": "09.19 13:17", "comment_id": "reply_li_21330386", "parent_comment_id": "comment_li_21330225", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "같은 상황이라도 예컨대 식사는 “안 먹어도 괜찮지만 다음 식사 때까지 간식은 없어”, 폭력은 “사람을 때리면 바로 놀이에서 분리한다”, 위험한 행동은 “지금은 위험해서 선생님이 막을 거야”처럼 단호하지만 고통이나 공포를 벌로 사용하지 않는 방식이 가능합니다.", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1vW9lrla19ifSZx49whPBHdyQHEEfc2A2", "date": "09.19 13:18", "comment_id": "reply_li_21330420", "parent_comment_id": "comment_li_21330225", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "리오넬첼시", "text": "@ㅇㅇ 다른 아이 간식 뺏어먹으면? 혼자 놓아도 상관 없는 아이면? 분리해봤자 욕하고 난리치고 이이나 어른 때리면서 반항하면? 말로만 하면 절대 그 이상 없다는 거 알고 어른 우습게 보는 영악한 아이도 있는데 네가 못 봐서 그런 태평한 소리 할 수 있는 거", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1CNMe_YuBBJDGGP32JwUZ1XbCRL-Q1Bie", "date": "09.19 13:53", "comment_id": "reply_li_21331737", "parent_comment_id": "comment_li_21330225", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "연애서큘레이션", "text": "@리오넬첼시 예외는 예외에따라 또다른 솔루션이 있겠다만 현실에서 적용하기 힘든게 문제겠지 애새끼들 존나게 많아서 하나하나 시간을들여 어캐 알맞게 예외 솔루션을 적용시키노 그게 되면 오은영되는거고 안되면 그냥 평범한 보육하는 사람이지뭐 ㅋㅋ  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1CNMe_YuBBJDGGP32JwUZ1XbCRL-Q1Bie", "date": "09.19 14:32", "comment_id": "reply_li_21333256", "parent_comment_id": "comment_li_21330225", "dccon_source": "", "c
