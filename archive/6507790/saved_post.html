_id": "comment_li_22141665", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "건메이커 이제 리미터 풀려버린건가 원래도 막나가지만 여친 이 그나마 억제기 역할 해줬는데", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1SEdR7P-XgyiLpm5XpmW1qfg7QOBhhGKT", "date": "10.05 02:00", "comment_id": "comment_li_22141681", "parent_comment_id": ""}, {"writer": "ㅁㅁ(61.72) (61.72)", "text": "더이상 미쳐날뛰면 수녀랑 더 갈등만 깊어지는데 수녀년은 눈에안띄게 살고싶은데 건메이커가 미쳐날뛰면 날뛸수록 위치 특정되서 공격받기 쉬워지니", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.05 02:57", "comment_id": "reply_li_22143409", "parent_comment_id": "comment_li_22141681"}, {"writer": "만갤러15(119.204) (119.204)", "text": "내가 추리가 맞았군. 엘프=개트롤이거 못맞춘 만붕이들은 현시간 부로 갤을 떠나시오.", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.05 02:00", "comment_id": "comment_li_22141691", "parent_comment_id": ""}, {"writer": "만갤러15(119.204) (119.204)", "text": "엘프 처음 등장할때 개쩐다고 했던 만붕이들은숨을 5분간 참으시오이 만력 낮은 한심한 놈들", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.05 02:01", "comment_id": "reply_li_22141729", "parent_comment_id": "comment_li_22141691"}, {"writer": "ㅇㅇ", "text": "저 세계 입장에선 개트롤은 아니지타니아 없으면 전생자에 의해 언제 멸망해도 모를세계인데 아들이 살 평화로운 세계를 유지시킨다는명분으로 위험 요소를 싹 다 제거하고세계를 조율해주는데불행한 건 아들이 나타날때 까지 무한굴레에 빠진자기 자신과 가문뿐임", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1SEdR7P-XgyiLpm5XpmW1qfg7QOBhhGKT", "date": "10.05 06:55", "comment_id": "reply_li_22148063", "parent_comment_id": "comment_li_22141691"}, {"writer": "ㅇㅇ", "text": "동기가 불순한거지 언제 트롤을 했다는거임?", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1SEdR7P-XgyiLpm5XpmW1qfg7QOBhhGKT", "date": "10.05 12:36", "comment_id": "reply_li_22157015", "parent_comment_id": "comment_li_22141691"}, {"writer": "ㅇㅇ(223.38) (223.38)", "text": "아들 전생모습 보면 그리기 좋아하고 방에 장난감도 많은데보통 전생후 행적도 전생전이랑 비슷하게 가는거보면예전에 뭣모르고 장난감만들던 특급전생자였을지도 모르지", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.05 02:01", "comment_id": "comment_li_22141 .251) (203.251)", "text": "설정 탄탄하노", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.05 02:11", "comment_id": "comment_li_22142067", "parent_comment_id": ""}, {"writer": "ㅇㅇ(39.113) (39.113)", "text": "재밌구려", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.05 02:13", "comment_id": "comment_li_22142129", "parent_comment_id": ""}, {"writer": "SOCOM", "text": "처음부터 타니아는 주인공쪽이랑 거리가 멀긴 했지", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1n2MWpguVdQTFSG9ZttGiBVWz3YX94Huw", "date": "10.05 02:16", "comment_id": "comment_li_22142237", "parent_comment_id": ""}, {"writer": "만갤러19(124.49) (124.49)", "text": "보다보니까 이세계는 그냥 현세계의 쓰레기통 같아요", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.05 02:16", "comment_id": "comment_li_22142244", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "처음부터 개 똥이긴 했음 ㅋㅋ 웬 전생자가 가스풀어서 이세계 멸망시키고 섬하나 남겨서 겨우 섬 하나에서 복작거리면서 살아간다는 설정, 근데 그 섬에서도 전생자 새끼가 웬 종교 만들고, 마소 만들어서 마법 난사하고, 레거시 유물 만들고, 마법몬스터 난립하고, 지들끼리 존나싸우게 만들고, 전부 전생자들이 한 짓들", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1SEdR7P-XgyiLpm5XpmW1qfg7QOBhhGKT", "date": "10.05 02:19", "comment_id": "reply_li_22142328", "parent_comment_id": "comment_li_22142244"}, {"writer": "BlackHunter", "text": "오랜만에 봐서 그런가저 엘프도 전생자고 혈계 제일위에놈빼곤 전생자가 아닌 순수한 자식이라는건데 자식취급이아니다 그건가", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1SEdR7P-XgyiLpm5XpmW1qfg7QOBhhGKT", "date": "10.05 02:19", "comment_id": "comment_li_22142334", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "타니아 본체가 진짜 자식취급하는건 전생아들 하나뿐인거 같음", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1SEdR7P-XgyiLpm5XpmW1qfg7QOBhhGKT", "date": "10.05 02:20", "comment_id": "reply_li_22142368", "parent_comment_id": "comment_li_22142334"}, {"writer": "BlackHunter", "text": "@ㅇㅇ 아나타가 타니아 첫분신아닌가? 25짤에 왜 아나타한테 간다고 하는거지?", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1SEdR7P-XgyiLpm5XpmW1qfg7QOBhhGKT", "date": "10.05 02:29", "comment_id": "reply_li_22142606", "parent_comment_id": "comment_li_22142334"}, {"writer": "ㅁㅁ(61.72) (61.72)", "text": "애초에 목적이 전생의 자식을 다시 만나는건데 지가 낳은 자식한테 마음 쏟는순간 전생의 자식이 흐려지니까 그거 다 배제하는거", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.05 02:42", "comment_id": "reply_li_22143006", "parent_comment_id": "comment_li_22142334"}, {"writer": "ㅁㅁ(61.72) (61.72)", "text": "@BlackHunter 그거 원본은 본체(타니아) 라고 써있음", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.05 02:45", "comment_id": "reply_li_22143084", "parent_comment_id": "comment_li_22142334"}, {"writer": "Posyel", "text": "@BlackHunter 아", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1n2MWpguVdQTFSG9ZttGiBVWz3YX94Huw", "date": "10.05 02:48", "comment_id": "reply_li_22143178", "parent_comment_id": "comment_li_22142334"}, {"writer": "Embrio", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1nOgJjhepETKxHwHoX6dLuwgb6ylv2eVZ", "comment_img": "https://lh3.googleusercontent.com/d/1n2MWpguVdQTFSG9ZttGiBVWz3YX94Huw", "date": "10.05 02:19", "comment_id": "comment_li_22142341", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "저 시조 여자 엘프는 현실에서 크킹 플레이 하는 느낌으로 사는 거네. 나도 크킹 게임에서는 자기후손들이라도 오로지 하나의 목적을 위해서 도구로만 쓰니까. 크킹에서는 그 후손들 느낌은 우호도 하나만으로 표시가 되지만, 실제 당사자 입장에서는 ㅈ 같기도 하겠지", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1SEdR7P-XgyiLpm5XpmW1qfg7QOBhhGKT", "date": "10.05 02:21", "comment_id": "comment_li_22142377", "parent_comment_id": ""}, {"writer": "아자차카타파하", "text": "나 아직 크킹 안 해봤는데, 그 게임은 뭐가 목표임?", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1n2MWpguVdQTFSG9ZttGiBVWz3YX94Huw", "date": "10.05 07:05", "comment_id": "reply_li_22148180", "parent_comment_id": "comment_li_22142377"}, {"writer": "ㅇㅇ", "text": "@아자차카타파하 걍 가문원 많고 황제나 왕위에 가문원 올라가있으면 점수 올라감근데 꼭 거기에 연연할 필요는 없는 중세심즈 느낌", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1SEdR7P-XgyiLpm5XpmW1qfg7QOBhhGKT", "date": "10.05 07:33", "comment_id": "reply_li_22148568", "parent_comment_id": "comment_li_22142377"}, {"writer": "ㅇㅇ", "text": "이거 뭐 주인공이 이길수있긴함?", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1SEdR7P-XgyiLpm5XpmW1qfg7QOBhhGKT", "date": "10.05 02:21", "comment_id": "comment_li_22142397", "parent_comment_id": ""}, {"writer": "ㅁㅁ(61.72) (61.72)", "text": "쥔공한테 최강무기 핵폭탄 하나 남아있긴 해 ㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.05 07:24", "comment_id": "reply_li_22148443", "parent_comment_id": "comment_li_22142397"}, {"writer": "ㅇㅇ(175.124) (175.124)", "text": "다른건 괜찮은데 주인공팀이 진짜 쓸모가 없네 계속 장기말로 쓰이기나하지 주도적으로 뭘 할만한 머리도 능력도 없다보니심지어 주인공이 별로 매력이 없으니까 딱히 응원하고 싶은 생각이나 기대도 안댐...", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.05 02:22", "comment_id": "comment_li_22142406", "parent_comment_id": ""}, {"writer": "ㅇㅇ(39.113) (39.113)", "text": "주인공 쓸모없다거나 별로 매력없다는건 만안분같은 소리노 주인공답게 제일 선해서 전생자 중 제일 쎈 근육게이 제거에 제일 도움됐겄만", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.05 02:27", "comment_id": "reply_li_22142557", "parent_comment_id": "comment_li_22142406"}, {"writer": "ㅁㅁ(61.72) (61.72)", "text": "주인공이 사람 목숨 벌레처럼 취급하는 저 만화속 몇없는 선인 포지션이라 역할은 충분한데", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.05 02:47", "comment_id": "reply_li_22143155", "parent_comment_id": "comment_li_22142406"}, {"writer": "dd", "text": "가장 사람으로서 있어서 상황이 그나마 이렇게 곱게 흘러간건데 뭔소릴", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1SEdR7P-XgyiLpm5XpmW1qfg7QOBhhGKT", "date": "10.05 09:49", "comment_id": "reply_li_22151560", "parent_comment_id": "comment_li_22142406"}, {"writer": "ㅇㅇ(121.161) (121.161)", "text": "평범한사람들이 주류인 만화에선 노매력인데 주변이 다 미친놈들이라 오히려 주인공의 매력이 살아남 ㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.05 11:37", "comment_id": "reply_li_22154850", "pa , "is_reply": true, "dccon": "", "comment_img": "", "date": "10.05 01:50", "comment_id": "reply_li_22141193", "parent_comment_id": "comment_li_22141069"}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
