g_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.36) (211.36)", "text": "자기 복싱완성하는게 목적이라고 했고 자기 펀치가 약하다고ㅜ했는데 그거 보완하고 완성형만든게 지금 스타일인거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 14:55", "comment_id": "reply_li_23069722", "parent_comment_id": "comment_li_23048562", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러29(175.196) (175.196)", "text": "난 이번화로 아마다가 오히려 달리 보이네. 기고만장한 천재인줄 알았는데, 쿄고쿠한테 의외로 털리면서도 침착하다. 역시 무에타이계 정점에 오른 베테랑이다 싶고, 다음화에서 아마다가 또 다른 모습을 보여주지 않을까.", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.23 00:42", "comment_id": "comment_li_23048608", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "나보기가역겨워", "text": "오...", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 01:05", "comment_id": "reply_li_23049354", "parent_comment_id": "comment_li_23048608", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(39.115) (39.115)", "text": "결국은 아마다가 올라가지 않겠나 싶네", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 08:46", "comment_id": "reply_li_23058681", "parent_comment_id": "comment_li_23048608", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러29(175.196) (175.196)", "text": "반죠 회장은 저번화에는 아마다 보고 입 쩍 벌리더니 이번화에는 또 별거 아니라그러네. 이 아저씨가 그러니까 다음화에서 아마다 각성해서 쿄고쿠 패버릴거같은데.", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.23 00:43", "comment_id": "comment_li_23048643", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "카우맨", "text": "", "is_reply": false, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b650ef276e416d2035f33b3c18eac6f7bc6ab356086a3cf974d96c05ea93bfb637c3d387584352faa0", "comment_img": "", "date": "10.23 00:46", "comment_id": "comment_li_23048736", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b650ef276e416d2035f33b3c18eac6f7bc6ab356086a3cf974d96c05ea93bfb637c3d387584352faa0", "comment_img_source": "", "comment_media_version": 2}, {"writer": "양말", "text": "역시 리치가 길면 먹고 들어가는구나", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.23 00:57", "comment_id": "comment_li_23049123", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러28(222.237) (222.237)", "text": "아무래도 그렇지 인앤아웃 확실한 프로끼리면 더 크게 다가올듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 01:18", "comment_id": "reply_li_23049676", "parent_comment_id": "comment_li_23049123", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "설명해줌. 복싱장에 가면 보통 '오른손잡이야? 너 오소독스.' '왼손잡이야? 너 사우스포.'하고 가르침. 한국에선 아예 오소독스,사우스포를 오른손잡이,왼손잡이로 부르거나 번역하기도 하는데,이러면 안됨. 손잡이와 자세는 늘 일치하는게 아님. 주손과 주자세가 정반대일때도 있음. 특히 오른손잡이가 사우스포를 하는 경우들이 꽤 있음. 그것도 최정상급 선수들에서.", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.23 01:51", "comment_id": "comment_li_23050706", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "한여울지미", "text": "", "is_reply": true, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65ceb226efab7c9bf3b906ea30e5091e73daa2507c963a1ece28fbed53827c991b1c3f71e6ba580c609a0e067c9278ebd57b00c9c55119e304761", "comment_img": "", "date": "10.23 02:00", "comment_id": "reply_li_23051014", "parent_comment_id": "comment_li_23050706", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65ceb226efab7c9bf3b906ea30e5091e73daa2507c963a1ece28fbed53827c991b1c3f71e6ba580c609a0e067c9278ebd57b00c9c55119e304761", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "헤글러,크로포드,로마첸코. 세명 모두 전설급 선수들이자, 세명 모두 오른손잡이로 태어나 주자세를 사우스포로 선택한 선수들임.'오른손잡이로 태어났는데 사우스포로 갔다고? 왜?' 장점이 분명하기 때문임. 오소독스든,사우스포든 복싱에서 가장 많이 쓰는 손은 앞손임. 뒷손보다 앞손을 더 씀. 앞손으로 잽을 날리고 앞손훅을 뒷손훅보다 더 많이 씀.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 02:01", "comment_id": "reply_li_23051029", "parent_comment_id": "comment_li_23050706", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "만약 자신의 주된 손을 앞손으로 쓴다? 더 강한 잽, 더 강한 앞손훅을 쓸수 있게 되는거.오른손잡이가 사우스포가 되어 오른손을 앞손으로 쓰게 되면 이런 이점이 생기는거. 그래서 전설적 선수들이 주손과 자세를 정반대로 설정하는 경우들이 나온거. 그럼 장점이 이렇게 큰데 대다수 선수들은 왜 이렇게 안할까? 어려우니까. 타고난 본능을 거슬러야하니까.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 02:06", "comment_id": "reply_li_23051164", "parent_comment_id": "comment_li_23050706", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "드디어 왔구나", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 02:07", "comment_id": "reply_li_23051208", "parent_comment_id": "comment_li_23050706", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "주손과 주발을 뒷손,뒷발로 하는건 인간의 본능임. 우리가 살아온 시간동안 뇌도 그렇게 회로가 짜여져있음. 이걸 거스르려면 엄청난 노력은 당연함. 더 중요한 것은 지능. 본능대로 반응하지 않는 길로 간 이상 높은 지능이 필요함. 끊임없이 머리를 쓰며 싸워야함. 이길로 갈거면 멍청해선 높히 못올라감. 여기서 급이 나뉨.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 02:13", "comment_id": "reply_li_23051388", "parent_comment_id": "comment_li_23050706", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "현역에서 굉장히 똑똑하기로 유명한 두 선수가 있는데,샤커 스티븐슨과 우식. 이 두선수 역시 오른손잡이 사우스포임.읽다보면 이런 생각이 들거. '와,오른손잡이 사우스포들은 다 똑똑이들만 있나? ㄷㄷ' 아님. 똑똑하지 않은 오른손잡이 사우스포들은 높히 올라갸지도 못한거임. 똑똑하지 않은데 이 길로 가면 멀리 가지도 못함.장점이 있는만큼 리스크도 분명함.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 02:24", "comment_id": "reply_li_23051672", "parent_comment_id": "comment_li_23050706", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러32(182.220) (182.220)", "text": "@ㅇㅇ(220.124) 이거보고 복스 자세잡아보니까 진짜 그러네", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 02:27", "comment_id": "reply_li_23051741", "parent_comment_id": "comment_li_23050706", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "연오", "text": "", "is_reply": true, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65ceb226efab7c9bf3b906ea30e5091e73daa2507c963a1ece28fbed53827c991b1c3f71e6ba580c609a0e067c9278ebd57b00c9c521e9e304761", "comment_img": "", "date": "10.23 02:47", "comment_id": "reply_li_23052263", "parent_comment_id": "comment_li_23050706", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65ceb226efab7c9bf3b906ea30e5091e73daa2507c963a1ece28fbed53827c991b1c3f71e6ba580c609a0e067c9278ebd57b00c9c521e9e304761", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러31(211.207) (211.207)", "text": "노력만으로는 컨트롤이 안되는 영역인건가", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 04:43", "comment_id": "reply_li_23054622", "parent_comment_id": "comment_li_23050706", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러31(211.207) (211.207)", "text": "펀도라가 쿄코쿠 모티브되는 복서라 했는데복싱스타일만 모티브로 한거고 저 일시적 스위치는쿄코쿠만의 스타일?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 04:53", "comment_id": "reply_li_23054776", "parent_comment_id": "comment_li_23050706", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러36(121.184) (121.184)", "text": "반대로 하는 경우가 정상급에 있었노", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 07:05", "comment_id": "reply_li_23056727", "parent_comment_id": "comment_li_23050706", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "지난화 설명까지 합쳐서 생각하면 헤글러가 오른손 사우스포에 스위치까지 가능했으니 쿄고쿠는 펀도라를 기반으로 헤글러를 살짝 섞어넣은 캐릭터라고 보면 되나? 근데 오른손 사우스포가 본능을 거스르는 노력을 하면서까지 강력한 앞손을 얻었다 해도 상대적으로 빈약한 뒷손이라는 건 약점일 것 같은데, 이 부분은 거의 부각되는 일이 없음?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 09:05", "comment_id": "reply_li_23059171", "parent_comment_id": "comment_li_23050706", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ 그래서 대부분은 다 실패함 어중간해서 공수 둘다 개털리는게 대다수 뭐 스위치하는것도 주손 잽이 단점을 씹어먹을만큼 강해서 그렇다기보단 그냥 사우스포가 상대입장에서 가장 상대하기 불편한 거라 선택하는거임 결국 다 잘해야하는 전제에서 시작되는거고, 크로포드도 사우스포에서 잽으로 요리하다 공격박을땐 오소독스 들어감", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 09:37", "comment_id": "reply_li_23060037", "parent_comment_id": "comment_li_23050706", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러41(1.246) (1.246)", "text": "@ㅇㅇ(220.124) 오 자연스러운거라 이런 것은 생각 못해봤네", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 09:54", "comment_id": "reply_li_23060495", "parent_comment_id": "comment_li_23050706", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "@만갤러31(211.207) 펀도라가 쿄고쿠 모티브일거라 생각한건 사우스포 + 패전 이후 스타일 변화인데,각다귀 체형만 놓고보면 페더급에 한 선수가 있음. 라파엘 에스피노자라고 페더급인데도 키 185cm로 늘 상대보다 ㅈㄴ 큰 선수임. 오소독스에 무패라 안맞는데,아마 이것저것 다 섞어서 넣은게 아닌가 싶음. 이거외에 각다귀 선수 몇명 더 섞은듯. 더 봐야 알겠지", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 10:47", "comment_id": "reply_li_23061928", "parent_comment_id": "comment_li_23050706", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "@ㅇㅇ 헤글러랑은 전혀 성격이 다름. 헤글러는 제외해도 됨. 쿄고쿠는 좀더 봐야 알듯. 이번화 묘사보면 커리어 도중에 오소독스에서 사우스포로 바꾼것 같은데 이런 경우들은 정말 드물어서. 그리고 저 선수들은 모두 뒷손도 강했음. 오른손잡이 사우스포 레전드 선수들은 일반 사우스포만큼이나 왼손 뒷손이 강했음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 10:51", "comment_id": "reply_li_23062016", "parent_comment_id": "comment_li_23050706", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러43(118.235) (118.235)", "text": "욘다 회장이 저런 복싱이 있냐면서 어떻게 이기냐하는데 그정도로 사기적인거야?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 11:16", "comment_id": "reply_li_23062720", "parent_comment_id": "comment_li_23050706", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(220.124) 그러면 프로 아마추어 이런 경기 뛰는 목적이 아닌 순수 운동으로 복싱을 배우는 사람은 자기 원래 손과 반대 손을 주손 주자세로 잡아서 운동하면 나름 균형있는 발전이 가능한거야?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 12:00", "comment_id": "reply_li_23064171", "parent_comment_id": "comment_li_23050706", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.131) (118.131)", "text": "확실히 왼손으로 잽날리다 오른손 훅은 ㅈㄴ 자연스러운데 왼손훅은 감도안온다", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 14:31", "comment_id": "reply_li_23069028", "parent_comment_id": "comment_li_23050706", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.234) (211.234)", "text": "@ㅇㅇ 복싱적으로 보면 이도저도아니게 되는경우가 많음그래서 일반적으로 그렇게 안가르치는거", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 14:54", "comment_id": "reply_li_23069710", "parent_comment_id": "comment_li_23050706", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러46(106.101) (106.101)", "text": "", "is_reply": true, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65fe3256e36cb6e6890d3d25b44822f48b0282490610773acf3fc157a66f4f695f194095107b4f7cbcfe06cb8", "comment_img": "", "date": "10.23 15:53", "comment_id": "reply_li_23071706", "parent_comment_id": "comment_li_23050706", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65fe3256e36cb6e6890d3d25b44822f
