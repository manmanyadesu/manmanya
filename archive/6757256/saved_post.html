.101) (106.101)", "text": "@먹구름먹방 이 병신은 진짜 갈피를 못잡네. 네가 직업인게 말이 안된다면서? 직업이 되려면 의뢰인이 많고 수입이 안정되어야한다면서? 내가 계속 거기에 대해 말했는데 왜 자꾸 이상한 소리함? 천대받는건 왜 계속 끌고오는거임?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 04:39", "comment_id": "reply_li_23014894", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "먹구름먹방", "text": "@ㅇㅇ(106.101) 니가 귀족, 상인, 모험가도 의뢰 많이 하니까 수입 안정적이라며. 근데 목숨 걸고 지인을 자기들것으로 보내주었는데 그게 여러번인데 저렇게 천대 받는 게 말이 되냐고. 넌 저게 개연성 있다고 생각하냐? 아니면 그냥 작품에서 저런 설정이라고 하니 그냥 알겠습니다 하고 받아들이는 거냐? 네 생각이란 게 없음? 할 수 있는 말이 작품에서 그렇다면 그렇다고 알아들으라는 소리 밖에 못하냐고 병신아", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 04:44", "comment_id": "reply_li_23014948", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "먹구름먹방", "text": "@ㅇㅇ(106.101) 직업인 게 말이 안 되는 게 아니라 직업이 될 정도로 의뢰를 많이 받아야 하는 상황과, 목숨 걸고 여러번 지인을 곁으로 보내줌에도 저 천대 취급이 아다리가 안 맞는다고. 이 말을 존나 못 알아듣네", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 04:48", "comment_id": "reply_li_23014998", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@먹구름먹방 병신새끼가 네 대댓을 그렇게 쓰고 논리를 그렇게 펼침? 네 논리는 종사하는 사람이 적고 수입이 불안정하니 운반꾼 직업이 아니라면서? 거기에 내가 반박한거라고 병신년아 운반꾼이 천대받는 말든 그건 논점을 벗어난거라고", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 04:51", "comment_id": "reply_li_23015033", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@먹구름먹방 언제부터 병신이 천대받는게 이상하다는 개연성가지고 지랄함? 에휴 ㅉㅉ", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 04:53", "comment_id": "reply_li_23015051", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "먹구름먹방", "text":  뭔 되도않는 소리들을 함", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 01:52", "comment_id": "reply_li_23010776", "parent_comment_id": "comment_li_23010656", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.38) (223.38)", "text": "@ㅇㅇ(116.120) ㄹㅇ 예나 지금이나 타지에서 죽는게 비참한 죽음인건 별다를바 없었고 그래서 유해가 안되면 유품이라도 챙겨서 가족 곁이나 고향 땅에 묻어주는게 미덕 중 하나였는데 그런일을 하는 캐릭터한테 장의사니 백정이니 멸시받는게 당연하다는 소리는 ㄹㅇ 유해발굴단 모욕하는거 같아 보이네", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 02:01", "comment_id": "reply_li_23011100", "parent_comment_id": "comment_li_23010656", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "먹구름먹방", "text": "ㄹㅇㅋㅋ. 장의사랑 유해발굴이 어떻게 갔냐고. 그냥 저 세계 전체가 썩었다고 밖에 설명이 안 됨ㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 02:38", "comment_id": "reply_li_23012090", "parent_comment_id": "comment_li_23010656", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "쩌쩌따임", "text": "@먹구름먹방 문화권별로 다름일딘 망나니는 어느 사회든 멸시받았고고대 이집트나 티베트불교같이 사후세계의 안내자 역할이 강조되는 문화권은 우대했는데대다수는 현대 인도처럼 불가촉천민 취급받음그나마 시신에 헤코지 할까봐 당사자들은 접촉해야할땐 그나마 존중하지 화장터 나서는 순간 만나기만하면 개뚜들겨 패버림", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 03:05", "comment_id": "reply_li_23012778", "parent_comment_id": "comment_li_23010656", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "먹구름먹방", "text": "@쩌쩌따임 허.... 헬 어스", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 03:06", "comment_id": "reply_li_23012819", "parent_comment_id": "comment_li_23010656", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.38) (223.38)", "text": "@쩌쩌따임 유교국가도 별반 다를건 없음 강시도 그당시 장례는 고향에서 해줘야 한단 마인드 때문에 시체 옮겨주던게 각색된것 아니냐 하고 한국도 타지에서 객사하면 귀신된다는건 뭐 상식이었어서 여주 같은 직업을 천하게 볼 리는 없고 우대했으면 우대했을거임 근데 일본은 옛날부터 장의사 차별 개심했다더라 그래서 이런건지", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 03:09", "comment_id ": "", "date": "10.22 13:03", "comment_id": "reply_li_23025206", "parent_comment_id": "comment_li_23017009", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "저리 강한대 굳이? 시체파밍하는 업을? 돈때문에? - dc App", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.22 07:13", "comment_id": "comment_li_23017095", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇ?ㅈ", "text": "", "is_reply": false, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658eb2c708b21c569475d5093416921543a1884a1920a6b65d4c0f6fa158ac64d246211bde4532b07d65a6cd7817a5eb5", "comment_img": "", "date": "10.22 07:24", "comment_id": "comment_li_23017281", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658eb2c708b21c569475d5093416921543a1884a1920a6b65d4c0f6fa158ac64d246211bde4532b07d65a6cdf9e2440bc5c", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇ?ㅈ", "text": "", "is_reply": false, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658eb2c708b21c569475d5093416921543a1884a1920a6b65d4c0f6fa158ac64d246211bde4532b07d65a6cd7817a5eb5", "comment_img": "", "date": "10.22 07:24", "comment_id": "comment_li_23017284", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658eb2c708b21c569475d5093416921543a1884a1920a6b65d4c0f6fa158ac64d246211bde4532b07d65a6cd7817a5eb5", "comment_img_source": "", "comment_media_version": 2}, {"writer": "육이", "text": "걍 돈을 졸라 많이 뜯어간다 하면됨  사악한 유대인 같은거지", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.22 08:00", "comment_id": "comment_li_23017959", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(58.121) (58.121)", "text": "시체운반꾼을 하는 이유가 더 그럴듯하거나, 힘이 약했거나, 시체운반꾼이라는 직업에 뭔가 저주가 걸려있거나, 설정에 좀 더 개연성이 있었으면 좋았을듯", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.21 21:42", "comment_id": "comment_li_23001798", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(58.78) (58.78)", "text": "여동생 시체를 찾아달라고 의뢰하면 되잖아", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.21 21:43", "comment_id": "comment_li_23001844", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "시체운반꾼이 네크로맨서라 시체 일으켜서 데리고 오는게 아니네 무겁기도 하고 장비무게도 있으니 이 편이 좀 더  - dc App", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.21 21:45", "comment_id": "comment_li_23001911", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.37) (118.37)", "text": "던전밥이 좆으로 보이노  - dc App", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.21 21:46", "comment_id": "comment_li_23001974", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "점진", "text": "욕하는 거 자체는 충분히 그럴 만한듯 아무리 숭고한 일이어도 일단 던전에서 죽고 부패된 시체를 만지는 거부터가 그냥 생리적으로 가까이 하면 안 될 거 같음", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.21 21:46", "comment_id": "comment_li_23001986", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "점진", "text": "근데 운반 일 소개할 때 \"시신은 대개 위험한 곳에 있어서 실력이 필요하다\" 라고 했으면서 그 실력자한테 대놓고 욕하는 건 아무리 생각해도 이상함ㅋㅋㅋ의뢰 맡겨놓고도 손 내미니까 본능적으로 거부하는 의뢰자들 반응 정도가 딱 적당한 거 같은데", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.21 21:48", "comment_id": "reply_li_23002043", "parent_comment_id": "comment_li_23001986", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(175.199) (175.199)", "text": "@점진 직업의 귀천이 있고아무래도 시신가지고 일하는 직업이니 부정탈까봐 그런것도 있겠지", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.21 21:51", "comment_id": "reply_li_23002156", "parent_comment_id": "comment_li_23001986", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "평민", "text": "아직은 잘 모르겠네", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.21 21:47", "comment_id": "comment_li_23002022", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러30(211.223) (211.223)", "text": "일본은 꼭 저렇게 남한테 기생하려는 캐릭터가 나오네", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.21 21:48", "comment_id": "comment_li_23002066", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "돈이 아니라 다른 이유가 있어서 하는 거면 모르겠는데 돈이 목적 + 저 전투력이면 훨씬 좋은 직업이 많을 텐데", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.21 21:57", "comment_id": "comment_li_23002373", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.214) (211.214)", "text": "음 진지하게 평가하자면 1화는 재밌긴 한데요 다음화는 별로 궁금하지 않은 만력이네요.", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.21 21:58", "comment_id": "comment_li_23002408", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "시작부터 불쌍한 처녀 죽이기 뭐지요?", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.21 22:00", "comment_id": "comment_li_23002532", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "단편느낌으로 읽었는데 연재작이네 재밋어요", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.21 22:04", "comment_id": "comment_li_23002716", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "", "is_reply": false, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658e820775f41d8d0ca6079a0800f01ce0219382a3cf6132645765fdc52e2cd0a6b31afbcfafc561f7ad6c653c52e94a749371df8b585bba93bcf", "comment_img": "", "date": "10.21 22:08", "comment_id": "comment_li_23002891", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658e820775f41d8d0ca6079a0800f01ce0219382a3cf6132645765fdc52e2cd0a6b31afbcfafc561f7ad6c653c52e94a749371df8b585bba93bcf", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "고작 1화 늙은이 둘 묘사하는데 심리가 오락가락하는건 대체 뭐냐에 없어져서 의뢰한놈이 시체 데려왓더니 닿기도 싫어하다가미스릴 쥐어주니까 감사하다고 울고불고 손잡고 뭐임", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.21 22:22", "comment_id": "comment_li_23003499", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(175.199) (175.199)", "text": "닿기도 싫은게 아니라 설명도 안하고 뭔지도 모르는거 대뜸 들이미니깐 그러는거뒤에 남주가 설명하니깐 손에 쥐잖아진짜 1차원적인 애들 많다", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.21 22:26", "comment_id": "reply_li_23003739", "parent_comment_id": "comment_li_23003499", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "아스타맘", "text": "", "is_reply": false, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65aeb246e628a1cb3508aff9dabceb22e3442496cd3dce4f78ed95a5ce98d6586f7423592c302e54c22cb2741db", "comment_img": "", "date": "10.21 22:29", "comment_id": "comment_li_23003874", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65aeb246e628a1cb3508aff9dabceb22e3442496cd3dce4f78ed95a5ce98d6586f7423592c302e54c22cb2741db", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(101.235) (101.235)", "text": "쓰레기만화잖아", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.21 22:30", "comment_id": "comment_li_23003938", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "먹구름먹방", "text": "설정, 스토리 다 좋은데, 시체꾼 멸시하는 억지 전개가 개 짜치네", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.21 22:31", "comment_id": "comment_li_23003984", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러34(211.235) (211.235)", "text": "시체 들고 댕기는 사람이 멀쩡한 취급 받겠노현대사회마냥 도덕적인 놈들도 아닐테고 시체냄새 개좆된다는데", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.21 23:01", "comment_id": "reply_li_23005438", "parent_comment_id": "comment_li_23003984", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "병신지 바로 옆에 시체 끌고다니는 새끼 있으면 기겁하면서 도망칠새끼가ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.21 23:04", "comment_id": "reply_li_23005617", "parent_comment_id": "comment_li_23003984", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "먹구름먹방", "text": "@만갤러34(211.235) 시대상 수준이 미개했다는 거네. 요즘으로 따지면 관 들고 지나가는 사람보면 부리나케 도망친다는 소리인데", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.21 23:15", "comment_id": "reply_li_23006078", "parent_comment_id": "comment_li_23003984", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "까마귀가면 쓴 사람들 나오는 만화들 못봤나 그게 시체다루는 사람들인데 창작물에선 다 역병능력으로 나오는데", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.21 23:20", "comment_id": "reply_li_23006316", "parent_comment_id": "comment_li_23003984", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "먹구름먹방", "text": "@ㅇㅇ(106.101) 씹덕들은 제발 본인이 아는 만화를 남들도 안다고 생각하지 말고, 강호의 도리를 지켜 제목을 말하도록", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.21 23:29", "comment_id": "reply_li_23006652", "parent_comment_id": "comment_li_23003984", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(36.38) (36.38)", "text": "@먹구름먹방 만갤와서 씹덕선민사상 부리는거 좀 개추하노 ㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 00:49", "comment_id": "reply_li_23009169", "parent_comment_id": "comment_li_23003984", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "Seo", "text": "여동생 찾아도 백골이 다됐겠는데", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.21 22:44", "comment_id": "comment_li_23004617", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "쉽지만 기피되는 일이면 모르겠는데던전에 단독진입해서 몬스터 쓰러뜨리고 던전에서 죽은 모험가 시체를 찾아오는놈을 차별하는게 말이되냐?일본 사회 문화의 영향인지 뭔지 모르겠지만 얘들은 너무 아무나 아무렇게 차별받는걸로 그림", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.21 22:51", "comment_id": "comment_li_23005013", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "한국에서도 꼭 필요한 직종인 도축업에 종사한다고 몇 세기간 차별했잖음 ㅇㅇ 나도 일본 만화 특유의 차별 묘사가 눈꼴시렵긴한데 별로 막 개연성이 결여됐다는 생각은 안듬  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 03:21", "comment_id": "reply_li_23013214", "parent_comment_id": "comment_li_23005013", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(116.120) (116.120)", "text": "@ㅇㅇ 글 잘쓰네 바로 납득됨", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 03:24", "comment_id": "reply_li_23013334", "parent_comment_id": "comment_li_23005013", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ 그거랑은 전혀다른케이슨데일단 백정은 도축업을 하기 이전에 이미 생활상이 달라서 차별받는 집단이었고 당시엔 소 도축이 금지였는데  따르지 않은놈들이 그대로 도축업을 직업으로 삼게 된거임 도축업을 해서 백정으로 분류되서 차별받은게 아니다", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 03:32", "comment_id": "reply_li_23013555", "parent_comment_id": "comment_li_23005013", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "뭐 이후에 풀수도 있지만 지들도 던전에 들어가서 살생을 하고 돈을버는 모험가 거기에 죽은 동료의 시체를 찾고 싶어하는데 능력부족으로 대신해줄사람이 필요한 니즈로 인해 존재한다고 밖에 볼수없는 직업인데 즈그도 유사시엔 시체를 수거해올거면서 시체를 대신 수거해주는 사람은 노골적으로 비난하고 차별한다?무슨맥락에서? 백정문제랑은 맥락자체가 다르다", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 03:36", "comment_id": "reply_li_23013688", "parent_comment_id": "comment_li_23005013", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "우는판다", "text": "@ㅇㅇ 직업의 사회적 필요 내지는 유용성이랑 종사자의 사회적 지위는 별개 변수임 ㅇㅇ 그 직업이 아무리 유용한지를 따져도 딱히 영양가 있는 반론이 되진 않음 환경미화원이 사회에 필요한 직업이라고 해서 그 인식이 좋진 않잖음 마찬가지임그리고 백정이 애시당초 생활양식이 달라서 차별 대상이 됐다고 하는데 반은 맞고 반은 틀린 설명임 백정에 대한 차별이 도축업 종사 이전부터 있었던 것은 사실인데, 백정이 도축업에 종사한 후 명백히 백정 출신이 아닌 이가 도축업에 종사하자 마찬가지로 멸시받았음 유교사회였던 조선에서 도축은 행위 자체로 차별의 대상이었던거임 ㅇㅇ 그리고 소도축이 금지였는데 이걸 어겨서 처벌 받은 건 백정이 아닌 거골장임 - dc App  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 03:58", "comment_id": "reply_li_23014196", "parent_comment_id": "comment_li_23005013", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "우는판다", "text": "@ㅇㅇ 나도 만화에서 나오는 차별묘사가 과하다는 주장에는 마찬가지로 동의하는데, 직업에 대한 차별이 개연성 결여와 결부될 수 없다는건 타당한 이야기같음  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 04:02", "comment_id": "reply_li_23014258", "parent_comment_id": "comment_li_23005013", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.229) (211.229)", "text": "병신설정 억지실드치는 애들이 있는데.. 니들 수준에 맞게 니들 비유로 얘기해주면, 과거시험 붙어야 백정을 할수 있는 상황이다. 보스몹 한방에 써는 능력이 있어야 된다고. 근데 과거시험 붙은 놈이 백정 왜함?? 사또 돼서 떵떵거리든가 궁궐 관리돼서 출세길 달려야지. 그 실력으로 왜 더럽고 힘들고 욕만 처먹는 백정을 하겠니??? 생각을 해보련?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 22:19", "comment_id": "reply_li_23043317", "parent_comment_id": "comment_li_23005013", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러66(14.51) (14.51)", "text": "@ㅇㅇ(211.229) 진지하게 e, "dccon": "", "comment_img": "", "date": "10.22 00:45", "comment_id": "reply_li_23009022", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.131) (121.131)", "text": "@먹구름먹방 다른 댓글에서도 다른 만붕이들이랑 한바탕한거 같은데댓글 달기전에 생각 좀 하고 다는게 좋을듯?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 00:51", "comment_id": "reply_li_23009218", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "먹구름먹방", "text": "@ㅇㅇ(106.101) 만화에서 나왔듯이 웬만하면 안 하려고 하니까 하는 사람도 적음. 한 번 의뢰만 해도 돈이 많아서 의뢰를 하는 사람도 많을 수 없음. 개인이 의뢰하고 개인이 받는 특정 의뢰라면 몰라도 직업이 될 수 있는 조건이 아님", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 00:57", "comment_id": "reply_li_23009370", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "먹구름먹방", "text": "@ㅇㅇ(121.131) 큰일났다. 병신 한 명이 아이피 바꿔가며 괴롭힌다. 본인은 티가 나는 줄 모르나 보다", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 00:59", "comment_id": "reply_li_23009404", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@먹구름먹방 뭔 논리가 그럼? 하는 사람이 적으면 그게 직업이 안됨?그럼 필경사는 극소수로 있고 정부의뢰만 받는데 이건 직업이 아님?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 01:03", "comment_id": "reply_li_23009524", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "먹구름먹방", "text": "@ㅇㅇ(106.101) 하는 사람이 적음 = 괜찮음. 의뢰인도 적고 불안정함 = 안 됨. 정부처럼 지속적이고 안정적인 의뢰인 있는 거랑 만화에 나오는 조건이랑 같나? 왜 두 가지 복합 조건을 말했는데 한 가지만 분리해서 들음?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 01:08", "comment_id": "reply_li_23009653", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@먹구름먹방 저게 지속적이지 않고 불안정하다는건 네 뇌피셜아님? 만화 내용에도 그런건 없고 돈이 된다는것 만 나오는데?그리고 던전에서 죽는 사람이 나올텐데 지인 시체 찾고 싶어하는 사람들도 많을거 아님? 저런 의뢰들이 많으니. 저런 운반꾼들이 있다는거고 다른 나라에서 온 남주도 들어봤다고 하는거 일텐데?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 01:16", "comment_id": "reply_li_23009838", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "먹구름먹방", "text": "@ㅇㅇ(106.101) 돈이 된다 = 의뢰비가 다소 비싸다 = 이게 중세 시대에 일반인들도 부담 없이 낼 수 있는 비용이다? 이상하지 않음? 시대 가치관만 중세고, 일반인 지갑 사정은 현대인가?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 01:22", "comment_id": "reply_li_23010026", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@먹구름먹방 왜 논지를 금액으로 빠져나감? 네가 말한건 하는 사람도 적고 의뢰인수가 부족해서 직업이 아니라면서?일반인들도 위 에피소드처럼 다 털어서 지불할 수 도 있고 다른 모험가들이 의뢰할 수 도 있는거고 귀족도 있고 상인도 있겠지? 굳이 일반인만 의뢰주임??", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 01:25", "comment_id": "reply_li_23010107", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "먹구름먹방", "text": "@ㅇㅇ(106.101) 던전에 귀족과 싱인의 지인이 목숨 걸고 던전에 갈 이유가 뭐임? 있다고 쳐도 그 수가 얼마나 되겠음? 그리고 모험가가 돈이 많다고 단정하는 지도 모르겠고, 사정이 좋으면 왜 본인들이 안 가고 천대받는 운반꾼을 지키냐? 귀족도 개인 부대를 지키지, 왜 천대 받는 남에게 소중한 지인을 가져오게 할까? 시체라도 찾고 싶은 마음 다 알고, 마지막 배웅하고 직접 묻어주는 거 다 좋다 이거야. 그건 나도 공감함. 근데 만화에서 나오는 직업의 취급, 던전에 가는 사람들 조건, 그리고 의뢰를 받는 운반꾼 실력이랑 비용 등등 다 생각하면 어딘가 어긋나 있다니까", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 01:42", "comment_id": "reply_li_23010544", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@먹구름먹방 왜 자꾸 이상한쪽으로 논지를 흐리는지 모르겠는데난 네가 직업이 될 수 없다는 의견에 반박하는거임.네가 직업이 될 수 있는 조건이 하는사람이 많아야하고 의뢰가 많아야된다면서? 그래서 거기에 대한걸 말하는건데 운반꾼을 시키니마니 그런 소리가 왜 나올까??던전에 귀족과 상인의 지인이 또 안 갈 이유는 뭐임?호기심에 갔다가 봉변당했을 수 도 있는거 아님?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 01:57", "comment_id": "reply_li_23010967", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@먹구름먹방 운반꾼 시키는건 자기 레벨에 안맞는곳에 도전했다가 시체 놓고 오는 경우겠지? 또 가다가 죽을 수 도 있으니깐? 자기가 가기 힘든곳에 대신가서 회수해오는게 작중에서 나온 운반꾼이 하는건데 자꾸 논지 좀 흐리지마", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 02:00", "comment_id": "reply_li_23011053", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "먹구름먹방", "text": "@ㅇㅇ(106.101) 돈 많은 놈들 지인이 굳이 호기심으로 던전에 가서 죽는다? 그렇게 가벼운 마음으로 갔는데 굳이 운반꾼을 지킬 정도로 위험한 곳까지 내려갔다? 말이 안 됨. 그나마 모험가들 쪽은 말이 되지만 저렇게 윗 만화처럼 천대하면서 정작 저 직업에게 의뢰한다? 그것도 이상함. 귀족이나 상인의 지인의 시체를 묻게 해주는 일과, 모험가들 사이에서는 사실상 전사자이자 동료를 데리고 오게 해주는 일인데 천대를 받는다? 그냥 장의사랑 위험한 곳에 와서 귀하신 몸뚱이와 전사자를 데려오는 건 차원이 다른 문제임. 저렇게 천대 받을려면 의뢰를 안 하고 본인들이 해결할 정도로 인식이 씹창이어야 함. 일반인들은 그럴 힘도 없어서 의뢰해야 하고, 그마저도 다 털어가면서 해야하니 그 수도 적음. 이게 여태까지 내가 말하던 거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 02:19", "comment_id": "reply_li_23011584", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "먹구름먹방", "text": "@ㅇㅇ(106.101) 논지 흐린 게 아니라 다 이어져 있잖아. 직업이 되려면 직업의 수가 많거나 수입이 안정적이어야 하고, 의뢰가 많아야 하면 귀족, 상인, 모험가들도 의뢰가 어느 정도 있어야 하고, 그런데 그러면 그런 돈 많은 분들이나 어느 정도 실력 있는 모험가들도 함부로 못가는 위험한 곳에 가서 귀하신 몸뚱이와 전사자이자 동요를 데려온다는 말이고, 근데 그런 사람에게 취급이 너무 씹창이고. 저렇게 씹창이면 의뢰를 안 하겠구나, 일반인만 하겠구나 생각하게 되고, 결국 내가 말한 처음으로 되돌아 옴", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 02:24", "comment_id": "reply_li_23011694", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "먹구름먹방", "text": "@ㅇㅇ(106.101) 결국 이게 설명이 되려면 돈 있고 실력 있는 놈들도 못가는 곳에 가서 귀하신 몸뚱이랑 전사자들 찾아주었는데 역병 취급하는 미개한 시민들만 모여 있다는 소리니까. 근데... 그냥 그게 맞는 거 같다. 내가 사람의 악의를 너무 얕보았네. 귀하신 몸뚱이 찾아 주었지만 귀족들은 여전히 역병 취급, 전사자이자 동료를 찾아주었지만 모험가들도 여전히 역병 취급. 그냥 저 세상이 썩었구나 생각하면 되는 걸 저 세계 사람들을 내가 너무 과대평가 한 듯 함", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 02:28", "comment_id": "reply_li_23011814", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "먹구름먹방", "text": "@ㅇㅇ(106.101) 근데 궁금한데 왜 원댓글이 아니라 나한테 대댓글 담? 네 첫 답변은 아무리 봐도 나보다 원댓글에 어울리는데?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 02:33", "comment_id": "reply_li_23011962", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@먹구름먹방 왜 자꾸 이상한걸로 논지를 흐리는지 모르겠는데 천대받는거랑 직업이랑은 상관이 없다니깐?? 천대받으면 일 못함? 그럼 백정이라는 직업은 가상의 직업이었나? 더럽고 힘들고 까다로운 상황에서 시체를 회수해야하는데 그걸 자기들이 못하니 운반꾼한테 의뢰를 해서 수요가 있고 이런 수요가 있으니 운반꾼이라는 직업이 있다는건데 왜 자꾸 딴 소리를 하냐.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 02:43", "comment_id": "reply_li_23012218", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "먹구름먹방", "text": "@ㅇㅇ(106.101) 백정은 직업이기 전에 '신분'이었다, 멍청아. 네 말대로라면 운반꾼은 선택적 직업이 아니라 그냥 핏줄이 운반꾼이어야 함. 푸줏간에서 일하는 '평민'이 닭모가지 자른다고 백정 취급 받았을 것 같냐? 안 그래", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 02:52", "comment_id": "reply_li_23012423", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@먹구름먹방 또 논점 흐리지말고 네가 말하는건 인식이 씹창났으니 사람들이 의뢰를 잘안해서 직업이 아니다 이거 아님?왜 자꾸 직업이랑 천대받는걸 엮는지 모르겠는데 직업의 귀천이란 말이 왜 있겠냐?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 02:56", "comment_id": "reply_li_23012548", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "먹구름먹방", "text": "@ㅇㅇ(106.101) 그럼 사람 수도 적고 돈 내는 사람도 적어서 수입이 불안정한데 직업 취급인 거 하나라도 말해봐라", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 02:59", "comment_id": "reply_li_23012607", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "먹구름먹방", "text": "@먹구름먹방 그리고 왜 원댓글이 아니라 나한테 대댓글 달았냐는 질문에 대답을 안 하냐? 그냥 나랑 대화가 하고 싶었냐? 처음에는 아이피 바꿔가면서 무지성으로 욕하더니 이제는 아무 말 잔치나 하면서 억지부리면서 대화하려고 하네. 너 나 사랑함? 우웩...", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 03:03", "comment_id": "reply_li_23012734", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@먹구름먹방 이게 내가 말한 반박이 됨?반박을 해봐 천대받는거랑 직업이 상관있냐고?네가 저 세계관에서 수입이 불안정한거랑 의뢰인이 적적다는건 뭔 기준으로 확정짓는거임? 저 세계는 던전이 있고 사람이 죽을 수 있는 확률이 현대보다 높은 세계인데 시체찾는 사람이 없을 수 가 있음?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 03:06", "comment_id": "reply_li_23012808", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@먹구름먹방 뭔 아이피를 바꿔? 헛소리하지말고억지는 네가 부리는거지 ㅋㅋ 왜 댓글달았냐고?네가 헛소리를 확정으로지으니깐 단건데 왜?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 03:07", "comment_id": "reply_li_23012842", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "먹구름먹방", "text": "@ㅇㅇ(106.101) 그냥 내 21세기 선진국 국민 도덕적 관점에서는 저런 위험하고 숭고한 직업이 의뢰도 많이 받는데 저런 취급받는 게 이해가 안 되었음. 이제 만족함?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 03:09", "comment_id": "reply_li_23012875", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@먹구름먹방 원댓이 작품 세계관까지 언급했는데 그걸 못보고 21세기 관점으로 댓글 단거임? 생각이 없는건지? 걍 1차원적인건지?", "is_reply": true, "dccon": "", "comment_img": "", , "date": "10.22 03:31", "comment_id": "reply_li_23013507", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@먹구름먹방 그럼 21세기 관점으로 봤는데 왜 대댓을 그렇게 적었을까? 네 말대로라면 좋게보고 반대로 생각했는데 왜 직업으로 삼는게 이상한거지?? 네가 이걸 썼을때는 저 작품 중세 세계관 관점으로 본게 아닌가?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 03:32", "comment_id": "reply_li_23013544", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@먹구름먹방 논리적인 척 지적인 척은 네가 한거아님?내가 말한 주장에 금액이니 천대니 논지 흐리면서 이상한 반박한건 네 아님?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 03:33", "comment_id": "reply_li_23013606", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "먹구름먹방", "text": "@ㅇㅇ(106.101) 그럼 현실이라도 좋고, 만화든 소설이라도 좋으니 대중적인 것중에 하는 사람 수도 적고, 돈벌이도 불안정하지만 직업 취급인 하나만 말해 봐. 내가 만화에서 그런 걸 자주 봤으면 만화에서는 이래도 되는구나 생각했겠지. 현실에서도 만화에서도 없으니 생각 못한 거인데?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 03:36", "comment_id": "reply_li_23013676", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@먹구름먹방 아니 애초에 왜 운반꾼 하는 사람이 적고 수입이 불안정하다고 생각하냐니깐? 운반꾼이라는 직업은 다른 나라사람이 알 정도로 알려져 있고 수입은 수요가 있으니 계속 여주가 하는거고. 애초에 니 논리가 안맞다고아님 그림만보고 스크롤 내림?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 03:39", "comment_id": "reply_li_23013749", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(210.222) (210.222)", "text": "논쟁 과정에서 누가 논점을 바꿨는가먹구름먹방은 최초 댓글에서 단순히 “직업으로 존재하는 것이 이상하다”고만 했습니다. 사회적 천대와 직업적 유용성의 모순은 한참 뒤에 본격적으로 제시했습니다. 따라서 106.101이 “처음 주장에서 논점을 옮겼다”고 느낀 데에는 근거가 있습니다.반대로 106.101도 “작품에서 직업으로 존재하고 다른 나라에도 알려졌으니 의뢰가 충분히 있을 것”이라고 추론했을 뿐, 실제 의뢰 빈도나 수익구조를 작품 속 근거로 증명하지는 못했습니다. 일부 주장은 사실상 다음과 같은 순환에 가깝습니다.직업으로 존재한다 → 수요가 충분했을 것이다 → 그러므로 직업으로 존재하는 것이 개연성 있다.따라서 먹구름먹방이 제기한 세계관 설명 부족을 완전히 해소한 것도 아닙니다.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 08:15", "comment_id": "reply_li_23018202", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(210.222) (210.222)", "text": "정리초기 쟁점만 보면 106.101의 반박이 더 타당합니다. 종사자가 적고 수입이 불규칙하다는 사실만으로 직업이 성립하지 않는다고 단정할 수는 없습니다. 고액의 비정기 의뢰로 유지되는 희귀 전문직도 충분히 가능하기때문입니다.결국 이 논쟁은 106.101은 ‘그런 직업이 존재할 수 있느냐’를 변호하고, 먹구름먹방은 후반부터 ‘존재하더라도 저런 사회적 취급까지 동시에 성립하느냐’를 문제 삼은 것입니다. 서로 다른 명제를 붙잡은 상태에서 인신공격으로 넘어가면서 대화가 길어졌습니다.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 08:16", "comment_id": "reply_li_23018224", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(210.222) (210.222)", "text": "- 최초의 선택적 오독: 106.101  ‘종사자도 적고 의뢰인도 적다’를 ‘종사자가 적다’ 하나로 축소함- 이후의 논점 확장·혼선: 먹구름먹방  경제적 성립 문제에서 사회적 천대의 모순과 현대적 도덕관 문제로 범위를 넓힘한편 최초 댓글 작성자의 “부활도 안 되는데 왜 시체를 회수하느냐”는 전제도 그 자체로는 약합니다. 부활이 불가능해도 장례·유족의 애도·신원 확인 때문에 시신 회수 수요는 충분히 생길 수 있기 때문입니다. 그러나 먹구름먹방은 그보다 구체적인 ‘그 수요가 독립 직업을 유지할 만큼 지속적인가’를 문제 삼았고, 106.101이 처음에는 그 부분을 제대로 받지 않은 것입니다.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 08:16", "comment_id": "reply_li_23018234", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "먹구름먹방", "text": "@ㅇㅇ(210.222) ai에 돌린 거임?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 08:24", "comment_id": "reply_li_23018382", "parent_comment_id": "comment_li_23007995", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(210.222) (210.222)", "text": "@먹구름먹방 ㅇㅇ너무길어서 나중에 온사람들 못알아볼까봐 돌렸음", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.22 08:44", "comment_i
