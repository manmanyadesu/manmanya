.09 01:52", "comment_id": "comment_li_20819149", "parent_comment_id": ""}, {"writer": "이기고또이긴다재가될때까..", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1NWnlN1q02647T8QFanqZA3cbkAvKqkpZ", "comment_img": "https://lh3.googleusercontent.com/d/1BgMt0v2SCf7YLMVaYPBjqe-gyzGfVWUg", "date": "09.09 20:41", "comment_id": "comment_li_20852413", "parent_comment_id": ""}, {"writer": "ㅇㅇ(1.230) (1.230)", "text": "쯔요이다앗", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.09 21:00", "comment_id": "comment_li_20853283", "parent_comment_id": ""}, {"writer": "ㅇㅇ(175.112) (175.112)", "text": "바키는 생각보다 밸런스 잘잡혀있음. 보면 카츠미 음속권, 피클 태클 같은거 맞으면 유지로도 뒤질거 같은데 파괴력이 쌘거랑 적중하는건 아주 다른 문제고 적중하더라도 가진 파괴력을 온전하게 다 전달할수 있냐도 완전 다른 이야기인걸로 나옴. 유지로가 맨날 힘이 최고다라고 해서 파괴력이 짱먹을거 같지만 실제로 이 만화 잘보면 적중률이 가장 중요함. 타격을 온전하게 적중시키는가, 타격을 핀포인트로 때리는가, 상대 타격을 맞았을때 근육이나 여타 무술동작으로 흘리는가 이런게 파괴력보다 더 중요함. 바키에서 가장 이상적인 타격 형태는 지금 레츠처럼 대충 손발만 질러도 어느정도 파괴력이 보장되는데 상대 움직임에 보다가 근육이나 무술동작으로 타격 못흘릴때 치는거 같음", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.09 21:40", "comment_id": "comment_li_20854778", "parent_comment_id": ""}, {"writer": "루차도라", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/129FwCJJLKPhBteUzLh6DEs-g2SOmHoKc", "comment_img": "https://lh3.googleusercontent.com/d/1BgMt0v2SCf7YLMVaYPBjqe-gyzGfVWUg", "date": "09.09 22:04", "comment_id": "comment_li_20855774", "parent_comment_id": ""}, {"writer": "ㅇㅇ(121.151) (121.151)", "text": "그림이 거의 드레곤볼 보다가 슈퍼 볼때의 느낌이네아쉽다 내용은 괜찮은거 같아", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.09 22:23", "comment_id": "comment_li_20856481", "parent_comment_id": ""}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "슬슬 오리지널캐 하나 더 뒤져서 여기오면 좋겠다", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.09 22:23", "comment_id": "comment_li_20856506", "parent_comment_id": ""}, {"writer": "만갤러27(116.45) (116.45)", "text": "베스트 컨디션이 아니라서 그래", "is_reply": false, "dccon": "", "comment_img": "", "date": "09 arent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
