4091502", "parent_comment_id": "comment_li_24090739", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.46) (118.46)", "text": "저거개좆밥이라고 나불댈거면 쟤한테 디엠보내서 같이 라이브로 합방 문제풀이하자고해라 점수 낮은새끼 뒤지기로ㅋㅋㅋㅋㅋ저정도 족쇄차고 90점 후반나오면 증명 어느정도 했다고 본다", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 23:23", "comment_id": "comment_li_24090746", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(120.142) (120.142)", "text": "만갤까지 와서 왜 바이럴이야 시팔", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 23:32", "comment_id": "comment_li_24091139", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(180.233) (180.233)", "text": "얘 말고 세무사 보고 싶은데", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 23:46", "comment_id": "comment_li_24091755", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "화작 + 언매까지해서 65분컷 내는거면 좆되긴하네", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 23:49", "comment_id": "comment_li_24091895", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "공부는 모르겠고 사업은 잘하네 비교대상을 교묘하게 비틀어서 이븐하게 만드는것처럼 보이는데 본인이 말했던것처럼 8개월 뒤 있을 차기 리트시험에서 증명하는거 아니면 아무런 소용도 없음 이거로 대충 증명하고나면 차기 리트시험은 증명안하고 책만 팔아도 되거든", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.15 00:06", "comment_id": "comment_li_24092708", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.156) (121.156)", "text": "애초에 8개월 뒤 시험을 증명한다는것도 말이 안됨보통 시험은 실무랑 다름그래서 \"시험만을 위한 시험공부\"를 해야함그런데 8개월 뒤에 시험을 친다는건, 8개월동안 또 공부해야된다는거임.실력 유지를 위해 계속 공부해야함.공부 안하고 친다는건 수능 재수 삼수하는데 그냥 공부 안해도 이전 성적 나온다는 말이랑 같은거임사실 지금 수능으로 한다는 것도 정말 될까 싶긴 한데...", "is_reply": true, "dccon": "", "comment_img":
