? 이러는 점과 진로상담이 딱히 학생친화적이지 않다는 점 그리고 목표를 이루는 과정에서 불가결한 갈등사안까지도 내가 그랬제~느낌으로 묘사해버리니 좀 그래 만화가", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1vQ_vy-Y_NdEbloNXlTBaENKsJfUxKmJc", "date": "09.20 23:51", "comment_id": "reply_li_21415367", "parent_comment_id": "comment_li_21414158"}, {"writer": "ㅇㅇ(211.234) (211.234)", "text": "@ㅇㅇ(61.79) 선생처럼 자살시켜줄까 좆병신새끼야?", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.20 23:53", "comment_id": "reply_li_21415482", "parent_comment_id": "comment_li_21414158"}, {"writer": "ㅇㅇ(211.234) (211.234)", "text": "@ㅇㅇ(61.79) 좆애자새끼 장애인이 낳았겠지 튀기년", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.20 23:53", "comment_id": "reply_li_21415502", "parent_comment_id": "comment_li_21414158"}, {"writer": "ㅇㅇ(211.54) (211.54)", "text": "@ㅇㅇ(61.79) 선생의 스탠스가 \"그 무엇보다 목숨이 소중하다\" 인건 맞음근데 지금껏 꿈이 박살나고 존재의 의의가 흔들리는 위기를 맞은 제자들의 앞에 나오는 타이밍이 완벽한 했제 타이밍인것도 맞음그래서 걍 작가의 역량부족임 ㅋㅋㅋㅋㅋ 결국 선생을 했제충으로 보이게 하는것도 작가때문이라서", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.20 23:55", "comment_id": "reply_li_21415621", "parent_comment_id": "comment_li_21414158"}, {"writer": "만갤러15(223.38) (223.38)", "text": "@ㅇㅇ(211.234) 저거 니 얘기냐 ㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.20 23:57", "comment_id": "reply_li_21415750", "parent_comment_id": "comment_li_21414158"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(211.54) 난 그 흔들릴 때 했제~그러는게 불쾌한게 꿈의 성취라는게 갈등과 고난이 없을수없단말임. 근데 그것조차도 했제~식으로 넘어가버림. 가령 유치원교사도 기관사도 어쩌면 마주할 당연한 고난겪고있는 학생에게 도움준건 맞지만, 과거에 그랬던 선생이 타이밍 좋게 나타나서 그런 말을 해준다는게 너무 연출적으로 그라", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1vQ_vy-Y_NdEbloNXlTBaENKsJfUxKmJc", "date": "09.20 23:58", "comment_id": "reply_li_21415772", "parent_comment_id": "comment_li_21414158"}, {"writer": "ㅇㅇ(61.79) (61.79)", "text": "@ㅇㅇ 나도 연출은 했제라 생각하는데 내용이 연출만 있는게 아니잖아. 일단 글 안 읽는애 많은건 맞는것 같음", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 00:06", "comment_id": "reply_li_21 plies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
