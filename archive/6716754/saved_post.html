comment_media_version": 2}, {"writer": "ㅁㅁ(211.216) (211.216)", "text": "저기서 휴재에에에엣 하는건 작가놈 죽빵맞고싶나 졸라감질나네", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.19 00:42", "comment_id": "comment_li_22865851", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(1.243) (1.243)", "text": "그작은 진짜 정신세계 이상한거같음 사지절단 좋아하는것부터", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.19 00:43", "comment_id": "comment_li_22865915", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(219.240) (219.240)", "text": "그건 칭찬인데", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.19 00:46", "comment_id": "reply_li_22866035", "parent_comment_id": "comment_li_22865915", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러11(1.241) (1.241)", "text": "사지절단만 좋아하면 양반이지.근육질 남자새끼한테 젖달고 고자만들어서 육변기로 만드는 데", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.19 00:58", "comment_id": "reply_li_22866568", "parent_comment_id": "comment_li_22865915", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그작의 사지절단은 사지절단을 좋아하는게 아니라그냥 남자를 타락시키고 싶어서 쓰는 사지절단임", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.19 01:09", "comment_id": "reply_li_22867052", "parent_comment_id": "comment_li_22865915", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "왕란인", "text": "사지절단하고 야스하는게 아니고 사지절단하고 쓰레기통에 버리니까 ㄹㅇ 이긴하내", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.19 12:04", "comment_id": "reply_li_22884312", "parent_comment_id": "comment_li_22865915", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(14.49) (14.49)", "text": "프로제짱 미워하지마라...", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.19 00:46", "comment_id": "comment_li_22866043", "parent_comment_i
