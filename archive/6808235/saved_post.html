ia_version": 2}, {"writer": "만갤러14(1.241) (1.241)", "text": "병신같은 꼰대 진상 인간들밖에 없는 세상.꼬우면 뒤지질 말던지. 저럴 거면 애초에 의뢰를 하지 마라.", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.25 22:30", "comment_id": "comment_li_23168502", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(220.81) (220.81)", "text": "설정이 좀 이상하네", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.25 22:32", "comment_id": "comment_li_23168607", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(210.222) (210.222)", "text": "그냥 여주가 손님들 진상떠는거까지 다 받아주는 시크한 자기 자신에 너무 취해있음 상식적으로 말도 안되는 대우인데", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.25 22:33", "comment_id": "comment_li_23168656", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "ㄹㅇ", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.25 22:33", "comment_id": "reply_li_23168668", "parent_comment_id": "comment_li_23168656", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.152) (221.152)", "text": "애초에 저정도 무력 가지고 그냥 몬스터 처잡고 다녀도 될것을 말도 안되는 대우 처받으면서 저일을 하고 있음 차라리 매도 당하고 멸시 받으면서 억까 당하는게 좋은 마조히스트라 저직업 한다는 설정 같은거라도 넣는게 맞지 이래서야 좆툰만도 못함", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.26 06:00", "comment_id": "reply_li_23183061", "parent_comment_id": "comment_li_23168656", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.234) (211.234)", "text": "ㄹㅇ", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.26 06:30", "comment_id": "reply_li_23183452", "parent_comment_id": "comment_li_23168656", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "여주가 한 화만에 병신이 되어버렸노 ㅋㅋㅋ 작가야", "is_reply": false, "dccon": "", "comment_img "comment_media_version": 2}, {"writer": "메스이키쉐프", "text": "이건 진짜 개억깐데?", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.25 22:03", "comment_id": "comment_li_23167247", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "냠븜", "text": "남캐 구울감염돼서 죽자", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.25 22:04", "comment_id": "comment_li_23167273", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러5(221.139) (221.139)", "text": "아무리 생각해도 욕하는 새끼들 이해가안가는데", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.25 22:05", "comment_id": "comment_li_23167356", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "새벽에글쓰다가", "text": "사람은 원래 그런거야", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.25 22:23", "comment_id": "reply_li_23168167", "parent_comment_id": "comment_li_23167356", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "화재현장에서 소방관 패는사람들도 있음. 분노 터져나오는데 풀곳 없으니 일단 패는거", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.25 22:38", "comment_id": "reply_li_23168830", "parent_comment_id": "comment_li_23167356", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러24(218.146) (218.146)", "text": "실제 현실에서도 장의사들 시체냄새난다고 무시하고 욕하는 사람 부지기수라.. 장의사가 육체적인 부분에서는 엄청 고된일은 아니고 벌이도 엄청 높은 편인데 사람들 선호도 보면 시체냄새날거같아서 싫다 별로 가까히 하고 싶지않다 이럼..", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.25 23:19", "comment_id": "reply_li_23170950", "parent_comment_id": "comment_li_23167356", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러28(121.138) (121.138)", "text": "우리나라 장의사 영상보셈. 부모 모셨는데도 만지지 말라고 하는 사람들 꽤 있다고함", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.25 23:42", "comment_id": "reply_li_23171909", "parent_comment_id": "comment_li_23167356", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.150) (121.150)", "text": "\"산\"이라는 만화에 이거랑 비슷한 내용이 있음.등산갔다가 조난 당한 사람 구조하러 갔다가 요구조자는 이미 죽어있고구조하러 간 사람도 죽을뻔 했다가 시신 겨우 수습해서 돌아왔는데사망자 부모는 그런 구조자한테 무릎꿇고 사과하라는 억지를 부리고구조자도 그런 억지를 들어주는 장면이 있음.요약하면 죽은 사람 가족한테는 상황이 어찌되었건 시체 들고 온놈이 죄인취급 한다는 소리임", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.25 23:44", "comment_id": "reply_li_23171971", "parent_comment_id": "comment_li_23167356", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러33(110.11) (110.11)", "text": "합리적인 사람보다 진상새끼가 더 많은건 현실반영이지", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.26 01:08", "comment_id": "reply_li_23175002", "parent_comment_id": "comment_li_23167356", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.152) (221.152)", "text": "현실에 있는 경우인데도 이걸 욕하는 이유는 그걸 표현하는 방식이 존나 저열해서임 감정적으론 있을 수 있는 씬을 구상해도 그걸 보여주는 방식이 이래서야 욕만 듣는거지 작가 센스 문제임", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.26 05:55", "comment_id": "reply_li_23182980", "parent_comment_id": "comment_li_23167356", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(221.152) ㄹㅇ 그냥 작가가 븅신임글로 비유하자면 가족의 분노를 감성적으로 풀어낸 문장이 아니라 그냥 \"가족이 화를 낸다\" 라고 적힌걸 보는 느낌", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.26 09:50", "comment_id": "reply_li_23187673", "parent_comment_id": "comment_li_23167356", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "마루이", "text": "서로 만나지 않아(2번중 2번 다 만나며)", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.26 04:50", "comment_id": "comment_li_23182084", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "도그풋", "text": "", "is_reply": false, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5d
