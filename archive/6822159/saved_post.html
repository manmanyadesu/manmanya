version": 2}, {"writer": "붉은실", "text": "만력이... 강해졌다...?", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.27 00:52", "comment_id": "comment_li_23223511", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "ai한테 스토리 써달라했나?", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.27 00:53", "comment_id": "comment_li_23223560", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.248) (211.248)", "text": "ai가 좆으로 보임?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.27 01:02", "comment_id": "reply_li_23223822", "parent_comment_id": "comment_li_23223560", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "아니 기승전결이 없고 \"기승-기\"에서 만화가 끝이 나네 ㅂㅅ 인 가", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.27 01:02", "comment_id": "comment_li_23223795", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.248) (211.248)", "text": "1. 낡은 캐릭터성: 오버액션이 과하고 오지랖 넓은 열혈계 저능아 남자주인공은 이미 30년도 더 된 유행임. 그런 유형의 주인공은 이미 원나블 시대에 뽑을대로 다 뽑아먹은 마당에 2020년대 현재에 그런 캐릭터를 내세운다면 시대 정서에 맞지도 않고 고리타분함. 그리고 원나블 주인공은 저새끼처럼 트롤링 안 함.", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.27 01:05", "comment_id": "comment_li_23223893", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "밀1집모자는 트롤링 많이 하지 않았나 오래돼서 기억도 가물가물하네", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.27 01:22", "comment_id": "reply_li_23224346", "parent_comment_id": "comment_li_23223893", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.247) (211.247)", "text": "아니 근데 약 결국 못만든거면 헛고생만 한거 아님??", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.27 01:08", "comment_id": "comment_li_23223971", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.247) (211.247)", "text": "저 엘프 거인녀가 유언장 받은 친구라 연구 완성한거라도 된줄 알았는데 그것도 아니고", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.27 01:09", "comment_id": "reply_li_23223992", "parent_comment_id": "comment_li_23223971", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.248) (211.248)", "text": "2. 빈약한 서사, 갖다 버리는 인물들: 이야기를 종잡을 수 없음. 전개에 개연성도, 당위성도 없으며 인물들은 각각 에피소드를 위한 단역으로 소비되고 끝남. 그렇다고 각 에피소드가 완결성이 있고 일회성 인물이라 할지라도 여운을 남기느냐? 그렇지도 않음. 그전 에피소드들에서는 서사를 이끄는 주체가 이미 사망한 시체라는 특수한 설정상 그런 부분이 쉽지 않았겠다 했는데, 이번 에피는 살아있는 마법사를 내세워놓고도 전개를 조졌음. 이 허접한 이야기를 읽고 독자 입장에서 뭘 느끼란 건지 모르겠음.", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.27 01:09", "comment_id": "comment_li_23223986", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.248) (211.248)", "text": "3. 자극적인 장면 일변도의 전개: 전체 내용이 유기적으로 이어지지 않고 휙휙 장소, 사건을 바꿔대기 바쁨. 쇼츠 보듯이 하나씩 자극적인 장면들을 갈음하여 넘길 뿐, 그 안에서 어떤 의미도 찾을 수 없는 무상한 전개의 연속이 펼쳐짐.", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.27 01:14", "comment_id": "comment_li_23224107", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.248) (211.248)", "text": "4. 차라리 오타쿠를 적극적으로 노려라: 어차피 좆노잼이고 여주 매력도 없는데 차라리 젖보똥, 퍼리, 유니콘, 서큐버스 이런 거 내세워서 씹덕 판타지물로 가든지.. 이번에 빅쭈망 다크깐프 신캐가 나온 만큼 기대해봄", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.27 01:17", "comment_id": "comment_li_23224171", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(61.84) (61.84)", "text": "그래도 재밌다", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.27 01:37", "comment_id": "comment_li_23224833", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version":
