: "", "comment_img": "", "date": "08.30 21:07", "comment_id": "reply_li_20355523", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(58.236) (58.236)", "text": "@ㅇㅇ(121.144) 그래서 진여신3이 한국 헌터물에 직접 영향을 줬다는 작가인터뷰나 장르사연구가져와봐 비슷해보인다는 니감상말고 게임판타지 연구는 MMORPG의 레벨 아이템 상태창 문법을 계보로 잡고, 레이드물은 나귀족에서 MMORPG 레이드 문법을 현대판타지에 붙인 걸로 설명되는데 어디서 진여신3 영향이 정설임? 병신같은새끼", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 21:10", "comment_id": "reply_li_20355661", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(121.144) (121.144)", "text": "@ㅇㅇ(58.236) 니 이론대로 시발아 위에 유사성 언급했던 선협물이 영향줬다는게 정설됨 인터넷글 맘대로 올려서 개소리 씨부리면 정설되냐? 말좀되는 소리해라 하다못해 겜판으로 비교할거면 소아온으로 예시하던가 나혼렙이 오디 겜판이랑 비슷함 나혼렙부터 겜판과달리 이계의 존재 왕등 차라리 진여신3 도쿄수태랑 비슷하다고 보지 예는 무지성 스테창뜨먄 겜판인줄 아네", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 21:39", "comment_id": "reply_li_20357131", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(121.144) (121.144)", "text": "@ㅇㅇ(58.236) 요새 유행하는 회빙환조차도 스태창 뜨고 이세계 전생도 스텟창 다떠 그거보고 다 겜판이라고 하냐? 진짜 경지임? 하다못해 레이드조차 진여생에서 구현된거야", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 21:41", "comment_id": "reply_li_20357202", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(121.151) (121.151)", "text": "@ㅇㅇ(58.236) 이건 국내계보만 보면 잘 모름 겜판물이 아닌 한국 헌터물이 실제 본격적으로 정립되기 시작한게 2010년대고 그 전에 이미 월희/페스나 같은 일본 신전기 작품들이 국내에 유입돼 어반판타지의 기반을 만들어왔음 그리고 저런 신전기물의 계보를 따라 올라가면 일본쪽에서 여신전생이 나오는거고 58.236 말대로 여신전생 초기시리즈랑 헌터물은 상당히 흡사한게 맞고 여신전생이 훨씬 먼저 그 클리셰 정립한게 맞음 레이드물은 지금이야 헌터물이랑 합쳐져서 같은 장르처럼 쓰이지만 헌터물이랑 성립시기랑 계보가 조금 다름", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 21:41", "comment_id": "reply_li_20357248", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(121.144) (121.144)", "text": "@ㅇㅇ(58.236) 나혼렙이 어디 겜판 분위기인지 제대로 설명해봐라 하다못해 나혼렙은 일본미디어 존나 뺏겨쓴게 많은데 그중에서 유명한 헌헌 있을정도 있을정도로 작가가 일본매니아 아니면 설명 안되는 부분들 존나많음", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 21:43", "comment_id": "reply_li_20357342", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(121.151) (121.151)", "text": "@ㅇㅇ(58.236) 애초에 너가 들고온 이융희 다른 논문'한국 장르판타지 수용자들의 장르 의식 연구'에서도 한국 장르판타지는 한국 내에서 자생적으로 발전한게 아니라 서양, 일본에서 들여온 환상성의 파편들을 조합해 장르문법을 만들었다고 분석하고있음 서양 영향이 명백히 있단거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 21:45", "comment_id": "reply_li_20357502", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(58.236) (58.236)", "text": "@ㅇㅇ(121.144) 겜판이랑 헌터물이 같은 장르라고 한 적 없는데 왜 혼자 그 얘기함? 장르 문법의 계승 얘기잖아 실제 연구에서도 달조 같은 VR겜판과 나혼렙을 각각 가상현실/증강현실형 서사로 놓고 게임식 수치화와 성장 문법이 현실 서사로 넘어온 양상을 분석함 그리고 레이드조차 진여신에서 구현됐다는 건 대체뭔소리임? 게임에서 레이드는 DikuMUD-EverQuest-WoW 계보의 다인 협동 보스전이고 진여신3은 싱글플레이 턴제 RPG인데 씨발아 파티로 보스 잡으면 전부 레이드라고 부를 거임? 일본 신전기/어반판타지가 한국에 영향 줬다는 넓은 얘기는 뭐 그럴수도있지 근데 그거랑 한국 헌터물은 진여신3 세계관을 모티브로 한 게 정설은 다르지 씹ㅋㅋ 뭐 증거도없이 지 뇌피셜만 주절주절주절", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 21:48", "comment_id": "reply_li_20357661", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(121.151) (121.151)", "text": "@ㅇㅇ(58.236) 보통 헌터,레이드물 전신격으로 평가되는 나는귀족이다가 2011년에 나왔고 저때 아직 헌터라는 명칭도 나오지 않고 그냥 게이트를 통해 판타지 괴물이 현대 한국에 건너와서 그걸 특수 능력을 각성한 헌터들이 상대하고 그걸 게임적 요소로 설명한다는 대략적인 클리셰가 정립됐음 그리고 저런 클리셰 정립되기 전에 이미 일본 서브컬쳐 문법에 영향받아 한국 장르문학계가 형성되어왔고", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 21:49", "comment_id": "reply_li_20357759", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(121.151) (121.151)", "text": "@ㅇㅇ(58.236) 단적인 예로 2000년대 초에 한국 장르문학계에서 유행했던 이고깽 클리셰 비틀기 있잖음 정통 용사 클리셰 비틀어서 이세계가서 이기적으로 행동하는 그런 클리셰 정작 한국 장르문학쪽에선 정통 이세계 판타지 자체가 유행한적도 없음 일본에서 유행하던 클리셰를 한국에서 비튼 장르가 존나 자연스럽게 클리셰비틀기로 받아들여졌다는거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 21:50", "comment_id": "reply_li_20357822", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(58.236) (58.236)", "text": "@ㅇㅇ(121.151) 니가 말하는 일본 서브컬처가 한국 장르문학 형성에 영향 줬다는 일반론은 나도 그럴수있다 생각함 근데 지금 내가 144랑 따지는 건 한국 헌터물 세계관이 진여신3 모티브인 게 정설이라는게 아니라는거지 일본 영향이 있었다는 얘기를 계속 보태도 진여신3 직계 영향의 근거가 되는 건 아니잖음 난 그 특정 근거를 달라고 하는 중인데 왜 주절거리는거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 21:52", "comment_id": "reply_li_20357903", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(121.144) (121.144)", "text": "@ㅇㅇ(58.236) 니 주장조차 제대로 설명 못하고 긁어오비면서 내주장에 반박조치 안되는 개소리하니깐 니가 무시당하는거 아니노 뇌피셔루도르 이전에 니 주장에 설득력 있는 주장좀 해서 말해보던가 에초 하니더 반박조치 안되있구만 니가 진여신3 안했다는건 잘알겠다", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 21:52", "comment_id": "reply_li_20357906", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(121.144) (121.144)", "text": "@ㅇㅇ(58.236) 니가 설득력이 없으니 다른사람조차 반박하지 병신아 고작 반박한다는게 겜판도르면 누가 설득되노 따귀 마렵노 진짜", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 21:54", "comment_id": "reply_li_20357974", "parent_comment_id": "comment_li_20340626"}, {"writer": "메스이키쉐프", "text": "@asdf(118.235) 뭐 그런거 있잖음 축기기->결단기->원영기/금단기 해서 이 시점부터 자기 영혼 따로 금단 같은거로 분리해서 육체에서 자유로워지고 이후로 작품마다 이름 다른데 이 즈음부터 선계로 승천해서 완전 초월적인 존재 되고 그런식 이 등급제가 선협물 핵심임", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1AOL5o_eP6XdRbvCtQTVuouZXGSM8xhQ9", "date": "08.30 18:52", "comment_id": "reply_li_20349360", "parent_comment_id": "comment_li_20340626"}, {"writer": "메스이키쉐프", "text": "@메스이키쉐프 중국 현지 웹소설 연구하는 사람들은 이런 등급이 상승해가는 수련체계 자체를 중국 웹소설 만의 고유한 특성이라 봐서 나혼렙같은 한국 웹소설들도 중국 선협영향받은 작품이라고 분석하고있음 ㄹㅇ로", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1AOL5o_eP6XdRbvCtQTVuouZXGSM8xhQ9", "date": "08.30 19:22", "comment_id": "reply_li_20350787", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(58.236) (58.236)", "text": "@메스이키쉐프 나혼렙은 전혀 다른쪽아닌가;", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 19:38", "comment_id": "reply_li_20351436", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(58.236) (58.236)", "text": "저런 상태창 나오는 레벨업물은 내가 기억하기론 2010년 크로스번 레벨업부터로 알고있는데 짱깨가 더 오래된거임? 아니면 걍 우기는거임?", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 20:04", "comment_id": 4) 요거함보셈 짱깨마인드 보임", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1AOL5o_eP6XdRbvCtQTVuouZXGSM8xhQ9", "date": "08.30 20:10", "comment_id": "reply_li_20352857", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(121.144) (121.144)", "text": "@ㅇㅇ(58.236) 진여신전생3 꽤 히트침 파생작도 많고 페르소나4 나오기전까진 진여신전생3으로 밥먹고 삼", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 20:13", "comment_id": "reply_li_20352977", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(58.236) (58.236)", "text": "@ㅇㅇ(121.144) 페르소나는 3부터 걍 전부 씹대박치지않았나 진여신전생3보다 에라메가텐이 더 히트쳤겠다", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 20:14", "comment_id": "reply_li_20353034", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(121.144) (121.144)", "text": "@ㅇㅇ(58.236) 페르소나 1,2는 꽤 매니악하고 유의미하게 히트 치진 못했음 페르소나3이 조금 인기 얻다 싶긴해도 그래도 진여신전생3이 주류였음 페르소나4 나오고 본가랑 반전된거", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 20:14", "comment_id": "reply_li_20353036", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(121.144) (121.144)", "text": "@ㅇㅇ(58.236) 2010년대 당시 진여신전생3 동인지 번역하돈게 즈류였돈게 일본 코미케에서 페르소나3보다 더 많이 출품해서임 페르소나4도 포터블 이후로 반등하기 시작한거 포터블이 햄순이라고 여주 나오던때임", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 20:16", "comment_id": "reply_li_20353105", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(121.144) (121.144)", "text": "@ㅇㅇ(58.236) 헌터물 배경보면 진여신전생이랑 꽤 비슷하다고 느껴질것임", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 20:18", "comment_id": "reply_li_20353219", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(58.236) (58.236)", "text": "@ㅇㅇ(121.144) 내가 틀렸나 해서 찾아보니까 페르소나 1부터 진여신 개팼는데 뭔소리하냐 페르소나1 39.2만 장 진 여신전생 3 녹턴  24.6~27만 장", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 20:19", "comment_id": "reply_li_20353303", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(58.236) (58.236)", "text": "@ㅇㅇ(121.144) 진여신3는 오히려 예상보다 안팔린 실패작임 아틀라스에서 35만장 목표로 삼고 냈는데 27만장밖에 못팔았구만", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 20:20", "comment_id": "reply_li_20353352", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(58.236) (58.236)", "text": "@ㅇㅇ(121.144) 그리고 나도 틀린점 있네 p3판매량은 그렇게 많지않네 p3가 라이트유저들 많이 끌어와서 p4부터 잘팔린거네", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 20:22", "comment_id": "reply_li_20353447", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(58.236) (58.236)", "text": "@ㅇㅇ(121.144) 내가 주장한 건 헌터물=겜판이라는 게 아니라 게임판타지에서 쓰이던 게임식 문법이 헌터물에 계승·변형됐다는 거고 그건 자료까지 줬음 근데 니 원래 주장은 나혼렙 같은 한국 헌터물은 진여신3 세계관을 모티브로 한 게 정설이라매? 그래서 그 정설의 근거를 달라고 몇번을 물어보는데 아직도 하나도 안 가져오고 진여신3 안 해봤네 이지랄만하고있네 진여신3은 도쿄수태로 기존 사회가 박살난 뒤 악마들 사이에서 창세를 다루는 포스트아포칼립스고, 전형적 헌터물은 현대사회가 유지된 채 게이트 각성자 길드 협회 레이드가 제도화된 세계관임. 둘이 비슷하다고 니가 느끼는 건 감상이고 직접 모티브가 정설이라고 했으면 작가 인터뷰든 장르사 자료든 가져오면 끝나는 문제라고니 주장 출처 하나만 가져오면 버로우 타준다니까?", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 21:55", "comment_id": "reply_li_20358074", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(121.144) (121.144)", "text": "@ㅇㅇ(58.236) 다시 말하지만 인터넷 긁어온 연구글로 정설 할거면 위에 링크 줬던 예시로 나혼렙은 선협이 모티브다", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 21:56", "comment_id": "reply_li_20358142", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(121.144) (121.144)", "text": "@ㅇㅇ(58.236) https://www.chinawriter.com.cn/n1/2024/0527/c404023-40244118.html?utm.com", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 21:58", "comment_id": "reply_li_20358214", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(121.151) (121.151)", "text": "@ㅇㅇ(58.236) 일본 장르문학계가 한국 장르문학계에 지대한 영향을 끼쳐왔으니까 일본 장르문학계보를 따져야지 한국에 직접 영향끼친 신전기 작품들은 아무 작품 영향도 안받고 허공에서 자연생성된줄앎?", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 21:59", "comment_id": "reply_li_20358264", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(58.236) (58.236)", "text": "@ㅇㅇ(121.144) 개인블로그는 아틀라스 공식자료로 둔갑시키고 升级文은 선협으로 둔갑시키고ㅋㅋ 출처를 읽는 게 아니라 니 주장에 맞게 번역·가공하는 재주가 있노ㅋㅋㅋ 진여신3→한국 헌터물이 정설이라는 자료나 가져와 병신아ㅋㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 22:00", "comment_id": "reply_li_20358339", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(121.151) (121.151)", "text": "@ㅇㅇ(58.236) 게임식 문법이 헌터물에 계승 변형됏다는게 전혀 아니지 쟤가 말하는 여신전생 영향은 게임시스템이 아니라 현대를 침범하는 판타지와 현대 사회속을 살아가던 일반인이 그 판타지 존재들과 맞서싸우는 어반판타지 요소잖아 이 계통은 여신전생 계보가 맞다니까? 왜 논점 파악을 못하고 게임 타령 주절거리는거임? 헌터물 레이드물이 합쳐진건 후반대고 헌터물 장르 정립시기의 영향을 말하는거잖아", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 22:00", "comment_id": "reply_li_20358358", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(58.236) (58.236)", "text": "@ㅇㅇ(121.151) 일본 신전기 영향 자체를 부정하는 게 아니라니까? 근데 현대사회에 판타지가 침범하고 일반인이 맞선다는 계통을 왜 여신전생 직계로 확정함? 여신전생 원작소설이 1986년인데 그 전부터 마계도시 신주쿠(1982), 제도물어(1985) 같은 현대 전기물이 이미 있었는데? 심지어 나스도 Fate 원형을 마계전생이라고 직접 말했구만 여신전생이 아니라 일본 신전기→한국 영향은 인정하는데 여신전생→한국 헌터물이라는 특정 계보는 따로 증명해야 한다는 말임 씨발아 이새끼도 병신이었네", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 22:02", "comment_id": "reply_li_20358406", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(58.236) (58.236)", "text": "@ㅇㅇ(121.151) 에휴 씨발 바로바로 달던새끼들 갑자기 또 사라졌네 이러다가 또 20분후에 쳐와서 댓글 쳐달아놓겠지 안오면 간다 병신들", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 22:07", "comment_id": "reply_li_20358781", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(121.151) (121.151)", "text": "@ㅇㅇ(58.236) 개씹소리야 병신아 ㅋㅋ 나스가 마계전생만 영향받았다고했냐? 쿠훌린도 여신전생보고 만든 캐릭터라고했고 기계적인 천사의 이미지도 여신전생 영향으로 만든 설정이라고 직접 밝혔는데 그리고 니가 들고온 작품들은 월야환담 계통 현대 사회의 이면에 숨은 판타지적 존재를 다루는 계보고 여신전생처럼 현대사회가 본격적으로 판타지적 존재에 침식되고 인간들이 거기 맞서 싸우는건 여신전생부터라니까?", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 22:10", "comment_id": "reply_li_20358947", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(121.151) (121.151)", "text": "@ㅇㅇ(58.236) 20분 이지랄 병신새끼 ㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 22:11", "comment_id": "reply_li_20358983", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(121.151) (121.151)", "text": "@ㅇㅇ(58.236) 애초에 여러 문화권의 신 악마 영웅을 동일한 전투 캐릭터 체계에 넣고 속성 랭크를 부여하는 클리셰 자체가 메가텐부터 정립된거다 병신아", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 22:12", "comment_id": "reply_li_20359030", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(58.236) (58.236)", "text": "@ㅇㅇ(121.151) 데빌맨이 1972년에 이미 현대사회에 데몬족 침공해서 인간 멸망시키려 했고 마계도시 신주쿠는 1982년에 신주쿠 자체가 마계화돼서 인간 주인공이 싸움 여신전생 소설은 1986년인데 또 영향받았다는 사실이랑 장르 원조라는 말을 섞고 있잖아 씨발아ㅋㅋㅋㅋㅋㅋㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 22:12", "comment_id": "reply_li_20359032", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(58.236) (58.236)", "text": "@ㅇㅇ(121.151) 아니 이제는 여러 신화를 한 전투체계에 넣고 능력치 매긴 것도 메가텐이 원조임? 백종원인가 씨발ㅋㅋㅋㅋㅋㅋ D&D가 1976년에 이집트 그리스 북유럽 힌두 중국 일본 신화까지 한 게임에 넣었고 1980년엔 신/영웅 전투스탯까지 박아놨음 메가텐 게임은 1987년이고ㅋㅋ 그리고 설령 메가텐이 일본게임에서 그 문법을 크게 유행시켰다 쳐도 그게 한국 헌터물이 진여신3 모티브라는 증거는 또 아니잖아ㅋㅋㅋㅋㅋㅋㅋㅋ 아 진짜 죽이고싶네", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 22:13", "comment_id": "reply_li_20359085", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(121.151) (121.151)", "text": "@ㅇㅇ(58.236) 아 시발 아주 조상님까지 올라가자고 ㅋㅋㅋ? 현대 브로맨스풍 남캐 원형 에바의 카오루라고하면 사탄까지 들고와야함? 직계 계보를 따지면 그렇다는거잖아", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 22:13", "comment_id": "reply_li_20359091", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(58.236) (58.236)", "text": "@ㅇㅇ(121.151) 직계계보를 따진다면서 그 직계 연결고리를 하나도 안 보여주고 있잖아ㅋㅋ 여신전생이 후대 일본 신전기에 영향 준 건 인정하는데 그게 곧 여신전생>한국 헌터물 직계계보가 되는 건 아닌데? 직계라면 중간 작품이든 작가 증언이든 계보 자료를 가져와야지 비슷하니까 직계는 그냥 니 뇌피셜임 장애인새끼야", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 22:14", "comment_id": "reply_li_20359133", "parent_comment_id": "comment_li_20340626"}, {"writer": "ㅇㅇ(121.151) (121.151)", "text": "@ㅇㅇ(58.236) 한국이 90년대 일본처럼 서양 TRPG 직접 플레이하던 시절이 있긴함? 전부 그 TRPG하던 일본인들이 쓴 판타지쪽 영향받아 장르문법 정립한거잖아 씨발아 일본 말하는건데 이제 D& IhR3", "date": "09.01 02:52", "comment_id": "comment_li_20423141", "parent_comment_id": ""}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
