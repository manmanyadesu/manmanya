: "이상하네 원문도 다시보니까 29세가 맞는데...", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 11:14", "comment_id": "reply_li_22364210", "parent_comment_id": "comment_li_22363806", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러10(175.125) (175.125)", "text": "@글쓴 만갤러(14.54) 그럼 그냥 원문 나이 오타인듯. 주인공이 1961년 생에 작중 배경이 1990년이면 생일 안 지나면 28세. 지나면 29세. 주인공 생일은 10월이라고 써있으니 아직 안 지난듯.그럼 63년생 3월인 구청직원은 생일 지나서 만 27세 (안지나면 26세). 그냥 오타인듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 11:22", "comment_id": "reply_li_22364439", "parent_comment_id": "comment_li_22363806", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "buntzbuntz", "text": "선배 진짜 왤케 잘해줌 주인공이 밤시중이라도 들어줬나  - dc App", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.09 11:07", "comment_id": "comment_li_22363978", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "야 군대만해도 빠릿빠릿한데 눈치좋고 말잘듣는 신병 들어오면 흐뭇한데 직장은 더하지", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 11:22", "comment_id": "reply_li_22364429", "parent_comment_id": "comment_li_22363978", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "buntzbuntz", "text": "@ㅇㅇ 그렇게 비유하니 이해가 되네... 독자들이 봐도 주인공이 보통 놈이 아닌데 당사자들이 보면 오죽할까  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 11:25", "comment_id": "reply_li_22364525", "parent_comment_id": "comment_li_22363978", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "굳이 말하면 아직 맘씨 좀 약한게 단점인데, 사실 선배도 인간인 이상 막 대들지만 않으면 저런놈이 인간적으로 더 호감이지 ㅋㅋ신인새끼가 이야호! 돈빨아먹는거 신난다! 이러고 있으면 암만 사채업자라해도 피하기 마련임", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 11:29", "comment_id": "reply_li_22364647", "parent_comment_id": "comment_li_22363978", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"w
