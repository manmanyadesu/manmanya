4", "comment_id": "comment_li_22363252", "parent_comment_id": ""}, {"writer": "ㅇㅇ(125.179) (125.179)", "text": "주인공 존나 무섭노 ㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.09 10:35", "comment_id": "comment_li_22363267", "parent_comment_id": ""}, {"writer": "만갤러10(175.125) (175.125)", "text": "근데 1화와 이번화 차이가 3년이나 남주인공은 쇼와 36년생이고 1화에 28세라고 함.근데 저 구청직원인 딸은 저번화에 29세라고 했는데, 이번화 생일보니 쇼와 38년생임. 만 나이니까 생일에 따라 소소한 차이는 있더라도, 최소 2~3년은 지나있단 소리임. 그 정도로 지나보이지 않는데.", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.09 10:58", "comment_id": "comment_li_22363806", "parent_comment_id": ""}, {"writer": "글쓴 만갤러(14.54) (14.54)", "text": "1화부터 5달 지났을텐데?? 1화 부도난 어음 보면 2월 25일이고 이번에 나온 파산선고 문서에는 7월 30일이라고 나와있거든. 여전히 헤이세이 2년이고.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 11:06", "comment_id": "reply_li_22363950", "parent_comment_id": "comment_li_22363806"}, {"writer": "글쓴 만갤러(14.54) (14.54)", "text": "아마 내가 나이를 오타냈을 가능성이 클듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 11:08", "comment_id": "reply_li_22364004", "parent_comment_id": "comment_li_22363806"}, {"writer": "글쓴 만갤러(14.54) (14.54)", "text": "이상하네 원문도 다시보니까 29세가 맞는데...", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 11:14", "comment_id": "reply_li_22364210", "parent_comment_id": "comment_li_22363806"}, {"writer": "만갤러10(175.125) (175.125)", "text": "@글쓴 만갤러(14.54) 그럼 그냥 원문 나이 오타인듯. 주인공이 1961년 생에 작중 배경이 1990년이면 생일 안 지나면 28세. 지나면 29세. 주인공 생일은 10월이라고 써있으니 아직 안 지난듯.그럼 63년생 3월인 구청직원은 생일 지나서 만 27세 (안지나면 26세). 그냥 오타인듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 11:22", "comment_id": "reply_li_22364439", "parent_comment_id": "comment_li_22363806"}, {"writer": "buntzbuntz", "text": "선배 진짜 왤케 잘해줌 주인공이 밤시중이라도 들어줬나  - dc App", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1n_QKzThcKx5hvvjGBPOJEuNKDushdeas", "date": "10.09 11:07", "comment_id": "comment_li_22363978", "parent_comment_id": ""},  이런식으로 진짜 법에만 안 걸리고 착각하게 만들도록 편법 오지게 쓰는거임당장 지금 보험약관도 밑에 존나작게 쓰고 CF에서 빠르게 머라머라 읽고 끝내잖아. 이것도 반쯤 편법이고 예전엔 더 심했던거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 07:47", "comment_id": "reply_li_22358684", "parent_comment_id": "comment_li_22356494"}, {"writer": "ㅇㅇ(1.239) (1.239)", "text": "@만갤러10(175.125) 뭔 개소리야 원금 깎였는데 이자가 안깎이면 그게 말이 안되는건데", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 08:50", "comment_id": "reply_li_22360032", "parent_comment_id": "comment_li_22356494"}, {"writer": "ㅇㅇ(1.239) (1.239)", "text": "@만갤러10(175.125) 평균으로 치면 월이자 3푼 5리 일수도 있지만 뒤는 더 높은거임 일본 당시 이자제한이 몇인지는 몰라도 뒷부분엔 무조건 넘음", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 08:51", "comment_id": "reply_li_22360062", "parent_comment_id": "comment_li_22356494"}, {"writer": "ㅇㅇ(1.239) (1.239)", "text": "@만갤러10(175.125) 계약을 갈수록 이자율이 높아집니다 라고 한것도 아니라서 속인게 맞고", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 08:52", "comment_id": "reply_li_22360077", "parent_comment_id": "comment_li_22356494"}, {"writer": "만갤러10(175.125) (175.125)", "text": "@ㅇㅇ(1.239) 월 2푼은 연이자 24%. 쟤네 방식이면 연 42%. 당시 일본이 최대가 54%", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.09 08:54", "comment_id": "reply_li_22360136", "parent_comment_id": "comment_li_22356494"}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></
