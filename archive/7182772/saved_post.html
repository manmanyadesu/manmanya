14d7303c738aacaff7db3fc373", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "만력이란 거 관절이 닳을 수록 강해지는 거였나", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.21 11:26", "comment_id": "comment_li_24402460", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "또라", "text": "아오 분량 절반이 노관심커플얘기노", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.21 11:28", "comment_id": "comment_li_24402536", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇへㅇ", "text": "", "is_reply": false, "dccon": "https://dcimg4.dcinside.co.kr/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65ee2226e896854974b3f23ad74e39ce35d9cffa21da869b8c1de20a8aabf1d68589b6ccee802d06d39", "comment_img": "", "date": "11.21 11:28", "comment_id": "comment_li_24402537", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65ee2226e896854974b3f23ad74e39ce35d9cffa21da869b8c1de20a8aabf1d68589b6ccee802d06d39", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "근데 만갤에서 숭배받은 여장치마는 왜 출하당하고 우에스기는 잘나가는거임", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.21 11:28", "comment_id": "comment_li_24402564", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.186) (121.186)", "text": "여장치마는 작가 만력이 그 정도가 한계였던거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.21 11:30", "comment_id": "reply_li_24402654", "parent_comment_id": "comment_li_24402564", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.186) (121.186)", "text": "이후 전개를 끌고나갈 힘이 없어서 출하당한거", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.21 11:31", "comment_id": "reply_li_24402688", "parent_comment_id": "comment_li_
