": "comment_li_18605804", "parent_comment_id": ""}, {"writer": "응웅앵", "text": "동생은 무슨죄야", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1mJ79k9FrFHX-5T8a4j22OGpWIQRIxbKb", "date": "07.26 10:57", "comment_id": "comment_li_18606256", "parent_comment_id": ""}, {"writer": "만갤러14(220.65) (220.65)", "text": "너무 얄팍하네 시발ㅋㅋㅋ 스페어를 감옥에 가둬놓고 동생 죽으니까 여왕? 왕 목숨 500개임?", "is_reply": false, "dccon": "", "comment_img": "", "date": "07.26 11:13", "comment_id": "comment_li_18606813", "parent_comment_id": ""}, {"writer": "평민", "text": "그냥 흔한 신데렐라 스토리 단편인줄 알았는데 나름 괜찮네", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1KC-dusnbi5xBrzJzla7MG6f7siQOTihG", "date": "07.26 11:44", "comment_id": "comment_li_18607778", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "배경은 서양 배경인데 쌍둥이 태어나면 한쪽 죽이거나 평생 집안의 감옥에 가둬서 은폐하던 옛 일본 문화 넣어버리니 이상해진듯ㅋㅋㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1KC-dusnbi5xBrzJzla7MG6f7siQOTihG", "date": "07.26 11:57", "comment_id": "comment_li_18608317", "parent_comment_id": ""}, {"writer": "ㅇㅇ(175.200) (175.200)", "text": "남동생은 대체 뭔죄고 스페어로 개차반 당하며 존재도 모르는 공주가 왕이되고 그와중에 잘생긴 남자가 그걸 도와주고 성별확실하다", "is_reply": false, "dccon": "", "comment_img": "", "date": "07.26 12:02", "comment_id": "comment_li_18608563", "parent_comment_id": ""}, {"writer": "ㅇㅇ(220.93) (220.93)", "text": "쌍둥이가 불길하다고 죽이는 경우가 동서양 불문하고 많긴 한 건가? 이런 주제가 자주 나오네 근데 아무리 그래도 한쪽을 죽을 때 까지 유폐하거나 아예 죽이는 건 좀 심한 듯...혹시 일본이 특히 더 심한 건가? 귀칼도 그렇고 쌍둥이 나오면 죽이네 마네하는 걸 자주 보는 거 같음", "is_reply": false, "dccon": "", "comment_img": "", "date": "07.26 12:18", "comment_id": "comment_li_18609133", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "실제로 죽이진 않더라도 차후 왕위계승을 위해 완전히 무력화시키는건 맞음. 정말 놀랍게도 조선은 왕조 500년동안 쌍둥이로 태어난 왕족이 단 한명도 존재하지 않는데 확률상으로 불가능에 가까움. 과연 진짜 태어나지 않은걸까? 아니면 쥐도새도 모르게 죽었을까...?", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1KC-dusnbi5xBrzJzla7MG6f7siQOTihG", "date": " li_18594518"}, {"writer": "ㅇㅇ(1.225) (1.225)", "text": "@2.1배TQQQ 단편에 다 때려박기 + 더 극적인 클라이막스를 만들려고 하다보니 ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "07.26 03:23", "comment_id": "reply_li_18595559", "parent_comment_id": "comment_li_18594518"}, {"writer": "ㅇㅇ", "text": "", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1KC-dusnbi5xBrzJzla7MG6f7siQOTihG", "date": "07.26 10:53", "comment_id": "reply_li_18606099", "parent_comment_id": "comment_li_18594518"}, {"writer": "ㅇㅇ(175.200) (175.200)", "text": "그냥 불쌍한 여자를 구해주는 멋진남자 서사를 앞뒤 재대로 생각안하고 그려서 나온 헛점이지 뭘", "is_reply": true, "dccon": "", "comment_img": "", "date": "07.26 11:57", "comment_id": "reply_li_18608349", "parent_comment_id": "comment_li_18594518"}, {"writer": "2.1배TQQQ", "text": "아닌가   사실  남동생은 급사한 것 뿐인데 원망 받으려고 한 건가  근데 애초에 이런 묘사가 없으면  이런 추측도 지랄일 뿐이잖아", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1mJ79k9FrFHX-5T8a4j22OGpWIQRIxbKb", "date": "07.26 02:57", "comment_id": "reply_li_18594543", "parent_comment_id": "comment_li_18594518"}, {"writer": "ㅇㅇ", "text": "살짝 앞당긴 거란 말을 보면 원래는 대관식 이후에 얼마 안 있어 죽을 걸 시기를 앞당긴 게 아닐까 싶음. 아마 주정뱅이의 소원이 왕자 죽여달라는 거라서 그거 들어주면서. 암튼 저도 번역하면서 솔직히 개새끼란 생각 밖에 안 들긴 했습니다", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1KC-dusnbi5xBrzJzla7MG6f7siQOTihG", "date": "07.26 03:00", "comment_id": "reply_li_18594677", "parent_comment_id": "comment_li_18594518"}, {"writer": "2.1배TQQQ", "text": "@ㅇㅇ 아 너는 그걸 바라는 구나랑 악마는 뭐든지 알고 있어 하는 거 보니까  주인공이 생존욕구 때문이라도 동생이 죽는 걸 원했지만 그냥 소원이 없다고 말하며 죽음을 받아들였는데도 악마는 그걸 멋대로 실현해준 거노", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1mJ79k9FrFHX-5T8a4j22OGpWIQRIxbKb", "date": "07.26 03:04", "comment_id": "reply_li_18594813", "parent_comment_id": "comment_li_18594518"}, {"writer": "ㅇㅇ(1.225) (1.225)", "text": "@ㅇㅇ 주정뱅이 보여준건 악마가 아무리 다른 사람들의 꿈을 먹어도 여주 만큼은 아니라는걸 깨닳았다는걸 보여주려는거 같음. 여주가 사실은 자신이 살고 싶어서 남동생이 죽었으면 좋겠다고 생각했던, 여주는 그럴 생각이 없었는데 악마가 독단으로 여주를 살리려고 남동생의 죽음을 앞당겼든 좀 묘한 엔딩이긴 하네", "is_reply": true, "dccon": "", "comment_img": "", "date": "07.26 03:10", "comment_id": "reply_li_18595009", "parent_comment_id": "comment_li_18594518"}, {"writer": "2.1배TQQQ", "text": "@ㅇㅇ(1.225) 둘 다인듯.  걍  왕이 미쳤다는 걸 좀 처음에 한 컷이라도 보여줬으면 괜찮았을텐데", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1mJ79k9FrFHX-5T8a4j22OGpWIQRIxbKb", "date": "07.26 03:11", "comment_id": "reply_li_18595068", "parent_comment_id": "comment_li_18594518"}, {"writer": "ㅇㅇ(1.225) (1.225)", "text": "@2.1배TQQQ 악마는 모든걸 알고있다는 컷에 여주 얼굴이나 평생 악몽을 보여달라는거보면 전자에 좀 더 가까운거 같기도 하고. 쓰레기라고 욕하는데 뭐 살고 싶은건 인간 본능이라 어쩔수없재", "is_reply": true, "dccon": "", "comment_img": "", "date": "07.26 03:14", "comment_id": "reply_li_18595169", "parent_comment_id": "comment_li_18594518"}, {"writer": "ㅇㅇ(1.225) (1.225)", "text": "@2.1배TQQQ 쌍둥이로 태어나서 저주받았다라는 이상한 믿음이 있는 시대니까 왕 입장에서는 나라 생각하면 또 어느정도는 합당한 행동일이도", "is_reply": true, "dccon": "", "comment_img": "", "date": "07.26 03:16", "comment_id": "reply_li_18595249", "parent_comment_id": "comment_li_18594518"}, {"writer": "ㅇㅇ(1.225) (1.225)", "text": "@ㅇㅇ(1.225) 행동일지도", "is_reply": true, "dccon": "", "comment_img": "", "date": "07.26 03:17", "comment_id": "reply_li_18595287", "parent_comment_id": "comment_li_18594518"}, {"writer": "2.1배TQQQ", "text": "@ㅇㅇ(1.225) 독자 입장에선 납득이 안 되는 거지. 남자들이 보면 대부분 어이 없다고 욕하니까. 뭐 여차하면  차기 승계 후보이기 때문에 허튼 짓 못 하게 억압하는 건 이해가 되지만 그냥 트로피 왕족도 아니고, 승계 2순위 왕녀 보고 죽이니 뭐니 하는 게 ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1mJ79k9FrFHX-5T8a4j22OGpWIQRIxbKb", "date": "07.26 03:19", "comment_id": "reply_li_18595370", "parent_comment_id": "comment_li_18594518"}, {"writer": "ㅇㅇ(175.201) (175.201)", "text": "아오 만갤 남자도 많이 한다고", "is_reply": false, "dccon": "", "comment_img": "", "date": "07.27 18:45", "comment_id": "comment_li_18667621", "parent_comment_id": ""}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
