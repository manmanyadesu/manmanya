: "https://lh3.googleusercontent.com/d/1LOWaU1tKGG53K82oA8tKmSUhc7NOxu_C", "date": "09.01 13:00", "comment_id": "reply_li_20437011", "parent_comment_id": "comment_li_20433667"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "졸업식에 우는게 그렇게 이해하기 힘든가..", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.01 13:23", "comment_id": "reply_li_20437553", "parent_comment_id": "comment_li_20433667"}, {"writer": "ㅇㅇ(39.119) (39.119)", "text": "여자를 이해하려하지마라 그냥 정색하고싶으니까 하는거고 울고싶으니까 우는거다", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.01 13:29", "comment_id": "reply_li_20437715", "parent_comment_id": "comment_li_20433667"}, {"writer": "ㅇㅇ", "text": "야마다가 연기한 캐릭터는 왼 쪽에 동떨어져있는 여자애임. 야마다는 칠판에 그려진 남주를 이치카와랑 닮아서 대입하고 있었는데 그 옆에 여주인 다른 여자애가 있으니 정색하는 걸로 추정됨  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1LOWaU1tKGG53K82oA8tKmSUhc7NOxu_C", "date": "09.01 13:37", "comment_id": "reply_li_20437963", "parent_comment_id": "comment_li_20433667"}, {"writer": "만갤러30(1.245) (1.245)", "text": "모에코가 이치카와 팔 끌고 오잖아. 정색 나오는 표정 첫컷 보면 야마다 시선이 모에코랑 이치카와 쪽 향해있음. 모에코가 이치카와 팔잡아서 질투한 거. 그래서모에코한테 만지지 말라고 한 거고.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.01 18:06", "comment_id": "reply_li_20447948", "parent_comment_id": "comment_li_20433667"}, {"writer": "파우더블루.", "text": "@ㅇㅇ 그런거엿노.. 칠판남주가 그 이치카와 망상분신으로 따라다니던 그 캐릭터인가", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/118fsfqp21_GIx0dZ_w4rMeSKznjv049D", "date": "09.01 21:47", "comment_id": "reply_li_20458842", "parent_comment_id": "comment_li_20433667"}, {"writer": "긆힉놃을", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1KvgPMnCINj2rSk5CckrLdU950A7mYEuM", "comment_img": "https://lh3.googleusercontent.com/d/118fsfqp21_GIx0dZ_w4rMeSKznjv049D", "date": "09.01 11:17", "comment_id": "comment_li_20433698", "parent_comment_id": ""}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
