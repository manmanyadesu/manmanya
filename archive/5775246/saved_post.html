y": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1hfZVY7u5g33gcpMBOMyuwybOeuF4IoOq", "date": "08.16 03:02", "comment_id": "comment_li_19595321", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1yYQVzSdHucc8Y__iCRvuHi83srr0pviq", "comment_img": "https://lh3.googleusercontent.com/d/1hfZVY7u5g33gcpMBOMyuwybOeuF4IoOq", "date": "08.16 03:02", "comment_id": "comment_li_19595323", "parent_comment_id": ""}, {"writer": "ㅇㅇ(180.233) (180.233)", "text": "놀랍게도 1화랑 이번화만 보면 다 이해되는 레전드 만화 탄생", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.16 03:03", "comment_id": "comment_li_19595333", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "작가도 엔딩 감당 못한거 같은데 ㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1hfZVY7u5g33gcpMBOMyuwybOeuF4IoOq", "date": "08.16 03:03", "comment_id": "comment_li_19595364", "parent_comment_id": ""}, {"writer": "만갤러18(121.167) (121.167)", "text": "감당못한게 아니라 원래 그리려고했던거 다 못하게하니까 열받아서 엎어버린거임. 원래는 가학 고문 살인으로 그리려고했는데 미야기에서 계속 지랄해대서 못그림. 그래서 엿먹으라고 원래 그리려고했던 가학에 정반대되는 인형놀이같은 연출로 대놓고 그린거고 이번화에서는 돈 개같이 많이 벌었으니 이거먹고 때려친다 = 죽는거로 표현. 야생으로 살던 버릇있어서 받은만큼 돌려준다의 욱하는 성질머리 그대로 나옴.", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.16 03:04", "comment_id": "reply_li_19595405", "parent_comment_id": "comment_li_19595364"}, {"writer": "ㅇㅇ(112.172) (112.172)", "text": "@만갤러18(121.167) 이거 한국웹툰이었으면 표독한녀라고 했을텐데 일녀라고 야생, 받은만큼돌려준다라고 표현해주노", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.16 03:06", "comment_id": "reply_li_19595487", "parent_comment_id": "comment_li_19595364"}, {"writer": "ㅇㅇ(110.9) (110.9)", "text": "애니화 공격받고 과거 성매매 일, sns 공론화로 멘탈 터져서 엔딩 던진 느낌원래 엔딩은 야마다 살찌고 죽는 장면 안 나왔을거 같은데", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.16 03:10", "comment_id": "reply_li_19595582", "parent_comment_id": "comment_li_19595364"}, {"writer": "ㅇㅇ", "text": "@만갤러18(121.167) 야마다 돼지로 만든거나 그냥 죽여버린거나 이유가 있었네", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1hfZVY7u5g33gcpMBOMyuwybOeuF4IoOq", "date": "08.16 03:11", "comment_id": "reply_li_19595617", "parent_comment_id": "comment_li_19595364"}, {"writer": "ㅇㅇ(218.154) (218.154)", "text": "작가피셜) 스트레스성 폭식중이다 인거보면 자캐인 야마다로 자기 투영해서 그림싸다가 현타와서 죽인듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.16 03:13", "comment_id": "reply_li_19595672", "parent_comment_id": "comment_li_19595364"}, {"writer": "ㅇㅇ(220.81) (220.81)", "text": "@ㅇㅇ(112.172) ㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.16 04:04", "comment_id": "reply_li_19597294", "parent_comment_id": "comment_li_19595364"}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
