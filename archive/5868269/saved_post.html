nt_id": "comment_li_19934371"}, {"writer": "ㅇㅇ", "text": "@만갤러39(222.103) 유령 죽이면 그 존재가 사라짐 그래서 죽인 사람은 죄책감 같은게 없어졌지만 여전히 무언가가 그 사람한테 남았고, 그 사람은 그 빈 자리를 자신의 상상력으로 채워넣다보니 점점 더 알 수 없는 공포로 죽음", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1KQKcwvlcs4UeomxqyZignuSS1EAGjsKS", "date": "08.22 13:21", "comment_id": "reply_li_19937362", "parent_comment_id": "comment_li_19934371"}, {"writer": "ㅇㅇ", "text": "@만갤러39(222.103) 유메가 거기서 하마 만난 건 자기 결심 확인하는 이유도 있을거고 디자이너랑 거기서 만나기로 되어있어서 그런것도 있는 듯 덤으로 하마 얼굴이 안보이고 말도 못꺼낸건 죄책감 때문에 그런거고 백만년의 저주 받는 동안 죄책감에 시달린 후에야 하마 짱 이야기를 꺼낼 수 있게된듯", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1KQKcwvlcs4UeomxqyZignuSS1EAGjsKS", "date": "08.22 13:22", "comment_id": "reply_li_19937406", "parent_comment_id": "comment_li_19934371"}, {"writer": "ㅇㅇ", "text": "@만갤러30(210.104) 죽음의 왕 아파트 청소편은 우선 청소부선배가 원래 죽음의 왕이었는지 아님 어떠한 계기로 죽음의 왕이 되었는지는 불명. 주인공이 알바하기 전에 아파트 통채로 있던 사람들이 다 죽음 // 이 후 그곳에서 나카타리 라는 말을 꺼내면 반드시 죽게 됨 (주인공이랑 같이 갔던 알바들이 죽는 이유) ( 나카타리 라는 말 자체가 일본어로 이름 말하다임 ) 주인공은 끝까지 나카타리라는 말을 한 번도 안하고 하룻밤이 지나자 아파트 통채로 걸려있던 저주가 풀리고 유메랑 하마는 남은 시체들을 청소하게 됨", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1KQKcwvlcs4UeomxqyZignuSS1EAGjsKS", "date": "08.22 13:25", "comment_id": "reply_li_19937487", "parent_comment_id": "comment_li_19934371"}, {"writer": "00(118.219) (118.219)", "text": "@만갤러39(222.103) 그거 진짜 유령만나는 데가 아님. 아카식 레코드처럼 디자이너들이 사용하는 외장 기억장치 같은건데, 인간이 멋대로 상업적으로 이용하는 거임. 하얀문은 단순 재생 장치, 빨간건 삭제 장치. 그래서 하얀건 가도 만나기만하고 아무 문제 없고, 빨간건 지우는 대신에 기억에 공백을 만들어서 정신적으로 대미지를 입히는 문제가 있음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.22 14:32", "comment_id": "reply_li_19939852", "parent_comment_id": "comment_li_19934371"}, {"writer": "00(118.219) (118.219)", "text": "@00(118.219) 해당 에피소드에서 유메가 고개숙이고 독백하는 장면 보면 이해감.", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.22 14:34", "comment_id": "reply_li_19939914", "parent_comment_id": "comment_li_ ntent.com/d/1KQKcwvlcs4UeomxqyZignuSS1EAGjsKS", "date": "08.22 10:16", "comment_id": "reply_li_19931067", "parent_comment_id": "comment_li_19925609"}, {"writer": "ㅇㅇ(211.234) (211.234)", "text": "@ㅇㅇ 그럼 최초의 유령상태 야요이를 유메가 조지고 리셋>새로운 세계선의 원시인 야요이를 디자이너가 없애버린건가", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.22 10:17", "comment_id": "reply_li_19931105", "parent_comment_id": "comment_li_19925609"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(211.234) 존재말살 해봤자 리셋된 세계선에서 야요이는 또 나오니까 유메가 계속 알려주잖아 디자이너 너네들은 신경도안썼는데 최초의 유령이 원인이라고 그러니까 리셋하면 걜 조지러고", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1KQKcwvlcs4UeomxqyZignuSS1EAGjsKS", "date": "08.22 10:21", "comment_id": "reply_li_19931203", "parent_comment_id": "comment_li_19925609"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(211.234) 그런듯디자이너는 생각도 못했던 애였는데 유메가 직접가서 처형자 보여주니까 디자이너도 그래 찐막으로 해보고 안됨 포기하자 했는데 성공한 세계선인듯", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1KQKcwvlcs4UeomxqyZignuSS1EAGjsKS", "date": "08.22 10:24", "comment_id": "reply_li_19931291", "parent_comment_id": "comment_li_19925609"}, {"writer": "ㅇㅇ(211.234) (211.234)", "text": "@ㅇㅇ 그럼 일단 유령 야요이 유메가 저주로 조지고 > 디자이너가 멸망후 리셋 때려서 원시인 야요이부터 조진건가", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.22 10:25", "comment_id": "reply_li_19931323", "parent_comment_id": "comment_li_19925609"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(211.234) ㅇㅇ 리셋전 세계 야요이 뒤진과정 설명하면  야요이의 수많은 분열중 하나가 저주걸린채로 도망감>>  저주비디오가 그 놈 쫓다가 야요이가 여럿있는걸 깨달음>> 근데 집행자때문에 접근 못함 >> 진이 집행자 처리함 >> 모든 야요이들 찾아가서 죽임 리셋 후 : 디자이너들이 최초의 유령이 원인인거 깨닫고 야요이 담굼", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1KQKcwvlcs4UeomxqyZignuSS1EAGjsKS", "date": "08.22 10:28", "comment_id": "reply_li_19931389", "parent_comment_id": "comment_li_19925609"}, {"writer": "만갤러29(116.43) (116.43)", "text": "원래 시공간 건드는 작품들이 다 귀에걸면 귀걸이 코에걸면 코걸이라 걍 모든 세계에서 뒤졋음 ㅅㄱ 이런식으로 이해하고 넘어가는게 속편하다 ㅇㅇ..", "is_reply": true, "dccon": "", "comment_img": "", "date" 초기화시킨 거고 뒤가 약해져서 힘 잃은 게 맞는 것 같은데", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1H-HP2d8ckgQtOI5WJ1IT_IlyVEOpqclt", "date": "08.22 06:43", "comment_id": "reply_li_19926059", "parent_comment_id": "comment_li_19923052"}, {"writer": "2.1배TQQQ", "text": "저번 화에서 디자이너들이 포기했었지만 여태 초기화의 목적 자체가 새로운 미래를 보고 싶은 욕망 때문이었다잖아", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1H-HP2d8ckgQtOI5WJ1IT_IlyVEOpqclt", "date": "08.22 06:46", "comment_id": "reply_li_19926133", "parent_comment_id": "comment_li_19923052"}, {"writer": "개돼지인생", "text": "전지는 세계 리셋됐으니까 당연히 잃는거아님?", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1H-HP2d8ckgQtOI5WJ1IT_IlyVEOpqclt", "date": "08.22 07:38", "comment_id": "reply_li_19927139", "parent_comment_id": "comment_li_19923052"}, {"writer": "ㅇㅇ(218.52) (218.52)", "text": "전지능력 자체가 뒤와 연관된 능력이라서 뒤가 약해지면 당연히 약해지는게 맞음 그리고 리셋된 이후의 유메는 아마도 유복한 가정에서 평탄하게 살았으니 전지능력이 각성될수도 없고", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.22 08:03", "comment_id": "reply_li_19927540", "parent_comment_id": "comment_li_19923052"}, {"writer": "ㅇㅇ(110.9) (110.9)", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1hzBCI_Utnspw4lNMFj-yh6zuSgMTS5Cw", "comment_img": "", "date": "08.22 04:38", "comment_id": "comment_li_19923077", "parent_comment_id": ""}, {"writer": "만갤러3(211.235) (211.235)", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1wy_cHoWMf6zGpzeaYoJhcq2GTXYm8DHg", "comment_img": "", "date": "08.22 04:38", "comment_id": "comment_li_19923089", "parent_comment_id": ""}, {"writer": "포말하우트A", "text": "내 토요일을 책임지는 만화가 이렇게 끝나버렸구나  - dc App", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1H-HP2d8ckgQtOI5WJ1IT_IlyVEOpqclt", "date": "08.22 04:39", "comment_id": "comment_li_19923115", "parent_comment_id": ""}, {"writer": "만갤러17(211.234) (211.234)", "text": "ㅠㅠ", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.22 10:59", "comment_id": "reply_li_19932455", "parent_comment_id": "comment_li_19923115"}, {"writer": "ㅇㅇ", "text": "이렇게 깔끔하게 끝나는 만화 얼마만이냐 ㅋㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1KQKcwvlcs4UeomxqyZignuSS1EAGjsKS", "date": "08.22 04:40", "comment_id": "comment_li_19923125", "parent_comment_id": ""}, {"writer": "ㅇㅇ(147.47) (147.47)", "text": "200화까지 보고 주요 타임라인 정리백만년전, 한 인간이 죽기 싫어서 '뒤'의 힘으로 죽음을 극복함. 타인의 인격 기생/탈취 등으로 증식까지 해나가면서 현재까지 살아남고, 고쿠료 야요이라 불리게 됨이새끼가 백만년동안 뒤의 힘으로 계속 살아있고 남의 몸을 뺏어가는 등 뒤랑 계속 연결되어 있어서 세계와 뒤와의 연결이 계속 이어지고 넓어져서 오늘날에 와서는 각성유메도 멸망을 확정할 수준이 됨.뒤의 힘으로 미래를 볼 수 있거나(백엽상, 사서 등) 그 수준의 권능이 있으면 이 멸망을 알 수 있음. 디자이너는 (인류의?)역사를 보는게 목적인데, 인류가 괴이로 멸망해서 역사가 끝나버리니까 존나게 루프 시키고 역사개변을 해서 오늘날까지 인류를 지속시키는데 성공함", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.22 21:48", "comment_id": "comment_li_19957959", "parent_comment_id": ""}, {"writer": "ㅇㅇ(147.47) (147.47)", "text": "그럼에도 야요이는 주요 역사적 인물도 아니고 해서 놓쳤나본지, 결국 야요이가 원인이란걸 알지 못해서 멸망을 회피하지 못했고 이번 세계선에서 아 씨발 더 못해먹겠네 ㅅㄱ함. 스타맨은 디자이너랑 아는건지 다른 방식으로 알았는지 아무튼 그걸 알아서 Q에 알려줌Q는 백엽상 등으로 미래를 본 적이 있음. 토키코는 Q에 처음에는 죽은 아버지를 살리러 Q에 들어갔는데, 이 멸망의 미래를 추측하거나 확인하고 밖에서 살아가는 친구를 위해 목적이 바뀌게 됨. Q(혹은 토키코)는 이 멸망의 미래를 막기 위해 똥꼬쑈를 하는데, 니지무라 유메라는 SSR 좆사기 만능 답안지를 발견함. 하지만 유메는 유복한 가정에서 자라면서 좆사기 능력이 퇴화해갔고, 이럼 인류멸망 못막는다고 생각한 Q는 야요이와 협력해서 유메의 인생을 조져놓음", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.22 21:54", "comment_id": "reply_li_19958337", "parent_comment_id": "comment_li_19957959"}, {"writer": "ㅇㅇ(147.47) (147.47)", "text": "그 결과 유메는 냄새라는 형태로 능력의 일부를 되찾음. 정신적 스트레스로 능력을 되찾게 할 수 있었고, 인류 멸망 회피를 위해 풀파워 각성유메를 원한 Q(토키코)는 여러 우라바이트로 유메를 성장시키고 한 명과 유대감을 형성시키게 한 후, 유메의 눈앞에서 가장 소중한 사람을 죽이는 방식으로 유메를 각성시키려 했고 야요이가 실행책으로 행동해서 성공함. 이 시점에서 뒤는 더이상 감추는게 불가능해지는 수준이 됨(디자이너가 때려친 영향도 있을것). 야요이는 애초에 그런 좆사기 능력을 자기가 먹고 싶어서 토키코를 통수치고, 유메는 풀파워의 힘으로 야요이를 족치는 설계를 성공시킴.", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.22 22:02", "comment_id": "reply_li_19958730", "parent_comment_id": "comment_li_19957959"}, {"writer": "ㅇㅇ(147.47) (147.47)", "text": "하지만 인류 멸망 회피를 위한 Q, 토키코의 계획은 각성유메는 성공했지만 각성유메도 2026년 멸망 확정을 바꿀 수는 없어서 유메도 포기, 인류는 멸망. 다만 유메는 디자이너의 거처를 복구 시키는 등 협력해주고 야요이의 존재를 알려줘서 이새끼 조지면 2026 이후를 볼 수 있다고 알려줌. 디자이너는 작중 세계선 인류 멸망까지 (또) 보고 아 이번에도 또 망했네 이제 진짜 때려칠까?하다가 그래도 유메 해놓은 것도 있고 말해준 것도 있는데 찐막?으로 세계 리셋을 한번 더 했고 유메 말대로 야요이를 족쳤는지 세계 멸망급 괴이가 시계 딸깍으로 처리될 정도의 뒤가 개좆밥이 된 이번 세계선(혹은 현실 세계선)이 됨. 디자이너는 2027년을 처음 보고, 챠챠 야기는 생존해서 미국신혼여행, 유메하마는 세계여행 등 해피엔딩", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.22 22:09", "comment_id": "reply_li_19959075", "parent_comment_id": "comment_li_19957959"}, {"writer": "ㅇㅇ(59.14) (59.14)", "text": "아 그러고 보니 사서편의 좆경녀 이 새끼 자기 미래 꼬라지 보고 살자 시도했는데 생각해 보니 리셋 이전 미래 보고 그런 거였네ㄷㄷㄷ", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.22 22:50", "comment_id": "reply_li_19960861", "parent_comment_id": "comment_li_19957959"}, {"writer": "ㅇㅇ(115.138) (115.138)", "text": "이거 초반엔 재밋엇는데 뒤로갈수록 게(옆으로 걷는 게임)병신만화되더라", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.22 22:04", "comment_id": "comment_li_19958843", "parent_comment_id": ""}, {"writer": "만갤러50(211.235) (211.235)", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1-UD-Y0mhcmomQ7CF6Iu2rQtt4hlOx9mJ", "comment_img": "", "date": "08.22 23:19", "comment_id": "comment_li_19962220", "parent_comment_id": ""}, {"writer": "만갤러51(219.251) (219.251)", "text": "머인 엔딩이 뭐노 이기....띄엄띄엄 나와서 다 까묵고 뭔지 몰루갯노", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.22 23:41", "comment_id": "comment_li_19963259", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "재밌었다이제 쿠니타마 완결만 남았나", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1jeypAyVhZGA1n-_aOCnZk_hpxKakKy30", "date": "08.22 23:50", "comment_id": "comment_li_19963661", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "잠만 근데 아기 몸에 들어갔다가 평생 고문 당하던 놈 풀려났겠네?", "is_reply": false, "dccon": "", "comment_img":  commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
