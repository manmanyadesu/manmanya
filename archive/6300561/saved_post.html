sercontent.com/d/1fiOhuTvLEmyZWrnCitKhSHOJIo8IN739", "comment_img": "https://lh3.googleusercontent.com/d/1i0NAk2m_dWUrZ4OWc0A7ahO6ttVlbQU5", "date": "09.21 18:47", "comment_id": "comment_li_21452808", "parent_comment_id": ""}, {"writer": "사촌용", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1IHrMnUrCtImDAsf1qHShhcvrF3bUZFlQ", "comment_img": "https://lh3.googleusercontent.com/d/1l91LeRiHxkRSqvjbCiNRyajGyC_qJXiT", "date": "09.21 18:47", "comment_id": "comment_li_21452810", "parent_comment_id": ""}, {"writer": "만븧", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1S27ut1bjltlQwTRHIUD5nr8DkWo6Jae1", "comment_img": "https://lh3.googleusercontent.com/d/1i0NAk2m_dWUrZ4OWc0A7ahO6ttVlbQU5", "date": "09.21 18:47", "comment_id": "comment_li_21452823", "parent_comment_id": ""}, {"writer": "만갤러1(137.184) (137.184)", "text": "전쟁상황이라면 생존이 최우선 목표다. 생존이 최우선한 인간에게 반성을 요구하는건 참.. 뭔가 존나 유치함ㅋ 생존에 맞딱뜨리지 않는 사회를 만드는게 중요한거지 반성이 중요한게 아니다. 즉, 교화시스템은 반성이 목표가 아닌 반성할 필요없는 사회를 만드는거다. 반성은 다자간의 소통 아닌 개인경험이 우선하기 때문이다다 집어치고 투표거부해라!낄낄 ^^", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.21 18:48", "comment_id": "comment_li_21452856", "parent_comment_id": ""}, {"writer": "만갤러2(121.158) (121.158)", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1K4zec0HwM8l85zxksD29FpF82zXb8yuW", "comment_img": "", "date": "09.21 18:49", "comment_id": "comment_li_21452900", "parent_comment_id": ""}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
