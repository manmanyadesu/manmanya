xt": "", "is_reply": false, "dccon": "https://dcimg4.dcinside.co.kr/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65def246efb6df28dd4e36f7d0634ac3154e62f4064c2dea4045f6771305dc04b31a81adedcf85d9cafa9489a9df9b7ae16f85877037f2449", "comment_img": "", "date": "11.27 23:44", "comment_id": "comment_li_24760627", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65def246efb6df28dd4e36f7d0634ac3154e62f4064c2dea4045f6771305dc04b31a81adedcf85d9cafa9489a9df9b7ae16f85877037f2449", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러2(121.177) (121.177)", "text": "뭐땜시 절로갓더라...  - dc App", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.27 23:45", "comment_id": "comment_li_24760695", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러3(118.222) (118.222)", "text": "27일인데?", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.27 23:47", "comment_id": "comment_li_24760818", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.168) (121.168)", "text": "야진만 가면 다죽네", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.27 23:48", "comment_id": "comment_li_24760877", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러4(182.226) (182.226)", "text": "오래돼서 기억이 잘안나는데 야진 이새끼 이정도로 한결같이 안얕보이겠다고 쳐죽여대던 이유가 뭐였지?? 얕보였다가 좆된적 있었던가.", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.27 23:48", "comment_id": "comment_li_24760881", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러9(222.9) (222.9)", "text": "이세계 와서 얕보였다가 마녀사냥당할뻔했잖아", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.27 23:51", "comment_id": "reply_li_24761058", "parent_comment_id": "comment_li_24760881", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.204) (211.204)", "text": "처음부터 짐승새끼였던 건 아니고 초반에 연달아서 억까 존나 당함", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.27 23:56", "comment_id": "reply_li_24761368", "parent_comment_id": "comment_li_24760881", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.150) (121.150)", "text": "\"얕보이면 끝장이다\"", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.28 00:09", "comment_id": "reply_li_24762007", "parent_comment_id": "comment_li_24760881", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "이세계 오니까 본성풀린 가라테부림마임", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.28 00:13", "comment_id": "reply_li_24762174", "parent_comment_id": "comment_li_24760881", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(125.241) (125.241)", "text": "초반 모험자했을 당시 지금은 약하니 숙여야겠다고 했다가 약한 놈으로 낙인 찍힘. 이후 마을 최강 파티들어가도 주변에선 버스타는 놈인줄 알고 얕보고 욕하고 따로 떨어질때 몰래 뒷치기나 죽여 템 파밍하려했음. 그때 이미 나름 쎄서 알아서 처리했는데 그래도 종종 덤빔. 문제는 이후 아진 실력을 알게 된 마을 모험가들이 저새끼 진짜 쎈거고 우리가 잘못건들였으니 아진한테 당하기 전에 죽이자 모드로 들어감. 그거 이후 초장 어지간하면 기선제압 모드 들어감", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.28 00:14", "comment_id": "reply_li_24762185", "parent_comment_id": "comment_li_24760881", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(61.81) (61.81)", "text": "원래 살인귀인데 일본에는 경찰이 있고 칼은 안들고 다녔지만 이세계는 경찰도 없고 칼 하나씩 갖고 다니니까 본성 나온거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.28 00:32", "comment_id": "reply_li_24762968", "parent_comment_id": "comment_li_24760881", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "2.1배TQQQ", "text": "애초에 등을 믿고 맡길 동료는 커녕 아는 사람도 제대로 없는 무연고자 고블린이어서  얕보이면  마을주민 두세명한테도 습격 당하는 신세임", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.28 01
