t_img": "", "date": "10.10 09:43", "comment_id": "reply_li_22413643", "parent_comment_id": "comment_li_22411540", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@만갤러9(211.235) 혼구녕 ㅋㅋ옆에 있던 베테랑들도 2000만 대출에 싱글벙글하면서 지켜봐놓고 일 망가지니까 괜히 담당자 탓하는 평범한 구조잖아", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.10 09:53", "comment_id": "reply_li_22413987", "parent_comment_id": "comment_li_22411540", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(180.227) (180.227)", "text": "저기서 끊었으니 말을 어떻게 이어갈지 일단 봐야지", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.10 10:30", "comment_id": "reply_li_22415252", "parent_comment_id": "comment_li_22411540", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(116.42) (116.42)", "text": "저게 전세사기, 대한민국에서 전세사기가 많은 이유는 그냥 등기에 공신력이 없기 때문. 공신력이 있으면 피해자 구제가 어느정도 되지만 수수료 쳐먹으면서 등기 발급하는데 책임은 전혀 안짐 지금 전세 사기 막겠다고 아예 전세 틀어 막고 있는데 개 헛발질짓거리지", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.10 08:35", "comment_id": "comment_li_22411757", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "AKDARI", "text": "둥기에 공신력이 있으면 서류위조한 사람이 실제로 소유권을 취득해서 그것도 그것대로 문제임  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.10 08:42", "comment_id": "reply_li_22411943", "parent_comment_id": "comment_li_22411757", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "AKDARI", "text": "원래 집주인은 영문도 모른채 집을 날리고, 그저 위조범에게 손해배상을 청구할수밖에 없음, 세계에서 등기에 공신력을 인정하는 나라는 지금도 압도적으로 소수임  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.10 08:45", "comment_id": "reply_li_22412001", "parent_comment_id": "comment_li_22411757", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(61.82) (61.82)", "text": "멍청아 그럼 등기 사기는 어떻게 대처 해야 하는데? 잘살던 사람들 하루 아침에 집뺏기노? ㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.10 10:38", "comment_id": "reply_li_22415561", "parent_comment_id": "comment_li_22411757", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(61.82) (61.82)", "text": "등기가 공신력이 있으면 니네 집 등기를 사기꾼이 위조해서 거래해버리면 니네집이 제3자 한테 매매가 되버림 그럼 니는 어떻게 구제 받을래? 전세 사기는 비교도 안되는 개썡쇼 일어 나는거다 ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.10 10:40", "comment_id": "reply_li_22415651", "parent_comment_id": "comment_li_22411757", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러13(116.36) (116.36)", "text": "@AKDARI 옜날에는 그게 맞는데 전자등기로 바꾸고 기록을 안남기고 위조가 불가능한 구조로 만드는게 가능해진 뒤부터는 바뀌어야함", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.10 10:42", "comment_id": "reply_li_22415761", "parent_comment_id": "comment_li_22411757", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러18(1.251) (1.251)", "text": "@AKDARI 정말 그렇네", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.10 12:14", "comment_id": "reply_li_22419468", "parent_comment_id": "comment_li_22411757", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러20(61.73) (61.73)", "text": "@AKDARI 이젠 전자등기의 시대인데 뭔", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.10 12:44", "comment_id": "reply_li_22420511", "parent_comment_id": "comment_li_22411757", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(119.197) (119.197)", "text": "@ㅇㅇ(61.82) 병신 그게 위조가 전세사기고 등기의 공신력은 수수료 받아쳐먹으면서 책임 안지는게 문제인데", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.10 13:52", "comment_id": "reply_li_22422795", "parent_comment_id": "comment_li_22411757", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(49.161) (49.161)", "text": "등기 위조해서 발생한 전세사기는 천건에 한건도 안된다. 전세사기는 거의 백프로 담보가치 잘못파악한 깡통전세 케이스지.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.10 14:27", "comment_id": "reply_li_22423921", "parent_comment_id": "comment_li_22411757", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러32(112.170) (112.170)", "text": "등기에 공신력 갖추려면 바꿔야할 법들도 많고 무엇보다 조사확인, 공증같은 방법으로 엄청 깐깐하게 심사해야하는데 지금보다 등기비용 훨씬 많이들고 등기 넘어가는데도 몇달걸리면 돈 없는것들은 집 사지마라는 소리임", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.10 20:06", "comment_id": "reply_li_22438720", "parent_comment_id": "comment_li_22411757", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.39) (118.39)", "text": "등기 공신력 있으려면 지금보다 법원공무원 훨씬 더뽑아야됨 ai시대 와서 비용 감소하면 할수있으려나", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.10 21:23", "comment_id": "reply_li_22442137", "parent_comment_id": "comment_li_22411757", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "빨리 다음화", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.10 08:37", "comment_id": "comment_li_22411802", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "평민", "text": "어떻게 수습하려나 ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.10 08:40", "comment_id": "comment_li_22411897", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러5(118.235) (118.235)", "text": "아니 저땐 법무사가 없나? 저런 융자해주면서 법무사도 안낀다고? 법무사만 대동해도 금방 잡아낼거 같은데", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.10 08:43", "comment_id": "comment_li_22411967", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "윗타", "text": "법무사도 일일이 (위조된) 등기부나 확인하는 정도지 더 자세하게는 안해. 왜냐. 여기서 실수해도 법무사 책임까진 안가거든.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.10 08:48", "comment_id": "reply_li_22412068", "parent_comment_id": "comment_li_22411967", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러5(118.235) (118.235)", "text": "최소한 법무사 있었으면 저런식으로 동의서 같은걸로 퉁치자 이런 소리는 안했겠지. 확인서면이든 뭐든 소유주 입증방법 하나라도 더 물어봤을꺼고, 거기서 뭔가 이상한게 드러나서 멈출수라도 있었겠지. 물론 거기까지 넘길정도의 사기꾼이면 당할 수밖에 없겠지만서도.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.10 08:54", "comment_id": "reply_li_22412204", "parent_comment_id": "comment_li_22411967", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "중간에 나온 할배가 법무사 아니냐?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.10 09:05", "comment_id": "reply_li_22412490", "parent_comment_id": "comment_li_22411967", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러10(59.9) (59.9)", "text": "저 사법서사가 법무사임 한국은 일제때 도입했다가 이름만 바꾼거고 일본은 그대로 쓰는중임 권리서는 아마 한국의 등기권리증=등기필증 같은데 등기할때 한번 발급해주고 재발급 안해줘서 잃어버릴만 함 일본은 어떤지 모르겠는데 비슷하니까 보증제도까지 만들어놓은거겠지", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.10 09:57", "comment_id": "reply_li_22414109", "parent_comment_id": "comment_li_22411967", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.234) (211.234)", "text": "요새 법무사들도 등기필증 없어도 등기부등본만 보고 증빙서류 떼주는거 있음. 그걸로 등기이전이랑 저당 다 가능함ㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.10 10:06", "comment_id": "reply_li_22414434", "parent_comment_id": "comment_li_22411967", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러32(112.170) (112.170)", "text": "@만갤러5(118.235) 중간에 중개사처럼 나온 할배가 법무사같은데 옛날이나 지금이나 등기필증 잃어버리는 케이스는 잦아서 이상하게 생각 안할법함. 지금도 잃어버리면 본인임을 증명하기만 해도 되는거라", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.10 20:09", "comment_id": "reply_li_22438844", "parent_comment_id": "comment_li_22411967", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(120.142) (120.142)", "text": "사수 급해지니 본성나오노", "is_reply": false, "dccon": "",
