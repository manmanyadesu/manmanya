""}, {"writer": "HTML", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1JhqxXwJq_J-6iDN0NFOd88IeCizbKv3y", "comment_img": "https://lh3.googleusercontent.com/d/1TRKTo1NLyp24OqDxLwjFCw7ly-bXNvf9", "date": "09.09 05:18", "comment_id": "comment_li_20823103", "parent_comment_id": ""}, {"writer": "만갤러3(198.145) (198.145)", "text": "저리 쉽게 웨이트다운이 밝혀질거면 굼벵이마법이라고 불릴 이유가 ㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.09 05:19", "comment_id": "comment_li_20823121", "parent_comment_id": ""}, {"writer": "ㅇㅇ(112.186) (112.186)", "text": "아아 이건 웨이트 다운이라는것이다", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.09 05:40", "comment_id": "reply_li_20823385", "parent_comment_id": "comment_li_20823121"}, {"writer": "메스이키쉐프", "text": "정말 즐겁다. 조금이라도 세게 발을 구르면 벽에서 몸이 떨어져 버리지만, 그것만 조심하면 벽도 발판으로 이용할 수 있을 것 같다.“지금까지의 중력 마법사들은 여기에 도달하기도 전에 포기해 버린 모양이군.”이 즐거움을 알고도 중력 마법을 굼벵이 마법이라고 부를 수 있을까. ㄴ중력마법 뽑은애들 다 부엉이 바위가서 아무도 2레벨안찍어봤다고함", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1TRKTo1NLyp24OqDxLwjFCw7ly-bXNvf9", "date": "09.09 06:07", "comment_id": "reply_li_20823694", "parent_comment_id": "comment_li_20823121"}, {"writer": "ㄷㅇㅎㅎ(121.161) (121.161)", "text": "중력이라는 개념을 주인공이 확립한것 대 상 혁", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.09 07:12", "comment_id": "reply_li_20824536", "parent_comment_id": "comment_li_20823121"}, {"writer": "ㅇㅇ(211.224) (211.224)", "text": "ㄹㅇㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.09 16:48", "comment_id": "reply_li_20842768", "parent_comment_id": "comment_li_20823121"}, {"writer": "ㅇㅇ(121.182) (121.182)", "text": "아니 웨이트 다운도 있는데 저 마법이 소외된다는게 어이 없네", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.09 05:29", "comment_id": "comment_li_20823279", "parent_comment_id": ""}, {"writer": "ㅇㅇ(58.230) (58.230)", "text": "생물에게 손대고 얼음마법을 써본놈이 없었다? 마치 이번 기수가 마법을 받을때 마법이 처음 생긴것 같군", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.09 05:35", "comment_id": "comment_li_20823341", "parent_comment_id": ""}, {"writer": "PQRSTAED", "text": "설마......", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1TRKTo1NLyp24OqDxLwjFCw7ly-bXNvf9", "date": "09.09 09:08", "comment_id": "reply_li_20827212", "parent_comment_id": "comment_li_20823341"}, {"writer": "ㅇㅇ(14.39) (14.39)", "text": "다른 사람들은 웨이트 다운 찍자마자 하늘로 날라가서 사라진거 아니면 설명안됨 - (라는 의견을 봣엇음)", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.09 05:51", "comment_id": "comment_li_20823526", "parent_comment_id": ""}, {"writer": "ㅇㅇ(14.39) (14.39)", "text": "아니 같은 중력 증가와 감소라도 묘사에 따라ㄷㄷ 주인공 이걸살리네 vs 걍 개시기잖아가 나뉘는데이건 묘사를 걍 ㅈ도 못 하는듯 - (라는 의견을 봣엇음)", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.09 05:53", "comment_id": "reply_li_20823539", "parent_comment_id": "comment_li_20823526"}, {"writer": "ㅇㅇ(14.39) (14.39)", "text": "걍 나같으면원래 중력마법 : 웨이트업은 키자마자 인간호떡되고 어찌저찌 웨이트다운까지 찍었다해도 조금 움직이자마자 하늘로 날라가서 걍 꽝취급주인공 : 마법 재능 ㅆㅎㅌㅊ라 걍 무거운 정도에 그침 - (라는 의견을 봣엇음)", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.09 05:59", "comment_id": "reply_li_20823606", "parent_comment_id": "comment_li_20823526"}, {"writer": "ㅇㅇ(14.39) (14.39)", "text": "이후 전개 : 아예 격투가 컨셉으로 감그리고 중력 고른 애들 수련시켜주는 새로운 무파 창설이런식으로 하겠다 - (라는 의견을 봣엇음)", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.09 06:00", "comment_id": "reply_li_20823616", "parent_comment_id": "comment_li_20823526"}, {"writer": "ㅇㅇ(14.39) (14.39)", "text": "그리고 웨이트 다운도 ㅅㅂ 처음부터 잘 쓰는게 어딧어몸무게 가벼워져서 컨트롤 힘들고 휘청거린다던가 작은 충격 받아도 더 크게 날라간다거나 지속시간 계산 못 해서 곤혹을 치른다거나 그런거 없냐고...  - (라는 의견을 봣엇음)", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.09 06:12", "comment_id": "reply_li_20823748", "parent_comment_id": "comment_li_20823526"}, {"writer": "ㅇㅇ", "text": "서론으로만 30화씩 중력설정 놀음할듯잘해야 한국식 좆툰 수준되는거고..유명작가 아니면 1,2화에서 도파민 샤워 못시키면 바로 잘림개연성보다는 일단 인기 퍼먹어야 살아남는 구조임", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1qR2JCDX8Vl-v4_dYxtS1ggLJPMCYwvQh", "date": "09.09 06:23", "comment_id": "reply_li_20823890", "parent_comment_id": "comment_li_20823526"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ 그렇게까지 복잡할 능력도 아님 1화에 사기마법인 불마법사 이기는 장면까지 억지로 우겨넣느라 설정 이상해보인거지 1화에서 아직은 사기마법인 불마법사 못이긴다 하고 대신 무게업 시킨 무거운 검이 공격력은 정말 강하다는거 훈련용 허수아비 개박살 내는 식으로 보여주고 2~3화쯤에 경공익히게 하면 공격력도 강한데 경공쓰면 속도까지 빠르다 해서 직관적으로 존나 센 능력인거 납득시킬 수 있음 불마법사는 한 10화 쯤에 이기면 무난했을텐데 쓰레기냄새 맡고 독자들 하차할까봐 1화에 불마법사 컷하는거까지 넣으려고 개억지 중력 패링 넣은게 문제지", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1qR2JCDX8Vl-v4_dYxtS1ggLJPMCYwvQh", "date": "09.09 06:42", "comment_id": "reply_li_20824153", "parent_comment_id": "comment_li_20823526"}, {"writer": "ㅇㅇ(14.39) (14.39)", "text": "@ㅇㅇ 걍 '마법 최약체인 나혼자 무술로 무쌍'이 낫지 저런 초딩식 크아악 세다가 도파민이 터지나 걍 짜증나지 - (라는 의견을 봣엇음)", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.09 07:32", "comment_id": "reply_li_20824877", "parent_comment_id": "comment_li_20823526"}, {"writer": "엘제에", "text": "@ㅇㅇ(14.39) 터져서 연재되는거임", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1TRKTo1NLyp24OqDxLwjFCw7ly-bXNvf9", "date": "09.09 17:19", "comment_id": "reply_li_20843898", "parent_comment_id": "comment_li_20823526"}, {"writer": "Hour123", "text": "하아~아직도 모르는 건가?", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1qR2JCDX8Vl-v4_dYxtS1ggLJPMCYwvQh", "date": "09.09 05:57", "comment_id": "comment_li_20823585", "parent_comment_id": ""}, {"writer": "오로호", "text": "걍 손만대면 순식간에 얼리는마법을 어떻게 무시할수가있지   - dc App", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1TRKTo1NLyp24OqDxLwjFCw7ly-bXNvf9", "date": "09.09 06:06", "comment_id": "comment_li_20823679", "parent_comment_id": ""}, {"writer": "ㅇㅇ(14.39) (14.39)", "text": "ㄹㅇ - (라는 의견을 봣엇음)", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.09 06:12", "comment_id": "reply_li_20823752", "parent_comment_id": "comment_li_20823679"}, {"writer": "ㅇㅇ", "text pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
