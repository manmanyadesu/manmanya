rcontent.com/d/1Vx19miOcdn0D_Z83EMo4rGk-089hNLmC", "date": "09.13 22:28", "comment_id": "comment_li_21047941", "parent_comment_id": ""}, {"writer": "샴또샴또", "text": "아니키 ㅜㅜ", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Vx19miOcdn0D_Z83EMo4rGk-089hNLmC", "date": "09.13 22:31", "comment_id": "comment_li_21048103", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "그 고어비디오 사이트에서 봤는데 일본인은 캄보디아 이전에 미얀마에서 범죄단지에 많이 납치당했을거임. 거기 영상 보니까 여자 손가락 사이사이에 나무토막 넣고 줄로 쫙 당겨서 부러뜨리거나 전기충격기로 존나 지지거나, 범죄단지 탈출해서 존나 도망치는 새끼 총으로 바로 쏴서 죽이더라. 아니면 벤치로 손톱 뽑거나 밑에 바늘 넣는 것도 있었음", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/14bHlN-hEHz1YGoPU8rQlOU_ITer3fzeS", "date": "09.13 22:36", "comment_id": "comment_li_21048353", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "당시 미얀마가 내전중이라 가능했던거같고 그 이후로는 다 캄보디아로 옮겨서 한국인까지 납치한건데... 태국이랑 전쟁하는 바람에 폭격 처맞고 다 날아갔다는데 지금은 어디서 하고 있는지 모르겠음... 장소가 중요한거지 관리하는 중국인들이 살아있으면 어디서든 하겠지 뭐", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/14bHlN-hEHz1YGoPU8rQlOU_ITer3fzeS", "date": "09.13 22:37", "comment_id": "reply_li_21048440", "parent_comment_id": "comment_li_21048353"}, {"writer": "ㅇㅇ", "text": "태국이 선전하는 캄보디아 범죄단지 해방된 곳 국경지대 오스마치 단 6곳임. 애초에 전쟁도 몇주간 빠르게 치고 빠진거지, 캄보디아 전체를 점령하거나 뭐 그런것도 아니라서", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/14bHlN-hEHz1YGoPU8rQlOU_ITer3fzeS", "date": "09.13 23:02", "comment_id": "reply_li_21049822", "parent_comment_id": "comment_li_21048353"}, {"writer": "만갤러43(61.108) (61.108)", "text": "악마적 피의 매니큐어...!!", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 11:08", "comment_id": "reply_li_21069725", "parent_comment_id": "comment_li_21048353"}, {"writer": "만갤러48(42.82) (42.82)", "text": "고어 사이트에 곰이랑 사람이랑 1대1 뜨게 하는 영상은 없음?", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 16:42", "comment_id": "reply_li_21080197", "parent_comment_id": "comment_li_21048353"}, {"writ mg": "", "date": "09.14 16:02", "comment_id": "comment_li_21078869", "parent_comment_id": ""}, {"writer": "ㅇㅇ(218.236) (218.236)", "text": "후각은 좀 더 안쪽에 있음", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 18:12", "comment_id": "reply_li_21084520", "parent_comment_id": "comment_li_21078869"}, {"writer": "PQRSTAED", "text": "3화동안 반역모의만 두번째여", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/16-p-CeciQ-LIFL54Bzkt0CHIvittfzjk", "date": "09.14 17:22", "comment_id": "comment_li_21081811", "parent_comment_id": ""}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
