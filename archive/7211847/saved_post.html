omment_img": "", "date": "11.23 20:03", "comment_id": "reply_li_24533335", "parent_comment_id": "comment_li_24520793", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러46(123.254) (123.254)", "text": "아 강제 다이어트 만고비 씨바 ㅋㅋㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.23 20:23", "comment_id": "reply_li_24534382", "parent_comment_id": "comment_li_24520793", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "ㄹㅇ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.23 20:42", "comment_id": "reply_li_24535312", "parent_comment_id": "comment_li_24520793", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러47(211.229) (211.229)", "text": "ㅋㅋㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.23 22:28", "comment_id": "reply_li_24540398", "parent_comment_id": "comment_li_24520793", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러27(211.252) (211.252)", "text": "개처럼 햝아 먹었다. 고마우!!", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.23 15:05", "comment_id": "comment_li_24521094", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "뿌부붕", "text": "라그나로크 보스도 스킬 패턴같은거 있었어? 존나게 옛날 사람이라 모름", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.23 15:16", "comment_id": "comment_li_24521429", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "리뉴얼 이후부터는 인던같은 개념 생기면서 있고, 리뉴얼 이전 완전 예전 라그에서도 보스들이 스킬쓰고 대응할줄 알았어야햇음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.23 15:40", "comment_id": "reply_li_24522183", "parent_comment_id": "comment_li_24521429", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "대응이라 하니 좀 이상하네 사실 라그는 컨트롤이 필요한 게임이 아니라서 요즘 mmo 형태를 만든 와우나, 현대적인 mmo게임들과는 다르게 각자가 특정 패턴들을 숙지해서 뭔가 액티브하게 맞춰서 수행해야하는 게임은 아님. 보스가 뭔 스킬쓰는지 알아야하는건 그 스킬쓸때 특별한 대응을 위해서라기보다는 본인 템세팅을 어케해야할지, 딜은 어떻게 넣어야하는지 생각해야하는 세팅문제에 가까웟음. 리뉴얼 이후 개좆망한 라그는 어떤지 모르겠지만 어차피 리뉴얼 이후엔 파사 하는 놈이 없는걸로 알아서 논외같음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.23 15:50", "comment_id": "reply_li_24522460", "parent_comment_id": "comment_li_24521429", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "암튼 그래서 만화에 나오는 저런건 그냥 작가가 다른 mmo 경험에서의 역할 수행에서 생각해둔거에 가까움. 라그는 저런식으로 보탐 안뛰어서... 라그에선 보탐이 패턴파훼 라기보다는 보스에 맞게 세팅을 맞추고, 진형을 갖춘 다음 각자 스킬을 돌리면서, 그 진형이 무너지지 않게 버티는 게임에 가까움.", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.23 15:51", "comment_id": "reply_li_24522496", "parent_comment_id": "comment_li_24521429", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "오로호", "text": "라그 보스도 특정행동에 대응하는 패턴들 있긴해씀. 기본적으로 보스몬스터가 반격못하는거리,위치에서 일방적으로 공격당하면 텔레포트  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.23 17:22", "comment_id": "reply_li_24525481", "parent_comment_id": "comment_li_24521429", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "오로호", "text": "특정보스들은 원거리물리공격 당하면 원물딜 극도로경감시키는 디펜더를 켜거나 원거리스킬로 반격도함  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.23 17:23", "comment_id": "reply_li_24525516", "parent_comment_id": "comment_li_24521429", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(1.212) (1.212)", "text": "비추 단 한개 개병신토니움ㅋㅋㅋㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.23 15:16", "comment_id": "comment_li_24521448", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "차트정후", "text": "ㅋㅋㅋㅋㅋㄱㅂㅍㅋㅋㅋ  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.23 16:33", "comment_id": "reply_li_24523755", "parent_comment_id": "comment_li_24521448  "comment_img_source": "", "comment_media_version": 2}, {"writer": "보슨", "text": "@오로호 라그나로크 잘 몰루? 뭔가 원작과 관계된 스토리 중에 비슷한게 있어서 어떻게 흘러갈지 스토리가 보이는거임?  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.23 16:47", "comment_id": "reply_li_24524277", "parent_comment_id": "comment_li_24516767", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "오로호", "text": "@보슨 초반에 얼굴 스쳐지나가던 정도로 만났던 힘을 추구하던 여검사가 나중에 후반 컨텐츠 던전에서 실험체가 되서 몹으로서 만나게되는게 그냥 아예 캐디만 바꿔서 가져온수준으로 똑같음  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.23 17:08", "comment_id": "reply_li_24524962", "parent_comment_id": "comment_li_24516767", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "오로호", "text": "@보슨 라그의 생체실험연구소가 몹들 디자인이 유저들 캐릭터도트 음영 낮춰서 똑같이 써가지고 유저들과 같은 인간들이라는걸 보여주는데 생던관련 퀘스트들 진행하면서 연구일지같은거보면 라그 세계쪽 유명한 종교집단의 대주교 하나가 신이되려고 이미르의심장조각이라는 강연의 현자의돌급의 아이템을 만드려고 겉으로는 공화국에서 진행하는 합법적 실험인거마냥 하루벌어먹고사는 주변 주민들이나 어중이떠중이들 모험가들을 보상으로 유인해서 연구소 지하에서 실험체로 만드는걸 계속 반복하고있었는데 그 중에 이그니젬 세니아라는 여검사도 끼어있었고 얘는  생던 2층의 보스몬스터로도 나옴  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.23 17:12", "comment_id": "reply_li_24525132", "parent_comment_id": "comment_li_24516767", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "오로호", "text": "@보슨 유저들이 생던을 방문하던시점엔 이미 대주교의 속셈과 지하연구소에서 뭔짓을 하던지 만천하에 공개되고 실험체들의 폭주로 인해서 이미 생던은 폐허에 풀려난 인간실험체들이 무한히 복제되며 돌아다니는 지옥도가 되어있었고 그중에 저 아마란서스의 모티브가 되는캐릭터도 있음. 그리고 3층에는 상위직업들의 실험체들이 돌아다니는데 얘들은 왕국에서 파견한 지금 공화국에서 뭔가 꼬롬칙한 실험 진행중인거 같은데 알아봐라 하고 보낸 왕국 최정예기사,마법사를 포함한 모험가들이었는데 얘들까지 붙잡히고 실험중 사고로 폭주해 전부 자아없는 실험체로 돌아다니는 스토리도 있고 라그 생체던전 스토리는 찾아보면 꽤 흥미로움  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.23 17:17", "comment_id": "reply_li_24525326", "parent_comment_id": "comment_li_24516767", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "오로호", "text": "@보슨 그리고 이미르의심장조각 실험 데이터 챙겨서 런한 주교는 실험으로 만
