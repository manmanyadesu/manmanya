: "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1h6j67gjz8dEVs2A5OnNVJfvGQ2X21hU8", "comment_img": "https://lh3.googleusercontent.com/d/1JL-QaTr1RchwiLJaed-acv_WjvZ2k9cP", "date": "08.08 12:46", "comment_id": "comment_li_19210333", "parent_comment_id": ""}, {"writer": "만갤러20(211.49) (211.49)", "text": "토키코는 Q들어가서 쿄코한테 계속 틱틱대고 무시했는데 속으로는 아버지보다 소중하게 생각하거 있었다는걸 마지막에 고백했네", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.08 12:48", "comment_id": "comment_li_19210380", "parent_comment_id": ""}, {"writer": "ㅇㅇ(183.96) (183.96)", "text": "결말까지 한 3화 남았나?", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.08 12:52", "comment_id": "comment_li_19210517", "parent_comment_id": ""}, {"writer": "ㅇㅇ(183.96) (183.96)", "text": "해결사 3-3편 마지막 보면, 2026 무사히 끝나고 2027년 맞이한다고 되어있는데, 이게 결국 세계 멸망하지 않는다는 암시 아닌가 싶음", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.08 13:00", "comment_id": "comment_li_19210758", "parent_comment_id": ""}, {"writer": "ㅇㅇ(183.96) (183.96)", "text": "유메는 올해 안에 세상 멸망한다고 했는데, 2026년에 시코쿠99사건이 있었다고 하고 그걸 하쿠메이 기신론 교주가 일으킨 거면, 동시에 일어난 저 위의 괴이사건들 전부 무사히 넘기고 해가 지나갔다는 건데", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 13:02", "comment_id": "reply_li_19210829", "parent_comment_id": "comment_li_19210758"}, {"writer": "ㅇㅇ(183.96) (183.96)", "text": "결국 유메랑 하마랑 같이 세계여행 떠나며 끝나는 해피엔딩으로 예상됨. 여기에 유메가 둥지 되찾아 준 존재가 어떤 식으로든 도움을 줄 듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 13:03", "comment_id": "reply_li_19210882", "parent_comment_id": "comment_li_19210758"}, {"writer": "ㅇㅇ", "text": "27년을 무사히 맞이하길 바란다고 했지 27년 왔단 언급은 없음", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1AFqqjzO0UFDREMGLhulaKvBegKR-_rtS", "date": "08.08 13:20", "comment_id": "reply_li_19211462", "parent_comment_id": "comment_li_19210758"}, {"writer": "ㅇㅇ(183.96) (183.96)", "text": "@ㅇㅇ TV에서 올해도 얼마 남지 않았습니다라며 2026에 있었던 일 회상하고 시코쿠99사건 등을 과거에 있었던 일로 여기는 것 보면 괴이사건이 진정되고 2026 끝나기까지 몇분 남지 않은 것 같음", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 13:31", "comment_id": "reply_li_19211876", "parent_comment_id": "comment_li_19210758"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "세계멸망 안하는건 확정돼있음베이비시터편 엔딩 보면 아기였던 얘가 수십년동안 살았다고 나옴그래서 지금 멸망하는 세계를 디자이너가 고쳐주는거 아닌가 생각함", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 13:48", "comment_id": "reply_li_19212597", "parent_comment_id": "comment_li_19210758"}, {"writer": "00(118.219) (118.219)", "text": "집행자는 야요이와 별개. 그냥 숲에서 벌어지는 일을 주관하는 존재.  유메는 이 숲에서 동화되기 직전꺼지 저주를 받아등이다가, 야요이한테감.  야요이 유메의 몸을 받아들이기위해 자기 의식의 100만년치 저주를 유메에게 쏟음. 이로인해 유메는 죽기 직전꺼지 가지만, 진이 유메와 동화되어있는 나무로 집행자를 찔렀기 때문에, 유메의 저주를 집행자에게 전가킴", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.08 13:16", "comment_id": "comment_li_19211344", "parent_comment_id": ""}, {"writer": "00(118.219) (118.219)", "text": "그렇게 집행자가 저주로 뒤지고, 숲이 무효화되면서 유메는 동화가 중지되고 원래대로 돌아옴. (돌아오는 걸 안다 해도 그걸 받아 넘기냐고 경악.) 저주비디오는 집회장에서 있던 일로 야요이를 저주해 죽여야 했는데, 숲의 집행자가 저주비디오의 출입을 가로막고 있었음. 그런데 유메의 작전으로 집행자가 뒤지니, 막아줄 존재가 없는 챠챠 야요이를 죽이러 달려감.", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 13:22", "comment_id": "reply_li_19211526", "parent_comment_id": "comment_li_19211344"}, {"writer": "00(118.219) (118.219)", "text": "@00(118.219) 내 예상이지만, 챠챠 야요이도 사실은 아직 죽지 않았다고 생각함. 집회장의 말단 야요이가 그랬듯이, 유메의 몸을 빼앗는 것과 당장에 살아남기위해 도망 치는 것 중에서 도망을 선택, 다른 야요이의 몸으로 도망치고 챠챠는 그렇게 풀려난거라 생각함.", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 13:23", "comment_id": "reply_li_19211576", "parent_comment_id": "comment_li_19211344"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "집행자는 숲과는 무관하고 야요이의 부활과 의식전가를 매개하는 일종의 괴이임", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 13:35", "comment_id": "reply_li_19212001", "parent_comment_id": "comment_li_19211344"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "유메가 사전에 숲과 동화되어서 100만년어치 저주를 받은 후 진이 동화된 숲의 나뭇가지로 집행자를 죽였기에 매개체가 사라져서 야요이의 의식이 무효화된거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 13:38", "comment_id": "reply_li_19212156", "parent_comment_id": "comment_li_19211344"}, {"writer": "평민", "text": "숲 에피도 나오네 ㅋㅋ 저거 시간지나면 나무처럼 동화되는거였나그리고 마지막에 인어는 저기 낄 레벨인가?", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1AFqqjzO0UFDREMGLhulaKvBegKR-_rtS", "date": "08.08 13:18", "comment_id": "comment_li_19211417", "parent_comment_id": ""}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "애초에 베이비시터 알바 때 세계멸망안한다고 나옴", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.08 13:36", "comment_id": "comment_li_19212061", "parent_comment_id": ""}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "노래방때도 미래묘사있어서", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 13:37", "comment_id": "reply_li_19212080", "parent_comment_id": "comment_li_19212061"}, {"writer": "ㅇㅇ(183.96) (183.96)", "text": "그러네 그 베이비시터 그 아기 늙어죽는것까지 묘사되네", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 13:41", "comment_id": "reply_li_19212271", "parent_comment_id": "comment_li_19212061"}, {"writer": "ㅇㅇ(59.9) (59.9)", "text": "하나도 이해하지 못했지만 마지막 회상과 이별에 감동받는거 너무 좋다...", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.08 13:49", "comment_id": "comment_li_19212613", "parent_comment_id": ""}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "이 만화 맨 앞부문 어디에서 볼 수 있냐? 해외든 유료든 노상관인데", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.08 13:52", "comment_id": "comment_li_19212763", "parent_comment_id": ""}, {"writer": "만갤러21(118.235) (118.235)", "text": "1 권 2권 정발판 팔고있음 비밀알바라고", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 13:59", "comment_id": "reply_li_19213032", "parent_comment_id": "comment_li_19212763"}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@만갤러21(118.235) 1 2권만 사기도 그렇고 찾아보니 무료로 올려놓은 곳 있네裏バイト:逃亡禁止 로 검색하니까 앞부분은 다 공짜다일본어판이지만", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 14:05", "comment_id": "reply_li_19213192", "parent_comment_id": "comment_li_19 writer": "규카츠", "text": "이거는 첨부터 다시 봐야 좀더 재밌겠다 ㄹㅇ", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1JL-QaTr1RchwiLJaed-acv_WjvZ2k9cP", "date": "08.08 08:06", "comment_id": "comment_li_19202075", "parent_comment_id": ""}, {"writer": "ㅇㅇ(211.235) (211.235)", "text": "야요이는 가만히 둬도 뒤졌겠지만 에피제목처럼 사적용건으로 고통스럽게 죽여서 복수한거구나", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.08 08:06", "comment_id": "comment_li_19202081", "parent_comment_id": ""}, {"writer": "ㅇㅇ(220.65) (220.65)", "text": "이번화 잘이해가 안되는데 머라는거임? 대충 유메가 백만년치 정신공격을받았는데 집행자가뒤져서 의식이 무효가됐다.저주받은비디오가 야요이를 죽인다는 내용같은데...유메가 숲의저주를 미리받았는데 왜집행자가 왜뒤지는거임", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.08 08:06", "comment_id": "comment_li_19202086", "parent_comment_id": ""}, {"writer": "ㅇㅇ(211.235) (211.235)", "text": "저 숲은 희생자 생명력 빨아먹으면서 동화시키는 숲임. 저기서 일부러 동화된 다음에 야요이 의식이랑도   일부러 링크 당해줘서 유메한테 가하던 숲의 저주가 100만년어치로 증폭되서 링크된 집행자한테 전이된거", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 08:08", "comment_id": "reply_li_19202116", "parent_comment_id": "comment_li_19202086"}, {"writer": "ㅇㅇ(211.235) (211.235)", "text": "비디오는 집행자가 무서워서 야요이를 건드리지 못하고 있었는데 집행자가 뒤지니까 바로 모든 야요이한테 저주를 먹인거고", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 08:09", "comment_id": "reply_li_19202132", "parent_comment_id": "comment_li_19202086"}, {"writer": "ㅇㅇ", "text": "유메가 숲의 저주를 받아 숲이랑 연결된 상태에서 야요이의 100만년치 무량공처 저주를 받음 그럼 숲도 100만년 저주를 받겠지? 그 상태에서 숲의 저주받은 가지를 집행자한테 박아버림 그래서 집행자 100만년 저주 받고 뒤짐 그래서 비디오저주가 두려워하던 집행자 사라지고 야요이 뒤짐", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1AFqqjzO0UFDREMGLhulaKvBegKR-_rtS", "date": "08.08 08:09", "comment_id": "reply_li_19202133", "parent_comment_id": "comment_li_19202086"}, {"writer": "ㅇㅇ(220.65) (220.65)", "text": "@ㅇㅇ(211.235) ㄱㅅㄱㅅ", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 08:13", "comment_id": "reply_li_19202180", "parent_comment_id": "comment_li_19202086"}, {"writer": "ㅇㅇ(220.65) (220.65)", "text": "@ㅇㅇ ㄱㅅㄱㅅ", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 08:13", "comment_id": "reply_li_19202182", "parent_comment_id": "comment_li_19202086"}, {"writer": "ㅇㅇ(220.65) (220.65)", "text": "@ㅇㅇ 근데 그럼 백만년치 정신공격자체는 당한건데 버틴거임?아님 집행자한테 토스해서 애초에 안당한건가?", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 08:18", "comment_id": "reply_li_19202289", "parent_comment_id": "comment_li_19202086"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(220.65) 당한건데 버틴거임 그래서 야요이가 미친년이라잖아 그리고 뒤에 나온게 굳이 그런짓 안해도 됐다는건데 그냥 사적인 복수를 위한 자기만족 + 죽은 하마쨩 볼 낯이 없어서 일부러 당한거임", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1AFqqjzO0UFDREMGLhulaKvBegKR-_rtS", "date": "08.08 08:22", "comment_id": "reply_li_19202365", "parent_comment_id": "comment_li_19202086"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(220.65) 집행자가 당해서 애초에 없던 일이 된거임. 집행자가 없으면 동화 의식이 성립이 안되고 의식이 성립 안되면 백만년분 저주도 없었던게 되는거.  8번그림 보면 나옴야요이가 미친 년이라고 한건 아무리 없던 일이 된다고 해도 백만년분 무량공처 당할 생각한거 보고 제정신 아니라고 한거고", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 09:42", "comment_id": "reply_li_19204782", "parent_comment_id": "comment_li_19202086"}, {"writer": "만갤러19(218.54) (218.54)", "text": "@ㅇㅇ(118.235) 집행자는 근데 왜 뒤진거 그럼? 나뭇가지 찔러서 숲이랑 동화되서 뒤진건가?", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 11:55", "comment_id": "reply_li_19208787", "parent_comment_id": "comment_li_19202086"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@만갤러19(218.54) 나뭇가지 찌른게 정확히 어떤 효력을 지니진 모르겠는데 아마 표현상 숲과 연결되거나 동화시키는 작용을 하는거 같음즉 유메가 저주받음(의식의 과정) -> 숲으로 전달 -> 집행자한테 전달. 집행자 죽음 -> 의식이 취소됨. 유메한테 걸렸던 저주도 없던 일이 됨", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 12:27", "comment_id": "reply_li_19209747", "parent_comment_id": "comment_li_19202086"}, {"writer": "ㅇㅇ", "text": "@만갤러19(218.54) 유메가 숲이랑 동화됨 > 유메가 백만년치 저주를 받음 > 유메랑 동화된 숲도 백만년치 저주를 머금음 > 그 백만년치 저주를 머금은 숲의 가지를 꺾어 찔러넣음 > 집행자에게도 백만년치 저주가 쏟아져서 뒈짖", "is_reply": true, "dccon": "", "comment : false, "dccon": "", "comment_img": "", "date": "08.09 14:42", "comment_id": "comment_li_19263820", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "이거보고 정주행했는데 개 재밌다 만신", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1cpEGbZoK_An7Gr55Gr-u7uEeeebFY-JZ", "date": "08.09 23:48", "comment_id": "comment_li_19288717", "parent_comment_id": ""}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
