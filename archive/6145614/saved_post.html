있겠냐 말이다", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.10 19:20", "comment_id": "reply_li_20896696", "parent_comment_id": "comment_li_20896220"}, {"writer": "ㅇㅇ(121.145) (121.145)", "text": "같은 판에서 일하는 사람들이라 만화적인 과장좀 해도 다 이해해주겠지", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.10 19:28", "comment_id": "reply_li_20897062", "parent_comment_id": "comment_li_20896220"}, {"writer": "ㅇㅇ(169.211) (169.211)", "text": "저러는거 이해는 감 오다도 이제 열정도 없고 목표도 없는 상황에서 그만둬도 아쉬울게 없음 근데 점프는 매출을 책임져 줄 차기작이 없는 상황에서 사실상 자기들 직장 생명줄이 오다한테 달린 상황임 한 사람의 기분에 따라서 자기 직장 짤리냐가 결정되니까 어쩔 수 없는 구조라고 봄", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.10 19:16", "comment_id": "comment_li_20896511", "parent_comment_id": ""}, {"writer": "리코타", "text": "오다가 책임지고있는 매출 생각하면 저게 손해가 아님", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Bqy65XO_A3KNQ6Jy6jpxvkmuFCxnptK3", "date": "09.10 19:23", "comment_id": "comment_li_20896811", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "오다 편집자였던 은퇴한 전 편지장왈, \"뭔 만화를 30년 넘게 쳐그리고 있노? 드래곤볼 보다 더 긴 화수로 대체 할 말이 뭐가 있노 개노잼임\"  - dc App", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Bqy65XO_A3KNQ6Jy6jpxvkmuFCxnptK3", "date": "09.10 19:26", "comment_id": "comment_li_20896974", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "이 양반은 은퇴했으니 이렇게 말할 수 있지 회사는 오다가 빠르게 진행해서 엔딩 낸다고 해도 바짓가랑이 잡고 늘어지는게 당연함", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Bqy65XO_A3KNQ6Jy6jpxvkmuFCxnptK3", "date": "09.10 21:43", "comment_id": "reply_li_20902435", "parent_comment_id": "comment_li_20896974"}, {"writer": "만갤러33(115.126) (115.126)", "text": "나루토 후반부도 관성으로 좀 봐주지 그랬음 닌자대전편 좆박아서 순위 떡락했자너", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.10 19:29", "comment_id": "comment_li_20897069", "parent_comment_id": ""}, {"writer": "ㅇㅇ(125.180) (125.180)", "text": "병신같지만 곁가지로 나오는 추가돈벌이수단 생각하면 죽이고싶어도 못죽임테이크 20이라고 하는 장면 봐라 전화를 20번이나 씹으면서 좆까고 지할거 한단얘기다 저게 사람새끼냐", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.10 19:35", "comment_id": "comment_li_20897320", "parent_comment_id": ""}, {"writer": "ㅇㅇ(125.180) (125.180)", "text": "자동으로 끊기는게 1분남짓이라하면 최소 30분은 쳐먹었단얘기다", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.10 19:35", "comment_id": "reply_li_20897351", "parent_comment_id": "comment_li_20897320"}, {"writer": "ㅇㅇ(58.142) (58.142)", "text": "20번을 연속으로 전화하진 않지 보통ㅋㅋ 저정도면 4~5시간 쓴거임 적당히 눈치보며 10~15분마다 전화할테니까", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.10 19:40", "comment_id": "reply_li_20897549", "parent_comment_id": "comment_li_20897320"}, {"writer": "ㅇㅇ(118.40) (118.40)", "text": "편집자 도움도 안받고 카구야도 1화때부터 복선깔아놓고 후속작까지 완벽한 나루토 승리임", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.10 19:35", "comment_id": "comment_li_20897357", "parent_comment_id": ""}, {"writer": "ㅇㅇ(121.181) (121.181)", "text": "보루토만 안나왔으면", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.10 23:57", "comment_id": "reply_li_20908265", "parent_comment_id": "comment_li_20897357"}, {"writer": "ㅇㅇ(61.82) (61.82)", "text": "카구야가 1화 때 부터 복선이 있었다고???", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.11 01:23", "comment_id": "reply_li_20911912", "parent_comment_id": "comment_li_20897357"}, {"writer": "Embrio", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1iM7MgksgPBQVxnRQndjlBv8YX6H0fBWD", "comment_img": "https://lh3.googleusercontent.com/d/19sHKewx1EGmctPXOBL38ledb1q5sIi8k", "date": "09.10 19:38", "comment_id": "comment_li_20897480", "parent_comment_id": ""}, {"writer": "ㅇㅇ(58.142) (58.142)", "text": "좆노쿠니때도 저지랄 했을건데, 재밌어졌다고 눈물 흘릴 정도면 수정 전엔 얼마나 개시발좆박은 쓰레기를 그린거냐", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.10 19:41", "comment_id": "comment_li_20897592", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "지금도 조산명이랑 청산말고는 전부 일렬종대 세워서 싸대기 때려도 아무도 말못할 위친데 일개 편집자 따위가 뭐라고 함? 심지어 조산명/청산이랑도 동등하면 동등했지 아래는 아님", "is_rep con": "", "comment_img": "", "date": "09.10 20:41", "comment_id": "reply_li_20900011", "parent_comment_id": "comment_li_20898474"}, {"writer": "만갤러52(121.177) (121.177)", "text": "토리야마때랑은 편집부 파워가 다르지. 애초에 토리야마 첫번째 편집자가 그대로 편집장됐으니 관계성도 유지되고 있었을꺼고.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.10 23:41", "comment_id": "reply_li_20907509", "parent_comment_id": "comment_li_20898474"}, {"writer": "ㅇㅇ(221.150) (221.150)", "text": "90년대랑 2020년대랑 같냐", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.11 02:11", "comment_id": "reply_li_20913396", "parent_comment_id": "comment_li_20898474"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "토리야마는 토리시마라는 편집자랑 닥터슬럼프시절부터 함께컸음 그래서 겐세이를 마구마구 놓는게 가능했어 토리시마가 바로 피콜로 모티브임", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.11 09:52", "comment_id": "reply_li_20921493", "parent_comment_id": "comment_li_20898474"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "토리야마를 신인일때 발굴한게 토리시마고 닥터슬럼프를 편집자로서 대성공 시킨것도 토리시마, 드래곤볼 배틀물로 전환시켜서 대성공 시킨것도 토리시마라서 토리시마는 토리야마한테 이래라저래라 할수가있었음 현재의 오다편집자랑은 입장 자체가 차원이 달랐으니 그게 가능했던거", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.11 09:56", "comment_id": "reply_li_20921601", "parent_comment_id": "comment_li_20898474"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "토리시마가 승진하고나서는 드래곤볼 담당에서 떨어지긴 했지만 그래도 토리시마의 입김이 계속 작용했을거임 드래곤볼은 점프 간판작인데 관리자 직위로 올라간 토리시마가 드래곤볼을 신경 안썼을리가 없음 그래서 드래곤볼은 연재내내 편집자 입김이 세게 들어간거고. 두작품이나 초대박을 쳤음에도 토리야마가 편집자 입김에서 벗어나 맘대로 연재를 할수 없었던 이유가 바로 그때문이야", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.11 10:04", "comment_id": "reply_li_20921796", "parent_comment_id": "comment_li_20898474"}, {"writer": "ㅇㅇ(61.98) (61.98)", "text": "5억부가 팔린만화야100만부만 팔려도 작가인생 피는데 5억부라고", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.10 20:07", "comment_id": "comment_li_20898565", "parent_comment_id": ""}, {"writer": "ㅇㅇ(211.185) (211.185)", "text": "100만 판매량이 5억인데5억 판매량이면 2500억인가?", "is_reply": true, "dccon": "", "comment_img": "", "date": "09. ㅇ(106.101) (106.101)", "text": "요즘 오다 위상 어떤지 알려주는 만화 꽤 많이 나오는거같은데 자기 만화가 GOAT라고 생각하는애들한텐 꽤 많이 긁힐 만화들 많이나오네 오다가 뭐 만화계 탑이니 신이니 이런거 설명안해도 다 그러려니 알고있는데 이걸 굳이굳이 만화가들이 그리면서 체크해주니 나퀴 헌퀴 귀민이 진스퍼거 금속노조 등등 이런 극성팬들은 좀 좆같아하겠노 원피스 위상에 흠집낼 만화래봐야 드볼말고 없고 높게쳐야 나루토 정도니", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.10 18:51", "comment_id": "comment_li_20895432", "parent_comment_id": ""}, {"writer": "ㅇㅇ(220.127) (220.127)", "text": "니가 오다가 아닌데 오다 인기에 자아의탁해서 뭐 하게? 병신새끼신가", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.10 19:26", "comment_id": "reply_li_20896958", "parent_comment_id": "comment_li_20895432"}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@ㅇㅇ(220.127) 오다는 아니고 커뮤 10년차 앰생인데 커뮤에서 갈드컵여는 애들 심리는 내가 정확히 꿰뚫고있음 곳간에서 인심난다는 말이 있듯이 특정 컨텐츠 극성팬들은 자기가 좋아하는 것보다 좆밥한텐 관심도 안주거나 오히려 리스펙 우쭈쭈 해주는데 자기가 좋아하는것보다 윗급이면 존나까고 어떻게든 내려치려고 혈안임 원피스가 지금 좆망만화였으면 원피스대신 나루토 까는놈들이 훨 많았을거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.10 19:29", "comment_id": "reply_li_20897102", "parent_comment_id": "comment_li_20895432"}, {"writer": "ㅇㅇ", "text": "원피스가 욕처먹는건 지금처럼 개좆같이 그려도 적폐 1황이라 돈 쓸어담아서 그런거다 게이야", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Bqy65XO_A3KNQ6Jy6jpxvkmuFCxnptK3", "date": "09.10 21:19", "comment_id": "reply_li_20901486", "parent_comment_id": "comment_li_20895432"}, {"writer": "ㅇㅇ", "text": "지금 원피스 퇴물 다돼서 스토리 재미 좆박았다는거 누구나 다 아는데 뭐하러 그딴거랑 내용으로 갈드컵을 하노? 비교대상이 된다는거조차 모욕임 ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Bqy65XO_A3KNQ6Jy6jpxvkmuFCxnptK3", "date": "09.10 21:21", "comment_id": "reply_li_20901549", "parent_comment_id": "comment_li_20895432"}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@ㅇㅇ 이런식으로", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.10 21:58", "comment_id": "reply_li_20903067", "parent_comment_id": "comment_li_20895432"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(106.101) 논리로 줫털려놓고 할말없으니 정신승리 시전 ㅋㅋ ㅂㅅ새끼 애잔하노", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Bqy65XO_A3KNQ6Jy6jpxvkmuFCxnptK3", "date": "09.11 01:15", "comment_id": "reply_li_20911650", "parent_comment_id": "comment_li_20895432"}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@ㅇㅇ 논리랄것도 없이 순수비난으로 지생각만 말했는데 뭐라고 말해주노 원피스가 좆망했으면 니말대로 진작 퇴물취급받고 출하됐겠지 현실은 연재이래로 원피스 따잇한 만화는커녕 비빌수있는 만화라도 있었음? 있으면 말좀", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.11 01:19", "comment_id": "reply_li_20911775", "parent_comment_id": "comment_li_20895432"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(106.101) 현실의 그 어떤 만화 가져와도 원피스 지금 현재 재미랑 비교하면 비교자체가 실례인 수준인데 ㅋㅋ 딴소리 쳐하고있노", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Bqy65XO_A3KNQ6Jy6jpxvkmuFCxnptK3", "date": "09.11 01:20", "comment_id": "reply_li_20911828", "parent_comment_id": "comment_li_20895432"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(106.101) 이새끼 말대로면 맥도날드 버거킹 햄버거가 전세계에서 제일 맛있는 음식이라는거랑 다를바가 없음 ㅋㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Bqy65XO_A3KNQ6Jy6jpxvkmuFCxnptK3", "date": "09.11 01:21", "comment_id": "reply_li_20911847", "parent_comment_id": "comment_li_20895432"}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@ㅇㅇ 대답 어물쩡하게 회피해서 정작 자기가 빠는만화 뭔지 말 못하는거만봐도 자기가 빠는만화가 원피스한테 안된다는걸 이미 인정하고있잖아... 만화업계가 절대평가도 아니고 상대평가인데도 불구하고 만화 GOAT논쟁할때 드볼 상대로 원피스 불려가는거만 봐도 이미 원피스 위상 넘는 만화는 사실상 없음 좆노잼이니 뭐니 해도 결국 재밌으니까 사람들이 보는거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.11 01:23", "comment_id": "reply_li_20911915", "parent_comment_id": "comment_li_20895432"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(106.101) 아하 그래서 지금 원피스 연재분이 재밌으시다?? ㅋㅋㅋㅋㅋㅋㅋ 진짜 진지하게 그리 생각하는거면 걍 대화할 가치를 못느끼겠다 평생에 만화책 본게 원피스밖에 없나 ㅋㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Bqy65XO_A3KNQ6Jy6jpxvkmuFCxnptK3", "date": "09.11 01:24", "comment_id": "reply_li_20911973", "parent_comment_id": "comment_li_20895432"}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@ㅇㅇ 니가 좆노잼이든 내가 좆노잼이든 원피스가 아직까지도 만화업계 1위하는건 내가 사주한게 아니에요 상식적으로 2부가 통째로 암흑기였으면 진작 출하였겠지 세상 어느 만화가 연재 절반이상이 암흑기인데 업계탑으로 평가를받음 니가 생각한것만큼 원피스 2부가 그렇게 씹창이 아니니까 아직도 인기 유지하는거겠지", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.11 01:26", "comment_id": "reply_li_20912033", "parent_comment_id": "comment_li_20895432"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(106.101) 세상에 폼 좆박고도 전성기 인기 관성이랑 캐릭터 사업 때문에 잘팔리는 만화가 한둘이 아닌데 진짜 지금 판매량 높다고 업계 만화중 만력 1위라 생각하는거면 정신병원에 가봐라", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Bqy65XO_A3KNQ6Jy6jpxvkmuFCxnptK3", "date": "09.11 01:28", "comment_id": "reply_li_20912123", "parent_comment_id": "comment_li_20895432"}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@ㅇㅇ 아니 그래서 일본 만화업계 만력 1위가 누구냐고요 도대체... 지금 오다 뛰어넘는수준의 만력 가진 천재작가가 대체 무슨만화 그리고있길래 같이좀 알자니까... 개듣보 좆툰 그리는 개듣보 좆툰작가선에서 만력 정리되는새끼들끼리 만력운운하는것도 뒤지게 웃기긴한데 ㅇㅇ...", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.11 01:30", "comment_id": "reply_li_20912173", "parent_comment_id": "comment_li_20895432"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(106.101) 만력 1위가 누구인지는 사람마다 다른거고 지금 연재하는 애들 중에 평가 좋은애들 아무나 데려와도 지금의 좆박은 좆피스보단 재밌음 ㅇㅇ 이게 아니라고 생각하면 니가 좆피스에 자아의탁하는 좆퀴벌레라 그런거고", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Bqy65XO_A3KNQ6Jy6jpxvkmuFCxnptK3", "date": "09.11 01:32", "comment_id": "reply_li_20912245", "parent_comment_id": "comment_li_20895432"}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@ㅇㅇ 결국 누구 하나 제대로 꼽지도 못하고 런쳤네 내가 첫번째 댓글 쓴 그대로 행동해주니 나도 할말이없군", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.11 01:43", "comment_id": "reply_li_20912589", "parent_comment_id": "comment_li_20895432"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(106.101) ? 만화대상 리스트 들어가서 아무나 보든가 꼭 한명을 찝어줘야함? 대가리가 갈드컵에 절여짐?", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Bqy65XO_A3KNQ6Jy6jpxvkmuFCxnptK3", "date": "09.11 01:44", "comment_id": "reply_li_20912634", "parent_comment_id": "comment_li_20895432"}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@ㅇㅇ 재미랑 만력이 어떤지는 사람마다 다른거고 좆툰 중위권따리 전전하는 개듣보 좆툰작가 선에서 만붕이 99% 정리되니까 만력이니 뭐니 굳이 운운할필요 없다생각함 그렇게 만력넘치는사람이었으면 성적으로 증명했을테니", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.11 01:46", "comment_id": "reply_li_20912663", "parent_comment_id": "comment_li_20895432"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(106.101) ㅇㅇ 만화대상 1~10위까지는 성적으로 증명한게 아닌가? 아니면 좆피스보다 판매량 낮으니 아무튼 좆피스보다 못함 ㅅㄱ 이논리임?", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Bqy65XO_A3KNQ6Jy6jpxvkmuFCxnptK3", "date": "09.11 01:47", "comment_id": "reply_li_20912692", "parent_comment_id": "comment_li_20895432"}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@ㅇㅇ 만화대상 1~10위중에서 너가 있기라도함? 자아의탁을 걔네한테 왜함 나는 니나 나나 개듣보 좆툰작가선에서 만력 압도당하니까 만력운운해봤자 의미없다고한건데", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.11 01:48", "comment_id": "reply_li_20912745", "parent_comment_id": "comment_li_20895432"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(106.101) 아하 좆피스 작가보다 만력 떨어지는놈은 좆피스 욕하지마라 이거임? ㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋ 진짜 개신박한 논리네", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Bqy65XO_A3KNQ6Jy6jpxvkmuFCxnptK3", "date": "09.11 01:49", "comment_id": "reply_li_20912779", "parent_comment_id": "comment_li_20895432"}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@ㅇㅇ 대체 어떤 아픔이 있길래 이렇게 공격적일수 있을진 모르겠는데 진정하고 글을 잘보셈 니나 나나 만력 수준 개듣보 좆툰작가 선에서 정리되는 수준이라고 한거임 그래서 만갤에서 만력운운하면서 선민의식 펼치며 이건 쓰레기 이건 만신 해봤자 의미없다는거고", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.11 01:50", "comment_id": "reply_li_20912836", "parent_comment_id": "comment_li_20895432"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(106.101) 폼 좆박은 적폐만화 1위가 돈 쓸어담고 있는 현상에 대해서 욕하는게 뭐가 문제? 좆툰작가보다 만력 낮으면 이의제기 하지 말라는 발상이 진짜 얼탱이가 없노 ㅋㅋㅋㅋ 입틀막이 기본인가", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Bqy65XO_A3KNQ6Jy6jpxvkmuFCxnptK3", "date": "09.11 01:52", "comment_id": "reply_li_20912898", "parent_comment_id": "comment_li_20895432"}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@ㅇㅇ 아니 왜 원피스 탓을 하는거임 오다 이새끼가 자기보다 재밌는만화 그리지 content.com/d/1Bqy65XO_A3KNQ6Jy6jpxvkmuFCxnptK3", "date": "09.10 18:19", "comment_id": "reply_li_20894114", "parent_comment_id": "comment_li_20890814"}, {"writer": "만갤러13(14.5) (14.5)", "text": "@ㅇㅇ 코난 잡지사는 옛날부터 코난 발사대 원툴인데 오다 신인시절 전성기 소년 점프랑 비교를 하네ㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.10 18:21", "comment_id": "reply_li_20894204", "parent_comment_id": "comment_li_20890814"}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
