}, {"writer": "ㅇㅇ(121.139) (121.139)", "text": "수녀 이전에 전생자 최강인 황제도 공 포지션이지만 한 마리 애정에 목마른 암컷 포스 존나 풍기며 죽긴 함..", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.31 01:11", "comment_id": "reply_li_20369003", "parent_comment_id": "comment_li_20368446"}, {"writer": "ㅇㅇ", "text": "수녀 강하긴 해도 최강은 아니지 않나. 온전히 계승한 능력은 슬라임 능력 뿐이고 몬스터 조종 능력은 원본에 비해 대폭 열화됐고 야구광 능력은 동물귀나 다는 수준이고", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Hh2LCg-mkTF1nLjJghJ787zx5ZC6Y3PW", "date": "08.31 01:16", "comment_id": "reply_li_20369214", "parent_comment_id": "comment_li_20368446"}, {"writer": "ㅇㅇ", "text": "수녀보다 강한 도니가 게이섹스하다가 살해당한거 봤으니까 쫄릴수밖에", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Hh2LCg-mkTF1nLjJghJ787zx5ZC6Y3PW", "date": "08.31 01:21", "comment_id": "reply_li_20369422", "parent_comment_id": "comment_li_20368446"}, {"writer": "ㅇㅇ(59.0) (59.0)", "text": "@ㅇㅇ 게이섹스 하다 살해당한건 모르고 걍 죽은거만 알고있는거지그래서 더 무서운거고", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.31 01:27", "comment_id": "reply_li_20369719", "parent_comment_id": "comment_li_20368446"}, {"writer": "ㅇㅇ(59.4) (59.4)", "text": "그리고 애초에 전투원이 아니잖음 살아가면서 몸을 지킬 필요가 있으니까 기회가 되면 능력을 흡수하는 정도였지 머 능력을 활용해서 싸우고 깊다 그런 투쟁심이 없는 사람인데왜 안 무섭겠슴 거기다 인질로 잡힐 아이들까지 있고", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.31 01:46", "comment_id": "reply_li_20370513", "parent_comment_id": "comment_li_20368446"}, {"writer": "만갤러15(118.235) (118.235)", "text": "수녀가 스스로 능력 다써도 도니는 못이길거라 각재고있었나보지실제로 싸웠을때 도니 능력 약점 알았다면 어떻게 된데도 그건 독자가 아는 정보고 수녀는 몰랐으니깐거기에 도니처럼 꿈 꾼거 같이 자기도 능력외 주변인 약점으로 찔릴수있게 된거 깨달았으니까 그럴듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.31 01:58", "comment_id": "reply_li_20371115", "parent_comment_id": "comment_li_20368446"}, {"writer": "ㅇㅇ(183.102) (183.102)", "text": "딱히 최강도 아닌게 지금까지 먹어서 쌓은 스텟이란 것도 배신자 메이드년이랑 비벼지는 수준에 가지고 있는 능력들도 약점이 명확하거나 불완전하게 흡수한 것들 뿐이라 엘프 혼자 처들어가도 이기는 수준임이번 세대 전생자들끼리만 비교해도 건메이커나 크리스 아래수준일듯", "is_reply": tr iter": "ㅇㅇㅇ(211.235) (211.235)", "text": "왜 둘다 알몸인거 이미 하고 고백한거?", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.31 01:02", "comment_id": "comment_li_20368527", "parent_comment_id": ""}, {"writer": "2.1배TQQQ", "text": "ㄴㄴ 보통은 그렇게 보이는 게 당연은 한데  정황상 각자 방에서 걍 나체로 잠자던 중이었나 봄", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1s2y27dS6o3zkExSk70W3w9UacAelfjZ5", "date": "08.31 01:15", "comment_id": "reply_li_20369194", "parent_comment_id": "comment_li_20368527"}, {"writer": "만갤러10(61.79) (61.79)", "text": "@2.1배TQQQ 와이림 아래 일부러 안보여준거 같은데? 근데 할 애가 있나? 약에 찌든 애 걘가?", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.31 01:38", "comment_id": "reply_li_20370199", "parent_comment_id": "comment_li_20368527"}, {"writer": "2.1배TQQQ", "text": "@만갤러10(61.79) 걘 친누나 아님?", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1s2y27dS6o3zkExSk70W3w9UacAelfjZ5", "date": "08.31 01:39", "comment_id": "reply_li_20370258", "parent_comment_id": "comment_li_20368527"}, {"writer": "ㅇㅇ", "text": "@2.1배TQQQ 약순이 남동생은 죽었음  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Hh2LCg-mkTF1nLjJghJ787zx5ZC6Y3PW", "date": "08.31 08:59", "comment_id": "reply_li_20380350", "parent_comment_id": "comment_li_20368527"}, {"writer": "2.1배TQQQ", "text": "@ㅇㅇ 아 맞네", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1s2y27dS6o3zkExSk70W3w9UacAelfjZ5", "date": "08.31 11:49", "comment_id": "reply_li_20385219", "parent_comment_id": "comment_li_20368527"}, {"writer": "ㅇㅇ(39.126) (39.126)", "text": "하루카 비키니 ㅇㄷ??", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.31 01:02", "comment_id": "comment_li_20368540", "parent_comment_id": ""}, {"writer": "만갤러22(118.131) (118.131)", "text": "하루의 풀네임은 오노데라 코하루다 애송아", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.31 08:41", "comment_id": "reply_li_20379946", "parent_comment_id": "comment_li_20368540"}, {"writer": "ㅇㅇ", "text": "식인 빼고 현실감각은 있는 모양이네...그래도 얘도 처먹을수록 능력 흡수하느라 지금 무적이 되어가고 있는데 겁낼건 또 뭐야", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1ZjeSl5QUdxIzeysLX6ztI6Fndi-D3Rc_", "date": "08.31 01:02", "comment_id": "comment_li_20368548", "parent_comment_id": ""}, {"writer": "Posyel", "text": "그런 자기보다 아득하게 강한 황제를 담궈버렸으니까...", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1-N-7CvGUxpTVOt_ZtZ3F66c3pn242fvy", "date": "08.31 01:03", "comment_id": "reply_li_20368622", "parent_comment_id": "comment_li_20368548"}, {"writer": "뉴구븽", "text": "식인도 현실감각있는데 걍 하고싶어서 하는거. 수녀도 결국 머리가 비상할뿐이고 단체라 해봤자 도적단이라 정보력도 없어서.. 도니랑 1대1 물리대결하면 비벼보지도 못하고 초컷나는데 도니를 무슨수로 죽인건지 감도 안오니까 무섭지", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1-N-7CvGUxpTVOt_ZtZ3F66c3pn242fvy", "date": "08.31 01:10", "comment_id": "reply_li_20368928", "parent_comment_id": "comment_li_20368548"}, {"writer": "만갤러23(211.212) (211.212)", "text": "근데 쳐먹을수록 강해지는건데, 자기편 아닌 이능력자들 전부, 별로없음. 비지란테하고 마족집단으로 갈리는데, 그 엘프년 시선피해서 주인공측 시체를 먹을수도없고, 그렇다고 마족측으로 대가리밀고 들어가서 그 마빡년 시체먹는건 더 난이도높음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.31 08:58", "comment_id": "reply_li_20380316", "parent_comment_id": "comment_li_20368548"}, {"writer": "만갤러23(211.212) (211.212)", "text": "지금 먹을수있는건 건메이커말고없는데, 건메이커는 같은편이라. 시체를 온전히 먹어도 건메이커 힘만큼이니 먹을필요도 없고", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.31 08:59", "comment_id": "reply_li_20380337", "parent_comment_id": "comment_li_20368548"}, {"writer": "ㅇㅇ(49.165) (49.165)", "text": "그새 낚시를 씨발 몇번이나 쳐했는지", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.31 01:02", "comment_id": "comment_li_20368580", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "수녀 근데 사랑하면 먹고싶어지는거 아니었나?", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1ZjeSl5QUdxIzeysLX6ztI6Fndi-D3Rc_", "date": "08.31 01:04", "comment_id": "comment_li_20368671", "parent_comment_id": ""}, {"writer": "ㅇㅇ(121.139) (121.139)", "text": "그냥 '맛있다'라는 감상이 진심으로 드는 게 인육일 뿐이라고 나왔지, 사랑을 느끼면 더욱 먹고 싶어진다 그런 언급까진 없었을 걸?", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.31 01:10", "comment_id": "reply_li_20368931", "parent_comment_id": "comment_li_20368671"}, {"writer": "ㅇㅇ", "text": "토가랑 헷갈린 거 아니냐", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Hh2LCg-mkTF1nLjJghJ787zx5ZC6Y3PW", "date": "08.31 01:18", "comment_id": "reply_li_20369309", "parent_comment_id": "comment_li_20368671"}, {"writer": "ㅇㅇ(59.22) (59.22)", "text": "그정도는 아님가족들을 보고 식욕이 생겼어도 참을 정도는 됨", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.31 06:12", "comment_id": "reply_li_20377400", "parent_comment_id": "comment_li_20368671"}, {"writer": "만갤러2(39.125) (39.125)", "text": "잼써", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.31 01:04", "comment_id": "comment_li_20368679", "parent_comment_id": ""}, {"writer": "만갤러2(39.125) (39.125)", "text": "배틀로얄물인데 개개인 사정도 안지루하게 각자 잘 풀어내는듯 페이트도 다중루트 써서 겨우 다 설명하는데", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.31 01:05", "comment_id": "reply_li_20368720", "parent_comment_id": "comment_li_20368679"}, {"writer": "만갤러3(121.152) (121.152)", "text": "갓만화", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.31 01:05", "comment_id": "comment_li_20368704", "parent_comment_id": ""}, {"writer": "만갤러4(112.153) (112.153)", "text": "인정 ㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.31 01:14", "comment_id": "reply_li_20369144", "parent_comment_id": "comment_li_20368704"}, {"writer": "삐죽빼죽", "text": "시스터는 약점이 나온이상 ....", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1-N-7CvGUxpTVOt_ZtZ3F66c3pn242fvy", "date": "08.31 01:05", "comment_id": "comment_li_20368718", "parent_comment_id": ""}, {"writer": "ㅇㅇ(223.38) (223.38)", "text": "수녀년 살려둘수록 끝도 없이 쎄지니까 슬슬 죽일 빌드업 할 때 됐지", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.31 01:06", "comment_id": "comment_li_20368732", "parent_comment_id": ""}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "문젠  제능력을 주인공측에선 눈치도 못챘음", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.31 07:27", "comment_id": "reply_li_20378486", "parent_comment_id": "comment_li_20368732"}, {"writer": "ㅇㅇ", "text": "전생자 안 나온애 어차피 경찰 2명인가 밖에 없어서 이제 더 강해지기도 어려움  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Hh2LCg-mkTF1nLjJghJ787zx5ZC6Y3PW", "date": "08.31 07:41", "comment_id": "reply_li_20378752", "parent_comment_id": "comment_li_20368732"}, {"writer": "로또3등당첨(차단)", "text": "미쳣군", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1-N-7CvGUxpTVOt_ZtZ3F66c3pn242fvy", "date": "08.31 01:06", "comment_id": "comment_li_20368763", "parent_comment_id": ""}, {"writer": "ㅇㅇ(121.139) (121.139)", "text": "악몽 장면 없었으면 수녀가 쟤네가 소중하지 않은 건 아닌데 와이림이 브레이크로 좀 나서게 하려고 양념 좀 친 거 아닌가라고 생각할 법도 한데, 악몽 속에서 수녀에게 있어 가장 정이 갈 대상인 조안나랑 둘이서 언급돼 패닉 일으켰다는 점에서 진심인 걸 납득하게 해버림ㄷㄷㄷ", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.31 01:07", "comment_id": "comment_li_20368768", "parent_comment_id": ""}, {"writer": "ㅇㅇ(112.157) (112.157)", "text": "걍 이만화의 의의는 그림작가 사상구현에 있음.수컷도 몸을 암컷으로만들면 정신이 암컷이 된다는거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.31 01:11", "comment_id": "reply_li_20368979", "parent_comment_id": "comment_li_20368768"}, {"writer": "2.1배TQQQ", "text": "아니 근데  남자는 딴 방에 있었는데 왜 알몸이냐", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1s2y27dS6o3zkExSk70W3w9UacAelfjZ5", "date": "08.31 01:16", "comment_id": "reply_li_20369220", "parent_comment_id": "comment_li_20368768"}, {"writer": "ㅇㅇ", "text": "@2.1배TQQQ 알몸으로 자는게 편하가보지", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Hh2LCg-mkTF1nLjJghJ787zx5ZC6Y3PW", "date": "08.31 01:34", "comment_id": "re = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
