1) (118.221)", "text": "@ㅇㅇ(118.34) 멀티엔딩이고 분기점이 초반에 나온 거미임.분기의 모든 공통점은 거미를 먹냐 안먹냐로 분기가 나뉨.즉 거미를 안먹고 버린 시점에서 이미 만화는 베드엔딩으로 갔음", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.25 19:15", "comment_id": "reply_li_21662956", "parent_comment_id": "comment_li_21655587"}, {"writer": "만갤러6(118.221) (118.221)", "text": "@ㅇㅇ(118.34) 자신과 같은 강화병사 , 총 3종을 먹어야만히 최종진화를 하며 인격을 유지 할 수 있음.근데 그 3종중 하나가 초반에 나온 거미임.분기점에서 이 거미를 먹냐 안먹냐로 엔딩이 나뉨.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.25 19:16", "comment_id": "reply_li_21662985", "parent_comment_id": "comment_li_21655587"}, {"writer": "만갤러6(118.221) (118.221)", "text": "@ㅇㅇ(118.34) 주인공이 나중에 3종의 강화병을 먹어야 인격이 유지된다는걸 알게되고, 뒤늦게 먹지않고 버린 거미를 찾는데거미는 이미 왕국군이 발견하여 연구하기위해 가져 간 상태였고, 주인공은 그걸 찾기위해 왕국에 쳐들어감문제는 연구상태의 거미시체를 찾는거는 성공했으나, 이미 온갖 약품으로 절여져있는데 썩기까지해서 먹을 수 가 없어서 포기해버림", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.25 19:19", "comment_id": "reply_li_21663169", "parent_comment_id": "comment_li_21655587"}, {"writer": "만갤러6(118.221) (118.221)", "text": "@ㅇㅇ(118.34) 결과적으로 자신은 인격을 잃고 인류가 감당하지못하는 몬스터가 되는게 확정이기에, 저 여자마법사에게 진실을 알리고자신보다 강한 강화병사에게 본인이 잡아먹히고 자신이 먹히면 그 강화병사는 절대 거부할 수 없는 잠에 빠지기때문에 그때 죽이라고 함.결과적으로 주인공은 인격이 남아있는 인간의 상태에서 잡아먹힘으로서 사람답게 죽었고, 세상을 멸망시킬 강화병사도 그렇게 해결됨", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.25 19:21", "comment_id": "reply_li_21663247", "parent_comment_id": "comment_li_21655587"}, {"writer": "만갤러6(118.221) (118.221)", "text": "@ㅇㅇ(118.34) 주인공이 사람이였다는걸 아는건 여자 마법사뿐이고, 그걸 알리지않고 혼자서 기억함으로서 주인공을 기림.주인공이 도와줬던 엘프는 주인공이 사람이라는걸 끝까지 모름.그냥 지능이 높고 자신들 도와 준 착한 몬스터로 인식 된 채로 끝남.그 이유는 주인공이 엘프에겐 끝까지 자신의 정체를 밝히지않았기 때문.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.25 19:22", "comment_id": "reply_li_21663326", "parent_comment_id": "comment_li_21655587"}, {"writer": "만갤러6(118.221) (118.221)", "text": "@ㅇㅇ(118.34) 반대로 강화거미를 먹은 엔딩도 딱히 헤피엔딩은 아님.수명이 무한해서 자신을 알던 사람이나 엘프는 다 죽고 그걸 계속 반복하며 점점 미쳐감.결국엔 스스로 목숨을 끊었다라는 복선만 남긴채로 끝남.", "is_reply": true, "dccon": "", "comment t_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
