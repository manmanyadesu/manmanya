"dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "LENINAS전지", "text": "'그저 친구, 연인과 함께 즐겁게, 행복하게 살고 싶다.' 라는 것을 행복으로 생각하는 현대 일본인의 비극을 그려낸 것 같다. 물론 그런 걸 바라는 게 나쁜 건 아니다. 그런데 그런 건 한순간에 무너지기 쉽다는 걸 보여줬다.", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.23 00:17", "comment_id": "comment_li_23047775", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러36(1.245) (1.245)", "text": "사수랑 제국금융 진짜 무섭다. 앞서 몇 사람 공사친 정황을 봤을 때, 하이바라 멘탈 케어가 아니라 걍 짬 때릴 시다바리 붙잡아두려고 야부리 턴 건데, 하이바라 뿐만 아니라 만화를 보는 나까지 저절로 사수가 좋은 사람이고 제국금융은 보기보다 인간적인 회사구나라는 생각이 듬.... 이게 가스라이팅인가...", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.23 00:43", "comment_id": "comment_li_23048632", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(116.43) (116.43)", "text": "좀 스포인데 사수는 찐으로 인간적인 사람 맞음 하이바라 모종의 일로 제국금융 튕겨져나오고 감빵살이까지 하는 일 생기는데 사수햄이 끝까지 하이바라 챙겨줌", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 00:55", "comment_id": "reply_li_23049027", "parent_comment_id": "comment_li_23048632", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(116.43) (116.43)", "text": "제국금융 회사 자체는 사채업답게 냉혈한 맞는데ㅇㅇ", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 00:55", "comment_id": "reply_li_23049047", "parent_comment_id": "comment_li_23048632", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(116.43) 왜 자꾸 스포를 하지;", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 07:39", "comment_id": "reply_li_23057399", "parent_comment_id": "comment_li_23048632", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.246) (211.246)", "text": "@ㅇㅇ ㄹㅇㅋㅋ 저 아이피 다른 편에도 댓글로 계속 아는 척 하고 다니던데", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.23 09:52", "comment_id": "reply_li_230
