ersion": 2}, {"writer": "ㅇㅇ", "text": "10짤 할배 볼 일 볼 때 옆에서 쳐다 보는 거 고증 보소 ㅅㅂ ㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.29 15:42", "comment_id": "comment_li_23337811", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "평민", "text": "저시절 일본의 지주작업은 야쿠자끼고 온갖 압박 넣으면서 진행했으려나", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.29 15:44", "comment_id": "comment_li_23337912", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "윗타", "text": "프리자의 모티브가 저 투기꾼이란 걸 생각하면", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.29 17:43", "comment_id": "reply_li_23342367", "parent_comment_id": "comment_li_23337912", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(220.74) (220.74)", "text": "끼는 것도 아니고 그냥 야쿠자가 운영하는 회사라고 보면 됨 '프론트 기업' 이라고 함", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.29 17:58", "comment_id": "reply_li_23342996", "parent_comment_id": "comment_li_23337912", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(122.34) (122.34)", "text": "용과같이 제로 지금 당장 플레이", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.29 20:27", "comment_id": "reply_li_23347923", "parent_comment_id": "comment_li_23337912", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(169.211) (169.211)", "text": "확실히 처자식이 있고 없고가 ㅈㄴ크다. 도로롱 십새끼였으면 바로 추노했을건데 계속 제일일찍출근해서 버티고있네. 사장도 처자식있는거에서 채용한거일듯. 특히나 버블꺼져서 예전이었으면 제국금융은 거들떠도 안볼 기업이나 업자들이 부도 안나려고 급돈ㅈㄴ필요해져서 수시로 제국올거라 바빠질텐데 언제 올지 모를 신입기다리니 주3회라도 사무실에서 일한적있는 경력직이라", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.29 15:56", "comment_id": "comment_li_23338398", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(169.211) (169.211)", "text": "사무감각도 있을거고. 그리고 저번 Q2때도 그렇고 제국도 법무관련해서 구
