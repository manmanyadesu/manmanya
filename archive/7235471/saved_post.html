: "11.25 11:07", "comment_id": "reply_li_24615533", "parent_comment_id": "comment_li_24602545", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b651e22d6eb2ca73cb38c7109b0cf9c5a0126aa360945878ec8f5f393e5d7e2b30dfccb1fbbe6067511b", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "찐으로 저런 시대가 있고 멸망의 위기면 모험을 보내는 게 아니라 용사 감금시킨 다음에 착정해서 후대 용사 양산할듯. 여기저기 니맘대로 씨 뿌리고 다니라고 하면 어디서 누가 태어나는지도 모르고, 그 애새끼가 뭐로 자랄지도 모르는데 그런 리스크를 왜 지겠음? 국가 차원에서 관리해야지", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 11:25", "comment_id": "reply_li_24616148", "parent_comment_id": "comment_li_24602545", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "나름 재밌노", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 01:53", "comment_id": "comment_li_24602563", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅅㅇ(182.215) (182.215)", "text": "이번에도 죽겠구만ㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 01:56", "comment_id": "comment_li_24602700", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(218.51) (218.51)", "text": "음.... 판릴리도 10화까지는 애매했으니까 참아볼까", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 01:56", "comment_id": "comment_li_24602714", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(182.211) (182.211)", "text": "이건 리메이크가 나은게 그림이 좀 많이 구리노", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 02:06", "comment_id": "comment_li_24603168", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(183.106) (183.106)", "text": "번토리움 어딨어? Ai로 축제를 열어줘.", "is_reply": false, "dccon": "", "comment_img": "", "date": "1
