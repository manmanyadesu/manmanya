09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658eb2772803991af4382532e1efc1f10189e28d59da9f7330429233fbad39685740cb9cbd2d3a9d6d8564cc70d400436bddf92f75e3e0bcf32e102b5", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅁㅁ(211.196) (211.196)", "text": "거 시발 이런건 양지 말고 음지에서 그리면 안됨까?", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.14 14:47", "comment_id": "comment_li_21076626", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅁㅁ(211.196) (211.196)", "text": "음지에선 모든 욕망 다 표출 가능한데 왜 양지에서 검열과 맞서 싸우는거야", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 14:49", "comment_id": "reply_li_21076678", "parent_comment_id": "comment_li_21076626", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅁㅁ(211.196) 양지에서 어그로 끌다가 럭키펀치 한번 들어가면 음지랑 차원이 다른 리턴이 오기때문", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Dmd_PWsQ-eUpySm--MSUJHQ3VJUsQpZI", "date": "09.14 15:11", "comment_id": "reply_li_21077356", "parent_comment_id": "comment_li_21076626", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러22(39.114) (39.114)", "text": "아니 시발 교사가 애들 대충 가르쳐주고 땡인 졷인 직업으로 보노 ㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.14 14:48", "comment_id": "comment_li_21076636", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.36) (211.36)", "text": "그럼 아니냐 ㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 14:48", "comment_id": "reply_li_21076654", "parent_comment_id": "comment_li_21076636", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.41) (118.41)", "text": "교사들 좆도 아닌걸로 징징거리는 꼬라지 보면 개꿀 직업 맞던데", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 15:26", "comment_id": "reply_li_21077777", "parent_comment_id": "comment_li_21076636", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러39(211.114) (211.114)", "text": "@ㅇㅇ(118.41) 중딩은 개꿀이 맞는데 고딩교사는 극한직업 맞음. 일반고 학생이 봐도 신념으로 하는 직업임", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 15:36", "comment_id": "reply_li_21078104", "parent_comment_id": "comment_li_21076636", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(125.185) (125.185)", "text": "그럼 무슨직업인데? 뭐 민원좆같다고? 민원때문에 ㅇㅇ안할게요 하고 없앤 대규모행사가 얼마나 많은데 좆븅신임?", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 15:37", "comment_id": "reply_li_21078141", "parent_comment_id": "comment_li_21076636", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러44(223.38) (223.38)", "text": "@ㅇㅇ(125.185) 고등학교 교사는 빡세지 특히 입문고 가면 왜 담임 어떻게든 안하려고 하는지 알 수 있음 ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 15:41", "comment_id": "reply_li_21078254", "parent_comment_id": "comment_li_21076636", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(125.185) (125.185)", "text": "@만갤러44(223.38) 작중 교사는 중학생교사라고 나오는데 왜 자꾸 가상의 고등학교 교사 끌고와서 어렵다노 이러고있는거임?", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 15:43", "comment_id": "reply_li_21078354", "parent_comment_id": "comment_li_21076636", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러47(211.234) (211.234)", "text": "학창시절에 맞은걸 주위 환경 탓이라고 생각하는 애들이 모인곳에서 교사편을 들면 어쩌자는겨", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 15:50", "comment_id": "reply_li_21078532", "parent_comment_id": "comment_li_21076636", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러62(14.50) (14.50)", "text": "ㅋㅋ 면직률 최하위 직종 또 호들갑 시동거네", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 16:40", "comment_id": "reply_li_21080149", "parent_comment_id": "comment_li_21076636", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.186) (211.186)", "text": "교새들 좆도아닌걸로 근들갑ㅅㅂ아주 지들만 제일힘들지", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 16:49", "comment_id": "reply_li_21080505", "parent_comment_id": "comment_li_21076636", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러77(1.245) (1.245)", "text": "고등학교 교사는 애매함. 애새끼들 대가리 커져서 교사를 좆으로 봄. 본격적으로 공부 시작하다보니, 교사를 출신 학교 및 수업 능력으로 품평함. 중학교 때 건방짐이랑은 다름. ㄹㅇ 우민 보듯 보는 애들도 있음. 근데 한편으론 내신이나 생기부 관리해서 갑인 면도 있음. 그리고 이 나이쯤되면 남자새끼들 보빨러 기질 깨어나서, 공학의 경우 스윗한 척한다고", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 17:49", "comment_id": "reply_li_21083311", "parent_comment_id": "comment_li_21076636", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러77(1.245) (1.245)", "text": "착한 학생 노릇하기도 함. 아무튼 고등학교 교사는 학군이나 학교 분위기에 따라 난이도가 천차만별.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 17:49", "comment_id": "reply_li_21083331", "parent_comment_id": "comment_li_21076636", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "", "is_reply": true, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b651e22d6eb2ca73cb38c7109b0cf9c5a0126aa360945878ec8f5f393e5d7e2b30dfccb1fbbe6067511b", "comment_img": "https://lh3.googleusercontent.com/d/1Dmd_PWsQ-eUpySm--MSUJHQ3VJUsQpZI", "date": "09.14 18:00", "comment_id": "reply_li_21083880", "parent_comment_id": "comment_li_21076636", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b651e22d6eb2ca73cb38c7109b0cf9c5a0126aa360945878ec8f5f393e5d7e2b30dfccb1fbbe6067511b", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(124.50) (124.50)", "text": "교새들 개지랄 시작 ㅋㅋㅋㅋㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 18:48",
