야... 만화 그리는걸 주제로 한 만화는 개쌉노잼 불쏘시개인거 아니었어...?만력뭔데", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.02 22:42", "comment_id": "comment_li_20511376", "parent_comment_id": ""}, {"writer": "ㅇㅇ(211.36) (211.36)", "text": "", "is_reply": true, "dccon": "https://lh3.googleusercontent.com/d/1aVlPyLAHKVry-H47GFb4GJULnS9xn4kk", "comment_img": "", "date": "09.02 23:18", "comment_id": "reply_li_20513170", "parent_comment_id": "comment_li_20511376"}, {"writer": "ㅇㅇ", "text": "그레이트 마징가나 마징카이저는 뭐임?", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1G60C2F5NiJesfvjoxe9eaDT9LP4SpHCW", "date": "09.02 22:44", "comment_id": "comment_li_20511467", "parent_comment_id": ""}, {"writer": "긆힉놃을", "text": "그레이트는 Z 후속작 원하던 방송사하고 스폰서 입김이 더 강하게 들어간 작품이고 죽은줄 알았던 코우지 아빠가 사실 살아서 비밀리에 만듦. 카이저는 게임 슈퍼로봇대전에서 후속기체가 없어서 애매해지던 마징가Z의 후속기를 만드는 기획으로 탄생함. 그래서 설정은 등장 작품마다 다른데 처음 나온건 겟타선에 노출된 마징가Z가 진화한 것", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1EQZnHSpKs_ddHSfYIOHhJMQIh2FqTg0T", "date": "09.02 23:20", "comment_id": "reply_li_20513285", "parent_comment_id": "comment_li_20511467"}, {"writer": "ㅇㅇ", "text": "@긆힉놃을 헐", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1G60C2F5NiJesfvjoxe9eaDT9LP4SpHCW", "date": "09.02 23:22", "comment_id": "reply_li_20513371", "parent_comment_id": "comment_li_20511467"}, {"writer": "ㅇㅇ(211.234) (211.234)", "text": "그레이트는 나가이가 방송사랑 존나 싸울때 만들어진거라 좀 꺼리는 경향이 있음. 마징카이저는 진마징가였던가 거기서 디자인 가져와서 만든거.슈로대용으로 만들었다가 괜찮네? 해서 정식편입함", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.03 00:33", "comment_id": "reply_li_20516761", "parent_comment_id": "comment_li_20511467"}, {"writer": "ㅇㅇ", "text": "@긆힉놃을 겟타선에 노출된 마징가->얼마나 좆된건지 상상도안됨", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1G60C2F5NiJesfvjoxe9eaDT9LP4SpHCW", "date": "09.03 10:49", "comment_id": "reply_li_20533607", "parent_comment_id": "comment_li_20511467"}, {"writer" _id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
