, "comment_img": "https://lh3.googleusercontent.com/d/18_XPMkPg6PehezwByn9vB2apmooOBGxy", "date": "09.05 21:32", "comment_id": "reply_li_20658568", "parent_comment_id": "comment_li_20658476", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(122.128) (122.128)", "text": "@ㅇㅇ 그러니까 틀어진 전개를 맞추려면 원작 소설가가 나서야 좀 그럴듯해질텐데, 그걸 제대로 해줄지 모르겠다는 말임솔직히 돈을 제대로 지급해야 하는데 얘네들 애니화 되면 원작 만화가를 열정페이로 굴리는 것마냥소설가도 코믹스화로 넘어가면 원작 소설가를 열정페이로 굴림", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.05 21:37", "comment_id": "reply_li_20658816", "parent_comment_id": "comment_li_20658476", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(61.98) (61.98)", "text": "@ㅇㅇ(122.128) 일본은 노피아 문피아같은데 없음?팔리면 그만큼 광고가 되는건데 왜 소설 유입이 없음?", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.05 21:58", "comment_id": "reply_li_20659704", "parent_comment_id": "comment_li_20658476", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러46(14.34) (14.34)", "text": "@ㅇㅇ(61.98) 유입은 있지 존나 미미하니까 문제지 웹소 안보는 사람들이 흔히들 착각하는건데 전독시 나혼렙 재벌집 이런 작품들이 미디어가 흙속의 진주를 찾아서 대박내준게 아님 원작 자체만으로도 존나게 많이 팔렸음 그리고 2차가공으로 넘어갔을 때는 이미 시차 때문에 유행이 지나고 광고효과가 의미도 없고 나혼렙 애니 핫할 때 정작 웹소판에선 헌터물 자체가 한물 간 장르였음", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 15:52", "comment_id": "reply_li_20697622", "parent_comment_id": "comment_li_20658476", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(122.128) (122.128)", "text": "원작 소설가가 중간에 한번 손을 놓은 것은 만화판이 그럭저럭 팔리는 것과 무관하게, 만화로 원작가에게 인세가 들어오지 않기 때문임원작자는 만화책이 수백 만권이 팔리든말든 오로지 원작 소설이 팔려야 돈이 들어오는데,야인 작가는 지인 사기 당해서 빚도 진 상황이고 본인도 운동하다 다쳐서 돈이 좀 많이 필요한 상황이라 편의점 알바랑 노가다 뛰느라 바쁨비틀린 전개를 원작 소설가가 도와주면서 맞춰야 할텐데, 코믹스로 딱히 돈 들어오는 것도 없고 현생이 고달픈데 원작 소설가 그걸 도와주긴 힘들겠지무쓸모 스킬 25년인가 하는 소설도 만화는 500만부인가 팔리고 있는데 그거 역시 원작자에게 떨어지는 돈이 없어서 그거 원작 소설가는 지금 소설 쓰는거 때려쳤음", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.05 21:35", "comment_id": "comment_li_20658722", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러38(211.205) (211.205)", "text": "그래?", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.05 21:40", "comment_id": "reply_li_20658955", "parent_comment_id": "comment_li_20658722", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(61.98) (61.98)", "text": "개노잼이라 유입이 없는거니 어쩔수 없는것이지 아무래도", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.05 21:57", "comment_id": "reply_li_20659636", "parent_comment_id": "comment_li_20658722", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(122.128) (122.128)", "text": "원치않는 불사의 모험가는 만화가 400만부 넘게 팔렸는데 원작가는 2년 전부터 잠수타는 중임만화가는 애니화랑 무관하게 연재하면서 잡지사에 고료라도 받으며 생활이 가능하지만웹소설가는 책 안 팔리면 생활이 안되는 입장이니 잠수타는 쪽으로 흐르는 거겠지", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.05 21:59", "comment_id": "reply_li_20659728", "parent_comment_id": "comment_li_20658722", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(59.5) (59.5)", "text": "이해가 안가는데 원작자인데 왜 코믹스 수익이 안들어옴? %는 적어도 지분이 있긴 할거아냐 저작권자인데. 그 %가 너무 적다는 뜻임?", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 02:11", "comment_id": "reply_li_20672804", "parent_comment_id": "comment_li_20658722", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(59.5) (59.5)", "text": "검색해보니까 코믹스 인세 10%에서 원작 1~3% 작화 7~8%정도인가보네. 2%라고 쳐도 많이 팔리기만 한다면 적지는 않을건데 여기서부턴 원작자는 불로소득이고", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 02:17", "comment_id": "reply_li_20673154", "parent_comment_id": "comment_li_20658722", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(59.5) (59.5)", "text": "@ㅇㅇ(59.5) 근데 이거 코믹스 누적 100만부 팔렸다는데?? 1권에 840엔(세금별도)에 100만부의 2%면 1680만엔은 떨어졌겠는데? 1억5천은 벌었잖아", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 02:37", "comment_id": "reply_li_20674129", "parent_comment_id": "comment_li_20658722", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㄴㅁㅇ", "text": "댓글 복붙해서 지피티제미나이클로드한테 다물어봣는데 인세 안들어온다는건 개소리라는데? 최소 1~3퍼는 무조건 원작자한테 간대", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Crzr7u926vNdzESCoPt8DQ1xg8Iz9nEO", "date": "09.06 03:21", "comment_id": "reply_li_20676159", "parent_comment_id": "comment_li_20658722", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.234) (211.234)", "text": "@ㄴㅁㅇ 야인작가 본인이 서적은 물론이고 코믹스로도 수익이 거의 없어서 노가다 뛴다고 했다니네말대로 수익이 조금이라도 나온다면 소설 연재에 집중하겠지 아프다는 놈이 노가다 뛰고 있겠냐", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 09:44", "comment_id": "reply_li_20684423", "parent_comment_id": "comment_li_20658722", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.234) (211.234)", "text": "@ㄴㅁㅇ 걔 말고도 소설가가 되자 사이트 가보면 코믹스화 되어봤자 들어오는 돈이 없다고 징징대는 애들이 한둘이 아니다", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 09:46", "comment_id": "reply_li_20684496", "parent_comment_id": "comment_li_20658722", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.234) (211.234)", "text": "@ㄴㅁㅇ 니네말대로 100만부에 1억 넘게 추가금이 들어는데 500만부, 400만부 판 원작자가 왜 그걸 연중하고 딴거 쓰거나 잠수 타거나 생활고를 하소연하겠냐", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 09:53", "comment_id": "reply_li_20684705", "parent_comment_id": "comment_li_20658722", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@ㅇㅇ(211.234) 그거야 100만부 가는데 5년걸린거면 1년에 3천꼴로 들어온거니까 월에는 몇백 꽂힐테니 사람따라 적다고 생각하나보지. 원작자한테 수익이  아예 안갈수는 없다니까? 너같으면 그걸 허가함? 니 소설로 만화만들건데 1원도 안줄거임 이걸?", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 10:39", "comment_id": "reply_li_20686089", "parent_comment_id": "comment_li_20658722", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@ㅇㅇ(211.234) 그리고 작가들 머리가 좀 빠져있는게 코믹스가 잘팔려야 소설이 잘팔림. 원래 코믹스화 애니화 테크 타면서 그 수익도 추가되지만 원작 홍보에 기여되는 원리야. 코믹스 수익이 아무리 적어도 원작판매량에 홍보적으로 기여를 한단말임. 근데 코믹스 몇백만부여도 잠수탄다 생활고다 그런건 그냥 스토리가 안나오거나 쓰기가 싫은거야. 술술 풀리면 밤새서라도 써오는게 창작자임", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 11:06", "comment_id": "reply_li_20686864", "parent_comment_id": "comment_li_20658722", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@ㅇㅇ(211.234) \"500만부 판매 코믹스의 원작!\"->이게 조스로 보임? 소설도 따라 팔리게 되어있다", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 11:08", "comment_id": "reply_li_20686919", "parent_comment_id": "comment_li_20658722", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(122.128) (122.128)", "text": "@ㅇㅇ(106.101) 코믹스의 애니화를 예를 봐도 알겠지만 일본은 기본적으로 애니화하면 만화책 많이 팔릴테니 그걸로 퉁치라고 돈을 거의 안줌. AI로 검색하면 당연히 인세를 주는 것처럼 말하는데 실제적으로 매절 계약이라고 해서 처음에 돈을 주고 인세를 안주는 방식이 있는데, 이게 일본 출판사에서 2차 창작으로 넘어가면 자주 쓰는 방식임. 그 대단한 귀멸의 칼날도 원작자는 거의 받은 돈이 없다고 하는 수준임. 검색하면 1억은 받았니뭐니 하는데 이건 토리야마 정도 되는 대작가나 그렇게 주는 거고 귀멸의칼날 작가는 계약 당시 그 급은 아니었음. 같은 방식으로 소설도 만화덕분에 책도 다시 팔릴테니 그걸로 퉁치라고 돈을 거의 안주는 경우가 대부분인데, 문제는 이래놓고 소설을 재판 안해버린다는게 문제임", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 11:25", "comment_id": "reply_li_20687496", "parent_comment_id": "comment_li_20658722", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(122.128) (122.128)", "text": "@ㅇㅇ(106.101) 500만부 소설인데 재판을 왜 안해주냐 하면, 그냥 일본이 그래. 지금까지 해보니 수천 만권 팔린 코믹스의 원작도 재판을 하면 안팔렸나보지. 소설이 어느 정도 팔리고 발매가 중단이 안된 상황에서 코믹스화로 넘어가면 그래도 책이 더 팔릴 수가 있는데, 책 판매량이 몇백 권 수준인 소설이라서 출판사가 중단을 한 상황에서 코믹스가 대박을 쳐봤자 다시 책을 내주지 않음. 거기에 일본 관행상 안팔리던 소설은 인세 대신 앞서 말한 처음에 몇백 주고 땡치는 매절이라는 계약으로 더 이상 돈이 들어오지 않음. 결국 작가는 그 소설로 돈을 더 벌지 못하니 그건 연중 때리고 다른 소설을 쓰기 시작하는 거야. 코믹스 인지도로 혹여나 다른 작품을 쓰면 그게 잘 팔릴까 하고,", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 11:30", "comment_id": "reply_li_20687684", "parent_comment_id": "comment_li_20658722", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(122.128) (122.128)", "text": "@ㅇㅇ(106.101) 근데 문제는 그렇게 새로 시작해봤자 신작이 잘되는 경우는 드뭄. 반면 코믹스로 대박친 원작은 업계 관행으로 인세도 없는데, 출판사는 그거 더 쓰라고 쪼아대며 책을 다시 내주지도 않음. 이러니 그냥 잠수타거나 그 계정을 방치하고 새로 계정을 파는 거야. 나로우 출신 대우가 딱 이 정도임.AI가 말하는, 원작자가 인세 1-3퍼센트 먹는 경우는 ONE처럼 정식으로 스토리작가로 고용되는 경우지 꼴랑 몇백 권 팔려서 원작팬이 유입을 기대할 수 없는 웹소설은 대부분 해당이 안돼.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 11:37", "comment_id": "reply_li_20687915", "parent_comment_id": "comment_li_20658722", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(122.128) (122.128)", "text": "@ㅇㅇ(106.101) 나로우 출신 중에서 소설로 수십 만권 파는 작가는 비탄의 망령, 추방 중기사처럼 진짜로 몇 안됨. 대부분은 카도카와 대상으로 완결+코믹스화 보장 받고도 누적 200부도 못 팔아서 2권에서 잘린 이방인 던전에 기어들다 작가마냥 수백 부 정도 팔리는 수준임.코믹스가 잘 팔리는데 나로우에 원작 연재를 그대로 놔둔다? 그럼 절판 당했고 출란사에서 책을 더 이상 안 내준다는 말임. 반대로 원작 찾아가보니 연재 다 지워버리고 요약본만 있다면 그래도 책을 팔 희망이 있는 소설이라는 소리고", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 11:58", "comment_id": "reply_li_20688641", "parent_comment_id": "comment_li_20658722", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.185) (211.185)", "text": "@ㅇㅇ(122.128) ㄷㄷㄷㄷㄷ", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 13:10", "comment_id": "reply_li_20691612", "parent_comment_id": "comment_li_20658722", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "주인공새끼 공격은 작가 좋을 때만 잘통하는거같음  - dc App", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/18_XPMkPg6PehezwByn9vB2apmooOBGxy", "date": "09.05 21:40", "comment_id": "comment_li_20658942", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.135) (121.135)",
