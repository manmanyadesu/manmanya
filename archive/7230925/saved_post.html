인거야?", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 23:02", "comment_id": "comment_li_24595586", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "여후배랑 갈등 중이었으면 저 반응이 맞음", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 23:09", "comment_id": "comment_li_24595977", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "꿀금통수", "text": "이거 한참을 떡밥 안풀길래 버렸는데 좀 떡밥 풀림?", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 23:09", "comment_id": "comment_li_24595978", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "ㅋㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 23:11", "comment_id": "comment_li_24596036", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "우롱우동", "text": "", "is_reply": false, "dccon": "https://dcimg4.dcinside.co.kr/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b651ee226e2a7706c0052176b448fe79fad0d490c7b6a13f1bc0d9daffa2502b4edd46a071616d1add0fbe61e2a6d43d8adb93dc", "comment_img": "", "date": "11.24 23:28", "comment_id": "comment_li_24596830", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b651ee226e2a7706c0052176b448fe79fad0d490c7b6a13f1bc0d9daffa2502b4edd46a071616d1add0fbe61e2a6d43d8adb93dc", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "새끼 얼마나 토오코랑 하고싶었던거임 ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 23:34", "comment_id": "comment_li_24597123", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.164) (221.164)", "text": "저럼 잘된거 아님?다 해결 된거잖아", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 23:38", "comment_id": "comment_li_24597277", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(183.106) (183.106)", "text": "걍 보니 스토리 진짜 별거 없나보네. 딸이 얼만큼 들이대도 그냥 딸로만 보는 진짜? 아빠를 찾는것같은데. 전 남편은 결국 못참고 딸한테 손데려했고 바로 런.", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 23:51", "comment_id": "comment_li_24597878", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.167) (221.167)", "text": "손 안대서 버림 받았대자나", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 00:25", "comment_id": "reply_li_24599412", "parent_comment_id": "comment_li_24597878", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.37) (211.37)", "text": "@ㅇㅇ(221.167) 위에 애는 살짝 이해가 달랐긴 한데 다시 지가 아빠 된다는게 저 남자 말이 진실이라는 전제면 이제는 손댈 마음을 먹었다는거잖음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 10:15", "comment_id": "reply_li_24613866", "parent_comment_id": "comment_li_24597878", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(175.204) (175.204)", "text": "이럼 전남편새끼 그냥 스토커로 신고하고 행복하게 살면 되잖아", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.24 23:59", "comment_id": "comment_li_24598263", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "왜 심각한척이지 또", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 00:00", "comment_id": "comment_li_24598294", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "의심되는게 있으면 시발 손을 움직이지 말고 쳐 생각을 해 병신아 뭘 그렇게 뒤로 미루는거야", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 00:21", "comment_id": "comment_li_24599241", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.49) (211.49)", "text": "있는척 심각한척 진행하는척 애미 병신작가년", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 00:25", "comment_id": "comment_li_24599396", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러21(1.245) (1.245)", "text": "진짜 번외로 꼬름한 정체 나와서 만화 재미 다 뒤졋음. 그거 아니었으면 누가 구라치는 건지 아직도 심리전하는 건데", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 01:01", "comment_id": "comment_li_24600921", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(119.71) (119.71)", "text": "퐁퐁이냐 아니냐", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 01:07", "comment_id": "comment_li_24601086", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러22(180.230) (180.230)", "text": "헉", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 01:20", "comment_id": "comment_li_24601482", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "편집증 걸린놈을 주인공으로 내세우니까 그냥 개재미없음 ㅅㅂ", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 01:22", "comment_id": "comment_li_24601536", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "디시콘사용", "text": "", "is_reply": false, "dccon": "https://dcimg4.dcinside.co.kr/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b651eb216e0b191960025fcb9d6eda814309d7a0a5a85a99bf2a7562904d4fb638affb971d2826d4b2fbc74b", "comment_img": "", "date": "11.25 01:22", "comment_id": "comment_li_24601548", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b651eb216e0b191960025fcb9d6eda814309d7a0a5a85a99bf2a7562904d4fb638affb971d2826d4b2fbc74b", "comment_img_source": "", "comment_media_ver
