ent_img": "", "date": "09.17 21:07", "comment_id": "comment_li_21244731", "parent_comment_id": ""}, {"writer": "만갤러8(221.151) (221.151)", "text": "선생 저거 빨리 교감한테 참교육 당해야 되는데", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.17 21:11", "comment_id": "comment_li_21244931", "parent_comment_id": ""}, {"writer": "ㅇㅇ(222.119) (222.119)", "text": "꿈을 고르니까 꿈이 없는 거지", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.17 21:13", "comment_id": "comment_li_21244972", "parent_comment_id": ""}, {"writer": "ㅇㅇ(118.223) (118.223)", "text": "학생 상황에 맞춰서 선택지를 제시해주는것도 아니고 부정만 하는건 누구나 다 할 수 있는데 진로상담 날로 먹노 ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.17 21:13", "comment_id": "comment_li_21244982", "parent_comment_id": ""}, {"writer": "만갤러9(182.230) (182.230)", "text": "혹시 담 번역때 https://youtu.be/GxChUrrY4bc?si=4ebEg7hzqxWv3w6F 이노래 브금으로가능?", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.17 21:19", "comment_id": "comment_li_21245253", "parent_comment_id": ""}, {"writer": "만갤러10(223.39) (223.39)", "text": "선생련 지는 공무원 쳐하면서 누가보면 대기업 회장인것마냥 얘기쳐하는게존나 위화감듬", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.17 21:24", "comment_id": "comment_li_21245463", "parent_comment_id": ""}, {"writer": "ㅇㅇ(182.230) (182.230)", "text": "꿈 이룬게 철스퍼거밖에 없어 그냥 대충 살아라", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.17 21:32", "comment_id": "comment_li_21245788", "parent_comment_id": ""}, {"writer": "ㅇㅇ(112.147) (112.147)", "text": "저 선생은 근데 담당과목이 없나? 왜저렇게 취업무새임", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.17 21:42", "comment_id": "comment_li_21246292", "parent_comment_id": ""}, {"writer": "ㅇㅇ(112.147) (112.147)", "text": "아니 취업이아니고 진로", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.17 21:42", "comment_id": "reply_li_21246330", "parent_comment_id": "comment_li_21246292"}, {"writer": "ㅇㅇ(116.40) (116.40)", "text": "대학진학 안하고 바로 취업해도 그만두는 경우 많다고 ㅋㅋㅋ", "is_reply": false, "dccon": "", "comm lse, "dccon": "https://lh3.googleusercontent.com/d/1DHiaqdmunMlN0U0IktMDoMxkPrJ6U3ml", "comment_img": "https://lh3.googleusercontent.com/d/17GwHjMO5Yqzkf1s4Hb0I0N5I_RruNWbS", "date": "09.21 19:44", "comment_id": "comment_li_21455386", "parent_comment_id": ""}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
