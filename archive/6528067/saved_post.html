992", "parent_comment_id": "comment_li_22209308"}, {"writer": "와히라나고미", "text": "@만갤러20(59.28) 뭔가 외로운 늑대에 대한 묘사가 좀 바뀌어야 할거 같은데자신의 무리를 찾지 못하고 방황하는 그런 사람으로", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Cvtpa_3HxYzMoUMXoQ2fkE9aV0sDji67", "date": "10.06 11:54", "comment_id": "reply_li_22210019", "parent_comment_id": "comment_li_22209308"}, {"writer": "만갤러20(59.28) (59.28)", "text": "@와히라나고미 ㅇㅇ 실제 고독한 늑대는 세간의 이미지랑은 달리 좀 찌질하고 자리 덜 잡은 청년 느낌이지   - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.06 11:57", "comment_id": "reply_li_22210081", "parent_comment_id": "comment_li_22209308"}, {"writer": "와히라나고미", "text": "@만갤러20(59.28) 뭔가 애매한 느낌같기도 하네", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Cvtpa_3HxYzMoUMXoQ2fkE9aV0sDji67", "date": "10.06 11:59", "comment_id": "reply_li_22210146", "parent_comment_id": "comment_li_22209308"}, {"writer": "ㅇㅇ", "text": "무리짓는 사회 동물이라고 처음부터 친화력이 있고 사회에 동화되고 그런게 아님 어릴때 사회화를 체득하지 않으면 저거보다 더한 만붕늑대 되는거임 가축화된 개도 사회화 안시켜놓으면 얘가 진짜 개라고? 싶을 정도로 막나감 그리고 여주가 후미를 잡는거에 집착한다던가 그런 부분에서 어느 정도의 본능적 사회성은 확인할 수 있음", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/13k7FEsrWHAh5kcdMF_YcFxGnHfWO4-hA", "date": "10.06 12:27", "comment_id": "reply_li_22211242", "parent_comment_id": "comment_li_22209308"}, {"writer": "ㅇㅇ(121.168) (121.168)", "text": "동물들의 무리생활은 인간처럼 화목하고 그런거 아님", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.06 13:45", "comment_id": "reply_li_22214187", "parent_comment_id": "comment_li_22209308"}, {"writer": "ㅇㅇ(121.169) (121.169)", "text": "존나 멍청한 애들끼리 이게맞다 저게맞다 토론하고 있는꼴 답답해 죽겠네 그냥 一匹狼 라는 상투적인 일본어 관용 표현에서 따온 소재인건데 여주 아싸짓 과장되게 연출한거 전부 一匹狼 특유의 독립성 강한 기존쎄 아싸 캐릭터성 묘사한거고 씹덕캐릭 닉 달고 있는 조센징이 기본적인 일어 표현조차 모르고 무리생활 어쩌구하고 있네", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.06 15:30", "comment_id": "reply_li_22218182", "parent_comment_id": "comment_li_22209308"}, {"writer": "ㅇㅇ(118.235) (118.235)", "t 0.07 19:22", "comment_id": "comment_li_22277250", "parent_comment_id": ""}, {"writer": "ㅇㅇ(14.5) (14.5)", "text": "그림은 좋은데 스토리에서 이것저것 다 넣으려니 너무 난잡해짐버릴건 버리고 그럴줄 알아야 되는데", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.08 05:49", "comment_id": "comment_li_22303992", "parent_comment_id": ""}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
