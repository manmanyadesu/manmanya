rent_comment_id": "comment_li_22209308", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러20(59.28) (59.28)", "text": "@와히라나고미 ㅇㅇ 실제 고독한 늑대는 세간의 이미지랑은 달리 좀 찌질하고 자리 덜 잡은 청년 느낌이지   - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.06 11:57", "comment_id": "reply_li_22210081", "parent_comment_id": "comment_li_22209308", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "와히라나고미", "text": "@만갤러20(59.28) 뭔가 애매한 느낌같기도 하네", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.06 11:59", "comment_id": "reply_li_22210146", "parent_comment_id": "comment_li_22209308", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "무리짓는 사회 동물이라고 처음부터 친화력이 있고 사회에 동화되고 그런게 아님 어릴때 사회화를 체득하지 않으면 저거보다 더한 만붕늑대 되는거임 가축화된 개도 사회화 안시켜놓으면 얘가 진짜 개라고? 싶을 정도로 막나감 그리고 여주가 후미를 잡는거에 집착한다던가 그런 부분에서 어느 정도의 본능적 사회성은 확인할 수 있음", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.06 12:27", "comment_id": "reply_li_22211242", "parent_comment_id": "comment_li_22209308", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.168) (121.168)", "text": "동물들의 무리생활은 인간처럼 화목하고 그런거 아님", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.06 13:45", "comment_id": "reply_li_22214187", "parent_comment_id": "comment_li_22209308", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.169) (121.169)", "text": "존나 멍청한 애들끼리 이게맞다 저게맞다 토론하고 있는꼴 답답해 죽겠네 그냥 一匹狼 라는 상투적인 일본어 관용 표현에서 따온 소재인건데 여주 아싸짓 과장되게 연출한거 전부 一匹狼 특유의 독립성 강한 기존쎄 아싸 캐릭터성 묘사한거고 씹덕캐릭 닉 달고 있는 조센징이 기본적인 일어 표현조차 모르고 무리생활 어쩌구하고 있네", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.06 15:30", "comment_id": "reply_li_22218182", "parent_comment_id": "comment_li_22209308", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "한 2~3화에 나눠서 할 내용을 너무 쑤셔
