riter": "아이스", "text": "", "is_reply": false, "dccon": "https://dcimg4.dcinside.co.kr/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65fe3256e36cb6e6890d3d25b44822f48b0282490610773acf3fc157a66f4f695f194095107b4f7c6cff76bb9", "comment_img": "", "date": "11.18 11:38", "comment_id": "comment_li_24252135", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65fe3256e36cb6e6890d3d25b44822f48b0282490610773acf3fc157a66f4f695f194095107b4f7c6cff76bb9", "comment_img_source": "", "comment_media_version": 2}, {"writer": "【파유자재불】", "text": "“이른바 ‘원컨대 일체중생이 금강장(金剛藏)의 마음을 얻어 모든 금강위산(金剛圍山)으로도 깨뜨릴 수 없어 지이다.’하느니라.‘원컨대 일체중생이 만(卍)자 모양으로 장엄한 금강 성품 같은 마음을 얻으며, 동요할 수 없는 마음을 얻으며, 두렵게 할 수 없는 마음을 얻으며, 세상을 이익하게 해도 항상 다함이 없는 마음을 얻으며, 크게 용맹한 깃대와 같은 지혜장(智慧藏)의 마음을 얻어 지이다.’하느니라.”", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.18 11:44", "comment_id": "comment_li_24252299", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(14.51) (14.51)", "text": "댓글 보니까 이래서 작가들이 첫화부터 ㅈㄴ 자극적으로 가는구나보통 초반에 세계관 푼다고 말 많지 않나? 걍 나쁘지 않은 것 같은데 지루하다고 하네 빌드업 단계라고 보면 되는데 ㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.18 12:05", "comment_id": "comment_li_24253104", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(175.211) (175.211)", "text": "소신발언 하는데 존나 재미없다", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.18 12:07", "comment_id": "comment_li_24253197", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(112.163) (112.163)", "text": "", "is_reply": true, "dccon": "https://dcimg4.dcinside.co.kr/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658eb2078908a53e2e6161ff134594b016c60b62ffb03340fe3601e080358723f6a214f6032d41af640bad92e40ff2701d4be5d1879e5df37", reply_li_24255036", "parent_comment_id": "comment_li_24254227", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "뉴비들은 마술사? 소품 부셔먹어서 공연 준비 안됐다고 머리짧은애가 긴애 갈구는건가? 이런 생각이나 할듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.18 13:01", "comment_id": "reply_li_24255447", "parent_comment_id": "comment_li_24254227", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ ㄹㅇ 세계관 몰라도 어쩌고 하는게 과대광고임어벤저스도 마블 모른채로 볼 수야 있지 ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.18 13:03", "comment_id": "reply_li_24255510", "parent_comment_id": "comment_li_24254227", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(59.9) (59.9)", "text": "타입문 작품들 기조가 다 그런듯원작 할배들만 잡아도 벌만큼 벌어서 그런지....신입은 꼬우면 좆무위키 10번 정독하도록", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.18 18:07", "comment_id": "reply_li_24266544", "parent_comment_id": "comment_li_24254227", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러24(221.150) (221.150)", "text": "아스카 레이 신지냐", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.18 12:39", "comment_id": "comment_li_24254384", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(117.111) (117.111)", "text": "너무 맛있슴니다", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.18 12:40", "comment_id": "comment_li_24254426", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.54) (211.54)", "text": "그림은 이거이거", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.18 12:41", "comment_id": "comment_li_24254466", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "오르텐시아", "text": "", "is_reply": false, "dccon": "https://dcimg4.dcinside.co.kr/dccon.php?
