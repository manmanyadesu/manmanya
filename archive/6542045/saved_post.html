, "date": "", "comment_id": "comment_li_22286731", "parent_comment_id": ""}, {"writer": "만갤러37(220.95) (220.95)", "text": "여주 왜 집에서 끌려 나오는거임 ,,,,,", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.07 23:02", "comment_id": "comment_li_22287564", "parent_comment_id": ""}, {"writer": "ㅇㅇ(61.84) (61.84)", "text": "지도라는게 진짜로 깊이가 있는데 창작물에서 주요하게 잘 안다루기에 내가 한번 지도장인인 주인공인 창작을 해보자고 써본적 있는데 쓰다보니 중세판타지 기술수준을 고증하면 보여줄 한계가 너무 많고 아니면 이세계전생을 해야하는데 결과적으로 뭔 교육만화처럼 되어버려가지고 결국 창작은 오직 내러티브와 드라마가 전부라는걸 깨달음;", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.07 23:19", "comment_id": "comment_li_22288625", "parent_comment_id": ""}, {"writer": "만갤러38(112.170) (112.170)", "text": "잘 봤습니다", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.07 23:21", "comment_id": "comment_li_22288728", "parent_comment_id": ""}, {"writer": "ㅇㅇ(58.228) (58.228)", "text": "이거 개인적으로 존나 재밌네", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.07 23:25", "comment_id": "comment_li_22289013", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1K4zec0HwM8l85zxksD29FpF82zXb8yuW", "comment_img": "https://lh3.googleusercontent.com/d/1uaatsHHrcepcnOEVLCn45qOxR0My3EW7", "date": "10.07 08:39", "comment_id": "comment_li_22254134", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1u1actZq8oGyer6ofBQ8i36fSqks6_7Gs", "comment_img": "https://lh3.googleusercontent.com/d/1uaatsHHrcepcnOEVLCn45qOxR0My3EW7", "date": "10.07 08:40", "comment_id": "comment_li_22254150", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1u1actZq8oGyer6ofBQ8i36fSqks6_7Gs", "comment_img": "https://lh3.googleusercontent.com/d/1uaatsHHrcepcnOEVLCn45qOxR0My3EW7", "date": "10.07 08:40", "comment_id": "comment_li_22254166", "parent_comment_id": ""}, {"writer": "만갤러20(175.125) (175.125)", "text": "창녀록 e if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
