ment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러24(211.246) (211.246)", "text": "솔까말 등기부에 공신력이 없다는 게 말이 안 되는 ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.10 18:52", "comment_id": "comment_li_22435460", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.141) (221.141)", "text": "등기부에 공신력이 있으면 등기부 관리하고 떼주는데서 책임을 져 줘야되서 못하는거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.10 19:37", "comment_id": "reply_li_22437432", "parent_comment_id": "comment_li_22435460", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러31(119.207) (119.207)", "text": "등기부에 공신력 있는 독일이 어떤 절차 거치는지 확인해보고 와라, 등기비용 겁나 들어가고 절차도 오래걸리고 무엇보다 공신력을 인정한다고 해서 모든일이 해결되는게 아님", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.10 20:27", "comment_id": "reply_li_22439626", "parent_comment_id": "comment_li_22435460", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러31(119.207) (119.207)", "text": "공신력을 인정하면 거래의 안전성은 지켜지는데 실제 권리자를 지킬 수 없는 경우가 발생하고, 대신 추정력(현재 한국에서 인정되고 있는)을 인정하면 위조됬을 때 실제 권리자는 지켜지지만 거래의 안전성이 지켜지지 않는 건데 두 개를 전부 지킬수가 없어서 그런것 뿐임", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.10 20:31", "comment_id": "reply_li_22439827", "parent_comment_id": "comment_li_22435460", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "핑크치즈냥젤리", "text": "", "is_reply": false, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658e926774e5e663283816e3f9ea916608e3d01bb225815844b7479ab057263424291ac7356d327bbdb2ed47564dfec", "comment_img": "", "date": "10.10 18:53", "comment_id": "comment_li_22435465", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658e926774e5e663283816e3f9ea916608e3d01bb225815844b7479ab057263424291a
