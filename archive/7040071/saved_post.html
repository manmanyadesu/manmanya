 "text": "이 쓸모없는 화에서 꾸역꾸역 젖보똥년을 쳐넣다니 -", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.11 21:05", "comment_id": "comment_li_23938633", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러9(218.51) (218.51)", "text": "만화가 20p인데도 너무 짧게 느껴진다", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.11 21:07", "comment_id": "comment_li_23938717", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "우롱우동", "text": "저태이어딧어", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.11 21:11", "comment_id": "comment_li_23938939", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러11(222.232) (222.232)", "text": "옛날 1부 봤을때부터 궁금했는데 카노쇼 vs 카지마 둘이 동급이라봄? 아니면 카노쇼가 위? 제자 레벨에서는 두명이 최고같은데", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.11 21:11", "comment_id": "comment_li_23938941", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(220.83) (220.83)", "text": "카지마가 위임", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 21:17", "comment_id": "reply_li_23939254", "parent_comment_id": "comment_li_23938941", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "시시한소년", "text": "더 강해진 켄이치가 고전했으니까 쟤가 위 아닐까  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 21:20", "comment_id": "reply_li_23939437", "parent_comment_id": "comment_li_23938941", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅁㅁ(211.216) (211.216)", "text": "단순 재능이랑 강함은 카노쇼가 더 우위인데 둘이 맞짱 뜨면 카노쇼가 털릴듯 이 만화 특성상 정신적인 면을 중요하게 봐서 거기에 빈틈 있는 새끼는 짐", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 21:21", "comment_id": "reply_li_23939471", "parent_comment_id": "comment_li_23938941", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(220.83) (220.83)", "text": "애초에 카지마는 최종보스고 카노쇼는 그 무에타이 하는새끼보다 좆밥이라고 작중에서 나옴", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 21:21", "comment_id": "reply_li_23939495", "parent_comment_id": "comment_li_23938941", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅁㅁ(211.216) (211.216)", "text": "@ㅇㅇ(220.83) 만화 보면 카노쇼 저래도 끝끝내 사람 안죽이고 끝내려고 함 정동굉일 자폭질 아니었으면 거의 털끝조차도 못건드렸음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 21:23", "comment_id": "reply_li_23939607", "parent_comment_id": "comment_li_23938941", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(1.239) (1.239)", "text": "난 동급이었다고 봄 애초에 작품 진행하면서 켄이치가 성장한만큼 요미도 성장했음 카노쇼 생전엔 동급내지 카노쇼가 위였는데 죽고 시간이 흐른만큼 카지마가 성장한거겠지", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 21:33", "comment_id": "reply_li_23940057", "parent_comment_id": "comment_li_23938941", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅁㅁ(211.216) (211.216)", "text": "@ㅇㅇ(220.83) 카노쇼가 사토미나 티라웃코킨 같은 마음가짐이었으면 초장에 전력으로 숨통 끊어버렸지 살인권 배우놈이 애매하게 딱 뒤지지만 않을만큼 손봐주려다 자꾸 부활해서 꼬임 만화에서도 개연성 챙기려고 새한마리도 못죽이는 성격인거 보여줬고", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 21:39", "comment_id": "reply_li_23940362", "parent_comment_id": "comment_li_23938941", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.191) (121.191)", "text": "@ㅁㅁ(211.216) 새를 못죽이는 성격이아니라 강 새를 좋아하는 성격인거임 너만화 안봤냐? 그리고 정동굉일 솔직히 걍 계왕권인데 켄세이가 카노 쇼는 리스크없이 쓰는급이라고 말하는데 정동굉일 어쩌고가 왜나오노 ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 21:43", "comment_id": "reply_li_23940560", "parent_comment_id": "comment_li_23938941", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.191) (121.191)", "text": "@ㅁㅁ(211.216) 그리고 카지마가 재능빨 정면으로 부정하는 노력충 캐릭으로 나왔고 이번화에서도 다시 상기시켜주는데 뭔 카노쇼가 재능이 위니까 더 세디 드립치고있냐 ㄹㅇ 만화좀 봐라게이야 요약본만보지말고", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 21:45", "comment_id": "reply_li_23940637", "parent_comment_id": "comment_li_23938941", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅁㅁ(211.216) (211.216)", "text": "@ㅇㅇ(121.191) 실질적으로 애들 죽일기회 여럿 있었는데 하나도 안죽임 새끼야 리스크 없이 쓰긴 정동굉일 때문에 결국 기 뒤틀려서 기량떨어졌구만", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 21:45", "comment_id": "reply_li_23940639", "parent_comment_id": "comment_li_23938941", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.191) (121.191)", "text": "@ㅁㅁ(211.216) 켄이치가 뒤지기직잔에 기의장악체득하고 유수제공권 무박자로 겨우 이긴상대를 총알도 못막고 뒤진 제자 상위권따리한테 비비는게 말이안됨", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 21:50", "comment_id": "reply_li_23940819", "parent_comment_id": "comment_li_23938941", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.191) (121.191)", "text": "@ㅁㅁ(211.216) 걍 니는 만화안보고 캐빨만하고있는거임 ㅋㅋ 그러니까 캐릭터에재한 단편적인 정보만 알고 이야기 흐름은 아예모르는거 ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 21:51", "comment_id": "reply_li_23940845", "parent_comment_id": "comment_li_23938941", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅁㅁ(211.216) (211.216)", "text": "@ㅇㅇ(121.191) 그 총 맞고 안뒤졌다에 쌍부랄건다 새끼야 무조건 재등장함", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 21:52", "comment_id": "reply_li_23940862", "parent_comment_id": "comment_li_23938941", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅁㅁ(211.216) (211.216)", "text": "@ㅇㅇ(121.191) 애초에 만화에서 단순 강함이 승부 결정짓는게 아니라고 몇번을 강조했는데 사토미가 더 몰아붙였으니 사토미가 더쎔 ㅇㅈㄹ ㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 21:54", "comment_id": "reply_li_23940980", "parent_comment_id": "comment_li_23938941", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅁㅁ(211.216) (211.216)", "text": "@ㅇㅇ(121.191) 그리고 노력충이 이기는게 아니라 마음가짐 쎈놈이 이기는거다 저 만화에서 노력 안하는놈 진짜 손에꼽음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 21:57", "comment_id": "reply_li_23941086", "parent_comment_id": "comment_li_23938941", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.191) (121.191)", "text": "@ㅁㅁ(211.216) 이새끼 만화 안봐서 기의 장악이 뭔뜻인지도 모르네 ㅋㅋ 기의 장악은 달인급인데 ㅂㅅ아 달인영역에 발걸쳐서 겨우이긴 상대를 뭔 제자딱상태에서 털리고 총맞아뒤진놈한테 비비는거냐 ㄹㅇ 심각하네", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 21:58", "comment_id": "reply_li_23941129", "parent_comment_id": "comment_li_23938941", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.191) (121.191)", "text": "@ㅁㅁ(211.216) 그리고 마음가짐 타령하는데 카지마가 마음가짐 원탑인거 이번화 보고도 그냥 이해안되냐? 시한부 목숨으로 베팅까지하는 새낀데 뭔 ㅅㅂ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 22:01", "comment_id": "reply_li_23941241", "parent_comment_id": "comment_li_23938941", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅁㅁ(211.216) (211.216)", "text": "@ㅇㅇ(121.191) 그러니까 둘이 승부보면 기량이랑 재능이 카노쇼가 우위라고 해도 카지마가 이길거라고 안써놨냐 병신아", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 22:03", "comment_id": "reply_li_23941288", "parent_comment_id": "comment_li_23938941", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.191) (121.191)", "text": "@ㅁㅁ(211.216) 앙 미우마망 듁지마아아아아 하고 총맞아뒤진새끼랑 마음가짐비교 시발 어처구니가 없어서", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 22:03", "comment_id": "reply_li_23941298", "parent_comment_id": "comment_li_23938941", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅁㅁ(211.216) (211.216)", "text": "@ㅇㅇ(121.191) 아오 난독새끼 꺼져라 넌", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.11 22:03", "comment_id": "reply_li_23941315", "parent_comment_id": "comment_li_
