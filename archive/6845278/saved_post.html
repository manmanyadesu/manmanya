 "", "comment_media_version": 2}, {"writer": "폴렌", "text": "후피집도 아니고 착각물이었네", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.28 15:15", "comment_id": "comment_li_23289683", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "폴렌", "text": "원래파티애들 소생시키거나 하려나?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 15:16", "comment_id": "reply_li_23289737", "parent_comment_id": "comment_li_23289683", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "착각물까지는 아님. 그냥 주인공 의도대로 전개됨. 나중에 밝혀지는건 주인공과 동료들은 진정한 동료. 주인공도 원래는 동료들과 같이 마왕퇴치하는 계획을 세워둠. 근데 사천왕 침공때 동료들 고향이 침공당해서 마왕 급습해서 침공군 물리기로 한거. 실패하는건 동료들도 알고 있지만 고향 살리려고 특공하는거고, 이거 이야기하면 주인공도 실패하는거 알아도 동료들과 같이 죽으러 갈정도로 진정한 동료인걸 알아서 주인공 살리려고 일부러 추방한거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 15:28", "comment_id": "reply_li_23290295", "parent_comment_id": "comment_li_23289683", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.151) (221.151)", "text": "@ㅇㅇ 여론 안좋으니까 세탁하려고한 티 ㅈㄴ나노ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 15:33", "comment_id": "reply_li_23290487", "parent_comment_id": "comment_li_23289683", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "폴렌", "text": "@ㅇㅇ(221.151) 원작있다니까 처음부터 저 반전까진 세워놨겠지ㅋㅋ좀 굳이굳이 싶긴하네", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 15:33", "comment_id": "reply_li_23290511", "parent_comment_id": "comment_li_23289683", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(221.151) 애초에 1권따리 소설이 원작임", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 15:35", "comment_id": "reply_li_23290586", "parent_comment_id": "comment_li_23289683", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "폴렌", "text": "@ㅇㅇ ㄹㅇ? 짧네 연재중인게 아니라 , "comment_id": "comment_li_23289853", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "이건 진짜 번역 안해도 될듯  - dc App", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.28 15:20", "comment_id": "comment_li_23289933", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "【파유자재불】", "text": "“이른바 ‘원컨대 일체중생이 다 법신과 지혜의 몸을 성취하여 지이다.’하느니라.‘원컨대 일체중생이 고달픈 줄 모르는 몸을 얻어 금강과 같아 지이다.’하느니라.‘원컨대 일체중생이 파괴할 수 없는 몸을 얻어 상해할 이가 없어 지이다.’하느니라.”", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.28 15:21", "comment_id": "comment_li_23289982", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러8(125.130) (125.130)", "text": "원래도 병신같았는데 마왕때문에 더 병신같아졌네", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.28 15:22", "comment_id": "comment_li_23290016", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(175.205) (175.205)", "text": "아무렇지도알게 유품도둑질과 장물거래;;중세였으면 즉결처형감인데 아깝다", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.28 15:22", "comment_id": "comment_li_23290047", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "근데 상인이란게 원래 저게 정상적인거긴함상인이 양심적이고 정이많고 올바르면 아름다운 이야기는 되겠지만 상인으로서는 결국 망하는길뿐이 없지식량난때 식량을 어마어마한돈을 받아 팔아넘기는 상인은 욕을 먹겠지만 대부호가 되고전쟁때 군략물자를 팔아 전쟁을 길어지게 만드는 상인도 결과적으론 대부호가 됨.", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.28 15:23", "comment_id": "comment_li_23290074", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "상인이란게 결국은 남의 불행, 손해에서 이득을 얻어내는 존재임은 틀림 없지그렇게 부를 쌓고 선행을 배풀어가는 위선적인 인간도 있고추악하지만 그게 인간의 근간이니깐", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 15:25", "comment_id": "reply_li_23290139", "parent_comment_id": "comment_li_23290074", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "효율적인거지 정상적이라 해야되냐 그걸", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 15:26", "comment_id": "reply_li_23290230", "parent_comment_id": "comment_li_23290074", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ 상인이 효율적인걸 찾는건 정상임상인이 비효율적인짓을 하는게 비정상이고 미친놈이지상인이란게 순수 어떤의미인지 생각하면 이윤을 쫒는놈들임.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 15:29", "comment_id": "reply_li_23290320", "parent_comment_id": "comment_li_23290074", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(175.205) (175.205)", "text": "근데 이런놈은 성공전에 칼침꼿아야하는게 권력자들 상식아니냐?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 15:29", "comment_id": "reply_li_23290344", "parent_comment_id": "comment_li_23290074", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(175.205) 현실 역사에서도 이름을 날린 대부호들이 어떤 비인간적인 장사질을 했는지 보면그런 칼침을 피했기에 대부호란거지.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 15:30", "comment_id": "reply_li_23290390", "parent_comment_id": "comment_li_23290074", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "장사치가 감정보다는 이윤 추구하는 놈들인 거 누가 몰라 주인공으론 어울리지 않게 비호감으로 묘사하는 게 문제인 거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 15:31", "comment_id": "reply_li_23290399", "parent_comment_id": "comment_li_23290074", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(118.235) 당연히 이윤 추구하며 효율만을 생각하는 주인공은일반적으로 정의롭고 선하며 누구나에게 친절한 히어로를 원하는 일반적인 사람과는 다를 수 뿐이 없음애초 그럴거면 상인이 아니라 성인으로 주인공 만들어서 남들에게 헌신하는 주인공을 만들었겠지.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 15:32", "comment_id": "reply_li_23290461", "parent_comment_id": "comment_li_23290074", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(175.205) (175.205)", "text": "@ㅇㅇ 진짜 대부호라면 도둑질도 직접안하고 하청을 돌렸을것을주인공이녀석 쓰레기력에서도 밀렸군", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 15:33", "comment_id": "reply_li_23290514", "parent_comment_id": "comment_li_23290074", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(118.235) 직업에 충실한 주인공은 직업에 따라 미화하지않으면, 너무 적나라하여 호감사기가 힘듬원피스의 루피도 진짜 해적답게 주민들 다 털고 약탈하고 노예로 팔아먹는 찐해적으로 나왔으면 욕 오지게 먹었겠지결국은 미화시키는것뿐임.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 15:34", "comment_id": "reply_li_23290536", "parent_comment_id": "comment_li_23290074", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "와히라나고미", "text": "그래도 도굴이나 통념에서 벗어난 짓은 안함식량난때 식량을 비싸게 팔아버리는 건 당연하고 전쟁때 무기를 파는건 당연한거고하지만 터부를 건드는 상인은 신뢰도 없고 거기에 미친놈이라는거지도굴을 한다 불법을 저지른다 등등 이런건 정상이 아님그런 애들이 많으면 그냥 나라에 망조가 끼는거니 어느나라든 전부 법으로 금지하고 단속하는거임그냥 인간을 쥐새끼보다 아래로 생각하고 있네", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 15:34", "comment_id": "reply_li_23290546", "parent_comment_id": "comment_li_23290074", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(175.205) 주인공은 대부호가 아닌 보따리상이라서하청 돌리는 새끼가 아니니깐.그래서 저런짓해서 자본늘리는거고생각보다 합리적으로 돈을 불려나가는중이긴함", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 15:35", "comment_id": "reply_li_23290570", "parent_comment_id": "comment_li_23290074", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@와히라나고미 예의와 망자에 대한 존중을 그 무엇보다 중시하던 조선과 짱깨, 그리고 이집트등 조차도도굴을 가장 먼저 시도한건 개걸뱅이 거지새끼들이 아닌 보따리 상인들이였다", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 15:36", "comment_id": "reply_li_23290620", "parent_comment_id": "comment_li_23290074", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(115.21) (115.21)", "text": "누가 장사치가 족속이 저런 인간들인걸 모르냐 병신아.저딴걸 굳이 만화로 그리고 애니화 시키니까 불쾌하단거지; 니새끼가 뭐라도 되는것마냥 훈수 안해도 다 아는데 걍 기분이 나쁜거라고. 공감 못하겠으면 정신과 가서 싸패 감정이라도 쳐 받아보던가  근데 일본 경제 그렇게 망했냐? 뭔 맨날 미이야마니 고향최고니 이런 토나오는 자극적인 불쾌한 도파민류만 자꾸 띄우려고 하냐.먹고 살기 힘든 건 저쪽도 매한가지인가 보네", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 15:37", "comment_id": "reply_li_23290682", "parent_comment_id": "comment_li_23290074", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "와히라나고미", "text": "@ㅇㅇ 그래서 못하게 막았잖아조선에서 도굴사건 일어났을때 유럽에서 난리났었던거 처럼그냥 미친놈 취급하는게 당연하고 그런 놈들은 걸리면 엄벌가했고그렇게 따지면 마약이나 노예나 그런거 팔겠지그냥 대놓고 미친놈 사이코패스라고 나오는데 뭔 쉴드여", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 15:38", "comment_id": "reply_li_23290713", "parent_comment_id": "comment_li_23290074", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "메스이키쉐프", "text": "상인이면 최소한 겉으로는 안그런척 상대 마음 이해하는척해야죠", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 20:17", "comment_id": "reply_li_23302997", "parent_comment_id": "comment_li_23290074", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "뚜니펭귄", "text": "에초에 인간측에선 사천왕 쳐죽이고 전선 굳힌건데 그걸 질 전쟁이라 안간다 하는건 군사작전 자체를 부정하는 소리 아닌가  - dc App", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.28 19:17", "comment_id": "comment_li_23299926", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "재생산", "text": "망자의 장비를 벗겨가는 패륜적인 짓은 인간 놈들이라면 결코 하지 않을 터...", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.28 19:22", "comment_id": "comment_li_23300234", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "재생산", "text": "", "is_reply": true, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658eb247654666db6b6001f0cf3e1f5d066bd52737dccb41c4ecf584f8d82a9290a54ac188f6
