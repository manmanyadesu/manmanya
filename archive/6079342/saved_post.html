nt_li_20669314", "parent_comment_id": ""}, {"writer": "만갤러32(211.205) (211.205)", "text": "땅에 손을 대고 저 행성에 중력을 걸어버리면 세계 멸망임. 저딴 싸움이나 할때가 아님. 모험가고 지랄이고 남이고 지랄이고 그런 작은그림은멍청이임. 행성수준의중력이면 항성계규모로 끝장이 남. 인간정도가 아님 메테오수준이 아닌 저 이세계 행성계 멸망임. 당장 네가 지구의 중력을 5배로 해봐라. 태양계 멸망임", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.06 01:01", "comment_id": "comment_li_20669327", "parent_comment_id": ""}, {"writer": "ㅇㅇ(122.39) (122.39)", "text": "땅에 손을 대면 손모양 흙이나 땅 소재인 벽돌만 영향 받겠지 지구가 하나의 물체로 이루어진것도 아니고", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 06:14", "comment_id": "reply_li_20680022", "parent_comment_id": "comment_li_20669327"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "https://m.dcinside.com/board/thani/153234?page=1&recommend=1", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 08:19", "comment_id": "reply_li_20682019", "parent_comment_id": "comment_li_20669327"}, {"writer": "밀우", "text": "중력조작이라길래 블랙홀이나 뭐 시공간 조작이나 그딴거 기대한 난 병신인가", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1S000XXF1CAXg5QIZ02KDqJK-hkwiVutm", "date": "09.06 01:01", "comment_id": "comment_li_20669332", "parent_comment_id": ""}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "https://m.dcinside.com/board/thani/134370?recommend=1", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 08:19", "comment_id": "reply_li_20682018", "parent_comment_id": "comment_li_20669332"}, {"writer": "ㅇㅇ", "text": "중력.. 제어하고 싶제?", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1ktj8U69F1P6Q-5Cwua-eiyTCrw7vN8Nf", "date": "09.06 01:01", "comment_id": "comment_li_20669376", "parent_comment_id": ""}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "https://m.dcinside.com/board/thani/153629?page=3&recommend=1", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 08:19", "comment_id": "reply_li_20682014", "parent_comment_id": "comment_li_20669376"}, {"writer": "만갤러34(183.98) (183.98)", "text": 0XXF1CAXg5QIZ02KDqJK-hkwiVutm", "date": "09.06 01:11", "comment_id": "comment_li_20669845", "parent_comment_id": ""}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "https://m.dcinside.com/board/thani/153629?page=3&recommend=1", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 08:19", "comment_id": "reply_li_20682000", "parent_comment_id": "comment_li_20669845"}, {"writer": "ㅡㅡ", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/11WJWcxkiubtas9upshs6CTGeb8MHU869", "comment_img": "https://lh3.googleusercontent.com/d/1ktj8U69F1P6Q-5Cwua-eiyTCrw7vN8Nf", "date": "09.06 01:22", "comment_id": "comment_li_20670394", "parent_comment_id": ""}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "https://m.dcinside.com/board/thani/155191?page=2&recommend=1", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 08:19", "comment_id": "reply_li_20681997", "parent_comment_id": "comment_li_20670394"}, {"writer": "만갤러37(182.226) (182.226)", "text": "이해가 너무 안되는데... 그니깐 지가 닿은것에도 중력을 부여가능하니깐 평소에 나루토 록리마냥 무게추 달고 싸우다가 해제해서 속도 빠르게 하는건 이해가 됐는데. 저기 전투에서 칼을 무겁게 만든다음에 해제한게 왜 속도가 빨라지는거임?? 활시위 당기는거마냥 무거운 힘으로 움직이는걸 한순간 풀어서 더 빠르게 휘두른다 뭐 그런거여?", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.06 01:24", "comment_id": "comment_li_20670477", "parent_comment_id": ""}, {"writer": "만갤러37(182.226) (182.226)", "text": "마지막 방패는 중력 마법으로 도대체 어떻게 파이어볼을 반사 시킨거임??", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 01:26", "comment_id": "reply_li_20670546", "parent_comment_id": "comment_li_20670477"}, {"writer": "ㅇㅇ", "text": "해제해서 속도가 빨라진게 아니라, 점프해서 공중으로 뛰어 올랐는데, 거기서 갑자기 무거워 졌으니 그만큼 낙하 하는 속도가 빨라진거임.", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1ktj8U69F1P6Q-5Cwua-eiyTCrw7vN8Nf", "date": "09.06 01:27", "comment_id": "reply_li_20670571", "parent_comment_id": "comment_li_20670477"}, {"writer": "2.1배TQQQ", "text": "28짤 보면  공중에서  중력 강화시켜서 더 빠르게 추락 베기임", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1S000XXF1CAXg5QIZ02KDqJK-hkwiVutm", "date": "09.06 01:29", "comment_id": "reply_li_20670677", "parent_comment_id": "comment_li_20670477"}, {"writer": "2.1배TQQQ", "text": "마지막 패링은  그냥 방패로 튕겨낸 건데   중력 강화로  본인 몸이  파이어볼에 안 밀리게  세팅한듯?  어이 없긴 하지만", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1S000XXF1CAXg5QIZ02KDqJK-hkwiVutm", "date": "09.06 01:31", "comment_id": "reply_li_20670801", "parent_comment_id": "comment_li_20670477"}, {"writer": "만갤러36(119.197) (119.197)", "text": "방패로 파이어볼 받아치기 한건, 방패인지 팔인지 아무튼 지 몸뚱이를 무겁게 해서 파이어볼에 날라가지 않고 그대로 걍 힘으로 밀어서 던진? 뭐 그런거인듯...", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 01:32", "comment_id": "reply_li_20670859", "parent_comment_id": "comment_li_20670477"}, {"writer": "만갤러37(182.226) (182.226)", "text": "@2.1배TQQQ 그러네. 다시보니 저게 공중이었구나.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 01:41", "comment_id": "reply_li_20671302", "parent_comment_id": "comment_li_20670477"}, {"writer": "2.1배TQQQ", "text": "@만갤러37(182.226) 공중에서 내려 찍기인데   전진 베기처럼 그려서 묘사가 영 이상한 것도 맞음.  1-1 보면 공중에서 내려찍기 그리려고 한 거 맞는 것 같기는 하다만", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1S000XXF1CAXg5QIZ02KDqJK-hkwiVutm", "date": "09.06 01:42", "comment_id": "reply_li_20671345", "parent_comment_id": "comment_li_20670477"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "https://m.dcinside.com/board/thani/153234?page=1&recommend=1", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 08:19", "comment_id": "reply_li_20681991", "parent_comment_id": "comment_li_20670477"}, {"writer": "와히라나고미", "text": "작가 중력을 이해못하는거 같은데", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1S000XXF1CAXg5QIZ02KDqJK-hkwiVutm", "date": "09.06 01:34", "comment_id": "comment_li_20670945", "parent_comment_id": ""}, {"writer": "2.1배TQQQ", "text": "중력 강화 스킬만 쓸 수 있어서   중량 강화만 활용한 것 같은데 뭐가 문제임?   나중에 블랙홀 쓸 수 있나 하는 게  말이 668609", "parent_comment_id": "comment_li_20664493"}, {"writer": "ㅇㅇ(125.185) (125.185)", "text": "@2.1배TQQQ 뭔가 부분적으로 아는게 있어보이니 그냥 트램펄린 비유 한번만 보고 오면 알듯? 니가 생각하는 중력 크기만 조절한다는 거는 트램펄린을 아래로 더 땡겨지도록 하는 능력이라고 보면 됨. 그게 중력장 조작이자 시공간을 왜곡하고 있는거임.단순히 칼을 무겁게 해서 찍는 묘사면 간단하게 칼의 질량만 존나 늘렸다고 생각하는게 합리적인 추측임", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 00:48", "comment_id": "reply_li_20668730", "parent_comment_id": "comment_li_20664493"}, {"writer": "2.1배TQQQ", "text": "@뚜니펭귄 그니까 중력 조절로  중량을 조절하는 거지.  질량을 조절하는 게 아니라는 거지", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1S000XXF1CAXg5QIZ02KDqJK-hkwiVutm", "date": "09.06 00:49", "comment_id": "reply_li_20668809", "parent_comment_id": "comment_li_20664493"}, {"writer": "뚜니펭귄", "text": "@2.1배TQQQ 그걸 음질량화 시키면 수식이 박살나서 광속으로 움직일수 있다는게 이 댓글 발단임 그게 중력이든 질량이든 결국 현상은 똑같음  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1S000XXF1CAXg5QIZ02KDqJK-hkwiVutm", "date": "09.06 00:51", "comment_id": "reply_li_20668880", "parent_comment_id": "comment_li_20664493"}, {"writer": "2.1배TQQQ", "text": "블랙홀 이지랄 하려면  질량 조절 마법이어야 해서  결국은 질량 조절 마법이려나", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1S000XXF1CAXg5QIZ02KDqJK-hkwiVutm", "date": "09.06 00:51", "comment_id": "reply_li_20668888", "parent_comment_id": "comment_li_20664493"}, {"writer": "2.1배TQQQ", "text": "@뚜니펭귄 만화에서 중력마법이 질량 조절을 가능한지는 이걸 제쳐두는 게 병신 같기는 한데  원래의 논쟁인  중력 조절이 가능하면 질량 조절을 할 수 있어서 광속으로 움직일 수 있다에서  중력 상수를 변화시키는 거면  질량이랑 관계가 없는 거 아님?", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1S000XXF1CAXg5QIZ02KDqJK-hkwiVutm", "date": "09.06 01:01", "comment_id": "reply_li_20669344", "parent_comment_id": "comment_li_20664493"}, {"writer": "ㅇㅇ(125.185) (125.185)", "text": "@뚜니펭귄 근데 질량이 0이 되면 그냥 붕괴되서 뒤질뿐이잖슴... 빛의 속도가 아니라 빛이 되겠는데", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 01:01", "comment_id": "reply_li_20669349", "parent_comment_id": "comment_li_20664493"}, {"writer": "ㅇㅇ(180.233) (180.233)", "text": "@뚜니펭귄 ㄹㅇ 물리법칙 걍 좆까는 마법 같은데", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 01:42", "comment_id": "reply_li_20671313", "parent_comment_id": "comment_li_20664493"}, {"writer": "ㅇㅇ", "text": "이런건 한번에 3화까지는 올리라고 아", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1ktj8U69F1P6Q-5Cwua-eiyTCrw7vN8Nf", "date": "09.05 23:35", "comment_id": "comment_li_20664504", "parent_comment_id": ""}, {"writer": "ㅇㅇ(110.12) (110.12)", "text": "작가가 나는 특별해지고 싶으면서 날 깔보는 주위도 혼내주고 싶은데 정작 본인 머리가 나쁨 누가 봐도 개사기 능력이지만 만화 등장인물들만 쓰레기 취급하는 식의 전형적인 저능아 만화", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.05 23:40", "comment_id": "comment_li_20664781", "parent_comment_id": ""}, {"writer": "2.1배TQQQ", "text": "근데 중력 강화만  할 줄 알면  뭐 도르래 무게추 조절이랑  내려찍기 원툴 말고 뭐함?", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1S000XXF1CAXg5QIZ02KDqJK-hkwiVutm", "date": "09.05 23:41", "comment_id": "reply_li_20664838", "parent_comment_id": "comment_li_20664781"}, {"writer": "ㅇㅇ(110.12) (110.12)", "text": "당장 만화 1화에서 남들은 자기무게만 늘릴수 있는 능력인줄 아는데 주인공이 몇번 써보니 사실 내가 닿은 물건에도 적용가능함ㅋㅋ 하고 바로 좆대로좆대로 열매 해버리는거 안보임? 그냥 생각만 해봐도 닿은 물건이면 상대 무기나 옷 만져서 상대한테 중력 걸어버리는거나 마찬가지인 능력이구만", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 01:16", "comment_id": "reply_li_20670112", "parent_comment_id": "comment_li_20664781"}, {"writer": "2.1배TQQQ", "text": "@ㅇㅇ(110.12) ㅇ 그니까 최대한 활용해도 비행 못 하는 중력강화의 최대 기술은  상대방을 직접 맨손으로 만져서 중력 강화 디버프 거는 거 아님?", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1S000XXF1CAXg5QIZ02KDqJK-hkwiVutm", "date": "09.06 01:19", "comment_id": "reply_li_20670236", "parent_comment_id": "comment_li_20664781"}, {"writer": "2.1배TQQQ", "text": "공중 비행 가능하면  투척물 중량 강화로 공격할 수 있겠지만", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1S000XXF1CAXg5QIZ02KDqJK-hkwiVutm", "date": "09.06 01:20", "comment_id": "reply_li_20670281", "parent_comment_id": "comment_li_20664781"}, {"writer": "ㅇㅇ(110.12) (110.12)", "text": "그러니까 내려찍기고 염병이고 작중에서 쓰레기 스킬이라고 해놓고 주인공이 쓰니까 첫 싸움부터 주인공만 쓸 수 있는 특전 주렁주렁 달아줘서 주인공 이기게 하는거 부터가 만화가 존나 허술해 보인다고 내 몸 말고 다른것에도 중력을 걸수있는 기술이 중력 마법에는 없는데 주인공이 쓰니까 갑자기 생겼고 그걸 써서 이기고 있잖아", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 01:32", "comment_id": "reply_li_20670851", "parent_comment_id": "comment_li_20664781"}, {"writer": "2.1배TQQQ", "text": "@ㅇㅇ(110.12) 주인공 혼자서  중력 마법 성장 시키고 지랄하는 거 맞는 것 같은데,  나중에  또 중력 마법 쓰는 숨은 강자가 있다 이럴 줄 누가 아노", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1S000XXF1CAXg5QIZ02KDqJK-hkwiVutm", "date": "09.06 01:36", "comment_id": "reply_li_20671075", "parent_comment_id": "comment_li_20664781"}, {"writer": "ㅇㅇ(110.12) (110.12)", "text": "@2.1배TQQQ 중력마법 쓰는 강자가 주인공 말고 이미 있으면 중력마법이 왜 쓰레기 스킬인거임? 뭐 중력마법인게 쪽팔려서 숨기고 있었다 이딴식으로 변명하면 만화가 더 구차해지는거고 숨은 강자도 쓰는 마법이 사실 작중에서 강하다는 화염 마법이 아니라 중력 마법이면 결국 중력 마법이 쓰레기가 아니라는 소리인데", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 01:47", "comment_id": "reply_li_20671602", "parent_comment_id": "comment_li_20664781"}, {"writer": "2.1배TQQQ", "text": "@ㅇㅇ(110.12) 중력 마법은 쓰레기고   주인공은 전생 깨닫고 중력 마법 성장 시키는  특전 때문에  잡은 물체나 타인한테 중력 강화  사용 가능한 거 아님?   접촉한 물체에 중력 강하 못 쓰면 진짜 개 쓰레기 마법은 맞는 것 같은데", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1S000XXF1CAXg5QIZ02KDqJK-hkwiVutm", "date": "09.06 01:49", "comment_id": "reply_li_20671727", "parent_comment_id": "comment_li_20664781"}, {"writer": "ㅇㅇ(110.12) (110.12)", "text": "@2.1배TQQQ 그러니까 결국 주인공이 쓸때만 쓰레기 능력이 아니라 개사기 능력이 된다는게 문제라고 쓰레기 스킬 쓰는 강한 주인공을 그리고 싶었으면 만화 등장인물만이 아니라 읽는 독자들도 쓰레기라고 느끼고 그걸 활용을 잘해서 납득 가능하게 승리해야 잘 그린 만화인데 작가가 그럴 능력이 안되니까 시작부터 그 쓰레기 스킬을 주인공이 쓸때만 존나 버프해서 이런저런 추가능력 달아서 이기게 하니까 만화가 병신같다는거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 01:55", "comment_id": "reply_li_20672038", "parent_comment_id": "comment_li_20664781"}, {"writer": "만갤러38(218.235) (218.235)", "text": "단순하게 현대 지식 무쌍인거임저 세상은 중력이란 개념을 모르니 그냥 디버프처럼 보이니까 거기서 판단 종료된거지덕분에 응용할 생각도 없는 흐름인듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 01:57", "comment_id": "reply_li_20672125", "parent_comment_id": "comment_li_20664781"}, {"writer": "2.1배TQQQ", "text": "@만갤러38(218.235) 그렇게 생각하기는 좀 어려운 게   주인공이  중력 스킬인 성장시켰다는 묘사가 나오니까", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1S000XXF1CAXg5QIZ02KDqJK-hkwiVutm", "date": "09.06 01:58", "comment_id": "reply_li_20672206", "parent_comment_id": "comment_li_20664781"}, {"writer": "만갤러38(218.235) (218.235)", "text": "@2.1배TQQQ 디버프라는 인식이 없어져서 성장시킨거지 저 지식아니면 그냥 봉인행임", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 02:01", "comment_id": "reply_li_20672312", "parent_comment_id": "comment_li_20664781"}, {"writer": "ㅇㅇ(110.12) (110.12)", "text": "@ㅇㅇ(110.12) 당장 작중 캐릭터들이 중력마법을 쓰레기 스킬이라고 생각하는 이유가 자기 몸을 무겁게할뿐인 스킬이니까 쓰레기 스킬이라고 말하고 있는건데 주인공이 나 사실 내 몸에 닿은것도 스킬 적용가능함ㅋㅋ 하고 알리면 거기서부터 능력을 활용할 방법이 한두개씩 생기는거고 이런식의 만화에서 흔하게 있는 성장연출 남발해서 나중에 진짜 중력하면 생각할수 있는 서브컬쳐쪽 온갖 중력 관련 능력들 죄다 사용하면? 그걸 작중 캐릭터들이 다 알면? 그럼 그게 그때도 쓰레기 스킬일까? 주인공은 쓰레기 스킬을 요령좋게 활용해서 사기 스킬들 가진 강자들 상대로 무쌍하는게 아니라 자기만 개사기 스킬써서 양학하는 개초딩 새끼가 될 뿐인데", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 02:10", "comment_id": "reply_li_20672762", "parent_comment_id": "comment_li_20664781"}, {"writer": "2.1배TQQQ", "text": "멍청한 마법이라 불린 마법사는 중력 마법으로 무쌍한다 ~아직 중력의 개념이 없는 세꼐에서, 소년은 만유인력의 왕이 된다!~ノロマ魔法と呼ばれた魔法使いは重力魔法で無双する ➰まだ重力の概念のない世界にて、少年は万有引力の王となる➰   어이가 없노  중력이라는 단어는 있는데  개념은 없다 ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1S000XXF1CAXg5QIZ02KDqJK-hkwiVutm", "date": "09.06 02:12", "comment_id": "reply_li_20672898", "parent_comment_id": "comment_li_20664781"}, {"writer": "ㅇㅇ(110.12) (110.12)", "text": "@ㅇㅇ(110.12) 작가는 결국 자캐딸 친다는 소리는 듣기 싫은데 자캐딸 안 치고 만화 재밌게 만들 실력은 없으니 작중 엑스트라들 입으로 쓰레기 스킬이라며 눈가리고 아웅하면서 실제론 만화에서 제일 쎈 능력을 주인공한테 줘서 자캐딸을 시키고 있을 뿐임", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 02:18", "comment_id": "reply_li_20673216", "parent_comment_id": "comment_li_20664781"}, {"writer": "2.1배TQQQ", "text": "@ㅇㅇ(110.12) 근데 주인공처럼  타 생명체 만져서 중력 강화 디버프 걸 수 있는 건   뭐  대형 몬스터  디버프 싸개 아님?", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1S000XXF1CAXg5QIZ02KDqJK-hkwiVutm", "date": "09.06 02:21", "comment_id": "reply_li_20673382", "parent_comment_id": "comment_li_20664781"}, {"writer": "2.1배TQQQ", "text": "이런 걸로 어떤 무리수 전투 방식으로  좋은 스킬이라고 묘사할지 궁금한데", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1S000XXF1CAXg5QIZ02KDqJK-hkwiVutm", "date": "09.06 02:23", "comment_id": "reply_li_20673460", "parent_comment_id": "comment_li_20664781"}, {"writer": "ㅇㅇ(110.12) (110.12)", "text": "@2.1배TQQQ 시발 원문 검색해서 웹소설 봤더니 바로 경감 마법 배워서 10미터 점프해버리네 애미ㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 02:25", "comment_id": "reply_li_20673549", "parent_comment_id": "comment_li_20664781"}, {"writer": "2.1배TQQQ", "text": "@ㅇㅇ(110.12) 방어구 경감해서 차고 다니나 ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1S000XXF1CAXg5QIZ02KDqJK-hkwiVutm", "date": "09.06 02:26", "comment_id": "reply_li_20673611", "parent_comment_id": "comment_li_20664781"}, {"writer": "ㅇㅇ(110.12) (110.12)", "text": "@2.1배TQQQ 442화 마지막 마법 「아, 그대로다. 이것이 로키, 너를 쓰러뜨리는 유일한 방법이다」「그런, 뭐, 그런, 구슬 하나로…그렇게 로키가 대마법의 공포를 끌어당긴다.로키는 가무자라로 달려왔다. 레바테인을 휘두르고, 「아아아아아아아아아아!」라고 웅장한 곰팡이를 올리면서, 나에게 토도메를 물린다.하지만 더 이상 승부는 이미 정해져 있었다.「대마법, 마이크로 블랙홀」나는 중얼거린다.\"타겟: 라그나로크\"―――그 한마디로, 모두는 결했다.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.06 02:27", "comment_id": "reply_li_20673661", "parent_comment_id": "comment_li_20664781"}, {"writer": "2.1배TQQQ", "text": "", "is_reply": true, "dccon": "https://lh3.googleusercontent.com/d/1cOmSdT60k4Ky63kLTQv20yJzNj4s3jPp", "comment_img": "https://lh3.googleusercontent.com/d/1S000XXF1CAXg5QIZ p(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
