omment_img": "", "date": "10.19 02:16", "comment_id": "reply_li_22869187", "parent_comment_id": "comment_li_22868107", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.235) (211.235)", "text": "@ㅇㅇ 여주 이 십새키가 ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.19 02:16", "comment_id": "reply_li_22869206", "parent_comment_id": "comment_li_22868107", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(211.235) 여주는 뭐.. 자기가 걸레짓한거 인정하고 헤어질 마음으로 떠난 거 남주가 붙든거긴 함 ㅋㅋㅋ 남주는 자기 좋다는 회사동료처녀도 마다하고 걸레 찾아간거니 남주도 씹병신이지", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.19 02:17", "comment_id": "reply_li_22869226", "parent_comment_id": "comment_li_22868107", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.235) (211.235)", "text": "@ㅇㅇ ㄷㄷ", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.19 02:17", "comment_id": "reply_li_22869232", "parent_comment_id": "comment_li_22868107", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "고등어춉", "text": "@ㅇㅇ 근데 순정만화나 보지년들 하는 소리만 봐도 보지년들은 바람피고 오는 게 질투심유발 정도의 간단한 일이라고 생각하는 거 같더라그래서 순정만화보면 여주가 남주두고 서브남주랑 떡치고 오는 전개 존나ㅏㅏㅏㅏ게 많음 그냥", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.19 02:29", "comment_id": "reply_li_22869621", "parent_comment_id": "comment_li_22868107", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ 맞다 남주 자기 좋다는 회사동료처녀가 맘에 들었는데. 걔랑 떡치고 걔랑 결혼하지 했던 생각이", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.19 03:10", "comment_id": "reply_li_22871091", "parent_comment_id": "comment_li_22868107", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(220.87) (220.87)", "text": "@ㅇㅇ(211.235) 예전 작품이라 포장되지 요즘같은데서 보면 걍 흔한 걸레년 퐁퐁물임", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.19 03:26", "comment_id"
