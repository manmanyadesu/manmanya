8aa3f62b8ab8f0b6c8193d3f5e658d0b193614f08853a1a8a18daec697847f", "comment_img": "", "date": "11.14 23:10", "comment_id": "comment_li_24090203", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658ee216e02f8d81f28ae23382fce9b5d5eba58528c524a8aa3f62b8ab8f0b6c8193d3f5e658d0b193614f08853a1a8a18daec697847f", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "10년동안 부장주도로 기업이 새로 만든 브랜드가 성공하고 외부, 내부 평가가 좀 갈리긴 해도 안정적인 흑자인거 같은데 그런 사람이 저런 행동을 하는 이유가 라이벌을 짓밟는 것 이라는 감정론적인 부분 이외는 설명이 안되네", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 23:17", "comment_id": "comment_li_24090505", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(58.231) (58.231)", "text": "보면 신멘테이에서는 오히려 대중화가 잘 되어 있어 남녀 상관 없이 손님이 많이 보임.특히 세리자와 일행이 먹고 나서 맛있게 먹는 장면을 클로즈업 해서 의식 시켜 보여줌.그리고 그건 '시장'이랑도 맞는 상황임. 장사가 잘 된다는 거.'팔리기만 하면 그만'이라는 세리자와의 말은 '지금 현상'을 부정할 수 없다는 말임.세리자와 및 일행은 분명 먹고나서 정말로 맛이 없다는 제스쳐를 세번 연속 보여주고, 직접 말로도 품질이 형편없다고 언급까지 함.세리자와는 미식만 즐기면서 무조건 최고급이 아니면 맛없다고 말하는 사람이 아님. 호리데이의 탕면도 크게 맛있다고 하지는 않으면서도 맛있게 먹을 정도로 본인이 맛있으면 맛있다고 하고 맛없으면 맛없다고 분명히 생각을 가지고 있음.", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 23:21", "comment_id": "comment_li_24090665", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(58.231) (58.231)", "text": "세리자와가 아마 145화에서 말하려고 했던거는 시장에 대해서 말하려고 했던 것 같음.백종원도 확장 계속하면서 점포 마구 늘려갔을때 더본코리아 자체는 식당자체도 좋은평가를 받고 더본코리아의(비상장이었지만) 가치도 높다고 생각되었음.근데 확장으로 체급만 문어발식으로 마구 전문성 없이 늘려가는 행동에는 분명 한계가 있을거임. 10년동안 계속 늘려나가면 일단 체급 자체는 분명히 커지고 있었을거고.근데 그런 방식으로 커지는 회사에는 분명 한계가 온다는걸 세리자와도 알고 있을거라고 봄.그리고 아마 재무쪽에서 정말 많이 버는가도 모르겠음. 츠케지로의 집 보면 본인 뇌피셜로는 세리자와가 라면 세그릇 먹을 동안 앞에 자리에 있는 손님 일행은 가지도 않았고, 오히려 손님 풀을 보면 여자가 한명도 안보임.", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 23:27", "comment_id": "reply_li_24090913", "parent_comment_id": "comment_li_24090665", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(58.231) (58.231)", "text": "@ㅇㅇ(58.231) 따라서 부정적인 가설로는 일단 10년동안 늘려나가는거랑 별개로 츠케지로의 집은 이 계집이 미는거고, 자기가 미는게 잘나간다는걸 강조하려고 온갖 수 (SNS, 쿠폰, 손님 매수 등) 일단 손님 자체를 끌어모으고 있다고 봄. 긍정적인 가설로는 생긴지 얼마 안된 식당에, 여러 계열의 손님을 다 모을 수 있고, 가격대가 맞아서 현재 위치가 좋은 장소가 되었다는 거임. 그래서 잘 나가고 있다는거. 근데 신멘테이가 현재 차지하고 있는 위치는 오히려 인력을 다 구해놓아서 굳이 손 댈 필요 없고, 이미 손님층(남녀노소 및 원하는 퀄리티)이 두터워서 굳이 점포 하나 테스트를 성공했다고 리스크를 감수하면서 진행할 필요가 없어보임. 레버리지로 100만원넣고 200만원이 되었다고 전재산을 다 쳐박을 이유는 없음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 23:33", "comment_id": "reply_li_24091173", "parent_comment_id": "comment_li_24090665", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(58.231) (58.231)", "text": "@ㅇㅇ(58.231) 미슐랭은 아니더라도 타베로그 한 3.4정도 되는 식당에서 2.5점정도 나오는 식당으로 8개 점포를 전부 바꾼다고 손님이 거기로 몰릴까도 의문.세리자와가 말하는건 계집이 하는게 어떤 방식이든 흥하고 있으면 맛과 상관 없이 지적할 만한게 없기 때문이라 그냥 어쩔 수 없다 하고 실적을 인정해주는 거 같음.(안경들썩)", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 23:35", "comment_id": "reply_li_24091301", "parent_comment_id": "comment_li_24090665", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러31(211.173) (211.173)", "text": "146어디감", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 23:30", "comment_id": "comment_li_24091053", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "138 139 145 제발", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.15 00:15", "comment_id": "comment_li_24093143", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(61.84) (61.84)", "text": "존나 하극상 한거지 ㅋㅋ 자기가 스탠드플레이 해서 임원승진 하면 현직 이사는 임원 계약 2년주기에 맞춰서 퇴진할테니까 그렇게 따지면 둘은 경쟁자인거지 상사 부하 관계가 더이상 아님", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.15 00:38", "comment_id": "comment_ ment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "니 직장 남초임? 사무실에 계집 두세마리만 있어도 비슷한꼴 자주보게될거다", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 20:28", "comment_id": "reply_li_24083030", "parent_comment_id": "comment_li_24071863", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(58.225) (58.225)", "text": "아아 그것이 보지다", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 20:40", "comment_id": "reply_li_24083499", "parent_comment_id": "comment_li_24071863", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.171) (121.171)", "text": "저래도 용서받는게 보지의 힘임", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 20:47", "comment_id": "reply_li_24083786", "parent_comment_id": "comment_li_24071863", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "고증입니다만", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 20:47", "comment_id": "reply_li_24083791", "parent_comment_id": "comment_li_24071863", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러21(49.164) (49.164)", "text": "실적 좀 쌓았다고 꺼드럭대는거지. 길게는 못갈듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 20:57", "comment_id": "reply_li_24084277", "parent_comment_id": "comment_li_24071863", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(58.29) (58.29)", "text": "여자들 원래저럼", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 21:00", "comment_id": "reply_li_24084363", "parent_comment_id": "comment_li_24071863", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러23(211.234) (211.234)", "text": "얘 여자랑 사회생활 안해봤나보네ㅋㅋ애기노ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 21:02", "comment_id": "reply_li_24084457", "parent_comment_id": "comment_li_24071863", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러24(61.255) (61.255)", "text": "핏콩엄마는 개념인이잖음 실력도 있고 실적도 있고 승부에 승복도 하고 핏콩 잘 부탁한다고 인사도 했는데", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 21:03", "comment_id": "reply_li_24084522", "parent_comment_id": "comment_li_24071863", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(175.212) (175.212)", "text": "실제로 연대본부에서 끽해야 중사 따리 밖에 안 되는 보지년이 정보과나 작전과의 중령 이상 과장들한테 대놓고 개지랄 떨고 기싸움 쳐하는데 진짜 살면서 그런 한녀무브를 생전 처음 봐서 놀랍고 그걸 또 군대에서 장성급한테 ㅈㄹ하는 거에 또 기겁했는데, 이년이 단지 '여자' 이 이유 하나만으로 유야무야 넘어가더라 직장이나 군대라고 해도 안하무인으로 구는 병신 보지년들은 ㄹㅇ 존재함", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 21:06", "comment_id": "reply_li_24084661", "parent_comment_id": "comment_li_24071863", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.142) (121.142)", "text": "그것이 '여자'니까...", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 21:34", "comment_id": "reply_li_24085970", "parent_comment_id": "comment_li_24071863", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@만갤러24(61.255) 빗콩엄마 입장도 이해할만게 씹앨리트 교육 쑤셔박아서 좆사기캐릭 만들어 놨더니 꼴랑 라면이나 쳐만들거라고 하니 개빡칠만함하버드나 아이비리그 나와서 공사장 노가다나 한다니까ㅅㅂ ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 23:24", "comment_id": "reply_li_24090780", "parent_comment_id": "comment_li_24071863", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "개돼지인생", "text": "@만갤러5(59.6) 면신강림 존나 오랜만에 듣네ㅋㅋㅋㅋㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.15 10:45", "comment_id": "reply_li_24107410", "parent_comment_id": "comment_li_24071863", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅁㅇ", "text": "재미써", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 15:45", "comment_id": "comment
