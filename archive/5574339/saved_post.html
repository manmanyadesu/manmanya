중생이 선하고 깨끗한 말로 장엄한 모양을 얻어 갖가지 무진한 변재를 구족하여 지이다.’하느니라.”", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1aD3oXQ2vO_QRcURpsbwBcyhI_6H2CXX4", "date": "08.02 10:45", "comment_id": "comment_li_18917133", "parent_comment_id": ""}, {"writer": "만갤러14(175.211) (175.211)", "text": "마무리는 딱히 별 의미가 없네 의미적으로 서사의 연장선에 있는것도 아니고 그냥 대충 이렇게 끝내버리자 하고 끝낸 느낌인데", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.02 10:49", "comment_id": "comment_li_18917248", "parent_comment_id": ""}, {"writer": "호시노히나타", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1MuwaBHXwXtCDmrIV6E3fGsU3qlbXgoVj", "comment_img": "https://lh3.googleusercontent.com/d/1aD3oXQ2vO_QRcURpsbwBcyhI_6H2CXX4", "date": "08.02 10:55", "comment_id": "comment_li_18917425", "parent_comment_id": ""}, {"writer": "ㅇㅇ(211.241) (211.241)", "text": "분명 처음에 의도하고 그릴려했던 죽음하고 달라진거 맞음ㅋㅋㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.02 10:55", "comment_id": "comment_li_18917447", "parent_comment_id": ""}, {"writer": "새벽에글쓰다가", "text": "처음은 뭐였는데?", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1aD3oXQ2vO_QRcURpsbwBcyhI_6H2CXX4", "date": "08.02 10:58", "comment_id": "reply_li_18917519", "parent_comment_id": "comment_li_18917447"}, {"writer": "만갤러16(220.94) (220.94)", "text": "그런것같긴함 분명 남자한테 감금 살해 느낌이었는데", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.02 11:00", "comment_id": "reply_li_18917588", "parent_comment_id": "comment_li_18917447"}, {"writer": "ㅇㅇ", "text": "마무리는 그냥 똥만화네", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/17gt7rXu38akgtHimUalTEGoMC6JiNfPt", "date": "08.02 11:00", "comment_id": "comment_li_18917575", "parent_comment_id": ""}, {"writer": "ㅇㅇ(211.229) (211.229)", "text": "작가새끼 장애인으로 돈번다고 공격받으니까 시골공격하는걸로 시선돌리는게 아주 고수임 ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.02 11:01", "comment_id": "comment_li_18917605", "parent_comment_id": ""}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
