마다", "text": "먹을만하네요", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 11:55", "comment_id": "comment_li_24617385", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러26(210.178) (210.178)", "text": "다른사람은 다 잊어버리는데 왜 저 두명은 치사토에 대해 기억함? 설마 그게 버려질때 근처에 있었던 사람들은 구멍의 효과에 해당안된다는 편리한 설정은 아니겠지?", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 11:58", "comment_id": "comment_li_24617525", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(115.138) (115.138)", "text": "처음에 봉투버릴때 나중에온 남쫀딩은 기억 못하는거보면 편리한 설정이 맞음 ㅇㅇ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 12:04", "comment_id": "reply_li_24617763", "parent_comment_id": "comment_li_24617525", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러27(182.226) (182.226)", "text": "아직까지는 버려지는걸 본 사람들은 잊지않는다. 이런식으로 넘어갈수있긴함.", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 12:19", "comment_id": "reply_li_24618556", "parent_comment_id": "comment_li_24617525", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러28(112.151) (112.151)", "text": "봉투도 버린 사람은 기억하고 있잖아", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 12:30", "comment_id": "reply_li_24619069", "parent_comment_id": "comment_li_24617525", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "버리는걸 직접본사람만 기억하는듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 12:49", "comment_id": "reply_li_24619928", "parent_comment_id": "comment_li_24617525", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러31(1.243) (1.243)", "text": "만화에 대놓고 설정 나오잖아1. 아쿠타가 잠깐 찾으러 구멍 근처에서 떠난 상태에서 아쿠타 돈가방이 구멍으로 떨어지면 -> 아쿠타는 기억 못 함2. 아쿠타 보는 앞에서 쫀딩녀 구멍으로 떨어지면 -> 아쿠타는 기억 함3. 주인공은 두 번 다 구멍 앞에서 봤으니까 -> 주인공은 둘 다 기억함", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 13:00", "comment_id": "reply_li_24620282", "parent_comment_id": "comment_li_24617525", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러31(1.243) (1.243)", "text": "돈가방 떨어지고 아쿠타가 잊는 장면이 괜히 들어간 줄 아냐 설정 소개하려고 나오는거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 13:00", "comment_id": "reply_li_24620310", "parent_comment_id": "comment_li_24617525", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러31(1.243) (1.243)", "text": "편리한 설정이라는 건 이야기 중간에 후출로 내미는 걸 말하는거고이거는 그냥 구멍 소개 장면부터 저런 식의 룰이라는 걸 알려주는 거고 이 룰이 작품 끝날 때까지 안 변하면 아무 문제 없음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 13:05", "comment_id": "reply_li_24620450", "parent_comment_id": "comment_li_24617525", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러31(1.243) (1.243)", "text": "편리한 설정이라는 건처음에 트림을 해야 마법을 쓸 수 있다고 소개해놓고주인공이 재갈을 물고 있어서 마법을 못 쓸 때후속으로 사실 트림을 하는 것만이 아니라 방귀를 뀌어도 마법을 쓸 수 있다고 하면서 이야기 전개하는 걸 말하는거지처음부터 끝까지 트림으로만 마법을 쓰게 하는 건 정석적인 설정이지", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 13:09", "comment_id": "reply_li_24620610", "parent_comment_id": "comment_li_24617525", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러31(1.243) (1.243)", "text": "치사토는 걍 룰 소개하려고 등장시켜 죽인 튜토리얼 캐릭터인거고", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 13:10", "comment_id": "reply_li_24620657", "parent_comment_id": "comment_li_24617525", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러40(1.229) (1.229)", "text": "", "is_reply": true, "dccon": "https://dcimg4.dcinside.co.kr/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658eb2078908a53e2e6161ff134594b016c60b62ffb03340fe3601e080358723f6a214f6032d41af640bad92e40ff2701d4be5916976578d3", "comment_img": "", "date"
