comment_li_19546143"}, {"writer": "ㅇㅇ", "text": "ㅎㄷㄷㄷㄷㄷ", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1_Ufi_hIZUJN49mnhwgeRJvEczJCd73kx", "date": "08.15 03:49", "comment_id": "comment_li_19546158", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/15sGF6StA6JH9-PqIe9D3xmcIxh8oZZIN", "comment_img": "https://lh3.googleusercontent.com/d/1_Ufi_hIZUJN49mnhwgeRJvEczJCd73kx", "date": "08.15 03:49", "comment_id": "comment_li_19546170", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "디자이너랑 만난거 맞구만 그래서 포기한 디자이너들 구슬려서 한 번만 더 리셋해달라고 한 거고", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1_Ufi_hIZUJN49mnhwgeRJvEczJCd73kx", "date": "08.15 03:55", "comment_id": "comment_li_19546330", "parent_comment_id": ""}, {"writer": "요하임", "text": "이제 디자이너가 시간돌려서 첫 유령 없애는거야?", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1iYVLTcS9BoAxfSVUCMfYGAfWWvugDB5q", "date": "08.15 03:56", "comment_id": "comment_li_19546355", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "첫 유령이 존재하는 한 디자이너가 아무리 리셋해도 최악의 미래가 나온다잖아 그래서 지가 유령 없앨테니까 자기 믿고 리셋해보라고 하는거고", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1_Ufi_hIZUJN49mnhwgeRJvEczJCd73kx", "date": "08.15 04:00", "comment_id": "reply_li_19546486", "parent_comment_id": "comment_li_19546355"}, {"writer": "ㅇㅇ", "text": "그래서 디자이너는 아무리 리셋을 해도 개지랄나고 발굴을 통해 자기 존재까지 퍼져나가니까 활동 정지하고 이번엔 걍 소멸하는 거 두고 보려고 했는데 유메가 쇼부본거임 ㅇㅇ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1_Ufi_hIZUJN49mnhwgeRJvEczJCd73kx", "date": "08.15 04:02", "comment_id": "reply_li_19546538", "parent_comment_id": "comment_li_19546355"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ 근데 디자이너는 리셋에 리스크없음?", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1_Ufi_hIZUJN49mnhwgeRJvEczJCd73kx", "date": "08.15 04:04", "comment_id": "reply ndingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
