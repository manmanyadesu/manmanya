mment_id": "comment_li_21476805", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1XklgEqiGcCWYMdWaor9Itol7qZLm1Wkh", "comment_img": "https://lh3.googleusercontent.com/d/1bEGM4Q9nrFwGpZ3Kv--rEBxM0kmmjq8-", "date": "09.22 06:11", "comment_id": "comment_li_21476982", "parent_comment_id": ""}, {"writer": "데드리퍼", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1LIxBNerv5zWOqsqDirDzWvSikAj2dAZK", "comment_img": "https://lh3.googleusercontent.com/d/1-VjNyhuWyyrnk9CqTHdO1I6MVYU061ED", "date": "09.22 06:23", "comment_id": "comment_li_21477103", "parent_comment_id": ""}, {"writer": "ㅇㅇ(61.84) (61.84)", "text": "애비가 죽인듯", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.22 06:33", "comment_id": "comment_li_21477202", "parent_comment_id": ""}, {"writer": "ㅇㅇ(175.223) (175.223)", "text": "", "is_reply": true, "dccon": "https://lh3.googleusercontent.com/d/1jQqv_Fh2pkbVdtRlPgsSNAZV5a6CANlL", "comment_img": "", "date": "09.22 12:33", "comment_id": "reply_li_21487198", "parent_comment_id": "comment_li_21477202"}, {"writer": "ㅇㅇ", "text": "왔구나 내 야동", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1bEGM4Q9nrFwGpZ3Kv--rEBxM0kmmjq8-", "date": "09.22 06:37", "comment_id": "comment_li_21477245", "parent_comment_id": ""}, {"writer": "ㅇㅇ(175.126) (175.126)", "text": "정작 저런 경우에는 진짜 말도 안되는 재능의 벽을 목도하고 절망하는 경우가 많음. 나도 어릴적 작가가 되겠다는 꿈을 가슴에 품고 온갖 글쓰기 대회와 백일장에 글을 써내곤 했고, 그래도 약간의 재주가 있었는지 중학교때는 운문분야에서 최우수상, 대상을 받은 적도 있었고 고등학교때도 큰 대회에서 가작 등을 타내는 일도 꽤 많았었음. 그러다 고2때 나갔던 중앙대 백일장에서 가작을 타내고 돌아오던 길에 대상을 탄 이의 글을 우연히 읽게 되었는데, 다음날부터 나는 펜을 꺾고 입시 준비를 하기 시작했었음.", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.22 06:37", "comment_id": "comment_li_21477250", "parent_comment_id": ""}, {"writer": "ㅇㅇ(175.126) (175.126)", "text": "얄팍한 재능이라는게 얼마나 잔인한 일인지 아냐? 차라리 그 재능이 공부 재능이라서 인서울 대학 끄트머리 학과를 핥을 정도라면 먹고사는데 많은 도움이 되겠지만, 초등학교때부터 글을 쓰겠다고 마음먹게 한 내 그 얄팍한 재능은 앞서 말했던 대상을 탔던 놈의 글 앞에서 산산히 무너져 내리고 말았음...그 글을 읽고 난 내게 물어봤음. 내가 과연 평생을 작문에 모든 것을 쏟아 붓는다 해도 저정도의 글을 쓸 수 있느냐? 내가 내린 결론은 아니다였음. 심지어 이미 등단한 기성 작가의 글도 아닌, 나와 같은 동년배가 써냈던 그 글은 작가가 되겠다고 한 길을 걸어왔던 내 인생을 부정하는 정도의 충격을 줄 정도였으니...", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.22 06:40", "comment_id": "reply_li_21477289", "parent_comment_id": "comment_li_21477250"}, {"writer": "ㅇㅇ(175.126) (175.126)", "text": "어찌보면 그때 그 말도 안되는 거대한 벽 앞에서 가로막혀, 뒤늦게 고2때라도 입시준비를 해서 대학이라도 간 것을 난 다행이라고 생각하고 있음. 만약 내가 그때 '그래도 내가 끊임없이 남은 기간 동안 내 글솜씨를 연마하면 그래도 부딪혀볼만하지 않을까?'라는 망상이나 헛된 희망따위에 사로잡혀 그대로 글쓰기 전형에 관련된 입시를 준비했더라면 바닥조차 보이지 않는 나락으로 가라앉아 버렸을거라 생각하거든. 이 만화 보면서 댓글들을 보면 '했제?'하면서 만화 속 주인공의 말을 따라하며 비아냥대는 사람들을 많이 보곤 하는데, 어릴때 그래도 주변의 칭찬이나 몇번의 입상경험등을 통해 공부 이외의 한 길을 걸어봤던 사람들이라면 이 만화 마냥 웃으면서 볼수만을 없을거라 생각함", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.22 06:42", "comment_id": "reply_li_21477328", "parent_comment_id": "comment_li_21477250"}, {"writer": "ㅇㅇ(175.126) (175.126)", "text": "냉혹하게 지금 내 라인업에 걸친 라이벌들과의 격차를 손수 저울질해주면서 '넌 할 수 있다'라는 무책임한 격려보다는 '솔직히 말해서 네가 전심전력을 다한다 한들, 될 수 있을거라고 생각하지 않는다'라고 선을 그어주고 다른 길을 터주는 어른이 제대로 된 어른인거임. 부모님은 날 믿었고, 학교 선생님들은 그래도 입상을 해 오는 날 보며 어렴풋이 '넌 되겠지'라며 등을 떠밀어주었지만 진짜 저런 선생님을 만나 겨울바람마냥 차가운 현실을 목도해주게끔 해주는 선생님을 일찍 만났더라면 나도 입시준비를 더 일찍 시작해 보다 나은 대학을 가지 않았을까 하는 상상도 이 만화를 보면서 하게 되더라...", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.22 06:45", "comment_id": "reply_li_21477357", "parent_comment_id": "comment_li_21477250"}, {"writer": "ㅇㅇ(175.126) (175.126)", "text": "@ㅇㅇ 미국까지 가서 박사과정 밟을정도면 그나마 다행인거라고 본다. 어설프게 예체능계로 들어서서 '언젠간 그래도 성공하겠지'라고 자위하면서 인생과 시간, 돈, 노력을 허비하며 자신과 주변을 좀먹으며 망가져가는 사람들이 이 세상에는 굉장히 많거든", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.22 06:46", "comment_id": "reply_li_21477376", "parent_comment_id": "comment_li_21477250"}, {"writer": "ㅇㅇ(175.126) (175.126)", "text": "@ㅇㅇ 그 타이틀이라도 가질 수 있음에 감사하게 생각하셈 ㅋㅋㅋ 취업시장에서 '신춘문예에 도전했던 자', '학창시절 입상을 밥먹듯이 했던 자' 이런놈들과 비교했을때 적어도 넌 물질적인 타이틀이라도 남잖아?", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.22 06:48", "comment_id": "reply_li_21477412", "parent_comment_id": "comment_li_21477250"}, {"writer": "ㅇㅇ(211.51) (211.51)", "text": "@ㅇㅇ(175.126) 농담아니고 취업시장에선 신춘문예에 도전했던 자가 나을 수도 있음...", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.22 07:08", "comment_id": "reply_li_21477732", "parent_comment_id": "comment_li_21477250"}, {"writer": "만갤러6(220.77) (220.77)", "text": "그렇지 저게 끝이아니라 시작점이니까", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.22 07:15", "comment_id": "reply_li_21477893", "parent_comment_id": "comment_li_21477250"}, {"writer": "ㅇㅇ", "text": "얄팍한 재능ㄹㅇ..", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1bEGM4Q9nrFwGpZ3Kv--rEBxM0kmmjq8-", "date": "09.22 07:30", "comment_id": "reply_li_21478207", "parent_comment_id": "comment_li_21477250"}, {"writer": "Serh", "text": "나도대충얘랑같은생각인데 무슨 진로상담때선생때문에인생조진거같은댓글들 존나 많음", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1-VjNyhuWyyrnk9CqTHdO1I6MVYU061ED", "date": "09.22 07:33", "comment_id": "reply_li_21478278", "parent_comment_id": "comment_li_21477250"}, {"writer": "ㅇㅇ(211.234) (211.234)", "text": "잘 꺾었다. 댓글조차 읽기 싫은게 딱 잘접었네", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.22 07:35", "comment_id": "reply_li_21478317", "parent_comment_id": "comment_li_21477250"}, {"writer": "Serh", "text": "@ㅇㅇ(175.126) 반고닉ㅇㅇ는그래도 학위도움되는쪽재능이니 박사과정까지간거지 예체능같은 문존나좁은쪽애들은 막히는순간 낭떠러지야 아무것도 안 남아", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1-VjNyhuWyyrnk9CqTHdO1I6MVYU061ED", "date": "09.22 07:35", "comment_id": "reply_li_21478330", "parent_comment_id": "comment_li_21477250"}, {"writer": "만갤러9(220.79) (220.79)", "text": "사실 여기서 가장 웃긴 부분은 그 대상 타는 애 수준도 뻔하다는 거지어릴때는 그게 엄청난 차이처럼 보이지만 커서 보면 별거 아닌 수준이라는거어릴때 가장 끔찍한 건 정확한 판단이 어렵다는 거다그래서 부모의 말을 따라가게 되는데 그게 자기 성향과 어긋나는 순간 인생 쳇바퀴 되는 거지재능보다 성향을 확실하게 파악하는게 중요함", "is_reply": true, "dccon": "", "comment_img": "", "date": urn `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
