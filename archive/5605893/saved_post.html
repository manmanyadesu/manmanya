6:02", "comment_id": "reply_li_19017251", "parent_comment_id": "comment_li_19014353"}, {"writer": "ㅇㅇ", "text": "근데 1억 나오는건 존나 웃기긴하네 ㅋㅋ 진지하게 저렇게 인터넷으로 볼수있는거 아니면 조회수 100 아래로 나올텐데", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Jd_82dehTkSvxQq0bGBqv_l8xYzPhcYM", "date": "08.04 14:40", "comment_id": "comment_li_19014420", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "인기없는 비주류 만화들은", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Jd_82dehTkSvxQq0bGBqv_l8xYzPhcYM", "date": "08.04 14:41", "comment_id": "reply_li_19014441", "parent_comment_id": "comment_li_19014420"}, {"writer": "ㅇㅇ", "text": "고향최고가 아니라 고소최고노 ㅋㅋㅋㅋㅋㅋㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Jd_82dehTkSvxQq0bGBqv_l8xYzPhcYM", "date": "08.04 14:41", "comment_id": "comment_li_19014446", "parent_comment_id": ""}, {"writer": "미네랄캐기", "text": "ㅋㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1K4mQYj5xQSys4WVRrU3Ukw3SeLDk6Mq7", "date": "08.04 14:47", "comment_id": "reply_li_19014626", "parent_comment_id": "comment_li_19014446"}, {"writer": "ㅇㅇ(180.233) (180.233)", "text": "우덜식 판결 레전드노 ㅈㄴ 웃기네 그래 불법번역 당연히 유죄지 근데 배상액 산출하는게 좆병신같네?", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.04 14:42", "comment_id": "comment_li_19014460", "parent_comment_id": ""}, {"writer": "(전)일본외노자", "text": "좆미씹디어 미래의 수익원 확보ㅋㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1K4mQYj5xQSys4WVRrU3Ukw3SeLDk6Mq7", "date": "08.04 14:42", "comment_id": "comment_li_19014466", "parent_comment_id": ""}, {"writer": "떠허ㅓ", "text": "근데 고향최고는 작가가 트위터에 무료로 올리는 만화잖음 그럼 그거 스샷 찍어서 올리는 것도 불법임?", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1K4mQYj5xQSys4WVRrU3Ukw3SeLDk6Mq7", "date": "08.04 14:45", "comment_id": "comment_li_19014565", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "불법은 맞음 저작권 침해라서", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Jd_82dehTkSvxQq0bGBqv_l8xYzPhcYM", "date": "08.04 14:46", "comment_id": "reply_li_19014616", "parent_comment_id": "comment_li_19014565"}, {"writer": "ㅇㅇ", "text": "작가나 작가가 속한 출판사에서 올리는건 되고, 남들이 퍼가서 올리는건 원칙적으로 안되는데 올린다고 해서 바로 벌금내거나 하는건 아니고 보통 저작권이나 판권 가진쪽이 사이트에 내려달라고 요청하면 내려감. 올리고 거기에 +로 영리적 이익까지 취하면 빼박 불법이고.", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Jd_82dehTkSvxQq0bGBqv_l8xYzPhcYM", "date": "08.04 14:48", "comment_id": "reply_li_19014670", "parent_comment_id": "comment_li_19014565"}, {"writer": "ㅇㅇ", "text": "보통 스샷 찍은거 트위터에 올리거나 한다고 문제는 안되는데 그건 저작권 고소를 판권 가진쪽만 할수있는거라서 작가나 출판사가 고소 안하고 냅두면 걍 문제없는거임", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Jd_82dehTkSvxQq0bGBqv_l8xYzPhcYM", "date": "08.04 14:49", "comment_id": "reply_li_19014722", "parent_comment_id": "comment_li_19014565"}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "그래서 딱히 영리적 이익이 없는 만갤에 올릴땐 내리라고 경고만 했는데 거기에 대응이랍시고 한게 영리적 이익을 추구하는 거대 불법 만화 사이트 마나토끼에 납품이라는 악수중의 최악수를 둠 + 그걸 또 자백하는 글을 고닉으로 당당하게 싸지름", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.04 15:50", "comment_id": "reply_li_19016801", "parent_comment_id": "comment_li_19014565"}, {"writer": "ㅇㅇ(211.59) (211.59)", "text": "엄밀히 말하면 모든 저작물은 원작자의 허가 없이 무단으로 전재해도 안 되고, 번역해도 안됨", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.04 16:05", "comment_id": "reply_li_19017338", "parent_comment_id": "comment_li_19014565"}, {"writer": "ㅇㅇ(218.237) (218.237)", "text": "걍 판권 얻어서 고소금으로 씹덕들 돈뜯어먹을려는 속셈이지 뭐", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.04 14:45", "comment_id": "comment_li_19014571", "parent_comment_id": ""}, {"writer": "만갤러16(220.80) (220.80)", "text": "박사장 수하 문상받고 일하다가 1억 물게 생겼네 ㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.04 14:45", "comment_id": "comment_li_19014586", "parent_comment_id": ""}, {"writer": "만갤러34(59.22) (59.22)", "text": "걔들 겨우 문상 받고 번역함? ㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.04 16:37", "comment_id": "reply_li_19018646", "parent_comment_id": "comment_li_19014586"}, {"writer": "ㅇㅇ(110.9) (110.9)", "text": "배상액이 조회수 기준이면 불법사이트에 새로고침 주작기 심어서 조회수 100억회로 만들면 100억 명이 봤을 만화가 되니까 배상액도 수백억원 되는거야 그럼?", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.04 14:46", "comment_id": "comment_li_19014597", "parent_comment_id": ""}, {"writer": "만붕이(222.118) (222.118)", "text": "번역하는애들도 만갤이나 토끼에서 반응보고 결정할것같은데 ㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.04 14:46", "comment_id": "comment_li_19014598", "parent_comment_id": ""}, {"writer": "ㅇㅇ(117.111) (117.111)", "text": "애초에 번역쪽 판결은 ㅂㅅ 같았음 망가번역이 5년처음 나오고 당황했으니", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.04 14:46", "comment_id": "comment_li_19014603", "parent_comment_id": ""}, {"writer": "Allusion", "text": "걍 말도안되는 똥고집 부리다가 인실좆 당한거노", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1K4mQYj5xQSys4WVRrU3Ukw3SeLDk6Mq7", "date": "08.04 14:48", "comment_id": "comment_li_19014658", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "대체 뭘 어케 읽어야 그딴 결론이 나옴?", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Jd_82dehTkSvxQq0bGBqv_l8xYzPhcYM", "date": "08.04 14:50", "comment_id": "reply_li_19014750", "parent_comment_id": "comment_li_19014658"}, {"writer": "Allusion", "text": "@ㅇㅇ 니같이 장애인마냥 안읽으면?", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1K4mQYj5xQSys4WVRrU3Ukw3SeLDk6Mq7", "date": "08.04 14:52", "comment_id": "reply_li_19014839", "parent_comment_id": "comment_li_19014658"}, {"writer": "ㅇㅇ", "text": "@Allusion 장애아 새끼가 긁혔노 ㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Jd_82dehTkSvxQq0bGBqv_l8xYzPhcYM", "date": "08.04 15:17", "comment_id": "reply_li_19015690", "parent_comment_id": "comment_li_19014658"}, {"writer": "Allusion", "text": "@ㅇㅇ '팬심이었고 수익을 안얻었으니 문제 없다' 면서 글 안내리고 박사장 손 잡았다고 쎙깐건데 대체 닌 어떻게 해석했길래 지랄인거냐 경계선 지능장애라서 글도 못읽음?", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1K4mQYj5xQSys4WVRrU3Ukw3SeLDk6Mq7", "date": "08.04 15:21", "comment_id": "reply_li_19015864", "parent_comment_id": "comment_li_19014658"}, {"writer": "Allusion", "text": "@ㅇㅇ 걍 찢재명 지지하는 영포티 새끼였노 병신새끼ㅋㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1K4mQYj5xQSys4WVRrU3Ukw3SeLDk6Mq7", "date": "08.04 15:24", "comment_id": "reply_li_19015953", "parent_comment_id": "comment_li_19014658"}, {"writer": "ㅇㅇ", "text": "@Allusion 글 안내리고 생깐게 아니고 고소받고 판사한테 앙망문 쓸때 '팬심으로 쓴거고 수익 안얻었으니 한번만 봐주십시오' 한거지 븅신련아 진짜 저능아새끼임?", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Jd_82dehTkSvxQq0bGBqv_l8xYzPhcYM", "date": "08.04 15:24", "comment_id": "reply_li_19015956", "parent_comment_id": "comment_li_19014658"}, {"writer": "ㅇㅇ", "text": "@Allusion 뭔씨발 저능아 같은 소리하는 새끼 지적하면 다 찢 지지하는 영포티노? 진짜 씨벌 ㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Jd_82dehTkSvxQq0bGBqv_l8xYzPhcYM", "date": "08.04 15:25", "comment_id": "reply_li_19015979", "parent_comment_id": "comment_li_19014658"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ 본문에는 번역글 안내렸다는것도, 박사장 손잡았다고 생깠다는 문장도 단 한줄도 안적혀있는데 창조독해 ㅆㅅㅌㅊ ㅋㅋㅋㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Jd_82dehTkSvxQq0bGBqv_l8xYzPhcYM", "date": "08.04 15:26", "comment_id": "reply_li_19016019", "parent_comment_id": "comment_li_19014658"}, {"writer": "Allusion", "text": "@ㅇㅇ 병신아 느그 방명록이나 관리해ㅋㅋㅋ 영포티라서 관리도 못하나 그리고 글에 대놓고 출판사에서 경고 했는데도 씹고 박사방한테 번역본 넘겼다고 써져있는데 지좆대로 해석하노 장애련ㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1K4mQYj5xQSys4WVRrU3Ukw3SeLDk6Mq7", "date": "08.04 15:27", "comment_id": "reply_li_19016051", "parent_comment_id": "comment_li_19014658"}, {"writer": "Allusion", "t oup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
