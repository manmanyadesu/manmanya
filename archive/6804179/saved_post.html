ccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "Embrio", "text": "", "is_reply": false, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65beb246e0af265a9272ccd69ef875fda83c65de9f2b3484ec5ff9efe79a4fa2d2aaa1069c39d7b939b27", "comment_img": "", "date": "10.26 05:28", "comment_id": "comment_li_23182597", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65beb246e0af265a9272ccd69ef875fda83c65de9f2b3484ec5ff9efe79a4fa2d2aaa1069c39d7b939b27", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "근데 진지하게 학원 얘기 빼도 되는 거 아님?제자한테서 도망 다니면서 여행 다니다가 지팡이 제작 - 학원 선생 - 지팡이 제작 인데결국 지팡이 만들 거면 학원 이야기가 엮일 필요가 있음?학원 올거면 지팡이 제작 영감 얻으려고 학원 오면 된 거 아님?지팡이 이야기 오래 끌기도 힘드니 대충 몇화 차력쇼로 끌다가 끝내고 학원 온 계기로 학원 선생 되면다크 엘프가 어떤 사람인지, 무슨 과거가 있는지 등을 초반부로 깊게 풀어내고 학원으로 1장 시작하면 되는데 왜 이따위로 한 거임?심지어 작화 차력쇼로 독자가 초반 이탈할 이유도 없음 오히려 주인공에 좀 더 깊은 매력을 느끼게 되겠지", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.26 05:38", "comment_id": "comment_li_23182734", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "지팡이 제작 - 잘 안됨, 영감 얻으러 제자 인맥 통해서 학원 방문 - 이번 화 처럼 진행, 영감 얻음 - 학원 선생 스카웃, 지팡이 제작이 우선이라 안된다고 함 - 제작하는 거 지켜보면서 어떤 사람인지 파악(불사조 나오는 화를 좀 더 정상적으로) - 스카웃 결정, 지팡이 완성 - 주인공에 대한 설명은 끝내고 학원 선생으로 스토리 진행존나 당연한걸 왜 이상하게 만드는 거냐", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.26 05:43", "comment_id": "reply_li_23182809", "parent_comment_id": "comment_li_23182734", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러31(125.142) (125.142)", "text": "가슴이없네", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.26 11:32", "comment_id": "comment_li_23190169", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(119.42) (11
