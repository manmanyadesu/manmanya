on": 2}, {"writer": "ㅇㅇ(218.55) (218.55)", "text": "예술가가 되고싶었으나 되지못한 노력가가 범재에게 허용된 최대한의 노력끝에예술이라는 망토를 짜내기에 이르렀으나 그것을 두르고 펼쳐보인 왜소한 유아기의 꿈 같은 만화", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.30 10:35", "comment_id": "comment_li_20330272", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "석상같은거 존내 잘 그리네", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1wK9IBt8kbIXFSQvxEPSoUeHNbI5yXnLP", "date": "08.30 10:57", "comment_id": "comment_li_20330822", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "starbucks", "text": "그림만 에쁜 노잼", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1_SCHhjixEcho3aNeX2A4ZU5MCMyblUzb", "date": "08.30 11:00", "comment_id": "comment_li_20330912", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러24(220.65) (220.65)", "text": "도서관의 대마법사랑 장단점이 비슷할듯", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.30 11:03", "comment_id": "comment_li_20331013", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.38) (223.38)", "text": "다들 도파민에 절여졌나", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.30 11:04", "comment_id": "comment_li_20331035", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러25(39.114) (39.114)", "text": "일단 스토리를 쓰려면 쓸 수는 있을거 같긴 함. 대전쟁의 원인이라던지, 과거 주인공의 실력 잘 보여주는 에피소드라던지, 제자랑 주인공이랑 만났던 에피소드라던지, 아니면 뻔하지만 클래식한, 대전쟁을 일으킨 악당들이 백년만에 다시 활동 시작하면서 시리어스로 간다던지. 근데 이 만화는 이미 다 끝난 뒤의 이야기를 하니까 자극적인 스토리 같은건 안나올거 같고, 그래서 슴슴해서 재미가 없는거 같음. 마치 다 비어버린 가스통 같이.", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.30 11:04", "comment_id": "comment_li_20331063", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러25(39.114) (39.114)", "text": "근데, 다른 만화도 이런 유사한게 있긴 함. 대마왕 토벌 후의 이야기라던지, 엔딩 이후의 잔잔한 이야기라던지. 다른 만화도 도파민 없는 유사한 만화도 많음. 근데 그런 만화들은 그래도 목적이 있음. 뭐 세계를 돌아다니면서 정화한다던지, 애프터 케어한다던지, 그동안 갔던곳을 다시 간다던지 이런 목적이. 근데 이 만화는 주인공이 말하듯 \"목적이 없음\" 그냥 주인공이 그동안 마나가 있어서 무시했던걸 이제는 마나 없는 관점에서 새롭게 본다. 이게 목적이긴 한데, 큰 목적이 없음. 그래서 중구난방하다고 보임. 지팡이 만들다가 제자 봤다가 갑자기 뭐 싸웠다가..... 안그래도 슴슴한데 큰 뼈대가 없어서 뭐 하고싶은지도 모르겠어서 독자들이 따라가지 않는거일지도...", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 11:06", "comment_id": "reply_li_20331124", "parent_comment_id": "comment_li_20331063", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "머꼬이거", "text": "여기 댓글중 잘 긁은거 모아서 작가한테 보여주면 어떤 반응이 나올지 와쿠와쿠수루죠  - dc App", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1wK9IBt8kbIXFSQvxEPSoUeHNbI5yXnLP", "date": "08.30 11:08", "comment_id": "comment_li_20331181", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "Seo", "text": "이래서마나가오링났구나", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1_SCHhjixEcho3aNeX2A4ZU5MCMyblUzb", "date": "08.30 11:14", "comment_id": "comment_li_20331375", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "얘는 프리렌을 하고 싶은지선생물을 하고 싶은지 뒤죽박죽이네매 화마다 만화가 달라지는 느낌", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1wK9IBt8kbIXFSQvxEPSoUeHNbI5yXnLP", "date": "08.30 11:19", "comment_id": "comment_li_20331569", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(1.240) (1.240)", "text": "진짜 그림하난 좆되는데 내용이 너무", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.30 12:19", "comment_id": "comment_li_20333385", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "음냐요즘할게없어", "text": "스토리가 나쁜건아닌데 작화를 못따라오네  - d _comment_id": "comment_li_20316016", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(180.70) (180.70)", "text": "@ㅇㅇ(119.198) 왜화남.이만화가 내용없고 노잼이라고 하는게 욕할일임?", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 01:20", "comment_id": "reply_li_20316240", "parent_comment_id": "comment_li_20316016", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.235) (211.235)", "text": "솔직히 이세계물이나 만들어야 하는 수준의 만력으로 되도않는 물건 만들어서 폭망중이라는 느낌이 강함근데 아무것도 모르겠다나 이 만화 같은것도 가끔은 있어도 되지 않나 싶기도 하고 그러네", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 01:25", "comment_id": "reply_li_20316479", "parent_comment_id": "comment_li_20316016", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(180.70) (180.70)", "text": "스토리도 맛없음.걍 주인공 시험한다고 하고 대장장이로 변신하고, 그걸로는 안찼는지 본래모습을 드러내고 말하던 중 작위적으로 발생한 재앙. 학원측은 그 재앙을 어쩔 수 없이 죽이려고 하지만 주인공 '내가 하지' 재앙인줄 알았던 놈도 그냥 화살뽑고 오구오구 하고 살고 여기도 폐허됬나 했더니 하필 학원의짱이 '회복의 마법사' 자연까지 회복가능해서 모든게 완벽하게 커버됨. 자~ 한텀 끝났으니 목욕씬한번 보여주고요~ 힘 빡주고 봐라~~~~주인공에 감정이입을 절대 못하겠음.존나 완전무결하고 이상적인 성격으로 학원좆될뻔한 상황에서 서서 내가 해볼게 와쟈쟈자쟈자잣~ 아팠지~ 문제해결~이거뿐만 아니라 그냥 사소하게 나오는 대화에서도 '난 이상적인 선생이라 진심으로 내제자들이 강인한마법사가되길바라는성품을가지고있당께요", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 01:36", "comment_id": "reply_li_20317023", "parent_comment_id": "comment_li_20316016", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "뭔 말인지 알거 같음 평화로운 세상에 이미 이룰거 다 이뤘다고 주변에서 빨아대는 인물이 자기 혼자 눈알 반짝이면서 소년만화 주인공처럼 구니까 유난 그럽고 근들갑처럼 느껴짐 비슷하게 호들갑 존나 떠는게 도서관의 대마술사인데 거긴 그래도 계속 긴장감을 던져주는데 이건 호들갑만 남은 느낌", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.30 01:36", "comment_id": "reply_li_20317045", "parent_comment_id": "comment_li_20316016", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(118.235) 보지들끼리 너잘났어 아냐 니가잘났어 하면서 빨아대는거 보는거같음", "is_reply": true,
