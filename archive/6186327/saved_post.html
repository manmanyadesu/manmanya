229"}, {"writer": "ㅇㅇ(124.53) (124.53)", "text": "@만갤러23(220.118) 선생이 말하는 \"이상의 자기\"를 아버지가 늘 말하던 \"대기업의 성공한 기관사\"에서, 본인이 기관사가 된 계기인 \"나에게 인사해줬던 여유로운 시골 기관사\"로 수정한 거임.그래서 언제 선로에 사람이 들어올지 몰라 잠도 못 드는 예민한 성격의 \"현실의 자기\"와 균형을 맞출 수 있었던 거고선생이 내준 답은 여러 형태의 기관사중 나와 맞는걸 고민하고 선택하란거", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.13 22:00", "comment_id": "reply_li_21046602", "parent_comment_id": "comment_li_21045229"}, {"writer": "ㅇㅇ(58.231) (58.231)", "text": "만붕이새끼덜 뭐에 이래 심술이나서 좆됐노 좆됐노 하는거냐 성우편이야 비처녀 때문에라도 그러려니 하는데 ㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.13 21:57", "comment_id": "comment_li_21046469", "parent_comment_id": ""}, {"writer": "만갤러26(221.162) (221.162)", "text": "ㄹㅇ 무슨 심보인지 모르겠음좀 안쓰러움", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.13 22:48", "comment_id": "reply_li_21049062", "parent_comment_id": "comment_li_21046469"}, {"writer": "ㅇㅇ(182.227) (182.227)", "text": "인생에 답은 없더라 오히려 우직하게 버텨서 병신된 케이스가 나임진작 도망가고 회피했으면 이렇게 ㅈ박진 않았을텐데", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.13 22:45", "comment_id": "comment_li_21048898", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "어떻게 병신됏냐 함 썰풀어봐라 들어보자  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1ctzUmVJ-afrZ4bNYJoE0mUEA1FxyhDUX", "date": "09.13 23:08", "comment_id": "reply_li_21050155", "parent_comment_id": "comment_li_21048898"}, {"writer": "ㅇㅇ(175.121) (175.121)", "text": "앰생들 많이 긁히나보네 ㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.13 23:17", "comment_id": "comment_li_21050659", "parent_comment_id": ""}, {"writer": "ㅁㄴㅇㄹ(210.106) (210.106)", "text": "학생들 공평하게 조져줬던 절망선생님 그립습니다...  - dc App", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.13 23:48", "comment_id": "comment_li_21052149", "parent_comment_id": ""}, {"writer": "만갤러29(220.84) (220.84)", "text": "결국 패배자들 얘기 다루는 거니까 선생이 말하는 \"일반\"이 결과론적으로 참이 되는 건 어쩔 수 없는 절대력이긴 함 빨리 동창회에서 뭐 하는지랑 선생 과거나 풀었으면 좋겠네", "is_  메시지지이번 에피는 평양냉면처럼 슴슴한 맛이긴 하네", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1x__3-QLYsuNlShMyGK3qh-R26wVyXMUY", "date": "09.13 18:03", "comment_id": "reply_li_21035756", "parent_comment_id": "comment_li_21033678"}, {"writer": "ㅇㅇ", "text": "트라우마를 극복한다는건 그걸 잊고 완전히 벗어던진다는 의미가 아님. 트라우마를 안고 있음에도 불구하고 그 고통과 타협하며 사회에 합류할 수 있도록 노력하는 걸 의미함. 타협하는 방식은 누구나 다양한 법이고 이에 맞춰 선택하는 것도 개인에게 달려있음. 누군 더 나아보일 수 있겠지만 어느 쪽이든 트라우마를 극복한건 마찬가지임.", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1ctzUmVJ-afrZ4bNYJoE0mUEA1FxyhDUX", "date": "09.13 18:18", "comment_id": "reply_li_21036379", "parent_comment_id": "comment_li_21033678"}, {"writer": "만갤러7(221.146) (221.146)", "text": "만화에서말하고싶은게 회피도 한가지 방법이란거임 피한다고 도망치는게아님.시간이지나서 다시 돌아보면 받아들일수있는일이될수도있으니까", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.13 18:37", "comment_id": "reply_li_21037242", "parent_comment_id": "comment_li_21033678"}, {"writer": "YHWACH", "text": "도망치는건 부끄럽지만 도움이 되니까요", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1x__3-QLYsuNlShMyGK3qh-R26wVyXMUY", "date": "09.13 18:52", "comment_id": "reply_li_21037930", "parent_comment_id": "comment_li_21033678"}, {"writer": "ㅇㅇ(218.39) (218.39)", "text": "왜 극복해야하는데?", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.13 19:25", "comment_id": "reply_li_21039196", "parent_comment_id": "comment_li_21033678"}, {"writer": "ㅇㅇ", "text": "여유있게 운전하고싶었는데 도쿄노선 뺑뺑돌고있으면 ㄹㅇ 5초도 낭비못하는 삶이라고 함 그 두가지는 다름 '같은 철도 기관사'로 볼 수 없음조종사도 마찬가지임. 대한항공가서 유럽도 가고 중동도 가고 하면 스탑오버나 한 달 근무가 여유넘치는데저비용항공사 조종사는 하루에4번 까지도 뛰기도 하고 (부산서울부산서울) 아니면 일본갔다가 바로 한국돌아와서 제주김포노선 한번 더 뛰거나 이럼사는게 다른거임 같은 일을 한다고 다 같은 삶이 아님", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1ctzUmVJ-afrZ4bNYJoE0mUEA1FxyhDUX", "date": "09.13 19:37", "comment_id": "reply_li_21039756", "parent_comment_id": "comment_li_21033678"}, {"writer": "ㅇㅇ(119.203) (119.203)", "text": "좆간 치는 빈도는 수십 수백배 내려갈거라 운만 좀 좋으면 꿈도 아님", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.13 19:41", "comment_id": "reply_li_21039942", "parent_comment_id": "comment_li_21033678"}, {"writer": "ㄴㄴ(112.172) (112.172)", "text": "참 이런애들이 문제야 저게 왜 회피라는 거냐?상처 극복의 한 방법이라는 생각은 1도 못하니까 자살률 1위 사회의 오명을 못 벗어나는거다 ㅉㅉ", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.13 19:55", "comment_id": "reply_li_21040588", "parent_comment_id": "comment_li_21033678"}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
