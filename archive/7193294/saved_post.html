 "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(175.203) (175.203)", "text": "https://rookie.shonenjump.com/series/zGZPbQ86a78컷배분 좋아서 구글번역기로도 대충 이해가능함", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.22 02:10", "comment_id": "reply_li_24444924", "parent_comment_id": "comment_li_24444396", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러15(39.125) (39.125)", "text": "@ㅇㅇ(175.203) 근데 나도 구글번역기로 살짝 읽다가 그래도 번역 몰아서 보는게 훨씬 몰입 잘돼서 일부러 안보는중", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.22 02:13", "comment_id": "reply_li_24445052", "parent_comment_id": "comment_li_24444396", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "이거 때문에 니트한테 관심가지겠네 영입하려고 할 수도 있고  - dc App", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.22 02:00", "comment_id": "comment_li_24444449", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "실제로 모죠가 말하는 연격형보다 한 방 중시하는 주인공 말이 맞긴함. 과거 라그나로크 생던에서 아수라패황권 몽크 없으면 사냥이 안됐음", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.22 02:01", "comment_id": "comment_li_24444502", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "봄봄봄폭탄", "text": "몰아서 한방에 쓸어담기라도 했음?", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.22 02:02", "comment_id": "reply_li_24444532", "parent_comment_id": "comment_li_24444502", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "근데 현실패치당한 이세계에서 큰거 한방 싸고 드르렁하는 아수라몽크는 너무 하이리스크 아님?같이 던전 들어간 파티가 통수칠 수도 있고 보스잡았는데 연속으로 전투가 이어질 수도 있는데 오래 싸울수록 스텟뻥 받는 연격이 생존하긴 더 나을듯?  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.22 02:05", "comment_id": "reply_li_24444648", "parent_comment_id": "comment_li_24444502", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@봄봄봄폭탄 당시 파티 구성이 나머지 파티원은 몽크 힘 실어주는 버퍼들+원거리 몹 저격하는 원딜 구성이었음생체던전은 근접몹 하나가 보스도 아닌데 정공법으로 맞서면 문자 그대로 전멸 수준이었음. 그래서 탱커가 근접형 몹 한마리 골라서 데려오면 한 방 강력한 몽크가 잡는 식으로 진행됨. 원딜은 대기하다가 원거리 몹 오면 저격하는 식. 얘들도 접근 전 사망하는 수준으로 강력했는데 그나마 얘들은 피통 낮아서 원딜로 화력 집중해서 잡음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.22 02:07", "comment_id": "reply_li_24444781", "parent_comment_id": "comment_li_24444502", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "게임 측면에선 파티플이 기본인 아수라몽크가 맞긴 하지다만 저기는 게임이 아닌 현실이니 연격이 맞는거고고용", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.22 02:08", "comment_id": "reply_li_24444805", "parent_comment_id": "comment_li_24444502", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "생던 처음 나왔을땐 진짜 조나 셌었지", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.22 02:08", "comment_id": "reply_li_24444837", "parent_comment_id": "comment_li_24444502", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ 혼자 솔플이나 현실처럼 생존하면 님 말도 맞음. 다만 상위로 올라가면 솔플로 잡을 수 있는 보스는 없고 패널티도 파티원으로 커버되니까 참고로 아까 말한 생던에서 연격형은 파티 자체가 안됐음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.22 02:10", "comment_id": "reply_li_24444920", "parent_comment_id": "comment_li_24444502", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러23(221.146) (221.146)", "text": "오오...실제 게임했던 사람들 증언좋네...", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.22 02:10", "comment_id": "reply_li_24444932", "parent_comment_id": "comment_li_24444502", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(106.101) ㅇㅇ 맞는 말임. 결국 솔플/파티 차이인데 진짜 목숨 걸린 현실적인 측면을 고려하면 연격형도 틀리지 않은듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.22 02:11", "comment_id": "reply_li_24444954", "parent_comment_id": "comment_li_24444502", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@봄봄봄폭탄 아수라패황권은 한 마리 존나 씨발 개쎄게 패는 스킬이고, 광역기가 아님그때 생던은 몹 하나하나가 유저들보다 훨씬 세고 살짝 과장하서 필드 보스급이었으니까 진짜 레이드 하는 기분으로 잡았어야 했었음로드나이트 세이렌, 어쌔신 크로스 에레메스, 하이 위저드 카트린느, 스나이퍼 세실, 화이트 스미스 하워드, 하이프리스트 마가레타 이렇게가 끝이었나?아 존나 추억이네 시계탑에서 파이어월 세로깔기로 몹잡던 기억이라거나 알람? 클락? 둘다 였던가? 뭐 그런 거 잡고 그랬었는데미믹\u003c 이 씨발련 오면 파리의 날개로 존나 튀고", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.22 02:18", "comment_id": "reply_li_24445314", "parent_comment_id": "comment_li_24444502", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ 무슨 책 날아다니는 새끼도 요주의라 위험했떤 거로 기억하고", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.22 02:20", "comment_id": "reply_li_24445406", "parent_comment_id": "comment_li_24444502", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ 하이위저드 의상 너무 예뻐서 짤 찾아보고 했었는데 추억이네 라그 온라인이 나를 씹덕으로 만들었었고솔직히 지금 봐도 캐릭터들 다 존나 귀엽고 예쁘고", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.22 02:22", "comment_id": "reply_li_24445519", "parent_comment_id": "comment_li_24444502", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "봄봄봄폭탄", "text": "", "is_reply": false, "dccon": "https://dcimg4.dcinside.co.kr/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65def246efb6df28dd4e36f7d0634ac3154e62f4064c2dea4045f6771305dc04b31a81adedcf85d9cafa9489a9df9b7ae16f85c7ea9d5712e", "comment_img": "", "date": "11.22 02:01", "comment_id": "comment_li_24444516", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65def246efb6df28dd4e36f7d0634ac3154e62f4064c2dea4045f6771305dc04b31a81adedcf85d9cafa9489a9df9b7ae16f85c7ea9d5712e", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ"
