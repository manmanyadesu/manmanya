 "comment_id": "reply_li_21453516", "parent_comment_id": "comment_li_21446503"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(1.239) 애초에 학교 자퇴한다고 좆되는거도 딱히 없음... 검고봐서 졸업장 따면 그만이고 대학교 다 잘가더만 오히려 요즘엔 최상위권들이 자퇴한다더만 ㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1PW6E8J_6_8uqEWQcHBItR2QWFgRtMK77", "date": "09.21 20:56", "comment_id": "reply_li_21458840", "parent_comment_id": "comment_li_21446503"}, {"writer": "댓글돌이", "text": "", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1CjAVxubc-s_afFa-3C9ODjX9Kh5ijmwn", "date": "", "comment_id": "comment_li_0", "parent_comment_id": ""}, {"writer": "푸슈", "text": "저렇게 대가리 맞으면서 큰 쾌감느꼈을듯 했제 저새기", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1PW6E8J_6_8uqEWQcHBItR2QWFgRtMK77", "date": "09.21 16:19", "comment_id": "comment_li_21446573", "parent_comment_id": ""}, {"writer": "만갤러19(59.166) (59.166)", "text": "했제 시동 부릉부릉 ㅋㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.21 16:26", "comment_id": "comment_li_21446860", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "에휴 씨발 설마 피아노 재능 애매한 새끼한테 '넌 할수있어!' 했다가 애가 인생 날리고 재능 벽느껴서 살자했다고 저의 과오 ㅇㅈㄹ 하는건가??", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1PW6E8J_6_8uqEWQcHBItR2QWFgRtMK77", "date": "09.21 16:27", "comment_id": "comment_li_21446921", "parent_comment_id": ""}, {"writer": "ㅇㅇ(112.162) (112.162)", "text": "바람을 좀 세게 넣었으면 과오 맞지", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 17:43", "comment_id": "reply_li_21450109", "parent_comment_id": "comment_li_21446921"}, {"writer": "만갤러23(211.36) (211.36)", "text": "어느징도 쎄게 얘기하는거 나쁟지않다고 본다 경험상  - dc App", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.21 17:20", "comment_id": "comment_li_21449103", "parent_comment_id": ""}, {"writer": "연애서큘레이션", "text": "애들 또 화났네 교사가 하는말은 딱 2가지밖에없는데 꿈을 향해갈거면 리스크를 알고 가라 해보고 안되면 적당한곳에서 손절쳐라이거 2가지 하고 별말 안하잖아 어짜피 다 나이먹으면 깨우치는 내용이지만 애새끼들은 아직 모르니까 알려줘야지 취미가 직업이되면 하기싫은거 해야하는거 애들은 모르잖아 예체능같은거 세상엔 천외천 진짜 말이안되는 괴물들이 있고 그 괴물들도 힘든세상인데 그거 애들이 모르잖아 그거 알려주는게 뭐가문제야그리고 대안은 무슨대안? 인생에대한 대안이어딨어 조언만 가능하지 진로는 본인이 정해야지 미정편에서 알려주잖아 서점가서 진로에대해 생각해보라고 조언만 해주잖아 그리고 알아보고 왔으니 좆같은 직업 골라도 별말 안하잖아  - dc App", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1QOeNV428HiSV5nME5Vngba0wO-jRkB02", "date": "09.21 17:26", "comment_id": "comment_li_21449330", "parent_comment_id": ""}, {"writer": "ㅇㅇ(210.222) (210.222)", "text": "선생이라고 그 수많은 사회경험 다 해본게 아니고 선생도 결국 교대 나와서 교직생활밖에 안해본 사람인데 그 분야에 열정가진 학생이 열심히 한번 해보자고 도전하는거 옆에서 초치니까 뭔가 띠껍잖음 그렇다고 뭐 현실적으로 조언 잘해서 애들 인생망하는거 잘 막은거도 아니고 다 망한뒤에 했제질만 해대니", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 17:39", "comment_id": "reply_li_21449898", "parent_comment_id": "comment_li_21449330"}, {"writer": "ㅇㅇ", "text": "화는 너가 젤 많이 난 거 같은데...", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1PW6E8J_6_8uqEWQcHBItR2QWFgRtMK77", "date": "09.21 17:40", "comment_id": "reply_li_21449935", "parent_comment_id": "comment_li_21449330"}, {"writer": "연애서큘레이션", "text": "@ㅇㅇ(210.222) 현실적인 조언을 못해주지 선생따위가 현직에 있는 시니어들 한테 가서 인터뷰를 해야 진짜 현실적인 조언을 해주지 선생이 알아봐야 그냥 일반인들이 조금 조사하면 알수있는정도의 내용밖에 모르지  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1QOeNV428HiSV5nME5Vngba0wO-jRkB02", "date": "09.21 17:41", "comment_id": "reply_li_21450008", "parent_comment_id": "comment_li_21449330"}, {"writer": "만갤러25(218.101) (218.101)", "text": "@연애서큘레이션 이게 저 선생의 문제는 뭐냐면자기 피아노 길 가려 했는데 망했어제자 피아노 길 밀어줬는데 망했어이래서 모든 놈 발목 잡는다 이걸로 이어졌다는 거임막말로 지가 인생에서 성공한 것도 아닌 그냥 실패한 병신이고, 다른 학생들도 그거 다 알아서 비웃어거기다가 대고 넌!!! 꿈을 버려라!! 하면 뭘로 느껴지겠냐?저새끼 지 인생 망했다고 트롤링 뒤지게 하다가 망한 놈 앞에 나타나서 티배깅하네 ㅉㅉ 이거밖에 나올말이 없다고순전히 개인적 트라우마를 이유로 제자들한테 저주을 퍼붓는 병신이야 그냥", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 17:45", "comment_id": "reply_li_21450189", "parent_comment_id": "comment_li_21449330"}, {"writer": "만갤러25(218.101) (218.101)", "text": "@연애서큘레이션 드라이하게 현실적인 이야기, 장단점 다 알려주고 스스로 판단하게 하면 끝이야근데 지가 뭔데 억지로 꿈을 부수고, 전교생 다 보는데서 꿈은!!! 저주입니다!!! ㅇㅈㄹ 함정신병자야 그냥실패와 실패 속에서 정병 얻어와서 남에게 화풀이하는, 나는 틀리지 않았어, 꿈을 가졌기 때문에 나와 키노시타는 실패한 거야 라는 아집을 가지고 있단 거지여기서 혹여나 꿈을 이루는 놈이 나오면 자기 신념-꿈은 저주다- 가 붕괴해버리니 자기를 지키려고 자퇴서 내고 나가는 놈 쫓아가서 피싼 거란 말임", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 17:47", "comment_id": "reply_li_21450308", "parent_comment_id": "comment_li_21449330"}, {"writer": "만갤러25(218.101) (218.101)", "text": "@연애서큘레이션 진작에 저 선생이 정병짓한 것에 대한 문제점이 조명 되고 치료의 기미가 보였어야했지만30화에서 폭발함여태까지 했제? 로 티배깅 존나 먹이며 안전하게 뒤에서 안심하던 놈이 진짜 재능을 만나니까 필사적이 되어서 저주를 퍼부음왜냐? 자기 신념 꿈은 저주다 이게 무너질 거같으니까그러나 작품 전체적으로 보면 이제와서 성장시킨다고? 하고 어이가 없는 거지포기 시킨 놈이 여태 계속 있었는데, 그게 작가의 정답인척을 했는데, 이제와서 정병짓을 조명한다고? 그럼 그전에 걔들은 뭔데? 이렇게 되는 거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 17:51", "comment_id": "reply_li_21450450", "parent_comment_id": "comment_li_21449330"}, {"writer": "연애서큘레이션", "text": "@만갤러25(218.101) 장점은 학생이 이미 잘알고있으니 그길을 고른거고 단점은 장점의뒤에숨어서 안보이는 단점들을 일부 알려준것뿐 그러고 검토를 하라고한거지 전교생 다보는 앞에서 꿈은 저주 입니다 이지랄한건 개병신맞긴함 솔직히 졸업 10개월 남았는데 자퇴하겠다고 하는거보면 선생입장에선 답답하잖아  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1QOeNV428HiSV5nME5Vngba0wO-jRkB02", "date": "09.21 17:51", "comment_id": "reply_li_21450465", "parent_comment_id": "comment_li_21449330"}, {"writer": "만갤러25(218.101) (218.101)", "text": "@연애서큘레이션 그렇다고 해서 일부러 부정적인 면만 알려줘서 그 대학을 가려는 애를 포기시킬 필요는 없지그건 진로담당의 역할이 아님지가 뭔데 남의 인생을 좌지우지하려고 함?지가 실패로부터 못일어나니까 '나는 맞아, 이게 맞아, 꿈은 저주야', '니들이 가지는 꿈은 다 틀렸어' 하고 자기 긍정감 얻으려고 오지랖 펼쳐가며 피싸고 다니는 것이 여태까지의 요약이야학생을 위한 것이 아닌 철저하게 자기 개인을 지키기 위한 개씹새끼였단 거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 17:55", "comment_id": "reply_li_21450637", "parent_comment_id": "comment_li_21449330"}, {"writer": "만갤러25(218.101) (218.101)", "text": "@연애서큘레이션 그리고 출석일수 따져서 타협안 만들 수도 있었을텐데 그런 묘사가 전무하지 학생을 생각하는 놈이 아니기 때문임", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 17:56", "comment_id": "reply_li_21450681", "parent_comment_id": "comment_li_21449330"}, {"writer": "연애서큘레이션", "text": "@만갤러25(218.101) 진로담당의 역할이뭔데 한국에서 현실의 진로담당은 그냥 입시알려주는 사람이잖아그리고 좌지우지 한적이없잖아 그냥 옆에서 단점만 읊어서 검토하라고했지 검토가 반려와 같은게 아니잖아 진짜 좌지우지 하는건 댓글에서 대안 달라고 울부짖는애들이지 대안 주는거 자체가 좌지우지 하는거지 머리가 꽃밭인걸 잠깐 현실의 구렁텅이로 끌고오는 역할만 하잖아 물론 선생이 하는꼬라지가 아집도 있고 자기긍정감 얻으려고 하는것도 있긴한거같음  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1QOeNV428HiSV5nME5Vngba0wO-jRkB02", "date": "09.21 18:02", "comment_id": "reply_li_21450922", "parent_comment_id": "comment_li_21449330"}, {"writer": "연애서큘레이션", "text": "@만갤러25(218.101) 출석일수 그거 한국엔 있는건데 일본도 있는거야?  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1QOeNV428HiSV5nME5Vngba0wO-jRkB02", "date": "09.21 18:02", "comment_id": "reply_li_21450936", "parent_comment_id": "comment_li_21449330"}, {"writer": "ㅇㅇ(1.239) (1.239)", "text": "@연애서큘레이션 단점을 애들이 모르겠냐 쇼기나 아이돌 하는애가 문 좁은걸 모르겠음? 보육교사 하는애가 힘든일인거 모르겠음?? 다 아는 얘긴데 꿈은 사람을 죽입니다 할라고 단점 외워오는거잖음 뭔 리스크를 알려주는게 진짜 진로상담이니 뭐니 하는애들 있는데 고딩들이 뭐 바보냐 리스크 모르고 하겠음?? 걍 얘는 하고싶단애한테 다시 생각해라 포기하면 타협하라 했제 이거만 하는거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 18:40", "comment_id": "reply_li_21452530", "parent_comment_id": "comment_li_21449330"}, {"writer": "연애서큘레이션", "text": "@ㅇㅇ(1.239) 모름 그 작은문에 못들어가면 어떤생활이 있는지 그 일을 하면 어떤좆같은게 있는지 이번에피소드에서도 있잖아 취미가 직업이 되는순간 하기싫은걸 해야한다는것 모름 아이돌에서 그 작은문을 못들어가면 무슨 생활을 하는지 모름 보육교사에서 애새끼들이 얼마나 좆같고 그 부모들이 얼마나 좆같은지 모름 물론 알수도 있지 안다면 선생은 별말 안하고 넘어가겠지 철도에피소드처럼  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1QOeNV428HiSV5nME5Vngba0wO-jRkB02", "date": "09.21 20:08", "comment_id": "reply_li_21456467", "parent_comment_id": "comment_li_21449330"}, {"writer": "ㅇㅇ", "text": "@연애서큘레이션 그건 직접 안해보면 아무도 몰라 같은 업계, 같은직종으로 분류되는데도 옆회사랑 내회사랑 하늘과땅차이고 상식같아보이는게 그쪽에선 당연하게 아니고 이런게 얼마나 흔한데 저 선생이 저렇게 확신에 차서 설명하고 진로지도할수 있는 영역이 아님", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1PW6E8J_6_8uqEWQcHBItR2QWFgRtMK77", "date": "09.21 20:43", "comment_id": "reply_li_21458205", "parent_comment_id": "comment_li_21449330"}, {"writer": "연애서큘레이션", "text": "@ㅇㅇ 그니까 위에댓글에도 있는데 일반인이 알아보면 알수 있는정도까지만 알아보고 알려주잖아 여태 에피소드 전부 다 그런식이였고 그정도도 모르면 검토하라는거지 그래서 철도는 알고있었고 그냥 넘어갔잖아 그래서 잘하다가 철도에서 좆같은거 만나고 멘탈이 못버티니까 거기에 맞는 조언 해줬잖아  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1QOeNV428HiSV5nME5Vngba0wO-jRkB02", "date": "09.21 21:04", "comment_id": "reply_li_21459251", "parent_comment_id": "comment_li_21449330"}, {"writer": "메스이키쉐프", "text": "주인공이 너무 에겐임 오니즈카였으면 애들 다 꿈이루게했다", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1QOeNV428HiSV5nME5Vngba0wO-jRkB02", "date": "09.21 17:26", "comment_id": "comment_li_21449339", "parent_comment_id": ""}, {"writer": "ㅇㅇㅇ(110.46) (110.46)", "text": "암만 화내고 싸워도 쇼기편은 45화 완결이니까 아직 9화 남았어  - dc App", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.21 17:41", "comment_id": "comment_li_21450000", "parent_comment_id": ""}, {"writer": "ㅇㅇ(112.162) (112.162)", "text": "요즘 만갤에서 이게 재밌노", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.21 17:43", "comment_id": "comment_li_21450077", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "선생 하는말이 아주 못할 내용은 아닌데 말하는 방식이 너무 쓰레기임ㅋㅋㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1PW6E8J_6_8uqEWQcHBItR2QWFgRtMK77", "date": "09.21 17:53", "comment_id": "comment_li_21450553", "parent_comment_id": ""}, {"writer": "ㅇㅇ(147.47) (147.47)", "text": "사회성 개작살난 개병신 찐따들 특징중 하나긴함어머니 많이 편찮으셨는데 많이 나아지셨니?와 니 엄마 산송장이던데 아직 안뒤졌나보네?가 같은걸 묻는다고 둘다 해도 되는 말이라고 생각함", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 17:55", "comment_id": "reply_li_21450623", "parent_comment_id": "comment_li_21450553"}, {"writer": "ㅇㅇㅇ(110.46) (110.46)", "text": "\"너가 하려는 직업에는 이런 리스크도 있으니까 잘 생각해보고 늘 플랜비를 만들어둬서 정 안되겠다 싶으면 포기하고 그쪽으로 방향을 돌리는 것도 하나의 방법이 될 수 있다\" 정도로만 설명해줘도 될 문제긴 하지  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 17:59", "comment_id": "reply_li_21450811", "parent_comment_id": "comment_li_21450553"}, {"writer": "연애서큘레이션", "text": "@ㅇㅇㅇ(110.46) 이게 베스트긴해 ㅋㅋ  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1QOeNV428HiSV5nME5Vngba0wO-jRkB02", "date": "09.21 18:08", "comment_id": "reply_li_21451169", "parent_comment_id": "comment_li_21450553"}, {"writer": "ㅇㅇ(1.239) (1.239)", "text": "@ㅇㅇㅇ(110.46) 그러니까 이런식으로 표현하면 좋은 진로상담인데 뭔 남들한테 공유하지도 않은 지 혼자만의 과거에 사로잡혀서 학생들한테 다짜고짜 꿈은 저주입니다 이지랄 하고 다니니까 학생들이 제대로 받아들이질 못하지ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 18:41", "comment_id": "reply_li_21452574", "parent_comment_id": "comment_li_21450553"}, {"writer": "ㅇㅇ", "text": "포기하는 것도 나쁘지 않다를 꼭 했제충이 포기를 강요하는 거로만 여기는데쇼기편에서는 동생이 형한테 하는게 커리어로서의 쇼기랑 상충되는 자기 쇼기의 포기를 강요하는 구도라 다르게 해석해봄직도 하지않냐", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1PW6E8J_6_8uqEWQcHBItR2QWFgRtMK77", "date": "09.21 18:47", "comment_id": "comment_li_21452791", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "내리 연패하고도 딱히 심경변화 없던 새끼가 2승하고도 자기 쇼기 포기해버리고 자기 이상이 꺾인 사실에 눈물짓는데", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1PW6E8J_6_8uqEWQcHBItR2QWFgRtMK77", "date": "09.21 18:50", "comment_id": "reply_li_21452956", "parent_comment_id": "comment_li_21452791"}, {"writer": "ㅇㅇ(211.235) (211.235)", "text": "선생새끼 저렇게 된 사정이 있으면 뭐함? 진로지도할때 왜 그딴 식으로 말할 수 밖에 없는 건지 학생들도 이해하고 납득할 수 있도록 설명해주는 것도 아니고, 지혼자만 아무튼 난 꿈 부정한 거 아니라고 지껄이지만 사실상 꿈은 저주입니돠 꿈은 사람을 죽입니돠 ㅇㅈㄹ 원툴만 하면서 덮어놓고 부정만 해댄 게 팩트면서 ㅅㅂㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.21 18:51", "comment_id": "comment_li_21452991", "parent_comment_id": ""}, {"writer": "ㅇㅇ(211.235) (211.235)", "text": "상담이라면서 말하는 방식도 걍 개좆같이 하면서 내가 말은 안했지만 사실 깊은 뜻이 있었단다 ㅇㅈㄹ 하면 누가 알아주겠노? 뭔가 사정이 있고 깊은 뜻이 있으면 그걸 말을 해 등신아 ㅅㅂㅋㅋ 저래놓고 애들 스토킹하다가 한참 뒤에 시련 겪을 때만 얼씨구나 하면서 딱 튀어나와서 했제 ㅇㅈㄹ만 하지말고 새끼야", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 18:57", "comment_id": "reply_li_21453228", "parent_comment_id": "comment_li_21452991"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(211.235) ㄹㅇㅋㅋ 사정있으면 어쩔건데 그런다고 저새끼가 전교생 학부모 앞에서 꿈은 사람을 죽입니다 꿈은 줘주입니다 ㅇㅈㄹ한게 세탁 될 수가 없가는거임 리스크를 다 설명하고 학생이 혼자한거도 아니고 학부모랑 같이 선택하거면 응원이나 해줘야지 저주나 퍼붓는게 뭔 ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1PW6E8J_6_8uqEWQcHBItR2QWFgRtMK77", "date": "09.21 19:19", "comment_id": "reply_li_21454230", "parent_comment_id": "comment_li_21452991"}, {"writer": "ㅇㅇ(211.235) (211.235)", "text": "애들이 꿈에 잡아먹힐 것 같다는 이유로 당사자 입장에선 거의 포기하라는 식으로 들릴 법한 말들은 좆도 쓸모없는 이론 늘어놓으면서 장황하게 지껄이면서 정작 그 대신 어느 방향으로 나아가는게 좋을지에 대해선 말이 존나 부족하고 같이 머리 싸매고 더 좋은 길을 고민해주겠다는 어필도 존나 부족함 저 새끼는", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.21 19:05", "comment_id": "comment_li_21453576", "parent_comment_id": ""}, {"writer": "ㅇㅇ(211.235) (211.235)", "text": "그런 식으로, 더 좋은 대안들을 제시해주거나 아니면 같이 고민해주겠다는 어필이라도 태도로 드러냄 없이 그냥 그 길이 진짜 맞는 것 같냐 너의 그 꿈은 널 죽일 수 있다 ㅇㅈㄹ만 하고 끝이니까 아무도 상대하기 싫어하고 꿈 없는 선생이라고 불리지 등신새끼", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 19:09", "comment_id": "reply_li_21453766", "parent_comment_id": "comment_li_21453576"}, {"writer": "ㅇㅇ(211.235) (211.235)", "text": "인생 경험은 아직 적더라도 나이에 비해 엄청 진지하게 자기 진로에 대해 고민하고 의지도 가진 애들한테까지 그 목표와 의지 전부 부정하다시피 말하면서 정작 '그럼 어떻게 하는 게 좋다는 말인데?'에 대한 답은 니 꿈에 잡아먹힐 것 같으니 딴 길 찾아라 이것 말곤 구체적인 선택지 제시 단 하나조차 없음 ㅅㅂㅋㅋ 네 꿈은 네가 찾아야 한다고 말할거면 그렇게 직접 더 좋은 길 찾을 수 있도록 나도 같이 고민해주겠다는 태도라도 더 어필하던지 ㅅㅂㅋㅋ 그것조차 안 할거면 애초에 진로지도를 왜 함? 걍 상담을 하지마 ㅂㅅ아 꿈이 저주인 게 아니라 니가 지껄이는 말이 저주다", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 19:22", "comment_id": "reply_li_21454388", "parent_comment_id": "comment_li_21453576"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(211.235) 애초에 인생경험이 그렇게 많지도 않을거같은게 피아노 깔짝한 경험이랑 그냥 대학가서 교사된거 이게 끝이라 학생들 대비해서 큰 차이도 없고 자료조사도 일본판 나무위키같은거로 했을거라는거임... 실제로 일해보면 동종업계로 분류되어도 모르는 진로 엄청많는데", "is 로게이머한다 하면서 자퇴한다고 부모들 피말리게하는애들 천지임 과거랑 비교도 안됨 ㅡㅡ", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 14:47", "comment_id": "reply_li_21442576", "parent_comment_id": "comment_li_21441576"}, {"writer": "ㅇㅇ(129.154) (129.154)", "text": "차라리 배우 연기자 프로선수 이런거면 부모들이 뒷바라지라도 해주지 뭔 씨발 인방 개 창녀 버러지새끼질을 전문으로 한다하질않나 게임중족자로 돈벌겠다고 프로게이머한다고 하질않나 아에 시대가 미쳐돌아가고있음", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 14:48", "comment_id": "reply_li_21442601", "parent_comment_id": "comment_li_21441576"}, {"writer": "ㅇㅇ(129.154) (129.154)", "text": "요즘새끼들이 에미뒤진게 저짓을 학교다니면서 한다는게 아니라 걍 학교 때려치고 한다함ㅋㅋ상담할때마다 애미뒤짐진짜", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 14:49", "comment_id": "reply_li_21442623", "parent_comment_id": "comment_li_21441576"}, {"writer": "ㅇㅇ(129.154) (129.154)", "text": "진심 중딩들상대해보셈 별 개 좆물이 어디서 쳐들었는진몰라도 뭐하려고 학교 때려치곘단새끼들천지ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 14:50", "comment_id": "reply_li_21442658", "parent_comment_id": "comment_li_21441576"}, {"writer": "ㅇㅇ(125.185) (125.185)", "text": "지금 자퇴율 좆됨. 최하위권애들은 차피 대학 좆박을 성적이니 내 꿈 찾겠다면서 고등학교 퇴학하고 최상위권애들은 차피 학교수업 선행 끝났고 진로 내알아 할테니 시간낭비다 라면서 퇴학함ㅋㅋ 어중간한 애들보다 잘 안다고 생각하는 애들이 더 문제임 지금 저 만화 내용마냥", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 15:35", "comment_id": "reply_li_21444682", "parent_comment_id": "comment_li_21441576"}, {"writer": "ㅇㅇ", "text": "개노답 제발 고통스럽게 자살했으면 했제충도 작가도멍청한 캐릭터는 작가의 지능을 따른다", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1PW6E8J_6_8uqEWQcHBItR2QWFgRtMK77", "date": "09.21 14:28", "comment_id": "comment_li_21441787", "parent_comment_id": ""}, {"writer": "상하차맨", "text": "아이유의 너의 관객이 될게라는 곡을 아시나요?", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1QOeNV428HiSV5nME5Vngba0wO-jRkB02", "date": "09.21 14:30", "comment_id": "comment_li_21441842", "parent_comment_id": ""}, {"writer": "ㅇㅇ(121.140) (121.140)", "text": "여선생도 시공간의 인술을 깨우쳤나보네", "is_repl , "parent_comment_id": "comment_li_21440699"}, {"writer": "만갤러2(175.121) (175.121)", "text": "트라우마 생겨서 정신병 걸렸다고 하잖아 내용본거 맞냐", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 14:05", "comment_id": "reply_li_21440776", "parent_comment_id": "comment_li_21440699"}, {"writer": "비해브", "text": "현실적인 리스크는 알려주는 게 맞지. 무작정 돌격했다가 피 보면 누구 손해인데", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1QOeNV428HiSV5nME5Vngba0wO-jRkB02", "date": "09.21 14:07", "comment_id": "reply_li_21440859", "parent_comment_id": "comment_li_21440699"}, {"writer": "Serh", "text": "고2때 편자치15넘게차이나는대학간다하면 망치로대가리부숴서라도말리는게 참선생이다 보기좋은말만할게아니라", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1QOeNV428HiSV5nME5Vngba0wO-jRkB02", "date": "09.21 14:08", "comment_id": "reply_li_21440922", "parent_comment_id": "comment_li_21440699"}, {"writer": "쭉농증", "text": "", "is_reply": true, "dccon": "https://lh3.googleusercontent.com/d/1TnrpBXaF8ZjgSRDdk7BvOo97IPAmk8lT", "comment_img": "https://lh3.googleusercontent.com/d/1QOeNV428HiSV5nME5Vngba0wO-jRkB02", "date": "09.21 14:11", "comment_id": "reply_li_21441014", "parent_comment_id": "comment_li_21440699"}, {"writer": "ㅇㅇ", "text": "@비해브 얘는 현실적인 리스크를 말해주고 싶은게 아니라 트라우마 때문에 꿈을 쫓는 꼬라지가 보기 힘든거임", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1PW6E8J_6_8uqEWQcHBItR2QWFgRtMK77", "date": "09.21 14:12", "comment_id": "reply_li_21441046", "parent_comment_id": "comment_li_21440699"}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "@뚜니펭귄 그냥 진로상담 제대로 못받아서 인생망하거나 꼬인애들이 화풀이하는 댓글들이 너무 많다.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 14:16", "comment_id": "reply_li_21441231", "parent_comment_id": "comment_li_21440699"}, {"writer": "ㅇㅇ(117.111) (117.111)", "text": "누군가에게 아무생각없이 무책임하게 등떠밀려본 적이 한번도 없는 새끼구나", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 14:25", "comment_id": "reply_li_21441653", "parent_comment_id": "comment_li_21440699"}, {"writer": "ㅇㅇ(222.232) (222.232)", "text": "했제충인 건 차차하고 선생이 말하고 싶은 건 꿈을 쫓아 가시밭길을 걷느니 무난한 인생도 나쁘지 않다는 거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 14:27", "comment_id": "reply_li_21441708", "parent_comment_id": "comment_li_21440699"}, {"writer": "ㅇㅇ(222.232) (222.232)", "text": "꿈을 응원하는 건 누구라도 할 수 있지만 거기에 따르는 현실을 알려주는 건 아무나 못 함", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 14:28", "comment_id": "reply_li_21441763", "parent_comment_id": "comment_li_21440699"}, {"writer": "ㅇㅇ(222.112) (222.112)", "text": "@ㅇㅇ(106.101) 이새끼는 존나꼬였네 진로상담 제대로 못받았다고 인생 망했다 생각하는 사람이 세상에 어디있노? 선생이 정병걸려가지고 무조건 부정적인 얘기하며 꿈을 쫓는거 반대하는 싸이코라 욕하는거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 14:29", "comment_id": "reply_li_21441803", "parent_comment_id": "comment_li_21440699"}, {"writer": "ㅇㅇ(222.112) (222.112)", "text": "@ㅇㅇ(222.232) 무난한 인생도 나쁘지 않다정도가 아니라 꿈은 가져선 안된다 그건 저주다 하는 극한의 정신병자니까 그런거지 니가 말한 정도였다면 왜 욕먹겠냐", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 14:30", "comment_id": "reply_li_21441835", "parent_comment_id": "comment_li_21440699"}, {"writer": "ㅇㅇ", "text": "애초에 한국에서 진로상담이라는거 제대로 하긴 하냐? 담임 하향지원만 존나 시키려해서 빡쳐서 걍 내맘대로 원서써서 학교 갔는데", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1PW6E8J_6_8uqEWQcHBItR2QWFgRtMK77", "date": "09.21 14:43", "comment_id": "reply_li_21442397", "parent_comment_id": "comment_li_21440699"}, {"writer": "ㅇㅇ(180.67) (180.67)", "text": "@ㅇㅇ 한국에서 진로상담이 고딩시절에 큰 의미없는게 문제지 ㅋㅋ 다들 대학가라고만하는데 과 고민하는게 진로상담의 전부일텐데", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 15:16", "comment_id": "reply_li_21443852", "parent_comment_id": "comment_li_21440699"}, {"writer": "만갤러13(180.230) (180.230)", "text": "@ㅇㅇ(222.232) ?아무나 할 수 있음그걸 내담자가 받아들이는 건 또 다른 문제고했제충은 여기서 탈락함", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 15:18", "comment_id": "reply_li_21443945", "parent_comment_id": "comment_li_21440699"}, {"writer": "만갤러13(180.230) (180.230)", "text": "@ㅇㅇ(222.232) 그 누구도 받아들이지 못하는 방식으로, 대안 없이 했제?이건 자기가 포기한 꿈, 자기가 죽?인 제자에대한 여우의 신포도, 즉 자위라는 거지진지하게 인생 상담해주는 것이 아님내가 꿈에서 실패했으니 니들의 꿈은 다 틀렸어!! 하고 지랄하는 병신이란 말임", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 15:21", "comment_id": "reply_li_21444060", "parent_comment_id": "comment_li_21440699"}, {"writer": "만갤러13(180.230) (180.230)", "text": "@ㅇㅇ(222.232) 진지하게 심리학적으로 따져보면 꿈을 품고 나아가는 사람을 보면 심사가 뒤틀려서 좆같게 구는 것밖에 못하는 개쓰레기라는 거임그러니 자기의 자아를 지키기 위해 속으로는 역시 내가 옳았어, 내가 말 했제? 하며 카타르시스 느끼는 거고남의 꿈을 보면 못밟아서 안달인 거임진짜 진로지도였으면 이러이러한 점이 있는데 각오하십쇼 하고 장단점을 알려주지 어떤 진로지도교사가 부정적인면만 알려줘서 포기시킴?", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 15:24", "comment_id": "reply_li_21444172", "parent_comment_id": "comment_li_21440699"}, {"writer": "ㅇㅇ", "text": "@만갤러13(180.230) 선생이 미친놈인거고 작가도 그걸 드러내고 있는데 그냥 쿨찐짓 하고싶어서 그런거임 너가 이해해", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1PW6E8J_6_8uqEWQcHBItR2QWFgRtMK77", "date": "09.21 15:47", "comment_id": "reply_li_21445152", "parent_comment_id": "comment_li_21440699"}, {"writer": "ㅇㅇ", "text": "@만갤러13(180.230) 진로와 꿈에 대한 방법론을 여러가지 알려주면서 단계별 변화, 분석법, 후퇴 등등에 대한 얘기도 했는데 부정적인 면만 알려줬다는 억까임", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1PW6E8J_6_8uqEWQcHBItR2QWFgRtMK77", "date": "09.21 16:23", "comment_id": "reply_li_21446749", "parent_comment_id": "comment_li_21440699"}, {"writer": "연애서큘레이션", "text": "@ㅇㅇ 한국 진로상담은 그냥 입시상담이잖아  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1QOeNV428HiSV5nME5Vngba0wO-jRkB02", "date": "09.21 17:17", "comment_id": "reply_li_21449016", "parent_comment_id": "comment_li_21440699"}, {"writer": "ㅇㅇ", "text": "꿈을 쫒는건 좋은데 그게 실패할때 리스크를 생각 하고 대비 해놓으라는거임", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1PW6E8J_6_8uqEWQcHBItR2QWFgRtMK77", "date": "09.21 18:04", "comment_id": "reply_li_21450998", "parent_comment_id": "comment_li_21440699"}, {"writer": "ㅇㅇ(1.239) (1.239)", "text": "현실적인 리스크가 어쩌고 하는애들 갑갑한게 뭐 쇼기하는애가 문턱 좁은거 모르겠음? 보육교사 하는애가 힘든일인거 모르겠냐고 그냥 다시생각해봐라 안되면 했제 이거 할라고 단점 읊는거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 18:48", "comment_id": "reply_li_21452852", "parent_comment_id": "comment_li_21440699"}, {"writer": "ㅇㅇ(1.239) (1.239)", "text": "실패할때 대비하란것도 웃긴게 고딩이 꿈 있어서 그거 직진하겠다는데 거기서 뭔 실패를 대비해 실패하면 그때 되는대로 직업 갖는거지 씹 ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 18:49", "comment_id": "reply_li_21452894", "parent_comment_id": "comment_li_21440699"}, {"writer": "ㅇㅇ(61.84) (61.84)", "text": "그냥 선생 에고표출인거네 ㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.21 22:43", "comment_id": "comment_li_21464043", "parent_comment_id": ""}, {"writer": "ㅇㅇ(61.84) (61.84)", "text": "쇼기맨 결국 각성해서 본인스타일로 다쳐바를듯 ㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.21 22:45", "comment_id": "comment_li_21464127", "parent_comment_id": ""}, {"writer": "만갤러32(211.212) (211.212)", "text": "저 키노시타라는 애 내용에서 확실히 나올 거 같은데 자꾸 착각하는 애들이 있는데 지금 헀제는 진로지도에서 '상담'을 하고 있지 않음 했제 상담 패턴이 완전히 고정된 상태인데 학생 - OO가 하고 싶음 했제 - 그거 하면 좆되는 108가지(1번) 학생 - 하지 말란거임? 했제 - 난 하지말라고는 안 헀다(2번) 이런 식임 일단 1번에서 애들은 반감을 삼 하고 싶다는 걸 부정하니까 그래서 반박하면 2번에서 난 하지 말라는 소리는 안 했다 라면서 책임회피성 발언을 하는데 여기서 신뢰가 완전히 씹창남 이 뒤로는 그냥 상담이 안 됨 뭔 말을 해도 대상자가 상담자를 신뢰를 안 하는데? 상담이 될 수가 없음", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.21 23:10", "comment_id": "comment_li_21465304", "parent_comment_id": ""}, {"writer": "만갤러32(211.212) (211.212)", "text": "문제는 했제가 상담기술이 없는 그냥 말주변이 없는 새끼냐? 아님 애새끼가 망가진 다음에 했제하러 나타나서 꿈을 꾼 동기부터 접근하는 걸 보면 이새끼는 상담하는 기술을 충분히 가지고 있음 근데 그걸 정작 상담할때는 전혀 발휘를 안 함 정상적인 상담이 이뤄지는 건 꿈이 씹창나고 딴 일 알아봐야 되나 갈등을 하고 있을 때부터만 진행이 됨", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 23:14", "comment_id": "reply_li_21465472", "parent_comment_id": "comment_li_21465304"}, {"writer": "만갤러32(211.212) (211.212)", "text": "@만갤러32(211.212) 그럼 도대체 왜 이 지랄을 싸냐 단편적으로 나온 정보로 보면 했제는 이미 본인부터가 피아노 꿈을 접은 바 있음 여기에 아마 저 키노시타라는 애한테 자기 자신을 투영해서 밀어주다가 벽에 막혀서 죽은걸로 추정되는데 저 두개 때문에 이미 꿈을 꾼다 자체가 발작버튼이 된 상태임 인간자체는 사후 AS까지 다니는 등 본심은 꿈을 이루고 성공한 모습을 보고 싶어하는 착한 인간이 맞는데 저 꿈을 꾼다는 행위 자체가 트라우마 발작버튼이라 저 OO가 하고 싶어요라는 말이 나오는 상태에서는 정상적인 상담을 못하는거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 23:16", "comment_id": "reply_li_21465596", "parent_comment_id": "comment_li_21465304"}, {"writer": "만갤러32(211.212) (211.212)", "text": "@만갤러32(211.212) 반대로 꿈이 접힌 상태에서는 발작 버튼이 안 눌리니까 정상적인 상담이 진행이 되는 거고 아무튼 했제는 지금 상담을 하고 있는 게 아님 정상적인 조언도 하고 있는 게 아님 그냥 학생이 뭐 하겠다 하면 그거 하다 좆될 거 같은데 라는 마음 때문에 말려놔야 속이 풀리는 것뿐임 내가 봤을 때 이 만화는 했제의 정신병 치료기가 될 거라고 본다 이새끼는 지금 명백하게 정상이 아님", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.21 23:18", "comment_id": "reply_li_21465718", "parent_comment_id": "comment_li_21465304"}, {"writer": "ㅇㅇ", "text": "@만갤러32(211.212) 내생각도 그럼 꿈없는선생의 진로지도(본인얘기)면 그래도 ㄱㅊ은 만화일듯", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1RPpC7xwfBPPkhH2mW-D1MXs4WTpi1Cvr", "date": "09.22 00:41", "comment_id": "reply_li_21469271", "parent_comment_id": "comment_li_21465304"}, {"writer": "ㅇㅇ", "text": "@만갤러32(211.212) 근데 작가가 순수하게 선생이 맞다 생각하는거면 병신맞고", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1RPpC7xwfBPPkhH2mW-D1MXs4WTpi1Cvr", "date": "09.22 00:43", "comment_id": "reply_li_21469321", "parent_comment_id": "comment_li_21465304"}, {"writer": "ㅇㅇ(211.108) (211.108)", "text": "슬럼프 없는 사람 아무도 없고, 변하지 않는건 걍 우둔한것밖에 안된다 본다.3단이면 끝을 보는게 맞음 ㅇㅇ", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.21 23:45", "comment_id": "comment_li_21466944", "parent_comment_id": ""}, {"writer": "ㅇㅇ(211.178) (211.178)", "text": "언제 번역하지.", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.22 00:29", "comment_id": "comment_li_21468849", "parent_comment_id": ""}, {"writer": "oo(116.40) (116.40)", "text": "웃는 아줌마의 생각 망하면 니 책임. 잘 하면 우리의 교육의 성과주인공 행동 꿈을 이루지 못 하는 것도 교육자의 책임 이다 인것 같음", "is_reply": false, " 35)", "text": "댓글 반응 안 좋은데 번역 그만해라ㅇㅇ", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.22 11:12", "comment_id": "comment_li_21483974", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "재밌어요", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1RPpC7xwfBPPkhH2mW-D1MXs4WTpi1Cvr", "date": "09.22 15:24", "comment_id": "comment_li_21493219", "parent_comment_id": ""}, {"writer": "ㅇㅇ(175.223) (175.223)", "text": "인버지 vs 했제센세 누가 더 순애임", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.22 17:53", "comment_id": "comment_li_21498970", "parent_comment_id": ""}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
