1358516fd9ce632ada652116b3c7f8672797af06716670132248c94a98675cb3a825d36bd96f51dec3", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(119.198) (119.198)", "text": "다양한 요소로 과하지 않은 선에서 독자들을 자극하는걸 이 작가가 참 잘함", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.12 22:31", "comment_id": "comment_li_23993425", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(119.198) (119.198)", "text": "성실하고 생각도 깊은데 싱싱하기까지 한 빅젖 고딩에 발작하는 페미들과 음침한 포티햄한테도 상대가 안 될거같은 쉬었음 만붕이들 쌍으로 발작 ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 22:33", "comment_id": "reply_li_23993535", "parent_comment_id": "comment_li_23993425", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(125.176) (125.176)", "text": "점장이 이샹하다", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.12 22:32", "comment_id": "comment_li_23993502", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "아 씨발 궁디  - dc App", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.12 22:33", "comment_id": "comment_li_23993534", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.246) (211.246)", "text": "경제력 처참 이대남 따잇 ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.12 22:37", "comment_id": "comment_li_23993711", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러33(220.125) (220.125)", "text": "남자는 와인이다", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.12 22:38", "comment_id": "comment_li_23993768", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "속.버리지.말고.든든한.안주.필요하면.연락.줘요.", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.12 22:38", "comment_id": "comment_li_23993776", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(220.65) (220.65)", "text": "근데 생각해보면 이상하지않음?좋은 사람 만나기위해서 많은 사람을 경험한다는 소리하면서 개걸레 보지달고 30중반돼서 이미 사회적으로 안정적으로 자리잡은 남자라는 당첨복권을 날로 쳐먹는것보다는 사회적으로 안정적인 남자가 20대 젊고 건강한 여자를 만나는게 더 건강한 사회 아님?", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.12 22:44", "comment_id": "comment_li_23994042", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.36) (118.36)", "text": "그거 미국 연구 결과에 나오잖아 파트너 많으면 많을 수록 결혼 생활 불만족한다고 함(10명이상)+사귀었던 파트너 2명일때랑서로서로 연애 아예 안하던가 아니면 2명넘게 만나던가 많은 사람 만나는거는 솔직히 비교 ㅈㄴ 하는 우리나라에서 별로일것 같음 전 애인들 중첩되버려서 결국에는 큰 육각형을 원하게 되거든", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 22:49", "comment_id": "reply_li_23994311", "parent_comment_id": "comment_li_23994042", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(220.65) (220.65)", "text": "늙은 남자들이 늙은 여자를 사지않으면결국 남자들은 사회적 안정감을 찾기위해서 노력할꺼고  젊은 여자들은 젊은 남성과 결혼해서 미래라는 리스크를 가질 필요가 없으니미리 경제력이라는 복권을 가지면서 젊은 나이에 결혼하는게 유행이 될거고", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 22:53", "comment_id": "reply_li_23994474", "parent_comment_id": "comment_li_23994042", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(125.185) (125.185)", "text": "미국에서 그런 신드롬으로 실제로 뉴스도 나옴. 극단적으론 친구아빠랑 사귀는 20대들 이러면서. 당연히 안 흔하니까 뉴스에 나온거긴 한데 오지콤이 사회현상으로 조명받을 정도로 사례가 있긴 했단 거니까 뭐.. 한국에서 영포티 드립 나온 시기부터가 딱 미국, 일본에서 그 뉴스 전파되고나서 생긴 거ㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.12 23:00", "comment_id": "reply_li_23994787", "parent_comment_id": "comment_li_23994042", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(220.65) (220.65)", "text": "세상에 사랑이 없다면수요와 공급에 맞춰서 돈 많은 남자가 젊은 여자랑 결혼하는게 맞지 왜 젊었을때는 듣도보도못한 자지빨면서 나팔관 말라붙은 기형아 생성기 늙다리년들이랑 사랑타령하면서 결혼하는거임", "is_reply": true, "dc
