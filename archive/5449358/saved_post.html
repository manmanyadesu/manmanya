3.googleusercontent.com/d/1kVmuHRJHCEOc0NVBRXWDsPzp9utlEOip", "date": "07.26 00:14", "comment_id": "comment_li_18586413", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "여친 100명 개성 구분하려면 여친 부모님은 같은 캐릭터로 짜는게 효율적", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1YYGHC_fC1IFMsOeO7hC7oJHROsPORQ_N", "date": "07.26 00:14", "comment_id": "comment_li_18586432", "parent_comment_id": ""}, {"writer": "구경꾼", "text": "나노 부모님 미쳤네. 근데 동생은 왜 안낳았지?", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1YYGHC_fC1IFMsOeO7hC7oJHROsPORQ_N", "date": "07.26 00:14", "comment_id": "comment_li_18586435", "parent_comment_id": ""}, {"writer": "건붕(14.42) (14.42)", "text": "아이는 하나만 기르는 게 효율적이라서", "is_reply": true, "dccon": "", "comment_img": "", "date": "07.26 01:49", "comment_id": "reply_li_18591302", "parent_comment_id": "comment_li_18586435"}, {"writer": "ㅇㅇ(110.13) (110.13)", "text": "나노 부모 특별화는 만력 높다 개재밌네 ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "07.26 00:55", "comment_id": "comment_li_18588230", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "섹스 한 번에 임신. 매우 효율적.", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1YYGHC_fC1IFMsOeO7hC7oJHROsPORQ_N", "date": "07.26 01:09", "comment_id": "comment_li_18589216", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "애는 한명이 효율적", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1YYGHC_fC1IFMsOeO7hC7oJHROsPORQ_N", "date": "07.26 01:42", "comment_id": "comment_li_18590870", "parent_comment_id": ""}, {"writer": "건붕(14.42) (14.42)", "text": "너무 효율적으로 똑같이 생긴 가족 무엇", "is_reply": false, "dccon": "", "comment_img": "", "date": "07.26 01:48", "comment_id": "comment_li_18591270", "parent_comment_id": ""}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
