다니는 놈 능력 비슷하네 개조능력은 없고 종 제한이 없나", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.26 01:13", "comment_id": "comment_li_23175169", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.210) (211.210)", "text": "가르시아 부하로 있던 눈깔녀 하수인임테이밍은 아니고 몸에서 뿜어내는 생체 드론 같은 거", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.26 02:14", "comment_id": "reply_li_23177824", "parent_comment_id": "comment_li_23175169", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(220.93) (220.93)", "text": "사마귀년이 갑자기 가르시아를 왜 배신한 거임? 전에 뭐 나왔나? 그리고 저 삼눈이 능력이 마수 조종하는 건가 보네", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.26 01:15", "comment_id": "comment_li_23175229", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅁㅁ(211.216) (211.216)", "text": "삼눈이년 눈깔은 지 몸속에서 나온거", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.26 01:16", "comment_id": "reply_li_23175269", "parent_comment_id": "comment_li_23175229", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅁㅁ(211.216) (211.216)", "text": "가르시아가 목표는 세계멸망이라 하니까 사마귀년 그거 듣고 표정 쎄하게 된거 나옴", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.26 01:20", "comment_id": "reply_li_23175407", "parent_comment_id": "comment_li_23175229", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.188) (121.188)", "text": "그 배신자 엘프 가진 고유능력자 능력임.거대한 마수 가지고 세계 멸망시킬 수도있는 능력이라 얘기하는거 나옴", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.26 01:29", "comment_id": "reply_li_23175817", "parent_comment_id": "comment_li_23175229", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(222.109) (222.109)", "text": "평범한 마족 파시스트라 정복전쟁이면 몰라도 세계멸망은 싫은듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.26 01:44", "comment_id
