e, "dccon": "", "comment_img": "", "date": "10.29 19:10", "comment_id": "comment_li_23345210", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(14.34) (14.34)", "text": "나도 저런년 줘", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.29 19:11", "comment_id": "comment_li_23345223", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(27.115) (27.115)", "text": "그냥 사람대하는게 어려운 여자였고", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.29 19:12", "comment_id": "comment_li_23345272", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "걍 강한 집착이 있는 양산형 집착녀만 아니었으면... 진짜 찐 얀데레 좀 보고 싶다 뭔가 조금만 맘에 어긋나도 폭주하는", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.29 19:13", "comment_id": "comment_li_23345319", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "요즘은 걍 집착속성 있는 메가데레를 얀데레라고 하고 있으니 맛대가리가 없음", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.29 19:14", "comment_id": "reply_li_23345327", "parent_comment_id": "comment_li_23345319", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.28) (223.28)", "text": "찐 얀데레만화 만갤에 올릴수잇음?  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.29 19:21", "comment_id": "reply_li_23345567", "parent_comment_id": "comment_li_23345319", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "야좌", "text": "찐 얀데레는 살인 폭력, 사회적 파탄이 동반되어야 함", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.29 19:58", "comment_id": "reply_li_23346858", "parent_comment_id": "comment_li_23345319", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@야좌 물리적인 폭력이 거의 필수긴 하지만 그게 없더라도 사회적으로 거세시켜서 몰락시키는 정도 comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러6(220.80) (220.80)", "text": "솔직히 이런거볼떄마다 걍 나였으면 따먹었지 얼굴ㅈ빻은것도 아니고 칼질하는것도 아닌데 평생저렇게 잘해주는데 왜안안김?", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.29 19:27", "comment_id": "comment_li_23345846", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "얀데레들 성욕 좆되서 한번 따먹으면 시도때도 없이 발정난 개새끼마냥 섹스하자 뭐하자 지랄발광해댐 정기 다 빨려서 쉬자고ㅠ하면 바로 눈깔 죽은 눈 되서 사랑 식엇다고 자해하고 자살소동 벌임 괜히 얀데레 만낫던 남자들 죄다 육체적으로나 정신적으로나 피폐해지고 해골상 되는게 아님", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.30 01:15", "comment_id": "reply_li_23357854", "parent_comment_id": "comment_li_23345846", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(219.251) (219.251)", "text": "뭔가 있는 척 후까시만 잡고 그냥 요리해주는 참한 처자 아님?", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.29 19:27", "comment_id": "comment_li_23345847", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "ㄹㅇ임다", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.29 20:06", "comment_id": "reply_li_23347145", "parent_comment_id": "comment_li_23345847", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.224) (211.224)", "text": "눈을떴구나", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.29 20:44", "comment_id": "reply_li_23348526", "parent_comment_id": "comment_li_23345847", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "만약 현실에서 명문대에 찌찌 큰 미녀가 저래 나만 바라보는 미친 얀데레면 좋아해야할까 아니면 소름끼칠까..", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.29 19:29", "comment_id": "comment_li_23345887", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "진짜 개미친 정통 얀데레면 소름끼치겠지.. 근데 저건 걍 집착심한 메가데레인데 뭐..", "is_re
