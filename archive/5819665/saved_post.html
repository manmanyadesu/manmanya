riter": "만갤러8(121.167) (121.167)", "text": "@만갤러22(175.204) 작가가 설정한 최대의 죄악이 동족포식이고 뿔은 그냥 가장 큰죄 저지른 놈이다라는 트리거고 그 죄를 지으면 주술이 풀리면서 죄를 영원히 반복하는 지옥으로 설정했으니까", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.19 01:14", "comment_id": "reply_li_19756615", "parent_comment_id": "comment_li_19756304"}, {"writer": "하일리언", "text": "@만갤러22(175.204) 자기들이 식인종의 후손인 걸 숨기려고 주술을 건 거니까, 자기들중 식인하는 놈은 역으로 오니가 되어줘야하니 뿔이 보이게 되는거.", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1t6ZYxc-KBXLcpEzpQ_wV3f2PtDqwR666", "date": "08.19 01:15", "comment_id": "reply_li_19756727", "parent_comment_id": "comment_li_19756304"}, {"writer": "ㅇㅇ", "text": "종 전체가 오니라는 정체성을 버리고 인간으로 둔갑하려 했는데, 오니만의 특징인 동족 포식을 하면 이 주술이 풀리고 오니였다는게 드러나면서 뿔이 자란다는게 오늘 내용", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1jn-uNxS6ijiaUMi5gfkE65dcKPeQBHLf", "date": "08.19 01:18", "comment_id": "reply_li_19756894", "parent_comment_id": "comment_li_19756304"}, {"writer": "만갤러18(118.41) (118.41)", "text": "@만갤러22(175.204) 모든 인간이 오니인 게 아니라, 아주 예전에는 인간 속에 속하는 여러 인간 종(사피엔스, 네안데르탈 등등)이 있는데 그 중에서 사피엔스만 동족 포식을 하는 인간 종=오니고 그 사피엔스가 원래부터 뿔이 있는 인간 종이었던 거임. 다른 인간 종을 모두 죽인 다음에 주술로 뿔을 감추고 그걸 잊은 채로 살게 된 게 지금의 사피엔스라는 듯.", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.19 01:22", "comment_id": "reply_li_19757105", "parent_comment_id": "comment_li_19756304"}, {"writer": "만갤러18(118.41) (118.41)", "text": "근데 딱히 꼭 죄라서 트리거인 거는 아닌 거 같은데. 다른 인간 종은 안 하는데 사피엔스 종만 하니까 트리거인 거 아님?", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.19 01:23", "comment_id": "reply_li_19757154", "parent_comment_id": "comment_li_19756304"}, {"writer": "ㅇㅇ(61.77) (61.77)", "text": "오니가 결국 동족포식한 이유는 식량이 없어서 한거고 원래 인간은 죽어도 동족포식은 안했나보지", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.19 01:43", "comment_id": "reply_li_19758053", "parent_comment_id": "comment_li_19756304"}, {"writer": "ㅇㅇ(147.47) (147.47)", "text": "호모 사피엔스가 빙하기때 인구수가 수만명이하일 정도로 좆망하고 쪼들릴 때가 있었는데, ntent.com/d/1t6ZYxc-KBXLcpEzpQ_wV3f2PtDqwR666", "date": "08.19 09:03", "comment_id": "comment_li_19769241", "parent_comment_id": ""}, {"writer": "만갤러29(211.234) (211.234)", "text": "와 신선들은 결국 인간에서 신이 된 애들인데 천선들은 외계인으로 표현하길래 봉신연의 이런거 영향인줄 알았는데 이것도 복선이었네", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.19 09:20", "comment_id": "comment_li_19769644", "parent_comment_id": ""}, {"writer": "ㅇㅇ(112.161) (112.161)", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1SED0ISAgeL8UQPymg4fvWkEqY8Xb2K47", "comment_img": "", "date": "08.19 09:48", "comment_id": "comment_li_19770435", "parent_comment_id": ""}, {"writer": "만갤러30(118.235) (118.235)", "text": "스승 어쩌다가 잡혔음?", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.19 09:49", "comment_id": "comment_li_19770461", "parent_comment_id": ""}, {"writer": "ㅇㅇ(27.115) (27.115)", "text": "술이 약점이라 저 갈비뼈 부런진애가 암기에 발라서 지속딜 넣었음", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.19 10:38", "comment_id": "reply_li_19771989", "parent_comment_id": "comment_li_19770461"}, {"writer": "만갤러30(118.235) (118.235)", "text": "설정이 허접한게 종단위로 주술은 어떻게 걸고, 신은 어떻게 만들었으며, 신 사라져도 상관없는거면 그냥 주술로 행복하게 살았습니다 해도 상관없는거 아님? 이래저래 반전이랍시고 넣었지만 정작 그 설정 대로 가야할 당위성이 없음만능으로 할 수 있는거면 만능으로 해결하면 되는거 아님?", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.19 09:51", "comment_id": "comment_li_19770581", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "종단위의 주술이라는게 무슨 인위적인 의식을 한게 아니라 잠재의식의 발현이잖음 동족포식이라는 죄의식을 극복하고 자신들이 멸절시킨 인류종같은 평화로운 생명체로서 사회를 이루고 살고 싶다는", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1jn-uNxS6ijiaUMi5gfkE65dcKPeQBHLf", "date": "08.19 10:08", "comment_id": "reply_li_19771116", "parent_comment_id": "comment_li_19770581"}, {"writer": "만갤러30(118.235) (118.235)", "text": "종 단위 뿔 없애는 츠쿠요미 걸었는데 행복하게 살았습니다 츠쿠요미는 안된다는게 코메디임 ㅋㅋㅋ뿔 잊는 건 잊었는데 뿔 없애기 위해 신 저주하는건 가능하다는 것도 말이 안되고", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.19 09:55", "comment_id": "comment_li_19770744", "parent_comment_id": ""}, {"writer": "ㅇㅇ(183.107) (183.107)", "text": "니가 완전 잘못 이해하고 있음", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.20 23:27", "comment_id": "reply_li_19860629", "parent_comment_id": "comment_li_19770744"}, {"writer": "만갤러32(14.42) (14.42)", "text": "토우게오니 세계관 인류는 전부 오니였구나. ㄹㅇ 인간은 이미 오니에게 전멸했고", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.19 09:56", "comment_id": "comment_li_19770749", "parent_comment_id": ""}, {"writer": "만갤러30(118.235) (118.235)", "text": "신 다 지워봤자 선인은 알고 있는거 아님? 외계인도 알고 있고? 대체 뭐가 해결된다는거임?", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.19 09:56", "comment_id": "comment_li_19770785", "parent_comment_id": ""}, {"writer": "만갤러32(14.42) (14.42)", "text": "해결이 안 된다는 거지. 인류는 원초적으로 오니였어. 근데 대다수의 인류는 이걸 잊어버리길 원했고, 그 탓에 인류의 마음에서 태어나고 양분을 얻는 신들은 이 사실을 관측한 존재로서 저주를 받으니 인류에게서 도망치거나 죽을 수 밖에 없다는 거임. 근데 쟤네 여행은 오니가 된 걸 되돌리고 유일하게 여전히 인류에게서 손절하지 않은 신(히토코토누시)을 구하려는 건데, 이게 양립할 수 없는 상황인 거임. 오니라는 존재가 사라지려면(은폐되려면) 신들이 전부 인간에게서 손을 떼거나 죽어야 하고, 반대로 신이 살려면 인간 모두가 사실 인류 따윈 없고 자신들이 오니였다는 걸 자각해야 하는 상황임. 아니면 히토코토누시 또한 인류를 손절하고 도망치거나.", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.19 10:06", "comment_id": "reply_li_19771057", "parent_comment_id": "comment_li_19770785"}, {"writer": "만갤러32(14.42) (14.42)", "text": "그보다 이거 제목 회수아니냐ㅋㅋㅋㅋ 이때까지 토우게오니였던 이유가 바로 여기에ㅋㅋㅋㅋ 인류는 원래 오니였다", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.19 09:57", "comment_id": "comment_li_19770793", "parent_comment_id": ""}, {"writer": "만갤러30(118.235) (118.235)", "text": "물리적으로 있는게 없어졌다고 의식하는 것도 웃기지 않음? 인지적으로 못느꺼도 뿔이 어디 걸릴거고 옷도 찢어질거고 뿔 부러진 조각이 나올 수도 있고 다른 물리적 실체들은 다 인지할텐데? 개억지 설정임", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.19 10:10", "comment_id": "comment_li_19771143", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "그렇게 파고들어가면 이 세계관에 나오는 주술이라는거 자체가 물리적으로 말이 안된다는 소리까지 가야되는데? 주술이 인식을 저해하는거라면 옷에 걸리는 감각 뿔이 부서진 조각 전부 인식 밖에서 사라지겠지", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1jn-uNxS6ijiaUMi5gfkE65dcKPeQBHLf", "date": "08.19 10:17", "comment_id": "reply_li_19771332", "parent_comment_id": "comment_li_19771143"}, {"writer": "ㅇㅇ(58.29) (58.29)", "text": "주술로 시간도 넘고 공간도 넘는데왜 뿔만 물리적으로 남아있다고 생각함?이런 저능아같은 댓글은 진짜 무슨 생각으로 쓰는거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.19 10:30", "comment_id": "reply_li_19771713", "parent_comment_id": "comment_li_19771143"}, {"writer": "ㅇㅇ(49.175) (49.175)", "text": "넌 만화 왜보냐?", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.19 12:18", "comment_id": "reply_li_19775165", "parent_comment_id": "comment_li_19771143"}, {"writer": "지능낮은", "text": "병신  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1ypTIKO0xle-Pm75Eps67B-8iyUHGcbTl", "date": "08.20 13:36", "comment_id": "reply_li_19833662", "parent_comment_id": "comment_li_19771143"}, {"writer": "아쎄이", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1eprv523P7B0-u1-6gv_acNQRPHVl6hsI", "comment_img": "https://lh3.googleusercontent.com/d/1t6ZYxc-KBXLcpEzpQ_wV3f2PtDqwR666", "date": "08.19 10:17", "comment_id": "comment_li_19771346", "parent_comment_id": ""}, {"writer": "아쎄이", "text": "정말 완결이 가까워 지고있다는 사실이 느껴져서 슬프네", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1t6ZYxc-KBXLcpEzpQ_wV3f2PtDqwR666", "date": "08.19 10:32", "comment_id": "reply_li_19771754", "parent_comment_id": "comment_li_19771346"}, {"writer": "ㅇㅇ(175.197) (175.197)", "text": "충격적인 반전!", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.19 10:20", "comment_id": "comment_li_19771431", "parent_comment_id": ""}, {"writer": "ㅇㅇ(58.29) (58.29)", "text": "격월연재때문에 댓글이 이해못한놈 절반, 이해한놈 절반이노이해한애들은 다 감탄하고 설명까지 해주고있는데 이해못한놈들이 개연성 지적을 하고잇음", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.19 10:24", "comment_id": "comment_li_19771559", "parent_comment_id": ""}, {"writer": "ㅇㅇ(58.29) (58.29)", "text": "헛소리하는 댓글들 보면죄 다 이미 만화에서 설명해줬던 내용인데지가 까먹고 엉뚱하게 만화탓을 하는 꼴이 존나 웃김", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.19 10:27", "comment_id": "reply_li_19771649", "parent_comment_id": "comment_li_19771559"}, {"writer": "ㅇㅇ", "text": "아이피보니 이해 못한 놈은 1명이 계속쓰는거 같은데", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1jn-uNxS6ijiaUMi5gfkE65dcKPeQBHLf", "date": "08.19 10:37", "comment_id": "reply_li_19771957", "parent_comment_id": "comment_li_19771559"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(58.29) 딱 1명임 자기 딴엔 저런 전개로 갈 당위성이 없다는데 정작 답을 정해놓고 끼워맞추는건 이 만화보다 지가 더 심함", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1jn-uNxS6ijiaUMi5gfkE65dcKPeQBHLf", "date": "08.19 11:17", "comment_id": "reply_li_19773297", "parent_comment_id": "comment_li_19771559"}, {"writer": "옾눞Iㆆ운lY", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1E4cgj8ndF4NiTFBu3dgHT0xDA0Aj65ZD", "comment_img": "https://lh3.googleusercontent.com/d/1t6ZYxc-KBXLcpEzpQ_wV3f2PtDqwR666", "date": "08.19 10:27", "comment_id": "comment_li_19771650", "parent_comment_id": ""}, {"writer": "ㅇㅇ(14.46) (14.46)", "text": "와... 이번편 진짜 미쳤다... 와 다른 말이 안나온다", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.19 10:28", "comment_id": "comment_li_19771676", "parent_comment_id": ""}, {"writer": "키위미깡", "text": "설정 좋은데 한 화에서 설명하고 딱 끝나는 게 뭔가 좀 아쉽네 격월이라 이거 푸는 데 2화 썼으면 너무 늘어졌으려나", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1t6ZYxc-KBXLcpEzpQ_wV3f2PtDqwR666", "date": "08.19 10:55", "comment_id": "comment_li_19772639", "parent_comment_id": ""}, {"writer": "기신고래(진)", "text": "와 드디어 모든게 밝혀졌구나", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1Jb2t8uGYrW1AcKqGpaoKuR0a6oU3Xfyp", "date": "08.19 11:45", "comment_id": "comment_li_19774058", "parent_comment_id": ""}, {"writer": "ㅇㅇ(61.76) (61.76)", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1ALqkf6mvolohSxQ9oEtxjQ42iexdLNre", "comment_img": "", "date": "08.19 11:50", "comment_id": "comment_li_19774217", "parent_comment_id": ""}, {"writer": "ㅇㅇ(175.122) (175.122)", "text": "'고개(토우게)에는 오니가 있을 뿐' 그래서 제목이 토우게오니구나!", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.19 12:31", "comment_id": "comment_li_19775679", "parent_comment_id": ""}, {"writer": "퓨렌", "text": "과거 오고부터 의도적으로 머리 위쪽 가려놨는데 12페이지에는 잘보면 그려놨네ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1t6ZYxc-KBXLcpEzpQ_wV3f2PtDqwR666", "date": "08.19 12:48", "comment_id": "comment_li_19776501", "parent_comment_id": ""}, {"writer": "ㅇㅇㅇㅇㅇd", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1mgjWMjV70jKcNLGQDe8sG0NTXYzCXCfq", "comment_img": "https://lh3.googleusercontent.com/d/1t6ZYxc-KBXLcpEzpQ_wV3f2PtDqwR666", "date": "08.19 13:13", "comment_id": "comment_li_19777479", "parent_comment_id": ""}, {"writer": "ㅇㅇ(121.183) (121.183)", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1xG3Ickcej6ildsehU8G4mxwv_0qvdsUr", "comment_img": "", "date": "08.19 13:25", "comment_id": "comment_li_19778087", "parent_comment_id": ""}, {"writer": "ㅇㅇ(203.251) (203.251)", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1EQjPpamSpbrYx0md_hv9CQDsmBWPGXbq", "comment_img": "", "date": "08.19 13:26", "comment_id": "comment_li_19778095", "parent_comment_id": ""}, {"writer": "ㅇㅇ(121.128) (121.128)", "text": "저거 플레이하는중에 뿔없는 풀들이 뿔있는 풀들 먼저 선빵침 오니들이 주술로 신들을 불러내서 풍요로워져서 수가 늘어나니까 인간풀들이 선빵친거였는데 또 오니풀들이 주술로 신들을 움직여서 인간풀들 조짐 이길수가 없는 게임이었음", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.19 13:44", "comment_id": "comment_li_19778688", "parent_comment_id": ""}, {"writer": "오로호", "text": "진짜 격월이아니라 월간연재만됐어도 더 재밌었을거같은데   - dc App", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1t6ZYxc-KBXLcpEzpQ_wV3f2PtDqwR666", "date": "08.19 13:56", "comment_id": "comment_li_19779131", "parent_comment_id": ""}, {"writer": "ㅇㅇ(58.230) (58.230)", "text": "신선들은 머지", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.19 15:19", "comment_id": "comment_li_19781782", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "주술의 극에 달한 오니", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1jn-uNxS6ijiaUMi5gfkE65dcKPeQBHLf", "date": "08.19 15:36", "comment_id": "reply_li_19782434", "parent_comment_id": "comment_li_19781782"}, {"writer": "Seo", "text": "복선 까는 솜씨가 기막히네 진짜", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1t6ZYxc-KBXLcpEzpQ_wV3f2PtDqwR666", "date": "08.19 15:22", "comment_id": "comment_li_19781875", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "만신이 만든 신을 다루는 만화", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1jn-uNxS6ijiaUMi5gfkE65dcKPeQBHLf", "date": "08.19 15:35", "comment_id": "comment_li_19782424", "parent_comment_id": ""}, {"writer": "ㅇㅇ(182.212) (182.212)", "text": "신선의 마지막 수련 아미행도 어떤 일에도 꿈쩍하지 않는 정신을 기른다기보다 동족의 본성을 보고 받아들이는 과정일지도", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.19 16:00", "comment_id": "comment_li_19783328", "parent_comment_id": ""}, {"writer": "쿠르스", "text": "저 세계관은 아직 옛날이라 그렇지 근대화까지 되고 엑스레이 찍으면 뿔 보이는거 아님?", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1t6ZYxc-KBXLcpEzpQ_wV3f2PtDqwR666", "date": "08.19 16:00", "comment_id": "comment_li_19783338", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "그래서 문명 쌓이면 자멸한다고 작중에서 언급됨. 그래서 거기까지 안가고 지금 상태를 유지하려면 신이 필요한거고", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1jn-uNxS6ijiaUMi5gfkE65dcKPeQBHLf", "date": "08.19 16:39", "comment_id": "reply_li_19785021", "parent_comment_id": "comment_li_19783338"}, {"writer": "ㅇㅇ(210.223) (210.223)", "text": "43화 왜내려감", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.19 16:19", "comment_id": "comment_li_19784129", "parent_comment_id": ""}, {"writer": "ㅇㅇ(220.79) (220.79)", "text": "오니들이 자신들의 소망이나 희망 기원 같은 여러 생각을 통해서 이를 주술로 바꾸고 이를 이루어 줄수 있는 고차원 존재들에게 자신들이 있는 세상으로 형체를 주고 붙잡음 이게 신들임신들은 본질적으론 고차원의 존재이고 기본적으로 주술의 덩어리라고 할수있지만 그렇다고 딱히 뭔갈 하는 존재들은 아니었는데 오니들이 주술로 만든 형체에 강림하니 이 형체의 주술에 잡혀 오니들이있는 이승에 존재할땐 오니들의 주술에 의해 묶인 존재가 되버림 그리고 오니들이 바라는 대로 여러 신들이 탄생하고 각 신들의 관장하는 부분 또는 능력들이 정해짐. 즉 이승에서 존재가 고정된 신들은 이승에 존재할때앤 오니들의 주술을 거스를 수가 없는 존재가됨", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.19 18:05", "comment_id": "comment_li_19788647", "parent_comment_id": ""}, {"writer": "ㅇㅇ(220.79) (220.79)", "text": "오니들은 자신들의 뿔을 없던 것으로 하기 위해서 애초에 뿔이 없었고 오니가 아니었다 라는 집단 최면술 또는 인지부조화를 통하여 실제론 뿔이 존재하지만 자기들은 인식 하지 못하고 애초에 뿔이 잇다는 생각조차 못하게됨 근데 이건 주술로 이루어진 것임신들의 이승에 강림한 형체는 오니들의 주술로 부터 이루어져 있지만 그 본질은 고차원 존재라서 오니들의 뿔을 인지 할 수 있었음하지만 그 형체는 오니들의 주술로 이루어져 있고 이들의 존재 이유는 오니들을 풍요롭게 하기 위한 존재들임오니들은 자신들의 뿔이 수치스러워 숨긴 것이었고 사실 자신들이 인간이 아니라 뿔이 원래부터 있던 존재라는건 신들이 이승에 존재하는 이유 그자체를 부정하는 것이됨", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.19 18:09", "comment_id": "reply_li_19788853", "parent_comment_id": "comment_li_19788647"}, {"writer": "ㅇㅇ(220.79) (220.79)", "text": "@ㅇㅇ(220.79) 그래서 오니의 주술로 오니들이 진실을 외면하기 위함이 신들의 강림한 형체에 까지 영향을 미쳐서 이형체를 이룬 주술들이 입막음을 위해 신들이 오니에 대해 진실을 말하려 하면 형체가 무너지는듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.19 18:10", "comment_id": "reply_li_19788884", "parent_comment_id": "comment_li_19788647"}, {"writer": "ㅇㅇ(220.79) (220.79)", "text": "아마 과거로 다시가서 오니들이 인간들 다죽이는걸 막고 둘을 교잡시켜서 오니의 유전자도 있는 인간들로 뿌리를 바꿀거 같은데", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.19 18:14", "comment_id": "comment_li_19789067", "parent_comment_id": ""}, {"writer": "ㅇㅇ(1.214) (1.214)", "text": "해설가들 설명이 너무 잘 되있어서 혼동갈까봐 나도 적자면, 지구의 지적 생명체중에 정신활동이 현실에 영향을 끼치는 수준에 도달한 것이 인류종 최종 진화형인 오니. 그리고 정신활동이나 관념이 지적인 정신체들을 만든것이 신이자 외부 관찰자. 그리고 사실상 유사한 존재지만 인류가 만들지 않은 신이 \"외신\"(외신은 인류가 없어도 살 수 있지만 외계인 형상)", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.19 19:13", "comment_id": "comment_li_19791900", "parent_comment_id": ""}, {"writer": "ㅇㅇ(1.214) (1.214)", "text": "그리고 사실상 후손들이 믿기에 존재하는 신들이 야마토의 신들인 것.", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.19 19:14", "comment_id": "reply_li_19791932", "parent_comment_id": "comment_li_19791900"}, {"writer": "ㅇㅇ(1.214) (1.214)", "text": "@ㅇㅇ(1.214) 문제는 막상 다른 인류종이 멸종하자 다음 차례가 자신들인걸 안 오니의 집단 무의식이 \"이게 다 신 때문이다.\" 라고 책임전가 하거나 두려움이 주술이 되서 뿔이 없어지길 바랬고, 그 결과 뿔을 인식하지 못하게 되며 그 억지력이 신에 대해서도 망각하거나 경외하지 않게 됨.", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.19 19:17", "comment_id": "reply_li_19792066", "parent_comment_id": "comment_li_19791900"}, {"writer": "만갤러3(180.230) (180.230)", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1-UD-Y0mhcmomQ7CF6Iu2rQtt4hlOx9mJ", "comment_img": "", "date": "08.18 23:25", "comment_id": "comment_li_19751229", "parent_comment_id": ""}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1NC3iooqS51erLNWmldJjrFlRXrURTLJP", "comment_img": "", "date": "08.18 23:25", "comment_id": "comment_li_19751268", "parent_comment_id": ""}, {"writer": "ㅇㅇ(58.236) (58.236)", "text": "뭔가 납득한거같은데 받아들이고 끝나나 그럼 용신뒤지는거잖아", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.18 23:27", "comment_id": "comment_li_19751344", "parent_comment_id": ""}, {"writer": "ㅇㅇ(27.115) (27.115)", "text": "야훼는 진짜 굉장하네..신들이 다 죽는 와중에 혼자 살아남은 거자너;예수 덕분이냐?", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.18 23:28", "comment_id": "comment_li_19751396", "parent_comment_id": ""}, {"writer": "ㅇㅇ(27.115) (27.115)", "text": "아니면 야훼는 인간의 주술이 만들어냈을뿐인 거짓신인가?", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.18 23:35", "comment_id": "reply_li_19751677", "parent_comment_id": "comment_li_19751396"}, {"writer": "ㅇㅇ(118.41) (118.41)", "text": "저 만화에서 예수가 진짜 독생자라고 쳐도 야훼도 지금 죽었을 걸. 저 시대면 기원 후  7세기 쯤임.", "is_reply": true, "dccon": "", "c 55122", "parent_comment_id": "comment_li_19754625"}, {"writer": "만갤러17(183.107) (183.107)", "text": "@만갤러17(183.107) 작중에서 일본에서는 히토코토누시만이 유일하게 남은 것도 시대가 흐르면서 강물, 용, 소원 등 여러가지의 의미가 붙고 그렇게 모습이 변했지만 처음으로 말로써 불려진 신이기 때문인듯 아무리 저주를 받았어도 그 이름을 기억하고 부르는 인간이 있는 이상 쉽게 사라지지 않고 버틸 수 있는거 같음 하지만 지상에 있으면 신앙은 커녕 오히려 저주를 받고, 멀어지면 그나마의 신앙이 사라져서 약해지니 그냥 이도저도 못하는 상태인거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.19 00:59", "comment_id": "reply_li_19755847", "parent_comment_id": "comment_li_19754625"}, {"writer": "ㅇㅇ(27.115) (27.115)", "text": "인간이 참 무서운게 지구상 어떤 동물도 자기와 비슷한 근연종을 절멸시키면서 종으로서 확립하질 않음;그렇게까지 해놓고 이제 자기들끼리 피부색 다르다고 서로 죽여댐;", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.19 00:36", "comment_id": "comment_li_19754654", "parent_comment_id": ""}, {"writer": "ㅇㅇ(119.203) (119.203)", "text": "뭔소리노 절멸시킨게 아니라 죽이면서 혼혈도 같이해서 가장 유력한 종으로 합쳐진거고 지금 생존한 동물들도 똑같음. 참고로 리얼 토종 엠흑은 네안데르탈 대신 후기형 에렉투스랑 섞인걸로 추정됨(화석이 너무 오래되어서 dna확인은 불가)", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.19 11:05", "comment_id": "reply_li_19772983", "parent_comment_id": "comment_li_19754654"}, {"writer": "ㅇㅇ", "text": "꼭 제대로 모르고 어줍잖게 아는 애들이 이런 소리함", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1jn-uNxS6ijiaUMi5gfkE65dcKPeQBHLf", "date": "08.19 11:22", "comment_id": "reply_li_19773426", "parent_comment_id": "comment_li_19754654"}, {"writer": "ㅇㅇ(1.237) (1.237)", "text": "역시 갓작", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.19 00:37", "comment_id": "comment_li_19754673", "parent_comment_id": ""}, {"writer": "만갤러16(124.54) (124.54)", "text": "인류는 쇠퇴했습니다 파쿠리잔나", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.19 00:39", "comment_id": "comment_li_19754777", "parent_comment_id": ""}, {"writer": "만갤러17(183.107) (183.107)", "text": "오히려 주술이 풀린 쪽이 뿔이 보이는 쪽이었구나 식인으로만 풀리는 예외도 인간의 진실을 눈으로 비추는 신이 지상에서 모두 쫓겨난다면 기만은 완성되는거고", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.19 00:41", "comment_id": "c ntId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
