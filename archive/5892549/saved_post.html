": "ㅇㅇ(116.127) (116.127)", "text": "@ㅇㅇ(222.234) 그게 코믹스로는 일본이나 다른나라에서도 먼저 나온 작품들이 좀 있다더라 특히 미국 소설에선 탑승해서 조작하는 로봇이 등장하는 작품이 꽤 흔했다고 함 그래서 세계최초의 탑승 로봇이라는 표현도 사라짐", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.23 22:38", "comment_id": "reply_li_20012689", "parent_comment_id": "comment_li_20004518"}, {"writer": "ㅇㅇ(14.37) (14.37)", "text": "일단 당시 전쟁끝난지 20년정도밖에 안된 시기였으니까, 나온 물건이 별로 없었음그리고 선구자들이 개척했으면 그게 국룰이 되는건 크게 이상한건 아니었는데 그 선구자들이 낸게 자이언트로보와 철인28호, 즉 리모콘로봇 조종계열이었음사람이 탑승해서 로봇과 하나되는 인기일체는 지금 로봇물에선 국룰이지만 저 당시엔 안 그랬단거그리고 나가이고가 그 인기일체의 시대를 열은 거고. 괜히 모든 슈퍼로봇의 근본이라 불리우는게 아님20세기소년을 봐도 그런 내용 나오잖음. '친구'가 만든 로봇의 콕핏이나 조종계통을 찾아보다가 문득 자기네가 어릴땐 로봇은 탑승하는게 아니라 조종하는게 당연한 시대였단걸 뒤늦게 깨닫고 리모콘의 존재가 있음을 깨닫고 추적하는 장면.", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.23 23:10", "comment_id": "reply_li_20014527", "parent_comment_id": "comment_li_20004518"}, {"writer": "토다", "text": "중장비나 자동차도 다 탑승하지 원격조종하냐? 뭔", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1uBmhGt51K5yGBWiyIgf-a9f6Gapgo5-A", "date": "08.24 00:27", "comment_id": "reply_li_20018558", "parent_comment_id": "comment_li_20004518"}, {"writer": "만갤러19(211.196) (211.196)", "text": "@토다 원격조종 있음", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.24 04:03", "comment_id": "reply_li_20026523", "parent_comment_id": "comment_li_20004518"}, {"writer": "만갤러8(119.75) (119.75)", "text": "ㄴㄴ 만붕이는 이미 탑승형 대형 로봇이 기본 상식으로 뇌리에 박힌 상태에서 사고하니까 '로봇=중장비 혹은 자동차와 비슷한 무언가'로 연결하는거지 원래 옛날 로봇이라는건 공장에서 노동하는 자동화 기계이거나 인공지능이 들어가서 스스로 인간처럼 행동하는 기계 같은 걸 연상하는게 가장 일반적이었다는 얘기임. 지금은 마징가나 건담 같은 탑승형 대형 로봇물이 지겨울 정도로 쏟아져 나온지도 이제 수십년은 지났으니까 그렇게 전투기나 탱크의 인간 형태 같은 병기로 인식하는게 자연스럽게 변한거지.", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.24 14:28", "comment_id": "reply_li_20042094", "parent_comment_id": "comment_li_20004518"}, {"writer": "ㅇㅇ(223.38) (223.38)", "text": "@만갤러8(119.75) sf소설에선 탑승형 로봇이 이미 많이 나온 시절임 마징가는 거대 인간형 로봇에 탑승해 적과 싸우는 슈퍼로봇 시대를 연 선구자인건 맞는데 그 당시 로봇은 조종해야 한다는 고정관념에 사로잡힌건 일본 , "text": "나가이 고가 많이 했던 애니메이션 사업 시스템을 일반 만화 시스템에 도입한 듯", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1-7wjNo9E5-asLAPiaWkTH5ECKBJJIESr", "date": "08.24 14:51", "comment_id": "reply_li_20042956", "parent_comment_id": "comment_li_20040584"}, {"writer": "흑삼", "text": "캬 ㅈㄴ 재밋네  - dc App", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/13yF8WHKVlDl2hxJ22aMr7GBRGYkcQO3i", "date": "08.24 13:49", "comment_id": "comment_li_20040641", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "나가이 고 별명이 '헨타이의 아버지'인데 그 말은 나가이 고가 없엇으면현재 인류들이 누리는 헨타이만화 수준의 야함은 없엇다 (좀 과장하면 그렇다, 그래서 나는 나가이 고를 비틀즈 보다 더 인류에 영향력 잇는 사람이라고 본다19금의 야함, 쇼타 장르, 동성애, 레즈 등등의 표현 수위를 일본 당국과 전쟁해가면서 계속 표현의 수위를 확장해 나감  \"악마인데 성기 좀 그릴 수도 잇지~~ 악마는 동물이니까~~\" 이런 식으로 떼쓰면서, 결과적으로 일본+인류의 표현의 자유를 최대한 넓혀 줌나가이 고의 업적 임", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1-7wjNo9E5-asLAPiaWkTH5ECKBJJIESr", "date": "08.24 15:53", "comment_id": "comment_li_20045015", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "충격적인 표현 수위도나가이 고가 확장을 했는데 데빌맨의 여자주인공이 사망하고 목이 걸리는 장면은당시 만화가들 조차 \"세상에 이런 장면이 만화로 공개될 수 있단 말인가?\"하고 충격받을 정도 였다나가이 고 가 선봉으로 달리고, 후세 만화가들에게 큰 영향", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1-7wjNo9E5-asLAPiaWkTH5ECKBJJIESr", "date": "08.24 15:55", "comment_id": "reply_li_20045110", "parent_comment_id": "comment_li_20045015"}, {"writer": "ㅇㅇ", "text": "일본 만화의양지의 아버지 = 데즈카 오사무음지의 아버지 = 나가이 고", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1-7wjNo9E5-asLAPiaWkTH5ECKBJJIESr", "date": "08.24 15:57", "comment_id": "reply_li_20045160", "parent_comment_id": "comment_li_20045015"}, {"writer": "ㅇㅇ", "text": "마징가 Z 도 나가이 고 가 \"사람이 전투 중에 팔짤리고, 몸이 두동강 나고\" 이런 처절한 전투를 그리고 싶엇지만 당시 검열 수준은 인간이 이렇게 싸우는 걸 그려낼 수가 없엇음 그래서 로봇으로 대체 한 거임 현대에는 \"사람이 전투중에 팔 짤리고, 몸이 잘리는\" 만화가 넷플릭스에도 많이 나온다 나가이 고의 영향 이라고 볼 수 있다", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1-7wjNo9E5-asLAPiaWkTH5ECKBJJIESr", "date": "08.24 16:01", "comment_id": "reply_li_20045290", "parent_comment_id": "comment_li_20045015"}, {"writer": "ㅇㅇ", "text": "물론 잔인한 전투를 그려내고 싶은 것은 마징가 Z를 그린 일부 동기일 뿐이고가장 큰 동기는 더 큰 존재에 자신을 연결해서, 자아가 확장 된다 그게 첫번째 주제 의식이고 ㅇㅇ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1-7wjNo9E5-asLAPiaWkTH5ECKBJJIESr", "date": "08.24 16:03", "comment_id": "reply_li_20045323", "parent_comment_id": "comment_li_20045015"}, {"writer": "ㅇㅇ", "text": "아무튼일본 만화의 양지 아버지, 데즈카 오사무음지 아버지, 나가이 고 이렇게 데즈카 오사무와 어깨를 나란히 한다는 거 자체가 현재 생존해 있는 노인, 나가이 고가 \"살아있는 전설\" 그 자체 라는 거임   프로덕션 시스템으로, 아직도 자신의 만화책을 출간하고 있고ㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1-7wjNo9E5-asLAPiaWkTH5ECKBJJIESr", "date": "08.24 16:05", "comment_id": "reply_li_20045396", "parent_comment_id": "comment_li_20045015"}, {"writer": "폴렌", "text": "@ㅇㅇ 그 의지를 이어받아 나유타 목을 회전초밥에 올리고 그냥 버려버린 대 타츠키선생님의 큰 뜻을 이제야 조금은 헤아릴 수 있을 것 같네......", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/13yF8WHKVlDl2hxJ22aMr7GBRGYkcQO3i", "date": "08.24 18:47", "comment_id": "reply_li_20050909", "parent_comment_id": "comment_li_20045015"}, {"writer": "ㅇㅇ(116.34) (116.34)", "text": "진짜 선구자네", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.24 21:04", "comment_id": "comment_li_20056657", "parent_comment_id": ""}, {"writer": "만갤러25(106.253) (106.253)", "text": "물론 이건 전기 만화이니, 흔해빠진 자기개발서처럼 어느정도 과장이 들어갔겠지만..시대를 관통한 천재들은 진짜 \"하고싶어? 그러면 바로 해야지\" <<이런 실행력이 다들 있는듯", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.24 23:32", "comment_id": "comment_li_20063448", "parent_comment_id": ""}, {"writer": "Mernerner", "text": "데빌맨편 완결은 영원히 못보겠군", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/13yF8WHKVlDl2hxJ22aMr7GBRGYkcQO3i", "date": "08.25 06:02", "comment_id": "comment_li_20075896", "parent_comment_id": ""}, {"writer": "만갤러27(117.53) (117.53)", "text": "진짜 다재다능이네 재밋어", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.25 11:01", "comment_id": "comment_li_20083448", "parent_comment_id": ""}, {"writer": "작은레후", "text": "시대 배경 생각하니 ㄹㅇ 장르 개척자였노", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/13yF8WHKVlDl2hxJ22aMr7GBRGYkcQO3i", "date": "08.25 14:43", "comment_id": "comment_li_20090640", "parent_comment_id": ""}, {"writer": "만갤러28(210.108) (210.108)", "text": "만화는 안 될 것 같으니 애니메이션으로 팔겠습니다 ???? ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.25 18:01", "comment_id": "comment_li_20098668", "parent_comment_id": ""}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
