li_24465265", "parent_comment_id": "comment_li_24464230", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러16(39.124) (39.124)", "text": "@보슨 보스 공략 파티 반대로였으면 서로 전멸 났겠지? 패턴은 단순한테 그냥 센 여왕벌 패턴 모르면 그냥 죽어 버섯 고렙이라고해도 패턴 보스는 모르면 답이 없어보이네", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.22 14:09", "comment_id": "reply_li_24466692", "parent_comment_id": "comment_li_24464230", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "보슨", "text": "@만갤러16(39.124) ㅇㅇ 대신 패턴 알면 무조건 피할 수 있으니까 저렙파티가 온거고 벌집 여왕은 존나 쎄니까 최대한 고렙 파티 구성한거고 여기 보스가 정황상 80렙대 정도니까 6~70대 파티에 체력 30% 정도면 아슬아슬함 주인공도 모르는 블러프 패턴 나오는거 보면 게임상에 구현되지 않은 하드 난이도로 구현된듯 노말 난이도만 했던 주인공은 자기가 아는 지식선에서 블러프 패턴임을 직감하고 유연하게 대처할 수 있었던거지 두 파티가 바뀌었으면 둘 다 즉사였을듯  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.22 14:13", "comment_id": "reply_li_24466879", "parent_comment_id": "comment_li_24464230", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "보슨", "text": "@만갤러16(39.124) 로스트아크식으로 생각하면 둘 다 광폭화나 발악 패턴이라고 생각해볼 수 있음 적정레벨 파티가 아니라 시간이 오래 지나서 광폭화 패턴이 나오면 그냥 뒤지라고 절대 못피하는 개억까 패턴 쓰는데 벌집여왕은 자폭 버섯제왕은 즉사기 동시 2개 사용인거지 개억까 자폭패턴에 어그로 끌어서 목숨을 사역마가 대신 소모하게 하는 사령술사, 체력깎기는 커녕 잡몹 대처랑 패턴 기믹 파훼하는 저렙들만 있는 곳에서 순간 폭딜을 넣을 수 있는 주인공까지 진짜 주인공 계산대로 아슬아슬한 파티 인선이었음   - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.22 14:17", "comment_id": "reply_li_24467085", "parent_comment_id": "comment_li_24464230", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러16(39.124) (39.124)", "text": "@보슨 ㄹㅇ 광폭화 패턴은 주인공이 노멀 패턴 알려줬어도 서로 반대 보스 상대 였으면 전멸이었겠네", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.22 14:25", "comment_id": "reply_li_24467349", "parent_comment_id": "comment_li_24464230", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "https://gall.dcinside.com/board/view/?id=comic_new6&no=7199503&fcno=2
