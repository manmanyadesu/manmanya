ent_media_version": 2}, {"writer": "만갤러11(118.235) (118.235)", "text": "대충요약)스승은 어떻게든 잡았는데, 스승이 마지막 보험으로 용신한테 주상의의식(대충 인류멸망)을 소원으로 빔. 용신은 소원 무조건 들어줘야해서 지금 인류멸망 직전이고, 첫단계로 눈앞에 있던 제자들은 이미 죽어버림. 오즈노가 안 죽은건 아마 제자들 죽는 순간 신선 돼서 그런듯. 이번화 내용은 \"이대로 끝이라면 제자들이 성장한 미래와 만났을 리 없다\"고 생각해서 뭐 하는 모습이고, 마지막에 나온건 가끔 나왔던 미래의 오즈노(성장한 제자들이랑 같이 다니던 모습)임", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.13 13:06", "comment_id": "comment_li_24018017", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러13(39.124) (39.124)", "text": "오즈노 전설에서 저 신이 원래 패하니 결과는 정해져있긴한데 아무리봐도 개씹사기 존재는 천선들 같네", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.13 13:21", "comment_id": "comment_li_24018622", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "보슨", "text": "아무래도 인간의 신앙으로 존재하는 신들과 달리 신선들은 인간의 몸으로 신이 된 존재들이란 설정이니까  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.13 13:22", "comment_id": "reply_li_24018690", "parent_comment_id": "comment_li_24018622", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.234) (211.234)", "text": "@보슨 천선은 태생신임 지선리 인간이 신 비스무리하게 된 거고", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.13 13:45", "comment_id": "reply_li_24019766", "parent_comment_id": "comment_li_24018622", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "보슨", "text": "@ㅇㅇ(211.234) 그런가? 내가 착각했네  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.13 13:58", "comment_id": "reply_li_24020331", "parent_comment_id": "comment_li_24018622", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "오줌기타", "text": "@보슨 천선은 외계신 같은걸로 나왓잖아", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.13 15:36", "comment_id": "reply_li_24024005", "parent_comment_id": "comment_li_24018622", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "보슨", "text": "@오줌기타 아 그렇네 둘이 헷갈렸음  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.13 15:57", "comment_id": "reply_li_24024739", "parent_comment_id": "comment_li_24018622", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "보슨", "text": "스승 오즈노가 실패한 자신의 과거를 불러내어 무한히 흡수했듯 제자 오즈노가 최후까지 짜낸 주술로 성공한 자신의 미래를 불러내어 조력받으려는듯  - dc App", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.13 13:21", "comment_id": "comment_li_24018635", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "성공한 미래를 불러온건지, 아니면 과거의 자신이 지금 순간 자신을 찾은걸 알기에 나타난건지, 부트 스트랩 파라독스네 이거", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.13 13:29", "comment_id": "reply_li_24018967", "parent_comment_id": "comment_li_24018635", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "보슨", "text": "@만갤러18(39.7) 그야 제자들은 뇌 뽑혔으니까 그건 당연한거지  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.13 14:11", "comment_id": "reply_li_24020840", "parent_comment_id": "comment_li_24018635", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러18(39.7) (39.7)", "text": "수정하려고 삭제했는데, 주술로 불러온 게 아니라 저 세계선에 들어간 것도 결혼한 제자들이 운영하는 주막에서 튀어나왔듯이 그냥 늙은 오즈노는 젊은 오즈노가 찾아올 걸 알고 준비하고 있었고 준비 끝나서 찾아온 거 아닌가? 주술에 건다는 묘사가 있어서 나도 헷갈리긴 하네", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.13 14:15", "comment_id": "reply_li_24020955", "parent_comment_id": "comment_li_24018635", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "보슨", "text": "@만갤러18(39.7) 스승은 행방불명이었다는거 보면 신선이 된 오즈노는 제자 오즈노가 주술로 부를때까지 자신을 봉인해둔 그런 상태가 아니었을까 싶은데 뭐 주술로 시간도 멈추는거 보면 신선 오즈노는 확실함 과거에 향로로 미래의 자신들의 환영을 불렀을때도 시간 멈춰서 조력해주는 장면 있었음  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.13 14:20", "comment_id": "reply_li_24021127", "parent_comment_id": "comment_li_24018635", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(175.197) (175.197)", "text": "여신이 봐줄듯", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.13 13:27", "comment_id": "comment_li_24018866", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "전화 마지막에서 히토코토누시 아이돌 된거 좀 웃겼는데", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.13 13:27", "comment_id": "comment_li_24018882", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러15(220.92) (220.92)", "text": "오즈노 눈 모양 보고 신선 될줄 알았는데 아니네", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.13 13:29", "comment_id": "comment_li_24018955", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러16(106.101) (106.101)", "text": "결국은 신선되긴함", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.13 13:42", "comment_id": "reply_li_24019599", "parent_comment_id": "comment_li_24018955", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "오줌기타", "text": "눈알3개부터 신선임", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.13 16:04", "comment_id": "reply_li_24024945", "parent_comment_id": "comment_li_24018955", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "나 이거 아케인에서 봄", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.13 13:36", "comment_id": "comment_li_24019315", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "옾눞Iㆆ운lY", "text": "45화 내용 뭐였음? 짤려서 못봤는데", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.13 13:38", "comment_id": "comment_li_24019382", "parent_comment_id": "", "dccon_source": "", "comment_img_sou
