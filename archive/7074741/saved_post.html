img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "사내사정 은근슬쩍넘기는거보니 돼지랑 백여우랑 몰래 사내연애하느라 더 쫀심때매 라이벌짓 하는듯?  - dc App", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 12:35", "comment_id": "comment_li_24064544", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러26(220.125) (220.125)", "text": "다까쓰기 이년 틀린말 하는거 없는데 왤케 밉상이지", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 12:48", "comment_id": "comment_li_24065142", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "리큐", "text": "맞는 말이 아니니까", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 14:38", "comment_id": "reply_li_24069379", "parent_comment_id": "comment_li_24065142", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(183.103) (183.103)", "text": "맞는말도 아니고 사먹는 우리쪽에 피해만 오는짓이니까.  절충도안하고 강압적으로 지껄이는 이유도 말안한 사심이 드글드글하다는거 뻔히 보이기도하고", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 15:51", "comment_id": "reply_li_24072239", "parent_comment_id": "comment_li_24065142", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(125.185) (125.185)", "text": "지금 저 과정 거치고 전체 이미지 하락한 게 한국의 중국집이니까. 애초에 원가 이야기로 타격 보는 게 고급점만의 이야기가 아니거든. 방어율만 생각해서 낮은 제품쓰는 걸로 살아남는 매장에서 원가 폭등 후에도 같은 방어율을 만들려면 어케 하겠음? 더 질낮은 제품 쓰겠지", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 16:07", "comment_id": "reply_li_24072974", "parent_comment_id": "comment_li_24065142", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(125.185) (125.185)", "text": "고급점은 그 괴정 거치더라도 세리자와가 맨날 말하던 이름값, 정보 먹기로 어느정도 살아남겠지만 박리다매 애들은 가격 메리트로 내세우던 거라 가격도 못 올리고 다 비슷비슷한 수준이라 다른 경쟁자한테 밀리기 쉬워지니 좀 지나면 한국 짱개집들처럼 한순간에 다 같이 쓸려있을거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 16:09", "comment_id": "reply_li_24073112", "parent_comme ia_version": 2}, {"writer": "만갤러33(223.39) (223.39)", "text": "젖닌아...", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 13:51", "comment_id": "reply_li_24067676", "parent_comment_id": "comment_li_24066814", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러30(121.137) (121.137)", "text": "번역 굿 잘 봤소", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 13:31", "comment_id": "comment_li_24066894", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러32(124.54) (124.54)", "text": "저건 하나만 알고 둘은 모르는 전형적인 탁상행정임. 브랜드 가치를 지키면서 손해는 보지 않는 8개 점포를 왜 없애냐", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 13:36", "comment_id": "comment_li_24067109", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러33(223.39) (223.39)", "text": "라오타 무시하면 안됨. 매니아층이 보편적인 매출에서는 도움이 안 되지만 싸이버 렉카로 돌변하면 업장 하나 망하게 하는건 일도 아님. 신멘타이 접고 양산형 라멘 프차 만든다고 하면 바로 라오타들이 달려들어 개같이 물어뜯을걸?", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 13:49", "comment_id": "comment_li_24067583", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.234) (211.234)", "text": "핏콩.. 핏콩을 데려와라", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 13:50", "comment_id": "comment_li_24067611", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러33(223.39) (223.39)", "text": "머기업이 잘나가던 브랜드 하나 인수해놓고 정장 유사사업 전개하면서 내다 버린다? 경제지에 날 만한 뉴스거리임", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 13:51", "comment_id": "comment_li_24067654", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "DEXT", "text": "번역한 샤끼는 자주 쓰는 손을 앞으로  - dc App", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 13: mment_id": "comment_li_24059851", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(119.65) (119.65)", "text": "", "is_reply": true, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658eb247654666db6b6001f0cf3e1f5d066bd52737dccb41c4ecf584f8d82a9290a54ac188f686f6847162072", "comment_img": "", "date": "11.14 15:17", "comment_id": "reply_li_24070784", "parent_comment_id": "comment_li_24059851", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658eb247654666db6b6001f0cf3e1f5d066bd52737dccb41c4ecf584f8d82a9290a54ac188f686f6847162072", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "핏콩 보고 싶노 ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 17:26", "comment_id": "reply_li_24075819", "parent_comment_id": "comment_li_24059851", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러7(125.130) (125.130)", "text": "그렇다고 굳이 통합하기 보다는 고급, 양산형 2단 체제로 가는게 장기적으로 더 유연할것 같은데.", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 10:27", "comment_id": "comment_li_24059898", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러9(49.167) (49.167)", "text": "재무와 개발의 싸움같냐요즘 밀키트로 데워서 보내다가 사람빠지면이름만바꿔서 재개업하고 이런 가게 엄청 많은데대기업 이름 달고 그런짓하면 평판 나락 확정임뭔가 둘이 사실 서로 좋아했는데!! 이러면서 화해엔딩갈것같냐. 요즘 생물학이나 오니마위봤더니뇌가 절여졌다", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 10:29", "comment_id": "comment_li_24059940", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(122.153) (122.153)", "text": "지금 나온 리뉴얼 라면집은 그래도 밀키트 수준은 아니잖어", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 16:42", "comment_id": "reply_li_24074321", "parent_comment_id": "comment_li_24059940", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.235) (211.235)", "text": "애초에 대기업 입장에서 어설픈 양산형 브랜드 가지고 있는거고다 소수더라도 브랜드 가치 있는 라인 있는게 오히려 장기적으론 도움 됨.기업이 경영악화되서 오늘내일하는거도 아니면 저런 알짜 브랜드 버리고 걍 양산형으로 만드는건 에바임", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 10:32", "comment_id": "comment_li_24060012", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(61.84) (61.84)", "text": "아무리 생각해도 그냥 하나 더 런칭하지 않을 이유를 못찾겠다 신멘테이 점포가 만약 하나둘 쓰러지면 그때가서 새 브랜드 가게로 리뉴얼 하면 되는거고", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 10:34", "comment_id": "comment_li_24060049", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(61.84) (61.84)", "text": "신멘테이 8점포가 진짜 하나같이 상업지구 핵심 노른자 입지를 가진 황금의 부동산이라면 또 모르겠다 근데 그러면 애초에 저정도 공수까지 들어간걸 저가격에 못팔지", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 10:34", "comment_id": "reply_li_24060069", "parent_comment_id": "comment_li_24060049", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "엘제에", "text": "나중에 승진할때 걸림돌될까봐 커리어 뭉개놓으려는거같음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 14:20", "comment_id": "reply_li_24068724", "parent_comment_id": "comment_li_24060049", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(220.117) (220.117)", "text": "위에 이유 다 설명했잖아. 사장 개개인한테 너무 의존중이라 조금만 원자재값 상승해도 바로 적자로 돌아선다고. 당장 라멘 1만엔 마지노선이 발목잡는것도 전에 나왔던 이야기고", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 14:31", "comment_id": "reply_li_24069123", "parent_comment_id": "comment_li_24060049", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(183.103) (183.103)", "text": "@ㅇㅇ(220.117) 그것도 문닫게할 핑계를 찾는수준이고   이미 자리잡은 고급브랜드를 뭉개고 시시껄렁한 가성비로 채운다는건 눈앞의 이득쫒다가 망하는길에 지나지않음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 15:49", "comment_i omment_id": "comment_li_24060309", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "대머리 새끼 특등석에서 재밌는 거 즐기노 ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 10:45", "comment_id": "comment_li_24060346", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.234) (211.234)", "text": "원자재, 인력 문제면고급 브랜드보다 저가 브랜드가 직격타 아니냐 ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 10:47", "comment_id": "comment_li_24060417", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러48(211.209) (211.209)", "text": "그래서 보통 기업에서 굴릴때는 역량 충분하면 멀티브랜드 만들지 현대/제네시스처럼", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 17:14", "comment_id": "reply_li_24075435", "parent_comment_id": "comment_li_24060417", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.184) (121.184)", "text": "라멘 뿐만 아니라 중식, 경양식 돈까스, 백반집도 일본뿐만 아니라 한국조차 그런 현실이지...특히 백반집은 윗세대 다 죽으면 거의 전멸할거다...", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 10:52", "comment_id": "comment_li_24060634", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.146) (121.146)", "text": "근데 저렇게 할꺼면 차라리 신멘테이 8집은 그대로 운영하고 넥스트 브랜드 프차를 하는게 낫지 않나? 잘되가는 패를 엎고 도박수를 할이유가 잇나 ㅋㅋ 신멘테이가 파리가 날리는것도 아니고 그냥 대기업 프차 전체 매출에 비해서 저 8개 매출로는 부족하다 이건데 ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 10:53", "comment_id": "comment_li_24060645", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "경영 똥줄타는 좆소체인이면 몰라도 규모 있으면 유지하는게 맞지않나? 흑자 나고 있는데", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 10:54", "comment_id": "comment_li_24060718", "parent_comment_id": "", "dccon (61.81)", "text": "", "is_reply": false, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658ee217169b1ce38fca35fb556a8abdd4494ef7c3cc1ba1eaa5b0d794e109887d758d33a4619e99d0cc9fa24b059", "comment_img": "", "date": "11.14 08:58", "comment_id": "comment_li_24057863", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658ee217169b1ce38fca35fb556a8abdd4494ef7c3cc1ba1eaa5b0d794e109887d758d33a4619e99d0cc9fa24b059", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러1(119.206) (119.206)", "text": "왜진?", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 09:03", "comment_id": "comment_li_24057959", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(14.37) (14.37)", "text": "경영효율면에선 저말이 백번 맞지만 동시에 그 그룹만이 보유한 USP라는것도 있는법인데. 당장 저 유튜버도 신멘테이 보유 그룹이란거때문에 흥미를 갖게 되고. 기존 브랜드에 통합시킨다고 해서 매출이 더 오른다는 백퍼센트의 보장도 없는데 차라리 그룹산하에 유니크하고 명망있는 브랜드를 계속 운영하는거 가치로도 기업가치와 시장 내 차별성을 얻기엔 충분하지 않나. 고작 8점포뿐이면 관리난이도도, KPI 달성 커트라인도 낮아져서 사실상 지속운영의 리스크는 없을텐데. 오히려 일괄적인 브랜드만 운영하는거로 타 그룹대비의 차별성을 스스로 없애고 획일화하는게 당장 소비자들 눈에 특이하게 띄는게 중요한 시장에서는 이미지상으로는 로스아님? 잘쳐줘도 제로섬일텐데 굳이 밀어붙일 필요가 있나 모르겠네.", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.14 09:07", "comment_id": "comment_li_24058063", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "Ketron", "text": "신멘테이 보유 그룹이라는 이미지는 모르겠고 일단 점포 늘려서 수익 더 뽑는거는 저 여자말대로 일관적인 브랜드 밀어붙히는게 더 잘되니깐 그럼그 이후 후폭풍은 자기는 단기수익 성과로 승진하고 그 후임이 떠맡는거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 09:14", "comment_id": "reply_li_24058277", "parent_comment_id": "comment_li_24058063", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "Kws0420", "text": "ㅇㅇ 얼굴마담으로 꽤 유용할텐데. 아마 저 여자 자기 실적 쌓고 이직파고 팽시키려는 전략도 있는듯. 실적쌓은훈는 알바없으니  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 09:19", "comment_id": "reply_li_24058373", "parent_comment_id": "comment_li_24058063", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(218.39) (218.39)", "text": "신멘테이 8점이 이미 흑자가 나고있는 상황이기 때문에 새 브랜드로 물갈이하는게 오히려 리스크임 ㅇㅇ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 09:49", "comment_id": "reply_li_24059008", "parent_comment_id": "comment_li_24058063", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(222.232) (222.232)", "text": "카즈후미가 특별한 케이스인 거지 \"신멘테이 보유 그룹\"이라는 거 따위는 라면오타쿠들이나 알아주는 건데 정작 그 라면오타쿠들이 별로 도움 안 된다는 묘사는 1부부터 계속 나왔음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 10:46", "comment_id": "reply_li_24060401", "parent_comment_id": "comment_li_24058063", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러13(59.9) (59.9)", "text": "화이트칼라판에서는 나중에 일이 터지든 말든 내가 승진하면 그만이라ㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 10:49", "comment_id": "reply_li_24060502", "parent_comment_id": "comment_li_24058063", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.146) (121.146)", "text": "@ㅇㅇ(222.232) 그럼 신멘테이는 그대로 가져가고 새로운 브랜드프차를 하는게 낫지 않나? 잘되가는 패를 엎고 도박수를 할이유가 잇나 ㅋㅋ 신멘테이가 파리가 날리는것도 아니고 그냥 대기업 프차 전체 매출에 비해서 저 8개 매출로는 부족하다 이건데 ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 10:52", "comment_id": "reply_li_24060612", "parent_comment_id": "comment_li_24058063", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "뷔르거브로이켈러", "text": "@ㅇㅇ(121.146) 이게 맞음 대다수기업이 저런 상황이면 굳이 리스크 져가면서 없에지는 않고 자연사장 될 타이밍까지 기다림  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 11:04", "comment_id": "reply_li_24061095", "parent_comment_id": "comment_li_24058063", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.146) (121.146)", "text": "@뷔르거브로이켈러 그냥 간단하게 생각해서 신멘테이는 충성도 높은 라면오타구 고객이 있는 상태에 신규 고객들 유입이 잘되서 매출이 유지가 잘되는데 이걸 엎어버리고 라면오타쿠는 버리고 신규 라이트계열 손님들만 유치하겠다 이런거 기안 올리면 사장한테 빰처맞지 않나? ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 11:07", "comment_id": "reply_li_24061237", "parent_comment_id": "comment_li_24058063", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "뷔르거브로이켈러", "text": "@ㅇㅇ(121.146) 기업의 매출기준에 안 맞으면 출구전략을 사용해야 하는 건 맞음 근데 저건 니 말대로 그저 기업의 기준을 충족하지 못했을 뿐이지 바로 없에기에는 리스크가 큼 그래서 이 사업이 자연스레 시들고 없어지는 시기를 기다려서 닫아버리는 거임  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 11:13", "comment_id": "reply_li_24061397", "parent_comment_id": "comment_li_24058063", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(59.7) (59.7)", "text": "꽤 더러운 이야기인데 저런식으로 승진경쟁을 하는 회사 놈들은 장기적인 이득 같은거 생각 안 함 왜냐하면 지가 승진하고 담당 넘기고 나면 그 후에는 지 책임이 아니거든 저런게 좀 심하게 말하면 똥주머니 차고 스키드 마크 남기는거나 다름없음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 11:17", "comment_id": "reply_li_24061559", "parent_comment_id": "comment_li_24058063", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(121.146) 성장률 파먹자너 실적에서", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 11:29", "comment_id": "reply_li_24062021", "parent_comment_id": "comment_li_24058063", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(121.146) 회사가 신사업 성장률 15프로인데 기존사업 2프로입니다 하면 당장 자본 빼서 신사업에 부으라고 함막말로 기존 라면집 에이스들로 공장 퀄리티 올리면 안됨? 하는게 재무쟁이임", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.14 11:30", "comment_id": "reply_li_24062072", "parent_comment_id": "comment_li_24058063", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "당장 그 카즈후미가 치바 못알아보는데, 가치가 없어진다는 거겠지  - dc App", "is_reply": true, "dccon": "", "comment_img":
