는건 양반이다90년데에는 걍 묶어놓고 가둬놓고 부모들 퇴근할때 돌려주고 그냥 아기보관소였음", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1kh8qddDxawqKFx2jDIjjO_Fi0l56BDD7", "date": "09.18 20:58", "comment_id": "comment_li_21296456", "parent_comment_id": ""}, {"writer": "ㅇㅇ(121.159) (121.159)", "text": "딴건 몰라도 보육쪽이면 햇제 교사가 쳐패면서 말렸어야지 ㅋㅋㅋㅋ 이걸 쳐 방관하노 ㅋㅋㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.18 21:00", "comment_id": "comment_li_21296511", "parent_comment_id": ""}, {"writer": "ㅇㅇ(222.232) (222.232)", "text": "그 정도로 학생들이랑 가까이 지내는 건 아니니까 별 수 있겟너 과거에 무슨 일이 있어가지고 일부러 거리 둔다는 뉘앙스의 묘사가 계속 나오는데", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 21:03", "comment_id": "reply_li_21296661", "parent_comment_id": "comment_li_21296511"}, {"writer": "ㅇㅇ", "text": "16페이지 진짜 숨이 턱 막히네선생이 보육교사가 여학생 톱10에 든다면서도 인력부족이라는 모순적인 말에 직업 난이도가 함축된 느낌", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1x47u6QHsM5N5f-WYR0eOEG-Krr5Nhl1X", "date": "09.18 21:00", "comment_id": "comment_li_21296519", "parent_comment_id": ""}, {"writer": "ㅇㅇ(222.232) (222.232)", "text": "보육교사 \"지망\"이 여학생 톱10이라니까 실습 같은 거 나갔다가 나가 떨어지는 거지 씹헬이라는 뜻인 건 맞지만 모순적인 건 아님", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 21:04", "comment_id": "reply_li_21296719", "parent_comment_id": "comment_li_21296519"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(222.232) ㅇㅇ 실습만으로도 떨어져 나갈 정도로 이상과 현실의 괴리가 심하다는걸 말하고싶었음. 다른 직업은 어지간하면 버텨내면서 하니까", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1x47u6QHsM5N5f-WYR0eOEG-Krr5Nhl1X", "date": "09.18 21:13", "comment_id": "reply_li_21297153", "parent_comment_id": "comment_li_21296519"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ 근데 보육교사가 현실에 부딪혀봐야 직업의 명암을 말하기 딱 좋은 직업인듯. 꿈이랑 현실은 다르니까", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1x47u6QHsM5N5f-WYR0eOEG-Krr5Nhl1X", "date": "09.18 21:15", "comment_id": "reply_li_21297261", "parent_comment_id": "comment_li_21296519"}, {"writer": "ㅇㅇ(222.232) (222.232)", "text": "풀타임 파트타이머라는 말이 있을 수가 있는 거냐", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.18 21:02", "comment_id": "comment_li_21296616", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "살짝 역전앞느낌", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1x47u6QHsM5N5f-WYR0eOEG-Krr5Nhl1X", "date": "09.18 21:03", "comment_id": "reply_li_21296664", "parent_comment_id": "comment_li_21296616"}, {"writer": "만갤러11(58.122) (58.122)", "text": "개꿀직업이 어딨다고 이것도 하지마라 저것도 하지마라 시발 뭐 어쩌라고 기생수로 살까?", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.18 21:03", "comment_id": "comment_li_21296668", "parent_comment_id": ""}, {"writer": "ㅇㅇ(118.38) (118.38)", "text": "만화를 좀 읽어라선생은 하지말라고한 적 없음직업의 명암을 더 신중하게 보고 결정하라는 말만 계속 하는중이지", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 21:07", "comment_id": "reply_li_21296906", "parent_comment_id": "comment_li_21296668"}, {"writer": "ㅇㅇ(49.142) (49.142)", "text": "대댓이 정확히 말해줬네 리스크를 파악한 상태로 고르라잖아", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 21:10", "comment_id": "reply_li_21297057", "parent_comment_id": "comment_li_21296668"}, {"writer": "ㅇㅇ(1.239) (1.239)", "text": "@ㅇㅇ(118.38) 꿈이라는 새끼중에 명암 안보는 새끼가 어딨음 기관사 하는 새끼가 사고날수있는거 몰랐을거같음?? 아이돌 실패가능성 더 큰건 모르겠음?? 근데 어차피 리스크 없는 직업이란건 없고 자기한테 닥치기 전까진 그게 실제로 일어날거라고 생각 안함 그냥 당연한거임 학생입장에서 포기하라고 했제 이렇게 느낄 수 밖에 없는게 그거 직업으로 삼으려는 새끼들은 이미 아는얘긴데 안좋은 얘기 들고와서 딴거해라잉 하는걸로밖에 안들리는거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 23:18", "comment_id": "reply_li_21303492", "parent_comment_id": "comment_li_21296668"}, {"writer": "ㅇㅇ(1.239) (1.239)", "text": "@ㅇㅇ(118.38) 결국에 자기가 원하는 일이면 부딧혀봐야 아는거고 교감이 조금 극단적인것처럼 그려졌지만 저게 표현이 저래서 그렇지 꿈을 향해 가는 애들한텐 저게 맞음 애들이 뭐 리스크 설명 안해줘서 부딧혔다가 깨지냐 나도 아는데 난 성공한다고 이러다가 부딧히는거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 23:20", "comment_id": "reply_li_21303595", "parent_comment_id": "comment_li_21296668"}, {"writer": "ㅇㅇ(210.104) (210.104)", "text": "@ㅇㅇ(1.239) 이 문제는 정답이 없는 문제임사람은 좋아하는것에 대해 냉정히 보지못함 애새끼라면 더더욱 그렇고애초에 선생은 진로상담 몇번으로 사람 생각이 바뀌고 인생진로가 바뀌지않는다는걸 알고있고대부분의 사람이 원하는꿈을 이루지 못한다는걸 깨닫는 미래에 무너지고 넘어진 자리에서 다시 일어나야한다고 이야기하고 있음", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.19 02:50", "comment_id": "reply_li_21313943", "parent_comment_id": "comment_li_21296668"}, {"writer": "ㅇㅇ(222.232) (222.232)", "text": "보육교사라는 게 자기가 좋아하는 애들 우쭈쭈해주는 직업이 아니라는 현실에 부딪히겠네 어디까지나 교사니까 막짤 할카스처럼 훈육도 해야 되는 건데 애들을 좋아하니까 그게 스트레스일 거고", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.18 21:07", "comment_id": "comment_li_21296897", "parent_comment_id": ""}, {"writer": "만갤러13(221.151) (221.151)", "text": "선생 저새낀 학생들 모든꿈에 부정적임빨리 교감이 참교육 해줬으면 좋겠음", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.18 21:11", "comment_id": "comment_li_21297092", "parent_comment_id": ""}, {"writer": "ㅇㅇ(210.104) (210.104)", "text": "같은만화 보는게 맞는건지 의심스러울만큼 지능낮은새끼들 존나많음 선생은 비판적으로 한번 보라는거지 하지말라고는 한마디도 안했는데ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.18 21:12", "comment_id": "comment_li_21297134", "parent_comment_id": ""}, {"writer": "ㅇㅇ(210.104) (210.104)", "text": "억까는 시발롬들아 현실이 억까야 실제가 더 좆같에", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.18 21:13", "comment_id": "comment_li_21297163", "parent_comment_id": ""}, {"writer": "만갤러15(58.29) (58.29)", "text": "막짤 저거 이미 예전에 사고 난 걸 경험해서 나온 극약 처방 같은데 주인공 저 년 난 달라 이 지랄 하다 사고 나서 좆 되겠노 ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.18 21:15", "comment_id": "comment_li_21297298", "parent_comment_id": ""}, {"writer": "ㅇㅇ(210.104) (210.104)", "text": "좆찐따 망상만화만 보는 새끼들이라 현실꼬집는 불편하게 만드는만화는 못보는듯에피소드들 보면서 오히려 결말은 따뜻하다고 느꼈는데", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.18 21:15", "comment_id": "comment_li_21297305", "parent_comment_id": ""}, {"writer": "ㅇㅇ(118.38) (118.38)", "text": "결혼한 캐릭터보고 걸레라고하는 새끼들한테 정상적인 리뷰를 바라면 안되는거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.18 21:4
