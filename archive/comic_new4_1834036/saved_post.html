source": "", "comment_media_version": 2}, {"writer": "미래의짬봊", "text": "", "is_reply": true, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658ea24750c697833985aadf470660c81b0b15d830e30efe6ff6a13d8616e980228a6d9f2f9f8b317640bf09362609b", "comment_img": "", "date": "05.23 08:48", "comment_id": "reply_li_5527886", "parent_comment_id": "comment_li_5495927", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658ea24750c697833985aadf470660c81b0b15d830e30efe6ff6a13d8616e980228a6d9f2f9f8b317640bf09362609b", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "바로 위에 님이 주장하는 정신성별이 뇌성이라고 말했고, 뇌도 몸의 일부니까 그 뇌성도 몸이 여자로 바뀌었다면 똑같이 여자로 바뀌는게 옳다고 몇번이나 강조해서 얘기한거 같은데, 지금 님은 이 얘기는 듣지도, 읽지도 않고서 '정신성별'은 있어 라고 얘기하고 있네요, 이미 님이 말하는 정신성별은 뇌성이라고 말했고, 이건 처음부터 있다고 누누이 얘기하고 있잖아요 좀 덧글을 읽고 달라니까??", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.23 09:25", "comment_id": "reply_li_5528931", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그리고 어차피 몸도 마음도 여자일거면 ts를 왜보냐는건 시발 말이 되는소리입니까? 그럼 톰보이물은 왜보는데요? 처음부터 선머슴짓 안하고 여자처럼 굴면 되는데? 성장물은 왜봐요? 어차피 강해질거 처음부터 끝판왕 찢고 히로인 따먹으면 그만인데, 이게 무슨 논리입니까? 이건 그냥 욕하는거죠 말이 되는 소리를 좀 하세요", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.23 09:27", "comment_id": "reply_li_5528994", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "ts물이 좋은 이유는 톰보이물처럼 서서히 암컷타락해가는 맛으로 보는거라고 충분히 앞에 설명 다했는데 이제와서 그걸 왜 보냐? 이러면 진짜 할말이 없어지구요 그리고 지금 트랜스젠더 얘기를 하시는데 님 말마따나 트랜스젠더는 몸의 성별이랑 뇌성(님이 말하는, 과학자가 인정했다는 정신성별)이 일치하지 않는 사람들이죠? 진짜 몇번을 얘기하는지 모르겠는데요 몸은 뇌랑 따로 있는겁니까?? ts물의 주인공이 원래 트랜스젠더(몸, 뇌성 불일치)인게 아니잖아요? 그럼 상식적으로 몸이 여자로 변했을때 몸과 뇌성이 일치한 여성이 되는게 맞는겁니까? 아니면 어떤 연유에서인지, 몸의 일부임에도 불구하고 왜 유독 어째서인지 뇌성만큼은 남자로 남아 갑자기 트랜스젠더가 되는게 맞는겁니까??", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.23 09:30", "comment_id": "reply_li_5529119", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "같은 논리하에 TS는 트랜스젠더랑 다른겁니다 님의 얘기를 읽어보면 그냥 TS는 게이다, 트랜스젠더다, 어차피 사람들이 TS물 보는건 다 여자 주인공에 이입해서 보는 두창물이잖아 그러니까 두창이 맞아 라고 애초에 결론부터 내려놓고, 그게 왜 두창인지, 어떤 연유에서 두창인지, 두창인 이유가 뭔지는 하나도 설명하지 않고 단순히 님 생각을 적어놓는거에 가깝다고 봐요 아니면 설명을 해보세요  왜 몸이랑 뇌성이 일치하는 멀쩡한 남자가 멀쩡한 여자로 TS가 되었는데 , 유독 뇌(님이 말하는 정신성별)만큼은 몸의 일부임에도 불구하고 남자로 남아 트랜스 젠더가 되어야 하는지??", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.23 09:32", "comment_id": "reply_li_5529198", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "님 지금 뇌성이 뭔지도 모르는거 같은데 성별은 '몸'과 '뇌'에 의해서 결정나는거에요(님이 말한 과학자가 인정한 부분이 이부분이고) '영혼'같은게 아니라", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.23 09:33", "comment_id": "reply_li_5529241", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "진짜 다시한번 말하지만 일단 덧글을 다 읽고 나서 얘기를 하세요 이미 다 적어놓은 부분, 설명한 부분, 얘기한 부분 또또또또 다시 설명하게 만들지 말고", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.23 09:35", "comment_id": "reply_li_5529294", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그리고 ts는 설정마다 다르지만 현실의 트젠 수술이랑은 애초에 근본이 달라요 트젠 수술은 그냥 이성의 몸에 가깝게 현재의 몸을 '성형'하는거구요 ts는 판타지적인 요소로 인해 마법처럼 여자로 바뀌는 식인데 이걸 어떻게 동일선상에 놓나요? 노벨피아에서 ts물 2~3개만 읽어도 이딴 헛소리는 못할텐데 님 애초에 ts물 읽어본적도 없죠? ts물에 대해서 모르는데 어떻게 ts물에 대해서 논할수가 있나요?? 원피스 안보고 원피스 캐릭터 설명하는거랑 뭐가 달라요??", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.23 09:37", "comment_id": "reply_li_5529365", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "뇌성도 결국 신체적 성별이기에 정신적 성별과는 관계가 없다 판단됩니다 저도 영혼의 존재를 확실히 믿진 않지만 영혼이 존재하지 않는다 해서 사람의 사고가 사라지는 것은 아니기에 몸과 뇌와 호르몬이 모두 바뀐다 해도 사고는 여전히 남습니다 이로 인해서 자신의 신체적 성별과 정신적 성별의 괴리가 발생할 수 있고 결국 남자였다는 사실은 남기에 완전히 자신을 여성이라 인식하기 전까지의 과정에서는 두창이라 인식될 여지가 있습니다", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.23 23:53", "comment_id": "reply_li_5562549", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "그리고 당신의 주장은 ts물을 보는 방법이나 이입요소에 대해 너무 편중된 시각을 보입니다 꼭 그런방식으로 작품을 보는게 옳다고 생각되진 않습니다", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.23 23:56", "comment_id": "reply_li_5562725", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "댓글돌이", "text": "", "is_reply": false, "dccon": "", "comment_img": "", "date": "", "comment_id": "comment_li_0", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "오냐 덤벼랏  - dc App", "is_reply": false, "dccon": "", "comment_img": "", "date": "05.22 17:40", "comment_id": "comment_li_5496030", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "Lupinus", "text": "", "is_reply": false, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65fef2d6e66356576f8f5446b396fe7033a7f3d75b47e45f1e7811ac8c9846fc2232e2a699ac7b2", "comment_img": "", "date": "05.22 17:46", "comment_id": "comment_li_5496307", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b65fef2d6e66356576f8f5446b396fe7033a7f3d75b47e45f1e7811ac8c9846fc2232e2a699ac7b2", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러8(118.235) (118.235)", "text": "갓본은 정신적 bl이라 하니까 ts는 bl의 파생이 맞음 ㅅㄱ  - dc App", "is_reply": false, "dccon": "", "comment_img": "", "date": "05.22 17:47", "comment_id": "comment_li_5496340", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러9(118.235) (118.235)", "text": "댓글보면 알겠지만 이런거 좋아하는 애들한테 두창이라하면 존나긁힘...참나몸이변했으면여자인거지이상한소리하네저거보고두창이라는니들이두창임어쩌구저쩌구...", "is_reply": false, "dccon": "", "comment_img": "", "date": "05.22 17:53", "comment_id": "comment_li_5496756", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그래서 이성애자인 남자가 여자로 변했는데 이성애자가 아니라 갑자기 동성애자가 되는 이유가 뭔데?", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:54", "comment_id": "reply_li_5496863", "parent_comment_id": "comment_li_5496756", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러9(118.235) (118.235)", "text": "그냥 남자가 여자로 변해서 남자한테 박히는거 그 자체가 역겨운거임...뭔 정신적bl이니 육체적 이성애니 그런거 떠나서...왜 여자가되서 남자한테 박히는걸 좋아하는지 생리적으로 역겨움", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:56", "comment_id": "reply_li_5496991", "parent_comment_id": "comment_li_5496756", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "여자가 남자랑 박히는걸 보는게 왜 역겨우냐면 니가 정신성별같은 두창적 헛소리를 진심으로 믿고 있으니까 그게 계속 연상되니 역겨운거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:59", "comment_id": "reply_li_5497140", "parent_comment_id": "comment_li_5496756", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "이전에 남자였잖아 라는건 그냥 톰보이 여자애가 어릴때 남자처럼 같이 뛰어놀고, 마냥 친구처럼 굴던거의 극단적인 연장선밖에 안되는 설정인데 그 양념 하나에 얽매여서 정신성별이니 '원래 남자' 였다느니", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:00", "comment_id": "reply_li_5497188", "parent_comment_id": "comment_li_5496756", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "역겨운건 거기에 유독 얽매이는 니 두창사고지 ts가 아니라", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:00", "comment_id": "reply_li_5497203", "parent_comment_id": "comment_li_5496756", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러9(118.235) (118.235)", "text": "아니 일반적으로 역겨운거임... 남자로 태어났는데 왜 여자가 돼서 남자한테 박혀야댐...", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:00", "comment_id": "reply_li_5497226", "parent_comment_id": "comment_li_5496756", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "ts는 톰보이와 결이 같기 때문에 근본이 남자가 아니라 여자라고", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:02", "comment_id": "reply_li_5497305", "parent_comment_id": "comment_li_5496756", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "'남자가 여자가 된다'가 아니라 '여자가 이전에 남자였다' 라고 톰보이가 '남자같았던 애가 여자처럼 됐다' 인것처럼 주체가 남자가 아니라 여자에 있는거라고 아오", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:02", "comment_id": "reply_li_5497346", "parent_comment_id": "comment_li_5496756", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러9(118.235) (118.235)", "text": "톰보이 여캐는 채이도록 많지만남자가 뷰지돼서 남자한테 박히는 여캐가 적은건둘사이에 형언할 수 없는 차이가 있어서 그렇지 않을까요..?", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:03", "comment_id": "reply_li_5497371", "parent_comment_id": "comment_li_5496756", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "ts가 마이너한 장르인건 맞지만 그렇다고 해서 장르의 근간이 뒤바뀌는건 아니에요 님아", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:04", "comment_id": "reply_li_5497426", "parent_comment_id": "comment_li_5496756", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "ts가 톰보이 여캐에 비해 그 수가 적으니 톰보이 여캐와는 다른 근원을 가지고 있다 라는 논리가 어떻게 적용되는지 모르겠네요 그럼 지금 나오는 럽코식 가벼운 백합은 정통백합이 아니니까 백합이 아닌가요?????????????", "is_reply": true, "dccon": "", "comment_ , {"writer": "WELC0ME", "text": "미하리 ㅇㄷ?", "is_reply": false, "dccon": "", "comment_img": "", "date": "05.23 18:27", "comment_id": "comment_li_5547796", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(222.232) (222.232)", "text": "호모잖아", "is_reply": false, "dccon": "", "comment_img": "", "date": "05.23 21:43", "comment_id": "comment_li_5556357", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "두창토론 가슴이 웅장해진다...", "is_reply": false, "dccon": "", "comment_img": "", "date": "05.24 16:22", "comment_id": "comment_li_5594451", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "그런데 저 장면은 캐릭터가 아직 자신을 남자라고 인식하니 두창야스가 맞는것 같습니다 나중에는 변하겠지요", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:22", "comment_id": "reply_li_5498442", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "맞아 변화계의 특징이 초반에는 아직까진 남자의정신이남아있을때지 그래서 ts암타보는 독자들도 ts하자마자 바로 남자랑 이어지는 하이패스트암타는잘안보고 빌드업을 통해서 점점 여성의 정신이되어가는 그런쪽 암타를 많이보는거지내말은 그거임 이미 암타가(여자로서의 자신을 받아들임) 완료되어서 여성의정신을가지고있고 여성의육체를 가진 사람이 남자랑 이어진다고해서", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:25", "comment_id": "reply_li_5498688", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그게 bl은 아니라는거임 결론적으로는 여자랑 남자가 맺어진건데 그걸 노멀로 보는 시선이 맞다는게 내 주장임", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:26", "comment_id": "reply_li_5498745", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(39.7) (39.7)", "text": "컨셉 잘잡았네 ts가 두창인걸 역으로 설득하는중임 ㄷ", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:28", "comment_id": "reply_li_5498879", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그니깐 창고닉의 주장은 빌드업있는 ts암타가 bl은 아닌데 저렇게 바뀌자마자 덮치려드는건 약간 그런쪽 끼가느껴진다는거지? 나도 빌드업없이 저러는건 좀그렇긴해 굳이 더싸울필요도없을듯 어느정도 정리된거같은데", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:29", "comment_id": "reply_li_5498898", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "정리하자면 여성의정신으로 암타완료한 ts녀가 남자랑 사귀는건 노멀이다 대뜸 여자로바뀌자마자 남자 덮치는건 약간 그런느낌이 드는 끼가있다 이거인거지?", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:30", "comment_id": "reply_li_5499010", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "근데 나도 이렇게 말하는건 의견이 납득이가는데 대뜸 ts는 bl이야 이러는건 좀 긁혀서 그럼 양해좀", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:32", "comment_id": "reply_li_5499126", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "같은 ts독자로서 좋은의견 나눌수있어서 유익한시간이었음 이제 노피아 ts신작 암타물읽으러가야지 좋은하루보내고 저녁맛있게드삼~", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:40", "comment_id": "reply_li_5499540", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "저도 ts와 bl은 근간이 다른 장르라고 생각합니다 완성된 bl은 결국 몸과 마음이 남자인체 남자를 좋아해야하기 때문이죠 ts가 어느정도 bl의 성격을 가지는건 몸은 여자이지만 마음은 남자인체 남자와 가까워질때의 내용때문이라 생각됩니다하지맘 암컷타락한다면 남자였다는 사실은 남더라도 결국 순애라 볼 수 있죠ts물은 보는 독자도 그냥 남자가 여자가 되서 남자 좋아하게 되는게 재밌어서 보는 부류와 저처럼 주인공같은 ts녀가 되고 싶다고 생각하며 보는 부류가 있겠지요 결국 캐릭터와 독자의 생각에 따라 두창인가 아닌가는 달라진다고 볼 수 있습니다", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:46", "comment_id": "reply_li_5499930", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(59.151) (59.151)", "text": "여기 댓글쓴이가 하는 말이 구구절절 맞구만 무뇌충들 억지논리로 헛소리 하는거 역하네", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 19:36", "comment_id": "reply_li_5502151", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅁㄴㅇㄹ(119.201) (119.201)", "text": "암캐는 TS시켜도 암캐  - dc App", "is_reply": false, "dccon": "", "comment_img": "", "date": "05.22 17:30", "comment_id": "comment_li_5495508", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러7(220.76) (220.76)", "text": "TS순애가 두창인건 너무나도 자명한 사실", "is_reply": false, "dccon": "", "comment_img": "", "date": "05.22 17:38", "comment_id": "comment_li_5495927", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러7(220.76) (220.76)", "text": "정신이 남자이고 남자와 사귀는건 BL이고, 육체가 여자이고 남자랑 사귀는건 로맨스물. 태생이 여성향임", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:39", "comment_id": "reply_li_5495990", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "미안한데 정신성별 같은건 없어", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:44", "comment_id": "reply_li_5496185", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "몸이 여자로 변했으면 당연히 뇌도 여자로 변하는거지 두창은 너 아님???", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:44", "comment_id": "reply_li_5496212", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러7(220.76) (220.76)", "text": "참고로 일본쪽에는 아예 정신적BL이라는 태그도 있음", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:46", "comment_id": "reply_li_5496297", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그럼 남자가 임신하는 오메가버스 같은것도 태그로 존재하면 설득력 있는거임?", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:49", "comment_id": "reply_li_5496497", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "누가 그걸 모르는줄 아나", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:49", "comment_id": "reply_li_5496511", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "태그가 있다고 그게 맞는다는 식으로 말하면 뭐 어쩌라는건지 모르겠다 정신적 bl이라는 말 자체가 애초에 병신같은 말인건데", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:50", "comment_id": "reply_li_5496550", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그래서 이성애자 남자가 여자로 변했으면 그대로 이성애자 여자가 되어야지 왜 뜬금없이 동성애자가 되는건데? 정신적 bl이 어쩌고 하기 전에 애초에 정신성별 같은건 없다고 두창아", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:51", "comment_id": "reply_li_5496665", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "몸이 여자로 변했는데 정신이 남자잖아요 그러니까 정신적 bl이에요 라는 말 자체가 두창적인 사고방식 아니냐고", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:52", "comment_id": "reply_li_5496692", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "몸이 변했으면 정신도 따라서 여자가 되는거지 뭔 헛소리를 하고 있어", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:52", "comment_id": "reply_li_5496720", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러7(220.76) (220.76)", "text": "이게 댓글 9개를 연달아 달 정도로 존나 긁힐만한 주제라는건 이해했다", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:55", "comment_id": "reply_li_5496882", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러7(220.76) (220.76)", "text": "앞으로도 TS순애 두창설을 열심히 밀게!", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:55", "comment_id": "reply_li_5496926", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그래서 정신적 bl인 이유가 뭔데 태그가 있으니까 말고 설명을 해보라고", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:56", "comment_id": "reply_li_5496943", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "뭐라 말은 못하겠고 긁? 이지랄만 하고 있네", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:56", "comment_id": "reply_li_5496962", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러7(220.76) (220.76)", "text": "뭐 재밌는 얘기라서 평소에 궁금했던거 물어봄. 일단 독자가 남자라고 가정하자. TS순애는 원래 남자인 캐릭터가 여자로 바뀐 후 남자를 좋아하게 되는거지. 다음으로 이야기를 보는 일반적인 두 방법인 이입과 관찰 관점에서 먼저 이입 관점에서 생각해보자. 남자에서 여자로 변한 캐릭터에 이입한 남자 독자가 남자 캐릭터를 좋아한다. 정신성별 말고 더 적절한 설명인듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:02", "comment_id": "reply_li_5497345", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러7(220.76) (220.76)", "text": "관찰 시점에서는 여자주인공에 남자조연이니 로판이라는거고", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:03", "comment_id": "reply_li_5497367", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "님아 ts보면서 남자였던 내가 여자가 되서 박히는게 좋아 라고 이해하는건 두창이 맞구요 이런 두창새끼들 때문에 ts가 오해를 많이 받는데 ts라는 장르 자체는 그런 장르가 아니라구요 관찰형은 애초에 여캐보는거랑 차이가 아예 없으니 말할것도 없고", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:07", "comment_id": "reply_li_5497560", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "스포츠물에 남캐만 줄창 나온다고 그게 게이물이 되는건 아니잖아요 그냥 폐녀자들이 두창물로 만들어서 보는거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:07", "comment_id": "reply_li_5497575", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "두창이라는 말 오지게 듣는 하이큐도 정작 만화는 그냥 멀쩡한 스포츠물인데 폐녀자들이 하이큐를 두창물로 취급하고 본다고 해서 하이큐가 진짜 두창물이 되는건 아니잖아요 그렇죠????", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:08", "comment_id": "reply_li_5497616", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.49) (211.49)", "text": "정신적성별을 지지하는 pc충이십니까?", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:09", "comment_id": "reply_li_5497667", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러7(220.76) (220.76)", "text": "남캐 주구장창 나오는게 두창이 아닌건 옛날얘기고 요즘은 아예 두창 노리는게 맞는거 같은데. 페녀자들이 좋아할법한 잘생긴 남캐들만 주구장창 나오잖아?", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:11", "comment_id": "reply_li_5497802", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "하이큐는 스포츠물이고 저건 ts야스인데 당연히 다른거 아닐까요", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:13", "comment_id": "reply_li_5497876", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.49) (211.49)", "text": " _img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "뭉게려들지마세요 그래서 여자로 변했으면 몸도 뇌도 여자가 되는게 당연한건데 왜 정신적 bl이고 왜 유독 정신만 남자로 남아있냐고", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:21", "comment_id": "reply_li_5498407", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "ts순애에서 주인공이 박힐 때 나도 주인공한테 박고 싶다고 생각하지 박히고 싶다고 생각하진 않는데 이럼 게이 아님?", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:21", "comment_id": "reply_li_5498411", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그럼 다른 남캐에 이입을 하면 되죠 뭔 말같지도 않은 소릴 하고 있어", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:22", "comment_id": "reply_li_5498472", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "당연히 ts순애에서 ts녀 주인공이 박히면 나도 주인공한테 박고 싶다고 생각하지 시팔 근데 이걸 꼭 반대로 생각하는 두창새끼들이 꼭 있어서 ts를 두창물로 오해하는데 그건 그냥 그새끼가 병신 두창새끼인거고 ts라는 장르는 두창이 아니라고 몇번을 말해", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:23", "comment_id": "reply_li_5498571", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "몸도 뇌도 여자라도 자기자신을 아직 남성으로 인식한다면 그건 두창이라고 할 수 있습니다 자신을 여성으로 인식하는 순간부터는 다르겠죠 하지만 자신이 남성에서 여성으로 변했다는 사실은 남겠죠", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:24", "comment_id": "reply_li_5498588", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그리고 ts녀에 이입하기 힘들면 감상을 하던가 애초에 ts물은 주인공에 이입하기보단 관찰 스탠스로 보는거에요 왜 이입을 해서 본다고 생각하지 시발??", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:24", "comment_id": "reply_li_5498621", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "ts볼 때 주인공 존나 꼴리네 ㅋㅋ 라고 생각하지 남주 너무 멋져 퓨ㅠㅠㅠ 이러진 않는데", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:26", "comment_id": "reply_li_5498703", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "님아 ts물에서 난 남자야! 하는 상태에서 남자랑 사귀는거 본적 있나요????? 남자였던 기억이 있어 처음엔 혼란스러워하다 결국 자신이 여자인걸 받아들인 상태에서 이어지지 않던가요???? 그럼 정상적인 남녀가 이어진거니까 두창이 아닌게 맞네요?????", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:26", "comment_id": "reply_li_5498724", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그리고 남자가 여자로 변했다는 사실이 남아서 두창이라는 논리를 펼거면 멀쩡한 톰보이 여자애가 어릴때 남자나 다름없이 행동했고 그런 과거가 남아 있으니까 사실상 정신적 bl 아니냐? 라는 논리랑 근본적으로 무엇이 다른가요???", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:27", "comment_id": "reply_li_5498783", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "원래 창작물에 주인공이 존재하는 이유는 그 주인공 시점으로 생각으로 이야기를 진행하는 이유는 첫번째 독자의 공감과 이입이기 때문입니다 ts물의 근간에는 결국 여자가 되고싶다라는 생각 나의 정신은 여자다라는 생각이 깔려있다고 볼 수 있죠 비록 작가가 제3자의 시점에거 관찰하는 것처럼 그것을 한다해도 작품에서 캐릭터의 생각을 전혀 알 수 없다면 혹은 이해가 가지 않는다면 인간들이 극을 진행하는 작품에서는 이해할 수 없는 내용이 되어버립니다", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:28", "comment_id": "reply_li_5498831", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러7(220.76) (220.76)", "text": "정신BL 인정 못하겠다고 하니 남자 독자가 잘생긴 남캐 나오는걸 좋아한다는 내용으로 정리해줬잖아. 주인공 정신성별 여성이어도 이건 일관된 논리임. 관찰 관점에서도 잘생긴 남캐 나오는걸 좋아하는거잖아. 이게 어떻게 두창이 아님??", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:30", "comment_id": "reply_li_5499021", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "여자가 되고 싶다 라는 부분이 오해라고 누누이 설명했는데 아직도 그딴 소릴 쳐하고 있네 그딴 생각을 하는놈이 두창이지 ts 좋아하는 사람은 기본적으로 주인공에 나도 저렇게 됐으면 좋겠다 라는 이입을 안한다고", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:31", "comment_id": "reply_li_5499047", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "톰보이는 자기자신이 언제나 여자였다는 사실은 변함없읍니다 자기가 자신을 여자로 인식하는지 남자로 인식하는지에 따라서는 조금 이야기가 갈리지만요 하지만 ts는 남자였다는 사실은 남습니다 자기자신응 처음부터 남자로 인식하던 남자->여자로 점점인식이 변화하던 간에 말이죠 이 인식의 변화안에서는 아직 두창의 요소가 있다고 볼 수 있습니다", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:32", "comment_id": "reply_li_5499077", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러7(220.76) (220.76)", "text": "아 대화의 전제가 잘못됐었을수도 있겠네 존나 못생긴 남캐 나와도 괜찮다는거면 두창 아닌거 맞는거 같음", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:32", "comment_id": "reply_li_5499083", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "다른분들께 이야기를 흐린다고 하시듯이 ts물 주인공에 이입해서 보는건 이상하다고 하는것도 논점흐리기 같습니다 저를 포함만 많은 ts암타단은 주인공에 이입해서 극중 내용을 보기 때문입니다", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:33", "comment_id": "reply_li_5499129", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그런 논리면 톰보이도 남자처럼 행동한 과거가 똑같이 남는다니까? 이미 설명한 부분을 반박하는게 아니라 말투만 바꿔서 헛소리를 똑같이하고 있네 진짜 백번 양보해서 설령 이 전제가 맞다고 치더라도, 그래서 결국 몸도 마음도 여자가 됐는데 왜 두창이라는 결론이 나는건데? 니말대로 그럼 이미 여자 아니냐?? 여자랑 남자랑 멀쩡히 잘 사귀었네?? 근데 왜 두창임??", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:35", "comment_id": "reply_li_5499248", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "ts주인공에 이입해서 남자한테 박히는거에 이입해서 나도 남자한테 저렇게 박히고 싶다 라고 생각하는건 두창이 맞다고 이미 말했습니다 흐린적 없어요 그런 두창들 때문에 ts라는 장르가 오해를 사고 있다는게 핵심 논지중 하나인데 덧글좀 읽어주세요", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:36", "comment_id": "reply_li_5499310", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "몸도 마음도 변하기 전에는 완전히 두창이 맞고 몸은 변했지만 마음은 아직 남자라고 생각한다면 약간만 두창이고 둘 다 변했다면 그건 순애입니다 톰보이는 이미 몸은 여자라는 전제가 있기때문에 정신적두창이라도 영향력이 적다고 사료됩니다", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:36", "comment_id": "reply_li_5499317", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "주인공에 이입하는건 두창이 맞다는 공감 감사합니다 하지만 ts라는 장르를 당신이 주인공에 이입하지않는다고 해서 모두가 그렇게 보는건 아니고 그러한 이미지가 잘못되었다고 생각되지는 않습니다", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:38", "comment_id": "reply_li_5499429", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "그리고 주인공에 이입하더라고 보는 사람의 마음은 여자 몸은 남자라면 그것도 톰보이와 비슷한 부류라고 볼 수 있습니다 물론 톰보이는 마음은 남자더라도 몸이 이미 여자라서 몸의 영향력이 더 크다 생각되기에 영향력이 적겠지요", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:40", "comment_id": "reply_li_5499567", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러7(220.76) (220.76)", "text": "남자가 나 아닌 다른 남자 나오는걸 좋아한다. 이 문장에 두창이 아닐 여지가 있나?? 뭔가 미사여구를 붙여도 이건 바뀌지 않는 사실이잖아", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:43", "comment_id": "reply_li_5499732", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "님 지금 말하는게 제가 말한거 다 수용하고 이해해버린거 같은데 왜 끝까지 그래도 아무튼 ts가 두창이라는 인식은 틀리지 않았다 같은 사족을 다시려드는건지 모르겠어요 ts가 마이너 장르고, 두창이라는 오해를 살수 있는 장르인건 맞지만 그렇다고 해서 그런 잘못된 인식을 가지는게 옳다, 이건 아니죠 인정할건 인정해요", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:48", "comment_id": "reply_li_5500057", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "전 그렇게 ts물의 주인공에 이입해서 보기에 이러한 독법이 두창이라는 의견은 저도 그렇게 생각합니다 하지만 그건 독자는 신체적인 면이 결국 남자이기 때문이죠 주인공는 이미 신체는 변했기 때문에 자신이 여성이라 생각한다면 그순간 두창의 요소는 없다고 봅니다", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:49", "comment_id": "reply_li_5500098", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그리고 220,76님 ts물은 기본적으로 이입하는게 아니라 게임 여캐 구경하듯이 관측하는거기때문에 다른 남캐가 나오면 그냥 히로인이랑 주인공의 성별 위치만 바뀐거지 주인공이 여자고 상대가 남자일 뿐인데 이게 왜 두창인가요? 말이 되는 소리를 좀 하세요 제발", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:49", "comment_id": "reply_li_5500147", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그러니까 '여자가 되면 여자가 된다' 내 말이 그거라고 이해 다했네", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:50", "comment_id": "reply_li_5500166", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "ts물의 주인공에 이입해서 보는건 어느정도 독자에게 두창의 요소가 있고 저를 포함하여 그런식으로 ts물은 보는 사람이 잘못되었다고는 생각되지 않습니다 무조건 이입해서 보는게 잘못되었다는 의견은 받아들일수 없네요", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:50", "comment_id": "reply_li_5500186", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "앞으론 두창이라고 하지 마시기 바랍니다", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:51", "comment_id": "reply_li_5500205", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "뭔소리야 이건 또", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:52", "comment_id": "reply_li_5500246", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "님아 ts주인공이 뭐 나쁜놈을 줘팬다거나 흔히 말하는 사이다나 보편적인 카타르시스를 느낄수 있는 부분에선 이입을 하든말든 문제가 없지만 '나도 남자한테 박히고 싶다'라는 식으로 이입하는게 두창이라고요", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:53", "comment_id": "reply_li_5500285", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "뭘 볼때 이입한다는 그 행위 자체가 잘못됐다는게 아니라", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:53", "comment_id": "reply_li_5500309", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "전 그런식으로 이입해서 보기때문에 독자에게 두창의 요소가 있다고 한겁니다 작중 주인공은 자신이 여성이라고 인식하는 순간 두창의 요소늠 없지요하지만 독자가 나도 주인공처럼 저렇게 하고 싶다라고 생각하며 이입하며 보는건 독자의 신체가 결국 남자이기 때문에 두창의 요소가 존재한다 생각합니다그리고 저를 비롯해 이러한 식으로 ts물은 보는 사람들이 잘못되었다고 생각하지 않으며 이로 인해 대외적으로 두창의 인식이 생기는건 어쩔 수 없다고 생각합니다", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:56", "comment_id": "reply_li_5500424", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "그리고 작품은 결국 작중 캐릭터의 인식과 독자의 인식이 합쳐져서 인지되기에 캐릭터가 자신을 여성이라 느껴도 독자에게 남자-> 여자로 변했다는 사실은 남기에 독자에게 두창의 요소가 있다고 생각하는건 어쩔 수 없는 부분이라 사료됩니다", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:59", "comment_id": "reply_li_5500587", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "이미 자신 스스로도 ts라는 장르가 근본적으로 두창이 아니라는 사실 자체는 이해한거 같은데 두창이라는 인식이 생기는건 어쩔수 없어 라는 식으로 얘기하네 장르 자체가 워낙 마이너하고 애초에 그런식으로 오해하고 그리는 사람도 워낙 많아서 그런 인식 생길수밖에 없는것도 오해가 생길수밖에 없는것도 이미 다 인정했고 맞는 말인데요 근본이 두창인건 아니니까 이제 두창이라고 얘기하지 말라구요", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 19:01", "comment_id": "reply_li_5500655", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그런 인식이 생기는게 어쩔수 없다고 해서 장르의 근간까지 그렇게 바뀌는건 아니잖아요 그렇죠", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 19:02", "comment_id": "reply_li_5500680", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "저도 근간이 두창이라 생각하진 않습니다만 여자가 된 캐릭터가 자신을 여자라고 인식하기 전에는 작품 내적으로도 아직은 두창의 요소가 잔재해있다고 생각됩니다 그 시기를 지나 자신을 여성으로 인식한다면 그러한 요소는 사라지죠 근간은 두창이 아니지만 그러한 요소가 0라고는 볼 수 없다고 생각됩니다", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 19:03", "comment_id": "reply_li_5500734", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "결국 ts물의 근간은 남자였던 인간이 여자로 바뀌어가는 과정과 바뀐후의 차이와 진행등이 메인이기 때문이에 바뀌어가는 과정에는 약간의 두창 요소가 있을 수 있다고 봅니다", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 19:05", "comment_id": "reply_li_5500823", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "님아 님 이미 제가 말한거 다 수용하고 인정한거나 다름 없잖아요 중간부터 'ts는 두창이다' 에서 'ts가 두창이라는 오해를 사는건 구조상 어쩔수 없으니까 내가 오해한것도 사실상 잘못없음' 식으로 주장이 완전히 바뀐것도 그렇고 지금 이렇게 계속 사족을 다는게 자존심 부리는거 밖에 더 되나요? 그리고 이제와서는 또또또 어떻게든 두창 요소 넣고싶어서 '과정은 두창'이라는 논리를 펴시는데 그럼 똑같이 여자가 되어가는 과정을 지닌 톰보이도 정신적 두창이 된다니까요? 왜 이미 얘기 다 끝난 논리를 자꾸 되살리려고 하시는거에요 ts가 두창이 아니라는 사실을 인정하게 되면 뭐 하늘이라도 무너지나요", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 19:09", "comment_id": "reply_li_5501017", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "이 이상은 솔직히 님 자존심 부리는거 듣는거밖에 안되는거같고 덧글 더이상 안달게요", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 19:11", "comment_id": "reply_li_5501072", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "ts물의 근간니 두창이 아니라는 사실은 저도 인정합니다 그리고 일부분 의견 수용해주셔서 감사합니다 하지만 톰보이의 예는 몸은 이미 여자고 정신은 남자인 상태라면 정신적 두창요소라고 볼 수 있다고 생각한다 말씀드렸고 ts물에 관한 제 논지와 주장도 변함없습니다결국 작중에서는 캐릭터가 어떻게 생각하고 자신을 어떻게 인식하는지가 중요하고 외적으로는 독자들의 독법 생각등이 영향을 끼치겠지요ts의 근간도 결론에도 두창는 없지만 과정에는 두창의 요소가 있을 수 있다 생각됩니다", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 19:13", "comment_id": "reply_li_5501165", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "님아 두창이라는게 뭡니까? 남자가 남자한테 박히고 싶다, 이 감정이 드는게 두창이죠? 근데 여자가 된 주인공, ts녀는 어떻습니까? 손이 맞닿아서 얼굴을 붉히더라도 그건 남자로서 붉히는겁니까 여자로서 붉히는겁니까? 여자인 몸으로 여자의 손을 여자의 마음으로 부딪혔으니까 이건 남녀간의 사랑이죠,   아닙니까? 아까부터 '과정이 두창이다'라는 새 논리를 찾은거 같은데 이 과정은 여자가 되어가는 과정, 그러니까 여성으로써 느끼는 감정인거지 같은 남성의 감정이 아니잖아요 이게 어떻게 두창이 됩니까???????", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 19:17", "comment_id": "reply_li_5501314", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "아무튼 제 결론은 ts와 두창이 엮이는것과 그러한 요소가 포함 될수도 있다는것이며 톰보이의 예시도 이미 정신적 두창의 요소가 될 수 있다 판단했습니다그리고 이렇게 두창과 ts가 관계되는게 잘못되었다 생각되진 않습니다저도 씹게이마음만은ts녀로서 이입식으로 작품을 감상하는게 잘못되었다 생각하지 않고 ts물은 두창과 관계없는 성역도 아니기 때문입니다", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 19:17", "comment_id": "reply_li_5501325", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "마찬가지로 ts와 근본적으로 동일한 톰보이도 '여성으로써의' 감정을 깨닫기 시작하는 과정이 핵심 부분인데 어떻게 두창이 됩니까????", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 19:18", "comment_id": "reply_li_5501350", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "그건 이미 신체적 여성으로서 정신적 여성화가 되었기 때문이지요 자신을 남자라 생긱하고 남자의 정신으로 야스를 한다면 그건 두창의 요소가 있다고 봅니다 꼭 야스가 아니더라도 다른 남성과 가까워질때 아직 남자라 자신을 인식한다면 신체적 여성으로서 행동한다 해도 두창의 요소가 남아있다는 사실은 부정하기 힘듭니다", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 19:20", "comment_id": "reply_li_5501461", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "앞서 말했지만 ts된 주인공이랑 상대 남자가 이어지는건 이미 주인공이 여자가 된 상태를 완전히 받아들인 상태 이후라고 말한거 같은데", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 19:22", "comment_id": "reply_li_5501531", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "톰보이도 자신을 남성이라 진지하게 인식한다면 이미 신체적 여성이라 정도는 덜할지 몰라도 여성으로 인식이 완전히 변하기 전까지는 두창의 요소가 있다 볼 수 있죠 그리고 전 두창의 요소와 ts의 근간 정신적 신체적 부분 과정 등등에서는 의견을 바꾼적이 없습니다", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 19:22", "comment_id": "reply_li_5501532", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "남성과 가까워질때 남성이라고 인식을 하는게 아니라 여성으로써 가까워지는거라고 방금 말했잖아 아니야? 톰보이나 ts녀나 상대랑 손끝 스쳤을때 어? 왜 가슴이 두근거리지? 하면서 얼굴 붉히는게 남성적인 사고라고? 누가봐도 여성적인 사고고 실제로도 그렇게 그려지고 쓰이잖아 이게 두창이라는건 솔직히 우기는거밖에 안돼요 님아", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 19:23", "comment_id": "reply_li_5501625", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "이어지는건 여성화 이후라도 가까워지는 과정에서는 그렇지 못한 경우가 대부분이기 때문입니다 저도 완전히 여성화되고 이어지는건 두창이라 생각하지 않습니다 단지 이전에 남자였던 적이 있을 뿐이지요", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 19:24", "comment_id": "reply_li_5501634", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그리고 여자 손이 남자손이랑 스쳤는데 어떻게 두창이냐고 그리고 은근슬쩍 정신성별이 맞다는 논지하에 얘기를 하네? 몸도 마음도 이미 여자인 상태고 그냥 그걸 받아들이지 못한 상태일 뿐이라니까? 근데 이게 ts녀고 톰보이고 구분없이 두창이라고? 진짜 진심으로 이게 말이 되는 주장이라고 생각함????", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 19:25", "comment_id": "reply_li_5501708", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "그던 여성적 사고가 맞습니다 그렇기에 두창이지요 자신을 남자라 인식하지만 여성적사고를 하게 되는데거 오는 괴리감도 두창의 요소이기 때문입니다 여성적 사고를 했다고 그게 자신을 여성이라 인식한다 볼수는 없기 때문입니다", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 19:27", "comment_id": "reply_li_5501769", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "이미 다 끝난 얘기 어떻게든 앵무새처럼 같은말 또하면서 말실수 하나 유발해다가 말꼬리 잡아 늘어지려는거 같은데 이젠 덧글 달 의미도 없고 진짜 더이상 애기 안할란다", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 19:29", "comment_id": "reply_li_5501828", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "받아들이지 못했다면 두창이 맞지요 하지만 톰보이는 그정도가 굉장히 옅습니다 근간이 여자이기 때문이죠ts도 여자아이로서 여자아이의 감정을 느낀다고 완전히 자신안의 남성이 사라졌다고는 볼 수 없습니다 하지만 그걸 받아들이고 자신안의 남성을 지운다면 그건 순애이지요", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 19:30", "comment_id": "reply_li_5501881", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "여자가 여성적 사고를 했으면 그건 그냥 여자죠 님아;;; 자기가 지금 무슨말을 하는지도 모르고 있는거 같은데 그만해요 이제", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 19:30", "comment_id": "reply_li_5501901", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "정신적 성별이 없다는 사실에도 동의 할 수 없군요 이미 한국을 포함한 많은 나라에서 lgbt를 인정하고 있고 그 안에 있는 많은 성애적 요소들은 모두 정신적이기 때문입니다 트렌스젠더라는것도 결국 자신의 신체적 정신적 성의 차이를 받아들이지 못해 생기는 경우가 가장 많기 때문이죠", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 19:32", "comment_id": "reply_li_5501966", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.39) (223.39)", "text": "여자가 여성의 사고를 하더라도 자신이 자신을 남성이라 생각하고 여성을 받아들이지 않았다면 그건 우발적인것이고 그것이 완전한 여성화라고는 받아들이기 힘듭니다 결국 여성화의 한 과정일 뿐이지요결국 말씀드리는건 자기가 자신을 여자라 받아들이는게 작중 두창의 요소에는 영향을 끼친다는 것입니다", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 19:36", "comment_id": "reply_li_5502149", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "본편", "text": "정신 성별 이라는게 존재 한다는게 정신의학과에서 증명된지 오조오억년째 인데 왜 정신 성별에 존재에 존나 긁혀함?이 몸뚱아리가 어쨌든 뇌가 인식하는 존재 인식은 완전 별개의 존재인데?", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.23 00:07", "comment_id": "reply_li_5513722", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "과학자들이 말하는 정신성별은 '뇌성'을 말하는거구요 전 계속 몸이 바뀌면 몸의 일부인 뇌도 똑같이 여자 뇌로 바뀌는게 당연하니까 두창이 아니라 그냥 여자가 된거라고 말하고 있어요", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.23 00:35", "comment_id": "reply_li_5514991", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "제가 없다고 말한 정신성별은 뇌성이 아니라 트랜스헬리콥터 이지랄하는 pc적인 정신병들을 뜻한거구요 몸이 여자가 됐다, 뇌도 몸의 일부다, 그러므로 몸도 뇌도 여자가 되었기때문에 두창이 아닌 여자다, 이미 다 적어놓은거잖아요", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.23 00:39", "comment_id": "reply_li_5515153", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "몸도 뇌도 여자가 됐는데 왜 여자가 아니라 두창이냐구요 예? 일단 덧글들 읽고나서 덧글을 달든 반박을 하든 해주세요", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.23 00:41", "comment_id": "reply_li_5515285", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러21(134.75) (134.75)", "text": "어차피 몸과 마음이 여자인 사람이 좋은 거라면 ts는 왜 봄? 그냥 여주물 보면 되잖아 굳이 ts만 보는 이유는 그게 좋아서 그런건데", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.23 06:20", "comment_id": "reply_li_5525127", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러21(134.75) (134.75)", "text": "니가 씨부리는 정신적 성별은 없고 몸이 바뀌면 그 성별을 그대로 따라가야 한다는 주장은 문제가 많아도 너무 많음 정신적 성별은 있다는게 맞음 스스로의 성별을 이성이라고 믿고 수술로 몸의 성별을 바꾸는 사람들은 뭘까? 자신이 원하는 성별이 아니기에 몸을 바꾼건데 니 주장에 따르면 성별이 온전히 바뀐 시점은 수술을 끝낸 시점일 거고 그렇다면 애초에 성별을 바꿀 이유도 없어지지 않나", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.23 06:24", "comment_id": "reply_li_5525173", "parent_comment_id": "comment_li_5495927", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.62) (223.62)", "text": "BL? 이단이다!", "is_reply": false, "dccon": "", "comment_img": "", "date": "05.22 15:54", "comment_id": "comment_li_5491203", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(210.91) (210.91)", "text": "TS 보는새끼들은 전부 게이다", "is_reply": false, "dccon": "", "comment_img": "", "date": "05.22 15:57", "comment_id": "comment_li_5491351", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(61.79) (61.79)", "text": "Bl잘알로서 이건 bl에대한 모독이라고 생각합니다.. bl은 남성의 육 체를 가지고 서로 공,수로 나뉘어서 맷돌을 돌리는게 진짜 bl인데 저런 임신까지 가능한 질충이된 몸을가지고 남자랑 엮인걸 bl이라고하면 bl에대한 모독이라고 생각합니다. 이런 발언을 계속한다 친구 남자애가 알고보니 여자애, 그냥 남자처럼 여겼던 여자애가 어느날부터인가 여자처럼 보이기 시작함, 이 톰보이 여자애, 보쿠코 같은 선머슴같은 여자애가 좋으니까 더 더 더 더 더 하다보니 '그럼 아예 남자였는데 여자애가 되는건 어떰?' 으로 시작한게 TS구만", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:31", "comment_id": "reply_li_5495517", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "이렇게하면 아니 시발 여자애가 아무리 그래도 이렇게까지 남자처럼 군다고?? 하는 쿨찐 씹덕들한테 '원래 남자였는데????' 할수도 있고, 아니 시발 이제와서 저런다는게 말이 됨?? 지금까진 왜 암컷인거 못깨달았음?? 태클질 하는것도 '원래 남자였는데???' 할수 있고 반강제적으로 여자로 자각시켜버릴수 있으니 걍 TS라는 장르 자체가 톰보이의 진화형인거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:32", "comment_id": "reply_li_5495628", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "나도 오끝작가좋아하긴하는데 저말은 동의못하긴함 ts보빔쪽위주로만파는사람이 착각하기 쉬운게Ts암타는 여자가된이후 빌드업을통해서 여성의 육체에 남성의 정신이던게 점점 여자의 정신으로 바뀌어서 남자랑 이어지는게 국룰이거든이런건 bl이라고할수가없지 결론적으로는 여성의육체의 여성의정신이된 여자가 남자랑 사귀는건데", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:33", "comment_id": "reply_li_5495657", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그렇지 여자가 됐으면 뇌도 여자가 되는건데 왜 항상 뇌는 남자잖아 이지랄하는건지 모르겠음", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:34", "comment_id": "reply_li_5495704", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "오끝작가가 보빔동인지로시작해서 오리지널로 오끝 만들기 시작한거라 ts물이라는 장르자체에대한 이해도는 떨어질수도있다고생각함.. 그렇다고 작가가 나쁘단건아니고 장르자체 이해도는 떨어질수있다고 ㅇㅇ Ts 노맨스 암타 백합 이런 세갈래의 차이도 잘 모를수도있을듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:35", "comment_id": "reply_li_5495760", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "남자가 여자로 변한다 \u003c 이 설정 때문에 TS 그리는 사람도 보는 사람도 시간이 지나면서 ts의 근원이 뭔지 모르는 사람이 더 많아진건 맞아서 작가가 모르는것도 이해는 함 이해는 하는데 좀 답답하긴해", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:37", "comment_id": "reply_li_5495877", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "나도 나쁘다는건 아님", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:37", "comment_id": "reply_li_5495892", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "Ts 노맨스 = 보통 이쪽파는 노맨스단들은 게임여캐키우는기분으로 승승장구 대리만족을 목표로 봄Ts 백합 = 여자의 몸 이된 전남자가 여자랑 더 자연스러운 스킨십을하는걸 흐뭇하게 바라보는입장으로봄 이건 이입하는사람도있고 딸보는것처럼 관찰자시점에서 보는경우도있고Ts암타=첨엔 남자의 정신이 남아있어 \"난 남자라고!!\"하던애가 점점 빌드업을 통해서 여성", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:38", "comment_id": "reply_li_5495936", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "의 정신이 되어가는 여성화 빌드업을통해 자신이 여성임을 받아들이고 남자랑 교제하는 그런느낌으로 봄 이쪽보는 사람들은 첨엔 개팅기던애가 점점 암컷이되어가는 느낌이 꼴려서 보는 그런느낌 하여튼 이렇게 보면됨", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:40", "comment_id": "reply_li_5496038", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "진짜 애자같은 소리하네 이 세상에 정신성별이 어딨냐??? 너 게이임????", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:42", "comment_id": "reply_li_5496093", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "남자였던 기억이 있는거지 뇌도 여자고 몸도 여자가 됐는데 이게 왜 정신적 bl이냐?????", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:42", "comment_id": "reply_li_5496106", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "무당이 너 전생에 여자였어 하면 넌 그날부터 브래지어차고 육체미소동 찍을거임?", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:43", "comment_id": "reply_li_5496119", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그렇게얘기하면 원래 여자였던애가 남자의육체로 변화해서 남자랑사귀면 노멀이라는거랑 똑같은 논리임 이렇게까지 설명해줬는데도 bl이라우기면 ㄹㅇ 할말이없다.", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:45", "comment_id": "reply_li_5496220", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러8(118.235) (118.235)", "text": "전생이 여자인거랑 기억을 가지고 있는건 아예 다르죠...   - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:46", "comment_id": "reply_li_5496276", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "전생에 남자였다가 다음생에 여자가되서 전생기억가지고있는환생계 ts나 현생에서 남자였다가 모종의힘으로 여자가되는 변화계 ts나 다르게 취급할이유는 없음", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:52", "comment_id": "reply_li_5496682", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "이렇게 진짜 말도 안되는 이유 끌어와서 ts는 아무튼 bl 두창 이런식으로 말하는애들보면 누구보다 그놈의 정신성별 운운하면서 두창적인 사고방식으로 설명하고 있다는게 진짜 어이가 없음 나는", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:54", "comment_id": "reply_li_5496819", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러9(118.235) (118.235)", "text": "뭔ㅋㅋ 무당이 전생에 너 여자였어라고 하면갑자기 여자였던 기억이 생겨남?", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:54", "comment_id": "reply_li_5496867", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "생겨났다고 치면? 그럼 넌 그날부터 갑자기 정신성별이 여자가 되는거임?", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:57", "comment_id": "reply_li_5497003", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "말꼬리 잡아서 논점 흐리려들지마라", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:57", "comment_id": "reply_li_5497017", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그래서 다른 성별이었던 기억이 존재한다는 이유 하나만으로 멀쩡한 이성애자가 동성애자로 바뀌는 이유가 뭐냐고 성별은 몸을 따라가는거야 이 세상에 정신성별 같은건 없어", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:58", "comment_id": "reply_li_5497080", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "씨사이드", "text": "반고닉끼리 싸우니까 구별이 안 가는데 고닉 좀 파셈", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:58", "comment_id": "reply_li_5497093", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러9(118.235) (118.235)", "text": "님 무당어쩌구가 말도안되는 비유라 말한건데 무슨 말꼬리임;;", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 17:58", "comment_id": "reply_li_5497114", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "반고닉끼리 싸운적 없고 그래 무당 비유는 틀렸다고 치자 그래서 남자였던 기억이 있다고 이성애자 남자가 이성애자 여자로 마법처럼 변했는데 정신성별이 왜 여자가 아니라 남자여야 하는지 설명좀 해줘라", "is_reply": true, "dccon": "", "comment_img": "", "date": "05.22 18:01", "comment_id": "reply_li_5497266", "parent_comment_id": "comment_li_5495375", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "너무 서두가없이 얘기했네 전생계랑 변화계랑 다르게 취급할 이유없다는건 변화계에서 암타가 완료된이후에는 그 개인취급을 다르게 할필요가없다는거지 왜냐면 그때부터는 주인공이 여성임을받아들였고 여자로서 살기를 결심하고 여자로서 살아가는거니깐 다르게취급할필요는없다는거지 물론"
