만들어놓은곳이 있다고 하고 최소 학생보단 보건교사 입이 무겁겠지", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.04 21:28", "comment_id": "reply_li_20610093", "parent_comment_id": "comment_li_20609862"}, {"writer": "ㅇㅇ(114.199) (114.199)", "text": "자꾸 개소리하는 병신들때문에 정리해봄. 학교에서 똥지리면 화장실가서 혼자처리하려고 하는건 사회적자살행위임.그러니 보건실을 가자", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.04 21:29", "comment_id": "reply_li_20610144", "parent_comment_id": "comment_li_20609862"}, {"writer": "에수스", "text": "음~~~~~미식이네요~~~~", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1BADxmJCy_KqG6AN9eogmNq6PnXFWVQ_b", "date": "09.04 21:34", "comment_id": "comment_li_20610357", "parent_comment_id": ""}, {"writer": "만갤러94(59.8) (59.8)", "text": "이해가 안가는게 지똥 지가 닦으면 되잖아 손이 없냐?", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.04 21:37", "comment_id": "comment_li_20610481", "parent_comment_id": ""}, {"writer": "ㅇㅇㅇ", "text": "이거 왜 본적있는거같지", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1SVBVAeiDQnPE1ZwFUfw_zZKi7UNNaIBV", "date": "09.04 21:42", "comment_id": "comment_li_20610722", "parent_comment_id": ""}, {"writer": "ㄷㄱㅂㅈ", "text": "진심 개병신 저능 같네여", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1BADxmJCy_KqG6AN9eogmNq6PnXFWVQ_b", "date": "09.04 21:43", "comment_id": "comment_li_20610779", "parent_comment_id": ""}, {"writer": "ㅇㅇ(111.91) (111.91)", "text": "스캇충이 드디어 양지로 기어나왔구나 씨발", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.04 21:45", "comment_id": "comment_li_20610842", "parent_comment_id": ""}, {"writer": "만갤러95(115.138) (115.138)", "text": "머임 씨발", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.04 21:59", "comment_id": "comment_li_20611345", "parent_comment_id": ""}, {"writer": "만갤러96(106.101) (106.101)", "text": "사과공주 이 ㅈㄹ 좆병신새끼들", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.04 22:13", "comment_id": "comment_li_20611848", "p ps://lh3.googleusercontent.com/d/1r-E8GbqJMAEl0vD6grbYef-tmpwFtjz3", "comment_img": "https://lh3.googleusercontent.com/d/1SVBVAeiDQnPE1ZwFUfw_zZKi7UNNaIBV", "date": "09.04 15:37", "comment_id": "comment_li_20595302", "parent_comment_id": ""}, {"writer": "ㅇㅇ(121.172) (121.172)", "text": "언젠가 먹어주는 전개도 나오나요?", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.04 15:41", "comment_id": "comment_li_20595499", "parent_comment_id": ""}, {"writer": "나나미마미", "text": "으음~ 향긋한 똥냄새~~", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1BADxmJCy_KqG6AN9eogmNq6PnXFWVQ_b", "date": "09.04 15:42", "comment_id": "comment_li_20595581", "parent_comment_id": ""}, {"writer": "착한나무", "text": "근데 드러운 묘사만 없으면 대꼴망가 한편 본느낌이네여", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1BADxmJCy_KqG6AN9eogmNq6PnXFWVQ_b", "date": "09.04 15:43", "comment_id": "comment_li_20595628", "parent_comment_id": ""}, {"writer": "ㅇㅇ(223.38) (223.38)", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1U4IbGmjug3z7d_sZHpZRv3xifB4_ZH81", "comment_img": "", "date": "09.04 15:46", "comment_id": "comment_li_20595773", "parent_comment_id": ""}, {"writer": "그아아아앗", "text": "일본은 망했다  - dc App", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1SVBVAeiDQnPE1ZwFUfw_zZKi7UNNaIBV", "date": "09.04 15:47", "comment_id": "comment_li_20595807", "parent_comment_id": ""}, {"writer": "ㅇㅇ(114.199) (114.199)", "text": "일본 보건실에서 변비관장같은거 실제로 했다는 경험담이 있긴함. 보건실에 관장약도 구비되있는 학교도 존재하고.게임 요몽원이란 명작보면 보건소에서 조건교사가 관장하고 여자애가 싸는 묘사도 있다.스캇충이라면 꼭한번 해보도록", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.04 15:48", "comment_id": "comment_li_20595836", "parent_comment_id": ""}, {"writer": "우롱우동", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1OFG4TcO0leFN9XTrQDvb9o0X514v8x3W", "comment_img": "https://lh3.googleusercontent.com/d/1BADxmJCy_KqG6AN9eogmNq6PnXFWVQ_b", "date": "09.04 15:49", "comment_id": "comment_li_20595929", "parent_comment_id": ""}, {"writer": "히카모", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1d6Bcuo5ZnlsHOgI90XaeQZ9Rl3dL1fC6", "comment_img": "https://lh3.googleusercontent.com/d/1BADxmJCy_KqG6AN9eogmNq6PnXFWVQ_b", "date": "09.04 15:52", "comment_id": "comment_li_20596037", "parent_comment_id": ""}, {"writer": "ㅇㅇ(114.199) (114.199)", "text": "그리고 똥지리고 왜 보건실가냐고 하는데 일본에선 이게 특별한 상황이 아니고 충분히 가능하디고 챗지피티센새가 말씀하셨다1 몸상태확인 2 팬티등 위생용품이 구비되어있음 3 필요시 보호자에게 연락그러니까 학생일경우 똥지리면 보건실로 가도록 해라 이상", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.04 15:53", "comment_id": "comment_li_20596076", "parent_comment_id": ""}, {"writer": "ㅇㅇ(114.199) (114.199)", "text": "일본학교보건연수사의 보건실 상담 사례에는 초등학생이 소변·대변을 지려 보건실에 오고, 보건실에 갈아입을 옷과 간이 샤워시설을 준비해 놓는 학교의 사례가 나온다", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.04 15:55", "comment_id": "reply_li_20596162", "parent_comment_id": "comment_li_20596076"}, {"writer": "ㅇㅇ(114.199) (114.199)", "text": "일본토일연구소의 현직 공립초등학교 양호교사 글에는 교사가 아이를 보건실로 데려왔고, **“대변을 지렸다 → 갈아입을 옷과 오염된 옷을 담을 봉투를 준비 → 갈아입히는 과정에서 설사였음을 확인”**한 구체적인 사례가 나온다. 또 대변을 참지 못해 교실에서 실수하는 아이들이 있다고 명시한다.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.04 15:56", "comment_id": "reply_li_20596185", "parent_comment_id": "comment_li_20596076"}, {"writer": "ㅇㅇ(114.199) (114.199)", "text": "2022년 아이치교육대 연구에서도 일본 학교에서는 학교 종류와 관계없이 ‘소변·대변 실수(尿便失禁)’가 발생하며, 양호교사가 주요 지원자로 대응한다고 조사됐다", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.04 15:56", "comment_id": "reply_li_20596212", "parent_comment_id": "comment_li_20596076"}, {"writer": "ㅇㅇ(114.199) (114.199)", "text": "실제 일본 공립초등학교 안내에서도 화장실에 늦어 옷을 더럽힌 경우 보건실의 옷으로 갈아입혀 하교시킨다고 명시한다.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.04 15:57", "comment_id": "reply_li_20596233", "parent_comment_id": "comment_li_20596076"}, {"writer": "만갤러39(222.104) (222.104)", "text": "@ㅇㅇ(114.199) 초등학교잖아 븅신아 저건 고등학교1학년이라고 넌 ll, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
