하는것도 불가능.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.04 21:25", "comment_id": "reply_li_20609990", "parent_comment_id": "comment_li_20609862", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(114.199) (114.199)", "text": "물로 닦거나 최소한 물티슈는 있어야 설사처리가 가능하지.근데 화장실한칸에서 그걸 어떻게 함.물티슈는 없을테고 휴지조차 없을수있다.물을 쓰려면 공용화장실 세면대까지 나와야됨.애초에 안들킨다는게 불가능함.그러니 보건실가는게 최선이다.일본 학교는 심지어 간이 욕실까지 만들어놓은곳이 있다고 하고 최소 학생보단 보건교사 입이 무겁겠지", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.04 21:28", "comment_id": "reply_li_20610093", "parent_comment_id": "comment_li_20609862", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(114.199) (114.199)", "text": "자꾸 개소리하는 병신들때문에 정리해봄. 학교에서 똥지리면 화장실가서 혼자처리하려고 하는건 사회적자살행위임.그러니 보건실을 가자", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.04 21:29", "comment_id": "reply_li_20610144", "parent_comment_id": "comment_li_20609862", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러103(211.34) (211.34)", "text": "@ㅇㅇ(114.199) 아 씨발 병신같은새끼 애미씨발 이런씨발장애새끼에게 똥지린거 치우는방법까지 설명해줘야되나", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.05 23:29", "comment_id": "reply_li_20664123", "parent_comment_id": "comment_li_20609862", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "에수스", "text": "음~~~~~미식이네요~~~~", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1BADxmJCy_KqG6AN9eogmNq6PnXFWVQ_b", "date": "09.04 21:34", "comment_id": "comment_li_20610357", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러94(59.8) (59.8)", "text": "이해가 안가는게 지똥 지가 닦으면 되잖아 손이 없냐?", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.04 21:37", "comment_id": "comment_li_20610481", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": mment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b651e2246ee4be8057de98a9d24e0029870c1d84c86f4076347186bf93a7f4ffccc9572e4a985d8b50f7", "comment_img_source": "", "comment_media_version": 2}, {"writer": "히카모", "text": "", "is_reply": false, "dccon": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658e92477cc3eb010ffe6d1c0915162fba91358516fd9ce632ada652116b3c7f8672797af06716670132248c94a98675cb3a825d36bd96f51dec3", "comment_img": "https://lh3.googleusercontent.com/d/1BADxmJCy_KqG6AN9eogmNq6PnXFWVQ_b", "date": "09.04 15:52", "comment_id": "comment_li_20596037", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658e92477cc3eb010ffe6d1c0915162fba91358516fd9ce632ada652116b3c7f8672797af06716670132248c94a98675cb3a825d36bd96f51dec3", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(114.199) (114.199)", "text": "그리고 똥지리고 왜 보건실가냐고 하는데 일본에선 이게 특별한 상황이 아니고 충분히 가능하디고 챗지피티센새가 말씀하셨다1 몸상태확인 2 팬티등 위생용품이 구비되어있음 3 필요시 보호자에게 연락그러니까 학생일경우 똥지리면 보건실로 가도록 해라 이상", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.04 15:53", "comment_id": "comment_li_20596076", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(114.199) (114.199)", "text": "일본학교보건연수사의 보건실 상담 사례에는 초등학생이 소변·대변을 지려 보건실에 오고, 보건실에 갈아입을 옷과 간이 샤워시설을 준비해 놓는 학교의 사례가 나온다", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.04 15:55", "comment_id": "reply_li_20596162", "parent_comment_id": "comment_li_20596076", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(114.199) (114.199)", "text": "일본토일연구소의 현직 공립초등학교 양호교사 글에는 교사가 아이를 보건실로 데려왔고, **“대변을 지렸다 → 갈아입을 옷과 오염된 옷을 담을 봉투를 준비 → 갈아입히는 과정에서 설사였음을 확인”**한 구체적인 사례가 나온다. 또 대변을 참지 못해 교실에서 실수하는 아이들이 있다고 명시한다.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.04 15:56", "comment_id": "reply_li_20596185", "parent_comment_id": "comment_li_20596076", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(114.199) (114.199)", "text": "2022년 아이치교육대 연구에서도 일본 학교에서는 학교 종류와 관계없이 ‘소변·대변 실수(尿便失禁)’가 발생하며, 양호교사가 주요 지원자로 대응한다고 조사됐다", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.04 15:56", "comment_id": "reply_li_20596212", "parent_comment_id": "comment_li_20596076", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(114.199) (114.199)", "text": "실제 일본 공립초등학교 안내에서도 화장실에 늦어 옷을 더럽힌 경우 보건실의 옷으로 갈아입혀 하교시킨다고 명시한다.", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.04 15:57", "comment_id": "reply_li_20596233", "parent_comment_id": "comment_li_20596076", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러39(222.104) (222.104)", "text": "@ㅇㅇ(114.199) 초등학교잖아 븅신아 저건 고등학교1학년이라고 넌 고1때도 똥싸면 닦아달라고 선생찾았니? 댓글쓰는거보면 그럴거같긴하다만은", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.04 16:28", "comment_id": "reply_li_20597506", "parent_comment_id": "comment_li_20596076", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(114.199) (114.199)", "text": "@만갤러39(222.104) 병신년아 예를 들어줬으면 나머진 니가 맞나 아닌가 찾던가 씨발원종병신년이", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.04 16:31", "comment_id": "reply_li_20597619", "parent_comment_id": "comment_li_20596076", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(114.199) (114.199)", "text": "@만갤러39(222.104) 근본적으로 보건실에 학교마다 위생용품 옷비치된게 맞고 고등학생이면 쪽팡여서 안가는거지 원칙적으로 보건실가는게 맞다는건데 병신년이 좆병신소리나하네", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.04 16:33", "comment_id": "reply_li_20597663", "parent_comment_id": "comment_li_20596076", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text
