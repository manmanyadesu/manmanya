arent_comment_id": "comment_li_21043414"}, {"writer": "만갤러24(220.84) (220.84)", "text": "쟤는 어차피 알파적성이 있어서 꿈이 좌절하든말든 애초에 그게 꿈이 맞는지도 의문이고 살 길은 알아서 찾긴 할 듯 했제그랬제가 제일 의미없는 편인 것 같은데", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.14 00:00", "comment_id": "comment_li_21052792", "parent_comment_id": ""}, {"writer": "만갤러24(220.84) (220.84)", "text": "아마 꿈을 찾으라는 식의 전개로 가긴 할 듯 본인이 진정으로 원하면 정면에서 꺾는 짓을 안하는게 지금 편의주의적으론 딱딱 들어맞고 있는데 줏대 존나 없는 거 보면 사단터지는 전개도 생기긴 하겠다만", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 00:07", "comment_id": "reply_li_21053261", "parent_comment_id": "comment_li_21052792"}, {"writer": "만갤러25(121.183) (121.183)", "text": "우리땐 교감 병풍이었는데 ㄹㅇ 존재감 제로", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.14 00:11", "comment_id": "comment_li_21053481", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "이 원한을 갚지 않고 어찌 살아갈 수 있겠는가....!!!!", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/16gOq2d6UL8M_uNp4ff77ZxewOGnvN3eJ", "date": "09.14 00:21", "comment_id": "comment_li_21053922", "parent_comment_id": ""}, {"writer": "만갤러28(221.145) (221.145)", "text": "\"난 음악에 감사하고 있다. 뮤지션이 되지 않았다면 엽기적인 살인마가 됐을 테니까\"", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 00:43", "comment_id": "reply_li_21055043", "parent_comment_id": "comment_li_21053922"}, {"writer": "만갤러27(124.54) (124.54)", "text": "여교사 머임 호빠 엄청 갈거같은데", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.14 00:34", "comment_id": "comment_li_21054608", "parent_comment_id": ""}, {"writer": "Embrio", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1iM7MgksgPBQVxnRQndjlBv8YX6H0fBWD", "comment_img": "https://lh3.googleusercontent.com/d/1lLM0b7TfiEhhrZb8aAEugNgVNElqASnK", "date": "09.14 01:14", "comment_id": "comment_li_21056344", "parent_comment_id": ""}, {"writer": "만갤러30(175.116) (175.116)", "text": "진짜 꼭 뒤져도 아이돌을 하고 싶음 이미 연습생으로 들어갔지 친구들이랑 노가리 까고 있지 않음", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.14 02:25", "comment_id": "comment_li_21059172", "parent_comment_id": ""}, {"writer": "도그풋", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1XoPHNZjctRCZh9ba-16SYxasF0iPheGD", "comment_img": "https://lh3.googleusercontent.com/d/1lLM0b7TfiEhhrZb8aAEugNgVNElqASnK", "date": "09.14 03:23", "comment_id": "comment_li_21060656", "parent_comment_id": ""}, {"writer": "ㅇㅇ(211.234) (211.234)", "text": "뭘 해라 알려주지도 않고 다 하지 말라고 하면 뭘 해야 함... 성우편 보면 그냥 좋은 대학 가라는 것도 아니고 뭘 하고 싶은 거임. 그냥 요즘 애들은 타령하는 꼰대일 뿐인데", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.14 03:57", "comment_id": "comment_li_21061282", "parent_comment_id": ""}, {"writer": "메가역바니어롭", "text": "하지 말라는거보단 할거면 어두운 면까지 다 알아보고 인지한 다음에 목표를 확실하게 세우라는 느낌인거 같은데 다들 두루뭉실하게만 목표를 세우고 하지 말라는건가요? 하면서 부정적으로 받아들이니까 그런거 같아  - qc Ɐbb", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1lLM0b7TfiEhhrZb8aAEugNgVNElqASnK", "date": "09.14 07:02", "comment_id": "reply_li_21064018", "parent_comment_id": "comment_li_21061282"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@메가역바니어롭 그럼 좋은말도해주고 안좋은말도 해주고 그래야 현실을 알려주는거지 안좋은말만 잔뜩하면 그냥 하지말라는뜻이지", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 09:24", "comment_id": "reply_li_21067066", "parent_comment_id": "comment_li_21061282"}, {"writer": "메가역바니어롭", "text": "@ㅇㅇ(118.235) 그래서 꿈을 꾸게 된 계기라던가 이게 부모의 의견이 아닌 진짜 본인 의견이 맞는지 물어보는데 애들은 귀찮다고 그냥 넘겨버렸으니까..  - qc Ɐbb", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1lLM0b7TfiEhhrZb8aAEugNgVNElqASnK", "date": "09.14 09:26", "comment_id": "reply_li_21067124", "parent_comment_id": "comment_li_21061282"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@메가역바니어롭 애들이 귀찮아한게 아니라고, 선생이 허무맹랑한 소리만 하니까 그런거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 14:50", "comment_id": "reply_li_21076715", "parent_comment_id": "comment_li_21061282"}, {"writer": "메가역바니어롭", "text": "@ㅇㅇ(118.235) 아니 얘네 선생이 입열기 전부터 이미 꿈없는 선생 소문 듣고서 넘길 생각 만빵이었는걸  - qc Ɐbb", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1lLM0b7TfiEhhrZb8aAEugNgVNElqASnK", "date": "09.14 14:53", "comment_id": "reply_li_21076794", "parent_comment_id": "comment_li_21061282"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@메가역바니어롭 기관사편에서는 학생이 나름 선생이랑 소통했음선생에게 이유를 질문했으나 선생에게서 만족할만한 대답이 나오지 않은게 문제임", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 17:44", "comment_id": "reply_li_21083024", "parent_comment_id": "comment_li_21061282"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@메가역바니어롭 거기서 선생이 학생에게 대기업 기관사들의 고충이나 힘든점을 상세히 설명해주고 지방 기업을 추천해주면 학생이 설득되었을 수도 있음그러나 학생이 찍은 사진이 멋지니까, 대기업을 못갈 수도 있으니까 라는 이유만으로는 설득에 실패한거임실제로 그 학생은 대기업에 취직할 실력이 있었으니까 더욱 선생의 충고를 받아들일 이유가 없었음", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 17:50", "comment_id": "reply_li_21083344", "parent_comment_id": "comment_li_21061282"}, {"writer": "만갤러44(117.111) (117.111)", "text": "@메가역바니어롭 시작부터 우주비행사 사고 언급하는건 대체 무슨 보법이다요 논리와는 거리가 먼, '꿈으로 사람이 죽음' 이런 터무니 없는 비약으로 상담 물꼬를 튼거부터 설득력이 정말 너무 떨어짐 기관사만의 고충도 아니고 꿈으로 사람이 죽을수 있다 이거에만 집중했으니까", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 18:42", "comment_id": "reply_li_21085717", "parent_comment_id": "comment_li_21061282"}, {"writer": "ㅇㅇ(222.232) (222.232)", "text": "@ㅇㅇ(118.235) 그건 너무 과정이 생략된 이야기임 주인공이 무슨 능력이 있어서 미래에 일어날 일을 다 알려주고 경고하겠음그렇게 따지면 철덕도 더 덤덤한 성격에 사고를 넘길 수 있는 심성이었다면 그 회사 잘 다니지 않았겠음? 인생은 무슨 상상으로 시뮬레이션 돌리는게 아님 겪어봐야만 알 수 있는 부분이 어쩔수없이 존재한다좌절된 사람들이 다시 스스로 일어나는 이야기인거고 주인공은 약간의 첨언을 하는 존재일뿐임 선생도 정답을 알지못함 정답이 있는 문제도 아니고", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 19:12", "comment_id": "reply_li_21087068", "parent_comment_id": "comment_li_21061282"}, {"writer": "ㅇㅇ(222.232) (222.232)", "text": "@ㅇㅇ(118.235) 주인공은 마냥 꿈을 부정하는 사람이 아님 그 직업은 어려우니까 마냥 하향지원 시키려는 사람도 아니고누구나 원하는 일을 할 수 없고 그 일에 끝까지 가는 사람도 세상엔 얼마 없음누구나 크던 작던 좌절하고 일정부분 포기하면서 살아감 한명도 안나올거같은 동창모임에 나와달라 부탁하는것도만약 현실에 부딪친 아이들이 있다면 다시 한번 스스로 정리할 수 있도록 도와주는것 뿐임", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 19:26", "comment_id": "reply_li_21087705", "parent_comment_id": "comment_li_21061282"}, {"writer": "ㅇㅇ(222.232) (222.232)", "text": "@ㅇㅇ(118.235) 오히려 꿈에 집중하는 사람을 현실적인 이유를 들어가면서 포기하게 만든다는거야 말로 편의주의적임 사람은 좋아하는 것의 부정적인면을 냉정하게 보지 못함 어리다면 더더욱 그렇고", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 19:31", "comment_id": "reply_li_21087869", "parent_comment_id": "comment_li_21061282"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "@ㅇㅇ(222.232) 그거 말고도 선생이 학생에게 우주비행사들의 사고를 말한것도 문제임그렇게 따지면 택시 운전사들이 교통사고를 당하면 택시 운전사라는 꿈이 그를 죽인건가?편의점에서 알바를 하다가 강도를 만나서 칼에 찔려서 사망하면 편의점 알바라는 꿈이 그를 죽인건가?이런건 안타까운 사고일 뿐이잖아. 이상한 소리를 하니까 학생이 선생을 미친놈으로 생각하게된거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 19:39", "comment_id": "reply_li_21088210", "parent_comment_id": "comment_li_21061282"}, {"writer": "ㅇㅇ(222.232) (222.232)", "text": "@ㅇㅇ(118.235) 자기가 옳다고 생각하는 사람을 설득하는건 니 생각보다 훨씬 어려운일임뭐 어떻게 설득했어야 됐을지 니가 생각하는게 더 궁금한데?그리고 너가 예시를 든 불의의 사고들에 비해 우주왕복선 사고는 있을법한 사고라는 생각 안듬?만약에 사고를 당해서 죽지는 않고 평생 불구가 됐다고 치자 그 상황이 되면 자신을 원망하지 않는다고 확신할 수 있음? 그냥 운이 없었다고 넘길 수 있겠음?사람은 절망앞에선 결국 자신에게까지 화살을 돌리기 마련이다 그게 자신의 과책이 전혀 아님에도", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 19:59", "comment_id": "reply_li_21088958", "parent_comment_id": "comment_li_21061282"}, {"writer": "ㅇㅇ(222.232) (222.232)", "text": "@ㅇㅇ(118.235) 너무 인간을 이성적인 존재로 보고 있는거 같음사람은 어떤 적절한 예시를 들어도 자신의 뜻을 잘 굽히지 못함 특히나 저런 정답이 없고 불확실성 높은 일에 대해서는", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 20:02", "comment_id": "reply_li_21089067", "parent_comment_id": "comment_li_21061282"}, {"writer": "ㅇㅇ(222.232) (222.232)", "text": "@ㅇㅇ(118.235) 좀 더 큰틀에서 이야기를 보기 바란다에피소드 두개를 다 보고 나서 느낀건 누구나 겪는 이야기이고 언젠간 받아들여야 하는 현실임 그것을 일찍부터 깨달아서 현실에 맞춰 살아가라는 이야기가 아니다과정에서 깨닫게 되는 무언가가 있을거고 그것을 다시 분명하게 하는 것도 중요하다고 첫번째 에피소드에서 나왔잖아", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 20:06", "comment_id": "reply_li_21089264", "parent_comment_id": "comment_li_21061282"}, {"writer": "ㅇㅇ", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/10mV34AoaCAo2EQz8vc90RnC4Dnyzl2X0", "comment_img": "https://lh3.googleusercontent.com/d/16gOq2d6UL8M_uNp4ff77ZxewOGnvN3eJ", "date": "09.14 04:10", "comment_id": "comment_li_21061596", "parent_comment_id": ""}, {"writer": "만갤러31(180.182) (180.182)", "text": "궁금해서 다 찾아봤네. 지하아이돌이 점점 타락하고 공사치는 내용임. 현실도 암울한데 생각할 거리 던져주는 만화보다 즐겁고 개그하는 만화 찾아볼걸 그랬다.", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.14 04:54", "comment_id": "comment_li_21062344", "parent_comment_id": ""}, {"writer": "ㅇㅇ(222.232) (222.232)", "text": "더 이상 다치지 않게 포기하는 법에 대해 생각해보자는 내용인거 같은데 진로상담은 왜하냐는 소리는 만화 너무 단편적으로만 보고사는거 아니냐  ㅋㅋ대사로도 나오듯 현실을 알고 도전해야된다는거임 그리고 현실은 만화보다 더 바늘구멍이고 내용보다 더 차갑다 적어도 내 주변엔 하고싶은일 하면서 사는사람 단 한명도 없음 다들 포기하면서 산다", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.14 04:55", "comment_id": "comment_li_21062355", "parent_comment_id": ""}, {"writer": "ㅇㅇ(222.232) (222.232)", "text": "등장인물들이 존나 억까당하고 잘못을 해서 꿈이 좌절된게 아님사회에 버젓이 존재하는 일들이고 원하는 직업이 내 생각과 많이 다른 경우도 거의 대부분임 무슨 일자리든 좋은면만 보여주려고 하니까선생의 충고를 못받아들이는건 전달을 못해서가 어쩔수없는 어린애들이기때문이고현실에 좌절하고 누구나 포기한다는걸 깨닫는건 작품에서 계속 나오듯 먼 미래의 일이니까", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.14 05:09", "comment_id": "comment_li_21062605", "parent_comment_id": ""}, {"writer": "ㅇㅇ(222.232) (222.232)", "text": "학생땐 누구나 자기 자신이 잘될거라고 잘풀릴거라고 생각한다오히려 애새끼들을 달변인척 설득해서 받아들이게 하는게 더 말이 안되는거임 어떻게 전달해도 못알아듣고 현실을 보지 못함포기하고 살라는게 아니라 좌절했을때 포기하는 방법에 대해 이야기하는 작품인거임", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.14 05:18", "comment_id": "comment_li_21062718", "parent_comment_id": ""}, {"writer": "ㅇㅇ(222.232) (222.232)", "text": "이 만화에 누구도 아예 틀린말을 하고 있지 않음하지만 나도 미성숙한 고등학생들이 스스로 선택하고 온전히 책임져야한다는건 너무 잔인하다고 생각한다 대다수의 아이들은 절대로 올바른 판단과 시야을 갖지못함 결국 다들 실패하고 좌절한다", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.14 05:31", "comment_id": "comment_li_21062890", "parent_comment_id": ""}, {"writer": "ㅇㅇ(121.135) (121.135)", "text": "이 만화에 누구도 아예 틀린말을 하고 있지 않음 ←그랬으면 좋겠는데 노괴가 '절뫙' ㅇㅈㄹ 해서 좀 잘 모르겠음", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 05:55", "comment_id": "reply_li_21063199", "parent_comment_id": "comment_li_21062890"}, {"writer": "ㅇㅇ(222.232) (222.232)", "text": "@ㅇㅇ(121.135) 교감년이 나쁜년인거 같지만 어떤 의도인지랑은 별개로 저 말도 틀렸다고 보긴 어렵잖아 현실만 쳐다보고 살라는것도 괴로운말임", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.14 06:09", "comment_id": "reply_li_21063332", "parent_comment_id": "comment_li_21062890"}, {"writer": "ㅇㅇ(222.232) (222.232)", "text": "그렇다고 주인공은 학생들을 단호하게 말리지 못함본인도 정답을 모르기때문에 정답이 없는 문제이기 때문에그렇기에 적어도 리스크를 다 체크하고 도전해야 한다고 밖에 이야기 할 수 밖에 없는거임", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.14 05:51", "comment_id": "comment_li_21063141", "parent_comment_id": ""}, {"writer": "ㅇㅇ(121.135) (121.135)", "text": "노괴 나오니까 갑자기 재밌어졌네 ㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.14 05:52", "comment_id": "comment_li_21063160", "parent_comment_id": ""}, {"writer": "ㅇㅇ(211.227) (211.227)", "text": "저 노괴가 손댄거같은데 이미늦은듯", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.14 05:57", "comment_id": "comment_li_21063216", "parent_comment_id": ""}, {"writer": "오줌기타", "text": "자자 캄보디아로 가자~", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1lLM0b7TfiEhhrZb8aAEugNgVNElqASnK", "date": "09.14 06:32", "comment_id": "comment_li_21063551", "parent_comment_id": ""}, {"writer": "ㅇㅇ(39.7) (39.7)", "text": "아이돌은 못해도 호빠정도는 가능할듯", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.14 07:10", "comment_id": "comment_li_21064181", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "요즘은 일본도 k팝아이돌처럼 하던데 고등학생이면 너무 늦은거아닌가", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/16gOq2d6UL8M_uNp4ff77ZxewOGnvN3eJ", "date": "09.14 07:37", "comment_id": "comment_li_21064728", "parent_comment_id": ""}, {"writer": "만갤러35(211.244) (211.244)", "text": oups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
