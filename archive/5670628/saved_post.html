함", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 23:29", "comment_id": "reply_li_19234789", "parent_comment_id": "comment_li_19233613"}, {"writer": "ㅇㅇ(180.233) (180.233)", "text": "이사 못오게 막아놔야지", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.09 00:38", "comment_id": "reply_li_19238510", "parent_comment_id": "comment_li_19233613"}, {"writer": "앙파상", "text": "곧완결각인가", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1wEWyp7j_sBB4nARDV2_n7PG363BypNz2", "date": "08.08 23:04", "comment_id": "comment_li_19233721", "parent_comment_id": ""}, {"writer": "ㅇㅇ☃️(182.213) (182.213)", "text": "만붕귀신 강하다앗", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.08 23:05", "comment_id": "comment_li_19233757", "parent_comment_id": ""}, {"writer": "평민", "text": "사연있는 집이 되겠구만", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1aMtKobmurpUJbejw0RgJ5dcpRuVe9rKW", "date": "08.08 23:05", "comment_id": "comment_li_19233761", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1UU9PXfE3kZ25_ZBxESQPqxy4cNL2xr2z", "comment_img": "https://lh3.googleusercontent.com/d/1aMtKobmurpUJbejw0RgJ5dcpRuVe9rKW", "date": "08.08 23:05", "comment_id": "comment_li_19233769", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "아빠랑 프랑소와가 미코엄마 지키려다 죽은거같음. 죽어서도 엄마 지키다가 이제 같이 봉인돼서 탈라샤 엔딩 될수도", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1aMtKobmurpUJbejw0RgJ5dcpRuVe9rKW", "date": "08.08 23:06", "comment_id": "comment_li_19233821", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "아빠도 저 아재랑 이미 저번에 얘기나눌 때 합의 본거 같고. 같이 봉인되려고 기다리는듯", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1aMtKobmurpUJbejw0RgJ5dcpRuVe9rKW", "date": "08.08 23:11", "comment_id": "reply_li_19234006", "parent_comment_id": "comment_li_19233821"}, {"writer": "도그풋", "text": "", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1wEWyp7j_sBB4nARDV2_n7PG363BypNz2", "date": "08.08 23:07", "comment_id": "comment_li_19233834", "parent_comment_id": ""}, {"writer": "hiㅂㅓㅇㅇ(218.54) (218.54)", "text": "너무 깝치네 아저씨", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.08 23:07", "comment_id": "comment_li_19233853", "parent_comment_id": ""}, {"writer": "오줌기타", "text": "분위기 너무 령켓몬이잖아...", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1wEWyp7j_sBB4nARDV2_n7PG363BypNz2", "date": "08.08 23:08", "comment_id": "comment_li_19233871", "parent_comment_id": ""}, {"writer": "적도곰", "text": "령켓몬 번역 안된지도 좀 됐네", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1wEWyp7j_sBB4nARDV2_n7PG363BypNz2", "date": "08.09 00:17", "comment_id": "reply_li_19237532", "parent_comment_id": "comment_li_19233871"}, {"writer": "ㅇㅇ(211.176) (211.176)", "text": "파파...ㅠ", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.08 23:09", "comment_id": "comment_li_19233937", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "이럼 집에서 아빠랑 교배아저씨 싸워야되는데", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1aMtKobmurpUJbejw0RgJ5dcpRuVe9rKW", "date": "08.08 23:09", "comment_id": "comment_li_19233938", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "아빠도 못이길듯. 프랑소와한테 아직 기다리라고 하는거 보니 아빠도 저 악귀랑 같이 집에 봉인될 각오로 있는거 같음", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1aMtKobmurpUJbejw0RgJ5dcpRuVe9rKW", "date": "08.08 23:12", "comment_id": "reply_li_19234059", "parent_comment_id": "comment_li_19233938"}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "아빠 교배아저씨한테 교배당해 ㅠㅠ", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 23:22", "comment_id": "reply_li_19234475", "parent_comment_id": "comment_li_19233938"}, {"writer": "만갤러6(59.16) (59.16)", "text": "아빠 눈에는 교배아저씨가 아니라 할카스로 보임...", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 23:25", "comment_id": "reply_li_19234607", "parent_comment_id": "comment_li_19233938"}, {"writer": "ㅇㅇ", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/14LPbOGhMe6ySu6ogHPBKegXhk8I4re-J", "comment_img": "https://lh3.googleusercontent.com/d/1aMtKobmurpUJbejw0RgJ5dcpRuVe9rKW", "date": "08.08 23:10", "comment_id": "comment_li_19233955", "parent_comment_id": ""}, {"writer": "ㅇㅇ(211.226) (211.226)", "text": "흥미진진하누? 근데 왜 엄한 애엄마한테 계속 집착하누?", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.08 23:10", "comment_id": "comment_li_19233987", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "저 와꾸에 몸매를 봐라 내가 교배아저씨라도 호시탐탐 노린다", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1aMtKobmurpUJbejw0RgJ5dcpRuVe9rKW", "date": "08.08 23:14", "comment_id": "reply_li_19234139", "parent_comment_id": "comment_li_19233987"}, {"writer": "ㅇㅇ(125.143) (125.143)", "text": "최면앱 교배아저씨잖아", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 23:20", "comment_id": "reply_li_19234387", "parent_comment_id": "comment_li_19233987"}, {"writer": "만갤러4(122.37) (122.37)", "text": "애엄마 봐라 집착안하게 생겼나", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 23:22", "comment_id": "reply_li_19234459", "parent_comment_id": "comment_li_19233987"}, {"writer": "만갤러7(211.248) (211.248)", "text": "요즘 빙의물이 유행이던데 유부녀 빙의해서 모녀보빔하는거 모르노", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 23:27", "comment_id": "reply_li_19234690", "parent_comment_id": "comment_li_19233987"}, {"writer": "ㅇㅇ(211.178) (211.178)", "text": "꼴리게생겼잖아", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.08 23:38", "comment_id": "reply_li_19235357", "parent_comment_id": "comment_li_19233987"}, {"writer": "타피오카.", "text": "생긴거봐라", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1wEWyp7j_sBB4nARDV2_n7PG363BypNz2", "date": "08.08 23:53", "comment_id": "reply_li_1923 const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
