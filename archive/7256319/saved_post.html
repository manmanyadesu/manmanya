212)", "text": "재밌긴한데 장르가 달라졌네 ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.26 14:20", "comment_id": "comment_li_24678661", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "푸슈", "text": "남 벗겨먹는거만보다가 니쿠요쿠같은 건실청년보니 훈훈해지네", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.26 14:21", "comment_id": "comment_li_24678696", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "캐릭터 왜 인기 많았는지 알겠노 ㅋㅋ 낭만 십", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.26 14:21", "comment_id": "comment_li_24678697", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러7(125.141) (125.141)", "text": "이러고 나중에 어떻게됨? 스포 좀 해줘", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.26 14:23", "comment_id": "comment_li_24678790", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러6(175.210) (175.210)", "text": "원작은 이걸로 끝일걸 나중에 작가 사후 나온 신 나니와금융도에선 대박성공함", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.26 14:25", "comment_id": "reply_li_24678871", "parent_comment_id": "comment_li_24678790", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "윗타", "text": "2부에서 팔자 핀 모습이 나오는데 2부는 드래곤볼 슈퍼 취급이라.", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.26 14:26", "comment_id": "reply_li_24678906", "parent_comment_id": "comment_li_24678790", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러7(125.141) (125.141)", "text": "성공해서 다행이야", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.26 14:26", "comment_id": "reply_li_24678907", "parent_comment_id": "comment_li_24678790", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "채권자에게 들켜서 개처럼 d": "comment_li_24679236", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "heki", "text": "그래도 희망차게 끝나네", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.26 14:36", "comment_id": "comment_li_24679273", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(61.40) (61.40)", "text": "계속 망하는 거만 보여주다가 성공하는 거 한 번 보여줘서 갈증을 풀어주네 작가가 걍 스토리를 존나 잘 짬", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.26 14:37", "comment_id": "comment_li_24679307", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "\"세상에는 이렇게나 많은 별이 있구나. 야반도주한 내게도 붙잡을 수 있는 별이 분명 있을 거야\"란 대사 읽으니까 코 끝이 찡하네 나같은 개백수랑은 그릇부터 다른 인간이구나", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.26 14:37", "comment_id": "comment_li_24679315", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "【파유자재불】", "text": "“‘원컨대 일체중생이 가장 미묘한 몸을 얻어 안에는 묘한 향이 가득하고 밖으로는 광명을 발하여 지이다.’하느니라.‘원컨대 일체중생이 배가 드러나지 않는 몸을 얻어 아래 위가 단정하고 팔 다리가 서로 어울려 지이다.’하느니라.‘원컨대 일체중생이 지혜의 몸을 얻어 불법(佛法)의 맛으로 만족하고 기쁘게 자라나지이다.’하느니라.”", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.26 14:39", "comment_id": "comment_li_24679381", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러8(211.235) (211.235)", "text": "근데 공항같은데서 저렇기 장사하면 우연히 얼굴아는 채권자 마주칠확률이", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.26 14:39", "comment_id": "comment_li_24679403", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.146) (221.146)", "text": "인간은 생각보다 다른 사람에 관심 없어서 대놓고 봐도 모름", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.26 15:00", "comment_id": "reply_li_24680409", "parent_comment_id": "comment_li_24679403", "dccon_sourc
