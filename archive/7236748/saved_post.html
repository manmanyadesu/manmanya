t_id": "comment_li_24622210", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.235) (211.235)", "text": "처음엔 보스잡을 생각 아예 없었을거임 니트가 제왕할배 보자마자 기겁했던거랑 미샤도 이새끼 못잡겠다하고 바로 런치는거 생각해보면", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 14:49", "comment_id": "reply_li_24624578", "parent_comment_id": "comment_li_24622210", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러61(121.176) (121.176)", "text": "@ㅇㅇ(211.235) 자이언트는 애초에 벌 굴 못들어오는걸로 절벽사냥으로 계획했지 싶은데니트가 제왕보고 기겁했던건 연회중 북 치느라 위치고정인 제왕이 갑자기 나타나서였음, 심지어 보자마자 즉사패턴 갈기니까 법사가 죽을 수도 있는 상황이었고미샤가 못이긴다고 했던건 그 상황(연회+벌 어그로)에서 일이라고 생각하고나도 니트가 처음부터 보스 잡을 생각을 공유했다는건 아니라고 보고 혹시 문제가 생겨서 보스전을 하게 된다면 일반적인 고정된 제왕은 잡을 방법정도는 니트 혼자서 생각해두지 않았을까 정도", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 15:08", "comment_id": "reply_li_24625355", "parent_comment_id": "comment_li_24622210", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "차트정후", "text": "ㅇㅇ맞음 버섯할배의 등장은 릴리의 장난으로 완전 상정외 상황이었고 동옥은 버섯할배를 잡기보단 자이언트보라독버섯 잡는용도로 배워왔었음ㅇㅇ신스킬 배워왔다는 언급도 있었고, 연회이벤트 발동안하면 자이언트버섯류 드문드문 듬성듬성 따로따로 스폰되어있다 했었음. 위 댓 말마따나 미샤 고드름 스택도움받으며 동옥사냥하려했었을듯ㅇㅇ  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 16:43", "comment_id": "reply_li_24629908", "parent_comment_id": "comment_li_24622210", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "우우우팜팜팜술술술", "text": "이벤트 트리거 터지나 확인하러 온 거라서 겸사겸사 찍고 들어왔을 수도 있음.이벤트 자체가 없었으니.", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 16:50", "comment_id": "reply_li_24630210", "parent_comment_id": "comment_li_24622210", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.116) (211.116)", "text": "이벤트확인도 본래 예정에 없었는데 스미레코가 굳이 따라가겠다해서 겸사겸사 한거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 18:48", "comment_id": "reply_li_24636107", "parent_comment_id": "comment_li_ mment_media_version": 2}, {"writer": "Ffly", "text": "이러저러한거 다 감안해도20레벨 수준 얼법 주문 하나에 보스 터지는 ㅂㅅ 게임이라는건 변하지 않음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 11:28", "comment_id": "reply_li_24616233", "parent_comment_id": "comment_li_24613562", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러52(121.182) (121.182)", "text": "몇십분은 누적시켜서 겨우 저 딜 넣는 거면 쓰레기 스킬 아닌가? 저게 왜 사기 스킬임?", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 12:26", "comment_id": "reply_li_24618917", "parent_comment_id": "comment_li_24613562", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(61.72) (61.72)", "text": "ㄴ 등장인물이랑 댓글들까지 포함해서 아무도 사기스킬이라 한 적 없음. 그리고 저게 발동조건대비 약한 이유는 오로지 지금 니트의 int 스탯이 낮아서임", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 12:56", "comment_id": "reply_li_24620134", "parent_comment_id": "comment_li_24613562", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "응애(117.111) (117.111)", "text": "@Ffly 피 30%+밖에 안남은 버섯 지딜넣다가 딸피 누적딜 된거 막타친게 뭔 ㅋㅋㅋ 겜안분도 그런 소리는 안하겠다", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 14:20", "comment_id": "reply_li_24623414", "parent_comment_id": "comment_li_24613562", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "응애(117.111) (117.111)", "text": "@ㅇㅇ(61.72) 코퀴토스는 발동조건이 좆같아서 그렇지 평범하게 강한기술임.   스택 + 마나량에 비례하는 마법공격으로  모죠의 스텟배분은 몰라도 주인공이 40~60레벨은 모죠보다 낮을텐데 주력딜링기 딜 따라갈지도 모른다는 추측에서 나옴", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 14:25", "comment_id": "reply_li_24623607", "parent_comment_id": "comment_li_24613562", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "응애(117.111) (117.111)", "text": "@ㅇㅇ(61.72) 모죠가 약하다고 평하는 이유는 니트가 약해서일 뿐임. 니트가 상시 풀마나에 가깝게 유지하는 것을 모죠가 알리도 없고 오래 싸웠으면 당연히 마나 오링날거다 이런 생각이 깔려있다고 보는게 해석이 자연스러운 구조가 됨모조품 : \"올인트여도 내 딜링기랑 비비는 정도일거다.\"샐러드 : '꽤 쌔잖아...'", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 14:28", "comment_id": "reply_li_24623766", "parent_comment_id": "comment_li_24613562", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "응애(117.111) (117.111)", "text": "@ㅇㅇ(61.72) 객관적으로 볼때 모조의 딜링기에 준한다는 것은 고레벨유저들이 볼때 나름 강한 공격기술 수준에 해당하지만올인트일지 다른 스텟에 투자했을지 그런거 하나도 모르는모죠의 추측은 추측일 뿐이고   니트의 인트스텟 때문에 약하다라는 말은 만안분적인 말임.", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 14:31", "comment_id": "reply_li_24623870", "parent_comment_id": "comment_li_24613562", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(117.111) (117.111)", "text": "주인공을 부른 이유는 좀 더 행복한 세계를 위한 것으로 추측되기 때문에 릴리가 시간 늦었다며 떠나서 없을 것 같지도 않고  그런 억지 논리로 괴롭히지도 않을 것 같음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 23:15", "comment_id": "reply_li_24650428", "parent_comment_id": "comment_li_24639802", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러61(121.176) (121.176)", "text": "@ㅇㅇ(117.111) 그러면 다행이긴한데 아직 릴리의 의도나 성격을 확신하면 안된다고 봐서릴리쪽 걱정은 아니지만 샐러리맨도 모죠랑 무슨 이야기를 하고 설득된건지 좀 불안하고니트 지휘대로 전투가 진행되면 니트가 네크로어쩌고 집단 입장에선 탐나는 인재인거니까그냥 내가 스토리 볼때 이대로 잘풀릴리가 없는데.. 마인드가 좀 있긴해", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 23:34", "comment_id": "reply_li_24651492", "parent_comment_id": "comment_li_24639802", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "차트정후", "text": "소원정리니트ㅡ검사 살려줘버섯할배ㅡ고인마나는 썩어. 마나순환원해여왕벌ㅡ니트왈 \"실제 여왕벌의 삶은 고통\"              여왕벌 역시 마나순환 으로 추측ㅇㅇ  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.26 01:27", "comment_id": "reply_li_24656360", "parent_comment_id": "comment_li_24639802", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "스미레코 근데 엄청 밀어주지 않냐 저번에 나온 꽃 휘날리며 격려해주는 연출은 이 만화에서 다른 히로인은 범접할수가 없는 연출인데 미샤조차 그렇게 애뜻한 씬은 안나옴 나머지도 로맨스 연출 거의 없고 - dc App", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 10:06", "comment_id": "comment_li_24613573", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "차트정후", "text": "ㄴ미샤 포함 이때까지 만난 히로인들 다 하나씩은 하자가 있는데 스미레코가 가장 정상 범주의 상식을 가진 육각형 정실이긴 해ㅇㅇ 게다가 주인공과 동레벨구간에다 몰락귀족 출신까지. 니트와 함께하면 가장 성장을 많이할 전형적인 성장형히로인이긴 함  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 10:29", "comment_id": "reply_li_24614319", "parent_comment_id": "comment_li_24613573", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@차트정후 근데 넘 뜬금없이 첫 에피소드만에 밀어주니까 좀 뭔가 싶음 심지어 초반부에는 빌런인가 싶을정도로 속마음 연출하던데 갑자기 급커브됨 - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 10:31", "comment_id": "reply_li_24614421", "parent_comment_id": "comment_li_24613573", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.185) (211.185)", "text": "미샤 계단 연출은 좋긴 했는데", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 10:35", "comment_id": "reply_li_24614556", "parent_comment_id": "comment_li_24613573", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(211.185) 나도 계단씬이 제일 좋긴한데 그건 로맨스보단 뭔가 둘의 끈끈한 관계? 느낌이면 스미레코 꽃잎씬은 약간 정실이 보듬어주는 느낌이 났음 - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 10:37", "comment_id": "reply_li_24614609", "parent_comment_id": "comment_li_24613573", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "차트정후", "text": "미샤ㅡ전송실패소녀,얀데레정령ㅡ인간싫어싫어티타니스ㅡ인간목장주인토끼ㅡ수인력 max아마란사스ㅡ생체실험 보스냥코ㅡ시체 오브젝트깐프ㅡ시체 오브젝트2스미레코ㅡ니트가 원래 파티안하려했고 그저 스쳐지나가는 npc 1 이었는데, 미샤가 니트의 원래세계로 못가게하기위한 인연장치로 파티넣은 캐릭. 미샤의 일순간 판단미스로 인한 역ntr전개 이것또한 미식이거든요 ㅇㅇ 동인지 그린 만력작가라 더욱 기대되는 포인트  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 10:46", "comment_id": "reply_li_24614887", "parent_comment_id": "comment_li_24613573", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "차트정후", "text": "@ㅇㅇ 초반 빌런인가 싶은 속마음 연출이 이세계인을 바라보는 정상인의 시점을 표현한게 아닐까싶음. 비유가 적합한가모르겠지만 게임세계의 경험치를 현실세계에 돈으로 비유하면 나와 비슷한 재정능력을 가진 서민이 자기가 개꿀돈벌이 안다며 갑작스레 같이하자 권유하면 상식인이라면 캄보디아를 의심할수밖에ㅇㅇ뭐 확신은 할순없지만 갑자기 분위기 급커브된건 작가의 텍스트는 절제하고 연출을 극대화하는 특유의 스타일땜에 그렇게 더 다가오는게아닌가싶기두함ㅋㅋ  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 11:03", "comment_id": "reply_li_24615425", "parent_comment_id": "comment_li_24613573", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(59.0) (59.0)", "text": "미샤가 그 포자씬 가져갔으면 미샤 정실력 10배 올랐음 ㄹㅇ 그 씬을 나온지 얼마안된애가 먹어서 좀 기분 이상하긴함 갠적으로 다른애가 말한것처럼 좀 의도적으로 남주가 본래 세계로 못돌아가는 장치를 만들어주는 느낌", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 11:04", "comment_id": "reply_li_24615452", "parent_comment_id": "comment_li_24613573", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "서양불곰입문", "text": "미샤는 연인보다 딸냄력이 강하니깐", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 11:23", "comment_id": "reply_li_24616074", "parent_comment_id": "comment_li_24613573", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "차트정후", "text": "@서양불곰입문 동감. 니트도 미샤를 볼때마다 동생이 자꾸 생각난다 스택도 쌓아왔고..ㅇㅇ아무리 일본이 근친을 허용한 막장이라지만 실제론 친척간까지고 정식연재할 생각이 1이라도 있다면 동생과 러브라인은 안갈꺼란 생각ㅇ 동인지도 아니구ㅇㅇ젠장, 그래도 난 미샤 너가 너무 좋다  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 11:32", "comment_id": "reply_li_24616351", "parent_comment_id": "comment_li_24613573", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "반갈죽", "text": "트위터 보니까 여기까지 127화인가보네 이번주 배급 끝!", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 10:13", "comment_id": "comment_li_24613804", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "차트정후", "text": "그렇담 내일은 배급이 안나온단 말이더냐? 아 이거 금단현상 못참겠는데  - g": "", "date": "11.25 11:42", "comment_id": "reply_li_24616770", "parent_comment_id": "comment_li_24615866", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "보슨", "text": "정식연재는 리메이크가 따로 하고 있긴한데 이 경우 원작가는 콘티 작가 취급임 보수도 분배해서 받을걸  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 13:54", "comment_id": "reply_li_24622374", "parent_comment_id": "comment_li_24615866", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "난다날어", "text": "미끼야아악", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 11:19", "comment_id": "comment_li_24615926", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "미샤아아아앗", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 11:23", "comment_id": "comment_li_24616070", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러47(122.32) (122.32)", "text": "니트가 쓰는 스킬이 마나 많이 털어먹고 하는 스킬은 아니지않나? 그렇다 해도 어차피 금방 회복될거같은데마나 100% 쓰는 스킬이라 이후 전투 불능에 가까움>마나 막 엄청 많이 먹는 스타일 아니라 보스 이중즉사 끊으려고 씀기믹 자체가 처음부터 페이크 들어간게 아니라 피 깎이면서 페이크 들어감>즉사기 2개면 피통 30퍼 이하의 가능성 아이스에이지 내 파티원들 얼음공격 다 스택으로 쌓임, 폭탄딜이라 못해도 10~15퍼정도의 데미지 생각했을 거 같은데저 스택이 제한없이 계속 쌓이는거면 ㄹㅇ 보스에서 치트스킬인거고, 니트 회복량 간과한 계산이면 그래도 저렙이라 최대마나치 적을건데딜이 그정돈 아닐거같고ㅇㅇ 스택제한이 엄청 높거나(x999) 없을 가능성이 높을듯", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 11:30", "comment_id": "comment_li_24616295", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "Ffly", "text": "스택 max 도달했다고 나왔음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 11:33", "comment_id": "reply_li_24616383", "parent_comment_id": "comment_li_24616295", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러47(122.32) (122.32)", "text": "@Ffly 맞네 126에 나오네 없을 가능성은 없겠구나", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 11:36", "comment_id": "reply_li_24616507", "parent_comment_id": "comment_li_24616295", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러20(121.167) (121.167)", "text": "이미 대면했을때부터 피통 30~40퍼정도였을꺼임 보스끼리 싸워서 30퍼정도부터 회복중이었으니까. 포자는 즉사기는 아님 니트같은 쪼랩은 즉사지만. 니트마나회복은 전투사이사이 회복이고 전투중은 아님. 스택이 딜량의 핵심일거같긴 함. 사실 그거밖에 없음 쪼랩들이 그나마 노려볼만한게. 이번내용으로보면 얼음스택이 모 아니면 도 임. 쌓인다고 당장 무슨 보너스가 있는게 아니라 쌓아서 터트리는 용도로만 쓰이는 듯. 그리고 쌓는다는 특성상 많이 쌓으면 쌓은것 이상으로 보너스가 있을거고 풀로 쌓으면 또 그 이상의 보너스가 있어야 밸런스가 맞음. 과금할때 만원 10개사는것보다 10만원 하나사는게 효율좋듯이.", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 11:44", "comment_id": "reply_li_24616834", "parent_comment_id": "comment_li_24616295", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "Ffly", "text": "그리고 두 보스 싸움 붙여서 보스 피 30%에서 전투 시작했음근데 그런거 감안해도 장비도 안맞춘 50-20-20 애들이 딜넣어서 잡는건 만화적 허용이라 봐야될듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 11:44", "comment_id": "reply_li_24616852", "parent_comment_id": "comment_li_24616295", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "Ffly", "text": "@만갤러20(121.167) 저렇게 빡센 보스와 싸울 때도 중간에 졸면서 마나 회복한다는건 말이 안됨. 패턴 파악 + 패턴 회피 + 흘린 몹 처리 + 짤딜 + 얼음 스택 다 해야되는데 그 중간중간에 잘 수 있는건 억지임", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 11:46", "comment_id": "reply_li_24616964", "parent_comment_id": "comment_li_24616295", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러20(121.167) (121.167)", "text": "@Ffly 그니까 안잤다니깐 마나회복은 못했음 아예. 그러니까 스택밖에 없다는거임. 근데 혼자 쌓은것도 아니고 셋이서 쌓은거고. 보스 체력은 남은게 애초에 적었을거고 줄넘기 보스라 탱보단 딜쪽 보스니 체력도 상대적으로 더 적었을 거고. 만화가 맘이지만 말이 안되는건 아님", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 11:50", "comment_id": "reply_li_24617158", "parent_comment_id": "comment_li_24616295", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "" ent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러28(218.234) (218.234)", "text": "파이어 볼로 포자폭격 유폭시킬 때도 딜 들어가지 않았으려나.", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 09:08", "comment_id": "reply_li_24611687", "parent_comment_id": "comment_li_24611356", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(147.47) (147.47)", "text": "아무리 딜특 아니래도 디버퍼가 3중디버프 풀로 걸어주고 50렙 + 30렙 둘 vs 70렙(+부파딜)인데 70렙이 더 쎄야지", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 09:14", "comment_id": "reply_li_24611831", "parent_comment_id": "comment_li_24611356", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(147.47) (147.47)", "text": "특히 앰플이랑 디크리피파이가 디아2 네크랑 같으면서 동시디버프 걸리는 좆사기 스킬이 맞다면 물딜이 최소 2.5배임", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 09:17", "comment_id": "reply_li_24611923", "parent_comment_id": "comment_li_24611356", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(219.249) (219.249)", "text": "@ㅇㅇ(147.47) 물깎 해봤자 미샤는 정석보다 INT에 더 투자한 하이브리드 형이고 리맨은 5분 간 잠수탔음 리맨은 아수라 올인형이 아니라 DPS로 승부하는 연격형이라서 아수라도 부파용이지 딜은 생각보다 약했을 거고 게다가 니트도 몰랐던 보스 방어력 포함 스테이터스 상승하는 2페이즈 기믹도 있어서 더 빨리 잡았어야 한다는 보장은 없음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 09:27", "comment_id": "reply_li_24612233", "parent_comment_id": "comment_li_24611356", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러20(121.167) (121.167)", "text": "@ㅇㅇ(147.47) 비슷하게 센 보스라지만 버섯보스는 여왕벌에 비해 좀 극단적인 성격의 공략법이 필요해 보임. 패턴파악 못하면 죽는 소울류 vs 일반rpg류 보스 같은 느낌임. 그리고 아프로파티가 잡몹잡으면서 던전에 깊은곳까지 들어가 잡고 나와 버섯보스까지 오는 긴 시간동안 주인공파티는 훨씬 오래 싸웠음. 결정적으로 코퀴토스가 세명의 얼음스택을 열심히 쌓아서 풀스택 보너스가 들어갔을 가능성이 있음. 스택을 셋이서 열심히 쌓아야 할 정도로 혼자서는 쓰기 힘들다는 디메리트가 있는 대신 풀스택 데미지 보너스가 그만큼 있을 가능성이 있음. 그리고 만화가 맘임 이정도면 설득력있게 만들었음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 09:30", "comment_img": "", "date": "11.25 09:53", "comment_id": "comment_li_24613049", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.38) (223.38)", "text": "일단 모죠가 벌써 하나 틀린게 마나 오링날꺼라 함부로 못쓸거란거몹 패턴은 쪼렙부터 맞는걸 상상도 안해서 agi도 안찍은 새끼가 마나통 순식간에 채우는걸 모르니실질적인 패널티는 스택보너스뿐", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 09:54", "comment_id": "comment_li_24613088", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "됬충으로써", "text": "근데 쟤는 페이크를 존내 걸어서 빡집중해야되니까 못잡으면 마나 회복은 못하지 않았을까", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 10:03", "comment_id": "reply_li_24613420", "parent_comment_id": "comment_li_24613088", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "저기서 평소 하듯이 릴랙스로 마나 다시 채우려면 패턴 전조 체크 못해", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 10:09", "comment_id": "reply_li_24613678", "parent_comment_id": "comment_li_24613088", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "차트정후", "text": "작가가 하고싶은 말을 모죠의 얼굴을 빌려 하는거라 모죠가 맞음. 일단 앞서 2페이지에 걸쳐 동옥의 세부 스킬묘사(시전후 마나오링으로 헉헉대든장면)해줬고, 주인공 니트가 두 동료(한명은 파티원, 한명은 비파티원) 목숨을 책임지는 오지선다 줄넘기를 하고있었기에 풀집중 상태였음, 물론 자연스런 마나리젠은 했었지만 이전 던젼에서 보여준 폭발적인 수면마나리젠을 할 여유가 없었음. 그런데 아쳐가 폭발적인 마나리젠을 해내니 니트가 주목했던거고.니트는 줄넘기리딩하고, 프로스트다이버로 빙결스택 쌓으며 목표스택 쌓기까지만 기다렸던거임  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 10:10", "comment_id": "reply_li_24613698", "parent_comment_id": "comment_li_24613088", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "응애(117.111) (117.111)", "text": "@차트정후 뭔 모죠가 맞아 ㅋㅋㅋㅋ   최대 스택도 모르고 조건도 명확하게 알지 못 하는 내부세계의 나름 지식인의 한계가 있어서 모죠는 얼추 맞지만 정답이 될 수 없는 틀린 말임.", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 14:51", "comment_id": "reply_li_24624643", "parent_comment_id": "comment_li_24613088", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러41(1.245) (1.245)", "text": "Rpg 퍼거새끼들 현실엔 존재하지도 않는 게임 세계관 가지고 디테일 따져가면서 퍼거토론 하는 거 존나 웃기네", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 09:57", "comment_id": "comment_li_24613202", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(183.103) (183.103)", "text": "그만큼 만화가 재밌다는거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 10:09", "comment_id": "reply_li_24613684", "parent_comment_id": "comment_li_24613202", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "차트정후", "text": "절이 싫으면 중이 떠나야하는법. 여기 만갤이잖아ㅋㅋ 만갤은 만갤다울수록 좋다 생각해  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 10:12", "comment_id": "reply_li_24613770", "parent_comment_id": "comment_li_24613202", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.38) (223.38)", "text": "ㄹㅇ 개연성 적인거면 몰겠는데 작가가 그렇다는데도 지좆대로 오피셜 만들면서 지랄하는 애들은 뭔가 싶네 앵간하면 그러려니 하는데 진짜 오타쿠인 내가 봐도 역겨울 정도임", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 10:52", "comment_id": "reply_li_24615069", "parent_comment_id": "comment_li_24613202", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "Ffly", "text": "@ㅇㅇ(223.38) 작가의 말이 어딨음?", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 11:34", "comment_id": "reply_li_24616416", "parent_comment_id": "comment_li_24613202", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(223.38) (223.38)", "text": "@Ffly 케릭이 주절대는게 작가의 말이잖아 케릭이 사실은 틀렸는지는 별론으로 틀렸다면 작가가 나중에 따로 언급할거고 그걸 일개 독자 나부랭이가 케릭이 틀렸다고 조잘대는거 안보이냐? 지 뇌피셜로 오피셜인양 구는지 노이해고 역겹다는거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 11:37", "comment_id": "reply_li_24616542", "parent_comment_id": "comment_li_24613202", "dccon_sourc  "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "응애(117.111) (117.111)", "text": "모죠의 추측딜량은 무조건 틀렸음마나회복량도 스택산출법도 딜계산법도 주인공의 스텟도 주변인물 딜값도 모름벌은 물방이 높고 공격적이라 딜타임이 잘 안나옴물방깎이 어쩌구저쩌구해도 튼튼한 놈당장 벌시체폭탄연타 쳐맞고 헤이트 바로 뺏기는거 보면 헤이트 높은 스킬이 아니면 누적딜량도 구리고여기서 뭘 근거로 모죠말로 주인공 딜추측하면서 논쟁이야 ㅋㅋㅋㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 10:12", "comment_id": "reply_li_24613790", "parent_comment_id": "comment_li_24613562", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@응애(117.111) 모죠가 그래도 지능캐로 나오는데 완전틀리지는 않겠지 아수라 공식도 최적화가 덜된거지 딜계산은 비슷하다며", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 10:17", "comment_id": "reply_li_24613936", "parent_comment_id": "comment_li_24613562", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러20(121.167) (121.167)", "text": "먼가 이상하다 말하는 애들은 설정오류거나 그정도 급이다 혹은 결국 니트가 치트라서 노잼각나온다 이런건데. 먼가 설명할만한게 충분히 나오는걸 보면 그정도는 아닌듯함", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 10:18", "comment_id": "reply_li_24613957", "parent_comment_id": "comment_li_24613562", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "응애(117.111) (117.111)", "text": "@응애(117.111) 던파마냥 근처에 있기만 해도 어그로 끌고가고메이플마냥 한대 치기만하면 어그로 옮겨지기도하는어글탱 개념이 얕은 배경이라서 때리자마자 어그로 먹었다  이런 설정이면  헤이트 값으로 추측도 안되는데", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 10:18", "comment_id": "reply_li_24613959", "parent_comment_id": "comment_li_24613562", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "응애(117.111) (117.111)", "text": "@ㅇㅇ 누적스택 환산 자체가 불가능해서 비슷하지도 못 할거최대스택도 모르고   파티원이 냉기스택주는것도 모를 수도 있음 근거로 삼기엔 너무 빈약함", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 10:19", "comment_id": "reply_li_24614004", "parent_comment_id": "comment_li_24613562", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@응애(117.111) 만화니까 지 알아서 스택 추측잘해서 비슷하게 만들겠지 완전 틀리게 만들면 너무 좆세계 뽕빨물이라 노잼인데 이때까지 만력보면 그렇게 전개하진 않을듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 10:23", "comment_id": "reply_li_24614128", "parent_comment_id": "comment_li_24613562", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "응애(117.111) (117.111)", "text": "@ㅇㅇ 계산식이나 방법을 모르는데  뭘 그런 소리를 하냐스택최대치도 모르는 놈이 스택맥스 딜을 어케 추측해파티원 빙결계가 스택주는 것도 모를 것 같은데주인공은 쌓는 동안 마나 떨어지는 이슈도 없고이걸 근사값으로 추측한다? 불가능한게 정론임왜 사용자 본인도 추측하기 어렵다고 모죠가 말했겠냐?이 모죠피셜은 또 무시함? 그 근거는 게임 안해본 수준이라고", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 10:34", "comment_id": "reply_li_24614543", "parent_comment_id": "comment_li_24613562", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@응애(117.111) 대충 딜량틀렸다면 그냥 존나쌔다는 내용아님?20렙 궁이 70렙 궁이랑 비비는것도 아니고 그냥 존나쌘거면 좆세계물이지난 릴리 작가 만력이면 그렇게 전개하지는 않을거라고 믿는거고. 모죠를 믿는게 아니라 작가를 믿는거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 10:36", "comment_id": "reply_li_24614601", "parent_comment_id": "comment_li_24613562", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "응애(117.111) (117.111)", "text": "@ㅇㅇ 주인공이 스택맥스라고 착각했고 실제론 아니었습니다.주인공도 존나게 틀렸네요!!  이런 묘사는 보통 쓰지도 않고 그렇게 전개하는 이세계물은 거의 없어서 주인공이 틀렸다는 가정을 하기는 힘들고  결과값도 주인공은 맞았으니묘조가 생각한 것보다 강할 수 밖에 없음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 10:36", "comment_id": "reply_li_24614605", "parent_comment_id": "comment_li_24613562", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러20(121.167) (121.167)", "text": "보스까지 가는 시간이 니트쪽이 확실히 더 짧긴 했을거임. 패턴연습 시간이 있긴 했지만 원래 버섯보스가 북치는 데서 버섯보스 쉬는데까지 짧으면 짧았지 길진 않았을 거고 중간에 몹한마리 안나왔다고 했음. 반면 아프로 파티쪽은 던전공략이었음 고랩이고 니트가 공략을 알려주긴 했지만 입구부터 가는길까지 빠를수가 없는길임. 그리고 되돌아가는 시간도 좀 걸렸을거임. 버섯과 벌이 평소에 그렇게 부딪히지 않는 세력권이라는걸 보면 아무리 지상 지하 차이라도 약간 거리도 있었을거임 그래서 결론은 니트쪽이 보스공략할 시간 자체로 보면 확실히 많았을거임.", "is_reply": true, "dccon": "", "comment_img": edia_version": 2}, {"writer": "보슨", "text": "첫째 주인공의 마나회복량을 얕봄 버스기사는 물론이고 본래 발휘할 수 있는 퍼포먼스보다 스택과 딜을 잘 쌓음둘째 루리코라는 변수 루리코는 집중력과 마나회복량을 둘 다 최대로 유지할 수 있는 현실세계 주민도 이세계주민도 모르는 정체불명의 기술을 보유하고 있어서 스킬을 막 써댐 그만큼 딜이 잘 나옴셋째 버섯제왕이 스펙상으론 황금여왕보단 낮다고 묘사됨(플레이어 기준으론 황금여왕이 귀찮다는 나레이션이 있었음) 원래 게임에선 줄넘기만 잘하면 쉽게 깰 수 있는 수준으로 딜컷이 낮다는 뜻 즉사기 페인트 거는 패턴이 없는 사양이었다면 좀 더 여유롭게 깼을거임 광폭화 패턴도 없었을거고 그냥 죽어라고 즉사기x2 걸어버리는 일이 없었으니 아슬아슬했다 라고 한거같음  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 05:53", "comment_id": "reply_li_24607249", "parent_comment_id": "comment_li_24607181", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "보슨", "text": "그리고 무엇보다 버섯제왕이고 황금여왕이고 이세계 주민들은 버프시간이나 디버프시간 체력같은걸 실시간으로 수치로 볼 수 없다보니(릴리의 집에서 스테이터스 확인하는 경우 아니면) 몇 번 맞으면 죽더라 같은걸로 대충 가늠하는수밖에 없을거임 체력이 실제로 얼마인지 모르는 상태에서 두 보스의 전투력은 막상막하라고 느껴질거고 실제로 버섯제왕을 어떻게 잡았는지는 저 둘은 아무것도 모르니까  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 05:56", "comment_id": "reply_li_24607287", "parent_comment_id": "comment_li_24607181", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@보슨 애초에 말이 안되는거임. 코퀴토스가 아수라패황권 공식과 같거나 비슷하다고 하면 절대 저렙 특성상 딜이 저정도로 세게 나올수있는게 아님. 프리스트 계열이라도 있었으면 렉스 에테르나같은거라도 넣어서 펌핑시켰다고 하거나 모죠라도 있었으면 충분히 가능성이 있는건데 그것도 아니고 코퀴토스로 터트려서 죽이는정도면 한 5~10% 깠다고 하면 모죠 사라리맨 저주+아수라패황권이면 원킬정도 낼수도 있는수준이란건데", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 05:59", "comment_id": "reply_li_24607322", "parent_comment_id": "comment_li_24607181", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "@보슨 걍 비슷한 스펙이 아니라 아예 이벤트성이거나, 다른 특수한 기준이 있거나 준보취급정도로 생각해야하는거 아니면 말이 안된다고 봄. 좀 낮은 스펙정도론 저렇게 하는 구상은 말이 안됨", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 06:02", "comment_id": "reply_li_24607363", "parent_comment_id": "comment_li_24607181", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2  05:15", "comment_id": "comment_li_24606717", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러8(211.235) (211.235)", "text": "미샤 스미레코 첩으로 들이려고 했는데 정실자리 위협하니까 바로 개씹정색ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 05:22", "comment_id": "comment_li_24606815", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.255) (106.255)", "text": "스미레코가 에피소드 한번으로 정실 자리 위협하는 수준까지 갔다는게 대단하긴해", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 05:22", "comment_id": "comment_li_24606822", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "보슨", "text": "생판 처음 보는 남을 구하기 위해 목숨을 걸어주기x2 순서만 달랐다 뿐이지 마녀쨩도 충분히 자격 있음 ㅇㅇ  - dc App", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 05:46", "comment_id": "reply_li_24607178", "parent_comment_id": "comment_li_24606822", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "근데 저정도로 죽는거면 버섯이 걍 이벤트성 보스나 아니면 유리대포 몹이라고 보는게 맞겠는데. 모죠쪽이랑 사라리맨이 게임 설정상으로 따지자면 아수라패황권 렙을 못올렸어도 모죠 디아블로2 앰플리파이 디크리파이 성능이랑 똑같으면 데미지가 2~3배가 최종뎀에서 더들어가는거라 코퀴토스 산출식이 어떻게 되는진 몰라도 비슷한 공식이면 비교가 안될텐데", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.25 05:23", "comment_id": "comment_li_24606826", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.154) (221.154)", "text": "렉스에테르나가 딱 1회에 한해서만 2배로 올려줘도 아수라패왕권 잘해먹을때 그것보다 동일~1.5배 더 높은 효율로 10~12초 지속이면 대체 저 세계관 네크는 얼마나 사긴겨", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.25 05:29", "comment_id": "reply_li_24606930", "parent_comment_id": "comment_li_24606826", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.197) (211.197)", "text": "ㄹㅇ 유리대포라 막판 즉사기 2개 동시 시전도 이 정도 딜컷도 여태 못했으면 그냥 죽어라 하는 거면 이해 가능 그
