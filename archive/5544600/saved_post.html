er": "병렬독서(221.155) (221.155)", "text": "@ㅇㅇ(14.39) 직장생활 안해봤구나.. 직장에서는 학교에서처럼 친목질 하려하면 왕따당함. 직장은 서로 공과사 지키는 분위기임", "is_reply": true, "dccon": "", "comment_img": "", "date": "07.31 10:35", "comment_id": "reply_li_18828294", "parent_comment_id": "comment_li_18827989"}, {"writer": "만갤러36(116.34) (116.34)", "text": "@병렬독서(221.155) 왕따는 너네 ㅋㅋ 뭔 직장에서 친목질을 안해 친목질의 향연이고 또 그게 싫은사람은 걍 혼자 다니는거지 그리고 공과사랑 친목질이랑 뭔상관이여 니말대로 사는 사고 공은 공이지 ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "07.31 14:23", "comment_id": "reply_li_18834600", "parent_comment_id": "comment_li_18827989"}, {"writer": "병렬독서(221.155) (221.155)", "text": "취업을 못하는 한국이 취업률 100%의 일본을 까네 ㅋㅋ 진짜 메타인지 뒤지게안되네", "is_reply": false, "dccon": "", "comment_img": "", "date": "07.31 10:19", "comment_id": "comment_li_18828038", "parent_comment_id": ""}, {"writer": "만갤러38(180.65) (180.65)", "text": "ㄹㅇㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "07.31 15:14", "comment_id": "reply_li_18835954", "parent_comment_id": "comment_li_18828038"}, {"writer": "만갤러40(58.224) (58.224)", "text": "팩트는 한국에서 알바하는게 일본 취업하는거보다 대우랑 페이가 낫다는거임 ㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "07.31 15:51", "comment_id": "reply_li_18836856", "parent_comment_id": "comment_li_18828038"}, {"writer": "ㅇㅇ(14.39) (14.39)", "text": "공격적으로 농담해도 선 지키는 애들 < 그런거 없고 그냥 무리에서 가장 만만한 놈 패면서 선 지킨다고 착각하는거임 초중학생때 돌이켜 생각해보면 그때는 그냥 친구끼리 욕해도 별 상관없다고 생각하고 드립치고 그랬었는데 나중에 돌이켜 생각해보니까 선넘는거 좀 있는거같아서 부끄러워지던데근데 서민 한정으로는 한국이 더 살기 좋은건 맞지 이건 통계가 증명하는데 아니라 그러는건 통계랑 기싸움하는거임", "is_reply": false, "dccon": "", "comment_img": "", "date": "07.31 10:29", "comment_id": "comment_li_18828203", "parent_comment_id": ""}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "주작 그만해", "is_reply": false, "dccon": "", "comment_img": "", "date": "07.31 10:39", "comment_id": "comment_li_18828379", "parent_comment_id": ""}, {"writer": "ㅇㅇ(182.227) (182.227)", "text": "니들이 존나 착각하는게 한국 스팩갖고 일본 그대로 가면 저거 보다 연봉을 더 받음 저건 외노자 월급임일본에서 태어났음 군대도 안가고 사회진출도 몇년 더 빠르게 함 한마디로3 일본 sercontent.com/d/11rGN8Es8EctG0OjhWuowvNBVEib7rllr", "date": "07.31 06:53", "comment_id": "reply_li_18824295", "parent_comment_id": "comment_li_18823230"}, {"writer": "ㅇㅇ", "text": "@만갤러3(59.13) 진짜 궁금해서 그러는데 취업은하고 일은하는거맞음? 보통 연봉얘기하거나 연차얘기할때 10년차 1.5억 찍는다는게 연봉을 뜻하는거지 누가 저축액으로 알아먹음? 비난이 아니라 진짜 순수하게 궁금해서 물어보는거임", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/11rGN8Es8EctG0OjhWuowvNBVEib7rllr", "date": "07.31 07:28", "comment_id": "reply_li_18824825", "parent_comment_id": "comment_li_18823230"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ 나도 이거 공감한 일본 IT어디가 10년차 연봉 1.5억을 주는지 궁금함 본인이 주장한 \"적어도\"면 수두룩하다는 얘기에 그게 최소값이라고 주장하는데, 한국처럼 1~2%정도가 1.5억인걸로 알고 일본에서 일할때봐도 아마존이나 구글 마소 인디드같은 글로벌 빅테크 재직하거나 제인스트릿 시타델같은 외국계 금융기업에서 일하는 사람말곤 10년차 1.5억을 단 한번도 본적이없는거같은데 도데체 누가 어디서 근무하는사람이 10년차에 1.5억이 수두룩하고 그게 최솟값으로 벌어감?", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/11rGN8Es8EctG0OjhWuowvNBVEib7rllr", "date": "07.31 07:34", "comment_id": "reply_li_18824955", "parent_comment_id": "comment_li_18823230"}, {"writer": "노루?!", "text": "@만갤러3(59.13) 7  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/18_8Odm7gvjwAJ_jNNo0fDAVCWUk6dmaG", "date": "07.31 08:04", "comment_id": "reply_li_18825466", "parent_comment_id": "comment_li_18823230"}, {"writer": "만갤러11(125.196) (125.196)", "text": "실제로 저기에 자기 스펙이나 기술같은거 1도 안적은거 보니까 ㅋㅋㅋㅋㅋ 한국에선 최저일할 능력임아니 일본 취업 개 쉬워서 왔으면 취업하고 자기개발해서 이직할 생각을 해야지 그냥 회사 붙은데 하나 계속 다니다가 월급 낫다고 투덜대면서 귀국 ㅋㅋㅋ저런놈들 한두명 본게 아니라서 ㅋㅋㅋㅋ 그냥 한국에 있었으면 7년쉬었음임실제로 한국가도 스펙 ㅈ구려서 취업도 못하고 일본 리턴하는 병신들 많이봄", "is_reply": true, "dccon": "", "comment_img": "", "date": "07.31 08:11", "comment_id": "reply_li_18825551", "parent_comment_id": "comment_li_18823230"}, {"writer": "ㅇㅇ(112.157) (112.157)", "text": "인당 GDP , 중위소득, 가처분 소득, 평균연봉 다쳐발리고 눈귀쳐막고 우기기 밖에 안남은 방사능 원숭이들 개발작났노 ㅋㅋㅋㅋㅋㅋㅋㅋ 방사능에 피폭된 원숭이들 쪽빠리 잘나간다고 우기는게 벌써 20년째인데 우째 한국한테도 쳐발리는 열등국가가되었노 ㅋㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "07.3 parent_comment_id": ""}, {"writer": "ㅇㅇ(42.82) (42.82)", "text": "한국보다 살기 좋아도 지진 때문에 고민할텐데 이제는 한국보다 잘사는것도 아니니", "is_reply": false, "dccon": "", "comment_img": "", "date": "07.31 03:44", "comment_id": "comment_li_18821397", "parent_comment_id": ""}, {"writer": "ㅇㅇ(220.94) (220.94)", "text": "일본은 가성비 여행만 빨아먹고 버리는게 최고", "is_reply": false, "dccon": "", "comment_img": "", "date": "07.31 03:44", "comment_id": "comment_li_18821413", "parent_comment_id": ""}, {"writer": "ㅇㅇ(118.47) (118.47)", "text": "이제는 진짜 군대 포함해도 한국이 더 나은거 같다", "is_reply": false, "dccon": "", "comment_img": "", "date": "07.31 03:45", "comment_id": "comment_li_18821421", "parent_comment_id": ""}, {"writer": "ㅇㅇ(211.222) (211.222)", "text": "서민한테 일본은 지옥임", "is_reply": false, "dccon": "", "comment_img": "", "date": "07.31 03:45", "comment_id": "comment_li_18821433", "parent_comment_id": ""}, {"writer": "ㅇㅇ(221.150) (221.150)", "text": "일뽕 빼는 가장 쉽고 빠른 방법 = 일본에서 살아보면 됨", "is_reply": false, "dccon": "", "comment_img": "", "date": "07.31 03:47", "comment_id": "comment_li_18821477", "parent_comment_id": ""}, {"writer": "ㅇㅇ(119.195) (119.195)", "text": "일본 살면서 좀 안좋았던 점들1. 단열이 제대로 안 돼서 여름엔 덥고 겨울엔 추움2. 전기세, 가스비 등 공과금이 존나 비싸서 에어컨, 보일러 계속 돌릴 수가 없음3. 행정 절차가 한국에 비해 너무 복잡하고 느림4. 월급이 너무 적은데 그에 비해 뜯어가는 세금은 또 많음5. 일본 시골이 낭만이라고 하는데 막상 가보면 그냥 한국 시골이랑 별 차이 못느끼겠음6. 음식 맛이 대부분 간장 베이스라 초반엔 맛있는데 나중가면 질리기 너무 쉬움 (맛이 뭔가 다 비슷비슷 함)7. 생각 이상으로 개인 이기주의가 팽배하고, 겉으론 친절한데 뒤로는 텃세나 따돌림 등이 은근히 심함며칠 여행하기엔 볼거리도 많고 정말 좋은 나라인데, 장기간 살기엔 한국보다 딱히 나은점이 있는지 잘 모르겠음", "is_reply": false, "dccon": "", "comment_img": "", "date": "07.31 03:50", "comment_id": "comment_li_18821547", "parent_comment_id": ""}, {"writer": "ㅇㅇ(218.209) (218.209)", "text": "일본은 여행으로 갔을때가 가장 좋다고 실제로 이민 간 한국인들이 유튜브로 알려주잖아", "is_reply": false, "dccon": "", "comment_img": "", "date": "07.31 03:50", "comment_id": "comment_li_18821566", "parent_comment_id": ""}, {"writer": "ㅇㅇ(175.193) (175.193)", "text": "일본 월급 쥐꼬리만한데 세금으로 다 뜯어가서 다른건 꿈도 못꾸고 딱 먹고 사는것만 유지시켜줌", "is_reply": false, "dccon": "" ", "comment_id": "reply_li_18823257", "parent_comment_id": "comment_li_18821981"}, {"writer": "ㅇㅇ(182.220) (182.220)", "text": "다른건 내가 안살아봐서 모르겠는데 일본 개그맨 개쳐웃기던데 만담같은거", "is_reply": false, "dccon": "", "comment_img": "", "date": "07.31 04:07", "comment_id": "comment_li_18822008", "parent_comment_id": ""}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
