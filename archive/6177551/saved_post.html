omment_id": "comment_li_21003794", "parent_comment_id": ""}, {"writer": "만갤러9(49.142) (49.142)", "text": "그냥 바키나 도박마처럼 '얘들 그냥 존나 쌤 UFC 챔피언? 이 세계관에선 좆밥임' 으로 가지 이것처럼 '격투기 선수는 룰에 보호 받는 애들일뿐 진짜 존나 쌘 애들은 실전싸움꾼임' 이 설정은 언제부턴가 급짜침UFC 선수한테 불알부수기 , 눈찌르기 , 박치기 , 물어뜯기 허가하면 당연히 얘네가 더 쌔고룰에 보호 받는게 아니라 룰때문에 약해진 애들이 격투기 선수인건데 것참그냥 첫장의 저걸 언급하지 말지 언급 안해도 상관없는 내용이구만", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.13 00:13", "comment_id": "comment_li_21003799", "parent_comment_id": ""}, {"writer": "만갤러9(49.142) (49.142)", "text": "당장 존존스한테 불알부수기 눈찌르기 박치기 물어뜯기 허가하면 이 새끼가 아키라 야진 존윅 되는거지뭔 룰때문에 보호받는다 ㅇㅈㄹ", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.13 00:16", "comment_id": "reply_li_21003933", "parent_comment_id": "comment_li_21003799"}, {"writer": "ㅇㅇ", "text": "임최몸으로 저지랄 하는거 부터 판타지 세계관 아니냐", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1NClRrYf4cV12eg0BoUSDAH5vsAmkWyo4", "date": "09.13 00:21", "comment_id": "reply_li_21004128", "parent_comment_id": "comment_li_21003799"}, {"writer": "만갤러9(49.142) (49.142)", "text": "@ㅇㅇ 내 말의 핵심은 세계관을 떠나서격투기 선수들 보고 '룰로 보호 받고 있는 푸시들' 이라는 언급 자체가 짜친다는거임격투기 선수한테 불알부수기 눈찌르기 박치기 물어뜯기 허용하면 당연히 더 쌔지는건데 뭔 보호받고있다 ㅇㅈㄹ반대로 쟤들한테 불알부수기 눈찌르기 박치기 물어뜯기 금지하면 더 약해잖슴실제로 1화 내용에 첫장 저 내용 있으나 없으나 달라지는 것도 없는데바키나 도박마 보면 저런 언급도 필요 없이 '그냥 아 이새끼들한텐 격투기 선수도 좆밥이네 그냥 얘들은 아예 다른 세상의 부류네' 바로 연상되잖슴 ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.13 00:30", "comment_id": "reply_li_21004382", "parent_comment_id": "comment_li_21003799"}, {"writer": "만갤러9(49.142) (49.142)", "text": "차라리 무기면 당연히 납득이 가는데뭔 불알부수기 눈찌르기 박치기 물어뜯기 에라이 씹...UFC룰 지켜야되는 존존스VS불알부수기 눈찌르기 박치기 물어뜯기 외에도 그냥 전부 다 가능한 무규칙 정찬성(무기만 불가)하면 정찬성이 이길거같은데이 정도로 강해지는걸 뭔 룰에 보호받는다 ㅇㅈㄹ", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.13 00:37", "comment_id": "reply_li_21004616", "parent_comment_id": "comment_li_21003799"}, {"writer": "만갤러35(116.40) (116.40)", "text": "ㄹㅇ 그리고 일단 존스형은 이미 눈찌르기랑 상대 관절 부수기 쓰고 있는데 무슨 무규칙 이러는거 짜치긴함 UFC 규칙 무규칙되면 존 const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) .getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
