했을때 이미 인간으로서 수준이 최하급 떨어진것", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.06 19:02", "comment_id": "reply_li_22227957", "parent_comment_id": "comment_li_22222099"}, {"writer": "ㅇㅇ(59.19) (59.19)", "text": "", "is_reply": true, "dccon": "https://lh3.googleusercontent.com/d/109SrRtEE19gqbm2Pni6Z3QT3_sKvrsRW", "comment_img": "", "date": "10.06 19:05", "comment_id": "reply_li_22228095", "parent_comment_id": "comment_li_22222099"}, {"writer": "복식부기", "text": "@ㅇㅇ(59.19) 비단 취업에만 해당되는 것도 아니고 러시앤캐시 같은 데서 돈 빌리면 신용점수 바로 박살남앰생이면 뭐 알아서 하는 거지만 정상적인 삶을 살고싶다면 절대 그런 곳은 얼씬도 하면 안됨", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1KniV-_CQ9K7MYwkOVgb_wmybJVBMXHI2", "date": "10.07 02:40", "comment_id": "reply_li_22247116", "parent_comment_id": "comment_li_22222099"}, {"writer": "ㅇㅇ", "text": "신용관리 개박살나서 사금융쓰는것부터가 신용도 개작살남 자본주의 사회에서 너 뭐되냐의 지표라서", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1ZGY4M39LdJztqDpBIZhbpoETFKSvaUn1", "date": "10.07 13:02", "comment_id": "reply_li_22262681", "parent_comment_id": "comment_li_22222099"}, {"writer": "ㅇㅇ(222.109) (222.109)", "text": "이상하게 사채 야쿠자 나오면 오사카가 무대인경우가 많더라 원래 그런동네임?", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.06 16:59", "comment_id": "comment_li_22222190", "parent_comment_id": ""}, {"writer": "만갤러26(121.158) (121.158)", "text": "오사카가 물류, 상업이 발전해서 자연스레 고리대금업도 발전했고 현대적인 사채업 시스템의 기틀을 잡은 게 오사카. 서브컬처에서 오사카 사채업자가 악독하게 나와 긱인된 것도 있음.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.06 17:07", "comment_id": "reply_li_22222565", "parent_comment_id": "comment_li_22222190"}, {"writer": "ㅇㅇ(222.117) (222.117)", "text": "원래 오사카에 군수공장이 많이 있어서 종전전에 재일 조선인들 많이 살았었고 종전후에 주로 종사하던게 범죄조직이나 파칭코, 대부업 같은 거였음. 저기 주인공 선배로 나오는 눈째진 애들도 다 재일이라는 설정", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.06 18:29", "comment_id": "reply_li_22226445", "parent_comment_id": "comment_li_22222190"}, {"writer": "ㅇㅇ", "text": "5ch나 니코동에서 오사카 까는 용어 d": "comment_li_22217055", "parent_comment_id": ""}, {"writer": "야구부실눈빡빡이", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/16RmlfQWLaxm79wL1EXQ9aj94P0MVPYzL", "comment_img": "https://lh3.googleusercontent.com/d/1KniV-_CQ9K7MYwkOVgb_wmybJVBMXHI2", "date": "10.06 14:58", "comment_id": "comment_li_22217067", "parent_comment_id": ""}, {"writer": "ㅇㅇ(115.20) (115.20)", "text": "크윽.. 걸작과 쓰레기가 공존하는 만갤은 대체..", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.06 14:59", "comment_id": "comment_li_22217089", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "가로채고 있었다는게 뭔소리냐  - dc App", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1WXE-YhDdfdjrC8L4P19qAc2dHBvnENmZ", "date": "10.06 15:00", "comment_id": "comment_li_22217125", "parent_comment_id": ""}, {"writer": "글쓴 만갤러(118.47) (118.47)", "text": "다른 사람의 사채를 매꿔주기 위해 빌려줬다는 의미 아닐까 싶음. 그리고 사채 이력이 있는 거 자체가 문제기도 하고", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.06 15:03", "comment_id": "reply_li_22217230", "parent_comment_id": "comment_li_22217125"}, {"writer": "ㅇㅇ", "text": "원문은 つまんでいたって 로 사채를 졌었다 이거임 초반에 급여명세서랑 건강보험증으로 두번 빌려줬던 거 내용", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1WXE-YhDdfdjrC8L4P19qAc2dHBvnENmZ", "date": "10.06 15:17", "comment_id": "reply_li_22217752", "parent_comment_id": "comment_li_22217125"}, {"writer": "ㅇㅇ", "text": "어음 할인 이런거 모르는 방구석 만븅이들을 위해서설명도 해줬으먄 좋겠엉옛날 틀딱 식자들은 지식 뽐내는거 좋아해서마지막장에 주절주절 써놨눈데 말이얌", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1WXE-YhDdfdjrC8L4P19qAc2dHBvnENmZ", "date": "10.06 15:05", "comment_id": "comment_li_22217281", "parent_comment_id": ""}, {"writer": "만갤러8(218.54) (218.54)", "text": "ㄹㅇ 할인은 설명해줘야지 ㅅㅂ;;", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.06 15:07", "comment_id": "reply_li_22217363", "parent_comment_id": "comment_li_22217281"}, {"writer": "글쓴 만갤러(118.47) (118.47)", "text": "똑똑한 만붕이들이 달아줄겁니다.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.06 15:08", "comment_id": "reply_li_22217408", "parent_comment_id": "comment_li_22217281"}, {"writer": "ㅇㅇ", "text": "서명과 기명의 차이가 모지 ㄹㅇ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1WXE-YhDdfdjrC8L4P19qAc2dHBvnENmZ", "date": "10.06 15:11", "comment_id": "reply_li_22217517", "parent_comment_id": "comment_li_22217281"}, {"writer": "ㅇㅇ", "text": "어음할인 : 수취한 어음을 어음만기일 이전에 일정 이자를 지불하고 어음의 액면가보다 낮은 현금과 교환하는 것. 이 때 낸 이자율을 할인료라 하는데, 일반적으로 어음대출의 금리보다 낮다.", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1WXE-YhDdfdjrC8L4P19qAc2dHBvnENmZ", "date": "10.06 15:23", "comment_id": "reply_li_22217940", "parent_comment_id": "comment_li_22217281"}, {"writer": "ㅇㅇ", "text": "어음에 적힌 날짜 이전에 현금이 필요해져서, 만기 전 어음을 수수료를 내고 파는 걸 말하는 듯? 작중에서는 사채업자가 어음을 낸 회사가 부도가 날 거 같아서 거부했다는 상황", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1WXE-YhDdfdjrC8L4P19qAc2dHBvnENmZ", "date": "10.06 15:30", "comment_id": "reply_li_22218170", "parent_comment_id": "comment_li_22217281"}, {"writer": "ㅇㅇ", "text": "서명: 본인이 직접 자필로 자신의 이름을 쓰는 것입니다. 필체나 본인 확인이 가능하며, 서명 단독으로도 법적 효력을 가집니다.기명: 자필과 상관없이 단순히 이름을 적어 넣는 것입니다. 타인이 대신 적거나, 컴퓨터 타이핑, 인쇄, 고무인 등으로 이름을 표시한 것 모두 기명에 해당합니다.", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1WXE-YhDdfdjrC8L4P19qAc2dHBvnENmZ", "date": "10.06 15:30", "comment_id": "reply_li_22218194", "parent_comment_id": "comment_li_22217281"}, {"writer": "즈7", "text": "@ㅇㅇ 지시기느러따  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1KniV-_CQ9K7MYwkOVgb_wmybJVBMXHI2", "date": "10.06 15:33", "comment_id": "reply_li_22218307", "parent_comment_id": "comment_li_22217281"}, {"writer": "ㅇㅇ(175.212) (175.212)", "text": "@ㅇㅇ 아 그러면 만화 초반 상황은 1) 주인공이 처음에 일하던 회사는, 어떤 회사가 발행한 어음을 소지하고 있던 중인데, 그 어음을 현금으로 바꿀 수 있는 만기일이 되기 전에 갑자기 현금이 필요해져서, 그 어음을 다른 사채업체한테 주고 액면가보다는 낮은 금액의 돈을 받는 식으로 할인을 하려고 했다 2) 그런데 사채업체는 그 어음을 발행한 어떤 회사가 부도가 날 것 같아서 즉 그 어음을 돈으로 바꿀 수 없을 것 같아서 할인을 거부했다이런 거라고 이해하면 됨?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.06 16:20", "comment_id": "reply_li_22220233", "parent_comment_id": "comment_li_22217281"}, {"writer": "ㅇㅇ", "text": "ㅇㅇ 맞음", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1WXE-YhDdfdjrC8L4P19qAc2dHBvnENmZ", "date": "10.06 16:24", "comment_id": "reply_li_22220424", "parent_comment_id": "comment_li_22217281"}, {"writer": "만갤러52(121.139) (121.139)", "text": "@ㅇㅇ 서명 기명 차이는 서명은 종이 채권에 서명하는걸 말하고, 기명은 그 채권을 발행한 쪽에서 채권장부가 있는데 거기에 채권자 정보를 기록하는걸 기명이라고 하는데, 만약 기명채권을 다른사람에게 넘기면 종이 채권에도 그 사람이 서명하고 발행한 쪽에도 알려서 장부에 그 사람을 기록해야 진정으로 채권이 넘어가고 발행한 회사나 다른 사람에게 대항할 수 있음", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.06 22:31", "comment_id": "reply_li_22237499", "parent_comment_id": "comment_li_22217281"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ 자필은 뭐임? 조용필은 앎", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1ZGY4M39LdJztqDpBIZhbpoETFKSvaUn1", "date": "10.07 10:17", "comment_id": "reply_li_22256509", "parent_comment_id": "comment_li_22217281"}, {"writer": "ㅇㅇ", "text": "나니와가 뭐였지 거의 1000여년 전의 나라현 인근 지명이었나", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1WXE-YhDdfdjrC8L4P19qAc2dHBvnENmZ", "date": "10.06 15:06", "comment_id": "comment_li_22217310", "parent_comment_id": ""}, {"writer": "글쓴 만갤러(118.47) (118.47)", "text": "오사카를 옛날엔 나니와라고 불렀습니다. 난바라고도 했구요.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.06 15:08", "comment_id": "reply_li_22217384", "parent_comment_id": "comment_li_22217310"}, {"writer": "ㅇㅇ", "text": "아무튼 나라현 인근은 맞았네", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1WXE-YhDdfdjrC8L4P19qAc2dHBvnENmZ", "date": "10.06 15:12", "comment_id": "reply_li_22217531", "parent_comment_id": "comment_li_22217310"}, {"writer": "ㅇㅇ", "text": "@글쓴 만갤 ㅋㅋ 간만에 기대된다", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.06 15:23", "comment_id": "comment_li_22217927", "parent_comment_id": ""}, {"writer": "BeanU", "text": "대부업체 면접본적있는데 사무실부터가 끔찍하더라걍", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1KniV-_CQ9K7MYwkOVgb_wmybJVBMXHI2", "date": "10.06 15:23", "comment_id": "comment_li_22217931", "parent_comment_id": ""}, {"writer": "폴렌", "text": "왜 봄", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1KniV-_CQ9K7MYwkOVgb_wmybJVBMXHI2", "date": "10.06 16:27", "comment_id": "reply_li_22220583", "parent_comment_id": "comment_li_22217931"}, {"writer": "BeanU", "text": "@폴렌 돈많이줘서...", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1KniV-_CQ9K7MYwkOVgb_wmybJVBMXHI2", "date": "10.06 16:28", "comment_id": "reply_li_22220631", "parent_comment_id": "comment_li_22217931"}, {"writer": "폴렌", "text": "@BeanU 집찾아가서 추심같은거 했나", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1KniV-_CQ9K7MYwkOVgb_wmybJVBMXHI2", "date": "10.06 16:30", "comment_id": "reply_li_22220725", "parent_comment_id": "comment_li_22217931"}, {"writer": "BeanU", "text": "@폴렌 아니 거기 안다녔음 그리고 it직으로 지원함...", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1KniV-_CQ9K7MYwkOVgb_wmybJVBMXHI2", "date": "10.06 16:30", "comment_id": "reply_li_22220773", "parent_comment_id": "comment_li_22217931"}, {"writer": "폴렌", "text": "", "is_reply": true, "dccon": "https://lh3.googleusercontent.com/d/1bGUzliHsVZ40X19U__GrAGNj9EhmhxpC", "comment_img": "https://lh3.googleusercontent.com/d/1KniV-_CQ9K7MYwkOVgb_wmybJVBMXHI2", "date": "10.06 16:32", "comment_id": "reply_li_22220857", "parent_comment_id": "comment_li_22217931"}, {"writer": "오줌기타", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1eAHXC8DalbBuVjG7WHJX3fXmgKfjN7WK", "comment_img": "https://lh3.googleusercontent.com/d/1KniV-_CQ9K7MYwkOVgb_wmybJVBMXHI2", "date": "10.06 15:25", "comment_id": "comment_li_22218010", "parent_comment_id": ""}, {"writer": "ㅇㅇ(112.186) (112.186)", "text": "막짤광인인데", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.06 15:27", "comment_id": "comment_li_22218097", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "경제학 전공한 백수로서 설명해준다. '어음 할인' 이란 어음의 액면가를 '할인'해서 현금으로 바꿔주는 걸 말한다. 예를들어 너가 거래처에서 1억 받을게 있는데 이걸 현금으로 받지 않고 '어음'으로 받았다고 해보자. 근데 문제는 돈이 당장 필요해. 그럼 어떻게 할까??? 이 어음을 '할인' 해서 사 주는 곳에 파는거다. 즉 이걸 사주는 쪽에서는 현금 융통을 해주는 셈인데, 1억짜리 어음을 할인해서 8천만원에 사준다는 건 '선이자'로 20%를 떼는 것과 마찬가지다.", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1WXE-YhDdfdjrC8L4P19qAc2dHBvnENmZ", "date": "10.06 15:32", "comment_id": "comment_li_22218250", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "그런데 '어음'이라는 건 어음을 발행한 곳의 신용도가 제일 중요하다. 따라서 어음을 할인해서 사 주는 쪽에서도 어음의 발행처가 이 돈을 제대로 갚을 수 있는지를 보는 거. 그런데 제1금융권에서는 이 신용도 심사를 굉장히 빡세게 하기 때문에 신용도가 허접한 곳에서 발행한 어음은 아무리 '할인'을 많이 하더라도 (선이자로 떼는 부분이 많아도) 어음을 받아주지 않는다. 그러니까 어음은 들고 있는데 급하게 현금이 필요한 사람들은 저렇게 사채업자한테 가서 '할인'을 많이 하더라도 어음을 현금으로 바꿔달라고 하는거.", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1WXE-YhDdfdjrC8L4P19qAc2dHBvnENmZ", "date": "10.06 15:34", "comment_id": "reply_li_22218319", "parent_comment_id": "comment_li_22218250"}, {"writer": "PQRSTAED", "text": "이런 애미가 디진 제도가", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1KniV-_CQ9K7MYwkOVgb_wmybJVBMXHI2", "date": "10.06 15:46", "comment_id": "reply_li_22218745", "parent_comment_id": "comment_li_22218250"}, {"writer": "ㅇㅇ", "text": "어음은 이자도 없이 순수하게 돌려받을 돈만 확정되어 있는거지? 그럼 이자 0%인 채권인데 할인률 큰게 당연하겠네", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1WXE-YhDdfdjrC8L4P19qAc2dHBvnENmZ", "date": "10.06 16:14", "comment_id": "reply_li_22219909", "parent_comment_id": "comment_li_22218250"}, {"writer": "ㅇㅇ(218.153) (218.153)", "text": "그러면 일종의 채권을 싸게 팔아서 급한 돈을 빌리고 나중에 원가로 갚는 건가?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.06 16:14", "comment_id": "reply_li_22219930", "parent_comment_id": "comment_li_22218250"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(218.153) 빌리는게 아니라 권리를 팔고 돈을 받은거라 어음 준쪽하고는 거래 끝난거지 뭐  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1WXE-YhDdfdjrC8L4P19qAc2dHBvnENmZ", "date": "10.06 16:20", "comment_id": "reply_li_22220246", "parent_comment_id": "comment_li_22218250"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ(218.153) 어음을 넘긴쪽은 돈을 갚을 의무가 없다. '어음'이라는 건 돈을 줘야하는 쪽이 당장 현금 지급을 하지 않고 '언제까지 얼마를 갚겠습니다'라는 증서를 대신 주는거. 실제 거래에서는 만기일까지 어음계좌에 돈을 입금해야 한다. 그래야 어음을 들고 있는 쪽이 은행에 어음을 제시하고 돈을 찾아가니까. 작중에서 인쇄소 사장은 타누키 학원에 뭔가를 납품하고 그 대가로 어음을 받았는데, 당장 현금이 필요하니까 사채업자에게 어음을 넘기고 대신 현금을 받으려고 하는거. 그렇게 되면 사채업자가 최종적으로 어음을 들고 있으니까 만기일에 사채업자가 은행에 어음을 제시하고 돈을 찾아가는거임.", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1WXE-YhDdfdjrC8L4P19qAc2dHBvnENmZ", "date": "10.06 16:24", "comment_id": "reply_li_22220414", "parent_comment_id": "comment_li_22218250"}, {"writer": "ㅇㅇ(218.153) (218.153)", "text": "@ㅇㅇ 아하 그런거구나", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.06 16:25", "comment_id": "reply_li_22220503", "parent_comment_id": "comment_li_22218250"}, {"writer": "만갤러19(119.207) (119.207)", "text": "@ㅇㅇ(218.153) ㄴㄴ 현금 받을 권리를 싼값에 판거라 나중에 갚을껀 없고 유동성 딸려서 다른 거래처나 월급줄돈 저렇게 융통하다가 돈 받을 거래처 파산해서 더이상 돈나올구멍 없어서 파산한듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.06 16:26", "comment_id": "reply_li_22220547", "parent_comment_id": "comment_li_22218250"}, {"writer": "ㅇㅇ", "text": "@ㅇㅇ 이해하기 쉽다", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1WXE-YhDdfdjrC8L4P19qAc2dHBvnENmZ", "date": "10.06 17:27", "comment_id": "reply_li_22223494", "parent_comment_id": "comment_li_22218250"}, {"writer": "마자용♂", "text": "문상받은거 만원짜리 팔천원에 팔아서 현금으로 바꾸는거랑 걍 똑같은 시스템임", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleuserconte m/d/1ZGY4M39LdJztqDpBIZhbpoETFKSvaUn1", "date": "10.07 22:00", "comment_id": "comment_li_22284351", "parent_comment_id": ""}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
