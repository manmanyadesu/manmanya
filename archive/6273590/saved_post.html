omment_img": "", "date": "09.20 08:17", "comment_id": "reply_li_21374479", "parent_comment_id": "comment_li_21368408"}, {"writer": "만갤러20(126.9) (126.9)", "text": "지 트라우마 있다고 상담하는 애들마다..마..그게 어디 쉽나?세상이 만만해? 이 지랄 하는것 같네..그리고 졸업하면 지 말이 맞는지 않맞는지 스토킹하고...", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.20 05:27", "comment_id": "comment_li_21371639", "parent_comment_id": ""}, {"writer": "ㅇㅇ(221.146) (221.146)", "text": "저 선생 새끼가 억까의 화신이라 관측당하는 순간 될 일도 안되는 법칙이 존재하는 거임. 누군가 저 새끼를 죽이고 했제의 저주를 끊어야 한다.", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.20 07:40", "comment_id": "comment_li_21373630", "parent_comment_id": ""}, {"writer": "ㅇㅇ(222.107) (222.107)", "text": "과거에 했제 실패해서 안전 배팅만 하는거였노 ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.20 07:50", "comment_id": "comment_li_21373813", "parent_comment_id": ""}, {"writer": "만갤러24(121.167) (121.167)", "text": "난 저 무릎 자세만 하고 있어도 온몸이 박살날 것 같은데저 자세를 한 채로 장기나 바둑을 두다니 이해가 안 감", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.20 11:51", "comment_id": "comment_li_21381781", "parent_comment_id": ""}, {"writer": "ㅁㅁ(175.193) (175.193)", "text": "동네 피아노 학원에서 재능있다 할 정도의 애가 국제 콩쿠르에서 막 우승하는 클래스는 대한민국 인재 정도는 되야함 .어디서 하등한 조뽄닝겐 따위는 제따이 무리데스", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.20 12:39", "comment_id": "comment_li_21383936", "parent_comment_id": ""}, {"writer": "Embrio", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1nOgJjhepETKxHwHoX6dLuwgb6ylv2eVZ", "comment_img": "https://lh3.googleusercontent.com/d/13UT2FQDwC5hOyn2EMYzMY9S02qxwQAmS", "date": "09.20 19:52", "comment_id": "comment_li_21402902", "parent_comment_id": ""}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
