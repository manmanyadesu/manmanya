mment_id": "comment_li_23124438", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.140) (221.140)", "text": "남주한테 주변인들 반응하는 게 없어서 여자만 보이는 귀신인가 싶었는데 질량 있는 거 보니까 그런 반전은 없네 식스센스를 너무봤나 봄...", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.24 22:01", "comment_id": "comment_li_23124532", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.134) (121.134)", "text": "남주 욕 한사발이네", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.24 22:04", "comment_id": "comment_li_23124645", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러29(58.239) (58.239)", "text": "그래도 그렇지 너무저능아로 만든거아녀?", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.24 22:09", "comment_id": "comment_li_23124858", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.134) (121.134)", "text": "그래도 의뢰 받을땐 가면 안쓰고 받네?", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.24 22:09", "comment_id": "comment_li_23124874", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.199) (211.199)", "text": "얼레리 꼴레리 네무는 배드콘이랑 결혼했대요", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.24 22:11", "comment_id": "comment_li_23124931", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(119.192) (119.192)", "text": "던전 스트렌딩", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.24 22:13", "comment_id": "comment_li_23125002", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(121.168) (121.168)", "text": "냄져새끼 민폐만 끼치고 도움되는게 없는데", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.24 22:31", "comment_id": "comment_li_23125744", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "작가", "text": "그니까 작가가 여캐를 통해 어떤 메세지를 전달하고 싶은거임 근데 아무리 생각해도 좋은 방법이 안 떠오르니까 남주를 병신으로 만들어서 메세지를 전달하는거임", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.24 22:32", "comment_id": "comment_li_23125768", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(218.52) (218.52)", "text": "쓰레기만화 만드는 작가의 특징을 그대로 가지고있군", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.24 22:33", "comment_id": "comment_li_23125790", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "남주가 너무 바보에 꺆꺆 대는 역할이라 걍 쭉쭉 내림.", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.24 22:48", "comment_id": "comment_li_23126272", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "억지 설정이 만적 허용이 불가능할 정도로 많고 감동적인 결말에 캐릭터들의 행동을 역순으로 짜맞춘 전형적인 만력 떨어지는 스토리라 화가나노  - dc App", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.24 22:55", "comment_id": "comment_li_23126534", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러32(121.177) (121.177)", "text": "남주 개씹저능아로 만들어놔서 좀 불쾌하네. 여자라도 저지랄하면 좀 짜증나는데.", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.24 22:55", "comment_id": "comment_li_23126547", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "남녀가 바뀌어도 개민폐년 소리 들을 거 같은데 꼬추놈이 징징대니까 진짜 못봐주겠네 ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.24 22:56", "comment_id": "comment_li_23126565", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(221.152) (221.152)", "text": "어떤 분위기를 내고 싶어하는지는 알겠다만 작가 만력이
