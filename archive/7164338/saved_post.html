": 2}, {"writer": "ㅇㅇ(116.39) (116.39)", "text": "", "is_reply": false, "dccon": "https://dcimg4.dcinside.co.kr/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658ed2c781fbcd63f318b92fc688237f30fe5956afab10455cc5843febf503654e83aa14269fb06339ce5d633a1ef0fa25888d7dfc7be60", "comment_img": "", "date": "11.20 03:58", "comment_id": "comment_li_24339733", "parent_comment_id": "", "dccon_source": "https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658ed2c781fbcd63f318b92fc688237f30fe5956afab10455cc5843febf503654e83aa14269fb06339ce5d633a1ef0fa25888d7dfc7be60", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러3(210.91) (210.91)", "text": "그림체가 좀 불안정한데 이거 괜찮나", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.20 04:10", "comment_id": "comment_li_24339975", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러3(210.91) (210.91)", "text": "현재까지 나온 정보 정리해보면1. 엑스트라 주인공이 일부러 배드 엔드를 띄운 후 \"세계의 강제력\"은 없어진듯 히로인들이 더이상 엑스트라 주인공에 대한 기억을 잊지도 않고 원래 정해져있던 주인공에게 집착하는 마음도 깔끔히 사라짐(정확힌 엑스트라 주인공에게 본래 이성보다 더 질척거리게 됨)2. 원하던 대학과 학과를 노리던대로 간 것을 보면 학교 성적만 세계의 강제력이 작동했지 수험에는 관여하지 않은 것으로 보임3. 일기장에 원래 주인공과 별개로 누군가를 증오하는 모습을 보임 아마도 매달리듯이 진주인공에게 간섭하려고 했지만 결국 실패했고 \"너희들\"에게 앙갚음할 방법을 떠올렸다고 하는데 진주인공에도 엑스트라 주인공과 마찬가지로 누군가 빙의했고 일부러 지뢰 선택지만 선택해서 주인공과 히로인을 몰살하려고 했던거같", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.20 06:01", "comment_id": "reply_li_24341625", "parent_comment_id": "comment_li_24339975", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러3(210.91) (210.91)", "text": "@만갤러3(210.91) 음 정황상 \"너희들에게 앙갚음할 방법\"은 히로인을 향한 대사는 아니므로 원래 주인공을 포함한 다수가 엑스트라 주인공과 히로인들을 몰살하려고 의도한 듯 보임 왜 그렇게 해야했는지 동기나 이유같은건 아직 알 수 없지만 뻔뻔하게 모르는척하는것으로 보아 원래의 주인공도 세계의 강제력에 간섭받았거나 진범에게 조종당했을 가능성이 있음4. 히로인들은 자신들과 엑스트라 주인공이 생존하기 위해서는 원래의 주인공 \"사노 유우토\"를 살해할 필요가 있다고 판단하였는데 어떻게 그런 결론에 이르렀는지 나온게 없으니 그것도 아직 알 수 없음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.20 06:06", "comment_id": "reply_li_24341725", "parent_comment_id": "comment_li_24339975", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@만갤러3(210.91) 내용물 바뀐거아님?지금 2회차고", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.20 09:52", "comment_id": "reply_li_24347336", "parent_comment_id": "comment_li_24339975", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "메스이키쉐프", "text": "@만갤러3(210.91) 웹연재본 보면 나오는데 히로인들은 LOD라는 미연시에서 최대 수혜를 보는게 사노인걸 보고 얘가 게임 억지력을 만들어낸 진범or연관된 새끼라고 판단해서 죽이려고 한것임", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.20 11:11", "comment_id": "reply_li_24349507", "parent_comment_id": "comment_li_24339975", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러29(220.94) (220.94)", "text": "@만갤러3(210.91) 안경척!", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.20 12:53", "comment_id": "reply_li_24353082", "parent_comment_id": "comment_li_24339975", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "'-'", "text": "하렘이 아니라 정보캐는거였네..", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.20 04:14", "comment_id": "comment_li_24340040", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러3(210.91) (210.91)", "text": "하렘 맞음 정보캐는건 과거회상", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.20 04:43", "comment_id": "reply_li_24340547", "parent_comment_id": "comment_li_24340040", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러8(125.249) (125.249)", "text": "주인공 눈 뜨기전에 자취방 간거라 위에 상황은 하렘맞음", "is_reply": true, "dccon": "", "comment_img": "", "date": "11.20 06:53", "comment_id": "reply_li_24342456", "parent_comment_id": "comment_li_24340040", "dccon_source": "", "comment_img_source": "", "comment_
