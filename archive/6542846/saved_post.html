ㅑ조아", "text": "주인공이 뭔가 감정적이지않고 무미건조해보이니까오히려 독자가 주인공을 기점으로 주변 등장인물들의 감정과 행동이 잘 보이네마치 폭풍의 눈 안에 있는 느낌이야", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/19-FzbYAmOxnsEZL-gsVvpNWvuOkJhnFf", "date": "10.07 13:11", "comment_id": "comment_li_22263164", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "ㄹㅇ 이래야지 저기서 울부짖으면서 어떻게 이런 짓을 할 수가 있냐 이래봐 싸구려 냄새 엄청 나지", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/19-FzbYAmOxnsEZL-gsVvpNWvuOkJhnFf", "date": "10.07 14:22", "comment_id": "reply_li_22265702", "parent_comment_id": "comment_li_22263164"}, {"writer": "ㅇㅇ.(121.140) (121.140)", "text": "쌍욕먹어도 계속 전화돌리는 거 보니 주인공 이새기도 싹수가 다르구나 싶네", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.07 13:13", "comment_id": "comment_li_22263210", "parent_comment_id": ""}, {"writer": "ㅇㅇ(220.124) (220.124)", "text": "부모형제한테도 절대 보증은 서주지 말라 그랬다", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.07 13:13", "comment_id": "comment_li_22263222", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "1화막판도 그렇긴한데 주인공도 독기 ㅈㄴ 강해보임 시다짓이라곤해도 대놓고 욕받이인데 낚시하듯 흘려내다가 이거다하는순간 바로 던지는거보면", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/19-FzbYAmOxnsEZL-gsVvpNWvuOkJhnFf", "date": "10.07 13:15", "comment_id": "comment_li_22263328", "parent_comment_id": ""}, {"writer": "폴렌", "text": "법타령할거면 제국금융애들도 저렇게 뻗대기랑 협박말곤 뭐 못하나? 물리적으로 피해주며 위협한다던가 이런고", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1YJtSsdh2QrVJcdQsbHoH6aFX54e6pRWH", "date": "10.07 13:24", "comment_id": "comment_li_22263642", "parent_comment_id": ""}, {"writer": "만갤러12(211.235) (211.235)", "text": "ㅇㅇ 위협하면 잡혀감 협박만해도 잡혀갈걸?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.07 13:29", "comment_id": "reply_li_22263826", "parent_comment_id": "comment_li_22263642"}, {"writer": "ㅇㅇ", "text": "거주지 확인된 기준에서 방문일지나 시간도 전부 법제화 되있음 채권자랑 보증인 이외에 접근안되고 폭언 물리적 협박은 될리가없지", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/19-FzbYAmOxnsEZL-gsVvpNWvuOkJhnFf", "date": "10.07 13:40", "comment_id": "reply_li_22264222", "parent_comment_id": "comment_li_22263642"}, {"writer": "폴렌", "text": "@ㅇㅇ 저 시절도 그랬음?", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1YJtSsdh2QrVJcdQsbHoH6aFX54e6pRWH", "date": "10.07 13:43", "comment_id": "reply_li_22264357", "parent_comment_id": "comment_li_22263642"}, {"writer": "ㅇㅇ", "text": "@폴렌 현장에서 걸리면 행위자만 범죄로 처벌되긴한데 그래도 채무는 남음 사실 한국쪽이야 불법추심 = 상환의무없음이긴한데 이것도 국가별 케바케라", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/19-FzbYAmOxnsEZL-gsVvpNWvuOkJhnFf", "date": "10.07 13:47", "comment_id": "reply_li_22264505", "parent_comment_id": "comment_li_22263642"}, {"writer": "만갤러21(112.170) (112.170)", "text": "제국금융이 야쿠자가 만든 대부업체인지는 모르겠는데 맞다면 양지에 힘들게 잘 돌아가는 업체 만들어서 돈도 합법적으로 뽑아내는 사업체를 그런짓해서 날려먹으면 아깝잖아 게다가 어디로 튈지 모르는 저신용자 인간도 아니고 회사를 상대하니깐 그렇게 겁주고 자시고 하는 것 보단 절차대로 진행해서 못갚으면 회사 부도내서 째면 되니까", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.07 16:26", "comment_id": "reply_li_22269791", "parent_comment_id": "comment_li_22263642"}, {"writer": "오줌기타", "text": "이거보고 자본주의가 무서워졋는데 이거 빨갱이전도서인가요?", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1YJtSsdh2QrVJcdQsbHoH6aFX54e6pRWH", "date": "10.07 13:24", "comment_id": "comment_li_22263648", "parent_comment_id": ""}, {"writer": "go", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1bkfuBImp8xMOPnPVPdYAMYlDskc7q-di", "comment_img": "https://lh3.googleusercontent.com/d/1YJtSsdh2QrVJcdQsbHoH6aFX54e6pRWH", "date": "10.07 13:32", "comment_id": "comment_li_22263930", "parent_comment_id": ""}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "이거 보고 나무위키 사채 항목 읽어봤는데 무섭네 1화에서 사채 쓴 이력 있으면 채용 거부라는 것도 이해 안 갔는데 기록이 다 남는구나", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.07 13:37", "comment_id": "comment_li_22264125", "parent_comment_id": ""}, {"writer": "ㅇㅇ(222.109) (222.109)", "text": "우시지마는 법이라도 상대편이었는데 폅도 사채꾼 편이라니까 ㄹㅇ 무섭다", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.07 13:41", "comment_id": "comment_li_22264245", "parent_comment_id": ""}, {"writer": "기신고래(진)", "text": "꿀잼", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1YJtSsdh2QrVJcdQsbHoH6aFX54e6pRWH", "date": "10.07 13:43", "comment_id": "comment_li_22264338", "parent_comment_id": ""}, {"writer": "쌍근프로게이머", "text": "아 존나재밌네 ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1YJtSsdh2QrVJcdQsbHoH6aFX54e6pRWH", "date": "10.07 13:43", "comment_id": "comment_li_22264344", "parent_comment_id": ""}, {"writer": "실꽃풀", "text": "주인공 표정변화없는게 진짜 싸이코패스같네", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1YJtSsdh2QrVJcdQsbHoH6aFX54e6pRWH", "date": "10.07 13:52", "comment_id": "comment_li_22264716", "parent_comment_id": ""}, {"writer": "ㅇㅇ(39.115) (39.115)", "text": "주인공 ㄹㅇ 눈에 영혼이 없노 ㅋㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.07 13:56", "comment_id": "comment_li_22264882", "parent_comment_id": ""}, {"writer": "만갤러14(121.129) (121.129)", "text": "우시지마 넘을 수 있냐?", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.07 13:59", "comment_id": "comment_li_22264976", "parent_comment_id": ""}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "우시지마가 이 작품의 아류작임", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.07 14:09", "comment_id": "reply_li_22265354", "parent_comment_id": "comment_li_22264976"}, {"writer": "ㅇㅇ", "text": "재밌다 재밌어", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/19-FzbYAmOxnsEZL-gsVvpNWvuOkJhnFf", "date": "10.07 14:03", "comment_id": "comment_li_22265152", "parent_comment_id": ""}, {"writer": "ㅇㅇ(1.242) (1.242)", "text": "나는 감정없는 사이코패스라 그런가", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.07 14:09", "comment_id": "comment_li_22265342", "parent_comment_id": ""}, {"writer": "어담", "text": "신입이 진짜 어지간하다", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1YJtSsdh2QrVJcdQsbHoH6aFX54e6pRWH", "date": "10.07 14:11", "comment_id": "comment_li_22265404", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "이거 작가 45살에 데뷔해서 성공했다던데 나도 만화가 해봐?그림 대충 그려도 스토리만 좋으면 성공하네카이지는 못 그려도 스토리에서 벽 느꼈지만 이건 나도 하겠는데", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/19-FzbYAmOxnsEZL-gsVvpNWvuOkJhnFf", "date": "10.07 14:42", "comment_id": "comment_li_22266300", "parent_comment_id": ""}, {"writer": "만갤러19(211.218) (211.218)", "text": "이게 이런장르 최초만화라서 각광받은거지 지금 살아남으려면 다른 개성이 있거나 장르를 개척해야할듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.07 15:05", "comment_id": "reply_li_22266986", "parent_comment_id": "comment_li_22266300"}, {"writer": "만갤러21(112.170) (112.170)", "text": "스토리 짜임새 있고 재미있게 쓰면 그림 별로여도 쌉가능인데 그게 어려운거지", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.07 15:46", "comment_id": "reply_li_22268389", "parent_comment_id": "comment_li_22266300"}, {"writer": "그아아아앗", "text": "시발 무섭구만", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/19-FzbYAmOxnsEZL-gsVvpNWvuOkJhnFf", "date": "10.07 14:48", "comment_id": "comment_li_22266471", "parent_comment_id": ""}, {"writer": "만갤러19(211.218) (211.218)", "text": "현대는 저딴 폐단 다겪어보고 방어장치가 많이생겼지만 저 시대는 짐승의 시대네 답도없노", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.07 14:50", "comment_id": "comment_li_22266558", "parent_comment_id": ""}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "일본도 보면 볼 수록 ㄹㅇ 살기 좆같은 나라네일본 빠는놈들한테 ㄹㅇ 궁금한게일본이 진짜로 우월하다고 생각해서 빠는거임?아니면 동남아 혼혈처럼 한국에서 차별받고 자라서 반발심리로 빠는거임?", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.07 15:03", "comment_id": "comment_li_22266933", "parent_comment_id": ""}, {"writer": "ㅇㅇ(220.80) (220.80)", "text": "너한테 이 밑으로 어떤놈이 어떤 댓글을 달던 이것만 기억해라그 댓글 다는 놈의 실제 와꾸와 현실 스펙. 학력, 직업, 재산이 어떤 놈들인지 생각해보면 어느쪽인지 금방 답이 나올것", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.07 15:09", "comment_id": "reply_li_22267131", "parent_comment_id": "comment_li_22266933"}, {"writer": "dd", "text": "능력되면 살만함 어설프게 블랙가면 당연히 죽는거고 그보다 이건 사업체이야기라 우리같은 만붕이가 사업체 만들일도 없는데 어렵다 어쩌다 하면 좀....?", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/19-FzbYAmOxnsEZL-gsVvpNWvuOkJhnFf", "date": "10.07 16:07", "comment_id": "reply_li_22269148", "parent_comment_id": "comment_li_22266933"}, {"writer": "만갤러28(175.121) (175.121)", "text": "imf시절에도 저런 일화 수두룩했는데 한국은 뭐 안그런줄 아냐 븅신 ㅋㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.07 18:27", "comment_id": "reply_li_22274722", "parent_comment_id": "comment_li_22266933"}, {"writer": "만갤러37(211.184) (211.184)", "text": "너도 한국에서 살기좋고 멀쩡한 부모 만나서 그렇지 한국은 imf때 저런사람들 넘쳤음 2000년대 초반에도 마찬가지였고 자영업 하다보면 주변에서 돈 안주고 야반도주 하는 경우도 보게된다 -", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.08 02:15", "comment_id": "reply_li_22298666", "parent_comment_id": "comment_li_22266933"}, {"writer": "ㅇㅇ(175.204) (175.204)", "text": "연장아빠 얼굴상이 주로 사이코패스인듯", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.07 15:03", "comment_id": "comment_li_22266935", "parent_comment_id": ""}, {"writer": "ㅇㅇ(58.78) (58.78)", "text": "와 빡세네 갚을 돈 전부 준비해놨는데 전부 갚아라 하고 부도내는거오히려 저정도면 살려두고 계속 갚게 하는게 이득아닝가?", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.07 15:35", "comment_id": "comment_li_22268028", "parent_comment_id": ""}, {"writer": "ㅇㅇ(220.94) (220.94)", "text": "1화 주인공회사에서도 나오잖아 한번 현금흐름 막히기 시작하면 그냥 망하는거", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.07 15:42", "comment_id": "reply_li_22268277", "parent_comment_id": "comment_li_22268028"}, {"writer": "ㅇㅇ(220.94) (220.94)", "text": "월급쟁이면 월급이라도 안정적으로 나오니 전부 갚을때까지 기다리지회사는 언제 다시 살아날지도 모르고", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.07 15:45", "comment_id": "reply_li_22268346", "parent_comment_id": "comment_li_22268028"}, {"writer": "만갤러21(112.170) (112.170)", "text": "회사가 부도난 이후면 돈받기가 어려우니까 그런거임 부도나면 채권자들 다 모여서 회사 처분하고 채권자가 가진 채권액이 얼마던간에 채권액 내에서 다 동일한 금액 분배받는데 그럼 받을 돈이 적어지니까", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.07 16:20", "comment_id": "reply_li_22269598", "parent_comment_id": "comment_li_22268028"}, {"writer": "반갈죽", "text": "저 사장만 지금 자기 상황을 모르는거임 1번 부도 났으면 회사 신용도 박살난거라 어차피 망하게 돼있음 그러니 쟤들도 이악물고 받아가려는거", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/19-FzbYAmOxnsEZL-gsVvpNWvuOkJhnFf", "date": "10.07 17:17", "comment_id": "reply_li_22271762", "parent_comment_id": "comment_li_22268028"}, {"writer": "만갤러24(59.9) (59.9)", "text": "이번에 회삿돈으로 못갚아서 본인 돈은 커녕 딸 시댁가서 빌려온 판에 4월 5월 갚으리라는 보장은 어딨음 계속 갚게 두는 이익 먹으려다 원금회수 못하는거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.07 17:17", "comment_id": "reply_li_22271790", "parent_comment_id": "comment_li_22268028"}, {"writer": "복식부기", "text": "은행이나 평범한 채권단이면 그런 판단도 할 수 있는데 저기 나오는 새끼들은 다 회사 어렵다고 사채업자한테 돈 빌리는 저능아라는 걸 생각해야됨미래를 위해 투자하는 것도 정상적인 회사에나 하는 거지 사채업자한테 돈 빌리는 놈이 부도를 냈는데 어떻게 넘어가 줌", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1l9GQo4NWMOghBEU88L4xNjoXFLUa9kYp", "date": "10.08 01:46", "comment_id": "reply_li_22297302", "parent_comment_id": "comment_li_22268028"}, {"writer": "ㅇㅇ", "text": "몰입감 개쩌네ㅋㅋ 우시지마 가짜새끼ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/19-FzbYAmOxnsEZL-gsVvpNWvuOkJhnFf", "date": "10.07 15:42", "comment_id": "comment_li_22268262", "parent_comment_id": ""}, {"writer": "ㅇㅇ(118.235) (118.235)", "text": "기한이익상실 어디서 봤나 했더니 이번 중앙일보 파산건이었구나", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.07 15:51", "comment_id": "comment_li_22268580", "parent_comment_id": ""}, {"writer": "ㅇㅇ(182.227) (182.227)", "text": "왜 연장애비 사채업자가 생각나는 거지?", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.07 16:05", "comment_id": "comment_li_22269059", "parent_comm "parent_comment_id": ""}, {"writer": "글임판글임", "text": "아닛,,,사체업쨔덜,,,쎙깍뿌다,,,건씰하걔,,,일하잔앗,,,?!", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1l9GQo4NWMOghBEU88L4xNjoXFLUa9kYp", "date": "10.08 00:34", "comment_id": "reply_li_22292937", "parent_comment_id": "comment_li_22292879"}, {"writer": "평민", "text": "뭔가 일하는게 보이스피싱같네 ㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1UP_cj4ZoToEch8GC5p0tVkGWfEsR26FL", "date": "10.08 01:58", "comment_id": "comment_li_22297927", "parent_comment_id": ""}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
