}, {"writer": "ㅇㅇ(121.184) (121.184)", "text": "이렇게 무능한 모습 처음이군", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 21:28", "comment_id": "reply_li_23305771", "parent_comment_id": "comment_li_23305611", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(61.79) (61.79)", "text": "은신달인인거 아님?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 21:34", "comment_id": "reply_li_23306003", "parent_comment_id": "comment_li_23305611", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그냥 있는데 눈치 못챘으면 설붕이지만 당장 최상위급 달인 처럼 보이는 마망이랑 대치중이잖아. 상대도 은신쪽은 상위일테고", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 21:39", "comment_id": "reply_li_23306180", "parent_comment_id": "comment_li_23305611", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "서양불곰입문", "text": "뭐 사카키도 달인 상대로 켄이치 미우 놓치고 그랬는데 뭐", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 21:40", "comment_id": "reply_li_23306221", "parent_comment_id": "comment_li_23305611", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(211.234) (211.234)", "text": "상대인 닌자마망도 달인이고 묘수 켄이치 순식간에 낚아챈 거 보면 데려간 놈도 달인급 같은데 이러면 설붕은 아님", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 21:44", "comment_id": "reply_li_23306337", "parent_comment_id": "comment_li_23305611", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러18(106.101) (106.101)", "text": "무적초인도 소태도 달인을 놓친 전적이 있음... 첩보계 특화 달인이라면 일반 달인은 감지하기 빡세겠지...", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 21:50", "comment_id": "reply_li_23306518", "parent_comment_id": "comment_li_23305611", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러19(118.41) (118.41)", "text": "담에 뭐 보여줄듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 21:53", "comment_ 데 주인공은 이 만화 거의 끝나갈때 즈음이나 달인 되겠지. 그 동안 계속 저렇게 신변위협이나 받으며 사는 묘수신세일텐데 그런 노잼구간을 저런 젖보똥 하나로 때우며 버틸건가?", "is_reply": false, "dccon": "", "comment_img": "", "date": "10.28 21:32", "comment_id": "comment_li_23305946", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "한 1000화만 정도만 질질 끌자", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 21:39", "comment_id": "reply_li_23306188", "parent_comment_id": "comment_li_23305946", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "그야 주인공급한텐 묘수급의 싸울애들이 계속 나오는거 안 보이냐.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 21:40", "comment_id": "reply_li_23306203", "parent_comment_id": "comment_li_23305946", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(114.206) (114.206)", "text": "애초에 이 만화는 달인이 묘수 제자 건드는게 개치졸하단 설정이잖음", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 21:55", "comment_id": "reply_li_23306733", "parent_comment_id": "comment_li_23305946", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러10(14.42) (14.42)", "text": "1부도 안 본 알못주제에! 이 만화는 오래 연재하면 오래 연재할수록 좋은 작품이라고!", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 22:04", "comment_id": "reply_li_23307133", "parent_comment_id": "comment_li_23305946", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ", "text": "@만갤러10(14.42) 그래서 그...얼마나 연재했습니까?", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 22:25", "comment_id": "reply_li_23308015", "parent_comment_id": "comment_li_23305946", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러10(14.42) (14.42)", "text": "@ㅇㅇ 전작이 61권짜리고, 12년 동안 연재했었음. 그리고 올해 2부로 복귀하심.", "is_reply": true, "dccon": "", "comment_img": "", "date": "10.28 22:29", "comment_id": "repl
