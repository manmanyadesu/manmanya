": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1jHDnk3PEEsn6v6iH49EQMZ5jBkks1k75", "date": "08.03 02:00", "comment_id": "comment_li_18951844", "parent_comment_id": ""}, {"writer": "좌위오낭", "text": "그냥 수복은 안되니까 일단 죽이고 시체 만들어야 하는건데 소생사기보다 이게 저 문제인거같은데 ㄷㄷ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1jHDnk3PEEsn6v6iH49EQMZ5jBkks1k75", "date": "08.03 02:02", "comment_id": "reply_li_18951910", "parent_comment_id": "comment_li_18951844"}, {"writer": "ㅇㅇ", "text": "@좌위오낭 ㄹㅇ 살아있는 사람 죽이고 사기친건데 대수롭지 않게 넘어가는게 ㅋㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1B062u3GbhTcr8p3Amo90rMX5A8x5iEq-", "date": "08.03 02:30", "comment_id": "reply_li_18952617", "parent_comment_id": "comment_li_18951844"}, {"writer": "비골로", "text": "인간인데 반경 5m 내에서 사람이 있어야 전두엽을 쓰는 인간인건가되게 미묘하네", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1ecc5SJdrAReQ6smXDInXc5puxqtoqzHT", "date": "08.03 02:00", "comment_id": "comment_li_18951848", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "진짜 살아난건 아니지만 뇌에 남은 코드를 기반으로 생각하는거면 솔직한 대화였다는건 맞네 ㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1B062u3GbhTcr8p3Amo90rMX5A8x5iEq-", "date": "08.03 02:01", "comment_id": "comment_li_18951866", "parent_comment_id": ""}, {"writer": "좌위오낭", "text": "24시간 그냥 누가 붙어있으면되는거아님?", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1jHDnk3PEEsn6v6iH49EQMZ5jBkks1k75", "date": "08.03 02:01", "comment_id": "comment_li_18951878", "parent_comment_id": ""}, {"writer": "alembic", "text": "약간 철학적 좀비 같은 느낌  - dc App", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1jHDnk3PEEsn6v6iH49EQMZ5jBkks1k75", "date": "08.03 02:01", "comment_id": "comment_li_18951886", "parent_comment_id": ""}, {"writer": "alembic", "text": "원래 사람이랑 똑같이 말하고 행동하면 그건 그 사람이 맞나  - dc App", "is_reply": true, "dccon": "", "com 2:26", "comment_id": "reply_li_18952514", "parent_comment_id": "comment_li_18952008"}, {"writer": "John_Smith", "text": "교주 능력은 진짜 악마같네죽은 사람을 사랑하면 사랑할 수록 교주의 명령에 거역을 못 하는게 진심 답도 없이 악마스러움", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1jHDnk3PEEsn6v6iH49EQMZ5jBkks1k75", "date": "08.03 02:08", "comment_id": "comment_li_18952079", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "재밌어요", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1B062u3GbhTcr8p3Amo90rMX5A8x5iEq-", "date": "08.03 02:09", "comment_id": "comment_li_18952096", "parent_comment_id": ""}, {"writer": "이십오", "text": "전생을 했으니 영혼이라는 개념이 있는건데 이걸 살아있다고 볼수 있는건지 좀 애매하긴하다", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1jHDnk3PEEsn6v6iH49EQMZ5jBkks1k75", "date": "08.03 02:11", "comment_id": "comment_li_18952183", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "감정있으면 영혼있나없나 똑같은거 아닐ㅋ바  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1B062u3GbhTcr8p3Amo90rMX5A8x5iEq-", "date": "08.03 02:26", "comment_id": "reply_li_18952523", "parent_comment_id": "comment_li_18952183"}, {"writer": "ㅇㅇ", "text": "영혼은 진작 빠져나갔고 프롬프트 받는대로 뇌 데이터 출력하는 텍스트생성기 같은 느낌인가", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1B062u3GbhTcr8p3Amo90rMX5A8x5iEq-", "date": "08.03 02:27", "comment_id": "reply_li_18952535", "parent_comment_id": "comment_li_18952183"}, {"writer": "Kcaj21", "text": "@ㅇㅇ 그 프롬프트가 LLM이 프롬프트 길어시면 오류나는 것처럼 반응 안하고 계속 오류 없이 누적되면 단순 생성기라 볼 수는 없지 않나?  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1jHDnk3PEEsn6v6iH49EQMZ5jBkks1k75", "date": "08.03 02:36", "comment_id": "reply_li_18952780", "parent_comment_id": "comment_li_18952183"}, {"writer": "Kcaj21", "text": "전생했어도 이미 신체에 영향 ㅈㄴ 받는건 마족녀가 남자 사랑하는거에서부터 알 수 있는데 이건 영혼이 존재한다기 보다 기억을 이식받는거에 더 가깝지 않을까?  - dc App", "is_reply": true, "dccon": "", 3.39)", "text": "섹스나 임신은 가능하다는 말이잖아? 그냥 애낳게하고 4P, 보모용으로 데리고 살면 되지 않나?", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.03 02:31", "comment_id": "comment_li_18952626", "parent_comment_id": ""}, {"writer": "만갤러12(223.39) (223.39)", "text": "둘이 있어야한다는 리스크도 낳은 애들 돌보게하면 끝이잖아", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.03 02:31", "comment_id": "reply_li_18952646", "parent_comment_id": "comment_li_18952626"}, {"writer": "LoLHistory", "text": "참신하긴 한데 좀 어거지네 쟤내 폭사했을땐 챗봇개념 없었잖아", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1jHDnk3PEEsn6v6iH49EQMZ5jBkks1k75", "date": "08.03 02:31", "comment_id": "comment_li_18952630", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "교주도 조만간 죽을거 같네", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1B062u3GbhTcr8p3Amo90rMX5A8x5iEq-", "date": "08.03 02:33", "comment_id": "comment_li_18952677", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "황제 시체 잘 처리했을라나? 아무리봐도 수녀가 모든 전이자 다 먹고 흑화해서 마왕될 거 같은 느낌나는데ㅋㅋ테러리스트는 부여하는 능력 관련해서 뭔가 강해진 거 같고, 다른 전이자 중에 사기 능력 더 있을라나", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1B062u3GbhTcr8p3Amo90rMX5A8x5iEq-", "date": "08.03 02:36", "comment_id": "comment_li_18952769", "parent_comment_id": ""}, {"writer": "도그풋", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1XoPHNZjctRCZh9ba-16SYxasF0iPheGD", "comment_img": "https://lh3.googleusercontent.com/d/1jHDnk3PEEsn6v6iH49EQMZ5jBkks1k75", "date": "08.03 02:36", "comment_id": "comment_li_18952772", "parent_comment_id": ""}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
