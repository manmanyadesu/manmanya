08.03 02:14", "comment_id": "reply_li_18952289", "parent_comment_id": "comment_li_18951095"}, {"writer": "ㅇㅇ(59.0) (59.0)", "text": "@ㅁㄴㅇㄹ(118.235) 황제는 ㄹㅇ 지금 리타이어 안시키고 걸레년 부하로 배신때리고 다른 세력으로 남는다던가 이런전개 갔으면 나중에 치우기 힘듬", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.03 02:24", "comment_id": "reply_li_18952467", "parent_comment_id": "comment_li_18951095"}, {"writer": "ㅇㅇ(61.82) (61.82)", "text": "@ㅇㅇ(59.0) 그런 것 치고는 캐릭터가 너무 매력적이라 너무 얼렁뚱땅 치운 기분이야", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.03 02:27", "comment_id": "reply_li_18952539", "parent_comment_id": "comment_li_18951095"}, {"writer": "ㅇㅇ(183.102) (183.102)", "text": "@ㅇㅇ(61.82) 도니는 그 때 아니었으면 죽일 기회가 없었고 다른 만화 같으면 오히려 질질 끈다고 욕이나 먹었을 텐데 이런 말 나오는 거 보면 어지간히도 매력적으로 뽑힌듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.03 03:07", "comment_id": "reply_li_18953424", "parent_comment_id": "comment_li_18951095"}, {"writer": "ㅇㅇ(61.82) (61.82)", "text": "@ㅇㅇ(183.102) 솔직히 너무 급하차야", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.03 03:09", "comment_id": "reply_li_18953473", "parent_comment_id": "comment_li_18951095"}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "근데 미샤가 죽은 마을사람들 중 가장 소중한 거지 마을 몰살당한 원한은 남아있고, 죽어서 다신 못 볼 사람하고 이렇게라도 다시 함께 살 수 있으니 교주는 넘어간다 이거지 애초에 살해 당하지 않았으면 이런 식의 불완전 소생이 아니라 멀쩡히 잘 살았을 거란 점에서 족쳐야 할 감정은 바뀌지 않을 듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.03 03:30", "comment_id": "reply_li_18953992", "parent_comment_id": "comment_li_18951095"}, {"writer": "만갤러43(121.184) (121.184)", "text": "전생에도 건스미스 때문데 뒤졌는데 아내 하나 ai로 살렸다고 소멸은 안할듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.03 17:12", "comment_id": "reply_li_18973026", "parent_comment_id": "comment_li_18951095"}, {"writer": "Dazzle", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/12pKGEbHpE36g66QCSX9YcIJUTzaCNzkh", "comment_img": "https://lh3.googleusercontent.com/d/1jHDnk3PEEsn6v6iH49EQMZ5jBkks1k75", "date": "08.03 01:43", "comment_i 8952314", "parent_comment_id": "comment_li_18952257"}, {"writer": "ㅇㅇ(14.47) (14.47)", "text": "@만갤러5(220.90) 인풋 0면 아웃풋이 없는건 알겠음.  근데 여기서 모순인게 5미터 근방에 인간이 없어도 온도나 바람 빛도 인풋인데 여기는 반응을 못한다는거임 ㅋㅋ", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.03 02:20", "comment_id": "reply_li_18952393", "parent_comment_id": "comment_li_18952257"}, {"writer": "ㅇㅇ(14.47) (14.47)", "text": "@만갤러5(220.90) 따라서 불완전 소생이라기보다 제약이 걸린 소생이라고 본다", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.03 02:21", "comment_id": "reply_li_18952402", "parent_comment_id": "comment_li_18952257"}, {"writer": "만갤러4(39.124) (39.124)", "text": "@ㅇㅇ(14.47) 애초에 교주 자체도 인간에 대해 이해할 생각도 자세히 생각도 안 해본 놈이었잖아 능력도 그만큼 나사 빠졌다고해도 문제는 없어보임", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.03 02:28", "comment_id": "reply_li_18952559", "parent_comment_id": "comment_li_18952257"}, {"writer": "Kcaj21", "text": "근데 그럼 인풋을 잘 때까지 전생처럼 행동해로 넣으면 되는거 아님? 그리고 일어나자마자 계속 그대로 인풋 넣어주고  - dc App", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1jHDnk3PEEsn6v6iH49EQMZ5jBkks1k75", "date": "08.03 02:39", "comment_id": "reply_li_18952843", "parent_comment_id": "comment_li_18952257"}, {"writer": "만갤러13(221.138) (221.138)", "text": "@Kcaj21 Ai처럼 주변 인간이 말걸면 사람처럼 행동한다는거지 진짜 ai라서 뭐 프롬프트를 넣고 할수있는게 아니잖아", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.03 02:59", "comment_id": "reply_li_18953304", "parent_comment_id": "comment_li_18952257"}, {"writer": "ㅇㅇ", "text": "내가 이해한거로는 부팅되어 있는 컴퓨터처럼, 사람이 조작 안해도 기본적인 내부 구동연산은 이뤄지고", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/11HMaDRWzlGRCJOzejwAnIjzwNNPCcpH4", "date": "08.03 04:04", "comment_id": "reply_li_18954725", "parent_comment_id": "comment_li_18952257"}, {"writer": "ㅇㅇ", "text": "사람이 미리 입력해놓고 실행시킨 프로그램은 정상적으로 돌아가는데,컴퓨터가 자율적으로 검색을 하거나 자율적으로 프로그램을 키거나 하진 못하는 상태로 이해함대신에 사람 5미터 내에 있으면 강인공지능처럼 사고할수있는거고.", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent ""}, {"writer": "만갤러39(112.121) (112.121)", "text": "생전 데이터 다 넣은 챗봇 상태라서 부활로 보긴 애매함. 입력 없으면 휴면 모드였다가 주변에 사람있으면(채팅시작하면) 봇돌아가는 상태라서 부활이라기보단 메아리나 잔재적 존재임. 가족처럼 가까운 존재가 주체성이 사라져서 뭐든 수동적으로 행동하면 점점 불만이 쌓일수 밖에 없지 거기다 결손치료가 시체부활이었는데 치료받고 이상해진거 어떻게 커버친거냐 ㅋㅋㅋ", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.03 15:10", "comment_id": "comment_li_18969676", "parent_comment_id": ""}, {"writer": "ㅁㄴㅇㄹ(118.235) (118.235)", "text": "저 시대면 다리 잘렸으면 인생 끝난건데 저렇게라도 작동하면 감사하다 할득", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.03 16:03", "comment_id": "reply_li_18971060", "parent_comment_id": "comment_li_18969676"}, {"writer": "【파유자재불】", "text": "“‘원컨대 일체중생이 모든 공덕의 소리로 장엄한 상호를 얻어 그 음성이 청정하여 듣는 이가 기뻐하여 지이다.’하느니라.‘원컨대 일체중생이 사랑스러운 모든 부처님 말씀의 장엄한 모양을 얻어 중생들로 하여금 법을 듣고 환희하며 청정한 행을 닦게 하여 지이다.’하느니라.‘원컨대 일체중생이 마음으로 장엄하는 모양을 얻고 깊은 선정에 들어가 여러 부처님을 보아지이다.’하느니라.”", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/16pEw_LJa9rLF3HIOfytljOrVHNL5AoFb", "date": "08.03 15:17", "comment_id": "comment_li_18969843", "parent_comment_id": ""}, {"writer": "ㅁㅁ(168.126) (168.126)", "text": "엘프 시벌련 레거시 몇개를 꽁쳐놨노 레거시 만드는 능력자 죽일때 자기쓸거만 잔뜩 만들게 하고 죽인거 아님?", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.03 15:17", "comment_id": "comment_li_18969844", "parent_comment_id": ""}, {"writer": "ㅁㄴㅇㄹ(118.235) (118.235)", "text": "지금 물약 쓰는 전생자 빼고는 전생자 다 나온건가?", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.03 16:02", "comment_id": "comment_li_18971029", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "교주 아군화됐네 완전", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/11HMaDRWzlGRCJOzejwAnIjzwNNPCcpH4", "date": "08.03 16:37", "comment_id": "comment_li_18972097", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "교주 페도인거 말고 원래 죄목이 뭐였지", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/11HMaDRWzlGRCJOzejwAnIjzwNNPCcpH4", "date": "08.03 16:37", "comment_id": "comment ": "08.03 03:21", "comment_id": "comment_li_18953760", "parent_comment_id": ""}, {"writer": "ㅇㅇ(219.240) (219.240)", "text": "그냥 멍때리기를 좀 자주 하는 인간처럼 보이네", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.03 03:24", "comment_id": "comment_li_18953813", "parent_comment_id": ""}, {"writer": "ㅁㄴㅇㄹ(118.235) (118.235)", "text": "현실에도 있을 듯", "is_reply": true, "dccon": "", "comment_img": "", "date": "08.03 16:06", "comment_id": "reply_li_18971190", "parent_comment_id": "comment_li_18953813"}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "도니 에피 때는 과거사 서사가 고점 찍고, 이번은 이능력 설정으로 짜는 서사가 고점인 듯, 특히 차라리 죽었다 살아나는 게 치유 받는 것보다 훨씬 낫다는 아이러니도 좋은 것 같음", "is_reply": false, "dccon": "", "comment_img": "", "date": "08.03 03:26", "comment_id": "comment_li_18953909", "parent_comment_id": ""}, {"writer": "만갤러54(106.101) (106.101)", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1QXAWagIYAbwVSsMfLmRfrEkk7U-MeCN-", "comment_img": "", "date": "08.04 14:37", "comment_id": "comment_li_19014282", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1gQWyAcnMQx-ZRwD7W2P5fQXkMcah9N_I", "comment_img": "https://lh3.googleusercontent.com/d/1HfJ0GpRScVeZhOW8kJvP667Bgwt6u_6h", "date": "08.04 22:19", "comment_id": "comment_li_19034405", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "클레임 0%가 이해가긴 하네..내가 안볼때는 인형처럼 있는다는 사실은 말그대로 내가 직접 볼 수가 없으니 사실상 그냥 죽기전이랑 똑같은 사람인거처럼 느껴진다는거 아녀가슴속에 남아있는 찝찝함은 뭐 소중한 사람이 살아돌아온걸로 덮으면 되는거고", "is_reply": false, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/1HfJ0GpRScVeZhOW8kJvP667Bgwt6u_6h", "date": "08.05 02:11", "comment_id": "comment_li_19046008", "parent_comment_id": ""}]; let currentSort = 'old', commentsPerPage = 50, currentPage = 1, commentGroups = [], currentGroup = null, parentGroupsById = new Map(), pendingRepliesByParent = new Map(); rawComments.forEach(c => { if (!c.is_reply) { currentGroup = { parent: c, replies: [] }; commentGroups.push(currentGroup); const commentId = String(c.comment_id || '').trim(); if (commentId) { parentGroupsById.set(commentId, currentGroup); const pendingReplies = pendingRepliesByParent.get(commentId); if (pendingReplies) { currentGroup.replies.push(...pendingReplies); pendingRepliesByParent.delete(commentId); } } } else { const parentId = String(c.parent_comment_id || '').trim(); if (parentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
