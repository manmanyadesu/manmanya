"dccon": "", "comment_img": "", "date": "09.01 00:39", "comment_id": "reply_li_20418689", "parent_comment_id": "comment_li_20417064"}, {"writer": "ㅇㅇ(14.37) (14.37)", "text": "원래 컨셉부터가 바이크 타고 다니는 날라리였음. 후도 아키라와 비슷하게.코우지가 이지적으로 철드는건 기계수랑 한창 싸우고 온갖 풍파 다 겪으면서 성숙해진거임", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.01 01:40", "comment_id": "reply_li_20420865", "parent_comment_id": "comment_li_20417064"}, {"writer": "ㅇㅇ(14.39) (14.39)", "text": "웰케 코우지가 아니라 료마같이 생겼노", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.01 01:42", "comment_id": "reply_li_20420917", "parent_comment_id": "comment_li_20417064"}, {"writer": "만갤러10(114.201) (114.201)", "text": "@ㅇㅇ(14.37) 후도 아키라는 원래 상냥한 성격 아님?", "is_reply": true, "dccon": "", "comment_img": "", "date": "09.01 02:33", "comment_id": "reply_li_20422630", "parent_comment_id": "comment_li_20417064"}, {"writer": "프라탑", "text": "@ㅇㅇ(14.39) 이시가와 켄이 옆에서 돕고 있는 거 안보여? 그쪽 영향이지.", "is_reply": true, "dccon": "", "comment_img": "https://lh3.googleusercontent.com/d/18cBxbmtEf8Xji6o049YS8WuaYlimkzxX", "date": "09.01 23:52", "comment_id": "reply_li_20464898", "parent_comment_id": "comment_li_20417064"}, {"writer": "ㅇㅇ", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1fuRwnvcLO3KWIyCZishlOlB38vSR5JnC", "comment_img": "https://lh3.googleusercontent.com/d/1K8gOUddx8HYBDqJXMuOWo1q5enYcpUZN", "date": "09.01 00:28", "comment_id": "comment_li_20418242", "parent_comment_id": ""}, {"writer": "ㅇㅇ", "text": "", "is_reply": false, "dccon": "https://lh3.googleusercontent.com/d/1RbwZNzKecSXJMHqKNWa_UH5l_uRSYw20", "comment_img": "https://lh3.googleusercontent.com/d/1K8gOUddx8HYBDqJXMuOWo1q5enYcpUZN", "date": "09.01 00:29", "comment_id": "comment_li_20418272", "parent_comment_id": ""}, {"writer": "ㅇㅇ(58.78) (58.78)", "text": "마징가Z 연재 전에 이미 태권V는 실사화 촬영까지 끝났다는 이야기가 있다.결국 내부 사정으로 세상에 공개되지는 못하였으니 판단은 알아서", "is_reply": false, "dccon": "", "comment_img": "", "date": "09.01 00:35", "comment_id": "comment_li_20418 arentId) { const parentGroup = parentGroupsById.get(parentId); if (parentGroup) parentGroup.replies.push(c); else { if (!pendingRepliesByParent.has(parentId)) pendingRepliesByParent.set(parentId, []); pendingRepliesByParent.get(parentId).push(c); } } else if (currentGroup) currentGroup.replies.push(c); else { currentGroup = { parent: null, replies: [c] }; commentGroups.push(currentGroup); } } }); pendingRepliesByParent.forEach(replies => commentGroups.push({ parent: null, replies })); function buildWriterHTML(writerStr) { let match = writerStr.match(/(.+)\s(\([0-9.]+\))$/); return match ? `${match[1]} <span class="ip">${match[2]}</span>` : writerStr; } function buildContentHTML(c) { if (c.text.includes("삭제된 댓글")) return `<span class="deleted-text">${c.text}</span>`; let html = c.text.replace(/\n/g, "<br>"); if (c.dccon) html += `<br><img src="${c.dccon}" style="width:85px; height:85px; margin-top:5px;">`; if (c.comment_img) html += `<br><img src="${c.comment_img}" style="margin-top:5px; max-width:200px; border-radius:4px;">`; return html; } function renderComments() { const listArea = document.getElementById('comment-list'); const pageArea = document.getElementById('pagination-buttons'); listArea.innerHTML = ''; pageArea.innerHTML = ''; document.getElementById('total-count').innerText = rawComments.filter(c => !c.text.includes("삭제된 댓글")).length; if (rawComments.length === 0) return; let sortedGroups = [...commentGroups]; if (currentSort === 'new') sortedGroups.reverse(); else if (currentSort === 'reply') sortedGroups.sort((a, b) => b.replies.length - a.replies.length); const totalPages = Math.ceil(sortedGroups.length / commentsPerPage); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1; const startIndex = (currentPage - 1) * commentsPerPage; const pageGroups = sortedGroups.slice(startIndex, startIndex + commentsPerPage); pageGroups.forEach(g => { if (g.parent) { const pDiv = document.createElement('div'); pDiv.className = 'comment-row'; if (g.parent.text.includes("삭제된 댓글")) pDiv.innerHTML = `<div class="comment-writer-box"></div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box"></div>`; else pDiv.innerHTML = `<div class="comment-writer-box">${buildWriterHTML(g.parent.writer)}</div><div class="comment-content-box">${buildContentHTML(g.parent)}</div><div class="comment-date-box">${g.parent.date}</div>`; listArea.appendChild(pDiv); } g.replies.forEach(r => { const rDiv = document.createElement('div'); rDiv.className = 'comment-row reply-row'; if (r.text.includes("삭제된 댓글")) rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span></div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box"></div>`; else rDiv.innerHTML = `<div class="comment-writer-box"><span class="reply-icon">ㄴ</span>${buildWriterHTML(r.writer)}</div><div class="comment-content-box">${buildContentHTML(r)}</div><div class="comment-date-box">${r.date}</div>`; listArea.appendChild(rDiv); }); }); if (totalPages > 1) { for (let i = 1; i <= totalPages; i++) { const btn = document.createElement('button'); btn.className = 'page-btn'; if (i === currentPage) btn.classList.add('active'); btn.innerText = i; btn.onclick = () => { currentPage = i; renderComments(); window.scrollTo(0, document.getElementById('comment-section').offsetTop - 20); }; pageArea.appendChild(btn); } } } function changeSort(type) { currentSort = type; document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('sort-' + type).classList.add('active'); currentPage = 1; renderComments(); } function changeLimit(val) { commentsPerPage = parseInt(val); currentPage = 1; renderComments(); } document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); }); }); renderComments();</script></body></html>
