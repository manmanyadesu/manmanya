t": "철학이 느껴지네요", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.09 10:06", "comment_id": "comment_li_23810599", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "피그마빌런", "text": "오사마쿤 지옥에서 이런거나 배우고 있어ㅛ노….", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.09 10:06", "comment_id": "comment_li_23810604", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "만갤러23(1.246) (1.246)", "text": "여동생 인격적으로 사라진거 인지해도 일남충은 심기가 걸레여도 몸만 있으면 된다는거네", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.09 10:08", "comment_id": "comment_li_23810687", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "하수은", "text": "남주정신병있는거임? 여동생 없어졌는데 아무렇지도 않은가", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.09 10:09", "comment_id": "comment_li_23810718", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "여동생이랑 몸 체인지 해가면서 살려나", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.09 10:10", "comment_id": "comment_li_23810723", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(106.101) (106.101)", "text": "만화들이 왤케 다 저능해지는거같지 시작부터 바지에 똥싸는 남주에 시작부터 오줌싸는 여주... 이게뭐죠", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.09 10:12", "comment_id": "comment_li_23810767", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(1.243) (1.243)", "text": "여동생 죽었냐고", "is_reply": false, "dccon": "", "comment_img": "", "date": "11.09 10:14", "comment_id": "comment_li_23810801", "parent_comment_id": "", "dccon_source": "", "comment_img_source": "", "comment_media_version": 2}, {"writer": "ㅇㅇ(122.128) (122.128)", "text": "이런 만화는 작가가 그냥 여자가 실금하는걸 그리고
